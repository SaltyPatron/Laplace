name: Qualify UCI publication assembly regression
on:
  push:
    branches: [qualify/native-admission-footprint-20260916]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact source in the ordinary Actions workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a754665d33952a60e5aeecaee0e542d1d3824671
          persist-credentials: false
      - name: Run UCI assembly and persisted policy controls
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          export TMPDIR=/build/laplace/work/policy-regressions/tmp
          export TMP="$TMPDIR" TEMP="$TMPDIR"
          mkdir -p "$TMPDIR" /build/laplace/work/policy-regressions/evidence
          python3 - <<'PY' 2>&1 | tee /build/laplace/work/policy-regressions/evidence/tests.log
          import base64,hashlib,json,os,pathlib,subprocess,sys,urllib.request
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          assert subprocess.check_output(["git","-C",root,"rev-parse","HEAD"],text=True).strip()=="a754665d33952a60e5aeecaee0e542d1d3824671"
          for name,sha in {"scripts/test-managed-policy.py":"be1a4d6fa6c215eb973ff9d7e1f1a2437a8f1057",
              "scripts/test-parallel.sh":"e1af095112524762c80aabbdfe22d90647d6ac7d",
              "scripts/test-application-payload.py":"66ec44d590fac096d1af22519c8aa58fc78c412f",
              "scripts/verify-api-payload.py":"840926c7fe9b8e1c9279158259310aae9b592cbb",
              "scripts/fixtures/laplace-managed-deploy-legacy-scratch.py":"dfade6c9b72277ed4d95e64376d283a4aa8821d2"}.items():
              request=urllib.request.Request("https://api.github.com/repos/SaltyPatron/Laplace/git/blobs/"+sha,
                  headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(request,timeout=30) as response:item=json.load(response)
              raw=base64.b64decode(item["content"])
              assert item["sha"]==sha and item["encoding"]=="base64" and len(raw)==item["size"]
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==sha
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(raw)
          subprocess.run(["bash","-n",root/"scripts/test-parallel.sh"],check=True)
          subprocess.run([sys.executable,root/"scripts/test-managed-policy.py"],check=True,cwd=root)
          subprocess.run([sys.executable,root/"scripts/test-application-payload.py"],check=True,cwd=root)
          PY
      - name: Retain regression result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uci-assembly-controls-${{ github.run_id }}
          path: /build/laplace/work/policy-regressions/evidence
          if-no-files-found: error
          retention-days: 30
