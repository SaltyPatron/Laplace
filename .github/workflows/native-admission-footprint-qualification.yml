name: Read retained native source context results
on:
  push:
    branches: [qualify/native-admission-footprint-o1-20260916]
permissions:
  contents: read
  actions: read
jobs:
  retained-results:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read authenticated completed comparison artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d /build/laplace/work ]]; then
            sudo install -d -m 2775 -o "$(id -u)" -g "$(id -g)" /build/laplace/work
          fi
          qualification_dir="/build/laplace/work/source-context-read-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$qualification_dir"
          mkdir -m 0700 "$qualification_dir"
          mkdir -m 0700 "$qualification_dir/tmp"
          export QUALIFICATION_DIR="$qualification_dir" TMPDIR="$qualification_dir/tmp" TMP="$qualification_dir/tmp" TEMP="$qualification_dir/tmp"
          printf 'QUALIFICATION_DIR=%s\n' "$qualification_dir" >> "$GITHUB_ENV"
          timeout --signal=TERM --kill-after=5s 240s python3 - <<'PY'
          import hashlib,json,os,subprocess,zipfile,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path(os.environ["QUALIFICATION_DIR"])
          repo="SaltyPatron/Laplace"
          run=35129860405
          artifact=10460429890
          expected_sha="73512a35ec4151c6b1ee08a033ab0ed6c70877a1"
          expected_zip="5a4410525249c70b866b62111a20da0013cb71ebd672dabbeb0ae6b0c05000e4"
          def require(ok,message):
              if not ok: raise RuntimeError(message)
          def api(path):
              result=subprocess.run(["gh","api",path],check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30)
              return json.loads(result.stdout)
          run_info=api(f"repos/{repo}/actions/runs/{run}")
          require(run_info["head_sha"]==expected_sha and run_info["conclusion"]=="success","unexpected successful source run")
          meta=api(f"repos/{repo}/actions/artifacts/{artifact}")
          require(meta["workflow_run"]["id"]==run and meta["workflow_run"]["head_sha"]==expected_sha and not meta["expired"],"artifact binding")
          require(meta["size_in_bytes"]==120015345 and meta["digest"]=="sha256:"+expected_zip,"artifact identity")
          archive=root/"retained.zip"
          with archive.open("xb") as output:
              subprocess.run(["gh","api",f"repos/{repo}/actions/artifacts/{artifact}/zip"],check=True,stdout=output,timeout=120)
          with archive.open("rb") as stream:
              require(hashlib.file_digest(stream,"sha256").hexdigest()==expected_zip,"archive hash mismatch")
          require(archive.stat().st_size==meta["size_in_bytes"],"archive size mismatch")
          prefix="work/source-context-35129860405-1/evidence/"
          with zipfile.ZipFile(archive) as z:
              def read(name):
                  info=z.getinfo(prefix+name)
                  require(not info.is_dir() and info.file_size<=2*1024*1024,"bounded member invalid")
                  return z.read(info)
              result=json.loads(read("result.json"))
              require(result["status"]=="passed" and result["baseline_controls_passed"]==20 and result["candidate_controls_passed"]==20,"comparison result")
              properties={}
              for label in ("baseline","candidate"):
                  doc=ET.fromstring(read(label+"-controls.xml"))
                  cases=doc.findall(".//testcase")
                  require(len(cases)==20 and all(c.find("failure") is None and c.find("skipped") is None for c in cases),"controls XML")
                  case=next(c for c in cases if c.attrib["name"]=="SourceContextObservationWorkload")
                  values={p.attrib["name"]:p.attrib["value"] for p in case.findall("./properties/property")}
                  properties[label]={k:v for k,v in values.items() if "_sample" not in k}
              require(properties["baseline"]==properties["candidate"],"concrete tuple/owner values differ")
              host=json.loads(read("host.json"))
              evidence={"schema":"laplace.native-source-context-retained-fields/v1","run":run,"artifact":artifact,
                  "zip_sha256":expected_zip,"properties":properties,"host":host}
          (root/"retained-fields.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          print(json.dumps(evidence,sort_keys=True))
          
          PY
      - name: Retain extracted concrete counters
        if: always() && env.QUALIFICATION_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-source-context-fields-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUALIFICATION_DIR }}/retained-fields.json
          if-no-files-found: error
          retention-days: 90
