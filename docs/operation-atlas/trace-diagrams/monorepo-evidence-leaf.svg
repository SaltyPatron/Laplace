893" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="180.887" y="1002.471" fill="#888" font-size="10" textLength="401.338">claimed. Complete index recognition and leaf read reviewed. Only absent predicates or the</text><text x="195.364" y="1015.049" fill="#888" font-size="10" textLength="372.383">specifically admissible object-IS-NOT-NULL predicate are accepted. Ranked access</text><text x="193.326" y="1027.627" fill="#888" font-size="10" textLength="376.46">recognizes rating − 2*RD by expression, not index name. Callback cutoff correctness</text><text x="208.672" y="1040.205" fill="#888" font-size="10" textLength="345.767">belongs to its caller. A typed-plane cutoff is never applied to the endpoint-wide</text><text x="363.213" y="1052.783" fill="#888" font-size="10" textLength="36.685">fallback.</text></g><?plantuml-src fLLDR-Cs4BthLmpGmsQBzOVaMBRZGv4c6tI1D2cIRQy1HGvjrZAf9Maxxgd7del-mlqbVPHi9nlqrbCKQJxUlFTc_8u-RerYA_c2RaLJ2ya3VeviWt5sK7TldiAc2j6Bo8FWvK0w6n2m2Kz12jkNzFZJPJ4kQJYTZ6RdrVIyqEDnAQTwE2h6MilXP5QDbPXCnceyPL4CLSL2ZOVbT3J6tt8salbiKXJPk_yFPda4KquAderboU8yvrpFHAMuF1-DP5MgV9ZdKw5AhifYEipbkSfdGXOJO9mMizb4brp-DnYxC9RHqtVDmvVwIOeeQhVeAzOd8ahCDPGyrBaGqza40xBI8rOv0uhEPzDod5SZLQWgByT3CPIYKDDyfigYdEIJCWihOnlXnPeg8LSBxpPMNRdQUVhkvlBcwkRcLKHO2kLsnYv8Yphmgoz093Prl74stearqwEmuP6zqLaqiMRwsLaCqZZw-kS_9DswgJaohNZFYXAP9AmYB-mA_wDsdR1a8GeViui7_h8ndecV6vOH0OagbDstIGYoAa6IhjwiBSLzms6UNVpYMRCdAFWxiWA9G8rt5SfOrJXZuvnSNBBVcS3akg1vPZITVKO5rOCAbcdj5BTjrYBAPMgJwdTGoLZ5pu1bGWm_l2TKitIsv_0-eujhhda1uvpQ3L9YobiaU83jcWpVmD353SW-XlKE9BID0_EAjg8sQ0WRx-d7NlJCj3DnIQmrC9ijzzORy1yaTpo09iyXsRWRvywrX8jeAWZXl6AVE4pOtuA-MZe7DhgEHqJVDArTmXyfhG8M0mvL1_Aw-T1QcsVC1zNIMn9LIBucfryAjhrJpBK98e6Ic-YqxkHCPZWPvCJwmIaSvnd3UNHsc2EXVkpyqvPjq0JcE8tPyaqw4IpayaNx8_KFe9NWU3X5j6HIiA89ImTxQ5D7lETdV7aZ8u0aZ_sMY4eYGqt_Oap3ePtbD0Ok28OOF5mFjgx6Smtp3i2dXKw8sYH0IQhxRr2t9GwxSAGe-Ws_LUqZukBIX1U2k_oACJU3bgrRTGk2sxN6H8cEk1I8SxiZdzQrL