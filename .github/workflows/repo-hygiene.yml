name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-tree:
    name: Tracked tree contains no local/runtime artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Enforce source-tree hygiene and strong secret signatures
        run: python3 scripts/repo-hygiene-gate.py

  release-read-only-diagnostic:
    if: github.event_name == 'push' && github.event.before == '6dd567008c53a1f8faa29a283c1f9b941484d20f'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Release only identified diagnostics and unstarted duplicate invocations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = 'https://api.github.com/repos/SaltyPatron/Laplace'
          def request(path, method='GET'):
              req = urllib.request.Request(base + path, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None
          # These invocations have not started any product or repair command.
          candidates = [request('/actions/runs/35009726346')]
          candidates += request('/actions/runs?head_sha=' + os.environ['GITHUB_SHA'] + '&per_page=10')['workflow_runs']
          for run in candidates:
              if run['id'] == int(os.environ['GITHUB_RUN_ID']):
                  continue
              if run['id'] != 35009726346 and run['name'] != 'Laplace — product lifecycle':
                  continue
              jobs = request(f"/actions/runs/{run['id']}/jobs?per_page=100")['jobs']
              if run['status'] in ('queued', 'pending', 'waiting') and not any(j['status'] == 'in_progress' for j in jobs):
                  request(f"/actions/runs/{run['id']}/cancel", 'POST')
                  print('Cancelled unstarted duplicate invocation', run['id'])
          run = request('/actions/runs/35008676783')
          if run['status'] == 'completed':
              print('Previous diagnostic already completed; not cancelled.')
              raise SystemExit(0)
          if run['head_sha'] != '927fdc19149861c1181598cff8ccf348485cf25a':
              raise SystemExit('Unexpected source; leave the running job untouched.')
          jobs = request('/actions/runs/35008676783/jobs?per_page=100')['jobs']
          job = next(j for j in jobs if j['id'] == 104514980884)
          steps = {s['name']: s for s in job['steps']}
          if (steps['Fast source/tooling proof and installed-product reconciliation']['conclusion'] != 'success'
              or steps['Run full product lifecycle']['conclusion'] != 'skipped'
              or steps['Retain bounded live recursive proof counterexamples']['status'] != 'in_progress'):
              raise SystemExit('No cancellation: a product operation may still be running.')
          request('/actions/runs/35008676783/force-cancel', 'POST')
          print('Released only completed-reconciliation diagnostic 35008676783; no build, install, seed or repair interrupted.')
          PY

  repair-membership-fixture:
    needs: release-read-only-diagnostic
    if: github.event_name == 'push' && github.event.before == '6dd567008c53a1f8faa29a283c1f9b941484d20f'
    runs-on: [self-hosted, laplace]
    timeout-minutes: 10
    concurrency:
      group: laplace-shared-workspace
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PGHOST: /var/run/postgresql
      PGPORT: 5432
      PGUSER: laplace_admin
      PGDATABASE: postgres
    steps:
      - name: Execute the isolated native regression repair and remove this worker
        shell: bash
        run: |
          set -euo pipefail
          umask 0002
          mkdir -p /build/laplace/work
          flock --exclusive --close /build/laplace/work/host-resource.lock bash -euo pipefail <<'REPAIR'
          workspace="$RUNNER_TEMP/laplace-membership-repair-$GITHUB_RUN_ID"
          evidence="/build/laplace/work/membership-repair-$GITHUB_RUN_ID"
          database="laplace_membership_repair_${GITHUB_RUN_ID}"
          export PATH="/opt/laplace/pgsql-18/bin:$PATH"
          git fetch --no-tags origin "$GITHUB_SHA"
          git worktree add --detach "$workspace" "$GITHUB_SHA"
          cleanup() {
            dropdb --if-exists "$database" || true
            git -C "$GITHUB_WORKSPACE" worktree remove --force "$workspace" || true
          }
          trap cleanup EXIT
          cd "$workspace"
          mkdir -p "$evidence/default" "$evidence/host-bitmap-disabled"
          python3 scripts/ci-repair-membership-once.py
          git diff --check
          git diff --stat
          python3 scripts/actions-audit.py
          for configuration in default host-bitmap-disabled; do
            createdb -O laplace_admin "$database"
            if [[ "$configuration" == host-bitmap-disabled ]]; then
              export PGOPTIONS='-c enable_bitmapscan=off'
            else
              unset PGOPTIONS
            fi
            psql -X -d "$database" -v ON_ERROR_STOP=1 -c 'SHOW enable_bitmapscan; SHOW default_toast_compression;'
            if ! /opt/laplace/pgsql-18/lib/pgxs/src/test/regress/pg_regress \
              --bindir=/opt/laplace/pgsql-18/bin \
              --inputdir="$workspace/extension/laplace_substrate/tests" \
              --outputdir="$evidence/$configuration" \
              --dbname="$database" --user=laplace_admin --use-existing \
              bootstrap generation_corpus; then
              cat "$evidence/$configuration/regression.diffs"
              exit 1
            fi
            dropdb "$database"
          done
          unset PGOPTIONS
          git add .github/workflows/laplace.yml .github/workflows/repo-hygiene.yml \
            scripts/ci-repair-membership-once.py \
            extension/laplace_substrate/tests/sql/generation_corpus.sql \
            extension/laplace_substrate/tests/expected/generation_corpus.out
          git -c user.name='SaltyPatron' -c user.email='259472962+SaltyPatron@users.noreply.github.com' \
            commit -m 'Repair planner-dependent bitmap fixture and eliminate no-op diagnostic lock waits'
          git show --stat --oneline HEAD
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/main
          printf 'MEMBERSHIP_REPAIR_COMMITTED source=%s native_configurations=2 rebuilds=0 corpus_seeds=0\n' "$(git rev-parse HEAD)"
          REPAIR
      - name: Retain native membership execution results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: membership-repair-${{ github.run_id }}
          path: /build/laplace/work/membership-repair-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
