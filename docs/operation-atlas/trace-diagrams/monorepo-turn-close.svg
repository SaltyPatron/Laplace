 style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="150.99" y="368.09" fill="#000" font-size="12" textLength="242.139">Resolve tenant prompt and response sources</text><rect x="180.672" y="400.727" width="182.773" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="190.672" y="423.184" fill="#000" font-size="12" textLength="162.773">Apply three bootstrap changes</text><rect x="145.991" y="455.82" width="252.137" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="155.991" y="478.277" fill="#000" font-size="12" textLength="232.137">Cache tenant scope only after apply returns</text><polygon points="183.09,296.715,361.029,296.715,373.029,308.715,361.029,320.715,183.09,320.715,171.09,308.715,183.09,296.715" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="276.059" y="332.134" fill="#000" font-size="11" textLength="17.118">yes</text><text x="183.09" y="313.216" fill="#000" font-size="11" textLength="177.939">Tenant absent from instance cache?</text><polygon points="272.059,510.914,284.059,522.914,272.059,534.914,260.059,522.914,272.059,510.914" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="139.32" y="554.914" width="265.479" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="149.32" y="577.371" fill="#000" font-size="12" textLength="245.479">Build turn change and ordered occurrence IDs</text><rect x="229.709" y="658.926" width="84.699" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="239.709" y="681.383" fill="#000" font-size="12" textLength="64.699">Return false</text><ellipse cx="272.059" cy="732.973" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="272.059" cy="732.973" rx="6" ry="6" fill="#222" sty