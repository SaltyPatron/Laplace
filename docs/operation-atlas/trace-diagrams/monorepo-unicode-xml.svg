<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:827px;height:1039px;background:#FAFCFF;" width="827px" height="1039px" viewBox="0 0 827 1039" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="827" height="1039" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="6"><text x="219.697" y="34.533" fill="#000" font-size="14" textLength="386.265" font-weight="700">Monorepo — UCD artifact decoding and XML event parser</text></g><ellipse cx="469.189" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="406.82,93.609,531.559,93.609,543.559,105.609,531.559,117.609,406.82,117.609,394.82,105.609,406.82,93.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="406.82" y="110.11" fill="#000" font-size="11" textLength="124.738">Path ends exactly in .zip?</text><text x="377.703" y="103.192" fill="#000" font-size="11" textLength="17.118">yes</text><text x="543.559" y="103.192" fill="#000" font-size="11" textLength="23.241">plain</text><rect x="165.064" y="127.609" width="278.791" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="175.064" y="150.066" fill="#000" font-size="12" textLength="258.791">Read whole archive; find end-of-central-directory</text><rect x="132.387" y="182.703" width="344.146" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="142.387" y="205.16" fill="#000" font-size="12" textLength="324.146">Require nonzero entry count; read first central-directory entry</text><rect x="182.707" y="237.797" width="243.506" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="192.707" y="260.254" fill="#000" font-size="12" textLength="223.506">Validate local header and payload bounds</text><polygon points="237.805,292.891,371.115,292.891,383.115,304.891,371.115,316.891,237.805,316.891,225.805,304.891,237.805,292.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="237.805" y="309.392" fill="#000" font-size="11" textLength="133.311">Stored or deflated method?</text><text x="208.687" y="302.474" fill="#000" font-size="11" textLength="17.118">yes</text><text x="383.115" y="302.474" fill="#000" font-size="11" textLength="61.161">unsupported</text><rect x="16" y="326.891" width="331.484" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="349.348" fill="#000" font-size="12" textLength="311.484">Copy or inflate whole selected entry; require size and CRC</text><rect x="367.484" y="326.891" width="119.387" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="377.484" y="349.348" fill="#000" font-size="12" textLength="99.387">Return read failure</text><ellipse cx="427.178" cy="392.984" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="427.178" cy="392.984" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="516.871" y="127.609" width="234.096" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="526.871" y="150.066" fill="#000" font-size="12" textLength="214.096">Read whole XML file; reject empty bytes</text><polygon points="469.189,413.984,481.189,425.984,469.189,437.984,457.189,425.984,469.189,413.984" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="400.49" y="514.903" width="137.398" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="410.49" y="537.36" fill="#000" font-size="12" textLength="117.398">Skip text until next tag</text><polygon points="359.455,569.997,578.924,569.997,590.924,581.997,578.924,593.997,359.455,593.997,347.455,581.997,359.455,569.997" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="359.455" y="586.498" fill="#000" font-size="11" textLength="219.468">Comment, processing instruction or CDATA?</text><text x="330.338" y="579.58" fill="#000" font-size="11" textLength="17.118">yes</text><text x="590.924" y="579.58" fill="#000" font-size="11" textLength="39.134">element</text><rect x="191.76" y="603.997" width="251.41" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="201.76" y="626.454" fill="#000" font-size="12" textLength="231.41">Skip to terminator; reject missing terminator</text><rect x="478.507" y="603.997" width="284.814" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="488.507" y="626.454" fill="#000" font-size="12" textLength="264.814">Read ASCII-style name and quoted attribute pairs</text><rect x="518.219" y="665.673" width="205.391" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="528.219" y="688.13" fill="#000" font-size="12" textLength="185.391">Reject malformed lexical delimiters</text><rect x="463.17" y="720.767" width="315.488" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="473.17" y="743.224" fill="#000" font-size="12" textLength="295.488">Invoke start/end callbacks; self-closing tag invokes both</text><polygon points="469.189,761.86,481.189,773.86,469.189,785.86,457.189,773.86,469.189,761.86" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="438.926,457.984,499.453,457.984,511.453,469.984,499.453,481.984,438.926,481.984,426.926,469.984,438.926,457.984" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="473.189" y="493.403" fill="#000" font-size="11" textLength="17.118">yes</text><text x="438.926" y="474.485" fill="#000" font-size="11" textLength="60.527">More bytes?</text><text x="402.455" y="467.567" fill="#000" font-size="11" textLength="24.471">done</text><rect x="399.166" y="827.86" width="140.047" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="409.166" y="850.317" fill="#000" font-size="12" textLength="120.047">Return parser success</text><ellipse cx="469.189" cy="893.954" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="469.189" cy="893.954" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="304.46" y1="162.703" x2="304.46" y2="182.703" style="stroke:#181818;stroke-width:1;"/><polygon points="300.46,172.703,304.46,182.703,308.46,172.703,304.46,176.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="304.46" y1="217.797" x2="304.46" y2="237.797" style="stroke:#181818;stroke-width:1;"/><polygon points="300.46,227.797,304.46,237.797,308.46,227.797,304.46,231.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="427.178" y1="361.984" x2="427.178" y2="381.984" style="stroke:#181818;stroke-width:1;"/><polygon points="423.178,371.984,427.178,381.984,431.178,371.984,427.178,375.984" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="225.805" y1="304.891" x2="181.742" y2="304.891" style="stroke:#181818;stroke-width:1;"/><line x1="181.742" y1="304.891" x2="181.742" y2="326.891" style="stroke:#181818;stroke-width:1;"/><polygon points="177.742,316.891,181.742,326.891,185.742,316.891,181.742,320.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="383.115" y1="3