name: Inspect retained installed corpus failure
on:
  push:
    branches: [qualify/native-admission-footprint-20260916]
permissions:
  contents: read
jobs:
  observation:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 5
    steps:
      - name: Retain exact corpus failure logs and receipts without database mutation
        shell: bash
        run: |
          set -euo pipefail
          umask 0077
          evidence="/build/laplace/recovery/corpus-failure-observation/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$evidence"
          export OBSERVATION_EVIDENCE="$evidence"
          echo "OBSERVATION_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,stat
          native=pathlib.Path("/build/laplace/recovery/native-install/35161276382-3")
          receipt=json.loads((native/"receipt.json").read_text())
          assert receipt["source"]=="2ef3f7ff885c8eccbc81d76caf8284436a482ffe"
          assert receipt["status"]=="completed" and receipt["attempt"]=="3"
          evidence=pathlib.Path(os.environ["OBSERVATION_EVIDENCE"])
          source=native/"corpus"
          files=sorted(p for p in source.rglob("*") if p.is_file() and p.suffix in (".log",".json",".jsonl",".txt"))
          assert len(files)<=128
          inventory=[]
          remaining=16*1024*1024
          for p in files:
              info=p.lstat()
              assert stat.S_ISREG(info.st_mode) and not p.is_symlink()
              size=info.st_size
              relative=p.relative_to(source)
              row={"path":str(relative),"bytes":size}
              if size>remaining:
                  row["retained"]=False
                  row["reason"]="sixteen-megabyte evidence limit"
                  inventory.append(row)
                  continue
              raw=p.read_bytes()
              assert len(raw)==size
              remaining-=size
              target=evidence/"corpus"/relative
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(raw)
              row.update(retained=True,sha256=hashlib.sha256(raw).hexdigest())
              inventory.append(row)
              if p.suffix==".log" or p.name in ("recording.json","corpus-recording.json","result.json"):
                  shown=raw if len(raw)<=65536 else raw[:8192]+b"\n[bounded middle omitted]\n"+raw[-57344:]
                  print("CORPUS_RETAINED_FILE "+json.dumps(row),flush=True)
                  print(shown.decode(errors="replace"),flush=True)
          (evidence/"inventory.json").write_text(json.dumps(inventory,indent=2)+"\n")
          print("CORPUS_RETAINED_INVENTORY "+json.dumps(inventory),flush=True)
          PY
      - name: Retain original corpus failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-corpus-failure-attempt3
          path: ${{ env.OBSERVATION_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 30
