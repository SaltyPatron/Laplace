# Governed claim qualifiers: multi-select flags carried on an attestation's 256-bit mask
# (the sister of the entity highway mask). One relation per meaning; the qualifiers say
# which variant(s) the source asserts: "eng HAS_EXTERNAL_ID eng {iso639-2b, iso639-2t,
# iso639-3}" is one claim, not three relations. Each family owns up to 32 bits from its
# base; values are append-only within a family (a value's bit never changes meaning).
#
# A qualifier bit means something only under the relation it qualifies. A family that
# declares `relations` applies to those relations only, so families whose relation sets
# are disjoint may share bit positions: bit 0 is iso639-1 under HAS_EXTERNAL_ID and a
# part meronym under HAS_PART. A family without `relations` applies to every relation and
# owns its bits outright.

[[family]]
name = "identifier"
relations = ["HAS_EXTERNAL_ID"]
base = 0
values = ["iso639-1", "iso639-2b", "iso639-2t", "iso639-3", "bcp47", "ili",
          "pwn30-offset", "pwn31-offset", "wordnet-sense-key", "wordnet-synset-key",
          "pwn15-offset", "pwn16-offset", "pwn17-offset", "pwn171-offset", "pwn20-offset",
          "pwn21-offset", "odwn13-synset"]

[[family]]
name = "name"
relations = ["HAS_NAME"]
base = 32
values = ["primary", "alias", "reference", "print", "inverted", "abbreviation",
          "correction", "control", "alternate", "figment", "unicode-1"]

[[family]]
name = "mapping"
relations = ["HAS_CASE_MAPPING", "NORMALIZES_TO"]
base = 64
values = ["lower", "upper", "title", "fold", "simple", "full", "nfkc"]

[[family]]
name = "decomposition"
relations = ["DECOMPOSES_TO"]
base = 96
# Unicode Decomposition_Type long names (PropertyValueAliases.txt dt); the UCD recipe
# resolves the XML's short codes (nb, can, ...) to them through its value aliases.
values = ["Canonical", "Compat", "Circle", "Final", "Font", "Fraction", "Initial", "Isolated",
          "Medial", "Narrow", "Nobreak", "Small", "Square", "Sub", "Super", "Vertical", "Wide"]

# ISO 639-3 retirement reasons (code table documentation: C change, D duplicate,
# N non-existent, S split, M merge) and macrolanguage membership status (A active,
# R retired). Recipes map the source codes to these names through value aliases.
[[family]]
name = "retirement"
relations = ["SUPERSEDED_BY"]
base = 128
values = ["change", "duplicate", "non-existent", "split", "merge"]

[[family]]
name = "membership"
relations = ["HAS_PART"]
base = 160
values = ["active", "retired"]

# How the claim was produced. A calculation is deterministic derived evidence (an engine's
# evaluation, an outcome tally over recorded games), a plane distinct from observed
# testimony inside the same relation cell (query_evidence COUPLE).
[[family]]
name = "derivation"
base = 192
values = ["calculation"]

# WordNet meronymy (wninput(5WN) pointers: %p/#p part, %m/#m member, %s/#s substance
# meronym/holonym): the kind of part a HAS_PART claim states. One element, HAS_PART; the
# kind is the claim's qualifier, never a relation of its own.
[[family]]
name = "meronymy"
relations = ["HAS_PART"]
base = 0
values = ["part", "member", "substance"]
