-width:0.5;" rx="12.5" ry="12.5"/><text x="66.349" y="336.441" fill="#000" font-size="12" textLength="357.516">Create token-shard dataset, AdamW and warmup/cosine scheduler</text><rect x="65.021" y="369.078" width="360.172" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="75.021" y="391.535" fill="#000" font-size="12" textLength="340.172">Prepare model, optimizer, loader and scheduler with accelerator</text><rect x="116.041" y="473.09" width="258.131" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="126.041" y="495.547" fill="#000" font-size="12" textLength="238.131">Load accelerator state; require progress.json</text><rect x="50.012" y="543.184" width="390.189" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="60.012" y="565.641" fill="#000" font-size="12" textLength="370.189">Restore counters; skip previously consumed batches in current epoch</text><polygon points="199.552,424.172,290.661,424.172,302.661,436.172,290.661,448.172,199.552,448.172,187.552,436.172,199.552,424.172" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="249.106" y="459.591" fill="#000" font-size="11" textLength="17.118">yes</text><text x="199.552" y="440.673" fill="#000" font-size="11" textLength="91.11">Resume supplied?</text><polygon points="245.106,598.277,257.106,610.277,245.106,622.277,233.106,610.277,245.106,598.277" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="135.063" y="642.277" width="220.086" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="145.063" y="664.734" fill="#000" font-size="12" textLength="200.086">Main process writes execution receipt</text><rect x="42.345" y="754.29" width="405.523" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-