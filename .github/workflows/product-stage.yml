name: Internal — product stage

on:
  workflow_call:
    inputs:
      operation:
        description: "qualification or competitive (includes installed database and model operations)"
        type: string
        required: true
      target_sha:
        description: "Exact source revision"
        type: string
        required: true
      full_clean:
        type: boolean
        default: false
      force_codegen:
        type: boolean
        default: false
      serial_tests:
        type: boolean
        default: false
      model_hub:
        description: "Optional existing model corpus root; otherwise use the host HF_HUB_CACHE"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  stage:
    name: Staging — ${{ inputs.operation }}
    runs-on: [self-hosted, laplace, Laplace, staging]
    timeout-minutes: 420
    concurrency:
      group: laplace-site-hart-server
      cancel-in-progress: false
      queue: max
    env:
      LAPLACE_HOST_LOCK_WAIT_SECONDS: ${{ vars.LAPLACE_HOST_LOCK_WAIT_SECONDS || '3600' }}
      LAPLACE_FULL_CLEAN: ${{ inputs.full_clean && '1' || '0' }}
      LAPLACE_FORCE_CODEGEN: ${{ inputs.force_codegen && '1' || '0' }}
      LAPLACE_TEST_SERIAL: ${{ inputs.serial_tests && '1' || '0' }}
      LAPLACE_QUALIFICATION_MODEL_HUB: ${{ inputs.model_hub }}
    steps:
      - name: Check out the selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Execute through the installed host lifecycle
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          case "$OPERATION" in qualification|competitive) ;; *) exit 2 ;; esac
          mkdir -p "$RUNNER_TEMP/qualification"
          export LAPLACE_QUALIFICATION_RESULTS="$RUNNER_TEMP/qualification"
          export GITHUB_SHA="$TARGET_SHA"
          bash deploy/linux/site.sh "$OPERATION" 2>&1 | tee "$RUNNER_TEMP/qualification/operation.log"
      - name: Retain qualification results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-${{ inputs.operation }}-${{ inputs.target_sha }}
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error
          retention-days: 14
