name: Recover exact owned Original PostgreSQL cluster
on:
  push:
    branches: ['diag/recover-original-postgresql-f2-*']
permissions:
  contents: read
jobs:
  recovery:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TMPDIR: /build/laplace/work
      TMP: /build/laplace/work
      TEMP: /build/laplace/work
    steps:
      - name: Recover only the bound old cluster under ordinary host ownership
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 480s flock --exclusive --close --timeout 120 /build/laplace/work/host-resource.lock python3 - <<'PY'
          import csv, datetime, hashlib, importlib.util, io, json, os, pwd, re, select, selectors, signal, stat, subprocess, sys, tempfile, time
          from pathlib import Path
          EXPECTED_SHA, EXPECTED_TREE = "f2cbb5fc7305dfd20d9fa3a19003b60a06b457c0", "42167cb4cbef49382fd427e7e4f51b26eea2d7f4"
          SESSION = Path("/build/laplace/work/ci-sessions/35104196613-1-product/session.json")
          def deadline(signum, frame):
              raise TimeoutError("bounded database observation deadline")
          signal.signal(signal.SIGALRM, deadline)
          signal.alarm(350)
          os.environ.update(PGHOST="/var/run/postgresql", PGPORT="5432", PGUSER="laplace_admin",
                            PGCONNECT_TIMEOUT="3", PGAPPNAME="laplace-readonly-progress-observer",
                            PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=3000 -c lock_timeout=500")
          for key in ("PGSERVICE", "PGSERVICEFILE"):
              os.environ.pop(key, None)
          
          def bounded_query(database: str, sql_path: Path, timeout: int, max_bytes: int) -> bytes:
              argv = ["psql", "-X", "-h", os.environ.get("PGHOST", "/var/run/postgresql"),
                      "-p", os.environ.get("PGPORT", "5432"), "-U", os.environ.get("PGUSER", "laplace_admin"),
                      "-d", database, "-v", "ON_ERROR_STOP=1", "-A", "-t", "-q", "-f", str(sql_path)]
              process = subprocess.Popen(argv, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              output, error = bytearray(), bytearray()
              deadline = time.monotonic() + timeout + 10
              try:
                  with selectors.DefaultSelector() as selector:
                      for stream, tag in ((process.stdout, "output"), (process.stderr, "error")):
                          os.set_blocking(stream.fileno(), False)
                          selector.register(stream, selectors.EVENT_READ, tag)
                      while selector.get_map():
                          remaining = deadline - time.monotonic()
                          if remaining <= 0:
                              raise RuntimeError("readback process deadline exceeded")
                          for key, _ in selector.select(min(remaining, 1.0)):
                              chunk = os.read(key.fd, 65536)
                              if not chunk:
                                  selector.unregister(key.fileobj)
                                  continue
                              target, bound = (output, max_bytes) if key.data == "output" else (error, 1 << 20)
                              if len(target) + len(chunk) > bound:
                                  raise RuntimeError(f"readback {key.data} exceeded declared byte envelope {bound}")
                              target.extend(chunk)
                  process.wait(timeout=max(0.01, deadline - time.monotonic()))
                  if process.returncode:
                      raise RuntimeError(f"read-only source query failed ({process.returncode}): "
                                         + error.decode("utf-8", errors="replace"))
                  return bytes(output)
              finally:
                  if process.poll() is None:
                      process.kill()
                      process.wait()
                  process.stdout.close()
                  process.stderr.close()
          
          PREVIOUS_PROCESSES = {}
          
          def bounded_proc(path, budget):
              descriptor = os.open(path, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
              with os.fdopen(descriptor, "rb") as stream:
                  if not stat.S_ISREG(os.fstat(stream.fileno()).st_mode):
                      raise ValueError("process evidence is not regular")
                  raw = stream.read(budget + 1)
              if len(raw) > budget:
                  raise ValueError("process evidence exceeded budget")
              return raw.decode("ascii", errors="strict")
          
          def process_stat(pid):
              raw = bounded_proc(f"/proc/{pid}/stat", 4096)
              end = raw.rfind(")")
              if end < 0 or raw.split(" ", 1)[0] != str(pid):
                  raise ValueError("unexpected process stat identity")
              fields = raw[end + 2:].split()
              if len(fields) < 22:
                  raise ValueError("incomplete process stat")
              return {"processId": pid, "userTicks": int(fields[11]), "systemTicks": int(fields[12]),
                      "threads": int(fields[17]), "startTicks": int(fields[19]),
                      "virtualBytes": int(fields[20]), "residentPages": int(fields[21])}
          
          def process_snapshot(sample, source_bound):
              result = {"observed": False, "scope": "Read-only process counters; no command line or environment."}
              if not source_bound:
                  return dict(result, unavailableReason="wrapper_source_unbound")
              try:
                  pid = sample.get("processId")
                  if type(pid) is not int or not 0 < pid < 2147483648:
                      raise ValueError("invalid progress process identity")
                  started = sample.get("processStartedAt")
                  if not isinstance(started, str):
                      raise ValueError("progress process start time unavailable")
                  expected = datetime.datetime.strptime(started, "%Y-%m-%dT%H:%M:%S.%f%z")
                  if expected.tzinfo is None:
                      raise ValueError("progress process start time has no offset")
                  tick_hz = os.sysconf("SC_CLK_TCK")
                  page_bytes = os.sysconf("SC_PAGE_SIZE")
                  result["observationStep"] = "kernel-stat-before"
                  before = process_stat(pid)
                  result["numericKernelStat"] = before
                  result["observationStep"] = "kernel-boot-clock"
                  boot_lines = bounded_proc("/proc/stat", 262144).splitlines()
                  boot_values = [int(line.split()[1]) for line in boot_lines if line.startswith("btime ")]
                  if len(boot_values) != 1 or tick_hz <= 0 or page_bytes <= 0:
                      raise ValueError("kernel process clock unavailable")
                  kernel_start = boot_values[0] + before["startTicks"] / tick_hz
                  difference = abs(expected.timestamp() - kernel_start)
                  result["numericStartEvidence"] = {"kernelBootSeconds": boot_values[0], "ticksPerSecond": tick_hz, "kernelStartEpochSeconds": kernel_start, "backendStartEpochSeconds": expected.timestamp(), "differenceSeconds": difference}
                  result["observationStep"] = "optional-status-and-io"
                  # Clock corroboration is reported; stable SQL/kernel identity below owns binding.
                  optional = {}
                  try:
                      status = bounded_proc(f"/proc/{pid}/status", 65536)
                      wanted = {"VmRSS": "residentKiB", "VmHWM": "peakResidentKiB", "Threads": "threads",
                                "voluntary_ctxt_switches": "voluntaryContextSwitches",
                                "nonvoluntary_ctxt_switches": "involuntaryContextSwitches"}
                      status_metrics = {}
                      for line in status.splitlines():
                          key, sep, value = line.partition(":")
                          if sep and key in wanted:
                              parts = value.split()
                              if not parts or not parts[0].isdigit():
                                  raise ValueError("invalid process status metric")
                              if key in ("VmRSS", "VmHWM") and parts[1:] != ["kB"]:
                                  raise ValueError("unexpected process memory unit")
                              status_metrics[wanted[key]] = int(parts[0])
                      optional["statusMetrics"] = status_metrics
                  except (OSError, ValueError, UnicodeError) as error:
                      optional["statusUnavailableErrorType"] = type(error).__name__
                  try:
                      io_text = bounded_proc(f"/proc/{pid}/io", 4096)
                      wanted = {"read_bytes": "readBytes", "write_bytes": "writeBytes",
                                "rchar": "readCharacters", "wchar": "writeCharacters",
                                "syscr": "readSyscalls", "syscw": "writeSyscalls"}
                      io_metrics = {}
                      for line in io_text.splitlines():
                          key, sep, value = line.partition(":")
                          if sep and key in wanted:
                              if not value.strip().isdigit():
                                  raise ValueError("invalid process I/O metric")
                              io_metrics[wanted[key]] = int(value)
                      optional["ioMetrics"] = io_metrics
                  except (OSError, ValueError, UnicodeError) as error:
                      optional["ioUnavailableErrorType"] = type(error).__name__
                  result["observationStep"] = "kernel-stat-after"
                  after = process_stat(pid)
                  if (before["processId"], before["startTicks"]) != (after["processId"], after["startTicks"]):
                      raise ValueError("process identity changed during observation")
                  return dict(result, observed=True, processId=pid, startTicks=after["startTicks"],
                              kernelStartUtc=datetime.datetime.fromtimestamp(kernel_start, datetime.timezone.utc).isoformat(),
                              recordedBackendStartUtc=expected.isoformat(), kernelBootSeconds=boot_values[0],
                              startTimeDifferenceSeconds=difference, startTimeToleranceSeconds=2, wallClockStartMatched=difference <= 2,
                              ticksPerSecond=tick_hz, userCpuSeconds=after["userTicks"] / tick_hz,
                              systemCpuSeconds=after["systemTicks"] / tick_hz,
                              residentBytes=after["residentPages"] * page_bytes,
                              virtualBytes=after["virtualBytes"], threads=after["threads"],
                              sampleMonotonicSeconds=time.monotonic(), **optional)
              except (OSError, ValueError, TypeError, KeyError, UnicodeError) as error:
                  known = {"process evidence is not regular", "process evidence exceeded budget", "unexpected process stat identity", "incomplete process stat", "invalid progress process identity", "progress process start time unavailable", "progress process start time has no offset", "kernel process clock unavailable", "process identity changed during observation"}
                  return dict(result, unavailableErrorType=type(error).__name__, unavailableReason=str(error) if str(error) in known else "numeric_timestamp_or_permission_failure")
          
          def process_delta(phase, current):
              previous = PREVIOUS_PROCESSES.pop(phase, None)
              if not current.get("observed"):
                  return
              PREVIOUS_PROCESSES[phase] = current.copy()
              if previous is None:
                  current["deltaUnavailableReason"] = "no_verified_prior_sample"
                  return
              if (current["processId"], current["startTicks"]) != (previous["processId"], previous["startTicks"]):
                  current["deltaUnavailableReason"] = "process_identity_changed"
                  return
              elapsed = current["sampleMonotonicSeconds"] - previous["sampleMonotonicSeconds"]
              user = current["userCpuSeconds"] - previous["userCpuSeconds"]
              system = current["systemCpuSeconds"] - previous["systemCpuSeconds"]
              if elapsed <= 0 or user < 0 or system < 0:
                  current["deltaUnavailableReason"] = "non_monotonic_process_sample"
                  return
              current["delta"] = {"sampleSeconds": elapsed, "userCpuSeconds": user, "systemCpuSeconds": system,
                                  "cpuCoreEquivalents": (user + system) / elapsed}
              for key in ("readBytes", "writeBytes"):
                  prior_value = previous.get("ioMetrics", {}).get(key)
                  current_value = current.get("ioMetrics", {}).get(key)
                  if type(prior_value) is int and type(current_value) is int and current_value >= prior_value:
                      current["delta"][key] = current_value - prior_value
          SQL = "BEGIN TRANSACTION READ ONLY;\nSET LOCAL statement_timeout = '3s';\nSET LOCAL lock_timeout = '500ms';\nSET LOCAL idle_in_transaction_session_timeout = '5s';\nSELECT jsonb_build_object(\n 'schema', 'laplace.postgresql-backend-identity/v1',\n 'observedAt', clock_timestamp(), 'transactionReadOnly', current_setting('transaction_read_only'),\n 'database', current_database(), 'currentUser', current_user,\n 'serverVersionNum',current_setting('server_version_num'), 'dataDirectory',current_setting('data_directory'),\n 'postmasterStart',pg_postmaster_start_time(),\n 'sessions',(SELECT COALESCE(jsonb_agg(row_to_json(s)),'[]'::jsonb) FROM\n    (SELECT pid,datname,usename,backend_type,backend_start,xact_start,query_start,state,\n            wait_event_type,wait_event,pg_blocking_pids(pid) AS blockers\n       FROM pg_stat_activity WHERE pid<>pg_backend_pid() ORDER BY pid LIMIT 65) s),\n 'sessionsLimit',65,\n 'backend', (SELECT jsonb_build_object(\n   'pid', pid, 'backendStart', backend_start, 'backendType', backend_type,\n   'state', state, 'transactionStart', xact_start, 'queryStart', query_start,\n   'queryAgeSeconds', EXTRACT(EPOCH FROM clock_timestamp()-query_start),\n   'queryId', query_id, 'queryFingerprintMd5', md5(query), 'queryBytes', octet_length(query),\n   'queryClass', CASE\n      WHEN position('ops.physicality_descriptor_materialize(' IN regexp_replace(lower(query),'[[:space:]]','','g')) > 0\n        THEN 'ops.physicality_descriptor_materialize'\n      WHEN position('pg_advisory_xact_lock(hashtextextended(' IN regexp_replace(lower(query),'[[:space:]]','','g')) > 0\n        THEN 'advisory_xact_control'\n      ELSE 'unclassified-no-text-emitted' END,\n   'waitEventType', wait_event_type, 'waitEvent', wait_event,\n   'blockingPids', pg_blocking_pids(pid))\n   FROM pg_stat_activity WHERE datname=current_database() AND pid=4123046\n     AND backend_start='2026-09-16T13:56:55.74258+00:00'::timestamptz)\n);\nROLLBACK;\n"
          def source_binding():
              fd = os.open(SESSION, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
              with os.fdopen(fd, "rb") as stream:
                  if not stat.S_ISREG(os.fstat(stream.fileno()).st_mode):
                      raise ValueError("session is not regular")
                  raw = stream.read(65537)
              if len(raw) > 65536:
                  raise ValueError("session exceeds envelope")
              data = json.loads(raw)
              if data.get("schema") != "laplace.ci-session.v1" or data.get("source") != {"commit": EXPECTED_SHA, "tree": EXPECTED_TREE} or data.get("kind") != "product":
                  raise ValueError("selected lifecycle identity differs")
              active = data.get("active")
              return {"source": EXPECTED_SHA, "receiptSha256": hashlib.sha256(raw).hexdigest(),
                      "status": str(data.get("status", ""))[:80],
                      "activePhase": str(active.get("phase", ""))[:80] if isinstance(active, dict) else None}
          
          
          def backend(sql_path):
              raw = bounded_query("laplace", sql_path, 5, 65536)
              data = json.loads(raw)
              if data.get("schema") != "laplace.postgresql-backend-identity/v1" or data.get("transactionReadOnly") != "on" or data.get("database") != "laplace" or data.get("currentUser") != "laplace_admin":
                  raise ValueError("installed read-only backend observation differs")
              return data
          
          
          def owned_process(pid, expected_ticks):
              result = {"pid": pid, "expectedStartTicks": expected_ticks}
              try:
                  current = process_stat(pid)
                  result.update(present=True, sameOwnedProcess=current["startTicks"] == expected_ticks,
                                currentStartTicks=current["startTicks"], userTicks=current["userTicks"],
                                systemTicks=current["systemTicks"], residentPages=current["residentPages"])
              except FileNotFoundError:
                  result.update(present=False, sameOwnedProcess=False)
              except (OSError, ValueError, UnicodeError) as error:
                  result["unavailableErrorType"] = type(error).__name__
              return result
          
          
          PREFIX=Path("/opt/laplace")
          PG=PREFIX/"pgsql-18"
          UNIT="laplace-postgresql.service"
          EVIDENCE=Path("/build/laplace/work/pg-recovery")/(os.environ["GITHUB_RUN_ID"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"])
          EVIDENCE.mkdir(parents=True,exist_ok=False)
          proof={"schema":"laplace.owned-postgresql-recovery/v1","source":EXPECTED_SHA,"status":"incomplete",
                 "priorTerminateRun":35110096614,"databaseRecreated":False,"scope":"Existing owner fast shutdown, bounded immediate shutdown only for the same old postmaster if required, and ordinary systemd resurrection. No SIGKILL, schema reset, source rebuild or data fabrication."}
          def save():
              (EVIDENCE/"receipt.json").write_text(json.dumps(proof,sort_keys=True)+"\n")
          def announce(phase):
              proof["phase"]=phase
              save()
              print("POSTGRESQL_RECOVERY "+json.dumps({"phase":phase,"status":proof["status"],"utc":datetime.datetime.now(datetime.timezone.utc).isoformat()}),flush=True)
          def unit():
              fields=("Id","LoadState","ActiveState","SubState","User","Group","MainPID","Restart","KillSignal","KillMode","TimeoutStopUSec","FragmentPath")
              raw=subprocess.check_output(["systemctl","show",UNIT,*["--property="+x for x in fields]],text=True,timeout=5)
              if len(raw)>16384:
                  raise ValueError("unit metadata exceeds envelope")
              return dict(line.split("=",1) for line in raw.splitlines() if "=" in line)
          def load_owner(root):
              spec=importlib.util.spec_from_file_location("recovery_runtime_owner",root/"scripts/check-application-runtime.py")
              owner=importlib.util.module_from_spec(spec)
              sys.modules[spec.name]=owner
              spec.loader.exec_module(owner)
              return owner
          def gone(fd):
              return bool(select.select([fd],[],[],0)[0])
          def wait_exit(fd,seconds):
              return bool(select.select([fd],[],[],seconds)[0])
          def stack():
              result={"requested":False}
              gdb=Path("/usr/bin/gdb")
              if not gdb.is_file() or not os.access(gdb,os.X_OK):
                  return dict(result,unavailable="existing_debugger_absent")
              result["requested"]=True
              process=subprocess.Popen([str(gdb),"-nx","-batch",
                  "-iex","set debuginfod enabled off","-iex","set auto-load safe-path /nonexistent",
                  "-ex","set pagination off","-ex","set print frame-arguments none",
                  "-ex","set print entry-values no","-ex","bt 14","-ex","detach","-p","4123046"],
                  stdout=subprocess.PIPE,stderr=subprocess.STDOUT,start_new_session=True)
              try:
                  raw,_=process.communicate(timeout=12)
                  result["returnCode"]=process.returncode
                  result["capturedBytes"]=len(raw)
                  result["capturedSha256"]=hashlib.sha256(raw).hexdigest()
                  if len(raw)<=1048576:
                      text=raw.decode("utf-8","replace")
                      frames=[]
                      for line in text.splitlines():
                          if re.match(r"^#[0-9]+\s",line):
                              # Print function/source locations only; the debugger was configured not to print argument values.
                              frames.append(line[:1000])
                      result["frames"]=frames[:14]
                      result["accessDenied"]="Operation not permitted" in text or "Permission denied" in text
                  else:
                      result["readerBudgetExceeded"]=True
              except subprocess.TimeoutExpired:
                  result["timedOut"]=True
              finally:
                  for sig in (signal.SIGTERM,signal.SIGKILL):
                      try:
                          os.killpg(process.pid,sig)
                      except ProcessLookupError:
                          pass
                      try:
                          process.wait(timeout=2)
                      except subprocess.TimeoutExpired:
                          pass
                  process.stdout.close()
              return result
          pidfd=None
          try:
              announce("bind-observed-source-native-database-and-owner")
              binding=source_binding()
              if binding["status"]!="failed" or binding["activePhase"] is not None:
                  raise ValueError("interrupted lifecycle no longer inactive")
              proof["lifecycle"]=binding
              state=json.loads(SESSION.read_bytes())
              root=Path(state["checkout"])
              for expression,expected in (("HEAD",EXPECTED_SHA),("HEAD^{tree}",EXPECTED_TREE)):
                  if subprocess.check_output(["git","-C",str(root),"rev-parse",expression],text=True,timeout=5).strip()!=expected:
                      raise ValueError("recovery checkout differs from interrupted generation")
              subprocess.run(["git","-C",str(root),"diff","--quiet","HEAD","--"],check=True,timeout=5)
              sys.dont_write_bytecode=True
              guard=load_owner(root)
              proof["nativeFingerprint"]=(root/"build/.stamps/build-native").read_text().strip()
              if not re.fullmatch(r"[0-9a-f]{64}",proof["nativeFingerprint"]):
                  raise ValueError("successful source-bound native build fingerprint missing")
              for name in ("build-native","install-native"):
                  if (root/"build/.stamps"/name).read_text().strip()!=proof["nativeFingerprint"]:
                      raise ValueError("native generation stamp differs")
              proof["nativeBefore"]=guard.installed_native_hashes(root,PREFIX)
              proof["databaseBefore"]=guard.read_database(PG)
              query=EVIDENCE/"readonly-observation.sql"
              query.write_text(SQL)
              before=backend(query)
              proof["before"]=before
              row=before.get("backend")
              if not row or row.get("queryFingerprintMd5")!="b1337a4665ea7d85787b68c05e495823" or row.get("queryStart")!="2026-09-16T13:57:18.472508+00:00":
                  raise ValueError("stuck query changed; no recovery signal sent")
              if before.get("dataDirectory")!="/opt/laplace/pgdata/data" or before.get("postmasterStart")!="2026-09-16T13:56:42.997257+00:00":
                  raise ValueError("original cluster identity changed")
              sessions=before.get("sessions",[])
              if len(sessions)>=65 or any(s.get("backend_type")=="client backend" and s.get("pid")!=4123046 and (s.get("state") not in ("idle",None) or s.get("xact_start") is not None) for s in sessions):
                  raise ValueError("another active client transaction requires explicit reconciliation")
              current=unit()
              proof["unitBefore"]=current
              if current.get("Id")!=UNIT or current.get("LoadState")!="loaded" or current.get("ActiveState")!="active" or current.get("Restart")!="always":
                  raise ValueError("ordinary cluster resurrection owner differs")
              data=Path(before["dataDirectory"])
              if current.get("User")!=pwd.getpwuid(os.geteuid()).pw_name or data.stat().st_uid!=os.geteuid():
                  raise ValueError("current executor is not the installed cluster owner")
              oldpid=int(current["MainPID"])
              if oldpid<=1 or int((data/"postmaster.pid").read_text().splitlines()[0])!=oldpid:
                  raise ValueError("unit and data-directory postmaster identity differ")
              native_postgres=(PG/"bin/postgres").resolve(strict=True)
              if Path("/proc/"+str(oldpid)+"/exe").resolve(strict=True)!=native_postgres or Path("/proc/"+str(oldpid)).stat().st_uid!=os.geteuid():
                  raise ValueError("live postmaster executable or ownership differs")
              oldbirth=process_stat(oldpid)["startTicks"]
              pidfd=os.pidfd_open(oldpid)
              if gone(pidfd) or process_stat(oldpid)["startTicks"]!=oldbirth:
                  raise ValueError("postmaster changed before owner handle binding")
              proof["postmasterBefore"]={"pid":oldpid,"startTicks":oldbirth,"executable":str(native_postgres),"sha256":guard.digest(native_postgres)}
              announce("optional-bounded-existing-debugger")
              proof["backendStack"]=stack()
              save()
              # This is the existing rootless owner signal protocol, with a pidfd so a restarted/reused PID can never receive the second signal.
              announce("fast-shutdown-exact-owned-postmaster")
              started=time.monotonic()
              signal.pidfd_send_signal(pidfd,signal.SIGINT)
              fast=wait_exit(pidfd,10)
              proof["fastShutdownCompleted"]=fast
              if not fast:
                  announce("immediate-shutdown-same-owned-postmaster")
                  signal.pidfd_send_signal(pidfd,signal.SIGQUIT)
                  if not wait_exit(pidfd,15):
                      raise RuntimeError("old postmaster did not exit after documented immediate shutdown")
                  proof["immediateShutdownUsed"]=True
              else:
                  proof["immediateShutdownUsed"]=False
              announce("wait-existing-systemd-owner-and-database-readiness")
              deadline_at=time.monotonic()+120
              last_type=None
              after=None
              while time.monotonic()<deadline_at:
                  try:
                      observed=unit()
                      if observed.get("ActiveState")=="active" and int(observed.get("MainPID","0")) not in (0,oldpid):
                          value=backend(query)
                          if value.get("backend") is None and value.get("postmasterStart")!=before["postmasterStart"] and value.get("dataDirectory")==before["dataDirectory"]:
                              after=value
                              proof["unitAfter"]=observed
                              break
                  except (OSError,ValueError,RuntimeError,subprocess.SubprocessError) as error:
                      last_type=type(error).__name__
                  time.sleep(1)
              if after is None:
                  proof["lastReadinessErrorType"]=last_type
                  raise RuntimeError("ordinary cluster owner did not restore independent database readiness within bound")
              proof["restartToDatabaseReadySeconds"]=time.monotonic()-started
              proof["after"]=after
              announce("verify-exact-installed-native-extension-and-database-identity")
              proof["nativeAfter"]=guard.installed_native_hashes(root,PREFIX)
              proof["databaseAfter"]=guard.read_database(PG)
              if proof["nativeAfter"]!=proof["nativeBefore"]:
                  raise ValueError("installed native bytes changed during controlled recovery")
              left=dict(proof["databaseBefore"]);right=dict(proof["databaseAfter"])
              left.pop("postmaster_started",None);right.pop("postmaster_started",None)
              if left!=right:
                  raise ValueError("installed extension, migration, ROM or journal contract changed across recovery")
              proof["status"]="recovered"
              proof["nativeBytesUnchanged"]=True
              proof["exactBackendAbsent"]=True
              proof["pilotEligibilityUnresolvedRunningIngests"]=proof["databaseAfter"]["running_ingests"]
              announce("recovery-readback-complete")
          except BaseException as error:
              proof["status"]="failed"
              proof["errorType"]=type(error).__name__
              proof["error"]=str(error) if isinstance(error,ValueError) else "See bounded retained owner result; raw subprocess text omitted."
              save()
              raise
          finally:
              if pidfd is not None:
                  os.close(pidfd)
              save()
              print("POSTGRESQL_RECOVERY_RESULT "+json.dumps(proof,sort_keys=True),flush=True)
          signal.alarm(0)
          PY
      - name: Retain actual recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
