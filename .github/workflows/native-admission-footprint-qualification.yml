name: Read retained managed publication failure
on:
  push:
    branches: [qualify/native-admission-footprint-20260916]
permissions:
  contents: read
jobs:
  retained-managed-failure:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 5
    steps:
      - name: Read exact managed publication receipt and phase logs
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path("/build/laplace/recovery/chess-followthrough/35164475800-1")
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.suffix not in (".json",".log",".txt"):
                  continue
              if "tmp" in path.relative_to(root).parts:
                  continue
              raw=path.read_bytes()
              print("RETAINED_FILE "+json.dumps({"path":str(path.relative_to(root)),"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()}),flush=True)
              if len(raw)<=131072:
                  print(raw.decode("utf-8","replace"),flush=True)
              else:
                  print("[bounded final 128 KiB]\n"+raw[-131072:].decode("utf-8","replace"),flush=True)
          PY
