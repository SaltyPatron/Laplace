name: Native Highway implementation execution
on:
  push:
    branches: [fix/native-highway-pending-completion-20260915]
    paths: [.github/workflows/source-transfer.yml]
permissions:
  contents: read
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.implementation.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Commit the exact native implementation and remove this temporary workflow
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '00e847b371d4b0592221d5969845da0ea9246e90a13dd871d74b8c4a7b8e2945'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
          git rm .github/workflows/source-transfer.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Compute Highway refresh and stale-bit clearing through shared native batch machinery'
          git push origin HEAD:refs/heads/fix/native-highway-pending-completion-20260915
          printf 'source=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD
  native:
    needs: implement
    runs-on: [self-hosted, laplace]
    timeout-minutes: 60
    concurrency:
      group: laplace-shared-workspace
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ needs.implement.outputs.source }}
      LAPLACE_EXTERNAL: /build/external
      LAPLACE_INSTALL_PREFIX: /opt/laplace
      LAPLACE_PG_PREFIX: /opt/laplace/pgsql-18
      LAPLACE_DATA_ROOT: /vault/Data
      PGDATABASE: laplace
      PGHOST: /var/run/postgresql
      PGUSER: laplace_admin
      PGPORT: 5432
      MSBUILDDISABLENODEREUSE: '1'
      UseSharedCompilation: 'false'
    steps:
      - name: Build the implementation incrementally and execute native database behavior
        shell: bash
        run: |
          set -euo pipefail
          umask 0002
          evidence="/build/laplace/work/native-highway-${GITHUB_RUN_ID}"
          mkdir -p "$evidence"
          echo "NATIVE_HIGHWAY_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          flock --exclusive --close /build/laplace/work/host-resource.lock bash -euo pipefail <<'NATIVE' 2>&1 | tee "$evidence/execution.log"
          evidence="/build/laplace/work/native-highway-${GITHUB_RUN_ID}"
          git diff --binary > "$evidence/pre-checkout.patch"
          git fetch --no-tags --depth=2 origin "$TARGET_SHA"
          git checkout --force "$TARGET_SHA"
          git show --stat --oneline HEAD | tee "$evidence/source.txt"
          set +u
          source /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1
          set -u
          export LAPLACE_REGRESS_DB="laplace_pr_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          export CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)"
          export CTEST_PARALLEL_LEVEL="$(nproc)"
          export LD_LIBRARY_PATH="$PWD/build/engine/core:$PWD/build/engine/dynamics:$PWD/build/engine/synthesis:${LD_LIBRARY_PATH:-}"
          bash scripts/pipeline.sh build
          rc=0
          bash scripts/pr-db-proof.sh || rc=$?
          for name in laplace_geom laplace_substrate; do
            directory="build/extension/$name/tests/regress_output"
            if [[ -d "$directory" ]]; then
              mkdir -p "$evidence/$name"
              cp -a "$directory/." "$evidence/$name/"
            fi
          done
          if [[ -d build/test-results/operational-exemplar ]]; then
            cp -a build/test-results/operational-exemplar "$evidence/"
          fi
          printf 'NATIVE_HIGHWAY_EXECUTION source=%s database_exit=%s production_mutations=0\n' "$(git rev-parse HEAD)" "$rc"
          exit "$rc"
          NATIVE
      - name: Preserve actual native execution output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-highway-${{ github.run_id }}
          path: /build/laplace/work/native-highway-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
