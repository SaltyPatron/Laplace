name: PR — build and test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: laplace-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: PR — build and test
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, laplace]
    timeout-minutes: 120
    env:
      LAPLACE_EXTERNAL: ${{ vars.LAPLACE_EXTERNAL || '/build/external' }}
      LAPLACE_INSTALL_PREFIX: ${{ vars.LAPLACE_INSTALL_PREFIX || '/opt/laplace' }}
      LAPLACE_PG_PREFIX: ${{ vars.LAPLACE_PG_PREFIX || '/opt/laplace/pgsql-18' }}
      PGHOST: /var/run/postgresql
      PGPORT: 5432
      PGUSER: laplace_admin
      PGDATABASE: laplace
      LAPLACE_DATA_ROOT: /vault/Data
    steps:
      - name: Checkout exact pull request revision
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --prune --depth=2 origin "$TARGET_SHA"
          git checkout --force "$TARGET_SHA"

      - uses: ./.github/actions/setup-laplace-env

      - name: Build and test the product
        run: bash scripts/product-ci.sh test
