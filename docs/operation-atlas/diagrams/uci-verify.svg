 886.0 L870 910" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="552.0" y="879.0" font-family="sans-serif" font-size="13" fill="#244966">EOF / cancellation</text><rect x="70" y="30" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="220" y="55" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">verify --profile ID</text><text x="220" y="74" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">optional --configuration FILE</text><rect x="70" y="140" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="220" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Resolve configuration path</text><text x="220" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">CLI → environment → app directory</text><rect x="70" y="250" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="220" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Read config / resolve profile</text><text x="220" y="294" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Connections.OpenAsync [collapsed]</text><rect x="70" y="360" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="220" y="385" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Set cancellation timeout</text><text x="220" y="404" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">120 seconds after connection opens</text><rect x="70" y="470" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="220" y="495" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Send uci</text><text x="220" y="514" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Read until uciok</text><rect x="70" y="580" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="220" y="605" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Send isready</text><text x="220" y="624" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Read until readyok</text><rect x="70" y="690" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="220" y="715" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Send ucinewgame; isready</text><text x="220" y="734" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Read until readyok</text><rect x="70" y="800" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="220" y="825" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">position startpos; go depth 1</text><text x="220" y="844" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Read until bestmove</text><rect x="70" y="910" width="300" height="62" rx="8" fill="#fff0d8" stroke="#98a9b8"/><text x="220" y="935" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">bestmove 0000 or (none)?</text><text x="220" y="954" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Exact sentinel check</text><rect x="70" y="1040" width="300" height="62" rx="8" fill="#dcefe7" stroke="#98a9b8"/><text x="220" y="1065" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Write verification JSON</text><text x="220" y="1084" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">profile, implementation, time, lines</text><rect x="720" y="910" width="300" height="62" rx="8" fill="#ffe5e4" stroke="#98a9b8"/><text x="870" y="935" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Exception / closed stream / cancel</text><text x="870" y="954" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Report error to stderr; exit 1</text></svg>