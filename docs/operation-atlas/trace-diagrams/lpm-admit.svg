eSQL admission is a different path.</text></g><g class="footer" data-source-line="34"><text x="493.089" y="931.602" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="499.751" y="944.18" fill="#888" font-size="10" textLength="372.427">claimed. Admission branches, entity table, feature posting and exact-byte text cache</text><text x="479.192" y="956.758" fill="#888" font-size="10" textLength="413.545">reviewed. UTF8 acceptance follows Native generalized decoder behavior. Binary composition</text><text x="498.926" y="969.336" fill="#888" font-size="10" textLength="374.077">does not preserve an explicit child list here. Allocation failures may abort the process</text><text x="515.606" y="981.914" fill="#888" font-size="10" textLength="340.718">or return failure; no transactional rollback surrounds partial memory changes.</text></g><?plantuml-src RLNBRYCt4BpFLpIGGxo0BTlQzLE7mF43ky3QSEBT3-WXUoJ2C-I0v4ZMdl8H-S9yIQevibPsSfDcoAxggkgUN-bswQnu8vVqbVkMZHpSNpyUUivkAOTjtqqCFNs-cfwSah3zD9r-d3R6Nd1TSorJUs6RfhwONXmT7PsUcUEJynF-A7RQN9n-giqPdpPdvp8zEpe-aNDRfMVdUuxSKStcUHx3uErrQ4EaN-wkxgxlxdPEf0NRi79-JWstINRUM6buQFDTyFc1Ew4dzkb9eckgx78hT1_iq7AarjMWJ__yzJUrmN1B1ZV4Ps9loGOpTFed63F4g08Gsywbv8AlKkQOAzVGtctNvpNLwopfjm-K5-9fRotfGqMNVqeUegSV4WEjN5w40QMtXMSLfHpwIhm5CnnEagaHnXr9CnBFDRYQqBPYCZ1d18Wy8fLoz50ieE_VxixHimbMugnmAa-q2PEMXpajAGrDurxUyxiENH-IKEEajMcVObYbSgrnG2uGLbhNkIoM86tI-WAjts148C-z-u4pSwZVGLXUickL_dl4HosYCfieMIYjVUONob5aXgSZ6xDmhIsL7To82PuvU9Fb9LFgOULR3kyXlgE4lB391whKUCsmMGWXHHl5L2m5SqNNKexsQkSvhhN4FVU8ibaKhMd9xO0wWRAJU53CLAdx07gb-MXXvULdJWj0m0C8yUK63YhzEQxmKYBFjMsy1aXMUzLiBKZ1Yrv_H3Po7FmpZ4V7wndvC4fnm37o6aXpbt9afOpIQDebgYDxivYzPkZAsasHJOvcUDRtUBkJkzr05u-_tEnJcMjzYv-S5_kO3IzZ68e81fE8n5xUY1twrXaqyOgXpPQ3R7Uc1kfcp6RIEowzYRAVgpP8G3ceMTi1oY5ZccTeTpixiwhCIGinzLJ8ENJLRL69SgdyB6jeiQRZqz7qBpTQe0S_3IwKtS8b22z-KjtyLuo4Anr3sIIwHb16biZLIiCrYggDTfpDOb9f5NBA6xKn5yML8fB4VLYdaCW822k83gxhWbzh1f7-93uDe9BHDk