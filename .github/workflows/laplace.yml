name: Product — main delivery
run-name: "Deliver main — staging on hart-server, then production: built on hart-cloud, hosted on hart-prod — ${{ github.sha }}"

# Every merge to main is built, installed, migrated and published on hart-server (the machine Laplace-Operations
# declares; the staging host) by this repository's runner (Laplace-Operations' agents.sh: labels laplace,Laplace,
# staging; no sudo), with deploy/linux/site.sh: the engine and extensions against the Operations cluster, the database
# laplace-mono, the API + SPA at /opt/laplace/app behind nginx :8080. The machine's root part is
# deploy/linux/site-host.sh, run once by a person. Seeding is not part of a push: dispatch this workflow with `seed`.
#
# When that delivery has read back on hart-server, the same revision goes to production, in two jobs on two hosts.
# The knowledge host, hart-cloud (a Google Compute c3, Sapphire Rapids: the AVX-512 machine, the knowledge database
# and the compiler; runner label knowledge), builds, installs, migrates and stages, and hands the staged app with its
# native closure and perf-caches on as an artifact. The hosting host, hart-prod (a small always-on machine with the
# API, MCP and the Cloudflare tunnel, and the application's own database; runner label production), receives it,
# publishes and restarts. The build job waits for the `production` environment's required reviewer. Each host is its
# own concurrency group, one delivery at a time.
#
# The earlier delivery chain (product-stage.yml over scripts/pipeline.sh) assumes the decommissioned layout (a /build
# volume, /opt/laplace/pgsql-18, laplace_admin, sudo -n); it stays callable from full-qualification.yml by dispatch.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "vault-data-inventory.tsv"
      - "vault-data-directories.list"
  workflow_dispatch:
    inputs:
      seed:
        description: "after the deploy: none; foundation (ensure-foundation.sh into laplace-mono); reset-foundation (laplace-mono dropped, made again, migrated, then the foundation)"
        type: choice
        options: [none, foundation, reset-foundation]
        default: none

permissions:
  contents: read

concurrency:
  group: laplace-site-hart-server
  cancel-in-progress: false

jobs:
  deliver:
    name: Staging — build, migrate, publish, read back on hart-server
    runs-on: [self-hosted, laplace, Laplace, staging]
    timeout-minutes: 240
    env:
      LAPLACE_CONNINFO: ""
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Externals and build (engine, perf-caches, extensions)
        run: deploy/linux/site.sh externals build

      - name: Install into /opt/laplace
        run: deploy/linux/site.sh install

      - name: Database laplace-mono, extensions updated in place, migrations
        run: |
          if [ "${{ inputs.seed }}" = reset-foundation ]; then deploy/linux/site.sh reset; fi
          deploy/linux/site.sh database extensions migrate

      - name: Stage the API + SPA, publish, restart
        run: deploy/linux/site.sh app publish restart

      - name: Seed (dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed != 'none' }}
        run: deploy/linux/site.sh seed

      - name: Read back
        run: deploy/linux/site.sh smoke

  production-build:
    name: Production — built, migrated and staged on the knowledge host (hart-cloud), after approval
    needs: deliver
    runs-on: [self-hosted, laplace, Laplace, knowledge]
    environment: production
    timeout-minutes: 240
    concurrency:
      group: laplace-site-knowledge
      cancel-in-progress: false
    env:
      LAPLACE_CONNINFO: ""
    outputs:
      bundle: ${{ steps.bundle.outputs.path }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Externals and build (engine, perf-caches, extensions)
        run: deploy/linux/site.sh externals build

      - name: Install into /opt/laplace
        run: deploy/linux/site.sh install

      - name: Database laplace-mono, extensions updated in place, migrations (the application database too, LAPLACE_APP_DB)
        run: |
          if [ "${{ inputs.seed }}" = reset-foundation ]; then deploy/linux/site.sh reset; fi
          deploy/linux/site.sh database extensions migrate

      - name: Stage the API + SPA and bundle them for the hosting host
        run: deploy/linux/site.sh app bundle

      - name: Seed (dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed != 'none' }}
        run: deploy/linux/site.sh seed

      - name: Where the bundle is
        id: bundle
        run: echo "path=${LAPLACE_SITE_WORK:-${LAPLACE_WORK:-/repos/work}/mono-site}/bundle" >> "$GITHUB_OUTPUT"

      - name: Hand the bundle to the hosting host
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-site-${{ github.sha }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  production:
    name: Production — received, published and restarted on the hosting host (hart-prod)
    needs: production-build
    runs-on: [self-hosted, laplace, Laplace, production]
    timeout-minutes: 60
    concurrency:
      group: laplace-site-hart-prod
      cancel-in-progress: false
    env:
      LAPLACE_CONNINFO: ""
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Where the bundle goes
        id: bundle
        run: |
          b="${LAPLACE_SITE_WORK:-${LAPLACE_WORK:-/repos/work}/mono-site}/bundle"; rm -rf "$b"; mkdir -p "$b"
          echo "path=$b" >> "$GITHUB_OUTPUT"

      - name: Receive the bundle from the knowledge host
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: laplace-site-${{ github.sha }}
          path: ${{ steps.bundle.outputs.path }}

      - name: Receive, publish, restart
        run: deploy/linux/site.sh receive publish restart

      - name: Read back
        run: deploy/linux/site.sh smoke
