itter-grammars/tree-sitter-cuda","revision":"48b066f334f4cf2174e05a50218ce2ed98b6fd01","url":"https://github.com/theHamsta/tree-sitter-cuda"},{"archive_sha256":"9ee2adf4cd9d89ffe6b30667840e8bc8c93d4779a3d469343160ae566bf6fac0","name":"tree-sitter-grammars/tree-sitter-glsl","revision":"24a6c8ef698e4480fecf8340d771fbcb5de8fbb4","url":"https://github.com/theHamsta/tree-sitter-glsl"},{"archive_sha256":"acaec9fc582ecb0f5ee2edd5d5a05faddf21d06f3e57e8e6d3fff36fbfcec8eb","name":"tree-sitter-grammars/tree-sitter-hlsl","revision":"bab9111922d53d43668fabb61869bec51bbcb915","url":"https://github.com/theHamsta/tree-sitter-hlsl"},{"archive_sha256":"cee8be578765d4c082824869d521d5e9f075bc5c0a27680690431c1d9f8c09d7","name":"tree-sitter-grammars/tree-sitter-wgsl","revision":"40259f3c77ea856841a4e0c4c807705f3e4a2b65","url":"https://github.com/szebniok/tree-sitter-wgsl"},{"archive_sha256":"883146ffc05a42a70c2183f09676a061183c4f8af134b1628547dc8e045b41a1","name":"tree-sitter-grammars/tree-sitter-fortran","revision":"7edacd2b21aa80057d9725384a1304a1c758e0f8","url":"https://github.com/stadelmanma/tree-sitter-fortran"},{"archive_sha256":"70c098fca7cfd5d8b6f085ead2241bd752ccf84f6e4bee5913f0dd445fff6e39","name":"tree-sitter-grammars/tree-sitter-asm","revision":"839741fef4dab5128952334624905c82b40c7133","url":"https://github.com/RubixDev/tree-sitter-asm"},{"archive_sha256":"55aff257f5ba972e22afc77d323dbcce226bad70911e56b5c554b5ce83620b54","name":"tree-sitter-grammars/tree-sitter-nasm","revision":"d1b3638d017f2a8585e26dcfc66fe1df94185e30","url":"https://github.com/naclsn/tree-sitter-nasm"},{"archive_sha256":"dfb2d777259df8ad130b5a92af1944133e33fb93309f599b8e2125229ec49189","name":"tree-sitter-grammars/tree-sitter-llvm","revision":"2914786ae6774d4c4e25a230f4afe16aa68fe1c1","url":"https://github.com/benwilliamgraham/tree-sitter-llvm"},{"archive_sha256":"2ccb2012891665dfb71c7c46f4b5233cda31c3c71075932bd0ab106422ade47c","name":"tree-sitter-grammars/tree-sitter-mlir","revision":"f234edcdab9a10ee744