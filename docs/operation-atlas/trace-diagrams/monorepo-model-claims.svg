#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="27"><rect x="22" y="1068.372" width="535.301" height="80.438" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="27" y="1087.905" fill="#000" font-size="14" textLength="324.468">Native significance contract names z >= sqrt(2 ln N).</text><text x="27" y="1105.515" fill="#000" font-size="14" textLength="525.301">This wrapper consumes native pages; it does not independently verify that threshold.</text><text x="27" y="1123.124" fill="#000" font-size="14" textLength="401.557">Low or negative scores do not become refutation in this wrapper.</text><text x="27" y="1140.733" fill="#000" font-size="14" textLength="426.419">Receipt/context IDs use formatted-string Hash128.OfCanonical calls.</text></g><g class="footer" data-source-line="33"><text x="96.774" y="1172.19" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="99.287" y="1184.769" fill="#888" font-size="10" textLength="380.728">claimed. Complete EmitSignificantClaims and context/calculation ID helpers reviewed.</text><text x="88.723" y="1197.347" fill="#888" font-size="10" textLength="401.855">Native pair construction and numeric correctness remain nested. The managed layer trusts</text><text x="125.122" y="1209.925" fill="#888" font-size="10" textLength="329.058">native column/score array shape and indices beyond normal array access.</text><text x="99.57" y="1222.503" fill="#888" font-size="10" textLength="380.161">TestimonyWidthPerCircuit returns zero but does not disable this significance-emission</text><text x="98.469" y="1235.081" fill="#888" font-size="10" textLength="382.363">path. Analyzer version is 10; no marker probe or marker write occurs in this EmitAsync</text><text x="277.419" y="1247.659" fill="#888" font-size="10" textLength="24.463">body.</text></g><?plantuml-src LLJDRXit4BxlKmpG