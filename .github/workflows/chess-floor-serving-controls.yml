name: Qualify recording runtime scope
on:
  push:
    branches: ['verify/chess-floor-serving-controls-20260916']
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Qualify exact recording runtime scope without a database
        shell: bash
        run: |
          set -euo pipefail
          work="/build/laplace/work/recording-scope-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo install -d -m 0775 -o "$(id -u)" -g "$(id -g)" "$work"
          export TMPDIR="$work/tmp" TMP="$work/tmp" TEMP="$work/tmp"
          mkdir -p "$TMPDIR" "$work/source"
          cd "$work/source"
          git init -q
          git remote add origin https://github.com/SaltyPatron/Laplace.git
          git fetch --no-tags --depth=1 origin 1c52b4d8baef263e393962c1ba27100ce898e217
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = '1c52b4d8baef263e393962c1ba27100ce898e217'
          test "$(git rev-parse HEAD^{tree})" = '1ec74fb926b51805a169be5aa1c0b97d3cf258b3'
          python3 -B - <<'PY'
          import ast,pathlib
          for name in ("check-application-runtime.py","test-application-runtime.py","measure-installed-chess-corpus.py","test-installed-chess-corpus.py"):
              ast.parse(pathlib.Path("scripts",name).read_text())
          print("AST4_PASS")
          PY
          timeout 180s python3 -B scripts/test-application-runtime.py -v
          timeout 180s python3 -B scripts/test-installed-chess-corpus.py -v
          test -z "$(git status --porcelain --untracked-files=no)"
          echo RECORDING_SCOPE_QUALIFIED
