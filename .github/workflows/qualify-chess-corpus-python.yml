name: Qualify corpus Python controls

on:
  push:
    branches: [qualify/chess-corpus-python-*]

permissions:
  contents: read

jobs:
  controls:
    name: Actual Stockfish scope and retained-admission controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e1f837d2a949cf5d3c100420b6a1760d915cb82a
          fetch-depth: 1
          persist-credentials: false
      - name: Execute exact intended production scope controls
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          [[ "$(git write-tree)" == "92dad97891a693f377fcfd0d3b35aa3ad7fd5cd8" ]]
          python3 --version
          python3 scripts/test-stockfish-corpus.py -v
          python3 scripts/test-chess-acceptance.py -v
