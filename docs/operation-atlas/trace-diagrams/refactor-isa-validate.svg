 x="103.035" y="393.36" fill="#000" font-size="12" textLength="376.184">Require known type, exact flags, zero reserved, count at most capacity</text><rect x="94.356" y="434.579" width="393.541" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="104.356" y="457.036" fill="#000" font-size="12" textLength="373.541">Validate capacity span: data, stride, multiplication and pointer overflow</text><polygon points="258.11,313.984,324.143,313.984,336.143,325.984,324.143,337.984,258.11,337.984,246.11,325.984,258.11,313.984" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="295.126" y="349.403" fill="#000" font-size="11" textLength="17.118">yes</text><text x="258.11" y="330.485" fill="#000" font-size="11" textLength="66.032">More values?</text><text x="233.875" y="323.567" fill="#000" font-size="11" textLength="12.235">no</text><rect x="106.702" y="568.592" width="368.85" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="116.702" y="591.049" fill="#000" font-size="12" textLength="348.85">Check flags and register indices; forbid same input/output register</text><rect x="166.734" y="623.686" width="248.785" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="176.734" y="646.143" fill="#000" font-size="12" textLength="228.785">Binary-search operation registry by opcode</text><rect x="84.354" y="687.361" width="413.545" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="94.354" y="709.818" fill="#000" font-size="12" textLength="393.545">Check introduced minor version, instruction version and input/output types</text><rect x="190.412" y="742.455" width="201.43" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="200.412" y="764.912" fill="#000" font-size="12" textLength="181.43">Invoke operation-specific validator</text><polygon points="246.192,511.673,336.061,511.673,348.061,523.673,336.061,535.673,246.192,535.673,234.192,523.673,246.192,511.673" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="295.126" y="547.092" fill="#000" font-size="11" textLength="17.118">yes</text><text x="246.192" y="528.174" fill="#000" font-size="11" textLength="89.869">More instructions?</text><text x="221.957" y="521.256" fill="#000" font-size="11" textLength="12.235">no</text><rect x="113.686" y="819.549" width="354.881" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="123.686" y="842.006" fill="#000" font-size="12" textLength="334.881">Check each output capacity range against its input count range</text><rect x="121.353" y="874.643" width="339.547" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="131.353" y="897.1" fill="#000" font-size="12" textLength="319.547">Check pairwise output/output and both output/input overlaps</text><rect x="252.782" y="929.736" width="76.689" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="262.782" y="952.193" fill="#000" font-size="12" textLength="56.689">Return OK</text><ellipse cx="291.126" cy="995.83" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="291.126" cy="995.83" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="291.126" y1="73.609" x2="291.126" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="287.126,83.609,291.126,93.609,295.126,83.609,291.126,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="291.126" y1="128.703" x2="291.126" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="287.126,138.703,291.126,148.703,295.126,138.703,291.126,142.703" fi