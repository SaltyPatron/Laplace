          {"path":"scripts/test-pipeline-install.py","mode":"100755","sha":"da4fa8fb9a138761880ae71cb19222b4464e361a","basis":"a34cef660d9b10eb34161cc83bf83f21b4eebbba","patch":"--- a/scripts/test-pipeline-install.py\n+++ b/scripts/test-pipeline-install.py\n@@ -112,0 +113 @@\n+        self.assertIn(\"--desktop-stockfish \" + str(sources[0] / \"src/stockfish\"), checks[0])\n"},
          {"path":"scripts/test-postgresql-release.py","mode":"100755","sha":"665a409b35198327466c3b7e2107fcfd725a3264","basis":"b72a28cc3bb929c1ad65be92ec4e34171b95e02b","patch":"--- a/scripts/test-postgresql-release.py\n+++ b/scripts/test-postgresql-release.py\n@@ -146 +146 @@\n-        for name in (\"build-system-deps.sh\", \"postgresql-release.py\"):\n+        for name in (\"build-system-deps.sh\", \"postgresql-release.py\", \"provision-cmake.py\"):\n@@ -148,0 +149,4 @@\n+        # The merged dependency owner selects CMake before rebuilding PostgreSQL.\n+        # Use its real local receipt verifier with the existing compiler process double.\n+        cmake_release = json.loads((ROOT / \"deploy/cmake-release.json\").read_text())\n+        (project / \"deploy/cmake-release.json\").write_text(json.dumps(cmake_release))\n@@ -158 +162,3 @@\n-        cmake = doubles / \"cmake\"\n+        generation = prefix / \"tools/cmake\" / cmake_release[\"version\"]\n+        (generation / \"bin\").mkdir(parents=True)\n+        cmake = generation / \"bin/cmake\"\n@@ -161 +167,3 @@\n-            \"import os\\nfrom pathlib import Path\\n\"\n+            \"import os, sys\\nfrom pathlib import Path\\n\"\n+            \"if sys.argv[1:] == ['--version']:\\n\"\n+            \" print('cmake version \" + cmake_release[\"version\"] + \"'); raise SystemExit(0)\\n\"\n@@ -172,0 +181,10 @@\n+        for tool in (\"ctest\", \"cpack\"):\n+            executable = generation / \"bin\" / tool\n+            executable.write_text(\"#!/bin/sh\\nprintf '%s\\\\n' '\" + tool + \" version \" + cmake_release[\"version\"] + \"'\\n\")\n+            executable.chmod(0o755)\n+        cmake_spec = importlib.util.spec_from_file_location(\n+            \"cmake_fixture_owner\", project / \"scripts/provision-cmake.py\")\n+        cmake_owner = importlib.util.module_from_spec(cmake_spec)\n+        cmake_spec.loader.exec_module(cmake_owner)\n+        (generation / cmake_owner.RECEIPT).write_text(json.dumps({\n+            \"schema\": \"laplace.cmake-install/v1\", \"release\": cmake_release,\n+            \"files\": cmake_owner.inventory(generation)}))\n"},
          {"path":"scripts/test-profiles.json","mode":"100644","sha":"906f655fba9032497ecd6705f56ed7b9d1122349","basis":"de42fc4d5715e9263f2e836a9060bb834f7690d0","patch":"--- a/scripts/test-profiles.json\n+++ b/scripts/test-profiles.json\n@@ -3,0 +4,16 @@\n+    {\n+      \"id\": \"policy-cmake-release\",\n+      \"profile\": \"policy\",\n+      \"owner\": \"build\",\n+      \"runner\": \"script\",\n+      \"command\": [\n+        \"python3\",\n+        \"scripts/test-cmake-release.py\"\n+      ],\n+      \"environment\": \"source-tree\",\n+      \"mutability\": \"none\",\n+      \"shared_substrate\": \"not-applicable\",\n+      \"blocking_authority\": \"policy\",\n+      \"timeout_class\": \"fast\",\n+      \"required\": true\n+    },\n"},
          {"path":"scripts/test-test-profile-registry.py","mode":"100755","sha":"e68a5a85eeabbeef5b9a1779f4447aedf960a31a","basis":"c566ddd063603679d221911a03cf3055f3423b25","patch":"--- a/scripts/test-test-profile-registry.py\n+++ b/scripts/test-test-profile-registry.py\n@@ -26,0 +27 @@\n+    \"policy-cmake-release\",\n"}],
          "source_parents":["514cf6b89d2ebaae7138430c8ca59b93539e93d4","9bc83896f922bbaad53269a9e79d1646c22dec22","7dfa44171d210c8b0dc3a67e7a8306548c9dd3f7","6a872dd6a77ace0028f0c67e7e8ce2a4ed27eefe","45eb311441372a41eb9f9b8e58b25a5de1292345"],
          "message":"Consolidate retained toolchain, desktop engines, serving and development storage work into main\n\nPreserve current source and original implementation histories. Combine selected CMake and PostgreSQL release owners with current cache/cancellation handling; integrate official CuteChess user-engine configuration; recover serving command budget and coherent development storage paths. Keep one-off diagnostics in the verified recovery archive rather than activating them in normal CI. Clarify mainline development and scope continuity in AGENTS.md.\n\nActual local checks: CMake 8, PostgreSQL release 8, pipeline install 26 and managed-host 18 passed; CuteChess 46 passed with one existing skip. Shell syntax and diff whitespace passed. No managed build or host mutation is claimed.\n\nThe entire reviewed tree is verified byte-for-byte before this commit is published. The temporary staging step is absent from the resulting tree.\n"}
          '''
          import json, os, pathlib, subprocess, tempfile
          plan = json.loads(PLAN_JSON)
          def git(*args, data=None, env=None):
              result = subprocess.run(['git', *args], input=data, text=True, capture_output=True,
                                      timeout=180, env=env)
              if result.returncode:
                  raise RuntimeError(f'{args[0]} failed: {result.stderr[-3000:]}')
              return result.stdout.strip()
          git('fetch', 'origin', '+refs/heads/*:refs/remotes/origin/*', '+refs/pull/*/head:refs/recovery/pulls/*')
          current = git('rev-parse', 'refs/remotes/origin/main')
          changed = git('diff', '--name-only', plan['base'], current).splitlines()
          if set(changed) - {'.github/workflows/repo-hygiene.yml'}:
              raise RuntimeError('Concurrent main source changes require reconciliation: ' + repr(changed))
          fd, index = tempfile.mkstemp(prefix='reviewed-tree-', dir=os.environ['RUNNER_TEMP'])
          os.close(fd); os.unlink(index)
          env = dict(os.environ, GIT_INDEX_FILE=index)
          try:
              git('read-tree', plan['base'], env=env)
              for entry in plan['entries']:
                  path, sha, mode = entry['path'], entry['sha'], entry['mode']
                  if 'patch' in entry:
                      git('update-index', '--add', '--cacheinfo', mode, entry['basis'], path, env=env)
                      git('apply', '--cached', '--unidiff-zero', '--whitespace=nowarn', '-', data=entry['patch'], env=env)
                      if git('rev-parse', ':' + path, env=env) != sha:
                          raise RuntimeError('Patched blob differs from reviewed source: ' + path)
                  else:
                      git('cat-file', '-e', sha)
                  git('update-index', '--add', '--cacheinfo', mode, sha, path, env=env)
              tree = git('write-tree', env=env)
              if tree != plan['expected_tree']:
                  raise RuntimeError('Complete resulting tree differs from reviewed source')
              git('config', 'user.name', 'GitHub Actions source consolidation')
              git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              args = ['commit-tree', tree, '-p', current]
              for parent in plan['source_parents']:
                  git('cat-file', '-e', parent + '^{commit}'); args.extend(['-p', parent])
              commit = git(*args, data=plan['message'])
              tag = 'branch-integration/' + tree
              if git('ls-remote', 'origin', 'refs/tags/' + tag + '^{}'):
                  raise RuntimeError('A candidate already exists for this exact tree; read it rather than replace it')
              git('tag', '-a', tag, commit, '-m', 'Reviewed cumulative source tree; main advanced separately after readback.')
              git('push', 'origin', 'refs/tags/' + tag)
              if git('ls-remote', 'origin', 'refs/tags/' + tag + '^{}').split()[0] != commit:
                  raise RuntimeError('Candidate tag readback failed')
              print('REVIEWED_INTEGRATION ' + json.dumps({'base':current,'commit':commit,'tree':tree,'tag':tag,'files':len(plan['entries'])}), flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f'\nReviewed source candidate `{commit}`, tree `{tree}`, tag `{tag}`. Main not moved by this step.\n')
          finally:
              pathlib.Path(index).unlink(missing_ok=True)
          PYTREE
