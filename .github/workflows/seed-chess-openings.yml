name: Seed — chess openings

on:
  workflow_dispatch:
    inputs:
      path:
        description: "override $LAPLACE_DATA_ROOT/Games/Chess/openings"
        type: string
        default: ""
      database:
        description: "target database"
        type: choice
        options: [laplace]
        default: laplace

permissions:
  contents: read

jobs:
  resolve:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 2
    outputs:
      path: ${{ steps.pick.outputs.path }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          p='${{ inputs.path }}'
          [[ -n "$p" ]] || p="${LAPLACE_DATA_ROOT:-/vault/Data}/Games/Chess/openings"
          [[ -e "$p" ]] || { echo "::error::$p does not exist"; exit 1; }
          echo "path=$p" >> "$GITHUB_OUTPUT"

  seed:
    needs: resolve
    uses: ./.github/workflows/_ingest.yml
    with:
      source: openings
      path: ${{ needs.resolve.outputs.path }}
      database: ${{ inputs.database }}
      timeout_minutes: 720
