="stroke:#181818;stroke-width:1;"/><polygon points="385.321,764.324,389.321,774.324,393.321,764.324,389.321,768.324" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="389.321" y1="983.605" x2="389.321" y2="1003.605" style="stroke:#181818;stroke-width:1;"/><polygon points="385.321,993.605,389.321,1003.605,393.321,993.605,389.321,997.605" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="33"><text x="208.472" y="1044.986" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="209.307" y="1057.564" fill="#888" font-size="10" textLength="384.082">claimed. Both transport bodies reviewed. Installed grammar does not imply an installed</text><text x="201.243" y="1070.143" fill="#888" font-size="10" textLength="400.21">verifier. Chat permits additional blank user messages but exactly one nonblank one. JSON</text><text x="210.701" y="1082.721" fill="#888" font-size="10" textLength="381.294">parse errors fall through; valid non-object JSON/property-type errors are not all caught</text><text x="204.858" y="1095.299" fill="#888" font-size="10" textLength="392.979">by its JsonException catch. Code construction receives no tenant/session argument from</text><text x="297.683" y="1107.877" fill="#888" font-size="10" textLength="207.329">these calls; billing resolution remains separate.</text></g><?plantuml-src fLLDSzis4BtpLs2cXoG7wuCKAKewT1mrRfgfdKpioRMp19OIQWXW052EUkgFw2_iB-a39SToqbDxa8OYTj--VViMUY7UxBLYAtafVgNEaEGnTTtuz3nwOrNdj8rXzBvZU_dBskqwYkErKtoDZrblALvhfGm_aEUH3EBsxMLULYANSZgRALhCcvoQQJNdMRLeciMyc2zKFftXiw15dTUrAkLqKTUBiixpggwhQLwLrInxyT-PFHqzyP7rjAqhcYXMatRUb6NRpgQBV5BE2bdCYCggaFM2QrLLHJxbadEQpylfj9MbAbkf_W-V3uOEx6_PxxKyrwXGLJ5R5CMaBIUSpukyhif9Eu4qpOIBN55LvXLFPchM5cLJyuJah6YuoKjgAw995kwrxSZJJZGaxpVUzLQjdN5U_71rURM-kZgB25jIxa7RZMZ913uxKTnIR-ALi_66