name: Seed — chess eval census

on:
  workflow_dispatch:
    inputs:
      database:
        description: "target database"
        type: choice
        options: [laplace]
        default: laplace

permissions:
  contents: read

jobs:
  seed:
    uses: ./.github/workflows/seed-chess.yml
    with:
      source: chess-eval
      corpus: lumbras-elite
      database: ${{ inputs.database }}
      derive_after_games: false
      run_idempotency: false
