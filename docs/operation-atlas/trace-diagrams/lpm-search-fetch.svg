<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:849px;height:724px;background:#FAFCFF;" width="849px" height="724px" viewBox="0 0 849 724" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="849" height="724" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="5"><text x="212.529" y="34.533" fill="#000" font-size="14" textLength="422.03" font-weight="700">Modular liblpm — local search, lookup and bounded child fetch</text></g><ellipse cx="452.408" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="405.932,93.609,498.884,93.609,510.884,105.609,498.884,117.609,405.932,117.609,393.932,105.609,405.932,93.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="405.932" y="110.11" fill="#000" font-size="11" textLength="92.952">Search requested?</text><text x="376.814" y="103.192" fill="#000" font-size="11" textLength="17.118">yes</text><text x="510.884" y="103.192" fill="#000" font-size="11" textLength="62.992">Lookup/fetch</text><rect x="85.053" y="127.609" width="318.166" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="95.053" y="150.066" fill="#000" font-size="12" textLength="298.166">Require nonzero result capacity and existing documents</text><rect x="97.721" y="182.703" width="292.83" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="107.721" y="205.16" fill="#000" font-size="12" textLength="272.83">Decompose query; collect and deduplicate features</text><rect x="43.703" y="237.797" width="400.865" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="53.703" y="260.254" fill="#000" font-size="12" textLength="380.865">Restore file/byte/composition/document counters; retain created entities</text><rect x="16" y="292.891" width="456.271" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="315.348" fill="#000" font-size="12" textLength="436.271">For each feature add document_count / posting_count to matching document rank</text><rect x="136.41" y="347.984" width="215.451" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="146.41" y="370.441" fill="#000" font-size="12" textLength="195.451">Count shared features per document</text><rect x="50.365" y="403.078" width="387.541" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="60.365" y="425.535" fill="#000" font-size="12" textLength="367.541">Select untaken positive-match documents by rank, then shared count</text><rect x="59.72" y="458.172" width="368.832" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="69.72" y="480.629" fill="#000" font-size="12" textLength="348.832">Emit at most caller capacity with document ID, path and metadata</text><rect x="492.271" y="127.609" width="336.816" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="502.271" y="150.066" fill="#000" font-size="12" textLength="316.816">Find exact ID in local hash table; missing returns minus one</text><rect x="525.939" y="182.703" width="269.48" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="535.939" y="205.16" fill="#000" font-size="12" textLength="249.48">Return coordinate, tier, Hilbert, seen and found</text><rect x="501.945" y="237.797" width="317.469" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="511.945" y="260.254" fill="#000" font-size="12" textLength="297.469">Return full child count; copy at most caller child capacity</text><polygon points="452.408,499.266,464.408,511.266,452.408,523.266,440.408,511.266,452.408,499.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="452.408" cy="554.266" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="452.408" cy="554.266" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="244.136" y1="162.703" x2="244.136" y2="182.703" style="stroke:#181818;stroke-width:1;"/><polygon points="240.136,172.703,244.136,182.703,248.136,172.703,244.136,176.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="244.136" y1="217.797" x2="244.136" y2="237.797" style="stroke:#181818;stroke-width:1;"/><polygon points="240.136,227.797,244.136,237.797,248.136,227.797,244.136,231.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="244.136" y1="272.891" x2="244.136" y2="292.891" style="stroke:#181818;stroke-width:1;"/><polygon points="240.136,282.891,244.136,292.891,248.136,282.891,244.136,286.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="244.136" y1="327.984" x2="244.136" y2="347.984" style="stroke:#181818;stroke-width:1;"/><polygon points="240.136,337.984,244.136,347.984,248.136,337.984,244.136,341.984" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="244.136" y1="383.078" x2="244.136" y2="403.078" style="stroke:#181818;stroke-width:1;"/><polygon points="240.136,393.078,244.136,403.078,248.136,393.078,244.136,397.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="244.136" y1="438.172" x2="244.136" y2="458.172" style="stroke:#181818;stroke-width:1;"/><polygon points="240.136,448.172,244.136,458.172,248.136,448.172,244.136,452.172" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="660.68" y1="162.703" x2="660.68" y2="182.703" style="stroke:#181818;stroke-width:1;"/><polygon points="656.68,172.703,660.68,182.703,664.68,172.703,660.68,176.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="660.68" y1="217.797" x2="660.68" y2="237.797" style="stroke:#181818;stroke-width:1;"/><polygon points="656.68,227.797,660.68,237.797,664.68,227.797,660.68,231.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="393.932" y1="105.609" x2="244.136" y2="105.609" style="stroke:#181818;stroke-width:1;"/><line x1="244.136" y1="105.609" x2="244.136" y2="127.609" style="stroke:#181818;stroke-width:1;"/><polygon points="240.136,117.609,244.136,127.609,248.136,117.609,244.136,121.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="510.884" y1="105.609" x2="660.68" y2="105.609" style="stroke:#181818;stroke-width:1;"/><line x1="660.68" y1="105.609" x2="660.68" y2="127.609" style="stroke:#181818;stroke-width:1;"/><polygon points="656.68,117.609,660.68,127.609,664.68,117.609,660.68,121.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="244.136" y1="493.266" x2="244.136" y2="511.266" style="stroke:#181818;stroke-width:1;"/><line x1="244.136" y1="511.266" x2="440.408" y2="511.266" style="stroke:#181818;stroke-width:1;"/><polygon points="430.408,507.266,440.408,511.266,430.408,515.266,434.408,511.266" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="660.68" y1="272.891" x2="660.68" y2="511.266" style="stroke:#181818;stroke-width:1;"/><line x1="660.68" y1="511.266" x2="464.408" y2="511.266" style="stroke:#181818;stroke-width:1;"/><polygon points="474.408,507.266,464.408,511.266,474.408,515.266,470.408,511.266" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="452.408" y1="73.609" x2="452.408" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="448.408,83.609,452.408,93.609,456.408,83.609,452.408,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="452.408" y1="523.266" x2="452.408" y2="543.266" style="stroke:#181818;stroke-width:1;"/><polygon points="448.408,533.266,452.408,543.266,456.408,533.266,452.408,537.266" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="21"><rect x="161.721" y="586.266" width="523.646" height="62.828" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="166.721" y="605.799" fill="#000" font-size="14" textLength="513.646">Search mutates the local entity table even though it adds no document occurrence.</text><text x="166.721" y="623.408" fill="#000" font-size="14" textLength="411.681">Ranking uses local feature rarity, not typed consensus confidence.</text><text x="166.721" y="641.018" fill="#000" font-size="14" textLength="502.66">This is distinct from native HTTP search over PostgreSQL holds and attestations.</text></g><g class="footer" data-source-line="26"><text x="230.668" y="672.475" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="224.003" y="685.053" fill="#888" font-size="10" textLength="399.082">claimed. lpm_search, lpm_lookup and lpm_fetch reviewed. Their callers choose capacities</text><text x="232.05" y="697.631" fill="#888" font-size="10" textLength="382.988">(Python fetch shows eight children). Container and realization helpers remain separate</text><text x="387.133" y="710.209" fill="#888" font-size="10" textLength="72.8