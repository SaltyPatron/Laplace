<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:676px;height:686px;background:#FAFCFF;" width="676px" height="686px" viewBox="0 0 676 686" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="676" height="686" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="5"><text x="139.348" y="34.533" fill="#000" font-size="14" textLength="395.616" font-weight="700">Modular liblpm — LPM1 file persistence and reconstruction</text></g><ellipse cx="339.818" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="324.223,93.609,355.413,93.609,367.413,105.609,355.413,117.609,324.223,117.609,312.223,105.609,324.223,93.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="324.223" y="110.11" fill="#000" font-size="11" textLength="31.19">Save?</text><text x="295.106" y="103.192" fill="#000" font-size="11" textLength="17.118">yes</text><text x="367.413" y="103.192" fill="#000" font-size="11" textLength="24.471">Load</text><rect x="16" y="127.609" width="317.48" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="150.066" fill="#000" font-size="12" textLength="297.48">Open target with wb; write LPM1 magic and version one</text><rect x="31.018" y="182.703" width="287.445" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="41.018" y="205.16" fill="#000" font-size="12" textLength="267.445">Write entity IDs, coordinates, Hilbert, seen and tier</text><rect x="60.021" y="237.797" width="229.438" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="70.021" y="260.254" fill="#000" font-size="12" textLength="209.438">Write document records and path bytes</text><rect x="66.37" y="292.891" width="216.74" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="76.37" y="315.348" fill="#000" font-size="12" textLength="196.74">Write entity-to-document posting lists</text><rect x="117.054" y="347.984" width="115.373" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="127.054" y="370.441" fill="#000" font-size="12" textLength="95.373">Close; return zero</text><rect x="369.494" y="127.609" width="270.805" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="379.494" y="150.066" fill="#000" font-size="12" textLength="250.805">Open file; require LPM1 magic and version one</text><rect x="425.867" y="182.703" width="158.059" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="435.867" y="205.16" fill="#000" font-size="12" textLength="138.059">Create tier-zero/text index</text><rect x="357.497" y="237.797" width="294.799" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="367.497" y="260.254" fill="#000" font-size="12" textLength="274.799">Reinsert serialized entities; restore seen and Hilbert</text><rect x="353.48" y="292.891" width="302.832" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="363.48" y="315.348" fill="#000" font-size="12" textLength="282.832">Recreate documents, paths, file count and byte totals</text><rect x="361.499" y="347.984" width="286.795" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="371.499" y="370.441" fill="#000" font-size="12" textLength="266.795">Restore postings; missing referenced entity aborts</text><rect x="444.538" y="403.078" width="120.717" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="454.538" y="425.535" fill="#000" font-size="12" textLength="100.717">Close; return index</text><polygon points="339.818,444.172,351.818,456.172,339.818,468.172,327.818,456.172,339.818,444.172" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="339.818" cy="499.172" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="339.818" cy="499.172" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="174.74" y1="162.703" x2="174.74" y2="182.703" style="stroke:#181818;stroke-width:1;"/><polygon points="170.74,172.703,174.74,182.703,178.74,172.703,174.74,176.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="174.74" y1="217.797" x2="174.74" y2="237.797" style="stroke:#181818;stroke-width:1;"/><polygon points="170.74,227.797,174.74,237.797,178.74,227.797,174.74,231.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="174.74" y1="272.891" x2="174.74" y2="292.891" style="stroke:#181818;stroke-width:1;"/><polygon points="170.74,282.891,174.74,292.891,178.74,282.891,174.74,286.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="174.74" y1="327.984" x2="174.74" y2="347.984" style="stroke:#181818;stroke-width:1;"/><polygon points="170.74,337.984,174.74,347.984,178.74,337.984,174.74,341.984" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="504.896" y1="162.703" x2="504.896" y2="182.703" style="stroke:#181818;stroke-width:1;"/><polygon points="500.896,172.703,504.896,182.703,508.896,172.703,504.896,176.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="504.896" y1="217.797" x2="504.896" y2="237.797" style="stroke:#181818;stroke-width:1;"/><p