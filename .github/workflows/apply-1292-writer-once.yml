          new_enqueue = '''    private async Task EnqueueFoldAsync(
        Dictionary<(Hash128 S, Hash128 T, Hash128? O), Delta> delta,
        Hash128? journalToken, Hash128? journalSource, CancellationToken ct)
    {
        await _foldDepth.WaitAsync(ct);
        Task dispatched;
        try
        {
            Interlocked.CompareExchange(
                ref _foldSpanStarted,
                System.Diagnostics.Stopwatch.GetTimestamp(),
                comparand: 0);
            dispatched = DispatchDeltaAsync(delta, ct);
        }
        catch
        {
            _foldDepth.Release();
            throw;
        }

        var tracked = ReleaseAndAcknowledge(dispatched);
        lock (_foldChainLock) _outstanding.Add(tracked);

        async Task ReleaseAndAcknowledge(Task fold)
        {
            try
            {
                await fold.ConfigureAwait(false);
                if (journalToken is { } token && journalSource is { } source)
                    await NpgsqlFoldJournal.MarkCompletedAsync(
                        _ds, token, source, CancellationToken.None).ConfigureAwait(false);
            }
            finally
            {
                _foldDepth.Release();
            }
        }
    }
