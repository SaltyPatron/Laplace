name: Product — main delivery
run-name: "Deliver main — ${{ github.sha }}"

on:
  push:
    branches: [main]
    paths-ignore:
      - "vault-data-inventory.tsv"
      - "vault-data-directories.list"
      - "docs/**"
      - "**/*.md"
      - ".github/**"
      - "scripts/api-diagnostics.py"
      - "web/scripts/capture-ui-diagnostics.mjs"
      - "scripts/ci-impact-plan.py"
      - "scripts/ci-qualification-cache.py"
      - "scripts/ci-product-freshness.py"
      - "scripts/ci_product_scope.py"
      - "scripts/ci_managed_projects.py"
      - "scripts/product-ci.sh"
      - "scripts/pipeline.sh"
      - "scripts/bootstrap-chess-lab.sh"
      - "scripts/check-deployed-revision.sh"
      - "scripts/test-parallel.sh"
      - "scripts/publish-applications.sh"
      - "scripts/db-migrations.sh"
      - "scripts/verify-api-payload.py"
      - "scripts/verify-application-release.py"
      - "scripts/check-application-runtime.py"
      - "scripts/check-database-health.sh"
      - "scripts/configure-laplace-environment.py"
      - "deploy/linux/deploy.sh"
      - "deploy/linux/payload-sync.sh"
      - "scripts/test-suites/**"
      - "scripts/test-*.py"
      - "scripts/test-*.sh"
      - "scripts/tests/**"
      - "web/scripts/test-*.mjs"
      - "web/scripts/verify-*.mjs"
      - "web/e2e/**"
      - "scripts/test-workflow-architecture.py"
      - "scripts/test-seed-workflow-ownership.py"
      - "scripts/test-product-ci-artifact-ownership.py"
      - "scripts/test-benchmark-suite.py"
      - "scripts/validate-pipeline.py"
      - "scripts/setup-host.sh"
permissions:
  contents: read

# A main push is one product story. Read-only qualification is cancellable inside
# the reusable stage owner; once delivery starts its own concurrency group is
# non-preemptible. There is deliberately no workflow-level concurrency here,
# because workflow-level cancellation would also kill a delivery already mutating
# the installed product.
jobs:
  plan:
    name: Plan affected product work
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dev_suites: ${{ steps.plan.outputs.dev_suites }}
      db_suites: ${{ steps.plan.outputs.db_suites }}
      live_suites: ${{ steps.plan.outputs.live_suites }}
      delivery_actions: ${{ steps.plan.outputs.delivery_actions }}
      publish_scope: ${{ steps.plan.outputs.publish_scope }}
      components: ${{ steps.plan.outputs.components }}
      build_components: ${{ steps.plan.outputs.build_components }}
      managed_build_projects: ${{ steps.plan.outputs.managed_build_projects }}
      managed_test_projects: ${{ steps.plan.outputs.managed_test_projects }}
      managed_test_filter: ${{ steps.plan.outputs.managed_test_filter }}
      managed_db_test_filter: ${{ steps.plan.outputs.managed_db_test_filter }}
      managed_live_test_filter: ${{ steps.plan.outputs.managed_live_test_filter }}
      native_test_filter: ${{ steps.plan.outputs.native_test_filter }}
      native_db_test_filter: ${{ steps.plan.outputs.native_db_test_filter }}
      managed_db_test_projects: ${{ steps.plan.outputs.managed_db_test_projects }}
      managed_live_test_projects: ${{ steps.plan.outputs.managed_live_test_projects }}
      full_qualification: ${{ steps.plan.outputs.full_qualification }}
      changed_count: ${{ steps.plan.outputs.changed_count }}
    steps:
      - name: Check out exact revision with comparison history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Plan invalidated components and qualification suites
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci-impact-plan.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  mainline-qualification:
    name: Qualify affected product inputs
    needs: plan
    concurrency:
      group: ${{ needs.plan.outputs.delivery_actions != '' && 'laplace-main-product-qualification-dispatch' || format('laplace-main-test-qualification-{0}-{1}', needs.plan.outputs.dev_suites, needs.plan.outputs.managed_test_projects) }}
      cancel-in-progress: true
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: release-qualification
      target_sha: ${{ github.sha }}
      dev_suites: ${{ needs.plan.outputs.dev_suites }}
      build_components: ${{ needs.plan.outputs.build_components }}
      managed_build_projects: ${{ needs.plan.outputs.managed_build_projects }}
      managed_test_projects: ${{ needs.plan.outputs.managed_test_projects }}
      managed_test_filter: ${{ needs.plan.outputs.managed_test_filter }}
      native_test_filter: ${{ needs.plan.outputs.native_test_filter }}
      delivery_actions: ${{ needs.plan.outputs.delivery_actions }}
      publish_scope: ${{ needs.plan.outputs.publish_scope }}
      skip_if_superseded: true
    secrets: inherit

  mainline-delivery:
    name: Install, validate, publish, and activate exact candidate
    needs: [plan, mainline-qualification]
    # Always enter the delivery owner after successful qualification. The target
    # may be a test-only successor whose direct diff has no mutations while the
    # installed product is still behind an earlier product commit. The release
    # owner reconciles installed->target impact and no-ops when there is none.
    concurrency:
      group: laplace-main-delivery-dispatch
      cancel-in-progress: false
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: release-delivery
      target_sha: ${{ github.sha }}
      build_components: ${{ needs.plan.outputs.build_components }}
      managed_build_projects: ${{ needs.plan.outputs.managed_build_projects }}
      managed_db_test_projects: ${{ needs.plan.outputs.managed_db_test_projects }}
      managed_db_test_filter: ${{ needs.plan.outputs.managed_db_test_filter }}
      managed_live_test_projects: ${{ needs.plan.outputs.managed_live_test_projects }}
      managed_live_test_filter: ${{ needs.plan.outputs.managed_live_test_filter }}
      native_db_test_filter: ${{ needs.plan.outputs.native_db_test_filter }}
      delivery_actions: ${{ needs.plan.outputs.delivery_actions }}
      db_suites: ${{ needs.plan.outputs.db_suites }}
      live_suites: ${{ needs.plan.outputs.live_suites }}
      publish_scope: ${{ needs.plan.outputs.publish_scope }}
      skip_if_superseded: true
    secrets: inherit
