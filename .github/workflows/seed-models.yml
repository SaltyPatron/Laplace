name: Seed — models

# The model modality as a phase, uniform with the other seed-*.yml: a checkpoint is
# a witness like WordNet — its tensors assert token→token couplings that fold into
# consensus. Stages (each gates the next), the model-specific extension of the
# _ingest.yml ingest→idempotency→gate contract:
#   payload-preflight → ingest (token×token bilinear circuits) → payload-postflight
#     → idempotency → consensus-gates → ranked-mu query
#     → synthesize (substrate → GGUF) → verify GGUF
# Runs against the live seeded substrate — never nukes.
#
# NOTE: this box (hart-desktop) is the intended model processor — it holds the
# checkpoints (LAPLACE_MODEL_HUB=D:\Models\hub) and the compute; only the folded
# attestations cross the wire to hart-server. That requires hart-desktop registered
# as a self-hosted runner for this repo. Until then this workflow has no runner and
# will not start — expected. The operator path meanwhile is the CLI / Tony_Hart-*.bat
# with LAPLACE_PGHOST=hart-server (env.cmd), not a fallback script.

on:
  workflow_dispatch:
    inputs:
      model_dir:
        description: "HF snapshot dir to ingest + synthesize (blank = $LAPLACE_TINYLLAMA_DIR on the runner)"
        type: string
        default: ""
      database:
        description: "target DB (one database: laplace)"
        type: choice
        options: [laplace]
        default: laplace

# No GitHub concurrency group: a group retains only one pending run and is not
# a FIFO queue. Database serialization is enforced by the ingest mutex.
# Two of four died and needed manual re-runs hours later. A group that silently
# discards queued work is worse than no group: the ingest never started, so
# nothing warned anybody.
#
# Serialization now comes from the runner (one job at a time) plus the explicit
# wait below, which BLOCKS instead of cancelling.

permissions:
  contents: read

env:
  MODEL_DIR_INPUT: ${{ inputs.model_dir }}
  GGUF_OUT: /tmp/laplace-model-substrate-ci.gguf
  CLI: "dotnet run --project app/Laplace.Cli/Laplace.Cli.csproj -c Release --no-build --"
  LAPLACE_DB: "Host=/var/run/postgresql;Username=laplace_admin;Database=${{ inputs.database }}"
  PGDATABASE: ${{ inputs.database }}

jobs:
  ingest:
    name: Ingest — token×token bilinear circuits (onto the seeded DB, no nuke)
    runs-on: [self-hosted, laplace]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { submodules: false, clean: false }
      - uses: ./.github/actions/setup-laplace-env

      # This is the mutation boundary for the model-payload law. Generic code
      # policy may observe a historical violation, but must not let mutable live
      # data prevent unrelated repair code from deploying. A model ingest, on the
      # other hand, is not allowed to start on an already-invalid substrate or
      # leave one behind. --strict also makes an unreachable DB fail closed here.
      - name: Preflight — standing model payload satisfies shrink-only contract
        run: python3 scripts/model-payload-gate-check.py --strict --enforce

      - name: Ingest
        run: scripts/ingest-source.sh model "${MODEL_DIR_INPUT:-$LAPLACE_TINYLLAMA_DIR}"

      - name: Postflight — model ingest added no forbidden geometry payload
        run: python3 scripts/model-payload-gate-check.py --strict --enforce

  idempotency:
    name: Verify — re-ingest short-circuits (no double-counting)
    needs: ingest
    runs-on: [self-hosted, laplace]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { submodules: false, clean: false }
      - uses: ./.github/actions/setup-laplace-env
      - name: Re-ingest must short-circuit
        run: |
          out="$(scripts/ingest-source.sh model "${MODEL_DIR_INPUT:-$LAPLACE_TINYLLAMA_DIR}" 2>&1)"; echo "$out"
          echo "$out" | grep -qi "already ingested" || { echo "::error::re-ingest did not short-circuit — idempotency broken"; exit 1; }

  consensus-gates:
    name: Verify — model relation types + per-period fold + ranked-mu query
    needs: idempotency
    runs-on: [self-hosted, laplace]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { submodules: false, clean: false }

      - name: Gate relation types (consensus)
        run: |
          P(){ psql -d "$PGDATABASE" -U laplace_admin -v ON_ERROR_STOP=1 -tAc "$1"; }
          gate() {
            n=$(P "SELECT laplace.consensus_count(laplace.relation_type_id('$1'));")
            [ "${n:-0}" -ge "$2" ] || { echo "::error::consensus type $1 has ${n:-0} relations (need >= $2)"; exit 1; }
            echo "  ok $1 = $n consensus relations"
          }
          gate SIMILAR_TO       1000
          gate ATTENDS          1000
          gate OV_RELATES       1000
          gate COMPLETES_TO     1000

      - name: Verify consensus materialized by the ingest period fold
        run: |
          PSQL=(psql -d "$PGDATABASE" -U laplace_admin -v ON_ERROR_STOP=1 -tAc)
          cn=$("${PSQL[@]}" "SELECT count(*) FROM laplace.consensus;")
          fresh=$("${PSQL[@]}" "SELECT count(*) FROM laplace.consensus WHERE last_observed_at > now() - interval '1 day';")
          echo "consensus rows = $cn (touched this period: $fresh)"
          [ "${cn:-0}" -gt 0 ]    || { echo "::error::consensus empty — the ingest's per-period fold did not run"; exit 1; }
          [ "${fresh:-0}" -gt 0 ] || { echo "::error::no consensus rows touched this period — fold did not cover the model ingest"; exit 1; }

      - name: Ranked-mu SQL inference over consensus (no GPU)
        run: |
          PSQL=(psql -d "$PGDATABASE" -U laplace_admin -v ON_ERROR_STOP=1 -tAc)
          psql -d "$PGDATABASE" -U laplace_admin -v ON_ERROR_STOP=1 -c "SELECT * FROM laplace.top_relations_readable(10);"
          rows=$("${PSQL[@]}" "SELECT count(*) FROM laplace.top_relations_readable(10);")
          [ "${rows:-0}" -gt 0 ] || { echo "::error::ranked-mu query returned no rows"; exit 1; }
          echo "::notice::ranked-mu query OK — $rows top relations rendered readable"

  synthesize:
    name: Synthesize — substrate → GGUF, then verify
    needs: consensus-gates
    runs-on: [self-hosted, laplace]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { submodules: false, clean: false }
      - uses: ./.github/actions/setup-laplace-env

      - name: Synthesize
        run: |
          rm -f "$GGUF_OUT"
          out="$($CLI synthesize substrate "${MODEL_DIR_INPUT:-$LAPLACE_TINYLLAMA_DIR}/config.json" "$GGUF_OUT" 2>&1)"; echo "$out"
          echo "$out" | grep -qiE 'synthesis complete' || { echo "::error::synthesize did not complete"; exit 1; }
          echo "$out" | grep -qi 'basis generated' || { echo "::error::foundry basis generation did not run"; exit 1; }

      - name: Verify GGUF valid + non-trivial
        run: |
          [ -f "$GGUF_OUT" ] || { echo "::error::GGUF missing: $GGUF_OUT"; exit 1; }
          sz=$(stat -c%s "$GGUF_OUT")
          [ "$sz" -gt 50000000 ] || { echo "::error::GGUF too small ($sz bytes) — synthesis produced trivial output"; exit 1; }
          echo "::notice::GGUF OK — $((sz/1048576)) MB at $GGUF_OUT"

      # A 50 MB file of zeros passes the size check. These two do not.
      #
      # STRUCTURAL: no tensor entirely zero, no projection whose rows are identical.
      # This is what catches a declared operator that reached the compiler and was then
      # scaled to nothing (the compile=continuation default), a constant FFN gate, and
      # hub collapse. Needs only the artifact, so it is unconditional.
      - name: Gate — GGUF is structurally non-degenerate
        run: |
          python3 scripts/verify-gguf-nondegenerate.py --model "$GGUF_OUT" \
            --report /tmp/laplace-gguf-nondegenerate.json

      # BEHAVIORAL: the expected continuations come from the substrate's OWN consensus,
      # so a passing model demonstrably carries the knowledge it claims to transcribe.
      # This harness existed and was never invoked by any workflow, which left "the file
      # is over 50 MB" as the entire synthesis gate — the SIMULATED success its own
      # header names as the project's defining failure mode.
      - name: Gate — model carries substrate knowledge
        run: |
          # The harness resolves its own runner: LAPLACE_LLAMA_BIN, then PATH, then known
          # llama.cpp build locations, then ollama. It validates a candidate by invoking
          # it, because one checked-in build is +x but dies on a missing libllama.so.0 and
          # selecting it would report 0/0 probes -- a broken runner reading as a model
          # verdict. Only bring ollama up if no llama-completion resolves.
          if ! python3 -c "import sys; sys.path.insert(0,'scripts'); \
                from importlib.machinery import SourceFileLoader; \
                m=SourceFileLoader('h','scripts/verify-model-behavioral.py').load_module(); \
                sys.exit(0 if m.resolve_llama_bin() else 1)"; then
            command -v ollama >/dev/null || { echo "::error::no model runner: no llama-completion and no ollama"; exit 1; }
            if ! curl -sf http://127.0.0.1:11434/api/version >/dev/null; then
              nohup ollama serve >/tmp/laplace-ollama.log 2>&1 &
              for _ in $(seq 1 30); do
                curl -sf http://127.0.0.1:11434/api/version >/dev/null && break; sleep 1
              done
            fi
            curl -sf http://127.0.0.1:11434/api/version >/dev/null \
              || { echo "::error::ollama did not come up"; cat /tmp/laplace-ollama.log; exit 1; }
          fi
          python3 scripts/verify-model-behavioral.py \
            --model "$GGUF_OUT" --ollama-tag laplace-ci-verify \
            --db "host=/var/run/postgresql user=laplace_admin dbname=$PGDATABASE" \
            --report /tmp/laplace-model-behavioral.json

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: model-verification
          path: |
            /tmp/laplace-gguf-nondegenerate.json
            /tmp/laplace-model-behavioral.json
          if-no-files-found: ignore
