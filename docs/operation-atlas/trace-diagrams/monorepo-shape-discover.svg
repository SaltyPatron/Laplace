.208,974.016,445.208,984.016,449.208,974.016,445.208,978.016" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="29"><text x="243.005" y="1025.396" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="247.177" y="1037.975" fill="#888" font-size="10" textLength="377.407">claimed. Complete PostgreSQL task_shape.c orchestration/helpers reviewed. Type-8</text><text x="245.51" y="1050.553" fill="#888" font-size="10" textLength="380.742">trajectory structure is checked before using it as a parse or shape. The second vertex-</text><text x="246.076" y="1063.131" fill="#888" font-size="10" textLength="379.609">only membership read ignores its completeness return; first membership overflow and</text><text x="254.68" y="1075.709" fill="#888" font-size="10" textLength="362.402">witness overflow set read.failed. Exact native codec/matcher implementations and</text><text x="336.115" y="1088.287" fill="#888" font-size="10" textLength="199.531">membership query semantics remain nested.</text></g><?plantuml-src dLNDRjj64BxpAGRe8GbGwuUIA2ew58Pj8G6Sr8qSe3TXkJkKjgPscTsbRDtw47t2Fac_9SL8RdhgJI27Cz_VZDxGtK4hDfBVqxseAo5vo2-1ZTVM3AlkoSOtXGzE11vw9uUri_iwRBH1MHZiQFtXEfrbLAOgdnKZESrP56cMJkHegeHCvsKspUGy7sTPhkGippXDyooNYYTIpMT5CP4pBafEtlmFB47ufutVYPe7iWSoPnwFyyLKy6AHPMcQpdYg9elnP5JagXZFyb6wo4VvNEKoBSg9AiLaEXchqKJobBD9_jz0p5OR7ahhki7-MxMH8eZARWUAotxsA9i9DP8yAiT2v8lv0arLEM4r1gYo72_oR3Ok9Ye5a6ms4YCf8DjueR8qcu_dMUAVjAc54tigX7pQEjiOTMChw-YdrVNgPhMwg01lPP-rsL8fAiyNRu18D5LOMHC-YptJMXY_PgVB9EXGCNso1aHgIt__-HSfxQKzi2DX51rYrP6YhbUjhWIr6naQnpxnGRYGlF_2tnhjc8mrZ2GSoHQUtK44-4IbTNl_Cuc3q9Kegells_wrzJhe0mEoiKrO9kyVdAt55ePUL1QDsd8WVjc9nhTjWwKkSCiutziABVX5o40IZOoMegAFwytTxzUV7kxlDh-kXZVNz_VhuOVhzURZvuUlZ-slX-ilwpjoNBLO_VBCXK7yI8XsiD9Mtqimr2CA659LK6Wdd2AeLNFxgL0KZZLVvOH4_i4oMAVPauJiGfjep0_AT288v_dAontlHQm6nT3qt4HhGk2Ngx8IsosVoYDFfHLqyW15WZ