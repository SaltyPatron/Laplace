name: Qualify current managed service storage policy
on:
  push:
    branches: [verify/chess-floor-serving-controls-20260916]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TMPDIR: /build/laplace/work/service-policy-controls/tmp
      TMP: /build/laplace/work/service-policy-controls/tmp
      TEMP: /build/laplace/work/service-policy-controls/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 33d84e249c7e3ca131959c6263f9066dd20f455a
          persist-credentials: false
      - name: Execute service and host controls with real isolated filesystem operations
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$TMPDIR"
          test "$(git rev-parse HEAD)" = 33d84e249c7e3ca131959c6263f9066dd20f455a
          test "$(git rev-parse HEAD^{tree})" = d1ab2271bd3ba5b269c2c9c94c52f01128ce2117
          timeout --signal=TERM --kill-after=5s 120s python3 scripts/test-managed-services.py
          timeout --signal=TERM --kill-after=5s 120s python3 scripts/test-managed-host.py
          test -z "$(git status --porcelain --untracked-files=all)"
