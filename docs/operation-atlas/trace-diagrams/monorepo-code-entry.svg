e-sitter grammar</text><rect x="171.861" y="609.043" width="434.92" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="181.861" y="631.5" fill="#000" font-size="12" textLength="414.92">Validate step/window/top-k/attempt ranges and finite nonnegative temperature</text><rect x="142.172" y="664.137" width="494.299" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="152.172" y="686.594" fill="#000" font-size="12" textLength="474.299">Apply chat.completions quote gate; consume quote and record usage before construction</text><rect x="272.938" y="719.23" width="232.766" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="282.938" y="741.688" fill="#000" font-size="12" textLength="212.766">Call CodePlayerService.GenerateAsync</text><polygon points="367.614,774.324,411.029,774.324,423.029,786.324,411.029,798.324,367.614,798.324,355.614,786.324,367.614,774.324" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="367.614" y="790.825" fill="#000" font-size="11" textLength="43.415">Verified?</text><text x="338.496" y="783.907" fill="#000" font-size="11" textLength="17.118">yes</text><text x="423.029" y="783.907" fill="#000" font-size="11" textLength="12.235">no</text><rect x="108.183" y="808.324" width="266.803" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="118.183" y="830.781" fill="#000" font-size="12" textLength="246.803">Return code response or assistant chat choice</text><rect x="402.638" y="808.324" width="268.842" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="412.638" y="830.781" fill="#000" font-size="12" textLength="248.842">503 when toolchain unavailable; otherwise 422</text><rect x="394.985" y="863.418" width="284.146" height="35.094" fill="#F1F1F1" st