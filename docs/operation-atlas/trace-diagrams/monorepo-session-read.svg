<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:599px;height:1179px;background:#FAFCFF;" width="599px" height="1179px" viewBox="0 0 599 1179" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="599" height="1179" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="6"><text x="110.457" y="34.533" fill="#000" font-size="14" textLength="376.202" font-weight="700">Monorepo — ordered session recall and label realization</text></g><ellipse cx="297.558" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="170.49" y="93.609" width="254.135" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="180.49" y="116.066" fill="#000" font-size="12" textLength="234.135">session_turn_ids validates nonnegative limit</text><rect x="246.873" y="197.621" width="101.369" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="256.873" y="220.078" fill="#000" font-size="12" textLength="81.369">Return no rows</text><ellipse cx="297.558" cy="271.668" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="297.558" cy="271.668" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="234.898,148.703,360.217,148.703,372.217,160.703,360.217,172.703,234.898,172.703,222.898,160.703,234.898,148.703" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="301.558" y="184.122" fill="#000" font-size="11" textLength="17.118">yes</text><text x="234.898" y="165.204" fill="#000" font-size="11" textLength="125.318">Null session or zero limit?</text><rect x="112.796" y="324.668" width="369.523" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="122.796" y="347.125" fill="#000" font-size="12" textLength="349.523">Validate 16-byte session; read Projection and legacy manifest IDs</text><rect x="202.512" y="379.762" width="190.092" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="212.512" y="402.219" fill="#000" font-size="12" textLength="170.092">Refuse legacy Content manifest</text><rect x="116.813" y="434.855" width="361.49" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="126.813" y="457.313" fill="#000" font-size="12" textLength="341.49">Decode Projection trajectory; emit constituent ordinals up to limit</text><rect x="134.156" y="489.949" width="326.803" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="144.156" y="512.406" fill="#000" font-size="12" textLength="306.803">session_turns retains trajectory order and distinct turn IDs</text><rect x="99.12" y="545.043" width="396.875" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="109.12" y="567.5" fill="#000" font-size="12" textLength="376.875">For Conversation_Message entities resolve second content constituent</text><rect x="160.497" y="600.137" width="274.121" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="170.497" y="622.594" fill="#000" font-size="12" textLength="254.121">For older content-only entities use their own IDs</text><rect x="115.482" y="655.23" width="364.15" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="125.482" y="677.688" fill="#000" font-size="12" textLength="344.15">Rank HAS_ROLE and AUTHORED_BY labels by effective rating</text><rect x="95.136" y="710.324" width="404.844" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="105.136" y="732.781" fill="#000" font-size="12" textLength="384.844">Use IS_INSTANCE_OF name hop when present, otherwise direct object</text><rect x="95.467" y="765.418" width="404.182" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="105.467" y="787.875" fill="#000" font-size="12" textLength="384.182">Read latest APPEARS_IN observation timestamp in this session context</text><rect x="143.13" y="820.512" width="308.855" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="153.13" y="842.969" fill="#000" font-size="12" textLength="288.855">Render ordered message content in one render_batch</text><rect x="121.125" y="875.605" width="352.865" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="131.125" y="898.063" fill="#000" font-size="12" textLength="332.865">Render distinct role and model names in another render_batch</text><rect x="121.477" y="930.699" width="352.162" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="131.477" y="953.156" fill="#000" font-size="12" textLength="332.162">Return ordinal, turn ID, role, model, observed time and surface</text><ellipse cx="297.558" cy="996.793" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="297.558" cy="996.793" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="297.558" y1="73.609" x2="297.558" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="293.558,83.609,297.558,93.609,301.558,83.609,297.558,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="297.558" y1="232.715" x2="297.558" y2="260.668" style="stroke:#181818;stroke-width:1;"/><polygon points="293.558,250.668,297.558,260.668,301.558,250.668,297.558,254.668" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;strok