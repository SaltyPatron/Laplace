name: Laplace — competitive product proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify exact product candidate
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: release-candidate
      target_sha: ${{ github.sha }}
    secrets: inherit

  prove:
    name: Install, prove, activate and verify qualified product
    needs: qualify
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: proof-transaction
      target_sha: ${{ github.sha }}
    secrets: inherit
