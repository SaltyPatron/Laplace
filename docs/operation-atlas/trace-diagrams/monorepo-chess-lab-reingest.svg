<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:555px;height:1154px;background:#FAFCFF;" width="555px" height="1154px" viewBox="0 0 555 1154" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="555" height="1154" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="7"><text x="20" y="34.533" fill="#000" font-size="14" textLength="513.892" font-weight="700">Monorepo chess — retained PGN admission and separate receipt publication</text></g><ellipse cx="268.29" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="117.56" y="93.609" width="301.461" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="127.56" y="116.066" fill="#000" font-size="12" textLength="281.461">Find terminal job under lock; increment ActiveIngests</text><rect x="104.525" y="148.703" width="327.529" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="114.525" y="171.16" fill="#000" font-size="12" textLength="307.529">Acquire per-job ingestion gate; locate retained games.pgn</text><rect x="124.544" y="252.715" width="287.492" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="134.544" y="275.172" fill="#000" font-size="12" textLength="267.492">Allocate new ingest receipt name before validation</text><rect x="70.875" y="307.809" width="394.83" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="80.875" y="330.266" fill="#000" font-size="12" textLength="374.83">Read experiment; hash its UTF8 text; initialize recording measurement</text><rect x="170.244" y="362.902" width="196.092" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="180.244" y="385.359" fill="#000" font-size="12" textLength="176.092">Bind PGN to retained experiment</text><polygon points="142.032,203.797,394.548,203.797,406.548,215.797,394.548,227.797,142.032,227.797,130.032,215.797,142.032,203.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="272.29" y="239.216" fill="#000" font-size="11" textLength="17.118">yes</text><text x="142.032" y="220.298" fill="#000" font-size="11" textLength="252.517">Completed Cutechess job with existing experiment?</text><polygon points="268.29,417.996,280.29,429.996,268.29,441.996,256.29,429.996,268.29,417.996" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="88.21" y="461.996" width="360.16" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="98.21" y="484.453" fill="#000" font-size="12" textLength="340.16">Attach shared host writer; ingest PGN through common ingestor</text><rect x="119.221" y="566.008" width="298.139" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="129.221" y="588.465" fill="#000" font-size="12" textLength="278.139">Verify PGN unchanged and experiment still matches</text><rect x="177.258" y="636.102" width="182.064" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="187.258" y="658.559" fill="#000" font-size="12" textLength="162.064">Mark measurement completed</text><polygon points="216.019,517.09,320.562,517.09,332.562,529.09,320.562,541.09,216.019,541.09,204.019,529.09,216.019,517.09" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="272.29" y="552.509" fill="#000" font-size="11" textLength="17.118">yes</text><text x="216.019" y="533.591" fill="#000" font-size="11" textLength="104.543">Measurement exists?</text><polygon points="268.29,691.195,280.29,703.195,268.29,715.195,256.29,703.195,268.29,691.195" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="72.873" y="735.195" width="390.834" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="82.873" y="757.652" fill="#000" font-size="12" textLength="370.834">Determine fresh/mixed/replay/repaired/existing-or-repaired disposition</text><rect x="203.265" y="790.289" width="130.051" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="213.265" y="812.746" fill="#000" font-size="12" textLength="110.051">Prepare return result</text><rect x="61.187" y="845.383" width="414.207" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="71.187" y="867.84" fill="#000" font-size="12" textLength="394.207">Finally, when receipt allocated, serialize .pending then move to final JSON</text><rect x="104.874" y="900.477" width="326.832" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="114.874" y="922.934" fill="#000" font-size="12" textLength="306.832">Register receipt artifact; prune old ingestion receipts to 32</text><rect x="96.202" y="955.57" width="344.176" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="106.202" y="978.027" fill="#000" font-size="12" textLength="324.176">Always release gate if acquired and decrement ActiveIngests</text><ellipse cx="268.29" cy="1021.664" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="268.29" cy="1021.664" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="268.29" y1="73.609" x2="268.29" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="264.29,83.609,268.29,93.609,272.29,83.609,268.29,87.609" fill="#181818" style="stroke:#1818