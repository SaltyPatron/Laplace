ording enabled?</text><polygon points="1128.559,572.549,1140.559,584.549,1128.559,596.549,1116.559,584.549,1128.559,572.549" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="951.133" y="616.549" width="354.852" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="961.133" y="639.006" fill="#000" font-size="12" textLength="334.852">Save completed state with recorded/empty/disabled disposition</text><rect x="1004.825" y="671.643" width="247.467" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1014.825" y="694.1" fill="#000" font-size="12" textLength="227.467">On exception save failed state and rethrow</text><rect x="1020.186" y="726.736" width="216.746" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1030.186" y="749.193" fill="#000" font-size="12" textLength="196.746">On success remove live play session</text><ellipse cx="683.329" cy="812.83" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="683.329" cy="812.83" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="257.788" y1="186.539" x2="257.788" y2="221.539" style="stroke:#181818;stroke-width:1;"/><polygon points="253.788,211.539,257.788,221.539,261.788,211.539,257.788,215.539" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="257.788" y1="256.633" x2="257.788" y2="291.633" style="stroke:#181818;stroke-width:1;"/><polygon points="253.788,281.633,257.788,291.633,261.788,281.633,257.788,285.633" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="719.018" y1="186.539" x2="719.018" y2="221.539" style="stroke:#181818;stroke-width:1;"/><polygon points="715.018,211.539,719.018,221.539,723.018,211.539,719.018,215.539" fill="#181818" style="stroke:#1