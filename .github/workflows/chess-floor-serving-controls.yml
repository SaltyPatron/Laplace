name: Observe canonical ingest SQL capability and ownership
on:
  push:
    branches: ['verify/chess-floor-serving-controls-20260916']
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 3
    steps:
      - name: Observe canonical ingest SQL capability and ownership
        shell: bash
        run: |
          set -euo pipefail
          export PROBE_EVIDENCE="/build/laplace/recovery/ingest-capability/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$PROBE_EVIDENCE"
          chmod 0700 "$PROBE_EVIDENCE"
          echo "PROBE_EVIDENCE=$PROBE_EVIDENCE" >> "$GITHUB_ENV"
          timeout --signal=TERM --kill-after=5s 30s python3 -B - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ["PROBE_EVIDENCE"])
          sql="SELECT jsonb_build_object(\n'database',current_database(),'current_user',current_user,'server_version_num',current_setting('server_version_num'),\n'extension',(SELECT jsonb_build_object('oid',e.oid,'version',e.extversion,'schema',n.nspname,'owner',r.rolname,'caller_superuser',(SELECT rolsuper FROM pg_roles WHERE rolname=current_user)) FROM pg_extension e JOIN pg_namespace n ON n.oid=e.extnamespace JOIN pg_roles r ON r.oid=e.extowner WHERE e.extname='laplace_substrate'),\n'schemas',(SELECT jsonb_agg(jsonb_build_object('name',n.nspname,'owner',pg_get_userbyid(n.nspowner),'extension',e.extname)) FROM pg_namespace n LEFT JOIN pg_depend d ON d.classid='pg_namespace'::regclass AND d.objid=n.oid AND d.refclassid='pg_extension'::regclass AND d.deptype='e' LEFT JOIN pg_extension e ON e.oid=d.refobjid WHERE n.nspname IN ('laplace','ops')),\n'tables',(SELECT jsonb_agg(jsonb_build_object('name',c.oid::regclass::text,'owner',pg_get_userbyid(c.relowner),'kind',c.relkind,'extension',e.extname,'columns',(SELECT jsonb_agg(jsonb_build_object('name',a.attname,'type',format_type(a.atttypid,a.atttypmod),'notnull',a.attnotnull)) FROM pg_attribute a WHERE a.attrelid=c.oid AND a.attnum>0 AND NOT a.attisdropped))) FROM pg_class c LEFT JOIN pg_depend d ON d.classid='pg_class'::regclass AND d.objid=c.oid AND d.refclassid='pg_extension'::regclass AND d.deptype='e' LEFT JOIN pg_extension e ON e.oid=d.refobjid WHERE c.oid IN (to_regclass('laplace.ingest_run_journal'),to_regclass('laplace.ingest_file_journal'))),\n'functions',(SELECT jsonb_agg(jsonb_build_object('name',s.signature,'present',p.oid IS NOT NULL,'owner',pg_get_userbyid(p.proowner),'extension',e.extname,'result',pg_get_function_result(p.oid))) FROM (VALUES ('ops.ingest_run_live(uuid,interval)'),('ops.ingest_run_touch()'),('ops.ingest_file_touch_run()'),('ops.ingest_reconcile_orphans(interval)'),('ops.ingest_runs(integer)'),('laplace.ingest_runs(integer)')) s(signature) LEFT JOIN pg_proc p ON p.oid=to_regprocedure(s.signature) LEFT JOIN pg_depend d ON d.classid='pg_proc'::regclass AND d.objid=p.oid AND d.refclassid='pg_extension'::regclass AND d.deptype='e' LEFT JOIN pg_extension e ON e.oid=d.refobjid),\n'triggers',(SELECT jsonb_agg(jsonb_build_object('table',t.tgrelid::regclass::text,'name',t.tgname,'function',t.tgfoid::regprocedure::text)) FROM pg_trigger t WHERE NOT t.tgisinternal AND t.tgrelid IN (to_regclass('laplace.ingest_run_journal'),to_regclass('laplace.ingest_file_journal'))));\n"
          data=sql.encode()
          assert hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()=="ea3b275d013c3cef7d451e5258500f93dd09a031"
          path=out/"probe.sql"
          path.write_text("BEGIN READ ONLY;\nSET LOCAL statement_timeout='5s'; SET LOCAL lock_timeout='1s';\n"+sql+"\nROLLBACK;\n")
          result=subprocess.run(["/opt/laplace/pgsql-18/bin/psql","-X","-q","-v","ON_ERROR_STOP=1","-h","/var/run/postgresql","-d","laplace","-U","laplace_admin","-tAX","-f",str(path)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=20)
          (out/"probe.stdout").write_bytes(result.stdout)
          (out/"probe.stderr").write_bytes(result.stderr)
          print("PROBE_EXIT",result.returncode,flush=True)
          if result.returncode:
           print(result.stderr.decode(errors="replace"),flush=True)
           raise SystemExit(result.returncode)
          payload=json.loads(result.stdout)
          (out/"probe.json").write_text(json.dumps(payload,indent=2)+"\n")
          print("CANONICAL_INGEST_PROBE "+json.dumps(payload),flush=True)
          
          PY
      - name: Retain exact capability observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-ingest-capability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROBE_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 30
