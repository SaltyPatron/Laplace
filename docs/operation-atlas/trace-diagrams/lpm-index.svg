<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:773px;height:861px;background:#FAFCFF;" width="773px" height="861px" viewBox="0 0 773 861" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="773" height="861" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="5"><text x="200.389" y="34.533" fill="#000" font-size="14" textLength="370.754" font-weight="700">Modular liblpm — file traversal and admission selection</text></g><ellipse cx="389.85" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="246.11" y="93.609" width="287.48" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="256.11" y="116.066" fill="#000" font-size="12" textLength="267.48">stat supplied path; missing path returns minus one</text><polygon points="364.789,148.703,414.912,148.703,426.912,160.703,414.912,172.703,364.789,172.703,352.789,160.703,364.789,148.703" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="364.789" y="165.204" fill="#000" font-size="11" textLength="50.123">Directory?</text><text x="335.671" y="158.286" fill="#000" font-size="11" textLength="17.118">yes</text><text x="426.912" y="158.286" fill="#000" font-size="11" textLength="14.062">file</text><rect x="124.067" y="182.703" width="182.07" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="134.067" y="205.16" fill="#000" font-size="12" textLength="162.07">Recursively enumerate entries</text><rect x="16" y="237.797" width="398.205" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="260.254" fill="#000" font-size="12" textLength="378.205">Skip symlinks, named build/cache directories and unwanted extensions</text><rect x="85.7" y="292.891" width="258.805" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="95.7" y="315.348" fill="#000" font-size="12" textLength="238.805">Skip child paths overflowing 4096-byte buffer</text><rect x="434.205" y="182.703" width="260.785" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="444.205" y="205.16" fill="#000" font-size="12" textLength="240.785">Use direct file path without extension allowlist</text><polygon points="389.85,333.984,401.85,345.984,389.85,357.984,377.85,345.984,389.85,333.984" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="201.078" y="377.984" width="377.545" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="211.078" y="400.441" fill="#000" font-size="12" textLength="357.545">For each selected file require regular file and size 1..1048576 bytes</text><rect x="300.136" y="433.078" width="179.428" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="310.136" y="455.535" fill="#000" font-size="12" textLength="159.428">Open and read exact stat size</text><polygon points="302.103,488.172,477.598,488.172,489.598,500.172,477.598,512.172,302.103,512.172,290.103,500.172,302.103,488.172" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="302.103" y="504.673" fill="#000" font-size="11" textLength="175.495">Empty/large/unreadable/short read?</text><text x="272.985" y="497.755" fill="#000" font-size="11" textLength="17.118">yes</text><text x="489.598" y="497.755" fill="#000" font-size="11" textLength="22.016">read</text><rect x="100.552" y="522.172" width="242.105" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="110.552" y="544.629" fill="#000" font-size="12" textLength="222.105">Increment skipped; return zero for that file</text><rect x="362.658" y="522.172" width="390.875" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="372.658" y="544.629" fill="#000" font-size="12" textLength="370.875">lpm_admit content; allocation/admission failure propagates minus one</text><polygon points="389.85,563.266,401.85,575.266,389.85,587.266,377.85,575.266,389.85,563.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="319.493" y="607.266" width="140.715" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="329.493" y="629.723" fill="#000" font-size="12" textLength="120.715">Return traversal status</text><ellipse cx="389.85" cy="673.359" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="389.85" cy="673.359" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="389.85" y1="73.609" x2="389.85" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="385.85,83.609,389.85,93.609,393.85,83.609,389.85,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="215.103" y1="217.797" x2="215.103" y2="237.797" style="stroke:#181818;stroke-width:1;"/><polygon points="211.103,227.797,215.103,237.797,219.103,227.797,215.103,231.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="215.103" y1="272.891" x2="215.103" y2="292.891" style="stroke:#181818;stroke-width:1;"/><polygon points="211.103,282.891,215.103,292.891,219.103,282.891,215.103,286.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="352.789" y1="160.703" x2="215.103" y2="160.703" style="stroke:#181818;stroke-width:1;"/><line x1="215.103" y1="16