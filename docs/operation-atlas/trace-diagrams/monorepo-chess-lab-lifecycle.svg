<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:502px;height:1048px;background:#FAFCFF;" width="502px" height="1048px" viewBox="0 0 502 1048" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="502" height="1048" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="5"><text x="46.421" y="34.533" fill="#000" font-size="14" textLength="408.064" font-weight="700">Monorepo chess — job ownership, retained files and cleanup</text></g><ellipse cx="243.128" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="66.707" y="93.609" width="352.842" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="76.707" y="116.066" fill="#000" font-size="12" textLength="332.842">On StartJob prune terminal history and old orphan workspaces</text><rect x="106.39" y="148.703" width="273.477" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="116.39" y="171.16" fill="#000" font-size="12" textLength="253.477">Count Running jobs; reject if count reaches four</text><rect x="16" y="203.797" width="454.256" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="226.254" fill="#000" font-size="12" textLength="434.256">Create process-local job, 4096 DropOldest event channel and cancellation source</text><rect x="108.394" y="258.891" width="269.469" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="118.394" y="281.348" fill="#000" font-size="12" textLength="249.469">Publish Running under slot lock; launch worker</text><rect x="28.349" y="362.902" width="429.559" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="38.349" y="385.359" fill="#000" font-size="12" textLength="409.559">Write operation.json containing operation, kind, requester, start time and host</text><rect x="118.091" y="432.996" width="250.074" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="128.091" y="455.453" fill="#000" font-size="12" textLength="230.074">Register file in in-memory artifact dictionary</text><polygon points="192.677,313.984,293.579,313.984,305.579,325.984,293.579,337.984,192.677,337.984,180.677,325.984,192.677,313.984" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="247.128" y="349.403" fill="#000" font-size="11" textLength="17.118">yes</text><text x="192.677" y="330.485" fill="#000" font-size="11" textLength="100.901">Requester supplied?</text><polygon points="243.128,488.09,255.128,500.09,243.128,512.09,231.128,500.09,243.128,488.09" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="166.759" y="532.09" width="152.738" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="176.759" y="554.547" fill="#000" font-size="12" textLength="132.738">Dispatch selected runner</text><rect x="102.385" y="587.184" width="281.486" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="112.385" y="609.641" fill="#000" font-size="12" textLength="261.486">On exception/cancellation finish Failed/Cancelled</text><rect x="38.008" y="642.277" width="410.24" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="48.008" y="664.734" fill="#000" font-size="12" textLength="390.24">Finish updates job state; publishes done; completes channel and terminal</text><rect x="65.705" y="697.371" width="354.846" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="75.705" y="719.828" fill="#000" font-size="12" textLength="334.846">Stop requests cancellation; it does not await worker completion</text><rect x="64.05" y="752.465" width="358.156" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="74.05" y="774.922" fill="#000" font-size="12" textLength="338.156">Next start retains newest 32 terminal jobs, except active ingests</text><rect x="137.081" y="807.559" width="212.094" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="147.081" y="830.016" fill="#000" font-size="12" textLength="192.094">Delete eligible removed workspaces</text><rect x="59.368" y="862.652" width="367.52" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="69.368" y="885.109" fill="#000" font-size="12" textLength="347.52">Delete unknown canonical-GUID workspaces older than 24 hours</text><ellipse cx="243.128" cy="928.746" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="243.128" cy="928.746" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="243.128" y1="73.609" x2="243.128" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,83.609,243.128,93.609,247.128,83.609,243.128,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.128" y1="128.703" x2="243.128" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,138.703,243.128,148.703,247.128,138.703,243.128,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.128" y1="183.797" x2="243.128" y2="203.797" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,193.797,243.128,203.797,247.128,193.797,243.128,197.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.128" y1="238.891" x2="243.128" y2="258.891" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,248.891,243.128,258.891,247.128,248.891,243.128,252.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.128" y1="397.996" x2="243.128" y2="432.996" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,422.996,243.128,432.996,247.128,422.996,243.128,426.996" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.128" y1="337.984" x2="243.128" y2="362.902" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,352.902,243.128,362.902,247.128,352.902,243.128,356.902" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="305.579" y1="325.984" x2="467.907" y2="325.984" style="stroke:#181818;stroke-width:1;"/><polygon points="463.907,405.496,467.907,415.496,471.907,405.496,467.907,409.496" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="467.907" y1="325.984" x2="467.907" y2="500.09" style="stroke:#181818;stroke-width:1;"/><line x1="467.907" y1="500.09" x2="255.128" y2="500.09" style="stroke:#181818;stroke-width:1;"/><polygon points="265.128,496.09,255.128,500.09,265.128,504.09,261.128,500.09" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.128" y1="468.09" x2="243.128" y2="488.09" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,478.09,243.128,488.09,247.128,478.09,243.128,482.09" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.128" y1="293.984" x2="243.128" y2="313.984" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,303.984,243.128,313.984,247.128,303.984,243.128,307.984" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.128" y1="512.09" x2="243.128" y2="532.09" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,522.09,243.128,532.09,247.128,522.09,243.128,526.09" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.128" y1="567.184" x2="243.128" y2="587.184" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,577.184,243.128,587.184,247.128,577.184,243.128,581.184" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.128" y1="622.277" x2="243.128" y2="642.277" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,632.277,243.128,642.277,247.128,632.277,243.128,636.277" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.128" y1="677.371" x2="243.128" y2="697.371" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,687.371,243.128,697.371,247.128,687.371,243.128,691.371" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.128" y1="732.465" x2="243.128" y2="752.465" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,742.465,243.128,752.465,247.128,742.465,243.128,746.465" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.128" y1="787.559" x2="243.128" y2="807.559" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,797.559,243.128,807.559,247.128,797.559,243.128,801.559" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.128" y1="842.652" x2="243.128" y2="862.652" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,852.652,243.128,862.652,247.128,852.652,243.128,856.652" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.128" y1="897.746" x2="243.128" y2="917.746" style="stroke:#181818;stroke-width:1;"/><polygon points="239.128,907.746,243.128,917.746,247.128,907.746,243.128,911.746" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="23"><text x="57.578" y="959.127" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="42.844" y="971.705" fill="#888" font-size="10" textLength="415.22">claimed. Complete ChessLabService reviewed. Capacity count and insertion are not one lock,</text><text x="49.519" y="984.283" fill="#888" font-size="10" textLength="401.87">so four is not an atomic concurrency limit. Event readers share a consuming channel, not a</text><text x="73.137" y="996.861" fill="#888" font-size="10" textLength="354.634">broadcast log. Job registry is process-local; operation.json is not loaded into it at</text><text x="63.417" y="1009.439" fill="#888" font-size="10" textLength="374.072">startup here. Cleanup rejects reparse points but uses directory last-write time and no</text><text x="55.075" y="1022.018" fill="#888" font-size="10" textLength="390.757">durable job registry. The play subdirectory is not a canonical GUID, so this cleanup does</text><text x="57.578" y="1034.596" fill="#888" font-size="10" textLength="385.752">not retain/prune play-session files. Runner completion/cleanup remains runner-specific.</text></g><?plantuml-src NLJBRYCt4BpFLpIGGtO1lMnfPKiw10ivoWCRRs0bo9b3zcXeK-I4v4YhMpuYNvWlIVNCs6il806YoEwkhghkx-d7apNiDQ_fasgSqZnLJJCTVa-sDQSqtNCyMTnqfq-g7CuJdMZ_yyVh3qkQbJnRBdYrMYtKxChSB1VpgfnNozNCBEUtLuiFSxusVBLQhhGkvxUBsyLItPOBesxAsTMDhehqP7sZeZfIgVJJ8ORMcsrm8T9tku-xxMxtwaMgbGbdwmzKAPVurOtXIhKkxuBFz-h8j5S-0QojYcopO_ej-12v2QIb4_hldt_fCPGKpfvZgcqpeiXPMS-6AkiuaVA6j6FbswP8MSLSh3zxsiklNn7OnDOpPOv7wvMZsgOSugMB2WxVsDJAqpd4fzI0phGfrbjqbkcXzLuQGFMqGT57rfbiHRgxZQm485MXZHA2SsOK2qYHnYver4BaY1QprPBkOcW-EyCf4vyOu