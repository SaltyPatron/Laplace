name: DB — lifecycle ops

# The database as its own lane: drop, repair, recreate, inspect — with no build,
# no deploy, and no seeding. Those are separate workflows on purpose:
#
#   laplace.yml     build -> deploy -> db-ops -> test        (code changes)
#   db-ops.yml      THIS  — the database's own lifecycle     (operator actions)
#   seed-*.yml      corpus in                                (data)
#
# Every operation is a composition of primitives that already exist and are
# already exercised by laplace.yml: `Laplace.Migrations` verbs (status/up/reset/
# nuke) and `scripts/pipeline.sh` phases. Nothing here reimplements them, so a
# fix to the pipeline is a fix here too.
#
# DESTRUCTIVE OPERATIONS REQUIRE TYPING THE DATABASE NAME. A workflow_dispatch
# is a button, and `recreate` drops every entity, physicality and attestation in
# the substrate. The confirm field is the difference between an operator
# decision and a misclick.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "what to do to the database"
        type: choice
        required: true
        default: status
        options:
          - status      # READ-ONLY. Migration state + extension version + substrate counts.
          - migrate     # `up` only. Idempotent; applies any pending migrations.
          - repair      # Re-sync extension SQL + re-tune + re-point perfcache/API env. NO DATA LOSS.
          - reindex     # Rebuild INVALID indexes (interrupted DDL/legacy cycles). CONCURRENTLY; NO DATA LOSS.
          - remigrate   # `reset` + `up`: re-apply ALL migrations. Keeps substrate data.
          - recreate    # DESTRUCTIVE. `nuke` + `up` + repair. Drops the database and rebuilds it EMPTY.
      confirm:
        description: "type the database name to authorize a destructive operation (recreate)"
        type: string
        required: false
        default: ""
      database:
        description: "target DB (one database: laplace)"
        type: choice
        options: [laplace]
        default: laplace

permissions:
  contents: read

concurrency:
  # One database, one lifecycle operation at a time. Queue rather than cancel:
  # cancelling mid-nuke leaves the box without a database, which is worse than
  # waiting.
  #
  # Widened from a db-ops-only group to the shared LIFECYCLE group: a nuke/migrate
  # and a deploy both bounce the box, and they were previously mutually invisible.
  # Exclusion against running SEEDS is the deploy job's ingest_run_journal preflight,
  # not this group -- seeds must stay parallel with each other.
  group: laplace-substrate-lifecycle
  cancel-in-progress: false

jobs:
  db:
    name: "DB — ${{ inputs.operation }}"
    runs-on: [self-hosted, laplace]
    # reindex rebuilds up to every index on billion-row partitioned tables — hours,
    # not minutes. Every other operation keeps the 30-minute leash.
    timeout-minutes: ${{ inputs.operation == 'reindex' && 720 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { submodules: false, clean: false }
      - uses: ./.github/actions/setup-laplace-env

      - name: Authorize
        run: |
          op="${{ inputs.operation }}"
          case "$op" in
            recreate)
              if [ "${{ inputs.confirm }}" != "${{ inputs.database }}" ]; then
                echo "::error::'$op' is destructive — type '${{ inputs.database }}' in the confirm field to authorize."
                exit 1
              fi
              echo "::warning::'$op' authorized: dropping ${{ inputs.database }} and rebuilding it EMPTY. All substrate data is lost; re-seed with the seed-* workflows."
              ;;
            remigrate)
              echo "::notice::'$op' re-applies all migrations; substrate data is preserved."
              ;;
            *)
              echo "'$op' is non-destructive."
              ;;
          esac

      - name: Guard — refuse to drop the database out from under a running ingest
        # Was an inline `pg_stat_activity ... query ILIKE 'COPY %'` probe, which only
        # sees an ingest during its COPY bursts and reports "clear" through the minutes
        # of in-memory compose between them. Same check as the deploy job now, and the
        # sound one — see the script.
        if: inputs.operation == 'recreate' || inputs.operation == 'remigrate' || inputs.operation == 'reindex'
        timeout-minutes: 305
        run: bash scripts/wait-for-quiet-substrate.sh "${{ inputs.database }}"
      - name: Status (read-only)
        if: inputs.operation == 'status'
        # set +e so every section still prints when one fails; rc accumulates so
        # the step FAILS afterward instead of reporting green over a broken build
        # or unreachable database (Copilot, PR #778).
        run: |
          set +e
          rc=0
          dotnet build app/Laplace.Migrations/Laplace.Migrations.csproj -c Release -v q --nologo || rc=1
          dotnet app/Laplace.Migrations/bin/Release/net10.0/Laplace.Migrations.dll status || rc=1
          echo "----- extension -----"
          psql -h /var/run/postgresql -U laplace_admin -d "${{ inputs.database }}" -c \
            "SELECT extname, extversion FROM pg_extension WHERE extname LIKE 'laplace%'" || rc=1
          echo "----- substrate -----"
          psql -h /var/run/postgresql -U laplace_admin -d "${{ inputs.database }}" -c \
            "SET search_path=laplace,public; SELECT * FROM substrate_health()" || rc=1
          echo "----- index health (invalid = planner-invisible, run 'reindex') -----"
          psql -h /var/run/postgresql -U laplace_admin -d "${{ inputs.database }}" -c \
            "SELECT t.relname AS table, count(*) FILTER (WHERE NOT i.indisvalid) AS invalid, count(*) AS total
             FROM pg_index i JOIN pg_class c ON c.oid=i.indexrelid JOIN pg_class t ON t.oid=i.indrelid
             JOIN pg_namespace n ON n.oid=t.relnamespace WHERE n.nspname='laplace'
             GROUP BY 1 HAVING count(*) FILTER (WHERE NOT i.indisvalid) > 0 ORDER BY 2 DESC" || rc=1
          echo "----- what has been ingested -----"
          psql -h /var/run/postgresql -U laplace_admin -d "${{ inputs.database }}" -c \
            "SET search_path=laplace,public; SELECT source_name, status, attestations, ended_at FROM ingest_run_journal ORDER BY started_at DESC LIMIT 20" || rc=1
          exit $rc

      - name: Migrate
        if: inputs.operation == 'migrate'
        run: bash scripts/pipeline.sh migrate

      - name: Repair
        # Everything that makes a live database correct without touching its
        # data: extension SQL to the installed version, PG + Laplace tuning,
        # the perfcache GUC, the API env. This is the fix for "the database is
        # there but the extension or a GUC drifted".
        if: inputs.operation == 'repair'
        run: bash scripts/pipeline.sh sync-extension tune-pg tune-laplace perfcache-guc api-env

      - name: Reindex — rebuild INVALID indexes
        # Interrupted DDL or a database upgraded from the retired index-cycle loader can leave
        # indexes marked indisvalid=false; the planner ignores them and every read
        # seq-scans. 2026-08-14: 28 of them across attestations/consensus/entities/
        # physicalities — every core query index — after the wiktionary-era kills.
        # CONCURRENTLY: readers keep working while each rebuilds. `_ccnew` leftovers
        # are half-built temp indexes from a died CREATE INDEX CONCURRENTLY — the
        # real name still exists, so they drop rather than rebuild.
        if: inputs.operation == 'reindex'
        run: |
          P(){ psql -h /var/run/postgresql -U laplace_admin -d "${{ inputs.database }}" -v ON_ERROR_STOP=1 -tAc "$1"; }
          # Invalid partitioned PARENTS cannot be REINDEXed back to validity — the
          # flag only flips when every child is attached — and pg_get_indexdef on a
          # parent says ON ONLY, which recreates the same empty shell. So: capture
          # the definition, strip ON ONLY, drop, recreate; CREATE INDEX on the
          # parent then builds every missing child and attaches any that match.
          # Consensus first: converse election reads block on those.
          list(){ P "SELECT n.nspname || '.' || c.relname || E'\t' || pg_get_indexdef(i.indexrelid)
                     FROM pg_index i
                     JOIN pg_class c ON c.oid=i.indexrelid
                     JOIN pg_class t ON t.oid=i.indrelid
                     JOIN pg_namespace n ON n.oid=c.relnamespace
                     WHERE NOT i.indisvalid
                     ORDER BY CASE t.relname WHEN 'consensus' THEN 0 WHEN 'entities' THEN 1
                              WHEN 'physicalities' THEN 2 ELSE 3 END, c.relname"; }
          invalid=$(list)
          [ -z "$invalid" ] && { echo "::notice::no invalid indexes — nothing to do"; exit 0; }
          echo "rebuilding $(echo "$invalid" | wc -l) invalid index(es):"
          rc=0
          while IFS=$'\t' read -r idx def; do
            def_recursive=${def/ ON ONLY / ON }
            echo "--- $idx"
            P "DROP INDEX IF EXISTS $idx" || { rc=1; continue; }
            P "$def_recursive" || rc=1
          done <<< "$invalid"
          remaining=$(P "SELECT count(*) FROM pg_index i JOIN pg_class t ON t.oid=i.indrelid
                         JOIN pg_namespace n ON n.oid=t.relnamespace
                         WHERE n.nspname='laplace' AND NOT i.indisvalid")
          echo "invalid indexes remaining: $remaining"
          [ "$rc" -eq 0 ] && [ "$remaining" = "0" ] || { echo "::error::reindex incomplete — $remaining invalid remain"; exit 1; }

      - name: Remigrate (reset + up)
        if: inputs.operation == 'remigrate'
        run: |
          dotnet build app/Laplace.Migrations/Laplace.Migrations.csproj -c Release -v q --nologo
          dotnet app/Laplace.Migrations/bin/Release/net10.0/Laplace.Migrations.dll reset --yes
          bash scripts/pipeline.sh migrate

      - name: Recreate (nuke + up + repair)
        # `pipeline.sh --fresh-db migrate` is `migrate nuke --yes` then `up`,
        # the same path laplace.yml takes for its fresh_db dispatch input.
        if: inputs.operation == 'recreate'
        run: bash scripts/pipeline.sh --fresh-db migrate sync-extension tune-pg tune-laplace perfcache-guc api-env

      - name: Verify structural database health
        # Database lifecycle owns extension/schema/index/constraint/journal
        # health. It does not ask seeded converse, generation, or chess
        # behavior to prove that creation/repair succeeded.
        run: bash scripts/check-database-health.sh "${{ inputs.database }}"

      - name: Next step
        if: inputs.operation == 'recreate' || inputs.operation == 'remigrate'
        run: |
          echo "::notice::Database is rebuilt and EMPTY. Seed it: run seed-foundation.yml, then seed-knowledge / seed-documents / seed-chess as needed."
