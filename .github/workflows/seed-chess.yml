name: Data — chess ingest
run-name: "Chess ingest — ${{ inputs.preset }} → ${{ inputs.database }}"

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "What chess corpus or derived operation to run"
        type: choice
        required: true
        default: games-lumbras-elite
        options: [games-lumbras-elite, games-chesscom-all, games-magnus, games-hikaru, games-firouzja, games-nihalsarin, games-caruana, games-gukesh, games-pragg, games-anish-giri, games-owner, games-twic, games-lumbras-otb, games-lumbras-online, openings, books, syzygy, chess-analyze, chess-eval, chess-move-outcomes, chess-tactic-outcomes, chess-transitions, chess-trajectory, chess-opening-match, custom-games, custom-openings, custom-books, custom-syzygy]
      slice:
        description: "Only for games-lumbras-otb / games-lumbras-online; otherwise leave all"
        type: choice
        required: true
        default: all
        options: [all, otb-1900-1949, otb-1950-1969, otb-1970-1989, otb-1990-1999, otb-2000-2004, otb-2005-2009, otb-2010-2014, otb-2015-2019, otb-2020-2024, otb-2025, otb-2026-partial, online-1995-2009, online-2010-2014, online-2015-2019, online-2020, online-2021, online-2022, online-2023, online-2024, online-2025]
      advanced_path_override:
        description: "ADVANCED: override the selected corpus path; required for custom-* presets"
        type: string
        required: false
        default: ""
      database:
        description: "Target database"
        type: choice
        options: [laplace]
        default: laplace
      derive_after_games:
        description: "Game presets only: also derive move outcomes and transitions"
        type: boolean
        default: true
      replace_existing_source:
        description: "DESTRUCTIVE, derived operations only: retract the complete derived source first"
        type: boolean
        default: false
      confirm_replace_existing:
        description: "Second confirmation required for destructive derived-source replacement"
        type: boolean
        default: false
      run_idempotency:
        description: "Re-run the selected operation and prove evidence does not double-count"
        type: boolean
        default: false

  workflow_call:
    inputs:
      preset:
        type: string
        required: true
      slice:
        type: string
        required: false
        default: all
      advanced_path_override:
        type: string
        required: false
        default: ""
      database:
        type: string
        required: false
        default: laplace
      derive_after_games:
        type: boolean
        required: false
        default: true
      replace_existing_source:
        type: boolean
        required: false
        default: false
      confirm_replace_existing:
        type: boolean
        required: false
        default: false
      run_idempotency:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve chess preset
    runs-on: [self-hosted, laplace]
    timeout-minutes: 2
    outputs:
      source: ${{ steps.pick.outputs.source }}
      path: ${{ steps.pick.outputs.path }}
    steps:
      - id: pick
        shell: bash
        env:
          PRESET: ${{ inputs.preset }}
          SLICE_INPUT: ${{ inputs.slice }}
          PATH_INPUT: ${{ inputs.advanced_path_override }}
          REPLACE_INPUT: ${{ inputs.replace_existing_source && '1' || '0' }}
          CONFIRM_REPLACE_INPUT: ${{ inputs.confirm_replace_existing && '1' || '0' }}
        run: |
          set -euo pipefail
          root="${LAPLACE_DATA_ROOT:-/vault/Data}"
          chess="$root/Games/Chess"
          lum="$chess/Lumbras"
          source=""
          p=""
          pathless_derived=0

          slice_file() {
            case "$1" in
              otb-1900-1949) echo "$lum/otb/LumbrasGigaBase_OTB_1900-1949.pgn" ;;
              otb-1950-1969) echo "$lum/otb/LumbrasGigaBase_OTB_1950-1969.pgn" ;;
              otb-1970-1989) echo "$lum/otb/LumbrasGigaBase_OTB_1970-1989.pgn" ;;
              otb-1990-1999) echo "$lum/otb/LumbrasGigaBase_OTB_1990-1999.pgn" ;;
              otb-2000-2004) echo "$lum/otb/LumbrasGigaBase_OTB_2000-2004.pgn" ;;
              otb-2005-2009) echo "$lum/otb/LumbrasGigaBase_OTB_2005-2009.pgn" ;;
              otb-2010-2014) echo "$lum/otb/LumbrasGigaBase_OTB_2010-2014.pgn" ;;
              otb-2015-2019) echo "$lum/otb/LumbrasGigaBase_OTB_2015-2019.pgn" ;;
              otb-2020-2024) echo "$lum/otb/LumbrasGigaBase_OTB_2020-2024.pgn" ;;
              otb-2025) echo "$lum/otb/LumbrasGigaBase_OTB_2025.pgn" ;;
              otb-2026-partial) echo "$lum/otb/LumbrasGigaBase_OTB_2026_partial_release.pgn" ;;
              online-1995-2009) echo "$lum/online/LumbrasGigaBase_Online_1995-2009.pgn" ;;
              online-2010-2014) echo "$lum/online/LumbrasGigaBase_Online_2010-2014.pgn" ;;
              online-2015-2019) echo "$lum/online/LumbrasGigaBase_Online_2015-2019.pgn" ;;
              online-2020) echo "$lum/online/LumbrasGigaBase_Online_2020.pgn" ;;
              online-2021) echo "$lum/online/LumbrasGigaBase_Online_2021.pgn" ;;
              online-2022) echo "$lum/online/LumbrasGigaBase_Online_2022.pgn" ;;
              online-2023) echo "$lum/online/LumbrasGigaBase_Online_2023.pgn" ;;
              online-2024) echo "$lum/online/LumbrasGigaBase_Online_2024.pgn" ;;
              online-2025) echo "$lum/online/LumbrasGigaBase_Online_2025.pgn" ;;
              *) return 1 ;;
            esac
          }

          case "$PRESET" in
            games-lumbras-elite)
              source=chess
              p="$lum/pgn/export_ELO2400.pgn"
              ;;
            games-chesscom-all)
              source=chess
              p="$chess"
              ;;
            games-magnus)
              source=chess
              p="$chess/MagnusCarlsen_chesscom.pgn"
              ;;
            games-hikaru)
              source=chess
              p="$chess/Hikaru_chesscom.pgn"
              ;;
            games-firouzja)
              source=chess
              p="$chess/Firouzja2003_chesscom.pgn"
              ;;
            games-nihalsarin)
              source=chess
              p="$chess/nihalsarin_chesscom.pgn"
              ;;
            games-caruana)
              source=chess
              p="$chess/FabianoCaruana_chesscom.pgn"
              ;;
            games-gukesh)
              source=chess
              p="$chess/GukeshDommaraju_chesscom.pgn"
              ;;
            games-pragg)
              source=chess
              p="$chess/rpragchess_chesscom.pgn"
              ;;
            games-anish-giri)
              source=chess
              p="$chess/AnishGiri_chesscom.pgn"
              ;;
            games-owner)
              source=chess
              p="$chess/Anthony-Hart_chesscom.pgn"
              ;;
            games-twic)
              source=chess
              p="$chess/twic"
              ;;
            games-lumbras-otb)
              source=chess
              if [[ "$SLICE_INPUT" == all ]]; then
                p="$lum/otb"
              else
                [[ "$SLICE_INPUT" == otb-* ]] || {
                  echo "::error::slice $SLICE_INPUT is not an OTB slice"
                  exit 2
                }
                p="$(slice_file "$SLICE_INPUT")" || {
                  echo "::error::unknown OTB slice: $SLICE_INPUT"
                  exit 2
                }
              fi
              ;;
            games-lumbras-online)
              source=chess
              if [[ "$SLICE_INPUT" == all ]]; then
                p="$lum/online"
              else
                [[ "$SLICE_INPUT" == online-* ]] || {
                  echo "::error::slice $SLICE_INPUT is not an online slice"
                  exit 2
                }
                p="$(slice_file "$SLICE_INPUT")" || {
                  echo "::error::unknown online slice: $SLICE_INPUT"
                  exit 2
                }
              fi
              ;;
            openings)
              source=openings
              p="$chess/openings"
              ;;
            books)
              source=chess-books
              p="$root/ProjectGutenberg/text"
              ;;
            syzygy)
              source=chess-syzygy
              p="$chess/syzygy"
              [[ ! -d "$p/3-4-5" ]] || p="$p/3-4-5"
              ;;
            chess-analyze)
              source=chess-analyze
              pathless_derived=1
              ;;
            chess-eval)
              source=chess-eval
              pathless_derived=1
              ;;
            chess-move-outcomes)
              source=chess-move-outcomes
              pathless_derived=1
              ;;
            chess-tactic-outcomes)
              source=chess-tactic-outcomes
              pathless_derived=1
              ;;
            chess-transitions)
              source=chess-transitions
              pathless_derived=1
              ;;
            chess-trajectory)
              source=chess-trajectory
              pathless_derived=1
              ;;
            chess-opening-match)
              source=chess-opening-match
              pathless_derived=1
              ;;
            custom-games)
              source=chess
              ;;
            custom-openings)
              source=openings
              ;;
            custom-books)
              source=chess-books
              ;;
            custom-syzygy)
              source=chess-syzygy
              ;;
            *)
              echo "::error::unknown chess preset: $PRESET"
              exit 2
              ;;
          esac

          case "$PRESET" in
            games-lumbras-otb|games-lumbras-online) ;;
            *)
              [[ "$SLICE_INPUT" == all ]] || {
                echo "::error::slice is only valid for games-lumbras-otb or games-lumbras-online"
                exit 2
              }
              ;;
          esac

          if [[ -n "$PATH_INPUT" ]]; then
            (( pathless_derived == 0 )) || {
              echo "::error::$PRESET is a pathless derived operation; remove the advanced path override"
              exit 2
            }
            p="$PATH_INPUT"
          fi

          case "$PRESET" in
            custom-*)
              [[ -n "$p" ]] || {
                echo "::error::$PRESET requires the advanced path override"
                exit 2
              }
              ;;
          esac

          if [[ -n "$p" ]]; then
            [[ -e "$p" ]] || {
              echo "::error::resolved chess input does not exist: $p"
              exit 1
            }
          fi

          if [[ "$REPLACE_INPUT" == 1 && "$pathless_derived" != 1 ]]; then
            echo "::error::replace-existing is only valid for complete pathless derived operations"
            exit 2
          fi
          if [[ "$CONFIRM_REPLACE_INPUT" == 1 && "$REPLACE_INPUT" != 1 ]]; then
            echo "::error::replacement confirmation was selected without replacement"
            exit 2
          fi

          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "path=$p" >> "$GITHUB_OUTPUT"

          {
            echo "## Chess ingest selection"
            echo
            echo "- Preset: $PRESET"
            echo "- Source mode: $source"
            echo "- Resolved input: ${p:-derived/database state}"
            echo "- Lumbras slice: $SLICE_INPUT"
            echo "- Replace derived source first: $REPLACE_INPUT"
          } >> "$GITHUB_STEP_SUMMARY"

  seed:
    needs: resolve
    uses: ./.github/workflows/seed.yml
    with:
      mode: source
      source: ${{ needs.resolve.outputs.source }}
      path: ${{ needs.resolve.outputs.path }}
      database: ${{ inputs.database }}
      chess_derived: ${{ needs.resolve.outputs.source == 'chess' && inputs.derive_after_games }}
      evict_before_ingest: ${{ inputs.replace_existing_source }}
      confirm_evict: ${{ inputs.confirm_replace_existing }}
      run_gate: true
      run_idempotency: ${{ inputs.run_idempotency }}
