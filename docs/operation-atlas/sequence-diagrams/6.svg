.441" fill="#000" font-size="12" textLength="151.4">6.5 Declare the trust classes</text><rect x="137.383" y="369.078" width="165.412" height="35.094" fill="#E6EFF7" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="147.383" y="391.535" fill="#000" font-size="12" textLength="145.412">6.6 Declare the entity types</text><rect x="107.359" y="424.172" width="225.459" height="35.094" fill="#E6EFF7" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="117.359" y="446.629" fill="#000" font-size="12" textLength="205.459">6.7 Declare the governed vocabularies</text><rect x="99.695" y="479.266" width="240.787" height="35.094" fill="#E6EFF7" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="109.695" y="501.723" fill="#000" font-size="12" textLength="220.787">6.8 Declare the model operator templates</text><rect x="112.05" y="534.359" width="216.078" height="35.094" fill="#E6EFF7" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="122.05" y="556.816" fill="#000" font-size="12" textLength="196.078">6.9 Declare the firmware policy kinds</text><rect x="55.674" y="589.453" width="328.83" height="35.094" fill="#E6EFF7" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="65.674" y="611.91" fill="#000" font-size="12" textLength="308.83">6.10 Generate the code and the ROMs from the manifests</text><ellipse cx="220.089" cy="655.547" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="220.089" cy="655.547" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="220.089" y1="73.609" x2="220.089" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="216.089,83.609,220.089,93.609,224.089,83.609,220.089,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="220.089" y1="128.703" x2="220.089" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="216.089,138.703,220