name: Canonical generated sink repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/canonical-generated-sink-repair.yml
      - .github/scripts/canonical_generated_sink_repair.py
      - .github/scripts/canonical_generated_sink_fixup.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply canonical generated-sink transform
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/canonical_generated_sink_repair.py')
          s=p.read_text()
          old='if "SQ_LOCK" in tt or "accept_limit" in tt or "accept_none" in tt:'
          new='if "accept_limit" in tt or "accept_none" in tt:'
          if s.count(old) != 1:
              raise SystemExit('repair guard shape changed')
          p.write_text(s.replace(old,new,1))
          PY
          python3 .github/scripts/canonical_generated_sink_repair.py
          python3 .github/scripts/canonical_generated_sink_fixup.py
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -R "SQ_LOCK\|pg_laplace_entity_write_lock" extension/laplace_substrate/src/generated_stage_sink.c extension/laplace_substrate/tests/generated_stage_sink_native_probe.c
          git config user.name "Laplace CI repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/canonical-generated-sink-repair.yml \
                 .github/scripts/canonical_generated_sink_repair.py \
                 .github/scripts/canonical_generated_sink_fixup.py
          git add extension/laplace_substrate/src/generated_stage_sink.c \
                  extension/laplace_substrate/src/generated_stage_sink.h \
                  extension/laplace_substrate/tests/generated_stage_sink_native_probe.c \
                  engine/core/src/sql_catalog.def \
                  app/Laplace.Substrate/Crud/Npgsql/ConsensusAccumulatingWriter.cs \
                  app/Laplace.Substrate.Tests/Abstractions/GeneratedStageSinkArchitectureTests.cs
          git commit -m "refactor: collapse generated writes onto canonical law"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
