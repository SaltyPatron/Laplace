          unicode_files=[{"bytes":2827429,"path":"ucd/NormalizationTest.txt","role":"uax15-conformance","sha256":"5019ffd530751a741900c849c0e010332f142a3612234639bd200b82138a87db","url":"https://www.unicode.org/Public/17.0.0/ucd/NormalizationTest.txt"},{"bytes":126570,"path":"ucd/auxiliary/GraphemeBreakTest.txt","role":"uax29-grapheme-conformance","sha256":"e2d134d2c52919bace503ebb6a551c1855fe1a1faec18478c78fff254a1793ec","url":"https://www.unicode.org/Public/17.0.0/ucd/auxiliary/GraphemeBreakTest.txt"},{"bytes":322136,"path":"ucd/auxiliary/WordBreakTest.txt","role":"uax29-word-conformance","sha256":"1de23a75f37904abc7d206239ee8d34f8fdf0fb4ab32a7174dfbabbde25419b2","url":"https://www.unicode.org/Public/17.0.0/ucd/auxiliary/WordBreakTest.txt"},{"bytes":87946,"path":"ucd/auxiliary/SentenceBreakTest.txt","role":"uax29-sentence-conformance","sha256":"12cb47d028ded0c1cb8a28558f95479cbcd24559c46977015c82f3b50a1cc6e4","url":"https://www.unicode.org/Public/17.0.0/ucd/auxiliary/SentenceBreakTest.txt"},{"bytes":2304434,"path":"uca/allkeys.txt","role":"ducet-explicit-and-implicit-collation-elements","sha256":"2503d09367c2639a4fb8fd55e81aaacb0d9fb4ea26600333329bd12456b99ecd","url":"https://www.unicode.org/Public/17.0.0/uca/allkeys.txt"}]
          def command(args,timeout=180):
              try:
                  return subprocess.run(args,check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=timeout).stdout
              except subprocess.CalledProcessError as error:
                  print(error.stdout.decode(errors="replace"),flush=True)
                  raise
          def acquire(item):
              path=external/item["name"];path.mkdir(parents=True)
              command(["git","init","-q",str(path)])
              command(["git","-C",str(path),"-c","protocol.version=2","fetch","--no-tags","--depth=1",item["url"],item["revision"]])
              observed=command(["git","-C",str(path),"rev-parse","FETCH_HEAD"]).decode().strip()
              if observed!=item["revision"]:raise RuntimeError("immutable upstream revision mismatch")
              archive=path/"qualification.tar"
              with archive.open("xb") as stream:
                  subprocess.run(["git","-C",str(path),"archive","--format=tar",observed],check=True,stdout=stream,timeout=120)
              digest=hashlib.file_digest(archive.open("rb"),"sha256").hexdigest()
              if digest!=item["archive_sha256"]:raise RuntimeError("upstream Git archive digest mismatch: "+item["name"])
              archive.unlink()
              command(["git","-C",str(path),"checkout","--detach","-q",observed])
              print("qualified dependency",item["name"],observed,flush=True)
              return item
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              acquired=list(pool.map(acquire,dependencies))
          for item in unicode_files:
              path=ucd/item["path"];path.parent.mkdir(parents=True,exist_ok=True)
              command(["curl","--fail","--location","--proto","=https","--connect-timeout","20","--max-time","120","--max-filesize","10000000",item["url"],"--output",str(path)])
              if path.stat().st_size!=item["bytes"] or hashlib.file_digest(path.open("rb"),"sha256").hexdigest()!=item["sha256"]:
                  raise RuntimeError("pinned Unicode input mismatch: "+item["path"])
          xml=ucd/"ucdxml/ucd.nounihan.flat.zip";xml.parent.mkdir()
          xml_url="https://www.unicode.org/Public/17.0.0/ucdxml/ucd.nounihan.flat.zip"
          command(["curl","--fail","--location","--proto","=https","--connect-timeout","20","--max-time","120","--max-filesize","25000000",xml_url,"--output",str(xml)])
          with zipfile.ZipFile(xml) as archive:
              members=archive.infolist()
              if len(members)!=1 or members[0].filename!="ucd.nounihan.flat.xml" or members[0].file_size>200000000:
                  raise RuntimeError("unexpected official UCDXML archive")
              with archive.open(members[0]) as stream:
                  member_hash=hashlib.file_digest(stream,"sha256").hexdigest()
          receipt={"schema":"laplace.hosted-native-qualification-inputs/v1",
                   "scope":"isolated upstream build inputs; not installed Original dependency provenance",
                   "pin_source":{"repository":"SaltyPatron/Laplace-Refactor","commit":"e5fb773c3c5758679eb13c3dd228a0ba2aab27af",
                                 "dependency_lock_blob":"ebdeb881c389a00f6b8a52fd069c1049e886058c",
                                 "grammar_lock_blob":"da364f3938a9d23fd54a1857431817c9b14a7453",
                                 "unicode_source_contract_blob":"ea504d53c83d0820b9cfb02be7d6cf278db8c4e3"},
                   "dependencies":acquired,"pinned_unicode_files":unicode_files,
                   "official_ucdxml_observation":{"url":xml_url,"bytes":xml.stat().st_size,
                       "sha256":hashlib.file_digest(xml.open("rb"),"sha256").hexdigest(),
                       "member_sha256":member_hash,"identity_kind":"observed official versioned HTTPS download"}}
          (evidence/"inputs.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Build genuine native core, Fathom and sealed finite chess floors
        shell: bash
        run: |
          set -euo pipefail
          qualification_dir="$QUALIFICATION_DIR"
          build_dir="$QUALIFICATION_BUILD"
          cd "$QUALIFICATION_SOURCE"
          timeout --signal=TERM --kill-after=15s 180s cmake -S engine -B "$build_dir" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DLAPLACE_EXTERNAL="$qualification_dir/external" -DLAPLACE_UCD_PATH="$qualification_dir/unicode" \
            -DLAPLACE_REQUIRE_MKL=OFF -DLAPLACE_SYNTHESIS_REQUIRE_MKL=OFF -DLAPLACE_CHESS_OPENINGS=NONE \
            '-DLAPLACE_INSTALL_FILE_PERMS=OWNER_READ;OWNER_WRITE;GROUP_READ;WORLD_READ' \
            '-DLAPLACE_INSTALL_EXEC_PERMS=OWNER_READ;OWNER_WRITE;OWNER_EXECUTE;GROUP_READ;GROUP_EXECUTE;WORLD_READ;WORLD_EXECUTE' \
            '-DLAPLACE_INSTALL_DIR_PERMS=OWNER_READ;OWNER_WRITE;OWNER_EXECUTE;GROUP_READ;GROUP_EXECUTE;WORLD_READ;WORLD_EXECUTE' \
            2>&1 | tee "$qualification_dir/evidence/configure.log"
          timeout --signal=TERM --kill-after=15s 1800s cmake --build "$build_dir" --parallel 2 \
            --target laplace_core laplace_core_tests laplace_syzygy laplace_t0_perfcache laplace_modality_number_perfcache laplace_highway_perfcache \
            2>&1 | tee "$qualification_dir/evidence/native-build.log"
          timeout --signal=TERM --kill-after=15s 600s cmake --build "$build_dir" --parallel 2 \
            --target laplace_chess_position_perfcache \
            2>&1 | tee "$qualification_dir/evidence/chess-floor-build.log"
          test -s "$build_dir/core/liblaplace_core.so"
          test -s "$build_dir/core/liblaplace_syzygy.so"
          test -s "$build_dir/core/perfcache/chess-floor-pair.json"
          cp "$build_dir/CMakeCache.txt" "$qualification_dir/evidence/CMakeCache.txt"
      - name: Execute complete native core tests and compile PostgreSQL 18 consumers
        shell: bash
        run: |
          set -euo pipefail
          cd "$QUALIFICATION_SOURCE"
          "$QUALIFICATION_BUILD/core/tests/laplace_core_tests" --gtest_list_tests > "$QUALIFICATION_DIR/evidence/native-test-list.txt"
          timeout --signal=TERM --kill-after=15s 900s "$QUALIFICATION_BUILD/core/tests/laplace_core_tests" \
            "--gtest_output=xml:$QUALIFICATION_DIR/evidence/native-tests.xml" \
            2>&1 | tee "$QUALIFICATION_DIR/evidence/native-tests.log"
          python3 - <<'PY'
          import json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          evidence=Path(os.environ["QUALIFICATION_DIR"])/"evidence"
          tests=ET.parse(evidence/"native-tests.xml").getroot()
          cases=list(tests.iter("testcase"))
          assert cases and not list(tests.iter("failure")) and not list(tests.iter("error"))
          required={"InterpretationsRetainOriginalPairsWithoutChangingLegacySemanticBytes",
                    "InterpretationImportIsExplicitCompleteValidatedAndNondestructive",
                    "InterpretationPartitionBudgetAndRetentionFollowStageOwnership",
                    "PresentContentRetainsInterpretationsAndExactPhysicalityObservations"}
          assert required <= {x.attrib["name"] for x in cases if x.find("skipped") is None}
          receipt={"selected":len(cases),"passed":sum(x.find("skipped") is None for x in cases),
              "skipped":[{"class":x.attrib.get("classname"),"name":x.attrib["name"],
                  "reason":"".join(x.find("skipped").itertext())} for x in cases if x.find("skipped") is not None]}
          (evidence/"native-result.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt),flush=True)
          PY
          pg_source="$QUALIFICATION_DIR/external/postgresql"
          (
            cd "$pg_source"
            timeout --signal=TERM --kill-after=15s 180s ./configure --without-readline --without-zlib --without-icu
            timeout --signal=TERM --kill-after=15s 180s make -C src/backend generated-headers -j2
          ) 2>&1 | tee "$QUALIFICATION_DIR/evidence/pg18-header-build.log"
          for unit in generated_stage_sink recall generate_walk task_shape physicality_descriptor_admission; do
            cc -std=gnu11 -O2 -fPIC -fsyntax-only -Werror=implicit-function-declaration -Wno-unused-parameter \
              -I"$pg_source/src/include" -I"$QUALIFICATION_SOURCE/engine/core/include" \
              "$QUALIFICATION_SOURCE/extension/laplace_substrate/src/$unit.c" \
              2>&1 | tee "$QUALIFICATION_DIR/evidence/compile-$unit.log"
          done
          cc -std=gnu11 -O2 -ffunction-sections -fdata-sections -Wno-unused-parameter \
            -I"$pg_source/src/include" -I"$QUALIFICATION_SOURCE/engine/core/include" \
            "$QUALIFICATION_SOURCE/extension/laplace_substrate/tests/generated_stage_sink_native_probe.c" \
            -L"$QUALIFICATION_BUILD/core" -Wl,-rpath,"$QUALIFICATION_BUILD/core" \
            -Wl,--gc-sections -llaplace_core -lm -o "$QUALIFICATION_BUILD/generated_stage_sink_probe" \
            2>&1 | tee "$QUALIFICATION_DIR/evidence/sink-probe-build.log"
          "$QUALIFICATION_BUILD/generated_stage_sink_probe" 2>&1 | tee "$QUALIFICATION_DIR/evidence/sink-probe.log"
      - name: Compile managed consumers and focused regression assemblies
        shell: bash
        run: |
          set -euo pipefail
          cd "$QUALIFICATION_SOURCE"
          for project in Laplace.Core.Tests Laplace.Chess.Tests Laplace.Substrate.Tests Laplace.Decomposers.Tests; do
            timeout --signal=TERM --kill-after=15s 600s dotnet build "app/$project/$project.csproj" -c Release -m:2 -p:UseSharedCompilation=false \
              2>&1 | tee "$QUALIFICATION_DIR/evidence/build-$project.log"
          done
      - name: Supply the existing finite opening fixture to analyzer controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          source=Path(os.environ["QUALIFICATION_SOURCE"])/"app/Laplace.Chess.Tests/Service/OpeningSeedReplayTests.cs"
          raw=source.read_bytes()
          blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          assert blob=="acb02d6247cb558c3f59ba3def036282b7edbc64"
          body=re.search(r"File\.WriteAllText\(path,\s*(.*?)\);\s*test\(path\);",raw.decode(),re.S).group(1)
          literal=r'"(?:[^"\\]|\\.)*"'
          assert re.fullmatch(r"\s*"+literal+r"(?:\s*\+\s*"+literal+r")*\s*",body)
          contents="".join(json.loads(item) for item in re.findall(literal,body)).encode()
          lines=contents.decode().splitlines()
          assert lines[0]=="eco\tname\tpgn" and len(lines)==4
          work=Path(os.environ["QUALIFICATION_DIR"])
          fixture=work/"opening-fixture"
          fixture.mkdir(mode=0o700)
          target=fixture/"a.tsv"
          with target.open("xb") as stream: stream.write(contents)
          receipt={"schema":"laplace.hosted-opening-fixture/v1",
              "source_path":str(source),"source_blob":blob,"path":str(target),
              "sha256":hashlib.sha256(contents).hexdigest(),"rows":3,
              "scope":"Existing finite opening replay fixture for analyzer unit controls; not the installed opening corpus"}
          (work/"evidence/opening-fixture.json").write_text(json.dumps(receipt,indent=2)+"\n")
          with open(os.environ["GITHUB_ENV"],"a") as environment:
              environment.write("LAPLACE_CHESS_OPENINGS="+str(fixture)+"\n")
          print(json.dumps(receipt,sort_keys=True),flush=True)
          PY
      - name: Run focused managed controls against the built native libraries
        shell: bash
        run: |
          set -euo pipefail
          cd "$QUALIFICATION_SOURCE"
          python3 - <<'PY' 2>&1 | tee "$QUALIFICATION_DIR/evidence/focused-controls.log"
          import hashlib,json,os,signal,subprocess,time,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path(os.environ["QUALIFICATION_SOURCE"])
          build=Path(os.environ["QUALIFICATION_BUILD"])
          evidence=Path(os.environ["QUALIFICATION_DIR"])/"evidence"
          native=build/"core/liblaplace_core.so"
          native_hash=hashlib.file_digest(native.open("rb"),"sha256").hexdigest()
          suites=[
              ("Laplace.Core.Tests",["IntentStageEntityInterpretationTests","IntentStageTests"]),
              ("Laplace.Chess.Tests",["ChessGraphPresenceObservationTests","ChessPgnChunkTests","ChessUnitCompletionTests"]),
              ("Laplace.Substrate.Tests",["EntityInterpretationIdentityTests","EntityInterpretationChangeTests",
                  "PhysicalityAdmissionTransportTests","TextEntityBuilderEmissionTests","IngestAdmissionSizingTests",
                  "ContentWitnessContainmentTests","GrammarComposeContainmentTests","CopyTupleParserTests",
                  "IngestUnitCompletionIdentityTests","IngestCompletionGateTests"])]
          excluded=["TextEntityBuilderEmissionTests.FullGalileo_InMemory_RoundtripsFromPhysicalities"]
          results=[]
          for project,classes in suites:
              project_path=root/"app"/project/(project+".csproj")
              output=Path(os.environ["LAPLACE_BUILD_ROOT"])/"app/bin"/project/"Release/net10.0"
              assembly=output/(project+".dll")
              copied=output/"liblaplace_core.so"
              assert assembly.is_file() and copied.is_file(), (assembly,copied)
              copied_hash=hashlib.file_digest(copied.open("rb"),"sha256").hexdigest()
              assert copied_hash==native_hash, "managed output copied a different native core"
              selection="("+"|".join("FullyQualifiedName~"+name for name in classes)+")"
              selection+="&FullyQualifiedName!~FullGalileo_"
              trx_dir=evidence/project
              trx_dir.mkdir()
              command=["dotnet","test",str(project_path),"-c","Release","--no-build","--no-restore",
                       "--filter",selection,"--logger","trx;LogFileName=results.trx",
                       "--results-directory",str(trx_dir)]
              print("RUN",json.dumps(command),flush=True)
              mappings={}
              deadline=time.monotonic()+900
              with (trx_dir/"output.log").open("w") as log:
                  process=subprocess.Popen(command,cwd=root,stdout=log,stderr=subprocess.STDOUT,
                                           start_new_session=True)
                  try:
                      while process.poll() is None:
                          if time.monotonic()>deadline:raise TimeoutError(project)
                          parents={}
                          for directory in Path("/proc").iterdir():
                              if not directory.name.isdecimal():continue
                              try:
                                  tail=(directory/"stat").read_text().rsplit(")",1)[1].split()
                                  parents[int(directory.name)]=int(tail[1])
                              except (OSError,ValueError,IndexError):pass
                          descendants={process.pid}
                          while True:
                              expanded=descendants|{pid for pid,parent in parents.items() if parent in descendants}
                              if expanded==descendants:break
                              descendants=expanded
                          for pid in descendants:
                              try:lines=Path(f"/proc/{pid}/maps").read_text().splitlines()
                              except OSError:continue
                              for line in lines:
                                  fields=line.split(maxsplit=5)
                                  if len(fields)!=6 or "liblaplace_core.so" not in fields[5] or "x" not in fields[1]:continue
                                  assert not fields[5].endswith(" (deleted)"), "deleted core mapping"
                                  path=Path(fields[5])
                                  try:st=path.stat()
                                  except FileNotFoundError:continue
                                  device=f"{os.major(st.st_dev):x}:{os.minor(st.st_dev):x}"
                                  map_device=":".join(f"{int(part,16):x}" for part in fields[3].split(":"))
                                  assert map_device==device and int(fields[4])==st.st_ino, "core file generation mismatch"
                                  key=(str(path.resolve()),st.st_dev,st.st_ino)
                                  if key not in mappings:
                                      digest=hashlib.file_digest(path.open("rb"),"sha256").hexdigest()
                                      assert digest==native_hash, "test process loaded a different native core"
                                      mappings[key]={"path":key[0],"device":device,"inode":st.st_ino,
                                                     "sha256":digest,"permissions":fields[1]}
                          time.sleep(0.05)
                      returncode=process.wait(timeout=5)
                  finally:
                      if process.poll() is None:
                          os.killpg(process.pid,signal.SIGTERM)
                          try:process.wait(timeout=15)
                          except subprocess.TimeoutExpired:
                              os.killpg(process.pid,signal.SIGKILL);process.wait(timeout=5)
              print((trx_dir/"output.log").read_text(),flush=True)
              trx=trx_dir/"results.trx"
              assert returncode==0 and trx.is_file(), (project,returncode)
              ns={"t":"http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
              document=ET.parse(trx)
              definitions={}
              for test in document.findall(".//t:TestDefinitions/t:UnitTest",ns):
                  method=test.find("t:TestMethod",ns)
                  assert method is not None
                  definitions[test.attrib["id"]]=method.attrib["className"]+"."+method.attrib["name"]
              cases=[]
              for result in document.findall(".//t:Results/t:UnitTestResult",ns):
                  case={"name":definitions[result.attrib["testId"]],"display_name":result.attrib["testName"],
                        "outcome":result.attrib["outcome"]}
                  assert case["outcome"]=="Passed", case
                  assert not any(item in case["name"] for item in excluded), case
                  cases.append(case)
              assert cases and all(any(name in case["name"] for case in cases) for name in classes), (classes,cases)
              assert mappings, "actual executing test process native mapping was not observed"
              receipt={"project":project,"filter":selection,"passed":len(cases),"tests":cases,
                       "assembly":str(assembly),"app_core_sha256":copied_hash,
                       "native_mappings":list(mappings.values())}
              results.append(receipt)
              (trx_dir/"receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
              print(json.dumps({"project":project,"passed":len(cases),"observed_native_mappings":len(mappings)}),flush=True)
          floors={}
          for name in ["laplace_t0_perfcache.bin","laplace_modality_number_perfcache.bin",
                       "laplace_highway_perfcache.bin","laplace_chess_position_perfcache.bin",
                       "laplace_chess_transition_perfcache.bin","chess-floor-pair.json",
                       "chess_openings_inputs.txt"]:
              path=build/"core/perfcache"/name
              assert path.is_file(), path
              floors[name]={"bytes":path.stat().st_size,
                            "sha256":hashlib.file_digest(path.open("rb"),"sha256").hexdigest()}
          receipt={"schema":"laplace.hosted-canonical-identity-controls/v1",
                   "scope":"managed compilation and selected controls using genuine hosted native producers",
                   "source_commit":(evidence/"source-commit.txt").read_text().strip(),
                   "manifest_blob":"022b7a48cfb0fdf346927cbae1af7022f17bbb24",
                   "core_sha256":native_hash,"native_floors":floors,"chess_seed_input":"NONE",
                   "opening_classifier_fixture":json.loads((evidence/"opening-fixture.json").read_text()),
                   "excluded_external_corpus_tests":excluded,
                   "not_executed":["installed PostgreSQL interruption/re-admission and catalog-order tests",
                                   "installed host corpus, Stockfish calibration and recorded throughput"],
                   "results":results}
          (evidence/"result.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,sort_keys=True),flush=True)
          PY
      - name: Retain build and executed-control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-identity-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUALIFICATION_DIR }}/evidence
          if-no-files-found: error
          retention-days: 14
