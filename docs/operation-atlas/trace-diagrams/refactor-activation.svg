<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1297px;height:1070px;background:#FAFCFF;" width="1297px" height="1070px" viewBox="0 0 1297 1070" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1297" height="1070" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="5"><text x="480.637" y="24.533" fill="#000" font-size="14" textLength="328.727" font-weight="700">Refactor — admit, commit or abort staged effects</text></g><g class="entity" data-qualified-name="Staged" id="ent0001" data-source-line="6"><rect x="770.5" y="125.609" width="199.375" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="770.5" y1="153.219" x2="969.875" y2="153.219" style="stroke:#181818;stroke-width:0.5;"/><text x="780.5" y="145.143" fill="#000" font-size="14" textLength="179.375">Staged inert artifact + receipt</text></g><g class="entity" data-qualified-name="Check" id="ent0002" data-source-line="7"><rect x="804" y="253.609" width="132.041" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="804" y1="281.219" x2="936.041" y2="281.219" style="stroke:#181818;stroke-width:0.5;"/><text x="814" y="273.143" fill="#000" font-size="14" textLength="112.041">Admission checks</text></g><g class="entity" data-qualified-name="Prepare" id="ent0003" data-source-line="8"><rect x="641.5" y="400.109" width="146.848" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="641.5" y1="427.719" x2="788.348" y2="427.719" style="stroke:#181818;stroke-width:0.5;"/><text x="651.5" y="419.643" fill="#000" font-size="14" textLength="126.848">Provider preparation</text></g><g class="entity" data-qualified-name="Admitted" id="ent0004" data-source-line="9"><rect x="464.5" y="530.609" width="183.345" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="464.5" y1="575.828" x2="647.845" y2="575.828" style="stroke:#181818;stroke-width:0.5;"/><text x="474.5" y="550.143" fill="#000" font-size="14" textLength="163.345">ACTIVATION_ADMITTED</text><text x="474.5" y="567.752" fill="#000" font-size="14" textLength="66.138">OK receipt</text></g><g class="entity" data-qualified-name="Commit" id="ent0005" data-source-line="10"><rect x="323.5" y="676.109" width="121.131" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="323.5" y1="703.719" x2="444.631" y2="703.719" style="stroke:#181818;stroke-width:0.5;"/><text x="333.5" y="695.643" fill="#000" font-size="14" textLength="101.131">Provider commit</text></g><g class="entity" data-qualified-name="Activated" id="ent0006" data-source-line="11"><rect x="173.5" y="816.609" width="98.565" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="173.5" y1="861.828" x2="272.065" y2="861.828" style="stroke:#181818;stroke-width:0.5;"/><text x="183.5" y="836.143" fill="#000" font-size="14" textLength="78.565">ACTIVATED</text><text x="183.5" y="853.752" fill="#000" font-size="14" textLength="66.138">OK receipt</text></g><g class="entity" data-qualified-name="Aborted" id="ent0007" data-source-line="12"><rect x="487" y="673.609" width="137.51" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="487" y1="718.828" x2="624.51" y2="718.828" style="stroke:#181818;stroke-width:0.5;"/><text x="497" y="693.143" fill="#000" font-size="14" textLength="107.352">STAGED_INERT</text><text x="497" y="710.752" fill="#000" font-size="14" textLength="117.51">OK aborted receipt</text></g><g class="entity" data-qualified-name="AdmissionFailed" id="ent0008" data-source-line="13"><rect x="792" y="530.609" width="166.296" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="792" y1="575.828" x2="958.296" y2="575.828" style="stroke:#181818;stroke-width:0.5;"/><text x="802" y="550.143" fill="#000" font-size="14" textLength="107.352">STAGED_INERT</text><text x="802" y="567.752" fill="#000" font-size="14" textLength="146.296">admission failed receipt</text></g><g class="entity" data-qualified-name="CommitFailed" id="ent0009" data-source-line="14"><rect x="469.5" y="816.609" width="151.489" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="469.5" y1="861.828" x2="620.989" y2="861.828" style="stroke:#181818;stroke-width:0.5;"/><text x="479.5" y="836.143" fill="#000" font-size="14" textLength="131.489">Commit failed receipt</text><text x="479.5" y="853.752" fill="#000" font-size="14" textLength="126.848">provider abort called</text></g><g class="entity" data-qualified-name="Rejected" id="ent0010" data-source-line="15"><rect x="871" y="397.609" width="310.261" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="871" y1="442.828" x2="1181.261" y2="442.828" style="stroke:#181818;stroke-width:0.5;"/><text x="881" y="417.143" fill="#000" font-size="14" textLength="290.261">Rejected request / context / authority / provider</text><text x="881" y="434.752" fill="#000" font-size="14" textLength="133.861">hashed failure receipt</text></g><g class="start_entity" data-qualified-name=".start." id="ent0011" data-source-line="16"><ellipse cx="870" cy="54.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="27"><path d="M660.5,663.609 L660.5,739.016 A0,0 0 0 0 660.5,739.016 L1135.294,739.016 A0,0 0 0 0 1135.294,739.016 L1135.294,673.609 L1125.294,663.609 L813.44,663.609 L620.33,585.629 L805.44,663.609 L660.5,663.609 A0,0 0 0 0 660.5,663.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1125.294,663.609 L1125.294,673.609 L1135.294,673.609 L1125.294,663.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="666.5" y="682.104" fill="#000" font-size="13" textLength="206.629">Normal admission does not commit.</text><text x="666.5" y="698.456" fill="#000" font-size="13" textLength="341.06">activate_staged_stream is convenience admit then commit.</text><text x="666.5" y="714.808" fill="#000" font-size="13" textLength="453.794">Commit/abort validate receipt, context and epoch request before provider calls.</text><text x="666.5" y="731.159" fill="#000" font-size="13" textLength="427.8">Abort clears the activation fingerprint; validation failure returns unchanged.</text></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="33"><path d="M6,932.609 L6,991.664 A0,0 0 0 0 6,991.664 L440.353,991.664 A0,0 0 0 0 440.353,991.664 L440.353,942.609 L430.353,932.609 L227,932.609 L223,871.719 L219,932.609 L6,932.609 A0,0 0 0 0 6,932.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M430.353,932.609 L430.353,942.609 L440.353,942.609 L430.353,932.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="951.104" fill="#000" font-size="13" textLength="339.581">Framework receipt records provider return and fingerprints.</text><text x="12" y="967.456" fill="#000" font-size="13" textLength="413.353">External effects, atomicity, compensation and durable epoch publication</text><text x="12" y="983.808" fill="#000" font-size="13" textLength="384.439">depend on the concrete provider; the framework cannot infer them.</text></g><!--link *start* to Staged--><g class="link" data-entity-1="ent0011" data-entity-2="ent0001" id="lnk12" data-source-line="16" data-link-type="dependency"><path d="M870,64.619 C870,78.499 870,100.579 870,120.449" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Staged"/><polygon points="870,125.449,874,116.449,870,120.449,866,116.449,870,125.449" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Staged to Check--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk13" data-source-line="17" data-link-type="dependency"><path d="M870,175.899 C870,198.219 870,226.099 870,248.389" style="stroke:#181818;stroke-width:1;" fill="none" id="Staged-to-Check"/><polygon points="870,253.389,874,244.389,870,248.389,866,244.389,870,253.389" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="871" y="220.104" fill="#000" font-size="13" textLength="125.011">admit_staged_stream</text></g><!--link Check to Rejected--><g class="link" data-entity-1="ent0002" data-entity-2="ent0010" id="lnk14" data-source-line="18" data-link-type="dependency"><path d="M936.06,300.089 C954.31,308.239 972.95,319.189 987,333.609 C1004.2,351.249 1013.022,372.87 1018.642,392.62" style="stroke:#181818;stroke-width:1;" fill="none" id="Check-to-Rejected"/><polygon points="1020.01,397.429,1021.394,387.678,1018.642,392.62,1013.7,389.868,1020.01,397.429" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1010" y="348.104" fill="#000" font-size="13" textLength="271">invalid context, staged receipt binding, request,</text><text x="1011.45" y="364.456" fill="#000" font-size="13" textLength="268.1">read-only flag, expected epoch or provider ABI</text></g><!--link Check to Prepare--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk15" data-source-line="19" data-link-type="dependency"><path d="M803.97,284.549 C770.63,290.789 732.91,304.369 712,333.609 C698.38,352.659 700.376,375.359 705.476,395.039" style="stroke:#181818;stroke-width:1;" fill="none" id="Check-to-Prepare"/><polygon points="706.73,399.879,708.344,390.164,705.476,395.039,700.6,392.171,706.73,399.879" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="713" y="356.104" fill="#000" font-size="13" textLength="269.534">valid request; expected epoch differs from next</text></g><!--link Prepare to AdmissionFailed--><g class="link" data-entity-1="ent0003" data-entity-2="ent0008" id="lnk16" data-source-line="20" data-link-type="dependency"><path d="M786.4,450.129 C804.05,458.449 821.92,469.159 836,482.609 C849.72,495.719 857.663,510.103 864.033,525.633" style="stroke:#181818;stroke-width:1;" fill="none" id="Prepare-to-AdmissionFailed"/><polygon points="865.93,530.259,866.215,520.415,864.033,525.633,858.814,523.451,865.93,530.259" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="852" y="497.104" fill="#000" font-size="13" textLength="185.701">prepare fails / call provider.abort</text></g><!--link Prepare to Admitted--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk17" data-source-line="21" data-link-type="dependency"><path d="M641.43,432.859 C608.75,439.949 573.18,454.199 553,482.609 C543.33,496.219 543.145,510.136 546.355,525.456" style="stroke:#181818;stroke-width:1;" fill="none" id="Prepare-to-Admitted"/><polygon points="547.38,530.349,549.449,520.72,546.355,525.456,541.619,522.361,547.38,530.349" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="554" y="497.104" fill="#000" font-size="13" textLength="277.494">prepare succeeds / retain preparation fingerprint</text></g><!--link Admitted to Commit--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk18" data-source-line="22" data-link-type="dependency"><path d="M464.18,583.479 C446.52,591.469 429.38,601.939 416,615.609 C399.98,631.979 392.895,652.274 388.835,670.894" style="stroke:#181818;stroke-width:1;" fill="none" id="Admitted-to-Commit"/><polygon points="387.77,675.779,393.596,667.838,388.835,670.894,385.779,666.134,387.77,675.779" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="417" y="630.104" fill="#000" font-size="13" textLength="130.051">commit after validation</text></g><!--link Commit to CommitFailed--><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" id="lnk19" data-source-line="23" data-link-type="dependency"><path d="M444.29,726.149 C465.65,736.809 488.66,750.979 506,768.609 C519.31,782.139 527.227,796.528 533.697,811.958" style="stroke:#181818;stroke-width:1;" fill="none" id="Commit-to-CommitFailed"/><polygon points="535.63,816.569,535.839,806.723,533.697,811.958,528.461,809.816,535.63,816.569" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="522" y="783.104" fill="#000" font-size="13" textLength="182.781">commit fails / call provider.abort</text></g><!--link Commit to Activated--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk20" data-source-line="24" data-link-type="dependency"><path d="M323.26,709.069 C285.56,716.889 239.89,733.459 216,768.609 C206.58,782.469 207.114,796.456 211.274,811.706" style="stroke:#181818;stroke-width:1;" fill="none" id="Commit-to-Activated"/><polygon points="212.59,816.529,214.08,806.794,211.274,811.706,206.362,808.899,212.59,816.529" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="217" y="783.104" fill="#000" font-size="13" textLength="280.357">commit succeeds / fingerprint and rehash receipt</text></g><!--link Admitted to Aborted--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk21" data-source-line="25" data-link-type="dependency"><path d="M556,585.629 C556,610.679 556,643.059 556,668.229" style="stroke:#181818;stroke-width:1;" fill="none" id="Admitted-to-Aborted"/><polygon points="556,673.229,560,664.229,556,668.229,552,664.229,556,673.229" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="557" y="630.104" fill="#000" font-size="13" textLength="117.793">abort after validation</text></g><g class="footer" data-source-line="37"><text x="452.124" y="1011.045" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="456.868" y="1023.623" fill="#888" font-size="10" textLength="376.265">claimed. Admission, commit, abort, admitted-receipt validation and committed-receipt</text><text x="449.322" y="1036.201" fill="#888" font-size="10" textLength="391.357">identity validation bodies reviewed. Context binding and expected-epoch checks apply in</text><text x="440.471" y="1048.779" fill="#888" font-size="10" textLength="409.058">normal builds. Explicit named test mutations can remove checks or commit during admission</text><text x="538.262" y="1061.357" fill="#888" font-size="10" textLength="213.477">and are not represented as production behavior.</text></g><?plantuml-src TLRTRYir4BxVfnWTBf0WITEVDAILa4ARG0Ja73KHDnHLNdksCTsr5zkRzjpn43mXJyBONcyswU6cwzZpyyqttzZz6XPxAL1nl85VM5qoZiC7B1XtsfoXUfOApwpXPuLX5RvgypBYiFbfVZ6vXc9IpCOSnVXoCfjUJsONE1FY_6es_MuokxvY-IGl9bFabxFpOdfrde-BwNGydXMNu-cOjekBpBv8LJCA33dZByz6DqhSwL8R-6evNzujbpqBksD2lqhr30KhBVPE1A5jIhVKogq98soOiXiqiiYST2L2gWR-_ViVOAAIRW1SL_G5scIvDWwiOyye08i2kRCP_NG87pPnboWW4sQSz87WMp38KTRk0p0BqIPvp2cyjL8hu3laBpQOtFbbilXajEVRG6tGutTa7Am-XT_OHRhRhdwRRrSVrq_p-rzNs-tY_b5z_Faejy_ct25x5pkM5vE7vKdKByNYJkvPBzXcE_znSV-qMYyUji4wC4Lq77d5lI_xi8wCWidor3CTBiDPYX3XdZWygZfL5jl5MKd7lVgEWppWdzJ6uFzNWzR16J6Y7Bxv5MlSJXlfFjCwXNrKEsPtvE3pDWQFaAPesU_V_073uVUfvQqw_4xeCDn4TJr5CT778AkoUEQjEbWt9AazAwL8i0P9W6rUoAKIfFL1gc3mg2YO66fLVeQYP7I2RtMCXhNcEo_bZgJv3wjUsbPOb3NcR4FUdaOGajHlB1H6Lw08LPOyVPIJVb6qkZtrd5bFCJMbmp0AZNeNmRaZLzjmZYYyjq77fEfF1HJ409hQIEMopZdG7KLoayQO5Owg3jK5pwmrEDXseFb1N_-7kUVS3SN1imUvXm-OyiHw5QKU7aDk1yLh92Zu7MIbIRcvTex8ryLXjDVQLAo4mom9ZHR8kWKqobWBybXt8ArNrnwLz9Txb2Qu7QhECHPw5W6rK3hf3xgHyQL5XQHnoh7GrBrERvv5EyhcSJPBPAGYoWGjifDUtlRAxWsSQuooq2Y-OsGgHXbINi_AEs