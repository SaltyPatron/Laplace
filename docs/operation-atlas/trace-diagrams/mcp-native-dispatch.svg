ke-width:1;" rx="7.5" ry="7.5"/><text x="104.409" y="820.498" fill="#000" font-size="14" textLength="567.314">Native tools: search, embeddings, shape, forward, ingest, hop, text, translate, degrees, pull.</text><text x="104.409" y="838.107" fill="#000" font-size="14" textLength="544.749">Server handles connections serially. No authentication check appears in this dispatcher.</text><text x="104.409" y="855.717" fill="#000" font-size="14" textLength="589.866">Header/body parsing uses substring scans and fixed buffers; this is not a general JSON parser.</text><text x="104.409" y="873.326" fill="#000" font-size="14" textLength="351.805">Health response does not probe the database or Engine.</text></g><g class="footer" data-source-line="33"><text x="206.466" y="904.783" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="210.091" y="917.361" fill="#888" font-size="10" textLength="378.501">claimed. Native listener, dispatch, MCP wrapper, scalar parsers and Engine wrappers</text><text x="210.079" y="929.939" fill="#888" font-size="10" textLength="378.525">reviewed. Deployment access controls and protocol conformance are separate. Static</text><text x="235.929" y="942.518" fill="#888" font-size="10" textLength="326.826">/v1/surface text is not treated as the actual tools registry where they differ.</text></g><?plantuml-src VLJBSXit4BplLqnL3fQgQBx4byX3IfQbE2bBLebAvOm5Phc8iC06m8gIJ_c8V66-90tiIjOf5nOv10RTFTtpWQwUj68hUKjVHMk4v8ytbtSJAw9-uebezLZI_il5VBcYvQogfbErMPNpDQyNy-cgcYxa-VfylIWtKYxEplXShjJPRBDGcyrgjLpCPcgvLAjgjcQkPF7X_nzhXBO_NXFJDSybBvTbkJgNvujIdfMRPRMkIjwSpvURQZ75osBDSgOOhufgBXNFPkMgaWbQ4HwrROKN3PL2FXwywwowTCPv-kdwulho-lhTYL0BvOxQ7gWI9l2xVnHNeZFnsjbuAngclR1XprvNHTJHCDqurHdX2Jpetx__ePuBVNbuk2DX5TtVNPBIeHLHraM8miTYUy_16HowiWTjcVYPPHT5QNX7ZMWfQlRqdRtRaJ36IH6P8Zz7O96kQLrWloksdpIwIsShVUWyA_hrxcb1jGjnqZeVTsHqY6mpT-CEj5hiYcEjWVZaGafk8nddsfzFIGSwUU5mMj1s-CC14nfRbb4xkoFFGf6sqT6CRlGd_Fwhu