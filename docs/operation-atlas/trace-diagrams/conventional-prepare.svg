<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:655px;height:972px;background:#FAFCFF;" width="655px" height="972px" viewBox="0 0 655 972" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="655" height="972" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="7"><text x="164.532" y="34.533" fill="#000" font-size="14" textLength="324.051" font-weight="700">Conventional — token shards and dataset report</text></g><ellipse cx="325.558" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="240.177" y="93.609" width="170.762" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="250.177" y="116.066" fill="#000" font-size="12" textLength="150.762">Load manifest and tokenizer</text><rect x="195.159" y="148.703" width="260.797" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="205.159" y="171.16" fill="#000" font-size="12" textLength="240.797">Choose uint16 or uint32 from vocabulary size</text><rect x="173.509" y="203.797" width="304.098" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="183.509" y="226.254" fill="#000" font-size="12" textLength="284.098">Derive tokens per shard from byte limit, minimum one</text><rect x="209.506" y="258.891" width="232.104" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="219.506" y="281.348" fill="#000" font-size="12" textLength="212.104">Create train and validation shard writers</text><rect x="186.839" y="370.903" width="277.438" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="196.839" y="393.36" fill="#000" font-size="12" textLength="257.438">Normalize/chunk records according to file format</text><rect x="213.171" y="425.997" width="224.773" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="223.171" y="448.454" fill="#000" font-size="12" textLength="204.773">Choose stable-key train/validation split</text><rect x="225.508" y="481.091" width="200.1" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="235.508" y="503.548" fill="#000" font-size="12" textLength="180.1">Encode BOS + text tokens + EOS</text><rect x="177.159" y="536.185" width="296.797" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="187.159" y="558.642" fill="#000" font-size="12" textLength="276.797">Write binary token slices across bounded shard files</text><rect x="173.146" y="591.278" width="304.824" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="183.146" y="613.735" fill="#000" font-size="12" textLength="284.824">Update split counts; add train record length histogram</text><polygon points="207.547,313.984,443.569,313.984,455.569,325.984,443.569,337.984,207.547,337.984,195.547,325.984,207.547,313.984" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="329.558" y="349.403" fill="#000" font-size="11" textLength="17.118">yes</text><text x="207.547" y="330.485" fill="#000" font-size="11" textLength="236.022">More accessible trainable nonduplicate records?</text><text x="183.311" y="323.567" fill="#000" font-size="11" textLength="12.235">no</text><rect x="137.813" y="668.372" width="375.488" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="147.813" y="690.829" fill="#000" font-size="12" textLength="355.488">Close writers; write dataset-report.json with shard list and quantiles</text><rect x="285.88" y="