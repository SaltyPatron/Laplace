errors; other probe failures raise.</text><text x="255.782" y="696.477" fill="#000" font-size="14" textLength="401.522">Decode failure is not silently reclassified as successful coverage.</text><text x="255.782" y="714.086" fill="#000" font-size="14" textLength="471.557">Transforms are training representations, not exact source-byte preservation.</text></g><g class="footer" data-source-line="34"><text x="298.685" y="745.543" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="292.854" y="758.121" fill="#888" font-size="10" textLength="397.412">claimed. Entire modality_data and provider registry modules reviewed. Only the first audio</text><text x="294.246" y="770.699" fill="#888" font-size="10" textLength="394.629">stream is selected; video timestamps/audio synchronization are not carried in emitted clip</text><text x="298.958" y="783.277" fill="#888" font-size="10" textLength="385.205">tensors. External decoder behavior and sampling correctness are not runtime-validated</text><text x="480.164" y="795.855" fill="#888" font-size="10" textLength="22.793">here.</text></g><?plantuml-src fLN1RkCs4BthAmReORF0sh4jIxRZGv6cIRj0kriaHQ-B4JcqYKYabgJiU4_zY7vXlwGpafnrYvxQWm6R7CwyUU_D-0tS7wmcf-W6ViAsHaMJE-yEv9Br3klh6DHrFLnyKfSNghRJzWHFFzukYXBoKizmdfTceofQcbMfDiMcAfVpAjURQg5LkIhB-KOXbdckvjLwjLWQN9EQpyqyBpRPc_yCfF4QQvjEdpGcl82qcYzBasjQObdccoBFbxFP8b-gUK64Yg7a9bzHfPGgvgPKMCoAsGANSrekvreNwdz0QeENbo5UmDcOOhF0sImlDtgTAy9ghVK6os9PO65Mj31ceLTviLmiz4ofzO8l23N3KkLcdHTPVBQknO0DLAYUTy5tJj_vsWVuvk7suUxXuI8Yxb7xetKxC5X7khZHPB2hquDtwGCs14_euXC5Qx9aKqrmsI3y-ViVO1lS4HX-I_4TOAUj1xNlt7C4T1gaJpweRHkpc32axEQ9Qb89EcS_TmIe5CLeAyvzfcNIO59xGTUWiuPY0YuPBCKjlsvPJAXUUVC6MapxBI1dsJauxZsd6kCXUQWzSauu-l3CZ6ypQ-3glO3-zYsaFJcuEb5ycy7DnvP_iFJxeQSjs4G14oSxK3XTDhhbw9w8aE3nX--sK5dLyOUHQ2d9OXkxwm9fY9yx3Fs39uNIetsXUg36-T2mCxyGyuNEyV4MgE7c4hdempRZ4nAqjqBgFz4-TWwCQLhQWUTlDZ1B0_in1M8blQjFbq0PL-ETVmU1cFUO11msBMFgcnH4XhbA-GAOOTPwGa