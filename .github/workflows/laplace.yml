name: Publish native services GUI and Stockfish corpus
on:
  push:
    branches: ['verify/chess-corpus-pilot-20260916-4fa186e']
permissions:
  contents: read
env:
  GUI_NATIVE_RUN: '35161276382'
  GUI_NATIVE_ATTEMPT: '3'
  GUI_NATIVE_OPERATOR: 'b0fd12760a539bd815a79faf9dd85278c471c8a3'
  GUI_NATIVE_WORKFLOW_BLOB: '76a9fd627495a9de2032d5b3a74ad1467e568f8d'
  POSTGRES_ACTIVATION_BLOCK_BLOB: '648c7db144308e2bf31a3d09e5f9550a2ee15810'
  NATIVE_PHASE_EXPORT_BLOB: '814dbe22c1532763538695f0cf5adb8539127d12'
  NATIVE_OBSERVED_OUTCOME: 'failure'
  EXPECTED_EXPORT_BLOB: '348b25ab98a9dd8f4eefb8769775ee40af8692fe'
  GUI_BLOCK_BLOB: '9178c3936843b71d9bca6d3b1bdd20d8cba6c0f9'
  GUI_BOOTSTRAP_BLOB: '73291772d83f569e6aa3de26d1fc109c35b3d856'
  CACHE_BLOCK_BLOB: '9859fe785ba9208282d92a6135115ed161378323'
  MANAGED_BLOCK_BLOB: 'ddf5d4c219cc386d52a44274394a8b0dff8251d6'
  FOLLOW_BLOCK_BLOB: 'ed707561242f310fe8ece83c415b2049c4163f92'
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'
  LAPLACE_INSTALL_PREFIX: /opt/laplace
  LAPLACE_PG_PREFIX: /opt/laplace/pgsql-18
  LAPLACE_EXTERNAL: /build/external
  LAPLACE_DATA_ROOT: /vault/Data
  LAPLACE_DB: 'Host=/var/run/postgresql;Username=laplace_admin;Database=laplace'
  PGHOST: /var/run/postgresql
  PGPORT: '5432'
  PGUSER: laplace_admin
  PGDATABASE: laplace
jobs:
  chess:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 650
    env:
      LICHESS_API: ${{ secrets.LICHESS_API }}
      LAPLACE_MCP_TOKEN: ${{ secrets.LAPLACE_MCP_TOKEN }}
      LAPLACE_OPERATOR_TOKEN: ${{ secrets.LAPLACE_OPERATOR_TOKEN }}
      STRIPE_API_SECRET: ${{ secrets.STRIPE_API_SECRET }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_API_Publishable: ${{ vars.STRIPE_API_PUBLISHABLE }}
      LAPLACE_AUTH_MICROSOFT_CLIENT_ID: ${{ secrets.LAPLACE_AUTH_MICROSOFT_CLIENT_ID }}
      LAPLACE_AUTH_MICROSOFT_CLIENT_SECRET: ${{ secrets.LAPLACE_AUTH_MICROSOFT_CLIENT_SECRET }}
      LAPLACE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.LAPLACE_AUTH_GOOGLE_CLIENT_ID }}
      LAPLACE_AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.LAPLACE_AUTH_GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Prepare retained operational source and runtime
        shell: bash
        run: |
          set -euo pipefail
          umask 0077
          evidence="/build/laplace/recovery/chess-followthrough/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$evidence"
          chmod 0700 "$evidence"
          echo "FOLLOW_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          export FOLLOW_EVIDENCE="$evidence"
          export TMPDIR="$evidence/tmp" TMP="$evidence/tmp" TEMP="$evidence/tmp"
          mkdir -p "$TMPDIR"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$TMPDIR" "$TMP" "$TEMP" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import ast,base64,hashlib,json,os,pathlib,re,urllib.request
          sha=os.environ["FOLLOW_BLOCK_BLOB"]
          assert re.fullmatch(r"[0-9a-f]{40}",sha)
          request=urllib.request.Request("https://api.github.com/repos/SaltyPatron/Laplace/git/blobs/"+sha,
              headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(request,timeout=30) as response:
              encoded=response.read((2<<20)+1)
          assert len(encoded)<=2<<20
          item=json.loads(encoded)
          assert item["sha"]==sha and item["encoding"]=="base64"
          raw=base64.b64decode(item["content"])
          assert len(raw)==item["size"] and len(raw)<1<<20
          assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==sha
          ast.parse(raw)
          target=pathlib.Path(os.environ["FOLLOW_EVIDENCE"])/"followthrough.py"
          if target.exists():
              assert target.read_bytes()==raw
          else:
              with target.open("xb") as stream:stream.write(raw)
          print(json.dumps({"operatorBlob":sha,"operatorSha256":hashlib.sha256(raw).hexdigest()}))
          PY
          retained_root="$(python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path("/build/laplace/recovery/native-install")/(os.environ["GUI_NATIVE_RUN"]+"-"+os.environ["GUI_NATIVE_ATTEMPT"])/"receipt.json"
          s=json.loads(p.read_text())
          root=pathlib.Path(s["checkout"])
          assert root.is_absolute() and root.resolve(strict=True)==root and "\n" not in str(root)
          print(root)
          PY
          )"
          cd "$retained_root"
          set +u
          source /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1
          set -u
          printenv | grep -E '^(ONEAPI_ROOT|CMPLR_ROOT|MKLROOT|TBBROOT|CPATH|LIBRARY_PATH|PKG_CONFIG_PATH|SETVARS_COMPLETED)=' >> "$GITHUB_ENV"
          cmake_bin="$(python3 scripts/provision-cmake.py --root /opt/laplace/tools/cmake --work /build/laplace/work/cmake)"
          echo "PATH=$cmake_bin:/opt/laplace/pgsql-18/bin:$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$retained_root/build/engine/core:$retained_root/build/engine/dynamics:$retained_root/build/engine/synthesis:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> "$GITHUB_ENV"
          echo "CTEST_PARALLEL_LEVEL=$(nproc)" >> "$GITHUB_ENV"
          
      - name: Publish services and prove startup GUI and Stockfish corpus
        id: chess
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=300s 38000s bash -s <<'FOLLOW' 2>&1 | tee "$FOLLOW_EVIDENCE/followthrough.log"
          set -euo pipefail
          exec 9>/build/laplace/work/host-resource.lock
          flock --exclusive --timeout 1800 9
          export FOLLOW_LOCK_FD=9
          exec timeout --signal=TERM --kill-after=300s 36000s python3 "$FOLLOW_EVIDENCE/followthrough.py" gui-corpus
          FOLLOW
      - name: Retain chess outcome
        if: always()
        env:
          OPERATION_OUTCOME: ${{ steps.chess.outcome }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["FOLLOW_EVIDENCE"])
          p.joinpath("chess-outcome.json").write_text(json.dumps({
              "outcome":os.environ["OPERATION_OUTCOME"],
              "nativeRun":int(os.environ["GUI_NATIVE_RUN"]),
              "nativeAttempt":int(os.environ["GUI_NATIVE_ATTEMPT"]),
              "scope":"Full managed publication, warm startup, complete GUI and Stockfish source corpus; failed recording pilot retained; no cache activation"})+"\n")
          PY
      - name: Retain chess followthrough evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-chess-followthrough-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FOLLOW_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 30
