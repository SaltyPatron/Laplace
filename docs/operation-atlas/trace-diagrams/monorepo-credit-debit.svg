ne x1="192.424" y1="483.172" x2="192.424" y2="516.266" style="stroke:#181818;stroke-width:1;"/><line x1="192.424" y1="516.266" x2="372.667" y2="516.266" style="stroke:#181818;stroke-width:1;"/><polygon points="362.667,512.266,372.667,516.266,362.667,520.266,366.667,516.266" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="576.911" y1="498.266" x2="576.911" y2="516.266" style="stroke:#181818;stroke-width:1;"/><line x1="576.911" y1="516.266" x2="396.667" y2="516.266" style="stroke:#181818;stroke-width:1;"/><polygon points="406.667,512.266,396.667,516.266,406.667,520.266,402.667,516.266" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="384.667" y1="128.703" x2="384.667" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="380.667,138.703,384.667,148.703,388.667,138.703,384.667,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="384.667" y1="528.266" x2="384.667" y2="548.266" style="stroke:#181818;stroke-width:1;"/><polygon points="380.667,538.266,384.667,548.266,388.667,538.266,384.667,542.266" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="26"><text x="198.611" y="589.646" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="186.651" y="602.225" fill="#888" font-size="10" textLength="409.673">claimed. Both concrete debit bodies reviewed. PostgreSQL SQL does not check period_start</text><text x="195.56" y="614.803" fill="#888" font-size="10" textLength="391.855">&lt;= now, unlike the in-memory branch. Both order by credit limit, not remaining headroom</text><text x="194.432" y="627.381" fill="#888" font-size="10" textLength="394.111">despite the SQL comment. SQL has no own positive-unit guard; the reviewed C# adapter</text><text x="191.087" y="639.959" fill="#888" font-size="10" textLength="400.801">supplies one. Debit is one database statement, separate from quote approval/consumption</text><text x="203.035" y="652.537" fill="#888" font-size="10" textLength="376.904">and operation execution. Installed SQL and concurrency acceptance were not tested.</text></g><?plantuml-src dLNDRjiu4BxxAGReeItWs9GKoLApFqZJ10sG_hfx3aRaoEP68bMIYZUtVOXzmdsI7KfAwmBfPM7O82bnvlkP6J-7otkjo4Xw1JVOjoXfZNs_djUhIwDwgqtmgmyzcVFh2zlr6DQN9kZGKaSclDPjgyrk9JritvwdUG4rfIXHgamWrlb6P6cLr2AfgYRB1Kag4d6QP299iSQcQcIH2f5ZbMvaJdbQL8ld_m_KZEIZzM7doAyV5_Fv4UPji8wE49-Ax3GlbAgoF9U88crE6HgMgD9y8zEiRiegAq-p15M38g-5mbgA0bCiwgmfrPE8LRtkzCvXqDRuTIhIGfHY8vYi4BTCvrRo-T3HhNIaT5Zvh-qZdanLib99MIafHKMRD4lpyXGtMLsK5MTKXSeesV2d5AfAqqpKILusgY9ca5Bv91uoEsreBPdwsZkvvdot4WEsThTIr3pc5aMEIaWIJO9OLfigawIQZ5H2b3HDKfL5djIPIbMT5Bb08J5LPLAf8YqOKR7mTzhqwB236kNTpjd1g0lRMWVFhiwlBgwkZjxmUrJsmEP0WwsdeoUC28SsN5aJtcD7i4NZj-HqinXTX7VMC97Umhz__mDCq9nCClB5cd-r0KAv1n-TNlY0BYnUVQO_IGOmrlJMww3l2GQZWmSCSF5iUXVgY1VTmzb2D_3Ysfnqr5dtC3tz_IM4FHbuyK3-vG9UtLXv5qbmQjXXe3C-sr8RiqZqTAAD9pEd2cJGX2MW7BUCAGoSsYYGWtDSbT0pFwjYZ0zEaOFw0RX66hqROdnFxbvBWfbdgxkHhPTa52iOhrtihVK4ZNO-m447vZyqZPOwHdVKeJPHwoc2ZpS-qrWSC7XIZmfss9_nss5mPb8pxbfYFj0otxC5iLNmOcwlxQURgCG5jYtCvGJruqpueS97SJxTC94ea0VwYwLuMfRbhCKjSuFVsB738Whr99iVTV4_a-zdii7DzRlhBv30rOVFyCV7D-TVBcE8QJNgCiEVl1fwnJwhMowPmK_f8njEuEnXKdGKBfRayWXbl3jn0awy16u7OwSx4KZ3DMhxHMDj8BVOsi59Ed5qh-d0eQsJU_9XcYKhUC_hiI0wLaxp69lIWELfU3Q67VYScmQbf3uWZu65R95Fr0fUMouBreL91PgxfRPAKmmpvLl1TsyXVfNbfyPoKU-92txsPkggNtwDzYovarfzHx4zkFaUcwPsd7m_9xNVN3coOZd6_QxJdb0vQxi5MzJhC0MC6AJjukXUZPizHZnW3opqtCediPLXDw1JP-EbR-fnQwF2FWhhXxvl8rLhQ0Llfb4nxe1jvVyZFrNW-2-nP8NZC68GZRCTV1tO7E39xUmzjkkfkFjeoLYShFva41SsoM6owjfmkBPb517ssEmi_TZlyk787pWGpvueHHZDNSMgWBaS_WC0?></g></svg>