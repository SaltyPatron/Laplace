name: Data — code ingest
run-name: "Code ingest — ${{ inputs.source }} / ${{ inputs.corpus }} → ${{ inputs.database }}"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Ingest mode: repo for repositories; stack/tiny-codes are registered corpora; code/tabular/recipe use an explicit path"
        type: choice
        required: true
        default: repo
        options: [repo, stack, tiny-codes, code, tabular, recipe]
      corpus:
        description: "Named corpus preset; auto selects this Laplace checkout for repo"
        type: choice
        required: false
        default: auto
        options: [auto, laplace, cpython, postgres, dotnet-runtime, dotnet-docs, treesitter, custom-path]
      advanced_path_override:
        description: "ADVANCED: local file/directory override; required for custom-path and custom code/tabular/recipe inputs"
        type: string
        required: false
        default: ""
      database:
        description: "target database"
        type: choice
        options: [laplace]
        default: laplace
      run_idempotency:
        description: "re-ingest and prove no double-count"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 2
    outputs:
      path: ${{ steps.pick.outputs.path }}
    steps:
      - id: pick
        env:
          SOURCE_INPUT: ${{ inputs.source }}
          CORPUS_INPUT: ${{ inputs.corpus }}
          PATH_INPUT: ${{ inputs.advanced_path_override }}
        run: |
          set -euo pipefail
          root="${LAPLACE_DATA_ROOT:-/vault/Data}"
          if [[ -n "$PATH_INPUT" ]]; then
            [[ -e "$PATH_INPUT" ]] || { echo "::error::$PATH_INPUT does not exist"; exit 1; }
            echo "path=$PATH_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SOURCE_INPUT" in
            stack|tiny-codes) echo "path=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          case "$CORPUS_INPUT" in
            auto)
              if [[ "$SOURCE_INPUT" == repo ]]; then
                p="$GITHUB_WORKSPACE"
              else
                echo "::error::$SOURCE_INPUT needs a named corpus or advanced path override"
                exit 2
              fi
              ;;
            laplace) p="$GITHUB_WORKSPACE" ;;
            cpython) p="$root/code-authority/cpython" ;;
            postgres) p="$root/code-authority/postgres" ;;
            dotnet-runtime) p="$root/code-authority/runtime" ;;
            dotnet-docs) p="$root/code-authority/docs" ;;
            treesitter) p="$root/TreeSitter" ;;
            custom-path) echo "::error::custom-path requires the advanced path override"; exit 2 ;;
            *) echo "::error::unknown corpus $CORPUS_INPUT"; exit 1 ;;
          esac
          [[ -e "$p" ]] || { echo "::error::$p does not exist"; exit 1; }
          echo "path=$p" >> "$GITHUB_OUTPUT"

  seed:
    needs: resolve
    uses: ./.github/workflows/seed.yml
    with:
      mode: source
      source: ${{ inputs.source }}
      path: ${{ needs.resolve.outputs.path }}
      database: ${{ inputs.database }}
      run_gate: false
      run_idempotency: ${{ inputs.run_idempotency }}
