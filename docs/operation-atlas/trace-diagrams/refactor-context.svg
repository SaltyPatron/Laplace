<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:640px;height:886px;background:#FAFCFF;" width="640px" height="886px" viewBox="0 0 640 886" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="640" height="886" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="6"><text x="135.391" y="34.533" fill="#000" font-size="14" textLength="367.582" font-weight="700">Refactor — execution-context decoding and fingerprint</text></g><ellipse cx="318.182" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="195.116" y="93.609" width="246.131" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="205.116" y="116.066" fill="#000" font-size="12" textLength="226.131">PostgreSQL adapter zeroes native context</text><rect x="147.09" y="148.703" width="342.184" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="157.09" y="171.16" fill="#000" font-size="12" textLength="322.184">Require one-dimensional bytea array with exact epoch count</text><rect x="164.094" y="203.797" width="308.176" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="174.094" y="226.254" fill="#000" font-size="12" textLength="288.176">Require nonnull fixed-size epoch and authority digests</text><rect x="178.47" y="258.891" width="279.424" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="188.47" y="281.348" fill="#000" font-size="12" textLength="259.424">Read memory, CPU, IO, mask, version and flags</text><rect x="136.112" y="313.984" width="364.139" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="146.112" y="336.441" fill="#000" font-size="12" textLength="344.139">Reject nonpositive memory/CPU/mask, negative IO/version/flags</text><rect x="132.761" y="369.078" width="370.842" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="142.761" y="391.535" fill="#000" font-size="12" textLength="350.842">Native validator checks supported version, known flags and mask,</text><text x="142.761" y="406.629" fill="#000" font-size="12" textLength="278.127">zero reserved field, nonzero memory and CPU grant</text><rect x="137.741" y="439.266" width="360.881" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="147.741" y="461.723" fill="#000" font-size="12" textLength="340.881">Require every absent epoch slot to have canonical zero payload</text><rect x="228.802" y="494.359" width="178.76" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="238.802" y="516.816" fill="#000" font-size="12" textLength="158.76">Accept context representation</text><rect x="113.404" y="549.453" width="409.555" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="123.404" y="571.91" fill="#000" font-size="12" textLength="389.555">Hash domain, version, flags, mask, each present epoch index and digest,</text><text x="123.404" y="587.004" fill="#000" font-size="12" textLength="312.117">authority fingerprint, memory bytes, CPU slots and IO slots</text><rect x="240.813" y="619.641" width="154.736" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="250.813" y="642.098" fill="#000" font-size="12" textLength="134.736">Return context fingerprint</text><ellipse cx="318.182" cy="685.734" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="318.182" cy="685.734" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="318.182" y1="73.609" x2="318.182" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="314.182,83.609,318.182,93.609,322.182,83.609,318.182,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="318.182" y1="128.703" x2="318.182" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="314.182,138.703,318.182,148.703,322.182,138.703,318.182,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="318.182" y1="183.797" x2="318.182" y2="203.797" style="stroke:#181818;stroke-width:1;"/><polygon points="314.182,193.797,318.182,203.797,322.182,193.797,318.182,197.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="318.182" y1="238.891" x2="318.182" y2="258.891" style="stroke:#181818;stroke-width:1;"/><polygon points="314.182,248.891,318.182,258.891,322.182,248.891,318.182,252.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="318.182" y1="293.984" x2="318.182" y2="313.984" style="stroke:#181818;stroke-width:1;"/><polygon points="314.182,303.984,318.182,313.984,322.182,303.984,318.182,307.984" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="318.182" y1="349.078" x2="318.182" y2="369.078" style="stroke:#181818;stroke-width:1;"/><polygon points="314.182,359.078,318.182,369.078,322.182,359.078,318.182,363.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="318.182" y1="419.266" x2="318.182" y2="439.266" style="stroke:#181818;stroke-width:1;"/><polygon points="314.182,429.266,318.182,439.266,322.182,429.266,318.182,433.266" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="318.182" y1="474.359" x2="318.182" y2="494.359" style="stroke:#181818;stroke-width:1;"/><polygon points="314.182,484.359,318.182,494.359,322.182,484.359,318.182,488.359" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="318.182" y1="529.453" x2="318.182" y2="549.453" style="stroke:#181818;stroke-width:1;"/><polygon points="314.182,539.453,318.182,549.453,322.182,539.453,318.182,543.453" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="318.182" y1="599.641" x2="318.182" y2="619.641" style="stroke:#181818;stroke-width:1;"/><polygon points="314.182,609.641,318.182,619.641,322.182,609.641,318.182,613.641" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="318.182" y1="654.734" x2="318.182" y2="674.734" style="stroke:#181818;stroke-width:1;"/><polygon points="314.182,664.734,318.182,674.734,322.182,664.734,318.182,668.734" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="21"><rect x="22" y="717.734" width="594.363" height="80.438" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="27" y="737.268" fill="#000" font-size="14" textLength="557.184">Normal native build does not reject zero payload in a PRESENT epoch or authority digest.</text><text x="27" y="754.877" fill="#000" font-size="14" textLength="584.363">The LAPLACE_TEST_REJECT_ZERO_CONTEXT_VALUES mutation changes that behavior.</text><text x="27" y="772.486" fill="#000" font-size="14" textLength="462.232">This validator checks representation; it does not query an authority registry</text><text x="27" y="790.096" fill="#000" font-size="14" textLength="488.708">or measure host resources. The grant and authority are supplied context fields.</text></g><g class="footer" data-source-line="27"><text x="126.306" y="821.553" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="130.185" y="834.131" fill="#888" font-size="10" textLength="377.993">claimed. Context decoder, native validation and fingerprint bodies reviewed. Declared</text><text x="128.239" y="846.709" fill="#888" font-size="10" textLength="381.885">authority and resources must not be equated with independently verified permission or</text><text x="124.641" y="859.287" fill="#888" font-size="10" textLength="389.082">available hardware merely because they hash successfully. Downstream admission and</text><text x="253.315" y="871.865" fill="#888" font-size="10" textLength="131.733">provider checks are separate.</text></g><?plantuml-src VLNDSY8t4BxFKtHL3dl1_DZ0CDuJHN3jfbpOQzXKAXUgH-e1XHbfB6d0x2aFaIVCawIb0KESgjn0KdT_Vz9yWlbUITA2xk4Hwn85tRnGWS8RsoEzKPfwpefUOR6YWx6xhe3bb-djQ0p5gCZwWcJ_RfIbur5sIvcKWs6MJaRPU8ZvA2z6AOcxR52amq7UBzAqty-AktxQv-NYDldqVxELzhInw9NHhbSRvpUMt6lPepTFsl5gX5MsPUjwSy4r6kTf9aH_C4wpON-0WxxeyppAXyLeCiXm8iHuF9mCQNWtaZH9qvI9v9FX4CVYRZ0O96wdT8rC678KkuqrZPOpKneBFprC7sOF3rSdt1QbEIYzWG9BHrSxafaqfNymsYzOErYYTakogaYyyYN1cIdy_UTVG6yaci3rHl1vviZbmiZG5xM4Wd-GhIsBaZYFrYVtpwqaos-FW19hJnP-a3NaGBDeUu9Jey_9_GkzDieI64qtKbMjV5X2VlI4WDRY4GxARna58mAgZTXoUQElYxNHkYbBXl96yiQf7tGw6F1XuxV6Ady4gJRal8k5AA6YojXZ1sRFtplmzQa35RfT1_Pa0uQMMucRzlmVnDDv3hkj8eMskiV5lRPEqwObz_MfT-hHEzSlsfqzbafYq5LiIUmSkAQkZVKaprCxiDFceDl14K9idWJvW4D6Taz1SYfb9y29wosKU9hX02VpN-eGz-RTt94-2-XAuy4Rs68m0xcH4Ynwx5RZiJGekS5K2AhzsImUNmS4siVWy_uNT5kGfaAbEnS24VfPJ4AUTYexpLPQqbi4s_hHIIuENMMfSwOLak2YIn5sgyhNf_PFfEaRgzzHNhNup7aqTLBIXhWaDzwRAbaOMp7LKn3pHfKC94RJ18hHvsiT62yWFB_Cb_F5waI13VoOgcwosX8yJfyVfxFvUZLVhjOlyr_cizNwz_dBqthsj5ZDVrkjVvq-VfyleMfQ4Ja7o70T-2rwo8dzKCQ6NihzDoqV303bByXVcsYolW9cQQESjyU4ErI4hk4iRFbcXXoPnWfoNGYWOru-N1Naio6SfUAuNQJbsBbkmcgscYQ5CNovasLiTsDfh-Z01SOoOXuTSNPXmRzvrL75WvG8H49cmDJ4B3G7cwypttt063ZaHpSH9VAAxCBi-iqXspaxTrBd_QPUR6UdfQ8mfONJXP-9srcILqaBDUywi1_EHnbplYwl3GQuyTK9OMMK_27mvJ5aN1L1aPfifLny9enDS8-gn9pVpIrQUGZQLMI92t8Is3XYU-d8ctnTNCCSdIlukJeoCBxhh1Fnaupot96X