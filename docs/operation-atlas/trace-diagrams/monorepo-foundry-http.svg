644">no explicit EXPORT-capability or source-scope check; upstream middleware and CLI/database</text><text x="292.516" y="927.338" fill="#888" font-size="10" textLength="385.767">enforcement need separate evidence. RecipeDescriptor.Parse internals remain nested.</text></g><?plantuml-src dLLDR-Cs4BthLmpGmsQ1hYmhiYp5Xy98OsoAtIHDSkXXWM94ZcmYCgabgJZfgJ-Ylx2_f4Dz96bsYmAv6CfmEFFUcyV9EpYxLvAqe1FuX6s3WcROjhFnEpxJiZLAUnTVjgJNvwTctwAVJU7FdAlqriKRqsbf7sFXuERZEbta8ERYE4-M9PPbBgYiaf8ehKifipofi2HS55X8B8zbIiLSY78f1Cwbd8j2vY9THE_U1ksQX6ef_A4QkY5xhpZt6LQLr7MLbij5MMUoIjDvKN3JF9Vp3FDqKOd5igYIh2YfbbB8kiwJydYEHSb0ywMKRuKr2dJsq1hhluLLvB9UO5Pb9LL59eiaEIufAzCCKwH2r3IdWbMfgZIfyNYPPVEgehnQBD8wfJchvUwKRj7Y7YeKTriRsfsQnbZuORFUd6usBpBS3gKvyDoWniRHYnD9DNQDtnZjBt1FS8FQCLXLHrxvXk2pqSPIQ-3lF_y2soiDOf0QK4jmZzhlo2a7r1E5ZxUtLq1rJSAxo7cqFZgvGki8Vhcvl5XnZQ-TiZJLOhZZnJ7GMghLmoewkHuIV-sCfpMt4L1pyf0LJn0uyeHW5QaQZlfys2B_ODEOW_lfFV2vXYDjtaV0PNrdzG0pIz9L1CwRDY8jcNCeSFqlaa-t7yaDryFfp-I4LQqtDkwvVT5sA2kV3Y1OXZLy76JQOKlSImTmLcrtFhhTiMWJ3pVu0tReE0TQiap81y-1O1fn5Dg4-U6aamg97cYq9fXwEf4yBgTy706JwZj648YjxRRRCwQp1q6jLqO7zSxrFJPAidCjXjZJuIlYhuLBG0qtVn-wChT1I1YK9BOP70tc3xgTCWiu_zwRW8FokmdxR9m_VtXpHrhzGVQBvi7lqNEiPgrqiEcizn4vp_8m-wRfmQ_-W-Z_SNa1dc674c-JPP4SVwD3_tkohZsnLJiXoBcwQvu67gRx8zj0EuOCNtlp1iEm7iPAg5JJyDZxvz3tcGppmcZFJuZNpewbgHuzkQ1MBzigwl7KXalRwCPqLj07oxwX0qc-BFZn-85b31VypL57UsJpyhQo_ANOARpPLi6PjkCu8qKH10dQHw91ZiWOmk9hA1ZST051u54PXZIHFLZUcsnjcDh7y6p6_V2VPJHsP4tJXCKMm_2YKUwLSvmuarGftnVdgREgWtXzaLb3SiiXjE59XGqNq4nSHp6ZSJkjNju48qJ7oF3re4R1PwF4Ex8KmorhDj9aXb8nsHtUKyG2SLwZ10Cy--tgylhsWy0MkN5O165P3V8xOSAAsP6uMq7Nilx4ktYlf6pe4C07TgUVpcSIFLR86vl28n0KR0sQ-X6DzAOD4CFtTnC_LAQaUUzFmzJzaEFWJHXjyGy0?></g></svg>