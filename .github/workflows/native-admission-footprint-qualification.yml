name: Read retained corpus receipts and exact lock ownership
on:
  push:
    branches: [qualify/native-admission-footprint-20260916]
permissions:
  contents: read
jobs:

  receipt-projection:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 5
    steps:
      - name: Read exact failed pilot work and chunk receipts
        run: |
          python3 - <<'PY'
          import collections,json,pathlib,re
          root=pathlib.Path("/build/laplace/recovery/native-install/35161276382-3/corpus/measurement")
          fresh=json.loads((root/"fresh/recording.json").read_text())
          selected={key:fresh.get(key) for key in (
              "schema","status","error","startedAt","finishedAt","elapsedSeconds",
              "requestedGames","parsedGames","novelGames","appliedGames","committedGames",
              "readbackGames","readbackPlies","writer","durability","work","corpusEvidence")}
          print("EXACT_FAILED_RECORDING "+json.dumps(selected,sort_keys=True),flush=True)
          writer=fresh.get("writerLog") or {}
          durations=collections.defaultdict(list)
          events=[]
          for entry in writer.get("entries",[]):
              fields=entry.get("fields") or {}
              phase=fields.get("Phase")
              elapsed=fields.get("ElapsedMs")
              message=entry.get("message","")
              if phase is None:
                  match=re.search(r"WS_APPLY phase: ([^ ]+)",message)
                  if match:phase=match.group(1)
              if elapsed is None:
                  match=re.search(r"elapsed_ms=([0-9.]+)",message)
                  if match:elapsed=float(match.group(1))
              if phase is not None and isinstance(elapsed,(float,int)):
                  durations[phase].append(elapsed)
              if re.search(r"physical|plan|budget|grant|tuple|copy",message,re.I):
                  events.append(entry)
          aggregate={phase:{"samples":len(values),"sumObservedMs":sum(values),
                            "minimumObservedMs":min(values),"maximumObservedMs":max(values)}
                     for phase,values in sorted(durations.items())}
          print("WRITER_PHASE_SAMPLES "+json.dumps({
              "scope":"Retained diagnostic samples can overlap and are not additive exclusive phase totals",
              "droppedEntries":writer.get("droppedEntries"),
              "phaseDurations":aggregate,"physicalPlanAndCopyEvents":events,
              "lastEntries":writer.get("entries",[])[-16:]},sort_keys=True),flush=True)
          chunks=(root/"fresh/chunks.jsonl").read_text().splitlines()
          print("EXACT_CHUNK_MANIFEST "+json.dumps([json.loads(line) for line in chunks if line.strip()],sort_keys=True),flush=True)
          for path in sorted((root/"fresh").glob("chunk-*.json")):
              value=json.loads(path.read_text())
              detail={key:value.get(key) for key in (
                  "schema","status","error","requestedGames","parsedGames","novelGames",
                  "appliedGames","committedGames","readbackGames","readbackPlies",
                  "elapsedSeconds","writer","durability","work","corpusEvidence")}
              detail["receipt"]=path.name
              print("EXACT_CHUNK_DETAIL "+json.dumps(detail,sort_keys=True),flush=True)
          progress=root/"fresh/progress.json"
          if progress.is_file():print("FINAL_ADMISSION_PROGRESS "+progress.read_text(),flush=True)
          PY

      - name: Observe exact host lock ownership without taking the lock
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,time
          lock=pathlib.Path("/build/laplace/work/host-resource.lock")
          result={"scope":"Read-only inode and same-UID FD observation; no lock acquisition or process mutation"}
          deadline=time.monotonic()+8
          try:
              target=lock.stat()
              result["lock"]={"path":str(lock),"device":target.st_dev,"inode":target.st_ino,
                              "major":os.major(target.st_dev),"minor":os.minor(target.st_dev)}
              locks=[]
              for line in pathlib.Path("/proc/locks").read_text().splitlines():
                  match=re.search(r"([0-9a-f]+):([0-9a-f]+):([0-9]+)",line)
                  if match and (int(match[1],16),int(match[2],16),int(match[3]))==(os.major(target.st_dev),os.minor(target.st_dev),target.st_ino):
                      locks.append(line)
              result["kernelLockRecords"]=locks
              processes=[]
              for process in pathlib.Path("/proc").iterdir():
                  if time.monotonic()>deadline:
                      result["truncated"]=True
                      break
                  if not process.name.isdigit():continue
                  try:
                      if process.stat().st_uid!=os.getuid():continue
                      fds=[]
                      for descriptor in (process/"fd").iterdir():
                          if time.monotonic()>deadline:break
                          try:
                              info=descriptor.stat()
                              if (info.st_dev,info.st_ino)==(target.st_dev,target.st_ino):fds.append(str(descriptor))
                          except OSError:continue
                      if not fds:continue
                      state=(process/"stat").read_text()
                      start=state.index("(");end=state.rindex(")")
                      rest=state[end+2:].split()
                      row={"pid":int(process.name),"ppid":int(rest[1]),"comm":state[start+1:end],
                           "startTicks":int(rest[19]),"fileDescriptors":fds}
                      try:
                          executable=pathlib.Path(os.readlink(process/"exe")).name.removesuffix(" (deleted)")
                          if executable in ("dotnet","bash","sh","flock","timeout","python3","python3.10","python3.11","python3.12","ctest","Runner.Worker","Runner.Listener","Laplace.Cli"):
                              row["recognizedExecutable"]=executable
                      except OSError:pass
                      processes.append(row)
                  except (OSError,ValueError,IndexError):continue
              result["sameUidProcesses"]=processes
          except OSError as error:result["errorType"]=type(error).__name__
          print("HOST_LOCK_OBSERVATION "+json.dumps(result,sort_keys=True),flush=True)
          PY
