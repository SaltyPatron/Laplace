<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:721px;height:997px;background:#FAFCFF;" width="721px" height="997px" viewBox="0 0 721 997" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="721" height="997" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="5"><text x="163.414" y="34.533" fill="#000" font-size="14" textLength="392.499" font-weight="700">Monorepo — whole observation and structural provenance</text></g><ellipse cx="337.177" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="74.035" y="93.609" width="526.285" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="84.035" y="116.066" fill="#000" font-size="12" textLength="506.285">Create intent owned by request memory context; retain exact input root and hard relation scope</text><rect x="131.401" y="148.703" width="411.553" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="141.401" y="171.16" fill="#000" font-size="12" textLength="391.553">Call prompt_structure_couple; validate occurrence/node projection counts</text><rect x="190.1" y="203.797" width="294.154" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="200.1" y="226.254" fill="#000" font-size="12" textLength="274.154">Bind each nonnull occurrence ID to its origin ordinal</text><rect x="186.441" y="258.891" width="301.473" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="196.441" y="281.348" fill="#000" font-size="12" textLength="281.473">Bind whole root to all valid current occurrence origins</text><rect x="125.747" y="362.902" width="422.861" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="135.747" y="385.359" fill="#000" font-size="12" textLength="402.861">Read container/constituent/predecessor/successor/co-occurrence crossings</text><text x="135.747" y="400.453" fill="#000" font-size="12" textLength="198.07">from root plus current occurrence IDs</text><rect x="134.413" y="433.09" width="405.529" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="144.413" y="455.547" fill="#000" font-size="12" textLength="385.529">Merge ordered continuations as a distinct root-sourced structural relation</text><rect x="151.736" y="488.184" width="370.883" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="161.736" y="510.641" fill="#000" font-size="12" textLength="350.883">Envelope = fanout * (source_count * 5 + 1), saturating on overflow</text><polygon points="216.414,550.184,457.941,550.184,469.941,562.184,457.941,574.184,216.414,574.184,204.414,562.184,216.414,550.184" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="216.414" y="566.685" fill="#000" font-size="11" textLength="241.527">Complete structural response exceeds envelope?</text><text x="187.296" y="559.767" fill="#000" font-size="11" textLength="17.118">yes</text><text x="469.941" y="559.767" fill="#000" font-size="11" textLength="75.829">within envelope</text><rect x="16" y="584.184" width="304.191" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="606.641" fill="#000" font-size="12" textLength="284.191">Mark budget_exhausted; do not bind a retained prefix</text><rect x="364.856" y="584.184" width="282.805" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="374.856" y="606.641" fill="#000" font-size="12" textLength="262.805">Stage target origins from existing source bindings</text><rect x="340.191" y="639.277" width="332.135" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="350.191" y="661.734" fill="#000" font-size="12" textLength="312.135">Merge staged origins; new identities form structural frontier</text><polygon points="337.177,680.371,349.177,692.371,337.177,704.371,325.177,692.371,337.177,680.371" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="271.448,313.984,402.906,313.984,414.906,325.984,402.906,337.984,271.448,337.984,259.448,325.984,271.448,313.984" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="341.177" y="349.403" fill="#000" font-size="11" textLength="17.118">yes</text><text x="271.448" y="330.485" fill="#000" font-size="11" textLength="131.458">Trajectory scope supplied?</text><polygon points="337.177,724.371,349.177,736.371,337.177,748.371,325.177,736.371,337.177,724.371" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="160.762" y="768.371" width="352.83" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="170.762" y="790.828" fill="#000" font-size="12" textLength="332.83">Read root geometry responses after structural state is retained</text><rect x="176.102" y="823.465" width="322.15" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="186.102" y="845.922" fill="#000" font-size="12" textLength="302.15">Return intent with distinct structural and geometry planes</text><ellipse cx="337.177" cy="889.559" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="337.177" cy="889.559" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="337.177" y1="73.609" x2="337.177" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="