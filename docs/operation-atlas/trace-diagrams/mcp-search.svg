x="12.5" ry="12.5"/><text x="206.938" y="336.441" fill="#000" font-size="12" textLength="341.479">Obtain constituents from text parts or first stored physicality path</text><polygon points="308.28,425.997,447.074,425.997,459.074,437.997,447.074,449.997,308.28,449.997,296.28,437.997,308.28,425.997" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="308.28" y="442.498" fill="#000" font-size="11" textLength="138.794">Constituent tier at least two?</text><text x="279.162" y="435.58" fill="#000" font-size="11" textLength="17.118">yes</text><text x="459.074" y="435.58" fill="#000" font-size="11" textLength="12.235">no</text><rect x="43" y="459.997" width="327.5" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="53" y="482.454" fill="#000" font-size="12" textLength="307.5">Read holds_above, claim ancestry and its physicality path</text><rect x="53.992" y="521.673" width="305.516" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="63.992" y="544.13" fill="#000" font-size="12" textLength="285.516">Decode children and look up non-codepoint child tiers</text><rect x="390.5" y="459.997" width="316.209" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="400.5" y="482.454" fill="#000" font-size="12" textLength="296.209">Keep constituent/codepoint in path without holds lookup</text><polygon points="377.677,562.767,389.677,574.767,377.677,586.767,365.677,574.767,377.677,562.767" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="331.209,369.078,424.145,369.078,436.145,381.078,424.145,393.078,331.209,393.078,319.209,381.078,331.209,369.078" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="381.677" y="404.497" fill="#000" font-size="11" textLength="17.