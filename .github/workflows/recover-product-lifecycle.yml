name: Recover normal product lifecycle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-product-lifecycle.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  restore-normal-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enable and verify the normal product lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_ID: '304286832'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          base = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          workflow_id = os.environ["WORKFLOW_ID"]

          def get_state():
              request = urllib.request.Request(f"{base}/actions/workflows/{workflow_id}", headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          before = get_state()
          if before["state"] != "active":
              request = urllib.request.Request(
                  f"{base}/actions/workflows/{workflow_id}/enable",
                  headers=headers,
                  method="PUT",
                  data=b"",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 204:
                      raise RuntimeError(f"enable returned {response.status}")

          after = get_state()
          if after["state"] != "active":
              raise RuntimeError(f"normal lifecycle still {after['state']}")

          print(json.dumps({
              "workflow": workflow_id,
              "before": before["state"],
              "after": after["state"],
              "recoveryRun": os.environ["GITHUB_RUN_ID"],
          }))
          PY
