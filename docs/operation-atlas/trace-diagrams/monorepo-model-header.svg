<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:762px;height:839px;background:#FAFCFF;" width="762px" height="839px" viewBox="0 0 762 839" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="762" height="839" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="7"><text x="201.666" y="34.533" fill="#000" font-size="14" textLength="356.686" font-weight="700">Monorepo — checkpoint header content construction</text></g><ellipse cx="202.743" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="84.022" y="93.609" width="237.441" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="94.022" y="116.066" fill="#000" font-size="12" textLength="217.441">Take tensor descriptors in supplied order</text><rect x="49.329" y="205.622" width="306.828" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="59.329" y="228.079" fill="#000" font-size="12" textLength="286.828">Split dotted tensor name into nonempty text segments</text><text x="59.329" y="243.173" fill="#000" font-size="12" textLength="157.418">reject an empty resulting path</text><rect x="85.019" y="275.81" width="235.449" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="95.019" y="298.267" fill="#000" font-size="12" textLength="215.449">Reuse staged text leaves by exact string</text><rect x="41" y="339.485" width="323.486" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="51" y="361.942" fill="#000" font-size="12" textLength="168.111">Stage dtype and dimension text</text><text x="51" y="377.036" fill="#000" font-size="12" textLength="303.486">reject negative dimensions; scalar shape uses text scalar</text><rect x="81.333" y="409.673" width="242.82" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="91.333" y="432.13" fill="#000" font-size="12" textLength="222.82">Prepare ordered path and shape requests</text><polygon points="161.477,148.703,244.009,148.703,256.009,160.703,244.009,172.703,161.477,172.703,149.477,160.703,161.477,148.703" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="206.743" y="184.122" fill="#000" font-size="11" textLength="17.118">yes</text><text x="161.477" y="165.204" fill="#000" font-size="11" textLength="82.532">Tensor remains?</text><text x="137.242" y="158.286" fill="#000" font-size="11" textLength="12.235">no</text><rect x="49.657" y="486.767" width="306.172" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="59.657" y="509.224" fill="#000" font-size="12" textLength="286.172">Native StageBatch composes all paths and all shapes</text><rect x="71.668" y="541.86" width="262.15" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="81.668" y="564.317" fill="#000" font-size="12" textLength="242.15">Compose each tensor as [path, dtype, shape]</text><path d="M386.15,586.954 L386.15,612.481 L366.15,616.481 L386.15,620.481 L386.15,646.009 A0,0 0 0 0 386.15,646.009 L741.018,646.009 A0,0 0 0 0 741.018,646.009 L741.018,596.954 L731.018,586.954 L386.15,586.954 A0,0 0 0 0 386.15,586.954" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M731.018,586.954 L731.018,596.954 L741.018,596.954 L731.018,586.954" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="392.15" y="605.449" fill="#000" font-size="13" textLength="312.908">Singleton continuation preserves child atom metadata.</text><text x="392.15" y="621.801" fill="#000" font-size="13" textLength="333.868">Payload values and data ranges are absent from this root.</text><text x="392.15" y="638.152" fill="#000" font-size="13" textLength="321.585">It represents header structure, not payload equivalence.</text><rect x="39.336" y="598.935" width="326.814" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="49.336" y="621.392" fill="#000" font-size="12" textLength="306.814">Compose checkpoint from tensor results in supplied order</text><rect x="36.661" y="666.009" width="332.164" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="46.661" y="688.466" fill="#000" font-size="12" textLength="312.164">Return checkpoint root; caller adds configuration testimony</text><ellipse cx="202.743" cy="732.103" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="202.743" cy="732.103" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="202.743" y1="73.609" x2="202.743" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="198.743,83.609,202.743,93.609,206.743,83.609,202.743,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="202.743" y1="255.81" x2="202.743" y2="275.81" style="stroke:#181818;stroke-width:1;"/><polygon points="198.743,265.81,202.743,275.81,206.743,265.81,202.743,269.81" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="202.743" y1="310.903" x2="202.743" y2="339.485" style="stroke:#181818;stroke-width:1;"/><polygon points="198.743,329.485,202.743,339.485,206.743,329.485,202.743,333.485" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="202.743" y1="389.673" x2="202.743" y2="409.673" style="stroke:#181818;stroke-width:1;"/><polygon points="198.743,399.673,202.743,409.673,206.743,399.673,202.743,403.673" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="202.743" y1="172.703" x2="202.743" y2="205.622" style="stroke:#181818;stroke-width:1;"/><polygon points="198.743,195.622,202.743,205.622,206.743,195.622,202.743,199.622" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="202.743" y1="444.767" x2="202.743" y2="454.767" style="stroke:#181818;stroke-width:1;"/><line x1="202.743" y1="454.767" x2="376.486" y2="454.767" style="stroke:#181818;stroke-width:1;"/><polygon points="372.486,319.485,376.486,309.485,380.486,319.485,376.486,315.485" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="376.486" y1="160.703" x2="376.486" y2="454.767" style="stroke:#181818;stroke-width:1;"/><line x1="376.486" y1="160.703" x2="256.009" y2="160.703" style="stroke:#181818;stroke-width:1;"/><polygon points="266.009,156.703,256.009,160.703,266.009,164.703,262.009,160.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="149.477" y1="160.703" x2="29" y2="160.703" style="stroke:#181818;stroke-width:1;"/><polygon points="25,305.485,29,315.485,33,305.485,29,309.485" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="29" y1="160.703" x2="29" y2="466.767" style="stroke:#181818;stroke-width:1;"/><line x1="29" y1="466.767" x2="202.743" y2="466.767" style="stroke:#181818;stroke-width:1;"/><line x1="202.743" y1="466.767" x2="202.743" y2="486.767" style="stroke:#181818;stroke-width:1;"/><polygon points="198.743,476.767,202.743,486.767,206.743,476.767,202.743,480.767" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="202.743" y1="128.703" x2="202.743" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="198.743,138.703,202.743,148.703,206.743,138.703,202.743,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="202.743" y1="521.86" x2="202.743" y2="541.86" style="stroke:#181818;stroke-width:1;"/><polygon points="198.743,531.86,202.743,541.86,206.743,531.86,202.743,535.86" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="202.743" y1="576.954" x2="202.743" y2="598.935" style="stroke:#181818;stroke-width:1;"/><polygon points="198.743,588.935,202.743,598.935,206.743,588.935,202.743,592.935" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="202.743" y1="634.028" x2="202.743" y2="666.009" style="stroke:#181818;stroke-width:1;"/><polygon points="198.743,656.009,202.743,666.009,206.743,656.009,202.743,660.009" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="202.743" y1="701.103" x2="202.743" y2="721.103" style="stroke:#181818;stroke-width:1;"/><polygon points="198.743,711.103,202.743,721.103,206.743,711.103,202.743,715.103" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="26"><text x="187.133" y="762.483" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="178.791" y="775.062" fill="#888" font-size="10" textLength="402.437">claimed. Complete ModelCheckpoint reviewed, including pure ComposeTensorHeader and</text><text x="194.623" y="787.64" fill="#888" font-size="10" textLength="370.771">singleton handling. No sort is added here; parser-supplied order is significant. Equal</text><text x="192.948" y="800.218" fill="#888" font-size="10" textLength="374.121">headers can produce the same header root despite different weight payloads. Native</text><text x="172.101" y="812.796" fill="#888" font-size="10" textLength="415.815">OrderedComposition and the independent source snapshot identity must not be conflated with</text><text x="343.876" y="825.374" fill="#888" font-size="10" textLength="72.266">this header root.</text></g><?plantuml-src dLHDSzis4BtpL-nC3ubd4bcYHCcq3ftKZIUTITnCbLlRmn9OYAWfW050ExhrH_GNzfVqWPGTPQQdN2W1-_NsxLkyeBSFLejJSatlkUzOoINt_UNf_-ndKVxG-oWXNdxmMhhfUzEAkk-zTMcc8ktUlIchDN5Lc_MgR7Ipg5ULD5TBbh9SILcRHbyjLBbMrNorBisAwwLQBN7GpN9HbRLQhJTwKxpuJZ3U1sqT9ubdQAwgZQYgN9PwNIxqShCkrQASgvLf6fbpNVFgggovDboNguqnSysctbImr_YxCVNtelbwVGPcpfk5LhgfvujbsJHLPRHPpdc1pwOsrS98nGfV8q1NY-R5cijosV2oN5uPPOfuRrtFWG_KiBhV1pyuVUCx7-Y7spUtDxUtPnwnPUqVhTkJuIxAcKMBuQ5BjzwbEpu8xTZ5dGHhYcHJ9_J1En-az_Jlt_-GUfunjS9Q0Yd42OxuZIaCAbdlYfWufEBw4zyBmHe1IKjKmVR9XqZMKHpwlhEY2MEIi2qUMujQBpzDpa4ER5tyyO9if9T7YHS5NUyGa4Zxb11sokeoOg3nvBoJGv-Ei7n956L_0AhuXmlobwX4x6Wo1udeDXFHSsgtoFkR3548aFTZNaHtmWyIgJcIV644ep44PDzTzYATZhqWfIPjKIQYvJ7mkPgJFIVx85_jSKjHSSSXJmB1A1bFKCVhdFmZQEOW4oN0aW6ELQQG89y7YIbk2t7wn9Vp5yNrtLHhnFOJ9zNIIMsHkEl6D77CaqzZBkIulfbyI1W19pevqk_P_TNKugl9-yypxpC1cE0FJu4Jg_yxMUSJiDjzcueTMEmaWQsi6ki6pcgX7j4ICkCANG5cGkA39DQSU5Pyv6FdMTC3TuDCZMG31NRxV0PZt4HvHjH2Cy7xD2j-IG0sPeSKdWGxgNG8w0xGmCwK7UHQLCYhFSi4PwCK40TStNdREVMMCBGEoLZhc9inTZ-4gHkyECaUl3jkiGQ-Bmpy9HGxFmGbhuCyM7aSsK5EO1c3PdI7_xYD43wOmICnhG3vNjmMM2WCk8VOMIdf4mDceJh6ZPvH7WvupRlwpJjCJzLUOJ2g6_GeUxHEft5Ew_Pk8WR45l5vGYsE7Kw0vWbEAQyYsWN85khSWhY0gRt-TjpPATgziyOgD3AZjvy7xeg9UZ35UTfU3mhlGekbo-jxcalcDRyIlKrvRun15RJmA5awJsEAW3EglVXrMfAf4JiodvMHirgd1RJf71v7sYawxcEB0ldnnhjsfCCGqoY0HiO1TfpvVxIfBKO5dQ6Qz72Quty0?></g></svg>