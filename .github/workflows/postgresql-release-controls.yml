name: PostgreSQL release source controls
on:
  push:
    branches: [verify/postgresql-release-20260916]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_SHA: e99949e689d4926d1e56b797db383262d4b45c11
      SOURCE_TREE: fd3ab15431594f2028856915cd4308d9e6de391f
      TMPDIR: /build/laplace/work/postgresql-release/tmp
      TMP: /build/laplace/work/postgresql-release/tmp
      TEMP: /build/laplace/work/postgresql-release/tmp
      EVIDENCE: /build/laplace/recovery/postgresql-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Prepare permanent isolated source and scratch
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$TMPDIR" "$EVIDENCE" /build/laplace/worktrees
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          git worktree add --detach /build/laplace/worktrees/postgresql-release "$SOURCE_SHA"
          printf '%s\n' "$SOURCE_SHA $SOURCE_TREE" > "$EVIDENCE/source.txt"
      - name: Execute dependency and existing owner controls
        run: |
          set -euo pipefail
          cd /build/laplace/worktrees/postgresql-release
          status=0
          for test in test-postgresql-release.py test-test-profile-registry.py test-managed-host.py; do
            set +e
            timeout --signal=TERM --kill-after=10s 180s python3 "scripts/$test" 2>&1 | tee "$EVIDENCE/$test.log"
            result=$?
            set -e
            printf '%s\t%s\n' "$test" "$result" >> "$EVIDENCE/exit-codes.tsv"
            if [ "$result" -ne 0 ]; then status=1; fi
          done
          test -z "$(git status --porcelain --untracked-files=all)"
          exit "$status"
      - name: Verify the actual official release archive
        run: |
          set -euo pipefail
          cd /build/laplace/worktrees/postgresql-release
          archive=/build/laplace/work/postgresql-release/postgresql-18.6.tar.bz2
          curl --fail --location --proto '=https' --connect-timeout 15 --max-time 180 \
            --retry 2 https://ftp.postgresql.org/pub/source/v18.6/postgresql-18.6.tar.bz2 \
            --output "$archive"
          python3 scripts/postgresql-release.py archive --archive "$archive" \
            | tee "$EVIDENCE/official-archive.json"
      - name: Retain bounded source qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgresql-release-source-controls
          path: /build/laplace/recovery/postgresql-release/
          if-no-files-found: error
          retention-days: 30
