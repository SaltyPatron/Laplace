"12.5"/><text x="50.688" y="385.359" fill="#000" font-size="12" textLength="374.848">Emit move nodes and exact line trajectory; require start identity agrees</text><rect x="16" y="417.996" width="444.225" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="440.453" fill="#000" font-size="12" textLength="424.225">Append move outcomes, line result, player identities/relations and player results</text><rect x="93.03" y="488.09" width="290.164" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="103.03" y="510.547" fill="#000" font-size="12" textLength="270.164">Append metadata, clocks and retained ply analysis</text><rect x="77.043" y="543.184" width="322.139" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="87.043" y="565.641" fill="#000" font-size="12" textLength="302.139">Derive witnessed-game analysis and transition testimony</text><rect x="85.712" y="598.277" width="304.801" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="95.712" y="620.734" fill="#000" font-size="12" textLength="284.801">Add transition marker and position-outcome trajectory</text><rect x="91.372" y="653.371" width="293.48" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="101.372" y="675.828" fill="#000" font-size="12" textLength="273.48">If tablebase prober exists, derive its game evidence</text><polygon points="164.424,203.797,311.801,203.797,323.801,215.797,311.801,227.797,164.424,227.797,152.424,215.797,164.424,203.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="242.112" y="239.216" fill="#000" font-size="11" textLength="17.118">yes</text><text x="164.424" y="220.298" fill="#000" font-size="11" textLength="147.377">Position sequence nonempty?</text><polygon points="2