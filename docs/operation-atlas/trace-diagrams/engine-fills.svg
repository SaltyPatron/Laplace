25" fill="#000" font-size="12" textLength="215.438">Map tier0; initialize working table/context</text><rect x="83.899" y="379.762" width="249.459" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="93.899" y="402.219" fill="#000" font-size="12" textLength="229.459">Compose exact phrase and constituent IDs</text><rect x="32.536" y="434.855" width="352.186" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="42.536" y="457.313" fill="#000" font-size="12" textLength="332.186">Choose composed lookup keys, falling back to all phrase parts</text><rect x="126.585" y="489.949" width="164.088" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="136.585" y="512.406" fill="#000" font-size="12" textLength="144.088">Fetch candidate containers</text><rect x="55.215" y="545.043" width="306.828" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="65.215" y="567.5" fill="#000" font-size="12" textLength="286.828">lp_path_follows checks exact run including separators</text><rect x="102.901" y="657.056" width="211.455" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="112.901" y="679.513" fill="#000" font-size="12" textLength="191.455">Fetch parents in sets of up to 20000</text><rect x="56.876" y="720.731" width="303.506" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="66.876" y="743.188" fill="#000" font-size="12" textLength="283.506">Record parent multiplicities; enqueue unseen parents</text><polygon points="145.038,600.137,272.22,600.137,284.22,612.137,272.22,624.137,145.038,624.137,133.038,612.137,145.038,600.137" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="212.629" y="635.556" fill="#000" font-size="11" textLength="