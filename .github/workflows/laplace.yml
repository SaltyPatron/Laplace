name: Product — main delivery
run-name: "Deliver main — staging on hart-server, then production: built on hart-cloud, hosted on hart-prod — ${{ github.sha }}"

# Every merge to main is built, installed, migrated and published on hart-server (the machine Laplace-Operations
# declares; the staging host) by this repository's runner (Laplace-Operations' agents.sh: labels laplace,Laplace,
# staging; no sudo), with deploy/linux/site.sh: the engine and extensions against the Operations cluster, the database
# laplace-mono, the API + SPA at /opt/laplace/app behind nginx :8080. The machine's root part is
# deploy/linux/site-host.sh, run once by a person. Seeding is an operation (product-operator.yml), never part of a delivery;
# this workflow has no manual dispatch (scripts/validate-pipeline.py: manual dispatch belongs in product-operator.yml).
#
# When that delivery has read back on hart-server, the same revision goes to production, in two jobs on two hosts.
# The knowledge host, hart-cloud (a Google Compute c3, Sapphire Rapids: the AVX-512 machine, the knowledge database
# and the compiler; runner label knowledge), builds, installs, migrates and stages, and hands the staged app with its
# native closure and perf-caches on as an artifact. The hosting host, hart-prod (a small always-on machine with the
# API, MCP and the Cloudflare tunnel, and the application's own database; runner label production), receives it,
# publishes and restarts. Promotion requires staging to pass in the same run.
# Serialize complete promotions so two revisions cannot interleave shared staging
# artifacts or overwrite each other's cloud lease while waiting on later hosts.
#
# The earlier delivery chain (product-stage.yml over scripts/pipeline.sh) assumes the decommissioned layout (a /build
# volume, /opt/laplace/pgsql-18, laplace_admin, sudo -n); it stays callable from full-qualification.yml by dispatch.

on:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
      - "tests/**"
      - "scripts/ci-impact-plan.py"
      - "scripts/ci-qualification-cache.py"
      - "scripts/ci-product-freshness.py"
      - "scripts/ci_product_scope.py"
      - "scripts/test-parallel.sh"
      - "scripts/product-ci.sh"
      - "deploy/linux/deploy.sh"
      - "scripts/publish-applications.sh"
      - "scripts/test-suites/**"
      - "scripts/ci_managed_projects.py"
      - "scripts/test-*.py"
      - "scripts/test-*.sh"
      - "scripts/tests/**"
      - "web/scripts/test-*.mjs"
      - "web/e2e/**"
      - "scripts/test-workflow-architecture.py"
      - "scripts/test-seed-workflow-ownership.py"
      - "scripts/test-product-ci-artifact-ownership.py"
      - "scripts/test-benchmark-suite.py"
      - "scripts/validate-pipeline.py"
      - "vault-data-inventory.tsv"
      - "vault-data-directories.list"

permissions:
  contents: read
  id-token: write   # the knowledge host is started through GCP workload identity federation: a short-lived token, no stored key

concurrency:
  group: laplace-promotion
  cancel-in-progress: false
  queue: max

# Host groups also coordinate jobs with other workflows. Status and verification
# remain independently callable; the promotion queue is not a machine lock.
jobs:
  deliver:
    name: Staging — build, migrate, publish, read back on hart-server
    concurrency:
      group: laplace-site-hart-server
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, laplace, Laplace, staging]
    timeout-minutes: 240
    env:
      LAPLACE_CONNINFO: ""
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Externals and build (engine, perf-caches, extensions)
        run: deploy/linux/site.sh externals build

      - name: Install into /opt/laplace
        run: deploy/linux/site.sh install

      - name: Database laplace-mono, extensions updated in place, migrations
        run: |
          deploy/linux/site.sh database extensions migrate

      - name: Stage the API + SPA, publish, restart
        run: deploy/linux/site.sh app publish restart


      - name: Read back
        run: deploy/linux/site.sh smoke

  knowledge-host:
    name: Production — the knowledge host (hart-cloud) started for the job
    needs: deliver
    if: needs.deliver.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Authenticate to GCP by workload identity (no stored key)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/398413378767/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: laplace-pipeline@project-f5812b96-f924-41a4-94c.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Start the instance if it is stopped
        run: |
          set -euo pipefail
          state=$(gcloud compute instances describe hart-cloud --zone us-east1-b --format='value(status)')
          echo "hart-cloud: $state"
          case "$state" in
            RUNNING) ;;
            TERMINATED|STOPPED|SUSPENDED) gcloud compute instances start hart-cloud --zone us-east1-b --quiet ;;
            *) for i in $(seq 1 30); do sleep 10; state=$(gcloud compute instances describe hart-cloud --zone us-east1-b --format='value(status)'); [ "$state" = RUNNING ] && break; done
               [ "$state" = RUNNING ] || gcloud compute instances start hart-cloud --zone us-east1-b --quiet ;;
          esac
          echo "hart-cloud: $(gcloud compute instances describe hart-cloud --zone us-east1-b --format='value(status)')"
          # The build job queues until the host's runner registers (GitHub holds a queued job for a day); no poll of the
          # runner API here, which the workflow token may not read.
      - name: Hold the host for this run
        # The host stops itself when idle (Laplace-Operations setup.sh idlestop), and a job queued behind its
        # concurrency group or waiting for the runner is not running on it yet: on 2026-10-10 the host stopped under
        # run 38023100147 after thirty idle minutes. The lease in the instance's metadata, this run's id and an expiry
        # the build and hosting jobs' combined timeouts away, is what the idle stop reads; release waits for hosting
        # verification, whatever its result, and the expiry ends it if nothing does.
        run: |
          set -euo pipefail
          gcloud compute instances add-metadata hart-cloud --zone us-east1-b --quiet \
            --metadata "laplace-lease=${{ github.run_id }} $(( $(date +%s) + 300 * 60 ))"

  production-build:
    name: Production — built, migrated and staged on the knowledge host (hart-cloud)
    needs: [deliver, knowledge-host]
    if: needs.knowledge-host.result == 'success'
    runs-on: [self-hosted, laplace, Laplace, knowledge]
    timeout-minutes: 240
    concurrency:
      group: laplace-site-knowledge
      cancel-in-progress: false
      queue: max
    env:
      LAPLACE_CONNINFO: ""
    outputs:
      bundle: ${{ steps.bundle.outputs.path }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Externals and build (engine, perf-caches, extensions)
        run: deploy/linux/site.sh externals build

      - name: Install into /opt/laplace
        run: deploy/linux/site.sh install

      - name: Database laplace-mono, extensions updated in place, migrations (the application database too, LAPLACE_APP_DB)
        run: |
          deploy/linux/site.sh database extensions migrate

      - name: Stage the API + SPA and bundle them for the hosting host
        run: deploy/linux/site.sh app bundle


      - name: Where the bundle is
        id: bundle
        run: echo "path=${LAPLACE_SITE_WORK:-${LAPLACE_WORK:-/repos/work}/mono-site}/bundle" >> "$GITHUB_OUTPUT"

      - name: Hand the bundle to the hosting host
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-site-${{ github.sha }}
          path: ${{ steps.bundle.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  knowledge-host-release:
    name: Production — the knowledge host released to stop itself when idle
    needs: [knowledge-host, production-build, production]
    if: always() && needs.knowledge-host.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticate to GCP by workload identity (no stored key)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/398413378767/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: laplace-pipeline@project-f5812b96-f924-41a4-94c.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Release this run's lease (a newer run's lease is left to that run)
        run: |
          set -euo pipefail
          lease=$(gcloud compute instances describe hart-cloud --zone us-east1-b --format='value(metadata.items.laplace-lease)' || true)
          echo "lease: ${lease:-none}"
          case "$lease" in
            "${{ github.run_id }} "*) gcloud compute instances remove-metadata hart-cloud --zone us-east1-b --quiet --keys laplace-lease; echo "released" ;;
            *) echo "not this run's: left" ;;
          esac

  production:
    name: Production — received, published and restarted on the hosting host (hart-prod)
    needs: production-build
    runs-on: [self-hosted, laplace, Laplace, production]
    timeout-minutes: 60
    concurrency:
      group: laplace-site-hart-prod
      cancel-in-progress: false
      queue: max
    env:
      LAPLACE_CONNINFO: ""
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Where the bundle goes
        id: bundle
        run: |
          b="${LAPLACE_SITE_WORK:-${LAPLACE_WORK:-/repos/work}/mono-site}/bundle"; rm -rf "$b"; mkdir -p "$b"
          echo "path=$b" >> "$GITHUB_OUTPUT"

      - name: Receive the bundle from the knowledge host
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: laplace-site-${{ github.sha }}
          path: ${{ steps.bundle.outputs.path }}

      - name: Receive, migrate application database, publish, restart
        run: deploy/linux/site.sh receive migrate_app publish restart

      - name: Read back
        run: deploy/linux/site.sh smoke
