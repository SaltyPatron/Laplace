name: Laplace — code player validation

on:
  push:
    branches: [main]
    paths:
      - "app/Laplace.Endpoints.OpenAICompat/Code*.cs"
      - "app/Laplace.Endpoints.OpenAICompat/Contracts/CodeContracts.cs"
      - "app/Laplace.Endpoints.OpenAICompat/ModelCatalog.cs"
      - "app/Laplace.Substrate/Crud/Npgsql/NpgsqlSubstrateReads.CodePlayer.cs"
      - "app/Laplace.Endpoints.OpenAICompat.Tests/CodeToolchainTests.cs"
      - "scripts/test-parallel.sh"
      - ".github/workflows/code-player-ci.yml"

permissions:
  contents: read

env:
  LAPLACE_EXTERNAL: ${{ vars.LAPLACE_EXTERNAL || '/build/external' }}
  LAPLACE_INSTALL_PREFIX: ${{ vars.LAPLACE_INSTALL_PREFIX || '/opt/laplace' }}
  LAPLACE_PG_PREFIX: ${{ vars.LAPLACE_PG_PREFIX || '/opt/laplace/pgsql-18' }}
  PGHOST: /var/run/postgresql
  PGPORT: 5432
  PGUSER: laplace_admin
  PGDATABASE: laplace
  LAPLACE_DATA_ROOT: /vault/Data

jobs:
  validate:
    name: Build code player and execute verifier contracts
    runs-on: [self-hosted, laplace]
    timeout-minutes: 120
    concurrency:
      group: laplace-code-player-validation
      cancel-in-progress: true
    steps:
      - name: Build exact triggering revision and run code-player tests
        env:
          TARGET_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 0002
          workspace_lock_root="${LAPLACE_WORK_ROOT:-/build/laplace/work}"
          mkdir -p "$workspace_lock_root"
          exec 9>"$workspace_lock_root/host-resource.lock"
          flock 9

          cd "$GITHUB_WORKSPACE"
          if [[ ! -e .git ]]; then
            [[ -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]] || {
              echo "::error::nonempty workspace has no repository; preserving its files" >&2
              exit 1
            }
            git init --initial-branch=main
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          git diff --quiet
          git diff --cached --quiet
          checkout_auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $checkout_auth" \
            git fetch --no-tags --depth=2 origin "$TARGET_SHA"
          unset checkout_auth CHECKOUT_TOKEN
          git checkout --no-overwrite-ignore --detach "$TARGET_SHA"
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git diff --quiet
          git diff --cached --quiet

          source scripts/ci-environment.sh
          bash scripts/product-ci.sh build
          dev_perfcache=$(find -L build -type f -name 'laplace_t0_perfcache*.bin' -print 2>/dev/null | sort | tail -1 || true)
          [[ -z "$dev_perfcache" ]] || export LAPLACE_PERFCACHE_BIN="$dev_perfcache"
          bash scripts/sync-managed-native-artifacts.sh
          dotnet test app/Laplace.Endpoints.OpenAICompat.Tests/Laplace.Endpoints.OpenAICompat.Tests.csproj \
            -c Release --no-build --nologo --verbosity minimal \
            --filter 'FullyQualifiedName~CodeToolchainTests'
