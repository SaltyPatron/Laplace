zation is required.</text></g><g class="footer" data-source-line="31"><text x="92.683" y="1025.369" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="96.602" y="1037.947" fill="#888" font-size="10" textLength="377.915">claimed. CloseAsync orchestration is reviewed. Its success follows the writer return; it</text><text x="84.331" y="1050.525" fill="#888" font-size="10" textLength="402.456">does not independently inspect a commit receipt. Transaction ownership continues through</text><text x="129.377" y="1063.104" fill="#888" font-size="10" textLength="312.363">the partial writer files; this is not an executable-build or durability claim.</text></g><?plantuml-src bLJ1Zjis5BphAnxGGnAWiItPikKrYiBhTj45jficNg1dYdgosQL9XQJMsPpw4Vt2Vac7bBrnqajx4YMHy-RDpECh-lb9DMmaNz6TwBIGF1PTDpwjHzk-zi69mEDRisCVb3NZXzwPZRQUtKXwslwoBievrRATJei9J_EAIpahv7nIpASDpoRvFC_5d2VJUPlFnQ9Qp9Xd8bzMhIZhSYadvOodCdlrdvciqq96BdwyiUQ9dHVn3Ul09bomAfPDiIXHl5ZE5_Ly9bgP5sKzMoxRN8fIJAh9RDRK-5DCcoLNox8MPSljefbMLLrL_uFLnlND-BxR-Oywal9iVE_NKlQ7NeETsVtkLFXAihncAHTrFY-hPYAdYs8nWqvYrXRLek1ftHRjPDbKO9qNLHcvvJBdvLBAIaocUP7vHsKwuSI1QY4VTyxsfjbORHrzTxE-sTpSNEpmUz7O8sXGAxJdYpyDjwBNuGRYtOi3qrOOlsMdsYoee9b-jSOwxYpz_UTV5E0zoMW-2TCGv1OcK6rjY39qcG_2XUpg0__1CX0Vkl1CdRDuVa-VsLdox3si8f1KvabeTGPPPQgbruD896he5tvyGs7FXbu_it-JqTMT5Gr9su2CGbKfv9vN-61GkqSvSQ4s_MPzs3dUlh-ZOm9TPMmQT1NBF0oyXpBKWY3OW3jy7c2_BVs1lTLFV6vuQ2b9uDXtqMxojdUI_Ggxrrsddm7WcBzeGt8luWp53PjOumpcfUsOhC4HqQRkqt77KMn_fdrrtIlTd0n8IAcyTGqxnXEzEnU3IhS_-K7CUqj75GmK5pMCbCDu_BkrX9bY0Mu-sEvSClLnEM5nzDV-sSXLTlNE489n4Fh45DO6kdRsaSqF0zZv1zm1SWBMl0CsH0d17h9D55ph14tAn_rxPuzcHEz0qS6AVhT7Z3v9xjAuNzQ8g2S7lZGmogvVz4u1ZN-4WpiSqnxu9AuKMliH3JverN9GY3ueMCD3ljrB8e2PAb9ZsQFdQ3y_nU080dVi10Ft7D6qnXlEAWJxyqLR7ti5aqPHrq61h0LDTjasXUOjy1GVeuqEXDADWhCZkiSQNpqV41Gb8zH1A4nFnsO5AkHwavWZ-f0eiisa5lZIW4vi8xdrDUn0QIWueji0LNiSzvvQgxKz-fYFqz2Sn5sH2jbB-yfW1D44982KaAcBmouGiCD11HoHhBemeWU7gsIug0ck8aHxrQKOAjDpB8ChQxVFOZ