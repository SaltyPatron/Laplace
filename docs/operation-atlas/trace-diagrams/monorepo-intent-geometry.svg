<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:491px;height:1086px;background:#FAFCFF;" width="491px" height="1086px" viewBox="0 0 491 1086" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="491" height="1086" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="5"><text x="34.917" y="34.533" fill="#000" font-size="14" textLength="419.747" font-weight="700">Monorepo — root angular, Hilbert and realized-curve discovery</text></g><ellipse cx="243.79" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="150.757" y="142.527" width="186.066" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="160.757" y="164.984" fill="#000" font-size="12" textLength="166.066">Return empty geometry frontier</text><ellipse cx="243.79" cy="216.574" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="243.79" cy="216.574" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="212.901,93.609,274.679,93.609,286.679,105.609,274.679,117.609,212.901,117.609,200.901,105.609,212.901,93.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="247.79" y="129.028" fill="#000" font-size="11" textLength="17.118">yes</text><text x="212.901" y="110.11" fill="#000" font-size="11" textLength="61.778">fanout &lt;= 0?</text><rect x="60.358" y="269.574" width="366.863" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="70.358" y="292.031" fill="#000" font-size="12" textLength="346.863">Prepare/cache three SPI plans; locate whole root in admitted tree</text><rect x="49.032" y="324.668" width="389.516" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="59.032" y="347.125" fill="#000" font-size="12" textLength="369.516">Angular KNN: same tier, excluding root, nonnull normalized directions</text><rect x="29.014" y="379.762" width="429.553" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="39.014" y="402.219" fill="#000" font-size="12" textLength="409.553">Take fanout nearest by chord; return angular metric ordered by chord then ID</text><rect x="46.015" y="434.855" width="395.551" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="56.015" y="457.313" fill="#000" font-size="12" textLength="375.551">Hilbert: read up to fanout equal, predecessor and successor keys each</text><rect x="55.018" y="489.949" width="377.545" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="65.018" y="512.406" fill="#000" font-size="12" textLength="357.545">Require 128-bit keys; compute exact unsigned absolute differences</text><rect x="80.708" y="545.043" width="326.164" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="90.708" y="567.5" fill="#000" font-size="12" textLength="306.164">Sort by difference then ID; retain fanout Hilbert responses</text><rect x="73.384" y="649.055" width="340.813" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="83.384" y="671.512" fill="#000" font-size="12" textLength="320.813">Realize root curve from immediate ordered child coordinates</text><rect x="86.043" y="704.148" width="315.494" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="96.043" y="726.605" fill="#000" font-size="12" textLength="295.494">Read structural.entity_curve for root angular candidates</text><rect x="51.704" y="759.242" width="384.172" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="61.704" y="781.699" fill="#000" font-size="12" textLength="364.172">Calculate 4D Frechet distances; sort by distance then ID; limit fanout</text><polygon points="70.135,600.137,417.446,600.137,429.446,612.137,417.446,624.137,70.135,624.137,58.135,612.137,70.135,600.137" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="247.79" y="635.556" fill="#000" font-size="11" textLength="17.118">yes</text><text x="70.135" y="616.638" fill="#000" font-size="11" textLength="347.311">Root has at least two immediate children and angular candidates exist?</text><polygon points="243.79,814.336,255.79,826.336,243.79,838.336,231.79,826.336,243.79,814.336" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="16" y="858.336" width="455.58" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="880.793" fill="#000" font-size="12" textLength="435.58">Append separate typed metric responses with source, rank and distance/key delta</text><rect x="90.707" y="913.43" width="306.166" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="100.707" y="935.887" fill="#000" font-size="12" textLength="286.166">Deduplicate candidate identities into geometry frontier</text><ellipse cx="243.79" cy="979.523" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="243.79" cy="979.523" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="243.79" y1="177.621" x2="243.79" y2="205.574" style="stroke:#181818;stroke-width:1;"/><polygon points="239.79,195.574,243.79,205.574,247.79,195.574,243.79,199.574" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="243.79" y1="117.609" x2="243.79" y2="142.527" style="stroke:#181818;stroke-widt