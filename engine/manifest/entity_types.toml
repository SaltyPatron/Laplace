# A word with its part of speech: the ordered composition [word, UPOS] (FrameNet
# lexemes and lemmas; a multiword lemma's word is its whole text).
[[type]]
canonical = "Lexeme"

# A FrameNet semantic type (semTypes.xml: Sentient, Body_of_water...): the ontological
# class a frame, frame element filler or lexical unit is marked with.
[[type]]
canonical = "FrameNet_Semantic_Type"

# A frame element realized with a grammatical function and phrase type: the
# composition [frame element, GF, PT(, preposition)].
[[type]]
canonical = "FrameNet_Valence_Unit"

# The ordered composition of the valence units one annotated realization combines.
[[type]]
canonical = "FrameNet_Valence_Pattern"

# A morphological feature value: the ordered composition [feature, value], for
# example [Number, Plur] (Universal Dependencies FEATS).
[[type]]
canonical = "Morphological_Feature"

# A named property's value: the ordered composition [property, value], for example
# [hidden_size, 2048] in a model config or [input_tokens, 1234] in an agent trace. The
# property name is the source's own vocabulary (content), never a relation of its own.
[[type]]
canonical = "Property_Value"

