name: Laplace — benchmark evidence

# Benchmarks run on explicit dispatch or workflow_call. Full chess acceptance
# also has a deliberately named operator branch trigger; main pushes do not select it. The measured host is shared with delivery, so this
# workflow uses the product job's workspace lock and cannot overlap activation.
# Scaling defaults preserve host headroom; destructive all-logical-CPU saturation
# requires an explicit opt-in. The query suite is read-only but additionally
# requires the installed content-versioned extension/execution binding to match
# the exact source revision built by this run.
on:
  push:
    branches: [verify/chess-acceptance-*]
  workflow_call:
    inputs:
      target_ref:
        description: "activated repository ref/SHA to measure"
        type: string
        required: false
        default: ""
      suite:
        description: "versioned benchmark suite"
        type: string
        required: false
        default: chess
      repeats:
        description: "retained measured repeats per case"
        type: string
        required: false
        default: "3"
      scale_workers:
        description: "optional core-scaling worker points"
        type: string
        required: false
        default: ""
      reserve_logical_cpus:
        description: "CPU capacity reserved from the affinity/quota bounded chess grant"
        type: string
        required: false
        default: "2"
      allow_saturation:
        description: "explicitly remove reserved headroom while retaining affinity/quota limits"
        type: boolean
        required: false
        default: false
      corpus_dir:
        description: "core benchmark corpus root"
        type: string
        required: false
        default: ""
      moby_path:
        description: "Moby Dick fixture path on the measured host"
        type: string
        required: false
        default: "/vault/Data/test-data/text/moby_dick.txt"
      force_rebuild:
        description: "rebuild source artifacts for suites requiring them"
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      target_ref:
        description: "repository ref/SHA to benchmark (blank = dispatched revision)"
        type: string
        required: false
        default: ""
      suite:
        description: "versioned benchmark suite"
        type: choice
        required: true
        default: quick
        options: [quick, throughput, core, scale, moby, query, chess, geometry, recorded, all, acceptance]
      repeats:
        description: "repeats per selected benchmark case/scaling point; all runs retained"
        type: string
        required: true
        default: "3"
      scale_workers:
        description: "optional core-scaling worker points; blank derives serviceable points with reserved host headroom"
        type: string
        required: false
        default: ""
      reserve_logical_cpus:
        description: "CPU capacity reserved from the available managed-host ceiling; chess also accounts for affinity and cgroup quotas"
        type: string
        required: true
        default: "2"
      allow_saturation:
        description: "explicitly remove reserved CPU headroom; affinity and cgroup quotas still bound chess measurements"
        type: boolean
        required: true
        default: false
      corpus_dir:
        description: "core benchmark corpus root (blank = repository)"
        type: string
        required: false
        default: ""
      moby_path:
        description: "Moby Dick fixture path on the measured host"
        type: string
        required: true
        default: "/vault/Data/test-data/text/moby_dick.txt"
      force_rebuild:
        description: "force a clean exact-revision rebuild before measurement"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: laplace-shared-workspace
  cancel-in-progress: false

env:
  LAPLACE_EXTERNAL: ${{ vars.LAPLACE_EXTERNAL || '/build/external' }}
  LAPLACE_INSTALL_PREFIX: ${{ vars.LAPLACE_INSTALL_PREFIX || '/opt/laplace' }}
  LAPLACE_PG_PREFIX: ${{ vars.LAPLACE_PG_PREFIX || '/opt/laplace/pgsql-18' }}
  PGDATABASE: laplace
  LAPLACE_DATA_ROOT: /vault/Data

jobs:
  benchmark:
    if: inputs.suite != 'acceptance' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/verify/chess-acceptance-'))
    name: Measured host — versioned benchmark suite
    runs-on: [self-hosted, laplace]
    timeout-minutes: ${{ inputs.suite == 'chess' && 45 || 180 }}
    steps:
      - name: Create immutable evidence directory first
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/laplace-benchmark-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$receipt"
          mkdir -p "$receipt"
          printf 'LAPLACE_BENCH_RECEIPT=%s\n' "$receipt" >> "$GITHUB_ENV"

      - name: Resolve and checkout exact revision
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
          REQUESTED_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          target="${REQUESTED_REF:-}"
          [[ -n "$target" ]] || target="$DISPATCH_SHA"
          printf 'requested_ref=%s\n' "$target" > "$LAPLACE_BENCH_RECEIPT/request.env"
          git fetch --no-tags --prune origin "$target"
          resolved="$(git rev-parse FETCH_HEAD)"
          git checkout --force "$resolved"
          printf 'LAPLACE_BENCH_SHA=%s\n' "$resolved" >> "$GITHUB_ENV"
          printf 'resolved_sha=%s\n' "$resolved" >> "$LAPLACE_BENCH_RECEIPT/request.env"

      - uses: ./.github/actions/setup-laplace-env
        if: inputs.suite != 'chess' && inputs.suite != 'geometry' && inputs.suite != 'recorded'

      - name: Validate benchmark registry and dispatch inputs
        shell: bash
        env:
          REPEATS: ${{ inputs.repeats }}
          RESERVE_LOGICAL_CPUS: ${{ inputs.reserve_logical_cpus }}
        run: |
          set -euo pipefail
          python3 scripts/benchmark_suite.py validate
          python3 scripts/benchmark_suite.py list | tee "$LAPLACE_BENCH_RECEIPT/suite-list.txt"
          [[ "$REPEATS" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::repeats must be a positive integer"
            exit 2
          }
          (( REPEATS <= 100 )) || {
            echo "::error::repeats must be <= 100"
            exit 2
          }
          [[ "$RESERVE_LOGICAL_CPUS" =~ ^[0-9]+$ ]] || {
            echo "::error::reserve_logical_cpus must be a non-negative integer"
            exit 2
          }

      - name: Resolve serviceable scaling plan
        if: inputs.suite != 'chess' && inputs.suite != 'geometry' && inputs.suite != 'recorded'
        shell: bash
        env:
          REQUESTED_SCALE_WORKERS: ${{ inputs.scale_workers }}
          RESERVE_LOGICAL_CPUS: ${{ inputs.reserve_logical_cpus }}
          ALLOW_SATURATION: ${{ inputs.allow_saturation }}
        run: |
          set -euo pipefail
          args=(
            --reserve-logical "$RESERVE_LOGICAL_CPUS"
            --github-env "$GITHUB_ENV"
            --json "$LAPLACE_BENCH_RECEIPT/scale-plan.json"
          )
          [[ -z "${REQUESTED_SCALE_WORKERS:-}" ]] || args+=(--workers "$REQUESTED_SCALE_WORKERS")
          [[ "$ALLOW_SATURATION" != true ]] || args+=(--allow-saturation)
          python3 scripts/benchmark_scale_plan.py "${args[@]}" \
            | tee "$LAPLACE_BENCH_RECEIPT/scale-plan.txt"

      - name: Resolve configured chess executables and resource grant
        id: chess_paths
        if: inputs.suite == 'chess'
        shell: bash
        env:
          RESERVE_LOGICAL_CPUS: ${{ inputs.reserve_logical_cpus }}
          ALLOW_SATURATION: ${{ inputs.allow_saturation }}
        run: |
          set -euo pipefail
          # Resolution reads the same service configuration as the dependency
          # doctor. It never updates sources, installs tools or builds runtimes.
          python3 - <<'PY'
          import hashlib, importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('chess_configuration', 'scripts/check-chess-dependencies.py')
          doctor = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(doctor)
          prefix = Path(os.environ['LAPLACE_INSTALL_PREFIX'])
          config = doctor.configuration(prefix)
          external = Path(config.get('LAPLACE_EXTERNAL', '/build/external'))
          source = Path(config.get('LAPLACE_STOCKFISH_SOURCE', str(external / 'stockfish')))
          cute_default = (Path(config['LAPLACE_CUTECHESS_BUILD']) / 'cutechess-cli'
                          if config.get('LAPLACE_CUTECHESS_BUILD') else prefix / 'bin/cutechess-cli')
          selected = {
              'stockfish': Path(config.get('LAPLACE_STOCKFISH', str(source / 'src/stockfish'))),
              'cutechess': Path(config.get('LAPLACE_CUTECHESS', str(cute_default))),
          }
          identities = {}
          exports = {}
          for name, configured in selected.items():
              binary = configured.resolve()
              if '\n' in str(binary) or '\r' in str(binary):
                  raise SystemExit(f'{name}: executable path contains a newline')
              if not binary.is_file() or not os.access(binary, os.X_OK):
                  raise SystemExit(f'{name}: configured executable is unavailable: {binary}; provision it before benchmarking')
              digest = hashlib.sha256()
              with binary.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              identities[name] = {'configured_path': str(configured), 'path': str(binary), 'sha256': digest.hexdigest()}
              exports['LAPLACE_BENCH_CHESS_' + name.upper()] = str(binary)
          uci_config = doctor.configuration(prefix, keys={'LAPLACE_UCI'})
          uci = Path(uci_config.get('LAPLACE_UCI', str(prefix / 'app/laplace-uci')))
          if uci.is_file() and os.access(uci, os.X_OK):
              exports['LAPLACE_BENCH_CHESS_UCI'] = str(uci.resolve())
          reserve = 0 if os.environ['ALLOW_SATURATION'] == 'true' else int(os.environ['RESERVE_LOGICAL_CPUS'])
          exports['LAPLACE_BENCH_CHESS_RESERVE_CPUS'] = str(reserve)
          exports['LAPLACE_BENCH_SCALE_MODE'] = 'saturation-allowed' if reserve == 0 and os.environ['ALLOW_SATURATION'] == 'true' else 'serviceable-headroom'
          # The benchmark helper derives its actual ceiling and thread points
          # from the intersection of affinity, cgroup quota and this reservation.
          identities['resource_request'] = {'reserve_cpus': reserve, 'allow_saturation': os.environ['ALLOW_SATURATION'] == 'true'}
          receipt = Path(os.environ['LAPLACE_BENCH_RECEIPT'])
          (receipt / 'chess-executable-identities.json').write_text(json.dumps(identities, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              for name, value in exports.items():
                  if '\n' in value or '\r' in value:
                      raise SystemExit(f'{name}: invalid multiline environment value')
                  handle.write(f'{name}={value}\n')
          print(json.dumps(identities, indent=2))
          PY

      - name: Record installed chess functionality and online readiness
        id: chess_readiness
        if: ${{ !cancelled() && inputs.suite == 'chess' && steps.chess_paths.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          LAPLACE_LICHESS_STATUS_BASE: ${{ vars.LAPLACE_LICHESS_STATUS_BASE || 'http://127.0.0.1:5189' }}
        run: |
          set -euo pipefail
          umask 0002
          mkdir -p /build/laplace/work
          flock --exclusive --close /build/laplace/work/host-resource.lock python3 - <<'PY'
          import datetime, json, os, signal, subprocess, sys
          import urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          receipt = Path(os.environ['LAPLACE_BENCH_RECEIPT'])
          prefix = Path(os.environ['LAPLACE_INSTALL_PREFIX'])
          uci = os.environ.get('LAPLACE_BENCH_CHESS_UCI') or os.environ.get('LAPLACE_UCI') or str(prefix / 'app/laplace-uci')
          env = dict(os.environ)
          for name in ('STOCKFISH', 'CUTECHESS'):
              selected = env.get('LAPLACE_BENCH_CHESS_' + name)
              if selected:
                  env['LAPLACE_' + name] = selected
          command = ['timeout', '--signal=TERM', '--kill-after=5s', '240s', sys.executable,
                     'scripts/chess-runtime-env.py', '--prefix', str(prefix), '--', sys.executable,
                     'scripts/check-chess-dependencies.py', '--prefix', str(prefix), '--uci', uci, '--check-latest', '--cutechess-gui']
          observed = datetime.datetime.now(datetime.timezone.utc).isoformat()
          execution = {'observed_utc': observed, 'timeout_seconds': 240, 'prefix': str(prefix), 'uci': uci}
          try:
              result = subprocess.run(command, env=env, capture_output=True, text=True)
              execution['exit_code'] = result.returncode
              try:
                  doctor = json.loads(result.stdout)
                  if not isinstance(doctor, dict) or not isinstance(doctor.get('checks'), list):
                      raise ValueError('invalid report shape')
              except ValueError:
                  doctor = {'executable_ready': False, 'checks': [], 'status': 'report-unavailable'}
              failed = result.returncode != 0 or doctor.get('executable_ready') is not True or any(
                  check.get('required') and check.get('status') not in ('ready', 'present')
                  for check in doctor['checks'])
          except OSError as error:
              execution['failure_type'] = type(error).__name__
              doctor = {'executable_ready': False, 'checks': [], 'status': 'could-not-run'}
              failed = True
          execution['required_checks_passed'] = not failed
          (receipt / 'chess-dependency-readiness.json').write_text(json.dumps(doctor, indent=2) + '\n', encoding='utf-8')
          (receipt / 'chess-readiness-execution.json').write_text(json.dumps(execution, indent=2) + '\n', encoding='utf-8')

          # The endpoint returns tokenPreview, logs and free-text errors. Keep
          # only typed capability fields; never retain the raw response or auth.
          # Read the same loopback service endpoint used by LichessStatusClient;
          # the public /chess route separately requires a tenant API key.
          status = {'observed_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'required': False, 'status': 'unverified',
                    'verification': 'read-only service snapshot; no account upgrade, bot start or game creation'}
          def deadline(signum, frame):
              raise TimeoutError('status deadline exceeded')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, newurl):
                  return None
          try:
              base = urllib.parse.urlsplit(os.environ['LAPLACE_LICHESS_STATUS_BASE'])
              if base.scheme not in ('http', 'https') or not base.netloc or base.username or base.password or base.query or base.fragment:
                  raise ValueError('invalid status base')
              url = urllib.parse.urlunsplit((base.scheme, base.netloc, base.path.rstrip('/') + '/status', '', ''))
              status['endpoint'] = url
              signal.signal(signal.SIGALRM, deadline)
              signal.alarm(10)
              with urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect).open(url, timeout=8) as response:
                  status['http_status'] = response.status
                  raw = response.read(65537)
              if len(raw) > 65536:
                  raise ValueError('oversized response')
              payload = json.loads(raw)
              if not isinstance(payload, dict):
                  raise ValueError('invalid response shape')
              service = {key: payload[key] for key in ('configured', 'connected', 'running', 'substrate')
                         if isinstance(payload.get(key), bool)}
              service.update({key: payload[key] for key in ('depth', 'maxConcurrent', 'gamesRecorded')
                              if type(payload.get(key)) is int and payload[key] >= 0})
              service['error_present'] = bool(payload.get('error'))
              account = payload.get('account') if isinstance(payload.get('account'), dict) else {}
              account_status = {key: account.get(key) if isinstance(account.get(key), bool) else None
                                for key in ('tokenValid', 'botAccount', 'botPlayScope', 'ready')}
              account_status['error_present'] = bool(account.get('error'))
              account_keys = ('tokenValid', 'botAccount', 'botPlayScope', 'ready')
              service_keys = ('configured', 'connected', 'running')
              verified = all(account_status[key] is True for key in account_keys)
              known_failure = service['error_present'] or account_status['error_present'] or any(
                  service.get(key) is False for key in service_keys) or any(account_status[key] is False for key in account_keys)
              status.update(service=service, account=account_status,
                            status='not-ready' if known_failure else 'ready' if verified and all(
                                service.get(key) is True for key in service_keys) else 'unverified')
          except urllib.error.HTTPError as error:
              status.update(status='authentication-required' if error.code in (401, 403) else 'http-error', http_status=error.code)
          except (OSError, ValueError) as error:
              status.update(status='unreachable' if isinstance(error, OSError) else 'invalid-response', failure_type=type(error).__name__)
          finally:
              signal.alarm(0)
          (receipt / 'chess-lichess-readiness.json').write_text(json.dumps(status, indent=2) + '\n', encoding='utf-8')
          print('Required chess dependency checks:', 'passed' if not failed else 'failed; retained evidence and measurements follow')
          print('Optional Lichess service/account readiness:', status['status'])
          raise SystemExit(1 if failed else 0)
          PY

      - name: Record source, runner, hardware and accelerator inventory
        shell: bash
        run: |
          set -euo pipefail
          out="$LAPLACE_BENCH_RECEIPT"
          {
            printf 'schema=laplace.benchmark-host/v2\n'
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'commit=%s\n' "$LAPLACE_BENCH_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'suite=%s\n' "${{ inputs.suite }}"
            printf 'scale_mode=%s\n' "${LAPLACE_BENCH_SCALE_MODE:-unknown}"
            printf 'scale_workers=%s\n' "${LAPLACE_BENCH_SCALE_WORKERS:-unknown}"
            printf 'scale_ceiling=%s\n' "${LAPLACE_BENCH_SCALE_CEILING:-unknown}"
            printf 'observed_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
          } > "$out/identity.env"
          git status --short > "$out/git-status.txt"
          git show -s --format=fuller "$LAPLACE_BENCH_SHA" > "$out/commit.txt"
          uname -a > "$out/uname.txt"
          lscpu > "$out/lscpu.txt"
          free -b > "$out/memory.txt"
          lsblk -b -o NAME,TYPE,SIZE,ROTA,FSTYPE,MOUNTPOINTS,MODEL > "$out/storage.txt"
          df -B1 > "$out/filesystems.txt"
          if command -v inxi >/dev/null 2>&1; then
            inxi -Fxz > "$out/inxi.txt" 2>&1 || true
          else
            printf 'inxi unavailable\n' > "$out/inxi.txt"
          fi
          for f in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
            [[ -r "$f" ]] || continue
            printf '%s\t%s\n' "$f" "$(cat "$f")"
          done > "$out/cpu-governors.tsv"
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi -q > "$out/nvidia-smi-before.txt" 2>&1 || true
            nvidia-smi --query-gpu=name,uuid,pstate,power.draw,power.limit,memory.used,utilization.gpu,utilization.memory \
              --format=csv,noheader,nounits > "$out/gpu-before.csv" 2>&1 || true
          else
            printf 'nvidia-smi unavailable\n' > "$out/nvidia-smi-before.txt"
          fi

      - name: Build exact revision without installing or mutating substrate state
        if: inputs.suite != 'chess' && inputs.suite != 'geometry' && inputs.suite != 'recorded'
        shell: bash
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -o pipefail
          umask 0002
          mkdir -p /build/laplace/work
          args=()
          [[ "$FORCE_REBUILD" != true ]] || args+=(--force-rebuild)
          flock --exclusive --close /build/laplace/work/host-resource.lock \
            bash scripts/pipeline.sh "${args[@]}" build 2>&1 \
            | tee "$LAPLACE_BENCH_RECEIPT/build.log"

      - name: Bind the benchmark to exact built native artifacts
        if: inputs.suite != 'chess' && inputs.suite != 'geometry' && inputs.suite != 'recorded'
        shell: bash
        run: |
          set -euo pipefail
          core="$GITHUB_WORKSPACE/build/engine/core/liblaplace_core.so"
          t0="$GITHUB_WORKSPACE/build/engine/core/perfcache/laplace_t0_perfcache.bin"
          control="$GITHUB_WORKSPACE/build/extension/laplace_substrate/laplace_substrate.control"
          execution_id="$GITHUB_WORKSPACE/build/extension/laplace_substrate/laplace_execution_module.txt"
          [[ -f "$core" ]] || { echo "::error::built core missing: $core"; exit 1; }
          [[ -f "$t0" ]] || { echo "::error::built T0 perfcache missing: $t0"; exit 1; }
          [[ -f "$control" ]] || { echo "::error::built substrate control missing: $control"; exit 1; }
          [[ -f "$execution_id" ]] || { echo "::error::built execution-module identity missing: $execution_id"; exit 1; }
          printf 'LAPLACE_CORE=%s\n' "$core" >> "$GITHUB_ENV"
          printf 'LAPLACE_T0=%s\n' "$t0" >> "$GITHUB_ENV"
          printf 'LAPLACE_PERFCACHE_BIN=%s\n' "$t0" >> "$GITHUB_ENV"
          {
            sha256sum "$core" "$t0" "$control" "$execution_id"
            printf '\n== substrate build identity ==\n'
            grep '^default_version' "$control"
            cat "$execution_id"
            printf '\n== core linkage ==\n'
            ldd "$core" || true
          } > "$LAPLACE_BENCH_RECEIPT/built-artifacts.txt"

      - name: Prepare Release CLI outside the measured interval when required
        if: inputs.suite == 'quick' || inputs.suite == 'moby' || inputs.suite == 'all'
        shell: bash
        run: |
          set -o pipefail
          umask 0002
          mkdir -p /build/laplace/work
          flock --exclusive --close /build/laplace/work/host-resource.lock \
            dotnet build app/Laplace.Cli/Laplace.Cli.csproj -c Release --no-restore 2>&1 \
            | tee "$LAPLACE_BENCH_RECEIPT/cli-release-build.log"

      - name: Execute versioned benchmark suite
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          REPEATS: ${{ inputs.repeats }}
          CORPUS_DIR: ${{ inputs.corpus_dir }}
          MOBY_PATH: ${{ inputs.moby_path }}
        run: |
          set -euo pipefail
          corpus="${CORPUS_DIR:-$GITHUB_WORKSPACE}"
          scale_workers="${LAPLACE_BENCH_SCALE_WORKERS:-}"
          args=(
            run
            --suite "$SUITE"
            --receipt-dir "$LAPLACE_BENCH_RECEIPT"
            --repeats "$REPEATS"
            --corpus-dir "$corpus"
            --moby-path "$MOBY_PATH"
            --database "$PGDATABASE"
          )
          runner=(python3 scripts/benchmark_suite.py)
          if [[ "$SUITE" == chess ]]; then
            runner=(python3 scripts/chess-runtime-env.py --prefix "$LAPLACE_INSTALL_PREFIX" -- "${runner[@]}")
            args+=(
              --chess-stockfish "$LAPLACE_BENCH_CHESS_STOCKFISH"
              --chess-cutechess "$LAPLACE_BENCH_CHESS_CUTECHESS"
              --chess-reserve-cpus "$LAPLACE_BENCH_CHESS_RESERVE_CPUS"
              --chess-max-seconds 1800
              --chess-case-timeout 600
            )
            [[ -z "${LAPLACE_BENCH_CHESS_UCI:-}" ]] || args+=(--chess-laplace-uci "$LAPLACE_BENCH_CHESS_UCI")
          elif [[ "$SUITE" == geometry ]]; then
            export PATH="$LAPLACE_PG_PREFIX/bin:$PATH"
          elif [[ "$SUITE" == recorded ]]; then
            args+=(--recorded-duration-seconds 30 --recorded-total-timeout 7200)
          else
            args+=(--core "$LAPLACE_CORE" --t0 "$LAPLACE_T0")
            [[ -z "$scale_workers" ]] || args+=(--scale-workers "$scale_workers")
          fi
          umask 0002
          mkdir -p /build/laplace/work
          # Laplace and Laplace-Refactor share this measured host. Keep their
          # builds/deployments/calibrations out of each other's timing interval.
          flock --exclusive --close /build/laplace/work/host-resource.lock \
            "${runner[@]}" "${args[@]}" 2>&1 \
            | tee "$LAPLACE_BENCH_RECEIPT/suite.log"

      - name: Record post-run accelerator state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$LAPLACE_BENCH_RECEIPT"
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi -q > "$out/nvidia-smi-after.txt" 2>&1 || true
            nvidia-smi --query-gpu=name,uuid,pstate,power.draw,power.limit,memory.used,utilization.gpu,utilization.memory \
              --format=csv,noheader,nounits > "$out/gpu-after.csv" 2>&1 || true
          fi

      - name: Publish benchmark summary
        if: always()
        shell: bash
        run: |
          sha="${LAPLACE_BENCH_SHA:-unresolved}"
          {
            echo '## Laplace versioned benchmark suite'
            echo
            echo "- Commit: \`$sha\`"
            echo "- Runner: \`$RUNNER_NAME\`"
            echo "- Suite: \`${{ inputs.suite }}\`"
            echo "- Scale profile: \`${LAPLACE_BENCH_SCALE_MODE:-unknown}\`"
            if [[ '${{ inputs.suite }}' == chess ]]; then
              echo "- Reserved CPU capacity: \`${LAPLACE_BENCH_CHESS_RESERVE_CPUS:-unresolved}\`"
              echo '- CPU affinity, quota, admitted thread points, runtime capabilities and measured results are recorded in the chess report.'
            elif [[ '${{ inputs.suite }}' == geometry ]]; then
              echo '- Exact existing GeometryZM payloads: logged COPY plus synchronous commit; complete binary readback measured separately.'
              echo '- Raw storage rows/vertices are not game-recording or native admission throughput.'
            elif [[ '${{ inputs.suite }}' == recorded ]]; then
              echo '- Complete generated games, synchronous writes and exact readback over a duration-qualified wall interval.'
              echo '- Retained-source ingestion and replay remain separately measured workloads.'
            else
              echo "- Scale workers: \`${LAPLACE_BENCH_SCALE_WORKERS:-unknown}\`"
            fi
            echo "- Artifact: \`laplace-benchmark-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\`"
            if [[ -f "$LAPLACE_BENCH_RECEIPT/suite-receipt.json" ]]; then
              echo
              python3 - "$LAPLACE_BENCH_RECEIPT/suite-receipt.json" <<'PY'
          import json, sys
          receipt = json.load(open(sys.argv[1], encoding='utf-8'))
          for item in receipt['results']:
              profile = item['profile']
              result = item['result']
              print(f"### {profile}")
              print()
              if profile == 'core-single':
                  print(f"- codepoints/s: {result['codepoints_per_second']:,.0f}")
                  print(f"- 4-char BPE-equivalent/s: {result['bpe_equivalent_tokens_per_second_4chars']:,.0f}")
                  print(f"- tier-tree nodes/s: {result['tier_tree_nodes_per_second']:,.0f}")
                  print(f"- tier-tree nodes/codepoint: {result['tier_tree_nodes_per_codepoint']:.6f}")
                  print(f"- tier-tree nodes/4-char token-equivalent: {result['tier_tree_nodes_per_bpe_equivalent_token_4chars']:.6f}")
              elif profile in {'core-scale', 'core-scale-streams'}:
                  best = max(result['points'], key=lambda p: p['bpe_equivalent_tokens_per_second_4chars'])
                  print(f"- scaling mode: {result.get('scaling_mode', 'unknown')}")
                  print(f"- best measured workers: {best['workers']}")
                  print(f"- best 4-char BPE-equivalent/s: {best['bpe_equivalent_tokens_per_second_4chars']:,.0f}")
                  print(f"- speedup vs 1 worker: {best['speedup_vs_1_worker']:.3f}x")
                  print(f"- physical cores / allowed logical CPUs: {result['physical_cores']} / {result['allowed_logical_cpus']}")
              elif profile == 'moby-roundtrip':
                  print(f"- codepoints: {result['codepoints']:,}")
                  print(f"- ingest: {result['ingest_milliseconds']:.1f} ms")
                  print(f"- export: {result['export_milliseconds']:.1f} ms")
                  print(f"- bit-perfect: {result['bit_perfect']}")
              elif profile == 'query-forward':
                  binding = result['expected_runtime_binding']
                  print(f"- installed extension matched built version: {binding['extension_version']}")
                  print(f"- execution module: {binding['execution_module']}")
                  print(f"- cases: {len(result['results'])}")
                  for case in result['results']:
                      runs = case['runs']
                      best = min(runs, key=lambda r: r['measured_execution'].get('execution_time', float('inf')))
                      measured = best['measured_execution']
                      trace = best['semantic_receipt_replay']
                      fp = trace['semantic_fingerprint']
                      max_candidates = max((x['max_candidates'] for x in trace['routing_rounds']), default=0)
                      print(
                          f"- {case['case']['id']}: "
                          f"h={case['case']['hops']} f={case['case']['fanout']} "
                          f"server={float(measured.get('execution_time') or 0):.3f} ms "
                          f"trace_rows={trace['trace_rows']} max_candidates={max_candidates} "
                          f"output_count={fp.get('output_count')} disposition={fp.get('disposition')}"
                      )
              elif profile == 'chess-environment':
                  print('- Capability and performance receipt: `chess-environment/report.json`')
                  print('- Resolved executable hashes: `chess-executable-identities.json`')
                  host = result.get('host', {})
                  plan = result.get('plan', {})
                  print(f"- Measured machine: {host.get('hostname', 'unreported')}")
                  print(f"- CPU models: {', '.join(host.get('cpu_models', []))}")
                  print(f"- Effective CPU capacity: {host.get('effective_cpu_capacity', 'unreported')}")
                  print(f"- Cgroup CPU quota: {host.get('cgroup', {}).get('cpu_quota', 'unlimited or unavailable')}")
                  print(f"- Admitted CPU budget: {plan.get('cpu_budget', 'unreported')}")
                  print(f"- Thread points: {plan.get('threads', [])}")
                  print(f"- Hash MiB / concurrency: {plan.get('hash_mib', 'unreported')} / {plan.get('concurrency', 'unreported')}")
                  options = result.get('stockfish_identity', {}).get('uci_options', {})
                  for option_name in ('Threads', 'Hash', 'UCI_Elo', 'SyzygyProbeLimit'):
                      option = options.get(option_name)
                      if option:
                          print(f"- Stockfish {option_name} capability: {option.get('min')}–{option.get('max')}")
                  cute_version = result.get('cutechess_identity', {}).get('version_text', '').splitlines()
                  if cute_version:
                      print(f"- CuteChess runtime: {'; '.join(cute_version[:2])}")
                  nodes = [case.get('steady_nodes_per_second', {}).get('median')
                           for case in result.get('stockfish_bench', []) if case.get('status') == 'complete']
                  plies = [case.get('steady_plies_per_second', {}).get('median')
                           for case in result.get('cutechess_matches', []) if case.get('status') == 'complete']
                  nodes = [value for value in nodes if isinstance(value, (int, float))]
                  plies = [value for value in plies if isinstance(value, (int, float))]
                  if nodes:
                      print(f"- Highest measured median Stockfish steady nodes/s: {max(nodes):,.0f}")
                  if plies:
                      print(f"- Highest measured median tournament steady plies/s: {max(plies):,.2f}")
                  for goal in ('bench_suite_latency', 'search_node_throughput', 'bounded_tournament_throughput'):
                      recommendation = result.get('recommendations', {}).get(goal)
                      if recommendation:
                          print(f"- {goal.replace('_', ' ')}: `{json.dumps(recommendation, sort_keys=True)}`")
              elif profile == 'recorded-chess':
                  window = result.get('sustained', {})
                  print('- Complete recorded workflow receipt: `recorded-chess/receipt.json`')
                  print(f"- Duration-qualified: {window.get('durationQualified', False)}")
                  print(f"- Measured window seconds: {window.get('elapsedSeconds', 'unavailable')}")
                  print(f"- Distinct newly recorded and verified games: {window.get('verifiedRecordedGames', 0)}")
                  print(f"- Complete workflows per second: {window.get('gamesPerSecondSustainedEndToEnd', 'unavailable')}")
                  print(f"- Target met over the complete interval: {result.get('targetMet', False)}")
                  print(f"- Per-day arithmetic extrapolation: {window.get('gamesPerDayExtrapolated', 'unavailable')} (not a day-long observation)")
              if item.get('rapl_energy'):
                  energy = sum(x['energy_uj'] for x in item['rapl_energy']) / 1e6
                  print(f"- summed RAPL-domain energy: {energy:.3f} J (not wall energy; domains may overlap)")
              print()
          PY
            fi
            if [[ -f "$LAPLACE_BENCH_RECEIPT/chess-environment/report.md" ]]; then
              echo
              cat "$LAPLACE_BENCH_RECEIPT/chess-environment/report.md"
            fi
            if [[ -f "$LAPLACE_BENCH_RECEIPT/chess-readiness-execution.json" ]]; then
              echo
              python3 - "$LAPLACE_BENCH_RECEIPT" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          execution = json.loads((root / 'chess-readiness-execution.json').read_text())
          report = json.loads((root / 'chess-dependency-readiness.json').read_text())
          print('### Installed chess functionality')
          print()
          print(f"- Required executable/latest-release checks passed: {execution['required_checks_passed']}")
          for check in report.get('checks', []):
              print(f"- {check['name']}: {check['status']} ({'required' if check['required'] else 'optional'})")
              if check['name'] == 'syzygy' and isinstance(check.get('detail'), dict):
                  print(f"- Tablebase verification: {check['detail'].get('verification', 'unreported')}")
          status_path = root / 'chess-lichess-readiness.json'
          if status_path.is_file():
              online = json.loads(status_path.read_text())
              print(f"- Lichess service/account snapshot: {online['status']} (optional; HTTP {online.get('http_status', 'unavailable')})")
              for key in ('configured', 'running', 'connected'):
                  print(f"- Lichess {key}: {online.get('service', {}).get(key, 'unverified')}")
              account = online.get('account', {})
              for key in ('tokenValid', 'botAccount', 'botPlayScope', 'ready'):
                  print(f"- Lichess {key}: {account.get(key, 'unverified')}")
          print('- Optional missing data and unverified account access remain visible in the readiness receipts.')
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Seal evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$LAPLACE_BENCH_RECEIPT"
          find "$out" -type f -printf '%P\n' | sort > "$out/manifest.txt"
          while IFS= read -r relative; do
            [[ "$relative" != artifact-sha256.txt ]] || continue
            sha256sum "$out/$relative"
          done < "$out/manifest.txt" > "$out/artifact-sha256.txt"

      - name: Upload complete benchmark evidence
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/laplace-benchmark-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90

      - name: Require installed chess tools and verified release checks
        if: ${{ !cancelled() && inputs.suite == 'chess' && steps.chess_readiness.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::error::Required chess dependency checks failed; inspect chess-dependency-readiness.json and chess-readiness-execution.json in the uploaded evidence.'
          exit 1

  acceptance:
    name: Installed chess — complete explicit acceptance
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/verify/chess-acceptance-')) || inputs.suite == 'acceptance'
    runs-on: [self-hosted, laplace]
    timeout-minutes: 600
    steps:
      - name: Create acceptance evidence directory
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/laplace-chess-acceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$receipt"
          printf 'LAPLACE_BENCH_RECEIPT=%s\n' "$receipt" >> "$GITHUB_ENV"

      - name: Resolve exact acceptance revision
        shell: bash
        env:
          TRIGGER_SHA: ${{ github.sha }}
          REQUESTED_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          target="${REQUESTED_REF:-$TRIGGER_SHA}"
          git fetch --no-tags --prune origin "$target"
          resolved="$(git rev-parse FETCH_HEAD)"
          git checkout --force "$resolved"
          printf 'LAPLACE_BENCH_SHA=%s\n' "$resolved" >> "$GITHUB_ENV"
          printf 'requested_ref=%s\nresolved_sha=%s\n' "$target" "$resolved" \
            > "$LAPLACE_BENCH_RECEIPT/request.env"

      - name: Execute complete installed chess acceptance
        id: chess_acceptance
        shell: bash
        env:
          LAPLACE_LICHESS_STATUS_BASE: ${{ vars.LAPLACE_LICHESS_STATUS_BASE || 'http://127.0.0.1:5189' }}
        run: |
          set -euo pipefail
          umask 0002
          mkdir -p /build/laplace/work
          export TMPDIR=/build/laplace/work TMP=/build/laplace/work TEMP=/build/laplace/work
          export PATH="$LAPLACE_PG_PREFIX/bin:$PATH"
          # One lock spans provisioning, source/runtime binding and every measured
          # interval. Independent failures retain their own receipts.
          flock --exclusive --close /build/laplace/work/host-resource.lock \
            python3 scripts/accept-chess-environment.py \
              --prefix "$LAPLACE_INSTALL_PREFIX" --work /build/laplace/work \
              --output-dir "$LAPLACE_BENCH_RECEIPT/acceptance" \
            2>&1 | tee "$LAPLACE_BENCH_RECEIPT/acceptance.log"

      - name: Seal acceptance evidence and summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["LAPLACE_BENCH_RECEIPT"])
          manifest = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name in ("selection.private.json", "artifact-sha256.json"):
                  continue
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1 << 20), b""):
                      digest.update(chunk)
              manifest.append({"path": str(path.relative_to(root)), "bytes": path.stat().st_size,
                               "sha256": digest.hexdigest()})
          (root / "artifact-sha256.json").write_text(json.dumps(manifest, indent=2) + "\n")
          receipt = root / "acceptance/receipt.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Explicit installed chess acceptance\n\n")
              summary.write("Source: " + os.environ.get("LAPLACE_BENCH_SHA", "unresolved") + "\n\n")
              if receipt.is_file():
                  proof = json.loads(receipt.read_text())
                  summary.write("Acceptance status: " + proof["status"] + "\n\n")
                  for phase in proof["phases"]:
                      summary.write("- " + phase["name"] + ": " + phase["status"] + "\n")
              else:
                  summary.write("No completed acceptance receipt; inspect failure logs.\n")
              summary.write("\nComplete workflow rates and prepared-corpus admission rates use separate receipts. "
                            "Geometry rows and retained replay rates remain separate. "
                            "Current service response latency is not cold boot time.\n")
          PY

      - name: Upload complete chess acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-chess-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/laplace-chess-acceptance-${{ github.run_id }}-${{ github.run_attempt }}/
            !${{ runner.temp }}/laplace-chess-acceptance-${{ github.run_id }}-${{ github.run_attempt }}/**/selection.private.json
          if-no-files-found: error
          retention-days: 90
