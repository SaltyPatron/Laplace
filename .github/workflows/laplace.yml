name: Laplace — product lifecycle

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "product lifecycle stage"
        type: choice
        required: true
        default: all
        options: [check, build, test, deploy, integrate, all, application-check, applications]
      full_clean:
        description: "wipe build/ before building"
        type: boolean
        default: false
      force_codegen:
        description: "ignore attestation-law stamp"
        type: boolean
        default: false
      fresh_db:
        description: "recreate DB structure/runtime; does not seed by itself"
        type: boolean
        default: false
      restore_foundation:
        description: "after database work, restore missing canonical foundation (can take hours)"
        type: boolean
        default: false
      serial_tests:
        description: "force serial ctest/regress"
        type: boolean
        default: false
      force_all:
        description: "ignore content-fingerprint stamps"
        type: boolean
        default: false
      generation_benchmark:
        description: "run the expensive generation benchmark"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: laplace-substrate-lifecycle
  cancel-in-progress: false

env:
  LAPLACE_EXTERNAL: ${{ vars.LAPLACE_EXTERNAL || '/build/external' }}
  LAPLACE_INSTALL_PREFIX: ${{ vars.LAPLACE_INSTALL_PREFIX || '/opt/laplace' }}
  LAPLACE_PG_PREFIX: ${{ vars.LAPLACE_PG_PREFIX || '/opt/laplace/pgsql-18' }}
  PGHOST: /var/run/postgresql
  PGPORT: 5432
  PGUSER: laplace_admin
  PGDATABASE: laplace
  LAPLACE_DATA_ROOT: /vault/Data
  LAPLACE_FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all && '1' || '' }}
  LAPLACE_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'all' }}
  LAPLACE_FULL_CLEAN: ${{ github.event_name == 'workflow_dispatch' && inputs.full_clean && '1' || '' }}
  LAPLACE_FORCE_CODEGEN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_codegen && '1' || '' }}
  LAPLACE_FRESH_DB: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh_db && '1' || '' }}
  LAPLACE_RESTORE_FOUNDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_foundation && '1' || '' }}
  LAPLACE_TEST_SERIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.serial_tests && '1' || '' }}
  LAPLACE_GENERATION_BENCHMARK: ${{ github.event_name == 'workflow_dispatch' && inputs.generation_benchmark && '1' || '' }}
  LICHESS_API: ${{ secrets.LICHESS_API }}
  LAPLACE_MCP_TOKEN: ${{ secrets.LAPLACE_MCP_TOKEN }}
  LAPLACE_OPERATOR_TOKEN: ${{ secrets.LAPLACE_OPERATOR_TOKEN }}
  STRIPE_API_SECRET: ${{ secrets.STRIPE_API_SECRET }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
  STRIPE_API_Publishable: ${{ vars.STRIPE_API_PUBLISHABLE }}

jobs:
  product:
    name: Product — prove, activate and verify
    runs-on: [self-hosted, laplace]
    timeout-minutes: 420
    # This job releases the workspace before the dependent reusable benchmark
    # acquires it. The workflow-level lifecycle lock remains a different group.
    concurrency:
      group: laplace-shared-workspace
      cancel-in-progress: false
    outputs:
      chess_benchmark_ready: ${{ steps.chess_benchmark_gate.outputs.ready }}
      activated_ref: ${{ steps.chess_benchmark_gate.outputs.source_sha }}
    steps:
      - name: Checkout exact revision without discarding persistent build cache
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --prune --depth=2 origin "$TARGET_SHA"
          git checkout --force "$TARGET_SHA"

      - uses: ./.github/actions/setup-laplace-env

      - name: Classify source-only change
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fast=1
          verify_recursive=0
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            fast=0
          else
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA" || true
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                scripts/prove-*|scripts/test-live-recursive-proof-gate.py)
                  verify_recursive=1
                  ;;
                docs/*|.github/*|scripts/test-*|scripts/check-*|scripts/ci-*|scripts/actions-audit.py|scripts/test-profiles.json|scripts/benchmark-profiles.json|scripts/product-ci.sh)
                  ;;
                *)
                  fast=0
                  ;;
              esac
            done < <(git diff --name-only "$BEFORE_SHA" "$TARGET_SHA")
          fi
          echo "LAPLACE_FAST_ONLY=$fast" >> "$GITHUB_ENV"
          echo "LAPLACE_VERIFY_RECURSIVE_PROOF=$verify_recursive" >> "$GITHUB_ENV"
          echo "change classification: fast_only=$fast verify_recursive=$verify_recursive"

      - name: Fast source/tooling proof and installed-product reconciliation
        if: env.LAPLACE_FAST_ONLY == '1'
        run: |
          set -euo pipefail
          umask 0002
          mkdir -p /build/laplace/work
          # Both repositories deploy on this host; GitHub concurrency is scoped
          # to one repository. Do not pass the lock descriptor to service children.
          flock --exclusive --close /build/laplace/work/host-resource.lock \
            bash scripts/product-ci.sh reconcile

      - name: Verify changed recursive proof against the live product
        if: env.LAPLACE_FAST_ONLY == '1' && env.LAPLACE_VERIFY_RECURSIVE_PROOF == '1'
        run: |
          set -euo pipefail
          umask 0002
          mkdir -p /build/laplace/work
          flock --exclusive --close /build/laplace/work/host-resource.lock \
            python3 scripts/prove-live-recursive-substrate.py "${PGDATABASE:-laplace}"

      - name: Run full product lifecycle
        if: env.LAPLACE_FAST_ONLY != '1'
        run: |
          set -euo pipefail
          umask 0002
          mkdir -p /build/laplace/work
          # Hold the host lock through source builds, activation and verification;
          # release it before the dependent chess measurement job can start.
          flock --exclusive --close /build/laplace/work/host-resource.lock \
            bash scripts/product-ci.sh "$LAPLACE_STAGE"

      - name: Retain current generation repair resource receipts
        if: always()
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          python3 scripts/collect-legacy-repair-evidence.py \
            --expected-source "$TARGET_SHA" \
            --output "/build/laplace/work/legacy-repair-evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Upload current generation repair metadata
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-legacy-repair-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: /build/laplace/work/legacy-repair-evidence/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30

      - name: Record successful activation for installed chess measurement
        id: chess_benchmark_gate
        if: env.LAPLACE_FAST_ONLY != '1' && (env.LAPLACE_STAGE == 'all' || env.LAPLACE_STAGE == 'deploy' || env.LAPLACE_STAGE == 'applications')
        shell: bash
        run: |
          set -euo pipefail
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Retain bounded live recursive proof counterexamples
        if: always()
        env:
          TARGET_SHA: ${{ github.sha }}
          PROOF_OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          evidence="/build/laplace/work/recursive-proof-evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-product"
          args=(
            --checkout "$GITHUB_WORKSPACE"
            --output "$evidence"
            --expected-source "$TARGET_SHA"
            --proof-outcome "$PROOF_OUTCOME"
          )
          if [[ -n "${LAPLACE_BUILD_DIRECTORY:-}" ]]; then
            args+=(--build-directory "$LAPLACE_BUILD_DIRECTORY")
          fi
          python3 scripts/collect-recursive-proof-evidence.py "${args[@]}"
          flock --exclusive --close /build/laplace/work/host-resource.lock \
            python3 scripts/inspect-recursive-proof-counterexamples.py \
              --collection "$evidence" --expected-source "$TARGET_SHA"

      - name: Upload retained live recursive proof diagnostics
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-recursive-proof-${{ github.run_id }}-${{ github.run_attempt }}-product
          path: /build/laplace/work/recursive-proof-evidence/${{ github.run_id }}-${{ github.run_attempt }}-product/
          if-no-files-found: error
          retention-days: 30

  chess_environment:
    name: Activated host — chess capabilities and performance
    needs: product
    if: needs.product.result == 'success' && needs.product.outputs.chess_benchmark_ready == 'true'
    uses: ./.github/workflows/benchmark-evidence.yml
    with:
      target_ref: ${{ needs.product.outputs.activated_ref }}
      suite: chess
      repeats: "3"
      reserve_logical_cpus: "2"
      allow_saturation: false
