name: Repository hygiene
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tracked-tree:
    name: Tracked tree contains no local/runtime artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - run: python3 scripts/repo-hygiene-gate.py
  integrated-branches:
    name: Materialize reviewed source consolidation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: repository-branch-consolidation
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Publish verified source objects with unchanged workflow files
        shell: bash
        run: |
          python3 - <<'PYTREE'
          import hashlib, json, os, pathlib, subprocess, tempfile
          def git(*args, data=None, env=None):
              result = subprocess.run(['git', *args], input=data, text=True, capture_output=True, timeout=180, env=env)
              if result.returncode:
                  raise RuntimeError(f'{args[0]} failed: {result.stderr[-3000:]}')
              return result.stdout.strip()
          git('fetch', 'origin', '+refs/heads/*:refs/remotes/origin/*', '+refs/pull/*/head:refs/recovery/pulls/*')
          previous = git('show', '79de57897d10d7f5c6da5c829bc624b2cf326091:.github/workflows/repo-hygiene.yml')
          raw = previous.split("PLAN_JSON = r'''",1)[1].split("'''",1)[0]
          plan = json.loads(raw)
          corrected = {
              'scripts/place-build-directory.py':'2fdc5c47fdec5fdc86e8527f3c5c39e3da204b04',
              'scripts/postgresql-release.py':'a384a4d476b7cc3a21ff842ed0647b3c16e41684',
              'scripts/provision-cmake.py':'c54cc2971fc07181e2e2c946ea812c1e3379c140',
              'scripts/provision-cutechess.py':'7eb283f2200a97bd28fde0b7d5e902406a289b36',
          }
          for entry in plan['entries']:
              if entry['path'] in corrected:
                  entry['sha'] = corrected[entry['path']]
              if entry['path'] == 'scripts/test-postgresql-release.py':
                  wrapped = '+        cmake_spec = importlib.util.spec_from_file_location(\n+            "cmake_fixture_owner", project / "scripts/provision-cmake.py")'
                  unwrapped = '+        cmake_spec = importlib.util.spec_from_file_location("cmake_fixture_owner", project / "scripts/provision-cmake.py")'
                  if entry['patch'].count(wrapped) != 1:
                      raise RuntimeError('Unexpected PostgreSQL transfer patch')
                  entry['patch'] = entry['patch'].replace(wrapped, unwrapped)
          canonical = (json.dumps(plan,separators=(',',':'))+'\n').encode()
          if hashlib.sha256(canonical).hexdigest() != 'b60448db7b7491670487deace27e321a970fb340d5ace82e702b22ac83c9ce3d':
              raise RuntimeError('Full plan data differs from the locally verified source manifest')
          current = git('rev-parse','refs/remotes/origin/main')
          changed = git('diff','--name-only',plan['base'],current).splitlines()
          if set(changed)-{'.github/workflows/repo-hygiene.yml'}:
              raise RuntimeError('Concurrent main source changes require reconciliation: '+repr(changed))
          fd,index=tempfile.mkstemp(prefix='reviewed-tree-',dir=os.environ['RUNNER_TEMP'])
          os.close(fd);os.unlink(index)
          env=dict(os.environ,GIT_INDEX_FILE=index)
          try:
              git('read-tree',plan['base'],env=env)
              for entry in plan['entries']:
                  path,sha,mode=entry['path'],entry['sha'],entry['mode']
                  if 'patch' in entry:
                      git('update-index','--add','--cacheinfo',mode,entry['basis'],path,env=env)
                      git('apply','--cached','--unidiff-zero','--whitespace=nowarn','-',data=entry['patch'],env=env)
                      if git('rev-parse',':'+path,env=env)!=sha:
                          raise RuntimeError('Patched blob differs: '+path)
                  else:
                      git('cat-file','-e',sha)
                  git('update-index','--add','--cacheinfo',mode,sha,path,env=env)
              reviewed=git('write-tree',env=env)
              if reviewed!='e0d8adb6c796e694150a3a09dbdf9f22e57ff389':
                  raise RuntimeError('Complete source tree differs from reviewed tree')
              # This token publishes source objects only, never workflow changes.
              workflow='.github/workflows/repo-hygiene.yml'
              current_workflow=git('rev-parse',current+':'+workflow)
              git('update-index','--add','--cacheinfo','100644',current_workflow,workflow,env=env)
              carrier_tree=git('write-tree',env=env)
              if git('diff','--name-only',current,carrier_tree,'--','.github/workflows'):
                  raise RuntimeError('Source carrier unexpectedly changes a workflow')
              git('config','user.name','GitHub Actions source consolidation')
              git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              commit=git('commit-tree',carrier_tree,'-p',current,data='Preserve exact reviewed source objects for connector integration\n\nWorkflow files are unchanged. Main is not moved. Reviewed final tree: '+reviewed+'\n')
              tag='branch-integration/staged-'+reviewed
              if git('ls-remote','origin','refs/tags/'+tag+'^{}'):
                  raise RuntimeError('Exact-tree carrier already exists; do not replace it')
              git('tag','-a',tag,commit,'-m','Verified source carrier; restore the existing cleanup workflow through the authorized connector before main integration.')
              git('push','origin','refs/tags/'+tag)
              if git('ls-remote','origin','refs/tags/'+tag+'^{}').split()[0]!=commit:
                  raise RuntimeError('Candidate readback failed')
              print('REVIEWED_INTEGRATION '+json.dumps({'base':current,'commit':commit,'carrier_tree':carrier_tree,'reviewed_tree':reviewed,'tag':tag,'files':len(plan['entries'])}),flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
                  summary.write(f'\nVerified source carrier `{commit}`, tree `{carrier_tree}`; reviewed final tree `{reviewed}`. Main not moved.\n')
          finally:
              pathlib.Path(index).unlink(missing_ok=True)
          PYTREE
