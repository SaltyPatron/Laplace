<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:687px;height:964px;background:#FAFCFF;" width="687px" height="964px" viewBox="0 0 687 964" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="687" height="964" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="8"><text x="134.802" y="34.533" fill="#000" font-size="14" textLength="415.816" font-weight="700">Conventional — validation counting and inactive module entry</text></g><ellipse cx="249.137" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="95.063" y="142.527" width="308.146" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="105.063" y="164.984" fill="#000" font-size="12" textLength="288.146">Imports run and main is defined; no main guard calls it</text><ellipse cx="249.137" cy="216.574" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="249.137" cy="216.574" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="162.92,93.609,335.354,93.609,347.354,105.609,335.354,117.609,162.92,117.609,150.92,105.609,162.92,93.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="253.137" y="129.028" fill="#000" font-size="11" textLength="17.118">yes</text><text x="162.92" y="110.11" fill="#000" font-size="11" textLength="172.434">Executed as python -m ...evaluate?</text><rect x="115.091" y="269.574" width="268.092" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="125.091" y="292.031" fill="#000" font-size="12" textLength="248.092">Explicit caller invokes main(); parse arguments</text><rect x="44.371" y="324.668" width="409.531" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="54.371" y="347.125" fill="#000" font-size="12" textLength="389.531">Load pretrained causal LM; choose eligible CUDA or CPU; set eval mode</text><rect x="16" y="379.762" width="466.273" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="402.219" fill="#000" font-size="12" textLength="446.273">Read dataset dtype; make validation TokenShardDataset and batch-size-one loader</text><rect x="73.712" y="434.855" width="350.85" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="83.712" y="457.313" fill="#000" font-size="12" textLength="330.85">Initialize loss sum and token counter to zero; disable gradients</text><rect x="133.413" y="546.868" width="231.447" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="143.413" y="569.325" fill="#000" font-size="12" textLength="211.447">Move tensors to device; evaluate model</text><rect x="87.367" y="601.962" width="323.539" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="97.367" y="624.419" fill="#000" font-size="12" textLength="303.539">Count all label elements, including padded ignored labels</text><rect x="134.093" y="657.056" width="230.088" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="144.093" y="679.513" fill="#000" font-size="12" textLength="210.088">Accumulate model loss times this count</text><polygon points="134.786,489.949,363.487,489.949,375.487,501.949,363.487,513.949,134.786,513.949,122.786,501.949,134.786,489.949" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="253.137" y="525.368" fill="#000" font-size="11" textLength="17.118">yes</text><text x="134.786" y="506.45" fill="#000" font-size="11" textLength="228.701">Batch available and index below max batches?</text><text x="98.315" y="499.532" fill="#000" font-size="11" textLength="24.471">done</text><rect x="151.932" y="734.149" width="194.41" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="161.932" y="756.606" fill="#000" font-size="12" textLength="174.41">NLL = sum / max(token count, 1)</text><path d="M383.853,779.243 L383.853,804.771 L363.853,808.771 L383.853,812.771 L383.853,838.298 A0,0 0 0 0 383.853,838.298 L666.42,838.298 A0,0 0 0 0 666.42,838.298 L666.42,789.243 L656.42,779.243 L383.853,779.243 A0,0 0 0 0 383.853,779.243" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M656.42,779.243 L656.42,789.243 L666.42,789.243 L656.42,779.243" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="389.853" y="797.738" fill="#000" font-size="13" textLength="261.568">Empty stream or nonpositive batch cap yields</text><text x="389.853" y="814.09" fill="#000" font-size="13" textLength="218.95">zero tokens, NLL zero, perplexity one.</text><text x="389.853" y="830.441" fill="#000" font-size="13" textLength="228.351">The count is not valid prediction tokens.</text><rect x="134.421" y="791.224" width="229.432" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="144.421" y="813.681" fill="#000" font-size="12" textLength="209.432">Print count, NLL and exp(min(NLL, 50))</text><ellipse cx="249.137" cy="869.298" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="249.137" cy="869.298" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="249.137" y1="177.621" x2="249.137" y2="205.574" style="stroke:#181818;stroke-width:1;"/><polygon points="245.137,195.574,249.137,205.574,253.137,195.574,249.137,199.574" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="249.137" y1="117.609" x2="249.137" y2="142.527" st