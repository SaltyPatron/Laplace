name: Seed — chess

# The chess modality as its own phase. Each choice is a distinct decomposer, one
# per run (no bucket):
#   chess        — PGN games: record (ChessPgn) + substrate analyze pass
#   chess-analyze — rederive the calculated ChessAnalysis layer from recorded playings;
#                  no path, source-scoped eviction is supported for version recovery
#   openings     — opening book (ChessOpenings)
#   chess-books  — annotated chess books (ChessBook): record + derive in one pass
#   chess-syzygy — ingest Syzygy packaging (.rtbw/.rtbz) as position-grain HAS_WDL/HAS_DTZ
#                  substrate records (ChessSyzygy). Corpus syzygy-tablebase supplies the
#                  directory; empty/missing tables = documented no-op.
#   chess-trajectory — game-trajectory geometry backfill (ChessTrajectory). No path;
#                  physicality upserts only, never testimony, so re-runs cannot
#                  double-count. Both were reachable from `laplace ingest` and from
#                  IngestDispatchTable but from no workflow at all.
#   chess-opening-match — names each line's opening by BOARD IDENTITY against the
#                  ingested catalog (ChessOpeningMatch). No path; needs `openings`
#                  ingested first. Additive third witness, never a re-derivation.
#   chess-eval   — stockfish eval census over recorded games (ChessStockfish): the
#                  calculated eval layer is DERIVED STATE — this step is what makes it
#                  survive a db-reset, exactly like every other seed re-derives its
#                  layer. No path (the substrate is the source); marker-gated, so
#                  re-runs skip already-evaluated games.
# Corpus sources take an explicit corpus dir (no DATA_ROOT default); substrate passes take none.
# Delegates to _ingest.yml. Every source is registered in decomposer-gates.json,
# so the run is gated on the consensus cells and on re-ingest idempotency, not on the
# ingest exit code.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "chess source (one per run)"
        type: choice
        required: true
        options: [chess, openings, chess-books, chess-analyze, chess-eval, chess-move-outcomes, chess-syzygy, chess-trajectory, chess-opening-match]
      corpus:
        # Dropdown over what is actually on the runner. The chess corpus is
        # static (same filenames on re-download), so a literal list is durable;
        # GitHub cannot enumerate a directory at dispatch time. `path-override`
        # is the escape hatch, and chess-eval ignores this entirely (it reads
        # the substrate, not a file).
        # Default is the ELO-2400 cut: one file, the strongest games, the best
        # quality-per-byte in the corpus. Everything larger is a deliberate
        # operator choice, because a seed run holds the one-ingest lock.
        description: "which corpus (ignored for substrate-sourced passes)"
        type: choice
        required: true
        default: lumbras-elite
        options:
          - lumbras-elite       # 751 MB — ELO 2400+ cut. BEST QUALITY-PER-BYTE; start here.
          - chesscom-all        # ~600 MB — every top-level *_chesscom.pgn (non-recursive)
          - magnus              # 28 MB  — MagnusCarlsen_chesscom.pgn
          - hikaru              # 195 MB — Hikaru_chesscom.pgn
          - firouzja            # 109 MB — Firouzja2003_chesscom.pgn
          - nihalsarin          # 164 MB — nihalsarin_chesscom.pgn
          - caruana             # 21 MB
          - gukesh              # 16 MB
          - pragg               # 28 MB
          - anish-giri
          - owner-games         # Anthony-Hart_chesscom.pgn
          - twic                # 242 MB — The Week In Chess weekly archives
          - lumbras-otb         # 8.0 GB — OTB 1900→2026. Slice it with `slice`.
          - lumbras-online      # 5.8 GB — online 1995→2025. Slice it with `slice`.
          - openings-book       # openings/ — ECO tsv (use with source=openings)
          - syzygy-tablebase    # syzygy/ — endgame tablebases
          - books               # the DOCUMENT corpus, for source=chess-books.
                                # A chess manual is a book like any other and lives with
                                # the rest of them; ChessBook is a SECOND witness over the
                                # same files that extracts the games it can replay. Ingest
                                # them as documents too (seed-documents) — same content,
                                # two witnesses, which is what the substrate is for.
          - path-override       # use the `path` input below
      slice:
        # Second dropdown: which era-file inside lumbras-otb / lumbras-online.
        # GitHub has no dependent dropdowns, so this is independent and is
        # IGNORED (with a notice) for every other corpus. `all` ingests the
        # whole directory — hours, and a single run per the one-ingest rule.
        description: "era slice — only used when corpus = lumbras-otb / lumbras-online"
        type: choice
        required: false
        default: all
        options:
          - all
          - otb-1900-1949
          - otb-1950-1969
          - otb-1970-1989
          - otb-1990-1999
          - otb-2000-2004
          - otb-2005-2009
          - otb-2010-2014
          - otb-2015-2019
          - otb-2020-2024
          - otb-2025
          - otb-2026-partial
          - online-1995-2009
          - online-2010-2014
          - online-2015-2019
          - online-2020
          - online-2021
          - online-2022
          - online-2023
          - online-2024
          - online-2025
      path:
        description: "explicit path, used only when corpus = path-override"
        type: string
        required: false
        default: ""
      database:
        description: "target DB (one database: laplace)"
        type: choice
        options: [laplace]
        default: laplace
      evict_before_ingest:
        description: "retract this source before a full rederive (requires exact confirmation)"
        type: boolean
        required: false
        default: false
      evict_confirm:
        description: "exact decomposer source name; ChessAnalysis for chess-analyze"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Resolve the dropdown to a path. Safe by construction: ChessPgnDecomposer is
  # TopDirectoryOnly unless `--recursive` is passed (ChessPgnDecomposer.cs:15-21),
  # so `chesscom-all` picks up the top-level player archives and does NOT descend
  # into Lumbras/, twic/, syzygy/ or openings/. Each of those is its own option.
  resolve:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 2
    outputs:
      path: ${{ steps.pick.outputs.path }}
    steps:
      - id: pick
        run: |
          root="${LAPLACE_DATA_ROOT:-/vault/Data}"
          chess="$root/Games/Chess"
          lum="$chess/Lumbras"
          slice="${{ inputs.slice }}"
          src="${{ inputs.source }}"
          corpus="${{ inputs.corpus }}"

          # SOURCE DECIDES WHICH CORPORA ARE LEGAL. GitHub has no dependent
          # dropdowns, so `source` and `corpus` are independent inputs and a
          # user can pair a TSV decomposer with a PGN file. That is not
          # hypothetical: run 30751844265 selected source=openings and left
          # corpus at its default (lumbras-elite), which resolved to
          # export_ELO2400.pgn -- a PGN handed to the openings TSV reader.
          # It declared 19,308,489 input units, ingested 0, and only failed
          # because the decomposer has a silent-no-op guard. Without that
          # guard it would have reported success having stored nothing.
          #
          # So: each source declares its legal corpora. A source with exactly
          # ONE legal corpus auto-corrects (with a notice) rather than making
          # the operator match two dropdowns by hand -- that is the whole
          # point of running this from the UI. A source with MANY legal
          # corpora fails loudly and prints them, because there the choice is
          # real and guessing would be wrong.
          pgn_corpora="lumbras-elite chesscom-all magnus hikaru firouzja nihalsarin caruana gukesh pragg anish-giri owner-games twic lumbras-otb lumbras-online path-override"
          case "$src" in
            chess)       legal="$pgn_corpora" ;;
            openings)    legal="openings-book path-override" ;;
            chess-books) legal="books path-override" ;;
            chess-analyze|chess-eval|chess-move-outcomes|chess-trajectory|chess-opening-match)
                          legal="" ;;   # read the substrate; no path at all
            chess-syzygy) legal="syzygy-tablebase path-override" ;;
            *) echo "::error::unknown source '$src'"; exit 1 ;;
          esac

          if [ -n "$legal" ]; then
            ok=0
            for c in $legal; do [ "$corpus" = "$c" ] && ok=1; done
            if [ "$ok" -eq 0 ]; then
              # shellcheck disable=SC2086
              set -- $legal
              if [ "$#" -eq 2 ] && [ "$2" = "path-override" ]; then
                echo "::notice::corpus '$corpus' is not valid for source '$src' — using '$1', the only corpus this source reads."
                corpus="$1"
              else
                echo "::error::corpus '$corpus' is not valid for source '$src'. Valid: $legal"
                exit 1
              fi
            fi
          fi

          # Substrate-sourced passes consume recorded playings, not packaging.
          # Resolve them before explicit-path handling so an irrelevant path cannot
          # defeat source-scoped eviction or accidentally become an ingest scope.
          case "$src" in
            chess-analyze|chess-eval|chess-move-outcomes|chess-trajectory|chess-opening-match)
              [ -n "${{ inputs.path }}" ] && \
                echo "::notice::source '$src' reads the substrate — path input ignored"
              echo "source=$src reads the substrate — corpus ignored, no path passed"
              echo "path=" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac

          # Era slice -> the unpacked PGN under Lumbras/otb or Lumbras/online.
          # The .7z siblings are the originals; the unpacked dirs are what the
          # PGN lane reads.
          slice_file() {
            case "$1" in
              otb-1900-1949)    echo "$lum/otb/LumbrasGigaBase_OTB_1900-1949.pgn" ;;
              otb-1950-1969)    echo "$lum/otb/LumbrasGigaBase_OTB_1950-1969.pgn" ;;
              otb-1970-1989)    echo "$lum/otb/LumbrasGigaBase_OTB_1970-1989.pgn" ;;
              otb-1990-1999)    echo "$lum/otb/LumbrasGigaBase_OTB_1990-1999.pgn" ;;
              otb-2000-2004)    echo "$lum/otb/LumbrasGigaBase_OTB_2000-2004.pgn" ;;
              otb-2005-2009)    echo "$lum/otb/LumbrasGigaBase_OTB_2005-2009.pgn" ;;
              otb-2010-2014)    echo "$lum/otb/LumbrasGigaBase_OTB_2010-2014.pgn" ;;
              otb-2015-2019)    echo "$lum/otb/LumbrasGigaBase_OTB_2015-2019.pgn" ;;
              otb-2020-2024)    echo "$lum/otb/LumbrasGigaBase_OTB_2020-2024.pgn" ;;
              otb-2025)         echo "$lum/otb/LumbrasGigaBase_OTB_2025.pgn" ;;
              otb-2026-partial) echo "$lum/otb/LumbrasGigaBase_OTB_2026_partial_release.pgn" ;;
              online-1995-2009) echo "$lum/online/LumbrasGigaBase_Online_1995-2009.pgn" ;;
              online-2010-2014) echo "$lum/online/LumbrasGigaBase_Online_2010-2014.pgn" ;;
              online-2015-2019) echo "$lum/online/LumbrasGigaBase_Online_2015-2019.pgn" ;;
              online-2020)      echo "$lum/online/LumbrasGigaBase_Online_2020.pgn" ;;
              online-2021)      echo "$lum/online/LumbrasGigaBase_Online_2021.pgn" ;;
              online-2022)      echo "$lum/online/LumbrasGigaBase_Online_2022.pgn" ;;
              online-2023)      echo "$lum/online/LumbrasGigaBase_Online_2023.pgn" ;;
              online-2024)      echo "$lum/online/LumbrasGigaBase_Online_2024.pgn" ;;
              online-2025)      echo "$lum/online/LumbrasGigaBase_Online_2025.pgn" ;;
              *) echo "" ;;
            esac
          }

          # An explicit path WINS over the corpus dropdown, and says so.
          # Same defect as seed-documents.yml carried until 2026-08-10: `path`
          # was read ONLY under corpus=path-override, so setting a path while
          # leaving corpus at its default silently ingested the default corpus
          # instead -- no notice, no warning, no error. Here the blast radius is
          # larger: the default corpora are multi-GB PGN sets, so a discarded
          # path means hours of ingest against the wrong games. seed-code.yml
          # had the correct precedence all along.
          user_path="${{ inputs.path }}"
          if [ -n "$user_path" ]; then
            if [ ! -e "$user_path" ]; then
              echo "::error::path '$user_path' does not exist on this runner"; exit 1
            fi
            if [ "$corpus" != "path-override" ]; then
              echo "::notice::path given -- corpus '$corpus' ignored for this run."
            fi
            echo "resolved explicit path -> $user_path"
            echo "path=$user_path" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$corpus" in
            lumbras-elite)    p="$lum/pgn/export_ELO2400.pgn" ;;
            chesscom-all)     p="$chess" ;;
            magnus)           p="$chess/MagnusCarlsen_chesscom.pgn" ;;
            hikaru)           p="$chess/Hikaru_chesscom.pgn" ;;
            firouzja)         p="$chess/Firouzja2003_chesscom.pgn" ;;
            nihalsarin)       p="$chess/nihalsarin_chesscom.pgn" ;;
            caruana)          p="$chess/FabianoCaruana_chesscom.pgn" ;;
            gukesh)           p="$chess/GukeshDommaraju_chesscom.pgn" ;;
            pragg)            p="$chess/rpragchess_chesscom.pgn" ;;
            anish-giri)       p="$chess/AnishGiri_chesscom.pgn" ;;
            owner-games)      p="$chess/Anthony-Hart_chesscom.pgn" ;;
            twic)             p="$chess/twic" ;;
            openings-book)    p="$chess/openings" ;;
            syzygy-tablebase)
              p="$chess/syzygy"
              if [ -d "$p/3-4-5" ] && ls "$p/3-4-5"/*.rtbw >/dev/null 2>&1; then
                p="$p/3-4-5"
              fi ;;
            books)            p="$root/test-data/text" ;;
            path-override)    p="${{ inputs.path }}" ;;
            lumbras-otb|lumbras-online)
              venue="$corpus"; venue="${venue#lumbras-}"
              if [ "$slice" = "all" ]; then
                p="$lum/$venue"
              else
                # Guard the independent-dropdown hazard: an otb-* slice with
                # lumbras-online (or vice versa) silently ingests the wrong era.
                case "$slice" in
                  "$venue"-*) : ;;
                  *) echo "::error::slice '$slice' does not belong to corpus '$corpus'"; exit 1 ;;
                esac
                p="$(slice_file "$slice")"
                [ -n "$p" ] || { echo "::error::unmapped slice '$slice'"; exit 1; }
              fi ;;
            *) echo "::error::unknown corpus '$corpus'"; exit 1 ;;
          esac

          case "$corpus" in
            lumbras-otb|lumbras-online) : ;;
            *) [ "$slice" = "all" ] || echo "::notice::slice '$slice' ignored for corpus '$corpus'" ;;
          esac
          # chess-syzygy consumes the packaging directory rather than the substrate.
          case "$src" in
            chess-syzygy)
              if [ "$corpus" = "syzygy-tablebase" ] || [ "$corpus" = "path-override" ]; then
                : # fall through to path resolution below
              else
                # Default the packaging dir when the operator picks chess-syzygy
                # without explicitly choosing syzygy-tablebase.
                p="$chess/syzygy"
                if [ -d "$p/3-4-5" ] && ls "$p/3-4-5"/*.rtbw >/dev/null 2>&1; then
                  p="$p/3-4-5"
                fi
                echo "source=chess-syzygy packaging dir -> $p"
                echo "path=$p" >> "$GITHUB_OUTPUT"
                exit 0
              fi ;;
          esac
          if [ -z "$p" ]; then
            echo "::error::corpus=path-override requires the path input"; exit 1
          fi
          if [ ! -e "$p" ]; then
            echo "::error::$p does not exist on this runner"; exit 1
          fi
          echo "resolved corpus '$corpus' (source=$src) -> $p"
          echo "path=$p" >> "$GITHUB_OUTPUT"

  seed:
    needs: resolve
    uses: ./.github/workflows/_ingest.yml
    with:
      source: ${{ inputs.source }}
      path: ${{ needs.resolve.outputs.path }}
      database: ${{ inputs.database }}
      timeout_minutes: 720
      # Independent gates prove expected consensus cells; the idempotency pass proves
      # the source marker prevents duplicate testimony.
      run_gate: true
      run_idempotency: true
      evict_before_ingest: ${{ inputs.evict_before_ingest }}
      evict_confirm: ${{ inputs.evict_confirm }}
