-width:1;"/><line x1="184.432" y1="1141.122" x2="344.854" y2="1141.122" style="stroke:#181818;stroke-width:1;"/><polygon points="334.854,1137.122,344.854,1141.122,334.854,1145.122,338.854,1141.122" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="529.277" y1="957.841" x2="529.277" y2="1141.122" style="stroke:#181818;stroke-width:1;"/><line x1="529.277" y1="1141.122" x2="368.854" y2="1141.122" style="stroke:#181818;stroke-width:1;"/><polygon points="378.854,1137.122,368.854,1141.122,378.854,1145.122,374.854,1141.122" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="356.854" y1="868.747" x2="356.854" y2="888.747" style="stroke:#181818;stroke-width:1;"/><polygon points="352.854,878.747,356.854,888.747,360.854,878.747,356.854,882.747" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="356.854" y1="1153.122" x2="356.854" y2="1173.122" style="stroke:#181818;stroke-width:1;"/><polygon points="352.854,1163.122,356.854,1173.122,360.854,1163.122,356.854,1167.122" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="33"><text x="158.97" y="1214.503" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="150.615" y="1227.081" fill="#888" font-size="10" textLength="402.461">claimed. Complete native snapshot compute/stage/copy routines and managed stage entry</text><text x="168.413" y="1239.659" fill="#888" font-size="10" textLength="366.865">reviewed. Fixed record count follows preallocation and iteration, not proof that XML</text><text x="156.44" y="1252.237" fill="#888" font-size="10" textLength="390.811">contained each codepoint exactly once. No seen bitmap detects gaps/duplicates; absent</text><text x="165.911" y="1264.815" fill="#888" font-size="10" textLength="371.87">properties remain defaults, repeated ranges overwrite, out-of-range last codepoint is</text><text x="150.918" y="1277.394" fill="#888" font-size="10" textLength="401.855">skipped. DUCET expansions after first element and NFD tie-breaks are absent here, unlike</text><text x="153.687" y="1289.972" fill="#888" font-size="10" textLength="396.318">the modular generator; version directives are not enforced in this parser. Open-placement</text><text x="159.792" y="1302.55" fill="#888" font-size="10" textLength="384.106">and UTF8 helpers are separate nested boundaries. Native stage failure can occur after</text><text x="211.204" y="1315.128" fill="#888" font-size="10" textLength="281.284">appending a prefix; owner disposal/admission governs cleanup.</text></g><?plantuml-src ZLLDRzj64BtpLmpGGnB0iYHQ4kNeK0HEX1J85-Aaw2rOxWwbhQbTTdTfMptrH_GNzfVqpP9o7AH5Ux45SdVclJTl7f_Ggrjhs6b-JczKrohDKtOxwtYgVU1f37hQEwkzuI-HsPphhgFhro_AvOgMovLHZIddosPULnSpNPPBjMncXjUh9I_MpAlAQBqec_hIhAj5jMvCmukcQghgefofuid_QQxDb_j3-xZlZAkwDklvVBagL_FPSh6ezNgzh6VLd6lMHbrUw8l5nNgXIrvKzSLbMPRLud9-KPNhkQgN_zXNTTrq_7r-9Stpdyy3zUlCF9u0hCfcjQWk5urPytfc5bKvdrNLSbtfgkIvMPMgMQqRNl7AbDNyibQLAcVLfQhdMg-MgYxYZNMT2kf0jT8tk-1xPwvywmFzi7snlTfk7vs8UsNydNKxQbGR-T4RmutgsxJrBhrJ1wPhvU8r1ziKoQQMwQrtuD1v-kkFFycfP6-PHa8KdUhYtgSp2ihTH5BEK4mAskyA_0-fUFwYRRrMYQcnzsmcW00S51YZCN637qbPHzOrBGuP-kNj6wgFYUEcUFwJiycgrlwEHhmxi4lexXscUgYjGu_ftTxYQ0UrIOMWZf6IFn6I2XzKY8mU7OVaRM3YMrH1M-lse9X8HEj8fHHitQCKzQxb64amj-sH_2s7O0scZ6eV0Nhd18xUgm3E73dSiZcZs8VWTy9I573UoG6b4mTSUtNVoLFT4IRJs13JH7VJLkN_G0B8NV02yJYooBqKf0J7bYSYTUTna5v-ldhrYK0XMFugddT0cWkJzcsRHI9kMHH3gItQ0XBVTwtLuFnQkLtVKWzbMdH1Zyclwk3fXezoshOj2XzKLbWUHcg25v_eLWMCo1x6GfZv3fAXFDYQ3DD8zIaireebuKjdXCsr3mbZ9Kpg1cTGz8pIdXqzKDkWVX1hYP4s1GOBwpszUc0-88e_FYCRwUcHuxE2db_vGuUf4SHpaxnqGfc66ndqKEthoTUshI7ql5pdIUrLtDFdJzlr8o0u_K6m_xVbODdToVDOaT7KcuAT6V4RoFvCXfdwu1wsPKC7vTGEGjm510O7tFojXptZi2HZ8M3g1OzjwEarbee_YjxvB4Vi2hJ86fxK-1chOiI3jGG1xB7thNbeYdiD1qahKZfuU7pSPJ6wa7xly5jUoD