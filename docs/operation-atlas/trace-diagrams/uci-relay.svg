 style="stroke:#181818;stroke-width:1;"/><line x1="546.874" y1="551.266" x2="546.874" y2="573.266" style="stroke:#181818;stroke-width:1;"/><polygon points="542.874,563.266,546.874,573.266,550.874,563.266,546.874,567.266" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="227.75" y1="963.105" x2="227.75" y2="981.105" style="stroke:#181818;stroke-width:1;"/><line x1="227.75" y1="981.105" x2="375.312" y2="981.105" style="stroke:#181818;stroke-width:1;"/><polygon points="365.312,977.105,375.312,981.105,365.312,985.105,369.312,981.105" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="546.874" y1="608.359" x2="546.874" y2="981.105" style="stroke:#181818;stroke-width:1;"/><line x1="546.874" y1="981.105" x2="399.312" y2="981.105" style="stroke:#181818;stroke-width:1;"/><polygon points="409.312,977.105,399.312,981.105,409.312,985.105,405.312,981.105" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="387.312" y1="519.266" x2="387.312" y2="539.266" style="stroke:#181818;stroke-width:1;"/><polygon points="383.312,529.266,387.312,539.266,391.312,529.266,387.312,533.266" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="387.312" y1="993.105" x2="387.312" y2="1013.105" style="stroke:#181818;stroke-width:1;"/><polygon points="383.312,1003.105,387.312,1013.105,391.312,1003.105,387.312,1007.105" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="32"><rect x="116.59" y="1056.105" width="542.314" height="62.828" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="121.59" y="1075.639" fill="#000" font-size="14" textLength="417.854">Process receive throws when EOF is observed after a nonzero exit.</text><text x="121.59" y="1093.248" fill="#000" font-size="14" textLength="532.314">WebSocket disposal aborts and disposes the socket, without a close handshake here.</text><text x="121.59" y="1110.857" fill="#000" font-size="14" textLength="494.102">TextConnection disposal itself is a no-op; stream ownership stays with its caller.</text></g><g class="footer" data-source-line="38"><text x="194.871" y="1142.314" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="199.597" y="1154.893" fill="#888" font-size="10" textLength="376.299">claimed. The merge bar denotes the first-completion race, not waiting for both pumps</text><text x="200.418" y="1167.471" fill="#888" font-size="10" textLength="374.658">before cancellation. Other exceptions propagate; disposal can itself fail. The diagram</text><text x="204.036" y="1180.049" fill="#888" font-size="10" textLength="367.422">combines relay with the owning caller’s subsequent disposal. No engine process or</text><text x="316.87" y="1192.627" fill="#888" font-size="10" textLength="141.753">connector endpoint was started.</text></g><?plantuml-src hLJ1RY8v4BttLvIqXqsaX2G40e73Aa91EzhLP3KmojbjLuE5iNjiTmXxce_Oo_xUVCa-csvWSjuBTBVBzQfUlLU_qlERLcmbJ-XFKHiX-VhhxDDDyFAcVUzzbVfcvgnb6RMpeIS3BNv_wWyVQ7mx4EFHUAZk-E6nKkEnA0VgdeTtZt9uEneEXEeFRiVbtUXX9FholhphFuw6PNdVL_UtibI38coqhOKNMog5tAoyQwoQEUCy_J9_ci_cyxE8i1RAxRHTKILCuBCJnPLeJ9mx6p-BBTD2sB1WhwiYwcYOq139GmF8_EFxFnHtxdedzkJPu5TOHRLtaaC0IXC1OuiGXOz5CPbv5f79QBjXXR-AemP6T1ksqw9oVbFGv0jBrc-8uYfEAJ0IUhrQnoiWrEc-ClifuXRHrLGtsvgSfUUN-HKXmKvuXTJV6eruAJ0BOqIYcb0jlqkkqyi1YyHAQ7k6c65Qo8J-loAcf5lsAoucIn4slTSrsoUx9rS6zcySgD8-H72xhGq3CWDDmLbE-P6pAOcTqB6zr8REjHN6xDkZqiLrFWbegQbhdqPovFodIkEQFIF1bpn2YIJiIUbGku32C44WirrfoztiSqkweekNV7ZwIZfqy__jCYMsTB7dS5bGYlwhKqRKnf1lh8K6FyJHPEdtjFCw9dqcNhEef44nkAYqFUldqyjpHp5LtcsHII0-HjxMSPgIlIOkcXeYmvbdf61Kgq8wJ2KjmOPhuiSYQF97Af5jr9wFYev8q57FxpeZOB1mH_StUSg7g9EzFmm6GphCfMMqomPDm7jqyShbmiaDnyjqlNJ-q70N7V9P5X003A_mK7H4-bQwQCtj0krI2r1cca8hB4