name: Hosted CuteChess GUI game observer controls
on:
  push:
    branches: [verify/cutechess-gui-game-controls-20260916]
permissions:
  contents: read
jobs:
  managed-compilation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LAPLACE_BUILD_ROOT: /build/laplace/build/cutechess-gui-game-controls
      LAPLACE_ENGINE_BUILD: /build/laplace/build/cutechess-gui-game-controls/engine
      LAPLACE_EXTERNAL: /build/laplace/work/cutechess-gui-game-controls/external
      TMPDIR: /build/laplace/work/cutechess-gui-game-controls/tmp
      TMP: /build/laplace/work/cutechess-gui-game-controls/tmp
      TEMP: /build/laplace/work/cutechess-gui-game-controls/tmp
      DOTNET_CLI_HOME: /build/laplace/work/cutechess-gui-game-controls/dotnet-home
      DOTNET_INSTALL_DIR: /build/laplace/work/cutechess-gui-game-controls/dotnet
      NUGET_PACKAGES: /build/laplace/work/cutechess-gui-game-controls/nuget
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      MSBUILDDISABLENODEREUSE: '1'
      CANDIDATE_SHA: 053eb4846680f7d22a0168942227c4ab0c6aefe9
      CANDIDATE_TREE: 9416d933628deecf8f3ae91aceb30511740efdde
    steps:
      - name: Prepare permanent build and evidence directories
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$LAPLACE_BUILD_ROOT" "$TMPDIR" "$DOTNET_CLI_HOME" "$DOTNET_INSTALL_DIR" "$NUGET_PACKAGES" /build/laplace/worktrees /build/laplace/recovery/cutechess-gui-game-controls
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 053eb4846680f7d22a0168942227c4ab0c6aefe9
          fetch-depth: 1
          persist-credentials: false
      - name: Bind the exact candidate in the permanent worktree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          git worktree add --detach /build/laplace/worktrees/cutechess-gui-game-controls "$CANDIDATE_SHA"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path("/build/laplace/recovery/cutechess-gui-game-controls/source.json").write_text(json.dumps({
              "candidate_commit":os.environ["CANDIDATE_SHA"],
              "candidate_tree":os.environ["CANDIDATE_TREE"],
              "workflow_commit":os.environ["GITHUB_SHA"],
              "claim":"local-protocol-controls-only; unchanged managed leaves compiled in run35127310166",
              "native_runtime_executed":False
          },indent=2)+"\n")
          PY
      - name: Run local observer and existing owner controls
        working-directory: /build/laplace/worktrees/cutechess-gui-game-controls
        run: |
          set -euo pipefail
          evidence=/build/laplace/recovery/cutechess-gui-game-controls
          python3 - <<'PY' | tee "$evidence/syntax.log"
          import ast,subprocess
          from pathlib import Path
          for name in ("check-cutechess-gui-game.py","test-cutechess-gui-game.py"):
              ast.parse((Path("scripts")/name).read_text())
              print(name + ": AST passed")
          subprocess.run(["bash","-n","scripts/bootstrap-laplace-runner.sh"],check=True)
          print("bootstrap: Bash syntax passed")
          PY
          printf 'suite\texit_code\n' > "$evidence/control-summary.tsv"
          failed=0
          for suite in test-cutechess-gui-game.py test-cutechess-user-engines.py test-test-profile-registry.py; do
            set +e
            timeout --signal=TERM --kill-after=10s 90s python3 "scripts/$suite" -v 2>&1 | tee "$evidence/$suite.log"
            status=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\n' "$suite" "$status" >> "$evidence/control-summary.tsv"
            if [[ "$status" != 0 ]]; then failed=1; fi
          done
          test -z "$(git status --porcelain --untracked-files=all)"
          exit "$failed"
      - name: Retain exact protocol evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cutechess-gui-game-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: /build/laplace/recovery/cutechess-gui-game-controls/
          if-no-files-found: error
          retention-days: 30
