y:2,2;"/><text x="67.283" y="618.472" fill="#000" font-size="13" textLength="46.96">success</text><line x1="34.283" y1="632.328" x2="325.93" y2="632.328" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="39.283" y="645.747" fill="#000" font-size="11" textLength="204.768" font-weight="700">[deposited false and caller still waiting]</text><polygon points="61.283,669.516,51.283,673.516,61.283,677.516,57.283,673.516" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="55.283" y1="673.516" x2="282.851" y2="673.516" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="67.283" y="668.659" fill="#000" font-size="13" textLength="180.667">SubstrateUnavailableException</text><path d="M770.219,714.516 L770.219,789.516 L1167.219,789.516 L1167.219,724.516 L1157.219,714.516 L770.219,714.516" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1157.219,714.516 L1157.219,724.516 L1167.219,724.516 L1157.219,714.516" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="776.219" y="733.011" fill="#000" font-size="13" textLength="264.481">Codepoint cache failure leaves service offline.</text><text x="776.219" y="749.362" fill="#000" font-size="13" textLength="376.492">Shutdown sets offline, completes channel, fails queued promises.</text><text x="776.219" y="765.714" fill="#000" font-size="13" textLength="359.144">TryEnqueueTurn is a separate nonwaiting API: false when full;</text><text x="776.219" y="782.065" fill="#000" font-size="13" textLength="247.121">it has no per-item caller acknowledgement.</text><g class="footer" data-source-line="40"><text x="397.98" y="897.912" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="399.1" y="910.49" fill="#888" font-size="10" textLength="383.511">claimed. Caller and service cancellation have distinct lifetimes. RecordResponseAsync</text><text x="395.751" y="923.068" fill="#888" font-size="10" textLength="390.21">returning successfully is not proof of a response deposit when the reply is empty. Queue</text><text x="476.903" y="935.646" fill="#888" font-size="10" textLength="227.905">availability is not database or semantic acceptance.</text></g><?plantuml-src bLLTRoir47tVNp4g3mKfJVEvINibf12rejBbGhiNzNdMEsvC7NknlSaDJ_m8VY6_XB5tDmcb2F7GobhRPyuvSpovXBkTgiW8keMFM6iKT8rrVTsjXtUcggqomGz_hCci7jPsMsEu_jmuywo28U-7maFn_Meopu54JlFHOY75P4PJEHa9AVBoPbh9PJcPpN9ULIF2wMHQqeBoQYgNkInfCfRpc_bYDiik_uDDqPG-E0nq_M1Uo0TbJQAorjQJEsDI2ZcTJaOq7IzfBcOJaOyc-RIYsMYSZyUOqsYQot6EY-LYHZJ3ySrIuhoStuZHdAcBpBygKwF3BPGeNb-SRKorjjew-Ef-TR--lpyxuJTOsRqoBo1HUphRgKXYeyEzDU4JRWaADBuWfsGMLD04FrXZ7TKM_lpz3zYtVW9MM-KzInk0GBP2Qun20Kq5pCNOlQRgXRPaGeOYCAKrQaqkuvf12LMZ2N3M840Fpzcl3JK45zz58LI1sA0nfE4QPgER_2AUUVmRm4N1WZHTESAA7B2zEoKe7Ip-KQdrF-wjCzG1daXOLpsHhwtnjF878wAy3T2s3WTWoVgGmJDSNNtRaOTR41mjJO791VIl7y1O8DFIPerxfm9bnFxoXkbnsWAiedPyE_2YHu70lB8UdUiySucMLsISE2KAxOwZNqW4i59gPMZG4MrH1_0RESiMT5rHPeTQCKqoR407yiWWpv5ZGlwQ5zlOlrJzl8tVd1N5FQe0yMXFE_Ov6VNEpOo5iowxexxZWySey3mYCl1cxveFjlOGDjIXNNg81OSPF0IeBFa8oCgt39cEfMjL8iI7YFCMAsPGz0AVE0mhhLk9NIJUgdjCNItujA4lhReEOStVKbBEBVeNbFKHfUBtuLMCHMcj9ZJSPFeYg6uzANepfJAiyd0AGCHdoR67YZEIR3s2PH1pUi8EZWsBBwmpdcUBriakVWOPlCsgRuJWEB19CP0dc3G0_WVESQ3zR727IcEfwUuaZbkGnRzJuul1cisniI9FPQuYk6-IRpQEWDtPSLTxIximSokBJHDuH1dU2luKyjugtu-3GOBoVH0wwpmZV7Q7kpPMyVM0ugd2O77AXVGWEuMm-kdXjdDXlo43ij7wGyQzW0t6l45DxgfDVEl1cuasp8wnavR_kwomZHDn3kqKxPcKTImvcSOM3U4Jh_chfos_HSM_09ndL0Oi_rob6U8Q_iwp5qMqDQOi4nhvIpNi-n3xzLuEcJE_Z4fn4mqF1wqaHIW_V6_0POxYo8acTEc8sW_HglZCs4ihsNhsxJYskjoqJiK7c0PZl976pn0Ue-5PbmobLJZ2LHYmH9z6Ow_zJ69hO-VWNm00?></g></svg>