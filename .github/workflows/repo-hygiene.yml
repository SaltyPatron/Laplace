          {"path":"scripts/build-system-deps.sh","mode":"100644","sha":"c6a8d69e91a39b32c8173839e31655b1f4ce8617","basis":"b15f670e3e93716f4a9d91b3db52e5d3eebf8a15","patch":"--- a/scripts/build-system-deps.sh\n+++ b/scripts/build-system-deps.sh\n@@ -30,0 +31,4 @@\n+cmake_bin=$(python3 \"$ROOT/scripts/provision-cmake.py\" \\\n+  --root \"$PREFIX/tools/cmake\" \\\n+  --work \"${LAPLACE_WORK_ROOT:-/build/laplace/work}/cmake\" --ensure)\n+export PATH=\"$cmake_bin:$PATH\"\n@@ -59,0 +64,4 @@\n+    printf 'cmake-release='\n+    sha256sum \"$ROOT/deploy/cmake-release.json\"\n+    printf 'cmake-owner='\n+    sha256sum \"$ROOT/scripts/provision-cmake.py\"\n"},
