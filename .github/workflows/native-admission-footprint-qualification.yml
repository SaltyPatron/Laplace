name: Quiet substrate bootstrap controls
on:
  push:
    branches: [qualify/native-admission-footprint-20260916]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: /build/laplace/work/quiet-bootstrap-controls/tmp
      TMP: /build/laplace/work/quiet-bootstrap-controls/tmp
      TEMP: /build/laplace/work/quiet-bootstrap-controls/tmp
      EVIDENCE: /build/laplace/recovery/quiet-bootstrap-controls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c94ec4da2c255dfb3a2c7e5e0e66133f0414a6a4
          fetch-depth: 1
      - name: Prepare permanent source control evidence
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$TMPDIR" "$EVIDENCE"
          test "$(git rev-parse HEAD)" = c94ec4da2c255dfb3a2c7e5e0e66133f0414a6a4
          test "$(git rev-parse HEAD^{tree})" = 396b6c98f8c46c4f8c98eaa143f6622201001986
          git rev-parse HEAD HEAD^{tree} > "$EVIDENCE/source.txt"
      - name: Execute existing quiet-owner bootstrap controls
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s python3 scripts/test-wait-for-quiet-substrate.py -v 2>&1 | tee "$EVIDENCE/controls.log"
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE/syntax.log"
          import ast
          from pathlib import Path
          ast.parse(Path("scripts/test-wait-for-quiet-substrate.py").read_text())
          print("PASS test Python AST")
          PY
          bash -n scripts/wait-for-quiet-substrate.sh
          shellcheck --severity=warning scripts/wait-for-quiet-substrate.sh 2>&1 | tee "$EVIDENCE/shellcheck.log"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain bounded quiet-owner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quiet-bootstrap-controls
          path: /build/laplace/recovery/quiet-bootstrap-controls/
          if-no-files-found: error
          retention-days: 30
