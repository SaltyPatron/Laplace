18" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="21"><text x="115.628" y="639.74" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="107.576" y="652.318" fill="#888" font-size="10" textLength="401.855">claimed. Complete BillingOrchestrator preflight body reviewed. Quote persistence, provider</text><text x="120.052" y="664.896" fill="#888" font-size="10" textLength="376.904">call and final update are separate effects; exception/cancellation can leave the earlier</text><text x="112.825" y="677.475" fill="#888" font-size="10" textLength="391.357">pending quote. Stripe gateway internals, catalog price authority and provider acceptance</text><text x="122.278" y="690.053" fill="#888" font-size="10" textLength="372.451">remain separate. TryApproveQuoteAsync changes a found quote to approved; route</text><text x="228.177" y="702.631" fill="#888" font-size="10" textLength="160.654">authorization is outside that method.</text></g><?plantuml-src fLHBZzis4BxhLmpGGpRerk-7l3uKxYRRB90cQToSWn4vj8cbIOKSsN5F_H7zXVab6Khona2FlP7KFBx7Z5x0wwFLv1NTmLki7IeQObqF-_FWjTTri9xJu7rDVlDu7muryl0twvprku5Ai7spcSmNC9dgwOfcIAF9n8orMfggKgFv76UJAKqdit9PhHQBMKKbZicizA8irMWodKnmCHbZjIfU_2ya7qBYNQGql1pwzp-RmBJb4EaAwsYvgfHMg3MLisKfCBHHUbpEg_5eIQfShimKftDZbXMDDPhLVBQOpKQhifgQSJaR5-d9-XeZ7g12zRIBeV7wFhWGuQU7pSFzmyDLHDgZ3YU10WPTegilcWmsZX-2vtTu8DYYJrkArXHisH7y4RpWhWDy--TV-9A9W8g4R8C7z1hKdjHJQ1ZsSWl658anSd7taRuqDaemChgmWqJnQ1MrENL8bksHeF6MqxgukqUd6eUvTYv7MYWb0aC4FxT1KCUSpFP0wKTMna4GS-D3Z-tnrHh46PsfrdW-aESrqDVQnZC4Jx0FJPJK3nIJJTmdLMH2XYeQeEASkkLeQrfd6gY1oQDda5fPabmphGLf288nevP2FlZAeN_gCq4rYSE1uhfJ8eSyAvKefIpVoVA-Gt3Rysi5VSwq1cv-b_8dF4Es87BwKQGrWVIlBu7tvE7cJEbb0NUVQfqrwNYr3IxT7b_TmgUFRpi3UeN4Asv4IfAPW1iV_bE10-09RTRaym5zW-wph4CCHtII9KLCviTDzD2qURfBNCiOXBemGSwns8heYdw9TBHqaf0GXKRYs4xH0Dx9MLuJIGUsiY5HJjP349XhKHPYuxFpW4fHpIZRMIY7yg87a3VGaK3jT-tzSsrPX3