name: Recorded floor exporter checkout controls
on:
  push:
    branches: [qualify/native-admission-footprint-20260916]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_SHA: ce1aaa116b5b99622e945325b0fd785959864a16
      SOURCE_TREE: 15bf25172b1f2a465c5d7c902ff6141f9e6ee91a
      TMPDIR: /build/laplace/work/export-checkout-controls/tmp
      TMP: /build/laplace/work/export-checkout-controls/tmp
      TEMP: /build/laplace/work/export-checkout-controls/tmp
      EVIDENCE: /build/laplace/recovery/export-checkout-controls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ce1aaa116b5b99622e945325b0fd785959864a16
          fetch-depth: 1
      - name: Prepare permanent scratch for the selected source
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$TMPDIR" "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          printf '%s\n' "$SOURCE_SHA $SOURCE_TREE" > "$EVIDENCE/source.txt"
      - name: Execute actual export source and same-checkout controls
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s python3 scripts/test-qualified-chess-floor-export.py -v 2>&1 | tee "$EVIDENCE/export-controls.log"
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE/syntax.log"
          import ast, subprocess, yaml
          from pathlib import Path
          for name in ("export-qualified-chess-floors.py", "test-qualified-chess-floor-export.py"):
              ast.parse((Path("scripts") / name).read_text())
              print(f"PASS Python AST {name}")
          workflow = yaml.safe_load(Path(".github/workflows/chess-floor-export.yml").read_text())
          for job in workflow["jobs"].values():
              for step in job["steps"]:
                  if "run" in step:
                      subprocess.run(["bash", "-n"], input=step["run"], text=True, check=True)
          print("PASS export workflow YAML and embedded Bash syntax")
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain bounded export qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: export-checkout-controls
          path: /build/laplace/recovery/export-checkout-controls/
          if-no-files-found: error
          retention-days: 30
