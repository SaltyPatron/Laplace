name: DB — lifecycle ops

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "database lifecycle operation"
        type: choice
        required: true
        default: status
        options: [status, migrate, repair, reindex, remigrate, recreate]
      confirm:
        description: "recreate only: type laplace"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  LAPLACE_INSTALL_PREFIX: ${{ vars.LAPLACE_INSTALL_PREFIX || '/opt/laplace' }}
  LAPLACE_PG_PREFIX: ${{ vars.LAPLACE_PG_PREFIX || '/opt/laplace/pgsql-18' }}
  PGHOST: /var/run/postgresql
  PGPORT: 5432
  PGUSER: laplace_admin
  PGDATABASE: laplace
  LAPLACE_DATA_ROOT: /vault/Data

jobs:
  db:
    name: DB — ${{ inputs.operation }}
    runs-on: [self-hosted, laplace]
    timeout-minutes: 420
    concurrency:
      group: laplace-host-lifecycle
      queue: max
      cancel-in-progress: false
    env:
      LAPLACE_DB_OPERATION: ${{ inputs.operation }}
      LAPLACE_DB_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Run ${{ inputs.operation }} against the installed database runtime
        env:
          TARGET_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 0002
          workspace_lock_root="${LAPLACE_WORK_ROOT:-/build/laplace/work}"
          mkdir -p "$workspace_lock_root"
          exec 9>"$workspace_lock_root/host-resource.lock"
          flock 9
          cd "$GITHUB_WORKSPACE"
          if [[ ! -e .git ]]; then
            [[ -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]] || {
              echo "::error::nonempty workspace has no repository; preserving its files" >&2
              exit 1
            }
            git init --initial-branch=main
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          git diff --quiet
          git diff --cached --quiet
          checkout_auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $checkout_auth" \
            git fetch --no-tags --depth=2 origin "$TARGET_SHA"
          unset checkout_auth CHECKOUT_TOKEN
          git checkout --no-overwrite-ignore --detach "$TARGET_SHA"
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git diff --quiet
          git diff --cached --quiet

          # Database lifecycle owns database state, not compilation.
          export LAPLACE_SETUP_USE_CMAKE=false
          export LAPLACE_SETUP_REQUIRE_BUILT_REVISION=false
          source scripts/ci-environment.sh

          # Keep the destructive gate readable in the UI. The database name is the
          # canonical confirmation. The previous verbose tokens remain accepted so
          # existing callers are not broken by this UX repair.
          if [[ -v LAPLACE_DB_CONFIRM ]]; then
            case "$LAPLACE_DB_OPERATION" in
              drop)
                case "$LAPLACE_DB_CONFIRM" in
                  "$PGDATABASE"|"DROP"|"DROP $PGDATABASE")
                    LAPLACE_DB_CONFIRM="DROP $PGDATABASE"
                    ;;
                esac
                [[ "$LAPLACE_DB_CONFIRM" == "DROP $PGDATABASE" ]] || {
                  echo "::error::drop requires confirmation: type $PGDATABASE" >&2
                  exit 2
                }
                ;;
              recreate)
                case "$LAPLACE_DB_CONFIRM" in
                  "$PGDATABASE"|"RECREATE"|"RECREATE $PGDATABASE")
                    LAPLACE_DB_CONFIRM="RECREATE $PGDATABASE"
                    ;;
                esac
                [[ "$LAPLACE_DB_CONFIRM" == "RECREATE $PGDATABASE" ]] || {
                  echo "::error::recreate requires confirmation: type $PGDATABASE" >&2
                  exit 2
                }
                ;;
            esac
          fi

          reindex_invalid() {
            P(){ psql -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -tAc "$1"; }
            local invalid rc remaining idx def def_recursive
            invalid="$(P "SELECT n.nspname || '.' || c.relname || E'\t' || pg_get_indexdef(i.indexrelid)
                         FROM pg_index i
                         JOIN pg_class c ON c.oid=i.indexrelid
                         JOIN pg_class t ON t.oid=i.indrelid
                         JOIN pg_namespace n ON n.oid=c.relnamespace
                         WHERE n.nspname='laplace' AND NOT i.indisvalid
                         ORDER BY CASE t.relname WHEN 'consensus' THEN 0 WHEN 'entities' THEN 1
                                  WHEN 'physicalities' THEN 2 ELSE 3 END, c.relname")"
            [[ -n "$invalid" ]] || { echo "::notice::no invalid indexes — nothing to do"; return 0; }
            rc=0
            while IFS=$'\t' read -r idx def; do
              [[ -n "$idx" ]] || continue
              def_recursive="${def/ ON ONLY / ON }"
              echo "--- $idx"
              P "DROP INDEX IF EXISTS $idx" || { rc=1; continue; }
              P "$def_recursive" || rc=1
            done <<< "$invalid"
            remaining="$(P "SELECT count(*) FROM pg_index i
                             JOIN pg_class t ON t.oid=i.indrelid
                             JOIN pg_namespace n ON n.oid=t.relnamespace
                             WHERE n.nspname='laplace' AND NOT i.indisvalid")"
            echo "invalid indexes remaining: $remaining"
            [[ "$rc" -eq 0 && "$remaining" == "0" ]]
          }

          case "$LAPLACE_DB_OPERATION" in
            status)
              exec bash scripts/db-migrations.sh status
              ;;
            migrate)
              exec bash scripts/db-migrations.sh up
              ;;
            repair)
              bash scripts/pipeline.sh sync-extension tune-pg tune-laplace perfcache-guc api-env
              exec bash scripts/check-database-health.sh "$PGDATABASE"
              ;;
            reindex)
              reindex_invalid
              ;;
            remigrate)
              bash scripts/db-migrations.sh reset --yes
              bash scripts/db-migrations.sh up
              exec bash scripts/check-database-health.sh "$PGDATABASE"
              ;;
            recreate)
              python3 scripts/check-installed-extension-current.py
              bash scripts/db-migrations.sh nuke --yes
              bash scripts/db-migrations.sh up
              bash scripts/pipeline.sh sync-extension tune-pg tune-laplace perfcache-guc api-env
              exec bash scripts/check-database-health.sh "$PGDATABASE"
              ;;

            # Backward-compatible internal aliases for scripts/tests created while
            # the operator surface had been replaced. They are deliberately absent
            # from workflow_dispatch so they do not displace the operator commands.
            create)
              python3 scripts/check-installed-extension-current.py
              bash scripts/db-migrations.sh up
              bash scripts/pipeline.sh sync-extension tune-pg tune-laplace perfcache-guc api-env
              exec bash scripts/check-database-health.sh "$PGDATABASE"
              ;;
            drop)
              exec bash scripts/db-migrations.sh nuke --yes
              ;;
            update)
              python3 scripts/check-installed-extension-current.py
              exec bash scripts/maintain-installed-database.sh
              ;;
            verify)
              exec bash scripts/check-database-health.sh "$PGDATABASE"
              ;;
            *)
              echo "::error::unknown database lifecycle operation: $LAPLACE_DB_OPERATION" >&2
              exit 2
              ;;
          esac
