name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-tree:
    name: Tracked tree contains no local/runtime artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Enforce source-tree hygiene and strong secret signatures
        run: python3 scripts/repo-hygiene-gate.py

  repair-membership-fixture:
    # One inventor-authorized repair invocation. The resulting atomic commit
    # removes this worker and its write permission. No product rebuild or seed.
    if: github.event_name == 'push' && github.event.before == '927fdc19149861c1181598cff8ccf348485cf25a'
    runs-on: [self-hosted, laplace]
    timeout-minutes: 10
    concurrency:
      group: laplace-shared-workspace
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PGHOST: /var/run/postgresql
      PGPORT: 5432
      PGUSER: laplace_admin
      PGDATABASE: postgres
    steps:
      - name: Repair fixture, execute native readers, and remove the one-shot worker
        shell: bash
        run: |
          set -euo pipefail
          umask 0002
          mkdir -p /build/laplace/work
          flock --exclusive --close /build/laplace/work/host-resource.lock bash -euo pipefail <<'REPAIR'
          workspace="$RUNNER_TEMP/laplace-membership-repair-$GITHUB_RUN_ID"
          evidence="/build/laplace/work/membership-repair-$GITHUB_RUN_ID"
          database="laplace_membership_repair_${GITHUB_RUN_ID}"
          export PATH="/opt/laplace/pgsql-18/bin:$PATH"
          git fetch --no-tags origin "$GITHUB_SHA"
          git worktree add --detach "$workspace" "$GITHUB_SHA"
          cleanup() {
            dropdb --if-exists "$database" || true
            git -C "$GITHUB_WORKSPACE" worktree remove --force "$workspace" || true
          }
          trap cleanup EXIT
          cd "$workspace"
          mkdir -p "$evidence/default" "$evidence/host-bitmap-disabled"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = '927fdc19149861c1181598cff8ccf348485cf25a'
          paths = ('extension/laplace_substrate/tests/sql/generation_corpus.sql',
                   'extension/laplace_substrate/tests/expected/generation_corpus.out')
          changes = [
              ('DO $membership_bitmap$\nDECLARE',
               '-- Keep this stress fixture independent of heap compression and planner tuning.\n'
               '-- Its savepoint also removes the load and restores every SET LOCAL below.\n'
               'SAVEPOINT membership_bitmap_fixture;\nDO $membership_bitmap$\nDECLARE'),
              ('BEGIN\n    SELECT public.ST_MakeLine(array_agg(public.laplace_mantissa_pack(needle,i,1,4) ORDER BY i)),',
               'BEGIN\n    ALTER TABLE laplace.physicalities ALTER COLUMN trajectory SET STORAGE PLAIN;\n'
               '    SELECT public.ST_MakeLine(array_agg(public.laplace_mantissa_pack(needle,i,1,4) ORDER BY i)),'),
              ("    PERFORM set_config('enable_seqscan','off',true);\n    EXECUTE 'EXPLAIN (ANALYZE,BUFFERS,FORMAT JSON) SELECT entity_id",
               "    PERFORM set_config('enable_seqscan','off',true);\n"
               "    PERFORM set_config('enable_indexscan','off',true);\n"
               "    PERFORM set_config('enable_indexonlyscan','off',true);\n"
               "    PERFORM set_config('enable_bitmapscan','on',true);\n"
               "    PERFORM set_config('max_parallel_workers_per_gather','0',true);\n"
               "    EXECUTE 'EXPLAIN (ANALYZE,BUFFERS,FORMAT JSON) SELECT entity_id"),
              ("RAISE EXCEPTION 'FAIL: membership recheck fixture did not exercise a lossy bitmap';",
               "RAISE EXCEPTION 'FAIL: membership recheck fixture did not exercise a lossy bitmap: %',plan;"),
              ("    PERFORM set_config('work_mem','4MB',true);\n    PERFORM set_config('enable_seqscan','on',true);\nEND\n$membership_bitmap$;",
               'END\n$membership_bitmap$;\nROLLBACK TO SAVEPOINT membership_bitmap_fixture;\nRELEASE SAVEPOINT membership_bitmap_fixture;'),
          ]
          for name in paths:
              path = Path(name)
              original = subprocess.check_output(['git', 'show', f'{base}:{name}'])
              assert path.read_bytes() == original, f'concurrent changes: {name}'
              text = original.decode()
              for before, after in changes:
                  assert text.count(before) == 1, (name, before)
                  text = text.replace(before, after, 1)
              path.write_text(text, encoding='utf-8')
          path = Path('.github/workflows/laplace.yml')
          text = path.read_text()
          before = ('          python3 scripts/collect-recursive-proof-evidence.py "${args[@]}"\n'
                    '          flock --exclusive --close /build/laplace/work/host-resource.lock \\\n'
                    '            python3 scripts/inspect-recursive-proof-counterexamples.py \\\n'
                    '              --collection "$evidence" --expected-source "$TARGET_SHA"')
          after = ('          python3 scripts/collect-recursive-proof-evidence.py "${args[@]}"\n'
                   '          # Bounded READ ONLY inspection has its own statement/lock deadlines.\n'
                   '          # Do not queue a no-example result behind unrelated host-wide work.\n'
                   '          python3 scripts/inspect-recursive-proof-counterexamples.py \\\n'
                   '            --collection "$evidence" --expected-source "$TARGET_SHA"')
          assert text.count(before) == 1
          path.write_text(text.replace(before, after, 1))
          Path('.github/workflows/repo-hygiene.yml').write_bytes(subprocess.check_output([
              'git', 'cat-file', 'blob', '76aac11f558d58714682364952185f1ef873aed7']))
          PY
          git diff --check
          git diff --stat
          python3 scripts/actions-audit.py
          for configuration in default host-bitmap-disabled; do
            createdb -O laplace_admin "$database"
            if [[ "$configuration" == host-bitmap-disabled ]]; then
              export PGOPTIONS='-c enable_bitmapscan=off'
            else
              unset PGOPTIONS
            fi
            psql -X -d "$database" -v ON_ERROR_STOP=1 -c 'SHOW enable_bitmapscan; SHOW default_toast_compression;'
            if ! /opt/laplace/pgsql-18/lib/pgxs/src/test/regress/pg_regress \
              --bindir=/opt/laplace/pgsql-18/bin \
              --inputdir="$workspace/extension/laplace_substrate/tests" \
              --outputdir="$evidence/$configuration" \
              --dbname="$database" --user=laplace_admin --use-existing \
              bootstrap generation_corpus; then
              cat "$evidence/$configuration/regression.diffs"
              exit 1
            fi
            dropdb "$database"
          done
          unset PGOPTIONS
          git add .github/workflows/laplace.yml .github/workflows/repo-hygiene.yml \
            extension/laplace_substrate/tests/sql/generation_corpus.sql \
            extension/laplace_substrate/tests/expected/generation_corpus.out
          git -c user.name='SaltyPatron' -c user.email='259472962+SaltyPatron@users.noreply.github.com' \
            commit -m 'Repair planner-dependent bitmap fixture and eliminate no-op diagnostic lock waits'
          git show --stat --oneline HEAD
          # GitHub rejects a non-fast-forward update if another writer moved main.
          # Use the scoped Actions token without changing stored remote credentials.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/main
          printf 'MEMBERSHIP_REPAIR_COMMITTED source=%s native_configurations=2 rebuilds=0 corpus_seeds=0\n' "$(git rev-parse HEAD)"
          REPAIR
      - name: Retain native membership execution results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: membership-repair-${{ github.run_id }}
          path: /build/laplace/work/membership-repair-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
