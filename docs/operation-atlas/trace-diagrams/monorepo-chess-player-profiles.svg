,265.447,660.103" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="265.447" y1="701.196" x2="265.447" y2="721.196" style="stroke:#181818;stroke-width:1;"/><polygon points="261.447,711.196,265.447,721.196,269.447,711.196,265.447,715.196" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="265.447" y1="756.29" x2="265.447" y2="776.29" style="stroke:#181818;stroke-width:1;"/><polygon points="261.447,766.29,265.447,776.29,269.447,766.29,265.447,770.29" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="265.447" y1="811.384" x2="265.447" y2="831.384" style="stroke:#181818;stroke-width:1;"/><polygon points="261.447,821.384,265.447,831.384,269.447,821.384,265.447,825.384" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="265.447" y1="866.478" x2="265.447" y2="886.478" style="stroke:#181818;stroke-width:1;"/><polygon points="261.447,876.478,265.447,886.478,269.447,876.478,265.447,880.478" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="23"><text x="74.571" y="927.858" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="78.194" y="940.437" fill="#888" font-size="10" textLength="378.506">claimed. Provider facts are separately witnessed. This method interprets co-supplying</text><text x="96.8" y="953.015" fill="#888" font-size="10" textLength="341.294">exactly one FIDE profile and online profiles as explicit association; it does not</text><text x="69.266" y="965.593" fill="#888" font-size="10" textLength="396.362">independently validate that each online profile is the same person. Matching names alone</text><text x="74.549" y="978.171" fill="#888" font-size="10" textLength="385.796">do not create the association branch. Counts report supplied/planned profiles and links,</text><text x="72.328" y="990.749" fill="#888" font-size="10" textLength="390.239">not proven novel identities. The presence probe and subsequent shared-writer apply are</text><text x="110.14" y="1003.327" fill="#888" font-size="10" textLength="314.614">separate operations; cross-process race handling belongs to the writer.</text></g><?plantuml-src TLJBRYCt4BpFLpIGGsn0ZwopjXvp2BooXHXOFs1jSWqeJe-6C4NEaXp9Syj7v0lp9QcUaMIlWLm43H_LNTLL_9bkTwPWftbENrLjbUQngklnuVzeKN6CunM7dS5Ez_MqSNTkmp7vCDAHLhzVNrnUqMmokPpDBejYEbrFfrpeozcdylDazhduzMfTp2wcLwNwD2kd5pp5kOlFar-cLvDYTYdV4wrL5b-CgrLGMreh_R89ld75mbiVwAVbzNAnNBux4IjL-Brn6ogLZVnkf-1IDJOjlKiFQikqKYwYUrDcoIJBTE-T3rnxqaA5_ltx7wg35ma2i7IAf5n1ElWOXwSD4GZNMqfWRRRUjLbCAgHiVhkjiOpYJQB0gGakvkHJnM5l8fFItniJM4feb1lkWOJJ8fxnZZOgSPxDltYVOWggfi9Wm-dqrbFqJS3L7EWRR695A-UTqSeEdH1i793oR5yPi3jx2hwKFu6tohZuspcPI6Sjn_ECvdygQmgKfENTpUs1L6a0kQ_O4QPk0RksQ8dcAxQCFlhounIQc7A86ymERAngHQxWjpqKsfOrwXh2mBopnl4RYRiRWLpuRUr556jKv3YW3_fAAmDQ6x-155Kxe6vY0oePPvG8DY3WllGZaXMtYNd6hZYGBxpZyyoKT7RxYb7Q5eqSoDO7NM8ZBBc0C4b87wLPeclUSMXF9zwHa9i3qiVsO_JQTFrWpIL-JSBkEeavQF7u_7oxUdfyk5dzzUtn1D8hbloXc_uJ1kUJMBtI7HsOTVwbCHO-h9IO9PSkrYZTrUXBtzr4af3KQ7NTOk2sNqzjBPvQWKOGXoiRM1NjKBwWyfk5Szggy78iGGlaBSNh-8SpgKyLKAwXHNkl79nVeTQcakG5LDm70o_c1yyVHHhtnCOo9MWZW01vXfKmyCxjC3-LnYbhsnmPydLMmlmSibL7VnXuPtWlwWS9QEhdFg87_CTgXAtX5BmwlS79r-noSfu2Yfcj94vpdHJUiqnRXPLYH4yV0ev0HfRd8Z4yiZV9GIWv-Ar2MhQSAb-WKRG5qN11-s7dYXQ6o_Z_h2Mc_D4pA1M9NoLMqFITRtB2T-5nmFcK6TW0D2G3mDqTGvegbOYLhZwWIgBXNOeIjff357tkLTALl8SIGHawsiiAB_XupBZ7-z6xwm2Lgj5Xy2IFOaWd-yiedOFaRrp0hulV81DK2Iy2vF1hZm-auIWYIgjYDir7t-9gRDQHlpTYmTv3mzv3tRlJob2our1agltWuVpJKomFA58FK3Ysi49spU2vYP8hOTS3ZYH2TB3LVm00?></g></svg>