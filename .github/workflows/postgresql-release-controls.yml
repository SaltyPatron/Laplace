name: CI session host-wait cancellation controls
on:
  push:
    branches: [verify/postgresql-activation-20260916]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_SHA: d48509640a0844caf095c0da18520ddaca4846ec
      SOURCE_TREE: def7ecea9377684de236fc16e80c6e45ab13b4ac
      TMPDIR: /build/laplace/work/postgresql-release/tmp
      TMP: /build/laplace/work/postgresql-release/tmp
      TEMP: /build/laplace/work/postgresql-release/tmp
      EVIDENCE: /build/laplace/recovery/postgresql-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Prepare permanent isolated source and scratch
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$TMPDIR" "$EVIDENCE" /build/laplace/worktrees
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          git worktree add --detach /build/laplace/worktrees/postgresql-release "$SOURCE_SHA"
          printf '%s\n' "$SOURCE_SHA $SOURCE_TREE" > "$EVIDENCE/source.txt"
      - name: Execute exact session lifecycle controls
        run: |
          set -euo pipefail
          cd /build/laplace/worktrees/postgresql-release
          status=0
          for test in test-ci-session.py; do
            set +e
            timeout --signal=TERM --kill-after=10s 300s python3 "scripts/$test" -v 2>&1 | tee "$EVIDENCE/$test.log"
            result=$?
            set -e
            printf '%s\t%s\n' "$test" "$result" >> "$EVIDENCE/exit-codes.tsv"
            if [ "$result" -ne 0 ]; then status=1; fi
          done
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE/python-ast.log"
          import ast
          from pathlib import Path
          for name in ("ci-session.py", "test-ci-session.py"):
              ast.parse((Path("scripts") / name).read_text())
              print(f"PASS Python AST {name}")
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
          exit "$status"
      - name: Retain bounded source qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgresql-release-source-controls
          path: /build/laplace/recovery/postgresql-release/
          if-no-files-found: error
          retention-days: 30
