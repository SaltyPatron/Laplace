name: Recover closed implementation sources
on:
  push:
    branches: [work/recover-closed-pr-implementations-20260915]
    paths: [.github/workflows/closed-work-transfer.yml]
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9a16d31c10184de77484f28990f248a366189c6a
          persist-credentials: false
      - name: Preserve complete closed unmerged PR inventories and patch sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/closed-work"
          export RECOVERY_DIRECTORY="$RUNNER_TEMP/closed-work"
          python3 - <<'PY'
          import concurrent.futures, json, os, time, urllib.parse, urllib.request
          from pathlib import Path
          root = Path(os.environ['RECOVERY_DIRECTORY'])
          repository = 'SaltyPatron/Laplace'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          def get(path):
              request = urllib.request.Request('https://api.github.com/' + path, headers=headers)
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          return json.load(response)
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(2 ** attempt)
          def pages(path):
              result = []
              for page in range(1, 101):
                  rows = get(path + ('&' if '?' in path else '?') + f'per_page=100&page={page}')
                  result.extend(rows)
                  if len(rows) < 100:
                      return result
              raise RuntimeError('pagination exceeded complete collection capacity')
          query = urllib.parse.quote('repo:' + repository + ' is:pr is:closed is:unmerged')
          items = []
          for page in range(1, 11):
              result = get(f'search/issues?q={query}&sort=created&order=desc&per_page=100&page={page}')
              if result.get('incomplete_results'):
                  raise RuntimeError('GitHub returned an incomplete search')
              if result['total_count'] > 1000:
                  raise RuntimeError('search requires date partitioning for complete recovery')
              items.extend(result['items'])
              if len(items) >= result['total_count']:
                  break
          if len({x['number'] for x in items}) != result['total_count']:
              raise RuntimeError('closed unmerged enumeration is incomplete')
          def collect(item):
              number = item['number']
              pr = get(f'repos/{repository}/pulls/{number}')
              files = pages(f'repos/{repository}/pulls/{number}/files')
              comments = pages(f'repos/{repository}/issues/{number}/comments')
              if len(files) != pr['changed_files']:
                  raise RuntimeError(f'PR {number}: incomplete changed file inventory')
              value = {'number': number, 'title': pr['title'], 'body': pr['body'],
                       'state': pr['state'], 'merged_at': pr['merged_at'], 'closed_at': pr['closed_at'],
                       'base_sha': pr['base']['sha'], 'head_sha': pr['head']['sha'],
                       'head_ref': pr['head']['ref'], 'html_url': pr['html_url'],
                       'files': files,
                       'comments': [{'body': c['body'], 'created_at': c['created_at'], 'html_url': c['html_url']}
                                    for c in comments]}
              (root / f'pr-{number}.json').write_text(json.dumps(value, indent=2) + '\n')
              print(f'PRESERVED_PR number={number} files={len(files)} head={pr["head"]["sha"]}')
              return {'number': number, 'title': pr['title'], 'head_sha': pr['head']['sha'],
                      'changed_files': len(files), 'merged_during_collection': pr['merged_at'] is not None}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              inventory = list(pool.map(collect, items))
          (root / 'inventory.json').write_text(json.dumps({
              'repository': repository, 'comparison_source': '9a16d31c10184de77484f28990f248a366189c6a',
              'total_closed_unmerged_at_search': result['total_count'], 'pull_requests': inventory,
              'complete': True}, indent=2) + '\n')
          print('CLOSED_IMPLEMENTATIONS_PRESERVED=' + str(len(inventory)))
          PY
          git archive --format=tar.gz --output="$RUNNER_TEMP/closed-work/current-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: closed-implementation-sources
          path: ${{ runner.temp }}/closed-work/
          retention-days: 30
          if-no-files-found: error
