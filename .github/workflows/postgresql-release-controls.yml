name: PostgreSQL consumed build-input fingerprint controls
on:
  push:
    branches: [verify/postgresql-activation-20260916]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_SHA: 3b30b0149ae7dd55f462b7938eb55311a775f0cd
      SOURCE_TREE: 835f8b78ec9fb62b54e302b09ff8f2ccc4a56961
      TMPDIR: /build/laplace/work/postgresql-release/tmp
      TMP: /build/laplace/work/postgresql-release/tmp
      TEMP: /build/laplace/work/postgresql-release/tmp
      EVIDENCE: /build/laplace/recovery/postgresql-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Prepare permanent isolated source and scratch
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$TMPDIR" "$EVIDENCE" /build/laplace/worktrees
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          git worktree add --detach /build/laplace/worktrees/postgresql-release "$SOURCE_SHA"
          printf '%s\n' "$SOURCE_SHA $SOURCE_TREE" > "$EVIDENCE/source.txt"
      - name: Execute exact dependency and fingerprint owner controls
        run: |
          set -euo pipefail
          cd /build/laplace/worktrees/postgresql-release
          status=0
          for test in test-postgresql-release.py test-pipeline-install.py test-app-fingerprints.py test-application-runtime.py; do
            set +e
            timeout --signal=TERM --kill-after=10s 300s python3 "scripts/$test" -v 2>&1 | tee "$EVIDENCE/$test.log"
            result=$?
            set -e
            printf '%s\t%s\n' "$test" "$result" >> "$EVIDENCE/exit-codes.tsv"
            if [ "$result" -ne 0 ]; then status=1; fi
          done
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE/python-ast.log"
          import ast
          from pathlib import Path
          for name in ("postgresql-release.py", "test-postgresql-release.py", "test-pipeline-install.py",
                       "test-app-fingerprints.py", "check-application-runtime.py", "test-application-runtime.py"):
              ast.parse((Path("scripts") / name).read_text())
              print(f"PASS Python AST {name}")
          PY
          bash -n scripts/lib/fp.sh
          bash -n scripts/pipeline.sh
          shellcheck --severity=warning scripts/lib/fp.sh 2>&1 | tee "$EVIDENCE/shellcheck.log"
          printf '%s\n' "PASS Bash syntax and fingerprint ShellCheck" | tee "$EVIDENCE/bash.log"
          test -z "$(git status --porcelain --untracked-files=all)"
          exit "$status"
      - name: Retain bounded source qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgresql-release-source-controls
          path: /build/laplace/recovery/postgresql-release/
          if-no-files-found: error
          retention-days: 30
