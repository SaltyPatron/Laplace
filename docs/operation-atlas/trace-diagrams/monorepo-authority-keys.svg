" y2="105.609" style="stroke:#181818;stroke-width:1;"/><polygon points="943.754,101.609,953.754,105.609,943.754,109.609,947.754,105.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="704.309" y1="73.609" x2="704.309" y2="78.609" style="stroke:#181818;stroke-width:1;"/><line x1="704.309" y1="78.609" x2="219.775" y2="78.609" style="stroke:#181818;stroke-width:1;"/><line x1="219.775" y1="78.609" x2="219.775" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="215.775,83.609,219.775,93.609,223.775,83.609,219.775,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1065.797" y1="105.609" x2="1280.563" y2="105.609" style="stroke:#181818;stroke-width:1;"/><line x1="1280.563" y1="105.609" x2="1280.563" y2="205.622" style="stroke:#181818;stroke-width:1;"/><polygon points="1276.563,195.622,1280.563,205.622,1284.563,195.622,1280.563,199.622" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1280.563" y1="240.716" x2="1280.563" y2="334.728" style="stroke:#181818;stroke-width:1;"/><polygon points="1276.563,324.728,1280.563,334.728,1284.563,324.728,1280.563,328.728" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="219.775" y1="334.728" x2="1280.563" y2="334.728" style="stroke:#181818;stroke-width:1;"/><line x1="704.309" y1="334.728" x2="704.309" y2="354.728" style="stroke:#181818;stroke-width:1;"/><polygon points="700.309,344.728,704.309,354.728,708.309,344.728,704.309,348.728" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="25"><text x="507.433" y="396.108" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="502.708" y="408.687" fill="#888" font-size="10" textLength="395.2">claimed. Complete key service and both stores reviewed. Validation performs a read then</text><text x="511.869" y="421.265" fill="#888" font-size="10" textLength="376.88">separate usage write; revocation is not transactionally rechecked before returning the</text><text x="498.26" y="433.843" fill="#888" font-size="10" textLength="404.097">previously read record. In-memory touch/revoke use dictionary read/replace operations and</text><text x="481.322" y="446.421" fill="#888" font-size="10" textLength="437.974">do not provide an atomic compare-update across both. PostgreSQL issue uses ON CONFLICT DO</text><text x="517.452" y="458.999" fill="#888" font-size="10" textLength="365.713">NOTHING; tenant foreign-key violation has a specific error. Plaintext is returned by</text><text x="618.875" y="471.577" fill="#888" font-size="10" textLength="162.866">issuance, not stored by these stores.</text></g><?plantuml-src RLJBajis4BppAwOgXwohLjGZYjQo3YwLRDcgh2N7ykCC0aCH9H2WCQ2qlEKZyeNvaWn0xdehpWq5SdgwUthmAxozQ8LMuYku5uqH4iUYQSR3ENzhLUEq3PGV6hJhtSRLZGZZTHkgyRhHVs17kIGulb_FVb_0H4pA-M9IpCjYUIUBb_FvV5PCS5aMShbGoyLqiPpYR3ahbzE9MgYxsR8e9CxaRtUB-TtavJIZixQDyAA6GiZpoRlMgeqppiCls_Lsizq--uCgeTnLsnEKmX0--wAm5Aq9MsV3NjG8Hs7fY5wNMT3187nmrdbi7Fpprz-m_hWRdR43JTJYBLo4qKe4xUmj1DVA2eHLuF7YPBhDA0WVCbt2pIvMl7u1eK8BDntIYmnUlKEBNWI4sHmybpgMqWMa5HXtHIy58LJu05STAg3poFH6Zw3nMEg75KCCPfQjCS3CLa21wK8bgBg5wM8aArOf0tfGchYw6sgPC5fXGs9iH84cegslGeS1ukfrm1Mh2QstmAKyMNm8iSiWKpglLXcodr7XrzwCdqH-mk-jPho1SwBMy-KRGWPLFVFlBVgkRyvS8kG7zZdEZ4SQJJsZ-WzuH4_qh8EOJ1vPnxMH4jomR7t1zDUtg8KpI-4BeLg77x8OLxkMJCStueSeGAiu0e_QFgNkF9n1nSyQkNOmbBNm06Nb79CejIVsE341VE33g4U0MWHPhL9jmYOqA0SlUe-IwiGoPRPt6cwCfl3KCpQBj8RUN9AQF4wqLy6MDbdf7ASWExhMSuAYRBnoD-TbXHHyociEUpxpBM7DS9gNrVD9Mt2yqAleic_vdjT4I8bD4FmMP9AZKQFA8UwxGJOwIY3q5oqnHQLmCRzni16mxvp3rwVjWGPzwNnD8FenH7CpmhYX3DUIE3tBu-DsyHOoem1CtbAqs5bXqY1PakImG85bJ7BlOWmIusR_F_8STdPKO-quWccLnttYk3dowlJelY_XJsaFeokzSHHbPiebFertyPdaAn31rLg2Z0-Xnr7Rn0LXxxmZIgxayD5HE7ay_ddVlogn