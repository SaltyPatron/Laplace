290.715" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="259.057" y1="776.845" x2="259.057" y2="796.845" style="stroke:#181818;stroke-width:1;"/><polygon points="255.057,786.845,259.057,796.845,263.057,786.845,259.057,790.845" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="259.057" y1="831.938" x2="259.057" y2="851.938" style="stroke:#181818;stroke-width:1;"/><polygon points="255.057,841.938,259.057,851.938,263.057,841.938,259.057,845.938" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="23"><text x="75.181" y="893.319" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="60.439" y="905.897" fill="#888" font-size="10" textLength="415.234">claimed. Complete naming-coupling helper reviewed. Pending additions are merged only after</text><text x="77.385" y="918.476" fill="#888" font-size="10" textLength="381.343">channel traversal, so one call is one witnessed naming hop; it cannot cascade through</text><text x="82.405" y="931.054" fill="#888" font-size="10" textLength="371.304">freshly created origins in the same pass. Supported lemma projection does not itself</text><text x="82.947" y="943.632" fill="#888" font-size="10" textLength="370.22">establish a speech act. Hard relation filtering and channel orientation are caller/read</text><text x="167.439" y="956.21" fill="#888" font-size="10" textLength="201.235">boundaries, not newly enforced in this helper.</text></g><?plantuml-src NLJDRkCs4BxhAGReeGcGs5idTWpxK1XU6rbqOmTHqQin8aSI6ueKE9IzUzk7w1FsIJgKxDJOYoN8d9_lZx_2vcWqEKKB-8gjHKLZ-XR9iV5kR8Sl1-uAZW4ZZJceSHjyqyQ3SN8iZch8drUJwGpAYPvFYq_gSKvOJ6QJ1_NfKQEQF9MpnvbwclyscysrcivdD9dCPtEbwK7ffsbHFAWf5ILb_6vSYm4RA52zLy5tJg-zzG5-sQwsw-tswWJNgFt9k0fAj7nTgwd4piQjTt673K6EZdCAfioYYPRWnJiVgFNmx