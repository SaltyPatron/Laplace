name: Chess corpus — authentic recorded capacity

# Explicit operator branches or dispatch only. The source-built CLI uses the
# installed database/native runtime; this workflow never activates a deployment.
on:
  push:
    branches: [verify/chess-corpus-inventory-*, verify/chess-corpus-measure-*]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inventory, measure]
        default: inventory
        required: true
      pgn:
        description: "Observed absolute plain PGN; blank selects exactly one observed family file"
        type: string
        required: false
        default: ""
      family:
        type: choice
        options: [otb-2025, elite]
        default: otb-2025
        required: true
      games:
        description: "Requested authentic fresh PLAYING occurrences"
        type: string
        required: true
        default: "75000"

permissions:
  contents: read

concurrency:
  group: laplace-shared-workspace
  cancel-in-progress: false

env:
  LAPLACE_INSTALL_PREFIX: ${{ vars.LAPLACE_INSTALL_PREFIX || '/opt/laplace' }}
  LAPLACE_PG_PREFIX: ${{ vars.LAPLACE_PG_PREFIX || '/opt/laplace/pgsql-18' }}
  LAPLACE_EXTERNAL: ${{ vars.LAPLACE_EXTERNAL || '/build/external' }}
  LAPLACE_DATA_ROOT: /vault/Data
  PGHOST: /var/run/postgresql
  PGUSER: laplace_admin
  PGDATABASE: laplace
  LAPLACE_DB: "Host=/var/run/postgresql;Username=laplace_admin;Database=laplace"

jobs:
  corpus:
    name: Observed corpus — complete fresh admission and replay
    runs-on: [self-hosted, laplace]
    timeout-minutes: 180
    steps:
      - name: Create corpus evidence directory
        shell: bash
        run: |
          set -euo pipefail
          umask 0002
          evidence_root=/build/laplace/work/chess-corpus-evidence
          mkdir -p "$evidence_root"
          receipt="$evidence_root/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$receipt"
          printf 'LAPLACE_CORPUS_EVIDENCE=%s\n' "$receipt" >> "$GITHUB_ENV"

      - name: Observe or measure the exact source under shared host ownership
        id: corpus_measurement
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_PGN: ${{ inputs.pgn }}
          REQUESTED_FAMILY: ${{ inputs.family }}
          REQUESTED_GAMES: ${{ inputs.games }}
        run: |
          set -euo pipefail
          umask 0002
          mkdir -p /build/laplace/work
          export TMPDIR=/build/laplace/work TMP=/build/laplace/work TEMP=/build/laplace/work
          # Checkout also belongs to the lock: the persistent workspace is shared.
          timeout --signal=TERM --kill-after=15s 7500s \
            flock --exclusive --close --timeout 1800 /build/laplace/work/host-resource.lock bash -c '
            set -euo pipefail
            printf "%s\n" "CORPUS_SETUP source-fetch running"
            timeout --signal=TERM --kill-after=5s 120s git fetch --no-tags --prune origin "$TARGET_SHA"
            timeout --signal=TERM --kill-after=5s 60s git checkout --force "$TARGET_SHA"
            [[ "$(timeout 10s git rev-parse HEAD)" == "$TARGET_SHA" ]]
            printf "%s\n" "CORPUS_SETUP source-checkout passed"
            mode="${REQUESTED_MODE:-inventory}"
            if [[ "$GITHUB_REF_NAME" == verify/chess-corpus-measure-* ]]; then mode=measure; fi
            if [[ "$GITHUB_REF_NAME" == verify/chess-corpus-inventory-* ]]; then mode=inventory; fi
            family="${REQUESTED_FAMILY:-otb-2025}"
            games="${REQUESTED_GAMES:-75000}"
            export PATH="$LAPLACE_PG_PREFIX/bin:$PATH"
            export MSBUILDDISABLENODEREUSE=1 UseSharedCompilation=false
            args=(--mode "$mode" --expected-source "$TARGET_SHA"
                  --output-dir "$LAPLACE_CORPUS_EVIDENCE/corpus"
                  --family "$family" --games "$games" --deadline-seconds 3600)
            [[ -z "${REQUESTED_PGN:-}" ]] || args+=(--pgn "$REQUESTED_PGN")
            if [[ "$mode" == inventory ]]; then
              exec python3 scripts/measure-installed-chess-corpus.py "${args[@]}"
            else
              exec python3 - "${args[@]}" <<"PY"
          import json, os, signal, subprocess, sys, time
          def interrupted(signum, frame):
              raise KeyboardInterrupt("toolchain initialization interrupted")
          signal.signal(signal.SIGTERM, interrupted)
          started = time.monotonic()
          print("CORPUS_SETUP toolchain running", flush=True)
          process = subprocess.Popen([
              "bash", "-c",
              "source /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1 && exec \"$1\" -c \"$2\"",
              "corpus-toolchain", sys.executable,
              "import json, os; print(json.dumps(dict(os.environ)))"
          ], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, start_new_session=True)
          try:
              raw, _ = process.communicate(timeout=120)
              if process.returncode or len(raw) > 2 * 1024 * 1024:
                  raise RuntimeError("toolchain initialization failed or exceeded environment bound")
              environment = json.loads(raw)
              if not isinstance(environment, dict) or any(
                      not isinstance(k, str) or not isinstance(v, str) for k, v in environment.items()):
                  raise ValueError("toolchain environment shape is invalid")
          finally:
              try:
                  os.killpg(process.pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  pass
              try:
                  os.killpg(process.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              process.wait(timeout=5)
              process.stdout.close()
          # The captured environment stays in memory and is never logged or retained.
          root = os.getcwd()
          environment["LD_LIBRARY_PATH"] = ":".join(
              [root + "/build/engine/" + part for part in ("core", "dynamics", "synthesis")]
              + [environment.get("LD_LIBRARY_PATH", "")])
          environment["LAPLACE_ENGINE_BUILD"] = root + "/build/engine"
          print("CORPUS_SETUP toolchain passed " + json.dumps({
              "wallSeconds": time.monotonic() - started}), flush=True)
          # Read-only context is diagnostic; the writer owns admission serialization.
          import base64, pathlib
          journal_sql = base64.b64decode("").decode("ascii")
          observation_root = pathlib.Path(os.environ["LAPLACE_CORPUS_EVIDENCE"])
          (observation_root / "ingest-observation.sql").write_text(journal_sql)
          journal_environment = {k: v for k, v in environment.items() if not k.startswith("PG")}
          journal_environment["PGOPTIONS"] = "-c default_transaction_read_only=on -c statement_timeout=5000 -c lock_timeout=1000"
          try:
              observed = subprocess.run([environment["LAPLACE_PG_PREFIX"] + "/bin/psql",
                  "-X", "-w", "-qAt", "-h", "/var/run/postgresql", "-p", "5432",
                  "-U", "laplace_admin", "-d", "laplace", "-v", "ON_ERROR_STOP=1",
                  "-c", journal_sql], env=journal_environment, stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=20, check=True)
              if len(observed.stdout) > 131072:
                  raise ValueError("ingest observation output bound exceeded")
              observation = {"status": "observed", "scope": "Global operational journal and same-database clients; no process ownership or recorded-game attribution.",
                             "value": json.loads(observed.stdout)}
          except (OSError, ValueError, subprocess.SubprocessError) as error:
              observation = {"status": "unavailable", "errorType": type(error).__name__}
          (observation_root / "ingest-observation.json").write_text(json.dumps(observation, sort_keys=True) + "\n")
          print("CORPUS_INGEST_OBSERVATION " + json.dumps(observation, sort_keys=True), flush=True)
          os.execvpe(sys.executable, [sys.executable, "scripts/chess-runtime-env.py", "--prefix",
              environment["LAPLACE_INSTALL_PREFIX"], "--", sys.executable,
              "scripts/measure-installed-chess-corpus.py", *sys.argv[1:]], environment)
          PY
            fi
          ' 2>&1 | tee "$LAPLACE_CORPUS_EVIDENCE/execution.log"

      - name: Retain corpus result summary
        if: always()
        env:
          CORPUS_STEP_OUTCOME: ${{ steps.corpus_measurement.outcome }}
          CORPUS_REQUESTED_INPUTS: ${{ toJSON(inputs) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["LAPLACE_CORPUS_EVIDENCE"])
          path = root / "corpus/receipt.json"
          (root / "workflow-result.json").write_text(json.dumps({
              "schema": "laplace.chess-corpus-workflow-result/v1",
              "sourceSha": os.environ["GITHUB_SHA"],
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "stepOutcome": os.environ["CORPUS_STEP_OUTCOME"],
              "requestedInputs": json.loads(os.environ["CORPUS_REQUESTED_INPUTS"]),
              "observedUtc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "scope": "Workflow outcome only; checkpoint presence does not certify completion or a rate."
          }, sort_keys=True) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Authentic existing-corpus measurement\n\n")
              summary.write("Exact source: " + os.environ["GITHUB_SHA"] + "\n\n")
              if path.is_file():
                  receipt = json.loads(path.read_text())
                  summary.write("Status: " + receipt["status"] + "\n\n")
                  for row in receipt.get("phases", []):
                      summary.write("- " + row["name"] + ": " + row["status"] + "\n")
                  measured = receipt.get("measurement")
                  if measured:
                      summary.write("\nRecorded measurement: " + json.dumps(measured, allow_nan=False) + "\n")
                  summary.write("\nSource-built CLI; existing installed PostgreSQL/native binding. "
                                "Observed local file identity does not authenticate remote acquisition. "
                                "Replays are never counted as new PLAYING occurrences.\n")
              else:
                  summary.write("No completed wrapper receipt; inspect execution logs.\n")
          manifest = []
          for item in sorted(root.rglob("*")):
              if not item.is_file() or item.name == "artifact-sha256.json":
                  continue
              digest = hashlib.sha256()
              with item.open("rb") as handle:
                  for block in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(block)
              manifest.append({"path": str(item.relative_to(root)), "bytes": item.stat().st_size,
                               "sha256": digest.hexdigest()})
          (root / "artifact-sha256.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Upload complete corpus evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-chess-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LAPLACE_CORPUS_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 90
