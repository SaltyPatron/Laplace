name: Seed — chess eval census

on:
  workflow_dispatch:
    inputs:
      database:
        description: "target database"
        type: choice
        options: [laplace]
        default: laplace

permissions:
  contents: read

jobs:
  seed:
    uses: ./.github/workflows/_ingest.yml
    with:
      source: chess-eval
      path: ""
      database: ${{ inputs.database }}
      timeout_minutes: 720
