name: Supersede queued worktree operator with authoritative checkout
on:
  push:
    branches: ['verify/chess-floor-serving-controls-20260916']
permissions:
  contents: read
  actions: write
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Normally cancel only the exact queued superseded operation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, time, urllib.request
          base="https://api.github.com/repos/SaltyPatron/Laplace"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}
          run_id=35147320006
          def request(path, method="GET"):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers,method=method),timeout=20) as response:
                  raw=response.read(2097153)
                  if len(raw)>2097152: raise ValueError("metadata exceeds bound")
                  return json.loads(raw) if raw else None
          current=request("/actions/runs/"+str(run_id))
          assert current["head_sha"]=="f6f128c5d3005b39352474422a85bee72bd0cd3d"
          assert current["path"]==".github/workflows/chess-floor-serving-controls.yml"
          assert current["head_branch"]=="verify/chess-floor-serving-controls-20260916"
          assert current["run_attempt"]==1
          jobs=request("/actions/runs/"+str(run_id)+"/jobs?per_page=100")["jobs"]
          if current["status"]=="completed" and current["conclusion"]=="cancelled":
              print("SUPERSEDED_OPERATION_ALREADY_CANCELLED",run_id)
          else:
              assert current["status"] in ("queued","pending","waiting","requested"), current["status"]
              assert jobs and all(job["status"] in ("queued","waiting","pending") for job in jobs)
              request("/actions/runs/"+str(run_id)+"/cancel","POST")
              print("SUPERSEDED_OPERATION_CANCEL_ACK "+json.dumps({"run":run_id,"source":current["head_sha"],"observedStatus":current["status"],"jobIds":[j["id"] for j in jobs]}),flush=True)
              for unused in range(15):
                  current=request("/actions/runs/"+str(run_id))
                  if current["status"]=="completed": break
                  time.sleep(2)
              assert current["status"]=="completed" and current["conclusion"]=="cancelled"
              print("SUPERSEDED_OPERATION_TERMINAL "+json.dumps({"run":run_id,"status":current["status"],"conclusion":current["conclusion"]}),flush=True)
          PY
      - name: Verify exact current source and bounded operation syntax
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work="/build/laplace/work/coherent-final-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo install -d -m 0775 -o "$(id -u)" -g "$(id -g)" "$work"
          export TMPDIR="$work/tmp" TMP="$work/tmp" TEMP="$work/tmp"
          unset LAPLACE_BUILD_ROOT
          mkdir -p "$TMPDIR" "$work/source"
          cd "$work/source"
          git init -q
          git remote add origin https://github.com/SaltyPatron/Laplace.git
          git fetch --no-tags --depth=1 origin 6ee90d9e805eeb4cca126067c5a41e7a5f3698df
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = '6ee90d9e805eeb4cca126067c5a41e7a5f3698df'
          test "$(git rev-parse HEAD^{tree})" = '0847ccbc8340f1eb629355243913c0a306d9aa3e'
          python3 -B - <<'PY'
          import ast,base64,hashlib,json,os,pathlib,re,subprocess,urllib.request,yaml
          blob="79ee8a670f1fd32235c226e784b2552c13d8ae95"
          request=urllib.request.Request("https://api.github.com/repos/SaltyPatron/Laplace/git/blobs/"+blob,
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(request,timeout=30) as response: payload=response.read(131073)
          assert len(payload)<=131072
          metadata=json.loads(payload)
          raw=base64.b64decode(metadata["content"])
          assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\x00"+raw).hexdigest()==blob
          workflow=yaml.load(raw,Loader=yaml.BaseLoader)
          assert workflow["jobs"]["native"]["env"]["TARGET_SHA"]=="6ee90d9e805eeb4cca126067c5a41e7a5f3698df"
          assert workflow["jobs"]["native"]["env"]["TARGET_TREE"]=="0847ccbc8340f1eb629355243913c0a306d9aa3e"
          assert workflow["jobs"]["native"]["timeout-minutes"]=="200"
          scripts=[step["run"] for step in workflow["jobs"]["native"]["steps"] if "run" in step]
          python_count=inner_count=0
          for script in scripts:
              subprocess.run(["bash","-n"],input=script,text=True,check=True,timeout=10)
              for delimiter in ("NATIVE","MANAGED_READINESS"):
                  for inner in re.findall(r"(?ms)^[^\n]*<<'"+delimiter+r"'[^\n]*\n(.*?)^"+delimiter+r"$",script):
                      subprocess.run(["bash","-n"],input=inner,text=True,check=True,timeout=10)
                      inner_count+=1
              for module in re.findall(r"(?ms)^[^\n]*<<'PY'[^\n]*\n(.*?)^PY$",script):
                  ast.parse(module)
                  python_count+=1
          assert inner_count==2 and python_count==7,(inner_count,python_count)
          pathlib.Path(os.environ["TMPDIR"],"bound-operation.yml").write_bytes(raw)
          print("BOUND_OPERATION_SYNTAX_PASS "+json.dumps({"blob":blob,"source":"6ee90d9e805eeb4cca126067c5a41e7a5f3698df","outerBash":len(scripts),"innerBash":inner_count,"python":python_count}))
          PY
          echo AUTHORITATIVE_OPERATION_SYNTAX_QUALIFIED
