<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:656px;height:864px;background:#FAFCFF;" width="656px" height="864px" viewBox="0 0 656 864" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="656" height="864" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="6"><text x="185.221" y="34.533" fill="#000" font-size="14" textLength="284.368" font-weight="700">UCI connector — engine verification probe</text></g><ellipse cx="275.542" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="201.493" y="93.609" width="148.098" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="211.493" y="116.066" fill="#000" font-size="12" textLength="128.098">Open configured engine</text><rect x="174.821" y="148.703" width="201.441" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="184.821" y="171.16" fill="#000" font-size="12" textLength="181.441">Start 120-second lifetime deadline</text><rect x="191.168" y="203.797" width="168.746" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="201.168" y="226.254" fill="#000" font-size="12" textLength="148.746">Send uci; receive until uciok</text><rect x="172.158" y="258.891" width="206.768" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="182.158" y="281.348" fill="#000" font-size="12" textLength="186.768">Send isready; receive until readyok</text><rect x="120.46" y="313.984" width="310.162" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="130.46" y="336.441" fill="#000" font-size="12" textLength="290.162">Send ucinewgame; send isready; receive until readyok</text><rect x="159.8" y="369.078" width="231.482" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="169.8" y="391.535" fill="#000" font-size="12" textLength="211.482">Send position startpos; send go depth 1</text><rect x="203.511" y="424.172" width="144.061" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="213.511" y="446.629" fill="#000" font-size="12" textLength="124.061">Receive until bestmove</text><polygon points="123.593,479.266,427.49,479.266,439.49,491.266,427.49,503.266,123.593,503.266,111.593,491.266,123.593,479.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="123.593" y="495.767" fill="#000" font-size="11" textLength="303.896">Last retained line exactly bestmove 0000 or bestmove (none)?</text><text x="94.476" y="488.849" fill="#000" font-size="11" textLength="17.118">yes</text><text x="439.49" y="488.849" fill="#000" font-size="11" textLength="12.235">no</text><rect x="35.578" y="513.266" width="132.031" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="45.578" y="535.723" fill="#000" font-size="12" textLength="112.031">Throw no-move error</text><rect x="281.747" y="513.266" width="335.486" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="291.747" y="535.723" fill="#000" font-size="12" textLength="315.486">Print profile metadata, UTC time and retained protocol lines</text><polygon points="275.542,554.359,287.542,566.359,275.542,578.359,263.542,566.359,275.542,554.359" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="224.18" y="598.359" width="102.723" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="234.18" y="620.816" fill="#000" font-size="12" textLength="82.723">Dispose engine</text><ellipse cx="275.542" cy="664.453" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="275.542" cy="664.453" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="275.542" y1="73.609" x2="275.542" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="271.542,83.609,275.542,93.609,279.542,83.609,275.542,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="275.542" y1="128.703" x2="275.542" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="271.542,138.703,275.542,148.703,279.542,138.703,275.542,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="275.542" y1="183.797" x2="275.542" y2="203.797" style="stroke:#181818;stroke-width:1;"/><polygon points="271.542,193.797,275.542,203.797,279.542,193.797,275.542,197.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="275.542" y1="238.891" x2="275.542" y2="258.891" style="stroke:#181818;stroke-width:1;"/><polygon points="271.542,248.891,275.542,258.891,279.542,248.891,275.542,252.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="275.542" y1="293.984" x2="275.542" y2="313.984" style="stroke:#181818;stroke-width:1;"/><polygon points="271.542,303.984,275.542,313.984,279.542,303.984,275.542,307.984" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="275.542" y1="349.078" x2="275.542" y2="369.078" style="stroke:#181818;stroke-width:1;"/><polygon points="271.542,359.078,275.542,369.078,279.542,359.078,275.542,363.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="275.542" y1="404.172" x2="275.542" y2="424.172" style="stroke:#181818;stroke-width:1;"/