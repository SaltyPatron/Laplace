name: Qualify private PostgreSQL topology owner
on:
  push:
    branches: [verify/chess-floor-serving-controls-20260916]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TMPDIR: /build/laplace/work/topology-controls/tmp
      TMP: /build/laplace/work/topology-controls/tmp
      TEMP: /build/laplace/work/topology-controls/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2335b0543cf7d47901d0d74b11db9bb8a20668cc
          persist-credentials: false
      - name: Execute every topology control on exact correction
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$TMPDIR"
          python3 -m venv /build/laplace/work/topology-controls/venv
          /build/laplace/work/topology-controls/venv/bin/pip -q install PyYAML==6.0.2
          test "$(git rev-parse HEAD)" = 2335b0543cf7d47901d0d74b11db9bb8a20668cc
          test "$(git rev-parse HEAD^{tree})" = eea711191b2f5df2c99127435fe701d8e3ff857d
          timeout --signal=TERM --kill-after=5s 180s /build/laplace/work/topology-controls/venv/bin/python scripts/test-actions-topology.py -v
          test -z "$(git status --porcelain --untracked-files=all)"
