<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:458px;height:545px;background:#FAFCFF;" width="458px" height="545px" viewBox="0 0 458 545" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="458" height="545" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="5"><text x="34.978" y="34.533" fill="#000" font-size="14" textLength="386.244" font-weight="700">Monorepo — code candidate through shared forward SQL</text></g><ellipse cx="227.1" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="145.387" y="93.609" width="163.426" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="155.387" y="116.066" fill="#000" font-size="12" textLength="143.426">Open substrate connection</text><rect x="45.678" y="148.703" width="362.844" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="55.678" y="171.16" fill="#000" font-size="12" textLength="342.844">Bind prompt, steps, stride, spread, top-k and feedback root array</text><rect x="16" y="203.797" width="422.199" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="226.254" fill="#000" font-size="12" textLength="402.199">SELECT from generation.forward_text with null seed, fixed 4/16 parameters</text><text x="26" y="241.348" fill="#000" font-size="12" textLength="204.123">and ordered feedback as prior_frontier</text><rect x="164.412" y="273.984" width="125.375" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="174.412" y="296.441" fill="#000" font-size="12" textLength="105.375">Order result by step</text><rect x="42.669" y="329.078" width="368.861" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="52.669" y="351.535" fill="#000" font-size="12" textLength="348.861">Concatenate nonnull entity text; retain whether any rows occurred</text><rect x="85.706" y="384.172" width="282.787" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="95.706" y="406.629" fill="#000" font-size="12" textLength="262.787">Return null for no rows, otherwise assembled text</text><ellipse cx="227.1" cy="450.266" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="227.1" cy="450.266" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="227.1" y1="73.609" x2="227.1" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="223.1,83.609,227.1,93.609,231.1,83.609,227.1,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="227.1" y1="128.703" x2="227.1" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="223.1,138.703,227.1,148.703,231.1,138.703,227.1,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="227.1" y1="183.797" x2="227.1" y2="203.797" style="stroke:#181818;stroke-width:1;"/><polygon points="223.1,193.797,227.1,203.797,231.1,193.797,227.1,197.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="227.1" y1="253.984" x2="227.1" y2="273.984" style="stroke:#181818;stroke-width:1;"/><polygon points="223.1,263.984,227.1,273.984,231.1,263.984,227.1,267.984" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="227.1" y1="309.078" x2="227.1" y2="329.078" style="stroke:#181818;stroke-width:1;"/><polygon points="223.1,319.078,227.1,329.078,231.1,319.078,227.1,323.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="227.1" y1="364.172" x2="227.1" y2="384.172" style="stroke:#181818;stroke-width:1;"/><polygon points="223.1,374.172,227.1,384.172,231.1,374.172,227.1,378.172" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="227.1" y1="419.266" x2="227.1" y2="439.266" style="stroke:#181818;stroke-width:1;"/><polygon points="223.1,429.266,227.1,439.266,231.1,429.266,227.1,433.266" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="15"><text x="35.224" y="480.646" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="24.938" y="493.225" fill="#888" font-size="10" textLength="406.323">claimed. Entire ForwardCodeAsync adapter reviewed. It does not select a language-specific</text><text x="40.785" y="505.803" fill="#888" font-size="10" textLength="374.629">model or source family; requested modality is not supplied to this SQL call. The code</text><text x="30.514" y="518.381" fill="#888" font-size="10" textLength="395.171">service separately uses modality for grammar composition and verification. Native shared</text><text x="27.44" y="530.959" fill="#888" font-size="10" textLength="401.318">forward and realization paths remain linked rather than inferred from the adapter comment.</text></g><?plantuml-src JLBBKXin4BplLqnL3hc0N-07S28kN4aL8GdcJesbMQyAhQH8MZlEAH-HByoNfBKs52UfHZFTFQt-I7SxeyKfkQPx3fQL33c4uUa-M7URb2Dd6IvZfuSFOPj-sjFnzlOehDDWwRLyjtoGE529rfzl9zCPBIuNzSLeDfekvhEvMkZvL7XHw_5CZwxaWaTNuzdcifRnJ4qszNop6SydKyrwF9gC9pAUgYgz61SuSaiRLY_Rw3kdbzxwI1zMjwlbQlMk8pMi_TwuBTLiaxnxqL9pP_FAk_p0hT2QNLfBD7MLJRP2NxtpKOAdVt_-ai8YfDXfex4SvGQaswQWHz5K-xZdg6dzuxvAcMEkhhy5SPHUtS2ySwAoyUwcklvadAOGVHlo6QKi8PKZmdES8SAvCye-dByG2AaMqMLFYjvduXZv08prtVtTyebgeD1Md805u8EJakSilpBjJMx8TTPI0iOPrUONn5uEnpFgBP0iCLM5mqSj_IAlN9mWqFZu30ANZKHGVYjD52N1DTeSUkKeBxrJMD6LDHtM