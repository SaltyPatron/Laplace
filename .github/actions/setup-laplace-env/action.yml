name: Set up Laplace build/runtime env
description: Export runtime environment and, only when requested, the installed CMake tool.

inputs:
  use_cmake:
    description: "resolve the pinned CMake tool for a build-capable job"
    required: false
    default: "true"
  provision_tools:
    description: "allow this explicit operator job to install the pinned CMake tool"
    required: false
    default: "false"
  require_built_revision:
    description: "require the persistent runtime to have been built from this exact checkout revision"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Select shared runtime environment
      shell: bash
      env:
        LAPLACE_SETUP_USE_CMAKE: ${{ inputs.use_cmake }}
        LAPLACE_SETUP_REQUIRE_BUILT_REVISION: ${{ inputs.require_built_revision }}
        LAPLACE_PROVISION_TOOLS: ${{ inputs.provision_tools == 'true' && '1' || '0' }}
      run: source scripts/ci-environment.sh
