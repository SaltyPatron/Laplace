name: Correct canonical identity regressions and preserve current lifecycle
on:
  push:
    branches: [review/canonical-identity-20260917]
    paths: [.github/workflows/canonical-identity-qualification.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: 711f9d71d739d22589d960b0d37b9920f845e742
      EXTERNAL: 5fbcaca34fc882fa376e49fe595302dd092a098d
      COMMON: ea4cfa7382086feddeb608723b7c72164e5e1499
      MANIFEST: e586efa601c175c05ac718e891a7a7b8a54a3dbd
      CANDIDATE_REF: review/canonical-identity-20260917
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge exact external history and reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          umask 0002
          evidence_root="/build/laplace/work/identity-followup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo install -d -m 2775 -o "$(id -u)" -g "$(id -g)" /build/laplace/work
          test ! -e "$evidence_root"
          mkdir -m 0700 "$evidence_root"
          export EVIDENCE_ROOT="$evidence_root"
          printf 'EVIDENCE_ROOT=%s\n' "$evidence_root" >> "$GITHUB_ENV"
          cp .github/workflows/canonical-identity-qualification.yml "$evidence_root/workflow.yml"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD)" = ".github/workflows/canonical-identity-qualification.yml"
          test -z "$(git status --porcelain --untracked-files=all)"
          git config user.name "Laplace qualification"
          git config user.email "qualification@users.noreply.github.com"
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_auth"
          unset git_auth
          git fetch --no-tags origin "$EXTERNAL"
          test "$(git merge-base HEAD "$EXTERNAL")" = "$COMMON"
          set +e
          git merge --no-commit --no-ff "$EXTERNAL" > "$evidence_root/merge.log" 2>&1
          merge_status=$?
          set -e
          cat "$evidence_root/merge.log"
          git ls-files -u > "$evidence_root/conflict-index.txt"
          export MERGE_STATUS="$merge_status"
          python3 - <<'PY'
          import ast,base64,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          root=Path(os.environ["EVIDENCE_ROOT"])
          def git(*args): return subprocess.check_output(["git",*args],text=True).strip()
          conflict="scripts/test-ci-workspace.py"
          paths=git("diff","--name-only","--diff-filter=U").splitlines()
          assert paths in ([],[conflict]),paths
          if os.environ["MERGE_STATUS"]!="0":
              assert paths==[conflict],(os.environ["MERGE_STATUS"],paths)
          if paths:
              expected_stages={"1":"6568aef5d5f9a7e29730d2bf73c7d595a92100cc","2":"4bd4ec37f381a65dac9e671fe2447c861db6ba4a","3":"9ef6e73d87914a46ee644b53aa6fe6e1df1b6077"}
              for line in git("ls-files","-u").splitlines():
                  metadata,path=line.split("\t",1)
                  mode,sha,stage=metadata.split()
                  assert path==conflict and sha==expected_stages[stage],line
                  (root/("workspace-stage"+stage+".py")).write_bytes(subprocess.check_output(["git","cat-file","blob",sha]))
          assert git("rev-parse",os.environ["BASE"]+":"+conflict)=="4bd4ec37f381a65dac9e671fe2447c861db6ba4a"
          Path(conflict).write_bytes(subprocess.check_output(["git","show",os.environ["BASE"]+":"+conflict]))
          subprocess.run(["git","add","--",conflict],check=True)
          assert not git("ls-files","-u")
          expected=[".github/workflows/db-ops.yml",".github/workflows/laplace.yml",".github/workflows/seed.yml","scripts/product-ci.sh","scripts/test-parallel.sh","scripts/test-product-ci-artifact-ownership.py","scripts/test-seed-workflow-ownership.py"]
          arrivals=git("diff","--cached","--name-only",os.environ["GITHUB_SHA"]).splitlines()
          assert arrivals==expected,(arrivals,expected)
          preserved=[]
          for path in expected:
              sha=git("rev-parse",":"+path)
              if path=="scripts/test-parallel.sh":
                  external=subprocess.check_output(["git","show",os.environ["EXTERNAL"]+":"+path],text=True)
                  marker="  python3 scripts/test-cutechess-calibration.py\n"
                  assert external.count(marker)==1 and "test-chess-x11-runtime.py" not in external
                  assert Path(path).read_text()==external.replace(marker,marker+"  python3 scripts/test-chess-x11-runtime.py\n"),"lost incoming registration or qualified GUI control"
              elif path=="scripts/test-product-ci-artifact-ownership.py":
                  assert sha=="b4621b2aacf49d474c2444bd440a7556c9a33713",sha
              else:
                  assert sha==git("rev-parse",os.environ["EXTERNAL"]+":"+path),path
              preserved.append({"path":path,"merged_blob":sha,"incoming_blob":git("rev-parse",os.environ["EXTERNAL"]+":"+path)})
          def blob(sha):
              request=urllib.request.Request("https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/git/blobs/"+sha,
                  headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(request) as response: result=json.load(response)
              raw=base64.b64decode(result["content"])
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==sha
              return raw
          raw=blob(os.environ["MANIFEST"])
          (root/"overlay.json").write_bytes(raw)
          manifest=json.loads(raw)
          assert manifest["base"]==os.environ["BASE"] and manifest["external"]==os.environ["EXTERNAL"]
          for entry in manifest["files"]:
              path=entry["path"]
              current=subprocess.run(["git","rev-parse",":"+path],capture_output=True,text=True)
              actual=current.stdout.strip() if current.returncode==0 else None
              assert actual==entry["base"],(path,actual,entry["base"])
              raw=blob(entry["sha"])
              Path(path).write_bytes(raw)
              Path(path).chmod(int(entry["mode"],8)&0o777)
              if path.endswith(".py"): ast.parse(raw,filename=path)
              if path.endswith(".sh"): subprocess.run(["bash","-n",path],check=True)
              subprocess.run(["git","add","--",path],check=True)
              assert git("rev-parse",":"+path)==entry["sha"]
          for path in (".github/workflows/identity-storage-proof.yml",".github/workflows/identity-working-set-patch.yml","scripts/patch-identity-working-set.py"):
              assert subprocess.run(["git","cat-file","-e",":"+path],capture_output=True).returncode!=0,path
          (root/"preserved-main.json").write_text(json.dumps(preserved,indent=2)+"\n")
          (root/"workspace-resolution.json").write_text(json.dumps({"path":conflict,"retained_blob":git("rev-parse",":"+conflict),"scope":"preserve incoming strict prepublication gates and shared seed ownership, qualified maintenance/refusal controls and actual artifact revision proof"},indent=2)+"\n")
          PY
          git diff --cached --check
          git diff --cached --binary > "$evidence_root/reconciled.patch"
      - name: Execute actual lifecycle and maintenance controls
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-ci-workspace.py 2>&1 | tee "$EVIDENCE_ROOT/workspace-controls.log"
          python3 scripts/test-product-ci-artifact-ownership.py 2>&1 | tee "$EVIDENCE_ROOT/artifact-controls.log"
          python3 scripts/test-seed-workflow-ownership.py 2>&1 | tee "$EVIDENCE_ROOT/seed-controls.log"
          python3 scripts/test-qualify-canonical-identity-pg.py 2>&1 | tee "$EVIDENCE_ROOT/pg-helper-controls.log"
          python3 scripts/validate-pipeline.py 2>&1 | tee "$EVIDENCE_ROOT/pipeline-validation.log"
      - name: Publish qualified reconciliation to isolated candidate only
        shell: bash
        run: |
          set -euo pipefail
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_auth"
          unset git_auth
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git commit -m "Correct canonical identity regression fixtures and preserve shared lifecycle ownership"
          test "$(git rev-parse HEAD^1)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^2)" = "$EXTERNAL"
          test -z "$(git status --porcelain --untracked-files=all)"
          git ls-tree -r HEAD > "$EVIDENCE_ROOT/source-tree.txt"
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(["git",*args],text=True).strip()
          receipt={"status":"passed","scope":"real Git reconciliation and actual lifecycle, artifact, seed, PG helper controls; corrected SQL/native regression fixtures await actual private PostgreSQL execution","base":os.environ["BASE"],"external":os.environ["EXTERNAL"],"operator":os.environ["GITHUB_SHA"],"manifest":os.environ["MANIFEST"],"merged_commit":git("rev-parse","HEAD"),"tree":git("rev-parse","HEAD^{tree}"),"parents":git("show","-s","--format=%P","HEAD").split()}
          (Path(os.environ["EVIDENCE_ROOT"])/"source.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,indent=2))
          PY
          test "$(git ls-remote origin "refs/heads/$CANDIDATE_REF" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$CANDIDATE_REF"
      - name: Retain exact merge and controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-identity-followup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
