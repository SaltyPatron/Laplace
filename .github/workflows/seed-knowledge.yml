name: Seed — knowledge

on:
  workflow_dispatch:
    inputs:
      source:
        description: "knowledge source"
        type: choice
        required: true
        options: [omw, conceptnet, atomic2020, ud, wiktionary, tatoeba, opensubtitles]
      path:
        description: "optional file or corpus path"
        type: string
        default: ""
      langs:
        description: "optional language scope; blank means all"
        type: string
        default: ""
      database:
        description: "target database"
        type: choice
        options: [laplace]
        default: laplace
      evict_before_ingest:
        description: "retract this source before ingest"
        type: boolean
        default: false
      evict_confirm:
        description: "exact decomposer source name required for eviction"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  seed:
    uses: ./.github/workflows/_ingest.yml
    with:
      source: ${{ inputs.source }}
      path: ${{ inputs.path }}
      langs: ${{ inputs.langs }}
      database: ${{ inputs.database }}
      timeout_minutes: 720
      evict_before_ingest: ${{ inputs.evict_before_ingest }}
      evict_confirm: ${{ inputs.evict_confirm }}
