name: Build and qualify canonical entity identity
on:
  push:
    branches: [review/canonical-identity-20260917]
    paths: [.github/workflows/canonical-identity-qualification.yml]
permissions:
  contents: write
jobs:
  canonical-identity-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Prepare permanent owned qualification paths
        shell: bash
        run: |
          set -euo pipefail
          umask 0002
          for parent in /build/laplace/work /build/laplace/build; do
            if [[ ! -d "$parent" ]]; then
              sudo install -d -m 2775 -o "$(id -u)" -g "$(id -g)" "$parent"
            fi
            test -w "$parent"
          done
          qualification_dir="/build/laplace/work/canonical-identity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          build_dir="/build/laplace/build/canonical-identity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          source_dir="$GITHUB_WORKSPACE"
          test ! -e "$qualification_dir"
          test ! -e "$build_dir"
          mkdir -m 0700 "$qualification_dir" "$build_dir"
          mkdir -m 0700 "$qualification_dir/evidence" "$qualification_dir/tmp"
          printf 'QUALIFICATION_DIR=%s\nQUALIFICATION_BUILD=%s\nQUALIFICATION_SOURCE=%s\n' "$qualification_dir" "$build_dir" "$source_dir" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s/tmp\nTMP=%s/tmp\nTEMP=%s/tmp\n' "$qualification_dir" "$qualification_dir" "$qualification_dir" >> "$GITHUB_ENV"
      - name: Read exact qualifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up official .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Reconcile reviewed canonical identity changes with current main
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/canonical-identity-qualification.yml "$QUALIFICATION_DIR/evidence/workflow.yml"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 87ea18cb2247f7f305b801427fe0365cfed90bd7
          test -z "$(git status --porcelain --untracked-files=all)"
          git config user.name "Laplace qualification"
          git config user.email "qualification@users.noreply.github.com"
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_auth"
          unset git_auth
          git fetch --no-tags origin 96a02adb064ad221e17ae275e076b11816b6a517
          git merge --no-commit --no-ff 96a02adb064ad221e17ae275e076b11816b6a517 2>&1 | tee "$QUALIFICATION_DIR/evidence/main-merge.log"
          python3 - <<'PY' 2>&1 | tee "$QUALIFICATION_DIR/evidence/overlay.log"
          import ast,base64,concurrent.futures,hashlib,json,os,re,subprocess,urllib.request
          from pathlib import Path
          root=Path(os.environ["QUALIFICATION_SOURCE"])
          evidence=Path(os.environ["QUALIFICATION_DIR"])/"evidence"
          manifest_sha="022b7a48cfb0fdf346927cbae1af7022f17bbb24"
          def git(*args): return subprocess.check_output(["git",*args],cwd=root,text=True).strip()
          def fetch(sha):
              request=urllib.request.Request("https://api.github.com/repos/SaltyPatron/Laplace/git/blobs/"+sha,
                  headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(request,timeout=60) as response: obj=json.load(response)
              raw=base64.b64decode(obj["content"],validate=False)
              assert obj["sha"]==sha and obj["encoding"]=="base64" and len(raw)==obj["size"]
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==sha
              return raw
          raw=fetch(manifest_sha); manifest=json.loads(raw); leaves=manifest["leaves"]
          assert len(leaves)==87 and len({item["path"] for item in leaves})==87
          (evidence/"manifest.json").write_bytes(raw)
          required={item["sha"] for item in leaves}|{item["base"] for item in leaves if item["base"]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              bodies=dict(zip(sorted(required),pool.map(fetch,sorted(required))))
          applied=[]
          for index,item in enumerate(leaves):
              path=Path(item["path"]); assert not path.is_absolute() and ".." not in path.parts
              target=root/path
              observed=git("hash-object",str(path)) if target.exists() else None
              assert observed==item["merge_current"], ("unreviewed changed input",str(path),observed,item)
              if observed==item["base"]:
                  target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(bodies[item["sha"]])
                  method="exact reviewed replacement"
              else:
                  assert observed and item["base"], ("unexpected added-path conflict",item)
                  prefix=evidence/("merge-"+str(index));prefix.mkdir()
                  (prefix/"current").write_bytes(target.read_bytes())
                  (prefix/"base").write_bytes(bodies[item["base"]])
                  (prefix/"candidate").write_bytes(bodies[item["sha"]])
                  result=subprocess.run(["git","merge-file","-p",str(prefix/"current"),str(prefix/"base"),str(prefix/"candidate")],
                      stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  (prefix/"result").write_bytes(result.stdout)
                  (prefix/"stderr").write_bytes(result.stderr)
                  assert result.returncode==0, ("three-way source conflict",str(path),str(prefix))
                  target.write_bytes(result.stdout);method="git merge-file current/base/candidate"
              target.chmod(int(item["mode"],8))
              applied.append({**item,"result":git("hash-object",str(path)),"method":method})
          for path in manifest["excluded_automation"]: assert not (root/path).exists(),path
          builder=(root/"app/Laplace.Substrate/Crud/SubstrateChangeBuilder.cs").read_text()
          assert "MeasureGrowingBuilder" in builder and "AddEntityInterpretation(EntityInterpretationRow row)" in builder
          subprocess.run(["git","diff","--check"],cwd=root,check=True)
          # Parse every shell body and its actual Python here-docs before building.
          lines=(evidence/"workflow.yml").read_text().splitlines();index=0;blocks=0;py=0
          while index<len(lines):
              if lines[index]!="        run: |":index+=1;continue
              index+=1;body=[]
              while index<len(lines) and (not lines[index].strip() or lines[index].startswith("          ")):
                  body.append(lines[index][10:]);index+=1
              script="\n".join(body)+"\n";blocks+=1
              subprocess.run(["bash","-n"],input=script,text=True,check=True,timeout=10)
              for match in re.finditer(r"^python3 - <<'PY'[^\n]*\n(.*?)^PY$",script,re.M|re.S):
                  ast.parse(match.group(1));py+=1
          receipt={"operator":os.environ["GITHUB_SHA"],"manifest_blob":manifest_sha,
              "base_merge":manifest["merge_commit"],"main":manifest["main_commit"],"files":applied,
              "shell_blocks":blocks,"python_bodies":py,
              "scope":"reviewed source assembled by real three-way merge; execution pending"}
          (evidence/"source.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps({"reviewed_leaves":len(applied),"three_way":[x for x in applied if x["method"].startswith("git")]}),flush=True)
          PY
          git add --all
          git diff --cached --check
          git diff --cached --binary > "$QUALIFICATION_DIR/evidence/reconciled.patch"
          git commit -m "Preserve canonical entity identity and all observed interpretations"
          git ls-tree -r HEAD > "$QUALIFICATION_DIR/evidence/source-tree.txt"
          git rev-parse HEAD > "$QUALIFICATION_DIR/evidence/source-commit.txt"
          test "$(git ls-remote origin refs/heads/review/canonical-identity-20260917 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/review/canonical-identity-20260917
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          printf 'LAPLACE_BUILD_ROOT=%s/managed\nLAPLACE_ENGINE_BUILD=%s\nLAPLACE_PERFCACHE_BIN=%s/core/perfcache/laplace_t0_perfcache.bin\nLAPLACE_CHESS_PERFCACHE_BIN=%s/core/perfcache/laplace_chess_position_perfcache.bin\nLAPLACE_CHESS_TRANSITION_BIN=%s/core/perfcache/laplace_chess_transition_perfcache.bin\nLD_LIBRARY_PATH=%s/core\n' "$QUALIFICATION_BUILD" "$QUALIFICATION_BUILD" "$QUALIFICATION_BUILD" "$QUALIFICATION_BUILD" "$QUALIFICATION_BUILD" "$QUALIFICATION_BUILD" >> "$GITHUB_ENV"
          printf 'LAPLACE_EXTERNAL=%s/external\n' "$QUALIFICATION_DIR" >> "$GITHUB_ENV"
          dotnet --info | tee "$QUALIFICATION_DIR/evidence/dotnet.txt"
      - name: Acquire existing pinned native build inputs
        shell: bash
        run: |
          set -euo pipefail
          qualification_dir="$QUALIFICATION_DIR"
          timeout --signal=TERM --kill-after=15s 300s sudo apt-get update 2>&1 | tee "$qualification_dir/evidence/apt-update.log"
          timeout --signal=TERM --kill-after=15s 300s sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libicu-dev libxml2-dev zlib1g-dev bison flex 2>&1 | tee "$qualification_dir/evidence/apt-install.log"
          cc --version | tee "$qualification_dir/evidence/compiler.txt"
          cmake --version | tee "$qualification_dir/evidence/cmake.txt"
          python3 - <<'PY' 2>&1 | tee "$qualification_dir/evidence/acquire.log"
          import concurrent.futures, hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          root=Path(os.environ["QUALIFICATION_DIR"])
          external=root/"external";external.mkdir()
          ucd=root/"unicode";ucd.mkdir()
          evidence=root/"evidence"
          dependencies=[{"archive_sha256":"b8352186f14559127a324333c3378f4208a2de9aea855746bf2fcd1f883efef1","name":"blake3","revision":"f3149ec5bb5449af877ba20377a11008ff499fa2","url":"https://github.com/BLAKE3-team/BLAKE3.git"},{"archive_sha256":"5f1252d70f39d43243b1346f3cdeb944178d6d28cd18c44ed3614625d371e6f0","name":"eigen","revision":"bc3b39870ecb690a623a3f49149a358b95c5781d","url":"https://gitlab.com/libeigen/eigen.git"},{"archive_sha256":"61bd3406aceed3ae5304fa7d37b346aa0e0a896a6be5b0c0db50ec2db0544663","name":"fathom","revision":"c9c6fef0dddc05d2e242c183acf5833149ab676d","url":"https://github.com/jdart1/Fathom"},{"archive_sha256":"080653414b45e6dbe93380c3a65a2c6a6cbf376f9dbc488587c78d73d1b05b77","name":"googletest","revision":"063de7e9578f82b369302001269680b4b1553359","url":"https://github.com/google/googletest.git"},{"archive_sha256":"166ec535ee8908bdec1f03a9a6c71e9621cae881a820396a2cd1386e035dd7be","name":"spectra","revision":"6841bcbacaa0f0a8446210314e682057a084be4e","url":"https://github.com/yixuan/spectra.git"},{"archive_sha256":"033a2ceab11bd6cebbcddba8d5e1d8127bc9e49446d0cd74bf10f991fa80ade3","name":"tree-sitter","revision":"d97971e24500218865c05ed1febdee2acf41bae1","url":"https://github.com/tree-sitter/tree-sitter.git"},{"archive_sha256":"c54b7a5fc55b530887a7e8939575da79a8a6490c124727f836cea7ebeba4ac00","name":"tree-sitter-grammars/tree-sitter-python","revision":"26855eabccb19c6abf499fbc5b8dc7cc9ab8bc64","url":"https://github.com/tree-sitter/tree-sitter-python"},{"archive_sha256":"9194799a7a7dcedf020ba2558fc92fc430633d73680243ae1f1d9de78c719528","name":"tree-sitter-grammars/tree-sitter-c","revision":"b780e47fc780ddc8da13afa35a3f4ed5c157823d","url":"https://github.com/tree-sitter/tree-sitter-c"},{"archive_sha256":"a162edeecfebe736bc561d826dd6d694b78ac970f70a1d4b6dbf5f07429a768a","name":"tree-sitter-grammars/tree-sitter-cpp","revision":"8b5b49eb196bec7040441bee33b2c9a4838d6967","url":"https://github.com/tree-sitter/tree-sitter-cpp"},{"archive_sha256":"