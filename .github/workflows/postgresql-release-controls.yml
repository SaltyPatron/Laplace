name: Read failed installed substrate regression evidence
on:
  push:
    branches: [verify/postgresql-activation-20260916]
permissions:
  contents: read
jobs:
  observation:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 5
    steps:
      - name: Preserve actual completed native regression results
        shell: bash
        run: |
          set -euo pipefail
          umask 0077
          evidence="/build/laplace/recovery/installed-regression-observation/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$evidence"
          echo "OBSERVATION_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          export OBSERVATION_EVIDENCE="$evidence"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,stat,subprocess
          evidence=pathlib.Path(os.environ["OBSERVATION_EVIDENCE"])
          native=pathlib.Path("/build/laplace/recovery/native-install/35159665378-1")
          selected=json.loads((native/"selection.json").read_text())
          assert selected["source"]=="241b4550ed16d0e729e16823dcafdf28dd4dcd76"
          checkout=pathlib.Path(selected["checkout"])
          assert subprocess.check_output(["git","-C",str(checkout),"rev-parse","HEAD"],text=True).strip()==selected["source"]
          build=(checkout/"build").resolve(strict=True)
          assert build.is_relative_to("/build/laplace/build")
          results=build/"extension/laplace_substrate/tests/regress_output"
          report={"nativeRun":35159665378,"source":selected["source"],"build":str(build),"files":[]}
          for name in ("regression.diffs","regression.out","results/bootstrap.out","results/physicality_descriptor_admission.out"):
              source=results/name
              info=source.stat()
              assert stat.S_ISREG(info.st_mode) and info.st_size <= 64<<20
              raw=source.read_bytes()
              target=evidence/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(raw)
              row={"path":str(source),"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest(),"modifiedNs":info.st_mtime_ns}
              report["files"].append(row)
              print(json.dumps(row),flush=True)
              if name != "regression.out":
                  print(raw[:49152].decode("utf-8",errors="replace"),flush=True)
          (evidence/"observation.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report),flush=True)
          PY
      - name: Retain actual regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-regression-observation
          path: ${{ env.OBSERVATION_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 30
