lish updated operation and in-memory move state</text><polygon points="646.572,93.609,791.463,93.609,803.463,105.609,791.463,117.609,646.572,117.609,634.572,105.609,646.572,93.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="723.018" y="129.028" fill="#000" font-size="11" textLength="17.118">yes</text><text x="646.572" y="110.11" fill="#000" font-size="11" textLength="144.891">Restore missing live session?</text><text x="803.463" y="103.192" fill="#000" font-size="11" textLength="29.342">Finish</text><rect x="590.614" y="151.445" width="256.807" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="600.614" y="173.902" fill="#000" font-size="12" textLength="236.807">Read retained operation under recovery lock</text><rect x="520.592" y="221.539" width="396.852" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="530.592" y="243.996" fill="#000" font-size="12" textLength="376.852">Require ongoing, or explicit resumeRecording with CanRetryRecording</text><rect x="556.946" y="291.633" width="324.143" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="566.946" y="314.09" fill="#000" font-size="12" textLength="304.143">Replay every move legally from stored/default start board</text><rect x="574.29" y="361.727" width="289.455" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="584.29" y="384.184" fill="#000" font-size="12" textLength="269.455">Require final replay FEN agrees with retained FEN</text><rect x="509.576" y="431.82" width="418.883" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="519.576" y="454.277" fill="#000" font-size="12" textLength="398.883">Recreate play session and, when recording, live-game buffers and analysis</text><rect x="1049.184" y="13