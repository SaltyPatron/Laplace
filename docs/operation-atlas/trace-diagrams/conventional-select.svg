<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:530px;height:737px;background:#FAFCFF;" width="530px" height="737px" viewBox="0 0 530 737" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="530" height="737" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="6"><text x="51.927" y="34.533" fill="#000" font-size="14" textLength="424.409" font-weight="700">Conventional — selection, deduplication and provider coverage</text></g><ellipse cx="263.132" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="126.394" y="93.609" width="273.477" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="136.394" y="116.066" fill="#000" font-size="12" textLength="253.477">Load physical manifest and ordered policy rules</text><rect x="95.037" y="148.703" width="336.189" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="105.037" y="171.16" fill="#000" font-size="12" textLength="316.189">Require each rule has glob; exclusions need explicit reason</text><rect x="107.397" y="203.797" width="311.469" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="117.397" y="226.254" fill="#000" font-size="12" textLength="291.469">For each path apply all matching rules; last match wins</text><rect x="196.108" y="258.891" width="134.047" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="206.108" y="281.348" fill="#000" font-size="12" textLength="114.047">Filter selected entries</text><rect x="94.375" y="313.984" width="337.514" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="104.375" y="336.441" fill="#000" font-size="12" textLength="317.514">Resolve duplicates by SHA256 only among selected entries</text><rect x="66.689" y="369.078" width="392.885" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="76.689" y="391.535" fill="#000" font-size="12" textLength="372.885">Resolve text or enabled media provider for each unique selected entry</text><rect x="37.99" y="424.172" width="450.283" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="47.99" y="446.629" fill="#000" font-size="12" textLength="430.283">When video audio is required, video coverage also needs enabled audio provider</text><rect x="16" y="479.266" width="494.264" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="501.723" fill="#000" font-size="12" textLength="474.264">Summarize selected, excluded, duplicates, providers and inaccessible/unsupported bytes</text><rect x="88.724" y="534.359" width="348.816" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="98.724" y="556.816" fill="#000" font-size="12" textLength="328.816">Write per-path decisions then selected manifest and summary</text><rect x="214.46" y="589.453" width="97.344" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="224.46" y="611.91" fill="#000" font-size="12" textLength="77.344">Print summary</text><ellipse cx="263.132" cy="655.547" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="263.132" cy="655.547" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="263.132" y1="73.609" x2="263.132" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="259.132,83.609,263.132,93.609,267.132,83.609,263.132,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="263.132" y1="128.703" x2="263.132" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="259.132,138.703,263.132,148.703,267.132,138.703,263.132,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="263.132" y1="183.797" x2="263.132" y2="203.797" style="stroke:#181818;stroke-width:1;"/><polygon points="259.132,193.797,263.132,203.797,267.132,193.797,263.132,197.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="263.132" y1="238.891" x2="263.132" y2="258.891" style="stroke:#181818;stroke-width:1;"/><polygon points="259.132,248.891,263.132,258.891,267.132,248.891,263.132,252.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="263.132" y1="293.984" x2="263.132" y2="313.984" style="stroke:#181818;stroke-width:1;"/><polygon points="259.132,303.984,263.132,313.984,267.132,303.984,263.132,307.984" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="263.132" y1="349.078" x2="263.132" y2="369.078" style="stroke:#181818;stroke-width:1;"/><polygon points="259.132,359.078,263.132,369.078,267.132,359.078,263.132,363.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="263.132" y1="404.172" x2="263.132" y2="424.172" style="stroke:#181818;stroke-width:1;"/><polygon points="259.132,414.172,263.132,424.172,267.132,414.172,263.132,418.172" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="263.132" y1="459.266" x2="263.132" y2="479.266" style="stroke:#181818;stroke-width:1;"/><polygon points="259.132,469.266,263.132,479.266,267.132,469.266,263.132,473.266" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="263.132" y1="514.359" x2="263.132" y2="534.359" style="stroke:#181818;stroke-width:1;"/><polygon points="259.132,524.359,263.132,534.359,267.132,524.359,263.132,528.359" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="263.132" y1="569.453" x2="263.132" y2="589.453" style="stroke:#181818;stroke-width:1;"/><polygon points="259.132,579.453,263.132,589.453,267.132,579.453,263.132,583.453" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="263.132" y1="624.547" x2="263.132" y2="644.547" style="stroke:#181818;stroke-width:1;"/><polygon points="259.132,634.547,263.132,644.547,267.132,634.547,263.132,638.547" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="19"><text x="71.256" y="685.928" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="65.709" y="698.506" fill="#888" font-size="10" textLength="396.846">claimed. Complete selection module reviewed. Provider availability here is policy/manifest</text><text x="69.574" y="711.084" fill="#888" font-size="10" textLength="389.116">classification, not a decode or training acceptance run. Coverage uses byte totals and is</text><text x="128.78" y="723.662" fill="#888" font-size="10" textLength="270.703">not equivalent to successful processing of every selected file.</text></g><?plantuml-src dLEzRjim4Dxr50TqoEBObcNBLZ85GOqEGH3KGyRYH1uZ8XIfa9GJT-f3z0dx93tAlrawTADulE--dzCLVDrgILRG3JnWPr3GzRspMx9HEujc4hoOc7tXXxWi2AF7tGust-vcYnAAKaunBqfLYPhcQbcAQb7LvJol2rdLCodAPLdcbK0iYqBazMevcojSaSXpbHUBAhlwRoA138bqlg2pcAsg5SuNzPGfuQogSOcbh1Rp9P5OCPTABLPvELNrT3QdMO5bhiHobXTYkSH2rbburRP3ZotKA5vVlEkjl7V6UVYolblVhzSNBqA3qhrh-m8AJQ2BYYI5lObhP-CZjWGRj653NgiiwcW8BWN2dr-_uQHbnBsoxumMc3u1hOJEksIH1-6svF659qNqCRjvSCZLPXVujO4MhLOKuj3ZF3SGLnr3xS3tXi9jTlETtdhj2GX5Crn2Wm5UZAjlWJw4wGCF3M29M-aZqT0HF65mbhlNRCFGsM5i0BlEx01Dc