name: Seed — documents

# Direct/plain document ingestion. The operator-selected path is the content inventory;
# dataset-estate MANIFEST.tsv files in a parent or shared folder must not replace that
# inventory. Project Gutenberg moved out of test-data on 2026-09-03, so the workflow's
# named corpus choices follow the current physical estate rather than the retired layout.

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: "which document collection to ingest"
        type: choice
        required: true
        default: project-gutenberg
        options:
          - project-gutenberg # ProjectGutenberg/text — 195-file curated mini-collection
          - fixtures          # test-data/text — non-Gutenberg text fixtures only
          - electronics       # test-data/electronics — ham radio, morse, wireless
          - smoke-alice       # one Gutenberg book; validates the lane in seconds
          - path-override     # use the explicit `path` input
      path:
        description: "explicit path; when non-empty it wins over the corpus choice (single file, dir, or corpus root)"
        type: string
        default: ""
      database:
        description: "target DB (one database: laplace)"
        type: choice
        options: [laplace]
        default: laplace
      run_idempotency:
        description: "re-ingest and prove no double-count"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 2
    outputs:
      path: ${{ steps.pick.outputs.path }}
    steps:
      - id: pick
        run: |
          root="${LAPLACE_DATA_ROOT:-/vault/Data}"
          user_path="${{ inputs.path }}"

          if [ -n "$user_path" ]; then
            if [ ! -e "$user_path" ]; then
              echo "::error::path '$user_path' does not exist on this runner"; exit 1
            fi
            if [ "${{ inputs.corpus }}" != "path-override" ]; then
              echo "::notice::path given -- corpus '${{ inputs.corpus }}' ignored for this run."
            fi
            echo "resolved explicit path -> $user_path"
            echo "path=$user_path" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "${{ inputs.corpus }}" in
            project-gutenberg) p="$root/ProjectGutenberg/text" ;;
            fixtures)          p="$root/test-data/text" ;;
            electronics)       p="$root/test-data/electronics" ;;
            smoke-alice)       p="$root/ProjectGutenberg/text/alice.txt" ;;
            path-override)     p="" ;;
            *) echo "::error::unknown corpus '${{ inputs.corpus }}'"; exit 1 ;;
          esac
          if [ -z "$p" ]; then
            echo "::error::corpus=path-override requires the path input"; exit 1
          fi
          if [ ! -e "$p" ]; then
            echo "::error::$p does not exist on this runner"; exit 1
          fi
          echo "resolved corpus '${{ inputs.corpus }}' -> $p"
          echo "path=$p" >> "$GITHUB_OUTPUT"

  seed:
    needs: resolve
    uses: ./.github/workflows/_ingest.yml
    with:
      source: document
      path: ${{ needs.resolve.outputs.path }}
      database: ${{ inputs.database }}
      timeout_minutes: 480
      run_gate: true
      run_idempotency: ${{ inputs.run_idempotency }}
