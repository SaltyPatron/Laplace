name: Dispatch Original 2000-game pilot against the tested native generation

on:
  push:
    branches: ['diag/dispatch-original-chess-pilot-*']

permissions:
  contents: read
  actions: write

jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Original 2000-game pilot against the tested native generation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          REPOSITORY = "SaltyPatron/Laplace"
          EXPECTED_INSTALLED_SHA = "4fa186e38de10ee5cc768d38f33ec9663cf2e314"
          INSTALLED_LIFECYCLE_RUN_ID = 35120380132
          TARGET_REF = "verify/chess-corpus-pilot-20260916-4fa186e"
          OBSERVED_PGN = "/vault/Data/Games/Chess/Lumbras/otb/LumbrasGigaBase_OTB_2025.pgn"
          if not re.fullmatch(r"[0-9a-f]{40}", EXPECTED_INSTALLED_SHA) or INSTALLED_LIFECYCLE_RUN_ID <= 0:
              raise ValueError("exact source and lifecycle attempt identity must be supplied")
          if not re.fullmatch(r"verify/chess-corpus-pilot-[a-z0-9-]+", TARGET_REF):
              raise ValueError("pilot reference must use the dedicated non-triggering prefix")
          if not OBSERVED_PGN.startswith("/") or not OBSERVED_PGN.lower().endswith(".pgn") or "OBSERVED" in OBSERVED_PGN:
              raise ValueError("an actual observed absolute plain PGN must be selected")
          base = "https://api.github.com/repos/" + REPOSITORY
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2026-03-10"}
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers), timeout=30) as response:
                  raw = response.read(2 * 1024 * 1024 + 1)
              if len(raw) > 2 * 1024 * 1024:
                  raise ValueError("API metadata exceeded its bounded envelope")
              return json.loads(raw)
          run = api("/actions/runs/" + str(INSTALLED_LIFECYCLE_RUN_ID))
          if (run["head_sha"] != EXPECTED_INSTALLED_SHA or run["status"] != "completed"
                  or run["conclusion"] != "failure" or run["head_branch"] != "main"
                  or run["path"] != ".github/workflows/laplace.yml" or run["run_attempt"] != 1):
              raise ValueError("lifecycle does not match the explicitly observed failed post-install attempt")
          jobs = api("/actions/runs/" + str(INSTALLED_LIFECYCLE_RUN_ID) + "/jobs?filter=latest&per_page=100")
          selected = [job for job in jobs["jobs"] if job["id"] == 104877029806]
          if jobs["total_count"] != 1 or len(selected) != 1:
              raise ValueError("reviewed installation job is absent or ambiguous")
          job = selected[0]
          if job["status"] != "completed" or job["conclusion"] != "failure":
              raise ValueError("installation job differs from its reviewed terminal state")
          steps = job["steps"]
          EXPECTED_FAILED_STEP = "Admit required lexical foundation"
          required = (
              "Check source and policy", "Resolve build dependencies", "Build native and managed artifacts",
              "Test native engine", "Test managed code", "Test UCI runtime", "Test browser product",
              "Install native artifacts", "Migrate and reconcile installed database",
              "Release product host reservation",
          )
          for name in required:
              matches = [step for step in steps if step["name"] == name]
              if len(matches) != 1 or matches[0]["status"] != "completed" or matches[0]["conclusion"] != "success":
                  raise ValueError("required observed installation phase did not succeed: " + name)
          failed = [step["name"] for step in steps if step["conclusion"] == "failure"]
          if failed != [EXPECTED_FAILED_STEP]:
              raise ValueError("lifecycle failure differs from the specifically observed post-install failure")
          index_by_name = {step["name"]: index for index, step in enumerate(steps)}
          if index_by_name[EXPECTED_FAILED_STEP] <= index_by_name["Migrate and reconcile installed database"]:
              raise ValueError("failure precedes the required native/database generation boundary")
          lifecycle_evidence = {
              "runId": INSTALLED_LIFECYCLE_RUN_ID, "jobId": job["id"], "headSha": EXPECTED_INSTALLED_SHA,
              "lifecycleStatus": "failure", "fullLifecyclePassed": False, "failedStep": EXPECTED_FAILED_STEP,
              "successfulRequiredSteps": list(required),
              "applicationPublication": next((step["conclusion"] for step in steps
                  if step["name"] == "Publish applications"), "absent"),
              "steps": [{"name": step["name"], "status": step["status"], "conclusion": step["conclusion"]}
                        for step in steps],
              "pilotScope": "Existing source-built CLI against independently proved exact installed native/extension/DB generation; full deployment remains failed, and recording/replay success is unmeasured",
          }
          print("RETAINED_INSTALLATION_STAGE_EVIDENCE " + json.dumps(lifecycle_evidence), flush=True)
          EXPECTED_CURRENT_MAIN = "87d128e563d5f670f6c7e73cb340683a02949844"
          if api("/git/ref/heads/main")["object"]["sha"] != EXPECTED_CURRENT_MAIN:
              raise ValueError("main differs from the explicitly observed workflow-only successor")
          successor = api("/commits/" + EXPECTED_CURRENT_MAIN)
          if ([parent["sha"] for parent in successor["parents"]] != [EXPECTED_INSTALLED_SHA]
                  or successor["commit"]["tree"]["sha"] != "f5c21bfc730fbbe6dcdcbf1b720cc0cb4784a608"):
              raise ValueError("observed main successor ancestry or tree changed")
          comparison = api("/compare/" + EXPECTED_INSTALLED_SHA + "..." + EXPECTED_CURRENT_MAIN)
          changed = comparison.get("files", [])
          if (comparison.get("status") != "ahead" or comparison.get("ahead_by") != 1
                  or comparison.get("behind_by") != 0 or len(changed) != 1
                  or changed[0].get("filename") != ".github/workflows/repo-hygiene.yml"
                  or changed[0].get("sha") != "e9e67c7d76f23dcd6ff59adbb2d4f25b2533055a"
                  or changed[0].get("status") != "modified"):
              raise ValueError("later main includes unreviewed product changes")
          later = api("/actions/runs/35122210762")
          if (later["head_sha"] != EXPECTED_CURRENT_MAIN or later["run_attempt"] != 1
                  or later["status"] != "completed" or later["conclusion"] != "failure"
                  or later["event"] != "push" or later["head_branch"] != "main"
                  or later["path"] != ".github/workflows/laplace.yml"):
              raise ValueError("later main lifecycle differs from observed source-policy failure")
          later_jobs = api("/actions/runs/35122210762/jobs?filter=latest&per_page=100")
          if later_jobs["total_count"] != 1 or len(later_jobs["jobs"]) != 1:
              raise ValueError("later main job is absent or ambiguous")
          later_job = later_jobs["jobs"][0]
          if (later_job["id"] != 104882518730 or later_job["status"] != "completed"
                  or later_job["conclusion"] != "failure"):
              raise ValueError("later main job identity changed")
          later_steps = later_job["steps"]
          if [step["name"] for step in later_steps if step["conclusion"] == "failure"] != [
                  "Fast source/tooling proof and installed-product reconciliation"]:
              raise ValueError("later main failure boundary changed")
          for name in ("Reserve host for product phases", "Resolve build dependencies",
                       "Build native and managed artifacts", "Install native artifacts",
                       "Migrate and reconcile installed database", "Admit required lexical foundation",
                       "Admit operational memory", "Publish applications"):
              matches = [step for step in later_steps if step["name"] == name]
              if len(matches) != 1 or matches[0]["conclusion"] != "skipped":
                  raise ValueError("later lifecycle reached an unreviewed generation boundary: " + name)
          print("OBSERVED_WORKFLOW_ONLY_MAIN_ADVANCE " + json.dumps({
              "currentMain": EXPECTED_CURRENT_MAIN, "installedSource": EXPECTED_INSTALLED_SHA,
              "changedPath": changed[0]["filename"], "laterRun": 35122210762,
              "laterStatus": "failure", "laterFailureScope": "source-policy unpinned action",
              "productSourceDelta": False,
              "runtimeIdentityAuthority": "pilot native/extension/database and CLI before-after checks"}), flush=True)
          if api("/git/ref/heads/" + TARGET_REF)["object"]["sha"] != EXPECTED_INSTALLED_SHA:
              raise ValueError("pilot reference is not pinned to the installed main revision")
          request_body = {"ref": TARGET_REF, "inputs": {"mode": "measure", "pgn": OBSERVED_PGN,
                                                   "family": "otb-2025", "games": "2000"}}
          request = urllib.request.Request(base + "/actions/workflows/chess-corpus-evidence.yml/dispatches",
              data=json.dumps(request_body).encode(), headers={**headers, "Content-Type": "application/json"}, method="POST")
          # One fixed dispatch, with no automatic retry after an ambiguous transport result.
          with urllib.request.urlopen(request, timeout=30) as response:
              code = response.status
              raw = response.read(65537)
          if code not in (200, 204) or len(raw) > 65536:
              raise ValueError("workflow dispatch returned an unexpected bounded response")
          result = json.loads(raw) if raw else {}
          if api("/git/ref/heads/" + TARGET_REF)["object"]["sha"] != EXPECTED_INSTALLED_SHA:
              raise ValueError("pilot reference moved during dispatch; inspect the created run before claiming its identity")
          print("CHESS_CORPUS_PILOT_DISPATCH " + json.dumps({"status": "requested", "expectedHead": EXPECTED_INSTALLED_SHA,
              "installationRun": INSTALLED_LIFECYCLE_RUN_ID, "lifecycleStatus": "failure", "failedStep": EXPECTED_FAILED_STEP,
              "ref": TARGET_REF, "inputs": request_body["inputs"],
              "workflowRunId": result.get("workflow_run_id"), "runUrl": result.get("html_url")}), flush=True)
          PY
