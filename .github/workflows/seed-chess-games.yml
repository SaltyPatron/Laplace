name: Seed — chess games (PGN)

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: "PGN corpus family"
        type: choice
        required: true
        default: lumbras-elite
        options: [lumbras-elite, lumbras-otb, lumbras-online, chesscom, twic]
      player:
        description: "player when corpus=chesscom"
        type: choice
        default: "-"
        options: ["-", all, magnus, hikaru, firouzja, nihalsarin, caruana, gukesh, pragg, anish-giri, owner]
      era:
        description: "era when corpus=lumbras-otb/lumbras-online"
        type: choice
        default: "-"
        options: ["-", all, 1900-1949, 1950-1969, 1970-1989, 1990-1999, 1995-2009, 2000-2004, 2005-2009, 2010-2014, 2015-2019, 2020, 2020-2024, 2021, 2022, 2023, 2024, 2025, 2026]
      path:
        description: "explicit file or folder; overrides corpus selection"
        type: string
        default: ""
      database:
        description: "target database"
        type: choice
        options: [laplace]
        default: laplace

permissions:
  contents: read

jobs:
  resolve:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 2
    outputs:
      path: ${{ steps.pick.outputs.path }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          root="${LAPLACE_DATA_ROOT:-/vault/Data}"
          chess="$root/Games/Chess"
          lum="$chess/Lumbras"
          corpus='${{ inputs.corpus }}'
          player='${{ inputs.player }}'
          era='${{ inputs.era }}'
          p='${{ inputs.path }}'

          if [[ -n "$p" ]]; then
            [[ -e "$p" ]] || { echo "::error::$p does not exist"; exit 1; }
            echo "path=$p" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pick_in() {
            find "$1" -maxdepth 1 -type f -name "*$2*.pgn" -print 2>/dev/null | sort | head -1
          }

          case "$corpus" in
            lumbras-elite) p="$lum/pgn/export_ELO2400.pgn" ;;
            twic) p="$chess/twic" ;;
            chesscom)
              case "$player" in
                all|-) p="$chess" ;;
                magnus) p="$chess/MagnusCarlsen_chesscom.pgn" ;;
                hikaru) p="$chess/Hikaru_chesscom.pgn" ;;
                firouzja) p="$chess/Firouzja2003_chesscom.pgn" ;;
                nihalsarin) p="$chess/nihalsarin_chesscom.pgn" ;;
                caruana) p="$chess/FabianoCaruana_chesscom.pgn" ;;
                gukesh) p="$chess/GukeshDommaraju_chesscom.pgn" ;;
                pragg) p="$chess/rpragchess_chesscom.pgn" ;;
                anish-giri) p="$chess/AnishGiri_chesscom.pgn" ;;
                owner) p="$chess/Anthony-Hart_chesscom.pgn" ;;
                *) echo "::error::unknown player $player"; exit 1 ;;
              esac ;;
            lumbras-otb|lumbras-online)
              venue="${corpus#lumbras-}"
              if [[ "$era" == all || "$era" == "-" ]]; then
                p="$lum/$venue"
              else
                p=$(pick_in "$lum/$venue" "$era")
                [[ -n "$p" ]] || { echo "::error::no PGN for era $era in $lum/$venue"; exit 1; }
              fi ;;
            *) echo "::error::unknown corpus $corpus"; exit 1 ;;
          esac
          [[ -e "$p" ]] || { echo "::error::$p does not exist"; exit 1; }
          echo "path=$p" >> "$GITHUB_OUTPUT"

  seed:
    needs: resolve
    uses: ./.github/workflows/_ingest.yml
    with:
      source: chess
      path: ${{ needs.resolve.outputs.path }}
      database: ${{ inputs.database }}
      timeout_minutes: 720

  move-outcomes:
    needs: seed
    uses: ./.github/workflows/_ingest.yml
    with:
      source: chess-move-outcomes
      database: ${{ inputs.database }}
      timeout_minutes: 720

  transitions:
    needs: seed
    uses: ./.github/workflows/_ingest.yml
    with:
      source: chess-transitions
      database: ${{ inputs.database }}
      timeout_minutes: 720
