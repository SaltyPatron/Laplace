# The substrate regression suite on a pull request's own build, before it can merge. The delivery (laplace.yml) runs the
# same suite after it installs main; nothing ran it on a change before that, so extension changes were checked only on
# copies built by hand. Here the pull request's tree is built by deploy/linux/site.sh (the delivery's own build) into its
# own build directory and installed under its own prefix, never /opt/laplace, and tests/substrate-regress.sh runs every
# regression test and psql case in a scratch database that loads that installation. It queues with the delivery and the
# ingests on hart-server (their concurrency group and site.sh's host lock).
name: Substrate regression (pull request build)
on:
  pull_request:
    paths:
      - "extension/**"
      - "engine/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "db/schema/**"
      - "deploy/linux/site.sh"
      - "tests/substrate-regress.sh"
      - ".github/workflows/substrate-regress.yml"
  workflow_dispatch:
concurrency:
  group: laplace-site-hart-server
  cancel-in-progress: false
  queue: max
jobs:
  regress:
    name: Build the pull request into its own prefix and run the substrate suite against it
    runs-on: [self-hosted, laplace, Laplace, staging]
    timeout-minutes: 240
    env:
      LAPLACE_CONNINFO: ""
      LAPLACE_NATIVE: ${{ github.workspace }}/.ci-dependencies/Laplace-Native
      LAPLACE_OPERATIONS: ${{ github.workspace }}/.ci-dependencies/Laplace-Operations
      LAPLACE_RECIPE_ENGINE_SOURCE: ${{ github.workspace }}/.ci-dependencies/Laplace-Engine
      LAPLACE_POSTGRES_SOURCE: ${{ github.workspace }}/.ci-dependencies/Laplace-postgres
      # The pull request's own build, work and installation; the externals are the delivery's, fetched under the lock.
      LAPLACE_SITE_BUILD: /repos/build/Laplace/pull-request
      LAPLACE_SITE_WORK: /repos/work/mono-site-pull-request
      LAPLACE_INSTALL_PREFIX: /repos/work/mono-site-pull-request/install
      LAPLACE_EXTERNAL: /repos/work/mono-site/external
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: false
      - name: Prepare exact candidate while retaining verified build inputs
        run: bash scripts/ci/prepare-checkout.sh
      - name: Check out canonical Native
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Native
          ref: main
          path: .ci-dependencies/Laplace-Native
          persist-credentials: false
      - name: Check out canonical Native PostgreSQL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-postgres
          ref: main
          path: .ci-dependencies/Laplace-postgres
          persist-credentials: false
      - name: Check out canonical recipe Engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Engine
          ref: main
          path: .ci-dependencies/Laplace-Engine
          persist-credentials: false
      - name: Provide the pinned Rust compiler for the Tree-sitter generator
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.90.0
      - name: Build and install the pull request under its own prefix (the delivery's site.sh)
        run: |
          set -euo pipefail
          mkdir -p "$LAPLACE_SITE_WORK" "$LAPLACE_INSTALL_PREFIX"
          deploy/linux/site.sh externals build install
      - name: The substrate regression suite against that installation
        run: |
          set -euo pipefail
          PG_CONFIG=/usr/local/pgsql/bin/pg_config LAPLACE_REGRESS_PREFIX="$LAPLACE_INSTALL_PREFIX" \
            LAPLACE_REGRESS_DB="laplace_regress_pr_${{ github.run_id }}" \
            bash tests/substrate-regress.sh laplace-mono
