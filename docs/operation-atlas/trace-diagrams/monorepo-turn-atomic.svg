:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="27.681" y="661.277" width="415.578" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="37.681" y="683.734" fill="#000" font-size="12" textLength="395.578">Execute conversation.append_turns with same connection and transaction</text><rect x="47.374" y="716.371" width="376.191" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="57.374" y="738.828" fill="#000" font-size="12" textLength="356.191">Bind session, ordered IDs, built time, intent and physicality budgets</text><rect x="154.103" y="771.465" width="162.734" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="164.103" y="793.922" fill="#000" font-size="12" textLength="142.734">Return through inner writer</text><rect x="95.406" y="826.559" width="280.127" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="105.406" y="849.016" fill="#000" font-size="12" textLength="260.127">Update fold statistics only if not JournalReplayHit</text><rect x="474.939" y="403.078" width="284.756" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="484.939" y="425.535" fill="#000" font-size="12" textLength="264.756">Throw: conversation history requires atomic writer</text><ellipse cx="617.317" cy="469.172" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="617.317" cy="469.172" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="344.695" y="881.652" width="163.396" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="354.695" y="904.109" fill="#000" font-size="12" textLength="143.396">Decrement inflight in finally</text><rect x="382.046" y="936.746" width="88.695" height="35.094" fill="#F1F1F1" style="stroke:#1818