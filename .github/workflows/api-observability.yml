name: Observe — API

# Explicit evidence lane. The collector runs under the same host reservation as
# product/database/seed work, uploads its receipt even on failure, then reports
# the collector's real exit status.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "running Laplace API base URL"
        type: string
        required: true
        default: "http://127.0.0.1:5187"

permissions:
  contents: read

env:
  LAPLACE_API_URL: ${{ inputs.base_url }}

jobs:
  report:
    name: Inventory and probe live API
    runs-on: [self-hosted, laplace]
    timeout-minutes: 10
    steps:
      - name: Create evidence directory
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/laplace-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$receipt"
          mkdir -p "$receipt"
          printf 'LAPLACE_API_DIAGNOSTICS_DIR=%s\n' "$receipt" >> "$GITHUB_ENV"

      - name: Capture API evidence under the host reservation
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 0002
          lock_root="${LAPLACE_WORK_ROOT:-/build/laplace/work}"
          mkdir -p "$lock_root"
          exec 9>"$lock_root/host-resource.lock"
          flock 9

          cd "$GITHUB_WORKSPACE"
          if [[ ! -e .git ]]; then
            [[ -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]] || {
              echo "::error::nonempty diagnostics workspace has no repository; preserving its files" >&2
              exit 1
            }
            git init --initial-branch=main
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          git diff --quiet
          git diff --cached --quiet
          checkout_auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $checkout_auth" \
            git fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset checkout_auth CHECKOUT_TOKEN
          git checkout --no-overwrite-ignore --detach "$TARGET_SHA"
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git diff --quiet
          git diff --cached --quiet

          # Bind evidence to both the collector source and the application actually running.
          # Checking out source is not proof that the deployed runtime came from that source.
          export LAPLACE_DIAGNOSTIC_SOURCE_REVISION="$TARGET_SHA"
          export LAPLACE_DEPLOYED_RUNTIME_REVISION="$(cat "${LAPLACE_APP_DIR:-/opt/laplace/app}/.laplace-source-revision" 2>/dev/null || true)"

          set +e
          python3 scripts/api-diagnostics.py
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$LAPLACE_API_DIAGNOSTICS_DIR/collector-exit-code.txt"
          if (( rc != 0 )); then
            echo "::error::API evidence collector exited $rc; receipt will be uploaded before the job fails"
          fi

      - name: Publish evidence summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$LAPLACE_API_DIAGNOSTICS_DIR/summary.md" ]]; then
            cat "$LAPLACE_API_DIAGNOSTICS_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Laplace API diagnostics' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'Collector did not produce a summary; inspect the artifact/tooling logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload API evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LAPLACE_API_DIAGNOSTICS_DIR }}/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce collector result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$LAPLACE_API_DIAGNOSTICS_DIR/collector-exit-code.txt"
          [[ -f "$receipt" ]] || { echo "::error::collector exit receipt missing"; exit 1; }
          rc="$(cat "$receipt")"
          [[ "$rc" =~ ^[0-9]+$ ]] || { echo "::error::invalid collector exit receipt: $rc"; exit 1; }
          exit "$rc"
