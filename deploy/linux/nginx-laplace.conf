# The monorepo site (laplace-api.service over the database laplace-mono, and laplace-mcp.service at /mcp) on :8080,
# installed by site-host.sh as /etc/nginx/sites-available/laplace. Port 80 is the machine's own sites; 5187 (the API)
# and the MCP port are loopback only.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 256m;

    # The MCP endpoint (laplace-mcp.service: Streamable HTTP, a bearer token on every request) on its own loopback
    # port. site-host.sh writes the port the machine declares (LAPLACE_MCP_HTTP_PORT) in place of 5190.
    location = /mcp {
        proxy_pass http://127.0.0.1:5190;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $laplace_forwarded_proto;
        client_max_body_size 1m;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:5187;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $laplace_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # streamed completions and the UI's live feed: no buffering, long reads
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    access_log /var/log/nginx/laplace-access.log;
    error_log  /var/log/nginx/laplace-error.log;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# The local tunnel may terminate HTTPS before this HTTP listener. A remote
# caller cannot assert a different scheme merely by supplying a header.
geo $laplace_trusted_forwarder {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
}
map "$laplace_trusted_forwarder:$http_x_forwarded_proto" $laplace_forwarded_proto {
    default $scheme;
    "1:https" https;
    "1:http" http;
}
