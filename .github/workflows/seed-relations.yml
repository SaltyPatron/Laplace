name: Data — relations ingest
run-name: "Relations ingest — ${{ inputs.source }} → ${{ inputs.database }}"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Choose a registered corpus; its recipe supplies the installed data path"
        type: choice
        required: true
        default: open-multilingual-wordnet
        options: [unicode, iso-639, cili, open-english-wordnet, open-multilingual-wordnet, princeton-wordnet, propbank, verbnet, verbnet-gl, framenet, semlink, predicate-matrix, mapnet, verbatlas, wordframenet, universal-dependencies-tools, universal-dependencies-documentation, universal-dependencies, wsd-evaluation-framework, wiktionary-kaikki, wiktionary, conceptnet, atomic-2020, framebase, atomic-10x, tatoeba, opensubtitles, project-gutenberg, tokenizers, brown, geonames, hatecheck, sghatecheck, xstest, social-bias-frames, social-chemistry-101, prosocial-dialog, real-toxicity-prompts, toxigen, measuring-hate-speech, civil-comments, chess-com, twic, lumbras-gigabase, openings, workspace-code]
      advanced_path_override:
        description: "ADVANCED: local file/directory override; normally leave blank to use the registered source"
        type: string
        required: false
        default: ""
      database:
        description: "Target database"
        type: choice
        options: [laplace-mono]
        default: laplace-mono
      replace_existing_source:
        description: "DESTRUCTIVE: retract the complete selected source before re-ingesting it"
        type: boolean
        default: false
      confirm_replace_existing:
        description: "Second confirmation required when replace_existing_source is enabled"
        type: boolean
        default: false
      run_idempotency:
        description: "Re-ingest once more and prove evidence does not double-count"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  seed:
    uses: ./.github/workflows/seed.yml
    with:
      mode: source
      source: ${{ inputs.source }}
      path: ${{ inputs.advanced_path_override }}
      database: ${{ inputs.database }}
      evict_before_ingest: ${{ inputs.replace_existing_source }}
      confirm_evict: ${{ inputs.confirm_replace_existing }}
      run_gate: true
      run_idempotency: ${{ inputs.run_idempotency }}
