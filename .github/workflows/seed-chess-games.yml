name: Seed — chess games

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: "game corpus"
        type: choice
        required: true
        default: lumbras-elite
        options: [lumbras-elite, chesscom-all, magnus, hikaru, firouzja, nihalsarin, caruana, gukesh, pragg, anish-giri, owner-games, twic, lumbras-otb, lumbras-online, path-override]
      slice:
        description: "era slice for Lumbras corpora"
        type: choice
        default: all
        options: [all, otb-1900-1949, otb-1950-1969, otb-1970-1989, otb-1990-1999, otb-2000-2004, otb-2005-2009, otb-2010-2014, otb-2015-2019, otb-2020-2024, otb-2025, otb-2026-partial, online-1995-2009, online-2010-2014, online-2015-2019, online-2020, online-2021, online-2022, online-2023, online-2024, online-2025]
      path:
        description: "explicit path; overrides corpus"
        type: string
        default: ""
      database:
        description: "target database"
        type: choice
        options: [laplace]
        default: laplace
      derive_after_games:
        description: "derive move outcomes and transitions"
        type: boolean
        default: true
      run_idempotency:
        description: "re-ingest and prove no double-count"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  seed:
    uses: ./.github/workflows/seed-chess.yml
    with:
      source: chess
      corpus: ${{ inputs.corpus }}
      slice: ${{ inputs.slice }}
      path: ${{ inputs.path }}
      database: ${{ inputs.database }}
      derive_after_games: ${{ inputs.derive_after_games }}
      run_idempotency: ${{ inputs.run_idempotency }}
