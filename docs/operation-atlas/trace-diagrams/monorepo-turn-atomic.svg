nejoin:miter;stroke-miterlimit:10;"/><line x1="426.394" y1="349.078" x2="426.394" y2="369.078" style="stroke:#181818;stroke-width:1;"/><polygon points="422.394,359.078,426.394,369.078,430.394,359.078,426.394,363.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="426.394" y1="916.746" x2="426.394" y2="936.746" style="stroke:#181818;stroke-width:1;"/><polygon points="422.394,926.746,426.394,936.746,430.394,926.746,426.394,930.746" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="426.394" y1="971.84" x2="426.394" y2="991.84" style="stroke:#181818;stroke-width:1;"/><polygon points="422.394,981.84,426.394,991.84,430.394,981.84,426.394,985.84" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="30"><rect x="106.408" y="1034.84" width="564.88" height="62.828" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="111.408" y="1054.373" fill="#000" font-size="14" textLength="496.446">Transient exceptions may retry according to ConcurrencyRetry policy and delay.</text><text x="111.408" y="1071.982" fill="#000" font-size="14" textLength="508.136">Callback and outer transaction ownership are separate: callback has no COMMIT.</text><text x="111.408" y="1089.592" fill="#000" font-size="14" textLength="554.88">Native append_turns, accepted-evidence selection and actual commit remain boundaries.</text></g><g class="footer" data-source-line="35"><text x="195.972" y="1121.049" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="186.499" y="1133.627" fill="#888" font-size="10" textLength="404.697">claimed. Reviewed callback ordering: accepted-evidence fold, then session append, on one</text><text x="260.723" y="1146.205" fill="#888" font-size="10" textLength="256.25">supplied transaction. The partial writer dispatches through</text><text x="273.232" y="1158.783" fill="#888" font-size="10" textLength="231.23">NpgsqlPhysicalityStaging.ApplyStagesCoreAsync to</text><text x="169.28" y="1171.361" fill="#888" font-size="10" textLength="439.136">NpgsqlWorkingSetApply.ApplyPreparedStagesCoreAsync; those nested branches require separate</text><text x="219.331" y="1183.939" fill="#888" font-size="10" textLength="339.033">review. No build or runtime success is inferred from the intended atomic API.</text></g><?plantuml-src dLNBSjis5DtpA-vC5qbc75cYBLcFHKULxOaxZUEndCco0mAN8XeIO00mYhhgH_GB-oKz02LPUNJJbKKyBiuzZ-iNTFDPApQIv_IRQ6iX-LoqxVd-zs3T5Juu4VXyvJfrVjzk_AVwV6MDP-CxlvIoQxfQ16qs7vmEx0RIq_hDCXzFQ5Imb5V5Q3AUgg6ykCglBiM4nMMPJwzolYZAl1pEr7HoAKRvT3oTZOkH7F5i9kLK32z6UVRYVu7h_nptleCrP2vuD5DNPLda8r5U22M78XzTNimkUPBdaqd1GrbCfW1OZ8TYDXtcQboeOLvUIIw7cV-eJIkSQAWGykF6sSwebQsjevzkbxUhszkJ4xuIocx13fMYzdooexWKNHrkhGdtec5Q2-FNx7IP1HrgfhVMMCUjfN_--fkaDP_PUV1i3O62UaV2A1B1DbeI2WOjTIjCe2AY4MwN-O3LRFx8dphjc8mrVxApvDdxL0JNiSPD6tPadMB7YaBd3DrT-qKslp5WBRuhE-SWmOuS1xUZsjeMsyk8OGM0IxypahOwL5-3bAAk8psB2E4Fbe6KzgtrebwGDj9nmq2hJLdhJHLmjpC1PzyLdjrdfjPfy5dQMe4uNNUE5_XoM-4KoKgO3GEaBkdb0rxKFiHYl3TBwks7BlZv5OMA3RtSiN-LqNm5a9HQ-M0TbDciEImJfoTjdRBxt1NDxup7U-GxtDSW3-qRz7aW5yyQBzBt6HMTHYUAwo2eTBOX8IMt0RSEe54njhCyhFTd3mfz0vpcxrlm5AxZeJlpzFnKmerQR1ISHFERBooxm5zfCu21iFzxLDltFVhemFzk8BRxYyRQtZrdHyV0B7rtWO9k-0oA9YrYWRRQUGt6D1nMT6h3mST2Zvni5Ye4PrFXWe7HjacVkFs-LT2hbnuU3X1N8xpMmFDWoDX0lreK4FKZOmpitcZuXf4jUcbi5FK9XRVphzrOeOfrqSCf3VwGdEEps6wpdhJvDNzdJsser7YotYK_fmPG1lbTPEbgpHlSHle22cT949qy-INg2GYU6d784CG7Vt4e14khvuWzfjtMrbhs-OO9n6wGhVQkIsksYy4y4OVi5WpwIhSa47JFSRu4ZCo3MQaI7hpHwjtRjtTFW-mUd21YfouuEnhozJ55dkiJD-2jJjHWjMbqG1-D02VxOQFP3o9vFGbPQIqWPcke9FcrGq7UmYhMoOfJ6gC7wHw_EJggGR2YmlkQ5gWM4Qx3H82bziW486Mo5bXH0tey53tsc0m9IkS_w2HwwQmFq77yfURXOpneC9OF8JxXTK1F5VVfH-EzKz8G4o4sSZ1mra-QXsUphuFO0CaW3PRumVvvKWQxlt0oSUAv_lI3Y-gn-kRM0ezPEDpqd1K0cI3ixNpKFEl91hbsFt8mH0yy-Wx4U4_QHr-pY_5DimZ4zB5LVFoNidouIvBINin_0