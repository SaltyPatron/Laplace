name: DB — lifecycle ops

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "database lifecycle operation"
        type: choice
        required: true
        default: status
        options: [status, create, drop, recreate, update, verify]
      confirm:
        description: "for drop/recreate, enter exactly DROP laplace or RECREATE laplace"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  LAPLACE_INSTALL_PREFIX: ${{ vars.LAPLACE_INSTALL_PREFIX || '/opt/laplace' }}
  LAPLACE_PG_PREFIX: ${{ vars.LAPLACE_PG_PREFIX || '/opt/laplace/pgsql-18' }}
  PGHOST: /var/run/postgresql
  PGPORT: 5432
  PGUSER: laplace_admin
  PGDATABASE: laplace
  LAPLACE_DATA_ROOT: /vault/Data

jobs:
  db:
    name: DB — ${{ inputs.operation }}
    runs-on: [self-hosted, laplace]
    timeout-minutes: 420
    concurrency:
      group: laplace-host-lifecycle
      queue: max
      cancel-in-progress: false
    env:
      LAPLACE_DB_OPERATION: ${{ inputs.operation }}
      LAPLACE_DB_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Select source and run the requested database operation under one host reservation
        env:
          TARGET_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 0002
          workspace_lock_root="${LAPLACE_WORK_ROOT:-/build/laplace/work}"
          mkdir -p "$workspace_lock_root"
          exec 9>"$workspace_lock_root/host-resource.lock"
          flock 9
          cd "$GITHUB_WORKSPACE"
          if [[ ! -e .git ]]; then
            [[ -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]] || {
              echo "::error::nonempty workspace has no repository; preserving its files" >&2
              exit 1
            }
            git init --initial-branch=main
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          git diff --quiet
          git diff --cached --quiet
          checkout_auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $checkout_auth" \
            git fetch --no-tags --depth=2 origin "$TARGET_SHA"
          unset checkout_auth CHECKOUT_TOKEN
          git checkout --no-overwrite-ignore --detach "$TARGET_SHA"
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git diff --quiet
          git diff --cached --quiet

          # Database lifecycle owns database state, not compilation. Requiring the
          # whole checkout SHA to equal the last application build made script-only
          # database fixes impossible to execute. Instead, operations that create or
          # update substrate schema prove that the installed extension artifact is
          # byte-derived from this checkout's extension source before mutating data.
          export LAPLACE_SETUP_USE_CMAKE=false
          export LAPLACE_SETUP_REQUIRE_BUILT_REVISION=false
          source scripts/ci-environment.sh

          case "$LAPLACE_DB_OPERATION" in
            drop)
              [[ "$LAPLACE_DB_CONFIRM" == "DROP $PGDATABASE" ]] || {
                echo "::error::drop requires confirmation exactly: DROP $PGDATABASE" >&2
                exit 2
              }
              ;;
            recreate)
              [[ "$LAPLACE_DB_CONFIRM" == "RECREATE $PGDATABASE" ]] || {
                echo "::error::recreate requires confirmation exactly: RECREATE $PGDATABASE" >&2
                exit 2
              }
              ;;
          esac

          case "$LAPLACE_DB_OPERATION" in
            status)
              exec bash scripts/db-migrations.sh status
              ;;
            create)
              python3 scripts/check-installed-extension-current.py
              bash scripts/db-migrations.sh up
              bash scripts/pipeline.sh sync-extension tune-pg tune-laplace perfcache-guc api-env
              exec bash scripts/check-database-health.sh "$PGDATABASE"
              ;;
            drop)
              exec bash scripts/db-migrations.sh nuke --yes
              ;;
            recreate)
              python3 scripts/check-installed-extension-current.py
              bash scripts/db-migrations.sh nuke --yes
              bash scripts/db-migrations.sh up
              bash scripts/pipeline.sh sync-extension tune-pg tune-laplace perfcache-guc api-env
              exec bash scripts/check-database-health.sh "$PGDATABASE"
              ;;
            update)
              python3 scripts/check-installed-extension-current.py
              exec bash scripts/maintain-installed-database.sh
              ;;
            verify)
              exec bash scripts/check-database-health.sh "$PGDATABASE"
              ;;
            *)
              echo "::error::unknown database lifecycle operation: $LAPLACE_DB_OPERATION" >&2
              exit 2
              ;;
          esac
