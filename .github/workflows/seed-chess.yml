name: Seed — chess

on:
  workflow_dispatch:
    inputs:
      source:
        description: "chess source"
        type: choice
        required: true
        options: [chess, openings, chess-books, chess-analyze, chess-eval, chess-move-outcomes, chess-transitions, chess-syzygy, chess-trajectory, chess-opening-match]
      corpus:
        description: "corpus for file-backed sources"
        type: choice
        required: true
        default: lumbras-elite
        options: [lumbras-elite, chesscom-all, magnus, hikaru, firouzja, nihalsarin, caruana, gukesh, pragg, anish-giri, owner-games, twic, lumbras-otb, lumbras-online, openings-book, syzygy-tablebase, books, path-override]
      slice:
        description: "era slice for Lumbras corpora"
        type: choice
        default: all
        options: [all, otb-1900-1949, otb-1950-1969, otb-1970-1989, otb-1990-1999, otb-2000-2004, otb-2005-2009, otb-2010-2014, otb-2015-2019, otb-2020-2024, otb-2025, otb-2026-partial, online-1995-2009, online-2010-2014, online-2015-2019, online-2020, online-2021, online-2022, online-2023, online-2024, online-2025]
      path:
        description: "explicit path; overrides corpus"
        type: string
        default: ""
      database:
        description: "target database"
        type: choice
        options: [laplace]
        default: laplace
      evict_before_ingest:
        description: "retract this source before re-deriving it"
        type: boolean
        default: false
      evict_confirm:
        description: "exact decomposer source name required for eviction"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  resolve:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 2
    outputs:
      path: ${{ steps.pick.outputs.path }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          root="${LAPLACE_DATA_ROOT:-/vault/Data}"
          chess="$root/Games/Chess"
          lum="$chess/Lumbras"
          src='${{ inputs.source }}'
          corpus='${{ inputs.corpus }}'
          slice='${{ inputs.slice }}'
          user_path='${{ inputs.path }}'

          case "$src" in
            chess-analyze|chess-eval|chess-move-outcomes|chess-transitions|chess-trajectory|chess-opening-match)
              echo "path=" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac

          if [[ -n "$user_path" ]]; then
            [[ -e "$user_path" ]] || { echo "::error::$user_path does not exist"; exit 1; }
            echo "path=$user_path" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$src" in
            openings) corpus=openings-book ;;
            chess-books) corpus=books ;;
            chess-syzygy) corpus=syzygy-tablebase ;;
            chess) ;;
            *) echo "::error::unknown source $src"; exit 1 ;;
          esac

          slice_file() {
            case "$1" in
              otb-1900-1949) echo "$lum/otb/LumbrasGigaBase_OTB_1900-1949.pgn" ;;
              otb-1950-1969) echo "$lum/otb/LumbrasGigaBase_OTB_1950-1969.pgn" ;;
              otb-1970-1989) echo "$lum/otb/LumbrasGigaBase_OTB_1970-1989.pgn" ;;
              otb-1990-1999) echo "$lum/otb/LumbrasGigaBase_OTB_1990-1999.pgn" ;;
              otb-2000-2004) echo "$lum/otb/LumbrasGigaBase_OTB_2000-2004.pgn" ;;
              otb-2005-2009) echo "$lum/otb/LumbrasGigaBase_OTB_2005-2009.pgn" ;;
              otb-2010-2014) echo "$lum/otb/LumbrasGigaBase_OTB_2010-2014.pgn" ;;
              otb-2015-2019) echo "$lum/otb/LumbrasGigaBase_OTB_2015-2019.pgn" ;;
              otb-2020-2024) echo "$lum/otb/LumbrasGigaBase_OTB_2020-2024.pgn" ;;
              otb-2025) echo "$lum/otb/LumbrasGigaBase_OTB_2025.pgn" ;;
              otb-2026-partial) echo "$lum/otb/LumbrasGigaBase_OTB_2026_partial_release.pgn" ;;
              online-1995-2009) echo "$lum/online/LumbrasGigaBase_Online_1995-2009.pgn" ;;
              online-2010-2014) echo "$lum/online/LumbrasGigaBase_Online_2010-2014.pgn" ;;
              online-2015-2019) echo "$lum/online/LumbrasGigaBase_Online_2015-2019.pgn" ;;
              online-2020) echo "$lum/online/LumbrasGigaBase_Online_2020.pgn" ;;
              online-2021) echo "$lum/online/LumbrasGigaBase_Online_2021.pgn" ;;
              online-2022) echo "$lum/online/LumbrasGigaBase_Online_2022.pgn" ;;
              online-2023) echo "$lum/online/LumbrasGigaBase_Online_2023.pgn" ;;
              online-2024) echo "$lum/online/LumbrasGigaBase_Online_2024.pgn" ;;
              online-2025) echo "$lum/online/LumbrasGigaBase_Online_2025.pgn" ;;
              *) return 1 ;;
            esac
          }

          case "$corpus" in
            lumbras-elite) p="$lum/pgn/export_ELO2400.pgn" ;;
            chesscom-all) p="$chess" ;;
            magnus) p="$chess/MagnusCarlsen_chesscom.pgn" ;;
            hikaru) p="$chess/Hikaru_chesscom.pgn" ;;
            firouzja) p="$chess/Firouzja2003_chesscom.pgn" ;;
            nihalsarin) p="$chess/nihalsarin_chesscom.pgn" ;;
            caruana) p="$chess/FabianoCaruana_chesscom.pgn" ;;
            gukesh) p="$chess/GukeshDommaraju_chesscom.pgn" ;;
            pragg) p="$chess/rpragchess_chesscom.pgn" ;;
            anish-giri) p="$chess/AnishGiri_chesscom.pgn" ;;
            owner-games) p="$chess/Anthony-Hart_chesscom.pgn" ;;
            twic) p="$chess/twic" ;;
            openings-book) p="$chess/openings" ;;
            books) p="$root/ProjectGutenberg/text" ;;
            syzygy-tablebase)
              p="$chess/syzygy"
              [[ ! -d "$p/3-4-5" ]] || p="$p/3-4-5" ;;
            lumbras-otb|lumbras-online)
              venue="${corpus#lumbras-}"
              if [[ "$slice" == all ]]; then
                p="$lum/$venue"
              else
                [[ "$slice" == "$venue"-* ]] || { echo "::error::slice $slice does not belong to $corpus"; exit 1; }
                p=$(slice_file "$slice") || { echo "::error::unknown slice $slice"; exit 1; }
              fi ;;
            path-override) echo "::error::path-override requires path"; exit 1 ;;
            *) echo "::error::unknown corpus $corpus"; exit 1 ;;
          esac
          [[ -e "$p" ]] || { echo "::error::$p does not exist"; exit 1; }
          echo "path=$p" >> "$GITHUB_OUTPUT"

  seed:
    needs: resolve
    uses: ./.github/workflows/_ingest.yml
    with:
      source: ${{ inputs.source }}
      path: ${{ needs.resolve.outputs.path }}
      database: ${{ inputs.database }}
      timeout_minutes: 720
      evict_before_ingest: ${{ inputs.evict_before_ingest }}
      evict_confirm: ${{ inputs.evict_confirm }}
