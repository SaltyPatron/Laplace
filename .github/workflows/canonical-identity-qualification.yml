name: Verify isolated canonical PostgreSQL qualification owner
on:
  push:
    branches: [review/canonical-identity-20260917]
    paths: [.github/workflows/canonical-identity-qualification.yml]
permissions:
  contents: read
jobs:
  qualification-owner-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read exact selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source and run bounded operator controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = fb0fffce51a89bc997a83ff13fec413f1d6f974b
          test -z "$(git status --porcelain --untracked-files=all)"
          evidence="$RUNNER_TEMP/canonical-identity-owner-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$evidence"
          mkdir -m 0700 "$evidence"
          printf 'OWNER_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          cp .github/workflows/canonical-identity-qualification.yml "$evidence/workflow.yml"
          python3 - <<'PY' 2>&1 | tee "$evidence/source.log"
          import ast,hashlib,json,os,subprocess
          from pathlib import Path
          paths={
              "scripts/qualify-canonical-identity-pg.py":"35168d18173bdfeaae496cd3b7d4cc0ca70330be",
              "scripts/test-qualify-canonical-identity-pg.py":"be399a4589f4953acb00dee26942d4e3b909b420",
              "docs/benchmarks/POSTGRES_GEOMETRY_BASELINE.md":"f1454378c625af872799a56c380370d9e561f646"}
          actual=set(subprocess.check_output(["git","diff","--name-only","HEAD^","HEAD"],text=True).splitlines())
          assert actual==set(paths)|{".github/workflows/canonical-identity-qualification.yml"},actual
          for path,expected in paths.items():
              raw=Path(path).read_bytes()
              observed=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert observed==expected,(path,observed)
              if path.endswith(".py"):ast.parse(raw,path)
          print(json.dumps({"source_commit":os.environ["GITHUB_SHA"],
              "source_tree":subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(),
              "qualified_product_parent":"fb0fffce51a89bc997a83ff13fec413f1d6f974b",
              "files":paths,"scope":"qualification operator logic only; no PostgreSQL execution or product rebuild"}),flush=True)
          PY
          python3 scripts/test-qualify-canonical-identity-pg.py 2>&1 | tee "$evidence/operator-controls.log"
          git diff --exit-code HEAD --
      - name: Retain executed owner controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-identity-pg-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OWNER_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
