598.359" style="stroke:#181818;stroke-width:1;"/><polygon points="271.542,588.359,275.542,598.359,279.542,588.359,275.542,592.359" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="275.542" y1="633.453" x2="275.542" y2="653.453" style="stroke:#181818;stroke-width:1;"/><polygon points="271.542,643.453,275.542,653.453,279.542,643.453,275.542,647.453" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="22"><rect x="22" y="696.453" width="610.811" height="80.438" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="27" y="715.986" fill="#000" font-size="14" textLength="512.805">Until reports info-string diagnostics to stderr and retains at most 256 selected lines.</text><text x="27" y="733.596" fill="#000" font-size="14" textLength="600.811">Selected lines include engine ID, best move, providers, database identity and knowledge identity.</text><text x="27" y="751.205" fill="#000" font-size="14" textLength="505.039">EOF before expected response throws; timeout cancels the shared lifetime token.</text><text x="27" y="768.814" fill="#000" font-size="14" textLength="331.481">The outer command catch prints errors and returns 1.</text></g><g class="footer" data-source-line="29"><text x="134.529" y="800.271" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="135.638" y="812.85" fill="#888" font-size="10" textLength="383.535">claimed. The timeout starts after connection opening. This is a handshake and minimal</text><text x="125.892" y="825.428" fill="#888" font-size="10" textLength="403.027">response probe: the wrapper does not independently validate move legality, chess strength</text><text x="138.423" y="838.006" fill="#888" font-size="10" textLength="377.964">or declared knowledge content. Null-move rejection is an exact string comparison. No</text><text x="215.394" y="850.584" fill="#888" font-size="10" textLength="224.023">engine process or connector endpoint was started.</text></g><?plantuml-src ZLJTZjeu5BxFKnnfBpeZCKp840XmKLMqQ2jLRRNCF81ZdmINO4Us0pjt-n1zmdsI_Hm2G_UgN17x-9plptv7duvQiP6yf2-YROJaXvVrvqVlvEFmFNwH-l6xixKJXx7qjFtpGvRFICvpbKzJ8MGXgY9LKfMBl4opL4mdioBbKcHvCPSiPzCousaXibagPY9TO7UIphFatM-ENbjZM0PjZRyPNwHJKSoBN4rujgXKKOXogfuudonadixpgL3PD2tAoNms5vbyAYVPOfwNvLEcdb9PgcdYzzgq0foe579VEziPjRQDTVJ7viDclTdSLFYTKFQaJKsLQ3pVx2YkHDU4ZJNXgpWmRONnMtQwIe8E3HC8aJmJGET___b9R6fjc8wnI4iHUL7hR8ckGRYG9CjlBPjugD9rvrWD9rR9SXiBQ9Ab3vwnhwZH5GUDiOg5QeOYnaOdzOeSIzP7fiu4tSGbkx_iQ-zmulN_DVtYMnME63xLuBKY__l7MkjrJwidXA_XT6s1imqxcg3ohrywbEp3mHw1NrTqzqNuWAP1O7ma2RduRo53ytejf1G_WgJNXJjZ3T-_lwUmWtnth-pl4re-xvmzaR4FVGqxPzqgONWOwsF1TwTDY0PK6dOTC5I984RqyhocNbe1v5Sig0jMsgO7vT79A5Yz_AWzQFBLgOPhx2GlWpgjTS6JDfLzyC7562ajQcDzq0Xqi11A0ThDA4yYq0455BFkkK5-1YdyEDd-yet6ikdKPJfz_ZZgLQ58UHGXnslc_8WYir80PxnsoEThFt5lxAbXLRyjZvDFtpReKLaNbM_Fmno3fC7f43M5gL4UsmMI0dUuyL7uU5CStmGps3sRSVACBPIoGwuFXpWLoPSxW8Fw_koBl_3l7FXFnb7SGKWVR9jKrg91ihMTmqlX-AZvX57MoHtOklucZUah_cFLCwRqyZhyquOiBjKAGI0N4nTzbH9XZD0JsGYig355c1TMVNY1gJgZlhn1VIDO68irj4S5xG0SnFVdi1oqqGVH95Uz-jkzxEKvET6swASiV3Csm3jS2L24y4ZtKJGQ9d5l7O4yliFhY2933qGE5eTTWjWh1kYez9jxm1ZG1X9qJNFEk-CV0-g8qvnl4GqPX1DumxJlLRF9a1w0bN6OTJVl5W2sDjwJa_1dOQ1Mz8S6K_u3?></g></svg>