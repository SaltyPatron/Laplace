name: Supersede the queued native source before execution
on:
  push:
    branches: ['verify/chess-floor-serving-controls-20260916']
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the unassigned native attempt before current source binding
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 100s python3 -B - <<'PY'
          import json,os,time,urllib.request
          base="https://api.github.com/repos/SaltyPatron/Laplace"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}
          def api(path,method="GET"):
              request=urllib.request.Request(base+path,headers=headers,method=method,data=b"{}" if method=="POST" else None)
              with urllib.request.urlopen(request,timeout=15) as response:
                  raw=response.read(262145)
              assert len(raw)<=262144
              return json.loads(raw) if raw else {}
          selected=[(35152180781,"f06d5254ebd957f325f8334cbeb1294a9f58eebd")]
          for run_id,source in selected:
              run=api("/actions/runs/"+str(run_id))
              assert run["id"]==run_id and run["head_sha"]==source and run["run_attempt"]==1
              assert run["path"]==".github/workflows/chess-floor-serving-controls.yml"
              assert run["head_branch"]=="verify/chess-floor-serving-controls-20260916" and run["event"]=="push"
              jobs=api("/actions/runs/"+str(run_id)+"/jobs")["jobs"]
              assert len(jobs)==1
              job=jobs[0]
              observation={"run":run_id,"source":source,"status":run["status"],"conclusion":run["conclusion"],
                           "job":job["id"],"jobStatus":job["status"],"runnerId":job["runner_id"],"runnerName":job["runner_name"]}
              print("OBSERVER_RETIRE_BEFORE "+json.dumps(observation),flush=True)
              if run["status"]=="completed":
                  print("OBSERVER_ALREADY_TERMINAL "+str(run_id),flush=True)
                  continue
              assert run["status"]=="queued" and job["status"]=="queued", "observer began: cancellation refused"
              assert not job.get("runner_id") and not job.get("runner_name") and not job.get("steps"),"assigned observer preserved"
              api("/actions/runs/"+str(run_id)+"/cancel","POST")
              print("OBSERVER_CANCEL_ACK "+str(run_id),flush=True)
              end=time.monotonic()+30
              while time.monotonic()<end:
                  result=api("/actions/runs/"+str(run_id))
                  assert result["head_sha"]==source and result["run_attempt"]==1
                  if result["status"]=="completed": break
                  time.sleep(1)
              assert result["status"]=="completed" and result["conclusion"]=="cancelled"
              print("OBSERVER_RETIRE_TERMINAL "+json.dumps({"run":run_id,"source":source,"status":result["status"],"conclusion":result["conclusion"]}),flush=True)
          PY
