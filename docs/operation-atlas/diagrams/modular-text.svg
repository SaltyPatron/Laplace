<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1350" role="img" aria-label="Text → canonical identity — modular implementation"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62758a"/></marker></defs><path d="M350 61 L350 61.0 L730 61.0 L730 61" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="547.0" y="54.0" font-family="sans-serif" font-size="13" fill="#244966">No</text><path d="M200 92 L200 121.0 L200 121.0 L200 150" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="207.0" y="114.0" font-family="sans-serif" font-size="13" fill="#244966">Yes</text><path d="M200 212 L200 241.0 L200 241.0 L200 270" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M200 332 L200 361.0 L200 361.0 L200 390" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M200 452 L200 481.0 L200 481.0 L200 510" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M350 541 L350 541.0 L730 541.0 L730 541" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="547.0" y="534.0" font-family="sans-serif" font-size="13" fill="#244966">decode fails</text><path d="M880 572 L880 601.0 L200 601.0 L200 630" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="547.0" y="594.0" font-family="sans-serif" font-size="13" fill="#244966">replacement</text><path d="M200 572 L200 601.0 L200 601.0 L200 630" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="207.0" y="594.0" font-family="sans-serif" font-size="13" fill="#244966">valid</text><path d="M200 692 L200 721.0 L200 721.0 L200 750" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="207.0" y="714.0" font-family="sans-serif" font-size="13" fill="#244966">each made call</text><path d="M350 781 L350 781.0 L730 781.0 L730 781" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="547.0" y="774.0" font-family="sans-serif" font-size="13" fill="#244966">Yes</text><path d="M200 812 L200 841.0 L200 841.0 L200 870" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="207.0" y="834.0" font-family="sans-serif" font-size="13" fill="#244966">No</text><path d="M200 932 L200 961.0 L200 961.0 L200 990" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="207.0" y="954.0" font-family="sans-serif" font-size="13" fill="#244966">still multiple</text><path d="M350 901 L420 901 L420 781 L1030 781" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="697.0" y="834.0" font-family="sans-serif" font-size="13" fill="#244966">collapsed</text><path d="M880 812 L880 966.0 L200 966.0 L200 1120" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="547.0" y="959.0" font-family="sans-serif" font-size="13" fill="#244966">final root</text><path d="M200 1052 L200 1086.0 L200 1086.0 L200 1120" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="207.0" y="1079.0" font-family="sans-serif" font-size="13" fill="#244966">final root</text><path d="M200 1182 L200 1211.0 L200 1211.0 L200 1240" fill="none" stroke="#62758a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="50" y="30" width="300" height="62" rx="8" fill="#fff0d8" stroke="#98a9b8"/><text x="200" y="55" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">laplace text TEXT</text><text x="200" y="74" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Argument present?</text><rect x="730" y="30" width="300" height="62" rx="8" fill="#ffe5e4" stroke="#98a9b8"/><text x="880" y="55" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Print usage to stderr</text><text x="880" y="74" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">exit 2</text><rect x="50" y="150" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="200" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Map Tier-0; create text context</text><text x="200" y="194" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Open ICU sentence/word/grapheme</text><rect x="50" y="270" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="200" y="295" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Copy bytes for segmentation</text><text x="200" y="314" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Single internal linebreak → space</text><rect x="50" y="390" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="200" y="415" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Compute ICU boundaries</text><text x="200" y="434" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Split word-tier joiner characters</text><rect x="50" y="510" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="200" y="535" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Decode ORIGINAL bytes</text><text x="200" y="554" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Tier-0 reference per codepoint</text><rect x="730" y="510" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="880" y="535" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Invalid UTF-8 decode</text><text x="880" y="554" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Use U+FFFD; increment offset</text><rect x="50" y="630" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="200" y="655" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Compose grapheme → word segment</text><text x="200" y="674" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">→ sentence → paragraph → text</text><rect x="50" y="750" width="300" height="62" rx="8" fill="#fff0d8" stroke="#98a9b8"/><text x="200" y="775" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">made: one child?</text><rect x="730" y="750" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="880" y="775" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Return child&#x27;s reference</text><text x="880" y="794" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">No new composition</text><rect x="50" y="870" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="200" y="895" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">At least 4 children: lp_factor</text><text x="200" y="914" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">May collapse to one child</text><rect x="50" y="990" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="200" y="1015" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Choose tier above children</text><text x="200" y="1034" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">lp_ref_compose [numeric call pending]</text><rect x="50" y="1120" width="300" height="62" rx="8" fill="#e5edf4" stroke="#98a9b8"/><text x="200" y="1145" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Return root and root parts</text><text x="200" y="1164" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Single-codepoint fallback if needed</text><rect x="50" y="1240" width="300" height="62" rx="8" fill="#dcefe7" stroke="#98a9b8"/><text x="200" y="1265" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">Print ID, tier, coordinate, Hilbert</text><text x="200" y="1284" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14293c">wall, count, ≤64 parts, T0 fingerprint</text></svg>