rified?</text><rect x="86.035" y="1178.677" width="409.537" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="96.035" y="1201.134" fill="#000" font-size="12" textLength="389.537">Clear feedback; retain this candidate root for next shared-forward attempt</text><polygon points="247.703,203.797,333.904,203.797,345.904,215.797,333.904,227.797,247.703,227.797,235.703,215.797,247.703,203.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="294.804" y="239.216" fill="#000" font-size="11" textLength="17.118">yes</text><text x="247.703" y="220.298" fill="#000" font-size="11" textLength="86.201">Attempt remains?</text><text x="184.941" y="213.38" fill="#000" font-size="11" textLength="50.762">exhausted</text><rect x="170.729" y="1255.771" width="240.148" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="180.729" y="1278.228" fill="#000" font-size="12" textLength="220.148">Return toolchain_rejected_all_candidates</text><ellipse cx="290.804" cy="1321.864" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="290.804" cy="1321.864" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="290.804" y1="73.609" x2="290.804" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="286.804,83.609,290.804,93.609,294.804,83.609,290.804,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="290.804" y1="128.703" x2="290.804" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="286.804,138.703,290.804,148.703,294.804,138.703,290.804,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="290.804" y1="399.821" x2="290.804" y2="427.774" style="stroke:#181818;stroke-width:1;"/><polygon points="286.804,417.774,290.804,427.774,294.804,417.774,