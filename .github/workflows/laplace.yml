name: Product — main delivery
run-name: "Deliver — ${{ github.event_name == 'push' && 'production' || inputs.promote && 'production' || 'staging' }} — ${{ github.sha }}"

# Linux product changes on main are built, installed, migrated and published on hart-server (the machine Laplace-Operations
# declares; the staging host) by this repository's runner (Laplace-Operations' agents.sh: labels laplace,Laplace,
# staging; no sudo), with deploy/linux/site.sh: the engine and extensions against the Operations cluster, the database
# laplace-mono, the API + SPA at /opt/laplace/app behind nginx :8080. The machine's root part is
# deploy/linux/site-host.sh, run once by a person. Seeding is an operation (product-operator.yml), never part of a delivery;
# this workflow has no manual dispatch (scripts/validate-pipeline.py: manual dispatch belongs in product-operator.yml).
#
# After hart-server verification, hart-prod receives the same staged application and
# native closure. Its declared substrate connection selects hart-server or hart-cloud;
# application promotion does not start a database host or change that selection.
# hart-cloud is started only by an explicitly requested isolated qualification.
# Serialize complete promotions so two revisions cannot interleave shared staging
# artifacts or overwrite each other's cloud lease while waiting on later hosts.
#
# Explicit full and competitive qualification use the same site lifecycle and host reservation.
# Windows-only deployment controls are qualified by windows-operations.yml.

on:
  workflow_call:
    inputs:
      promote:
        description: "Promote the verified staging package to hart-prod"
        type: boolean
        default: true
      qualify_cloud:
        description: "Explicitly start hart-cloud for isolated build/runtime qualification"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "deploy/windows/**"
      - "scripts/win/**"
      - "**/*.md"
      - "scripts/ci-impact-plan.py"
      - "scripts/ci-qualification-cache.py"
      - "scripts/ci-product-freshness.py"
      - "scripts/ci_product_scope.py"
      - "scripts/web-artifact.py"
      - "scripts/windows-components.py"
      - "scripts/site-status.py"
      - "scripts/platform-access-audit.py"
      - "scripts/platform-access-enroll.py"
      - "scripts/platform-owner-enroll.py"
      - "scripts/test-parallel.sh"
      - "scripts/product-ci.sh"
      - "deploy/linux/deploy.sh"
      - "scripts/publish-applications.sh"
      - "scripts/test-suites/**"
      - "scripts/ci_managed_projects.py"
      - "scripts/test-*.py"
      - "scripts/test-*.sh"
      - "scripts/tests/**"
      - "web/scripts/test-*.mjs"
      - "web/e2e/**"
      - "scripts/test-workflow-architecture.py"
      - "scripts/test-seed-workflow-ownership.py"
      - "scripts/native-ingest-idempotency.sql"
      - "scripts/test-product-ci-artifact-ownership.py"
      - "scripts/test-benchmark-suite.py"
      - "scripts/validate-pipeline.py"
      - "vault-data-inventory.tsv"
      - "vault-data-directories.list"

permissions:
  contents: read
  actions: read
  id-token: write   # the database host is started through GCP workload identity federation: a short-lived token, no stored key

env:
  # Credential refresh and component installation use the same host lock.
  # Queue behind active ingestion and other host operations. A repository variable may set a numeric deadline;
  # the default waits for the holder, as in Laplace-Operations' delivery.
  LAPLACE_HOST_LOCK_WAIT_SECONDS: ${{ vars.LAPLACE_HOST_LOCK_WAIT_SECONDS || 'wait' }}

concurrency:
  group: laplace-promotion
  cancel-in-progress: false
  queue: max

# Host groups also coordinate jobs with other workflows. Status and verification
# remain independently callable; the promotion queue is not a machine lock.
jobs:
  deliver:
    name: Staging — build, migrate, publish, read back on hart-server
    concurrency:
      group: laplace-site-hart-server
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, laplace, Laplace, staging]
    timeout-minutes: 240
    env:
      LAPLACE_CONNINFO: ""
      LAPLACE_NATIVE: ${{ github.workspace }}/.ci-dependencies/Laplace-Native
      LAPLACE_RECIPE_ENGINE_SOURCE: ${{ github.workspace }}/.ci-dependencies/Laplace-Engine
      LAPLACE_POSTGRES_SOURCE: ${{ github.workspace }}/.ci-dependencies/Laplace-postgres
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out canonical Native
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Native
          ref: 044bd4a361ce32d8a840a480a83bbfd3321ec34e
          path: .ci-dependencies/Laplace-Native
          persist-credentials: false
      - name: Check out canonical Native PostgreSQL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-postgres
          ref: bc62f61684220172ffdbf553118f072962a2209a
          path: .ci-dependencies/Laplace-postgres
          persist-credentials: false
      - name: Check out canonical recipe Engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Engine
          ref: b2c4a8a29ced5d278ec39890d569838e7b8d4988
          path: .ci-dependencies/Laplace-Engine
          persist-credentials: false

      - name: Provide the pinned Rust compiler for the Tree-sitter generator
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.90.0

      - name: Own staging work across delivery steps
        uses: ./.github/actions/storage
        with:
          checkout-token: ${{ secrets.LAPLACE_CHECKOUT }}
          operation: begin

      - name: Externals and build (engine, perf-caches, extensions)
        # Delivery staging remains owned across separate build/publish steps.
        run: deploy/linux/site.sh externals build

      - name: Verify Native recipe records and file coverage without PostgreSQL
        env:
          LAPLACE_DB: Host=127.0.0.1;Port=1;Username=unavailable;Database=unavailable;Timeout=1
          PGHOST: 127.0.0.1
          PGPORT: "1"
        run: |
          set -euo pipefail
          source scripts/lib/installation.sh
          export LAPLACE_ENGINE_BUILD="${LAPLACE_SITE_BUILD:-${LAPLACE_BUILD:?}/Laplace/release}/engine"
          export LAPLACE_REUSE_INSTALLED_NATIVE=0
          export LAPLACE_RECIPES="$LAPLACE_RECIPE_ENGINE_SOURCE/recipes"
          export LAPLACE_TIER0="$LAPLACE_ENGINE_BUILD/core/perfcache/tier0.bin"
          export LAPLACE_PERFCACHE_BIN="$LAPLACE_TIER0"
          export LAPLACE_FLAGS="$LAPLACE_ENGINE_BUILD/core/perfcache/tier0.flags"
          export LAPLACE_HIGHWAY="$LAPLACE_ENGINE_BUILD/core/perfcache/highway.bin"
          results="$RUNNER_TEMP/native-recipe-results"
          for project in Laplace.Decomposers.Tests Laplace.Substrate.Tests; do
            dotnet test "app/$project/$project.csproj" -c Release --nologo \
              -p:LAPLACE_BUILD_ROOT="${LAPLACE_BUILD:?}/laplace-mono/native-recipes" \
              --filter 'FullyQualifiedName~NativeSourceAdmissionTests|FullyQualifiedName~NativeAlignedLayerTests|FullyQualifiedName~UnicodeSourceSemanticsTests|FullyQualifiedName~NativeXmlRecipeTests|FullyQualifiedName~NativeRangeOperandTests|FullyQualifiedName~NativeWordFrameNetTests|FullyQualifiedName~UnicodeDecomposerTests|FullyQualifiedName~UcdNormalizationQcTests|FullyQualifiedName~NativeRecipeConcurrencyTests|FullyQualifiedName~RecipeLawGateTests|FullyQualifiedName~SelectedRecipeSemanticsTests|FullyQualifiedName~SourceGenerationRegressionTests|FullyQualifiedName~UnicodeSourceNameGateTests|FullyQualifiedName~NativeUnicodeTableTests|FullyQualifiedName~CorpusParsingHasNoManagedJsonCompilerOrUnicodeParser' \
              --logger "trx;LogFileName=$project.trx" --results-directory "$results"
          done
          python3 - "$results" <<'PY'
          from pathlib import Path
          import sys, xml.etree.ElementTree as ET
          for project, expected in [('Laplace.Decomposers.Tests', 76), ('Laplace.Substrate.Tests', 16)]:
              path = Path(sys.argv[1]) / (project + '.trx')
              counters = ET.parse(path).getroot().find('.//{*}Counters').attrib
              if int(counters['passed']) != expected or int(counters['total']) != expected:
                  raise SystemExit(f'All {expected} Native recipe checks must execute and pass: {project}')
          PY

      - name: Install into /opt/laplace
        run: deploy/linux/site.sh install

      - name: Database laplace-mono, extensions updated in place, migrations
        run: |
          deploy/linux/site.sh database extensions migrate

      - name: Verify installed shared SQL and native contracts
        run: |
          set -euo pipefail
          source scripts/lib/database.sh
          python3 tests/sql-native-foundation.py --pgbin "$LAPLACE_PG_PREFIX/bin" \
            --results "$RUNNER_TEMP/native-sql-results"

      - name: Stage the API + SPA, publish, restart
        run: deploy/linux/site.sh app publish restart


      - name: Read back
        run: deploy/linux/site.sh smoke

      - name: Retain installed target after failed readback
        if: failure()
        run: deploy/linux/site.sh status

      - name: Exercise installed database recreation and failure recovery
        run: bash tests/database-recreation.sh

      - name: Verify installed GIN maintenance with owner and restricted database roles
        run: bash tests/ingest-completion.sh

      - name: Verify database profiles, BLAKE3 transport and UCI database identity
        run: bash tests/database-names.sh

      - name: Retain ingestion completion results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ingest-completion-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-recipe-results
            ${{ runner.temp }}/ingest-completion-results
            ${{ runner.temp }}/database-name-results
            ${{ runner.temp }}/native-sql-results
          if-no-files-found: error
          retention-days: 14

      - name: Bundle the verified application for production
        if: github.event_name == 'push' || inputs.promote
        id: bundle
        run: deploy/linux/site.sh bundle

      - name: Retain the verified production package
        if: github.event_name == 'push' || inputs.promote
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-site-${{ github.sha }}
          path: ${{ steps.bundle.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

      - name: Clean staging delivery work after package upload
        if: always()
        uses: ./.github/actions/storage
        with:
          checkout-token: ${{ secrets.LAPLACE_CHECKOUT }}
          receipt: ${{ runner.temp }}/storage.json
      - name: Retain staging cleanup receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-staging-${{ github.run_id }}
          path: ${{ runner.temp }}/storage.json
          if-no-files-found: warn
          retention-days: 14

  cloud-host:
    name: Cloud qualification — start the explicitly requested host
    needs: deliver
    if: needs.deliver.result == 'success' && inputs.qualify_cloud == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Authenticate to GCP by workload identity (no stored key)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/398413378767/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: laplace-pipeline@project-f5812b96-f924-41a4-94c.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Start the instance if it is stopped
        run: |
          set -euo pipefail
          state=$(gcloud compute instances describe hart-cloud --zone us-east1-b --format='value(status)')
          echo "hart-cloud: $state"
          case "$state" in
            RUNNING) ;;
            TERMINATED|STOPPED|SUSPENDED) gcloud compute instances start hart-cloud --zone us-east1-b --quiet ;;
            *) for i in $(seq 1 30); do sleep 10; state=$(gcloud compute instances describe hart-cloud --zone us-east1-b --format='value(status)'); [ "$state" = RUNNING ] && break; done
               [ "$state" = RUNNING ] || gcloud compute instances start hart-cloud --zone us-east1-b --quiet ;;
          esac
          echo "hart-cloud: $(gcloud compute instances describe hart-cloud --zone us-east1-b --format='value(status)')"
          # The build job queues until the host's runner registers (GitHub holds a queued job for a day); no poll of the
          # runner API here, which the workflow token may not read.
      - name: Hold the host for this run
        # The host stops itself when idle (Laplace-Operations setup.sh idlestop), and a job queued behind its
        # concurrency group or waiting for the runner is not running on it yet: on 2026-10-10 the host stopped under
        # run 38023100147 after thirty idle minutes. The lease in the instance's metadata, this run's id and an expiry
        # beyond the qualification timeout, is what the idle stop reads. Release follows qualification,
        # whatever its result, and the expiry ends the lease if the run is interrupted.
        run: |
          set -euo pipefail
          gcloud compute instances add-metadata hart-cloud --zone us-east1-b --quiet \
            --metadata "laplace-lease=${{ github.run_id }} $(( $(date +%s) + 300 * 60 ))"

  production-build:
    name: Cloud qualification — build, load extensions and exercise the selected runtime
    needs: [deliver, cloud-host]
    if: needs.cloud-host.result == 'success'
    runs-on: [self-hosted, laplace, Laplace, cloud]
    timeout-minutes: 240
    concurrency:
      group: laplace-site-cloud
      cancel-in-progress: false
      queue: max
    env:
      LAPLACE_CONNINFO: ""
      LAPLACE_NATIVE: ${{ github.workspace }}/.ci-dependencies/Laplace-Native
      LAPLACE_RECIPE_ENGINE_SOURCE: ${{ github.workspace }}/.ci-dependencies/Laplace-Engine
      LAPLACE_POSTGRES_SOURCE: ${{ github.workspace }}/.ci-dependencies/Laplace-postgres
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out canonical Native
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Native
          ref: 044bd4a361ce32d8a840a480a83bbfd3321ec34e
          path: .ci-dependencies/Laplace-Native
          persist-credentials: false
      - name: Check out canonical Native PostgreSQL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-postgres
          ref: bc62f61684220172ffdbf553118f072962a2209a
          path: .ci-dependencies/Laplace-postgres
          persist-credentials: false
      - name: Check out canonical recipe Engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Engine
          ref: b2c4a8a29ced5d278ec39890d569838e7b8d4988
          path: .ci-dependencies/Laplace-Engine
          persist-credentials: false

      - name: Provide the pinned Rust compiler for the Tree-sitter generator
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.90.0

      - name: Own cloud qualification work until cleanup
        uses: ./.github/actions/storage
        with:
          checkout-token: ${{ secrets.LAPLACE_CHECKOUT }}
          operation: begin

      - name: Externals and build (engine, perf-caches, extensions)
        run: deploy/linux/site.sh externals build

      - name: Install into /opt/laplace
        run: deploy/linux/site.sh install

      - name: Database laplace-mono, extensions updated in place, migrations (the application database too, LAPLACE_APP_DB)
        run: |
          deploy/linux/site.sh database extensions migrate

      - name: Stage and exercise the native CLI with its published dependencies
        run: deploy/linux/site.sh app

      - name: Clean qualification work before cloud lease release
        if: always()
        uses: ./.github/actions/storage
        with:
          checkout-token: ${{ secrets.LAPLACE_CHECKOUT }}
          receipt: ${{ runner.temp }}/storage.json
      - name: Retain cloud cleanup receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-cloud-${{ github.run_id }}
          path: ${{ runner.temp }}/storage.json
          if-no-files-found: warn
          retention-days: 14

  cloud-host-release:
    name: Cloud qualification — release the host to stop when idle
    needs: [cloud-host, production-build]
    if: always() && needs.cloud-host.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticate to GCP by workload identity (no stored key)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/398413378767/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: laplace-pipeline@project-f5812b96-f924-41a4-94c.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Release this run's lease (a newer run's lease is left to that run)
        run: |
          set -euo pipefail
          lease=$(gcloud compute instances describe hart-cloud --zone us-east1-b --format='value(metadata.items.laplace-lease)' || true)
          echo "lease: ${lease:-none}"
          case "$lease" in
            "${{ github.run_id }} "*) gcloud compute instances remove-metadata hart-cloud --zone us-east1-b --quiet --keys laplace-lease; echo "released" ;;
            *) echo "not this run's: left" ;;
          esac

  production:
    name: Production — received, published and restarted on the hosting host (hart-prod)
    needs: deliver
    if: needs.deliver.result == 'success' && (github.event_name == 'push' || inputs.promote)
    runs-on: [self-hosted, laplace, Laplace, production]
    timeout-minutes: 120
    concurrency:
      group: laplace-site-hart-prod
      cancel-in-progress: false
      queue: max
    env:
      LAPLACE_CONNINFO: ""
      LAPLACE_NATIVE: ${{ github.workspace }}/.ci-dependencies/Laplace-Native
      LAPLACE_RECIPE_ENGINE_SOURCE: ${{ github.workspace }}/.ci-dependencies/Laplace-Engine
      LAPLACE_POSTGRES_SOURCE: ${{ github.workspace }}/.ci-dependencies/Laplace-postgres
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Own received production work until readback
        uses: ./.github/actions/storage
        with:
          checkout-token: ${{ secrets.LAPLACE_CHECKOUT }}
          operation: begin

      - name: Where the bundle goes
        id: bundle
        run: |
          b="${LAPLACE_SITE_WORK:-${LAPLACE_WORK:-/repos/work}/mono-site}/bundle"; rm -rf "$b"; mkdir -p "$b"
          echo "path=$b" >> "$GITHUB_OUTPUT"

      - name: Receive the verified bundle from hart-server
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: laplace-site-${{ github.sha }}
          path: ${{ steps.bundle.outputs.path }}

      - name: Receive, migrate application database, publish, restart
        run: deploy/linux/site.sh receive migrate_app publish restart

      - name: Read back
        run: deploy/linux/site.sh smoke

      - name: Retain installed target after failed readback
        if: failure()
        run: deploy/linux/site.sh status

      - name: Clean received production package after readback
        if: always()
        uses: ./.github/actions/storage
        with:
          checkout-token: ${{ secrets.LAPLACE_CHECKOUT }}
          receipt: ${{ runner.temp }}/storage.json
      - name: Retain production cleanup receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-production-${{ github.run_id }}
          path: ${{ runner.temp }}/storage.json
          if-no-files-found: warn
          retention-days: 14
