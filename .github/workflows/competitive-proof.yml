name: Laplace — competitive product proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify exact product candidate
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: release-candidate
      target_sha: ${{ github.sha }}
    secrets: inherit

  synthesize:
    name: Synthesize competitive model proof
    needs: qualify
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: proof-model
      target_sha: ${{ github.sha }}
    secrets: inherit

  activate:
    name: Activate and verify qualified product
    needs: synthesize
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: release-activation
      target_sha: ${{ github.sha }}
    secrets: inherit
