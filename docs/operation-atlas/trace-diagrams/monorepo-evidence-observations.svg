8" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="370.658" y1="919.605" x2="370.658" y2="939.605" style="stroke:#181818;stroke-width:1;"/><polygon points="366.658,929.605,370.658,939.605,374.658,929.605,370.658,933.605" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="370.658" y1="974.699" x2="370.658" y2="994.699" style="stroke:#181818;stroke-width:1;"/><polygon points="366.658,984.699,370.658,994.699,374.658,984.699,370.658,988.699" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="30"><text x="188.621" y="1036.08" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="181.414" y="1048.658" fill="#888" font-size="10" textLength="400.166">claimed. Complete implementation and static SQL reviewed. No result limit, rank or source</text><text x="179.988" y="1061.236" fill="#888" font-size="10" textLength="403.018">standing is introduced by this reader. Duplicate operands share a query probe but preserve</text><text x="186.668" y="1073.814" fill="#888" font-size="10" textLength="389.658">occurrence callbacks; self-reference can appear in both endpoint roles without reversing</text><text x="212.544" y="1086.393" fill="#888" font-size="10" textLength="337.905">the stored claim. NULL filters are unrestricted; explicitly empty filters yield no</text><text x="178.348" y="1098.971" fill="#888" font-size="10" textLength="406.299">witnesses. The SQL-facing materialized wrapper returns ten columns and omits the qualifier</text><text x="308.135" y="1111.549" fill="#888" font-size="10" textLength="146.724">mask carried by native callbacks.</text></g><?plantuml-src hLNHRjis57tNLrnW3ss1nfRaMBRZXw586cn0LhJDjjU28YzZBXIfa5HIxsaViI_Sb-nGiXEZwDEmXq26IDrxxZdddhoYzuz6iPDyGJUYjqBodBycTj5uDxVJcoznQ6CA8l4y1ZdtRUJmA19k