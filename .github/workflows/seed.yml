name: Seed — substrate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "operation"
        type: choice
        required: true
        default: source
        options: [source, foundation-ladder, model]
      source:
        description: "ingest source key when mode=source"
        type: string
        required: false
        default: ""
      path:
        description: "optional file, directory, corpus, or model snapshot path"
        type: string
        required: false
        default: ""
      langs:
        description: "optional language scope; blank means all"
        type: string
        required: false
        default: ""
      database:
        description: "target database"
        type: choice
        options: [laplace]
        default: laplace
      force:
        description: "foundation-ladder: re-ingest every rung"
        type: boolean
        default: false
      evict_before_ingest:
        description: "source mode: retract the selected source before re-ingesting"
        type: boolean
        default: false
      evict_confirm:
        description: "exact decomposer source name required for eviction"
        type: string
        required: false
        default: ""
      chess_derived:
        description: "after source=chess, derive move outcomes and transitions"
        type: boolean
        default: false
      synthesize_model:
        description: "after mode=model, synthesize the substrate GGUF"
        type: boolean
        default: true
  workflow_call:
    inputs:
      mode:
        type: string
        required: false
        default: source
      source:
        type: string
        required: false
        default: ""
      path:
        type: string
        required: false
        default: ""
      langs:
        type: string
        required: false
        default: ""
      database:
        type: string
        required: false
        default: laplace
      force:
        type: boolean
        required: false
        default: false
      evict_before_ingest:
        type: boolean
        required: false
        default: false
      evict_confirm:
        type: string
        required: false
        default: ""
      chess_derived:
        type: boolean
        required: false
        default: false
      synthesize_model:
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  seed:
    name: "${{ inputs.mode }} ${{ inputs.source }} → ${{ inputs.database }}"
    runs-on: [self-hosted, laplace]
    timeout-minutes: 720
    concurrency:
      group: laplace-host-lifecycle
      queue: max
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ github.sha }}
      LAPLACE_DATA_ROOT: /vault/Data
      LAPLACE_DB: "Host=/var/run/postgresql;Username=laplace_admin;Database=${{ inputs.database }}"
      LAPLACE_DBNAME: ${{ inputs.database }}
      PGDATABASE: ${{ inputs.database }}
      LAPLACE_INGEST_CONSOLE: ci
      INGEST_LOGDIR: /build/laplace/work/ingest-logs
      MODE: ${{ inputs.mode }}
      SOURCE_KEY: ${{ inputs.source }}
      PATH_INPUT: ${{ inputs.path }}
      LANGS_INPUT: ${{ inputs.langs }}
      EVICT_CONFIRM: ${{ inputs.evict_confirm }}
      GGUF_OUT: /build/laplace/work/model-outputs/laplace-model-substrate.gguf
    steps:
      - name: Select source and run substrate mutation under one host reservation
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          EVICT_BEFORE_INGEST: ${{ inputs.evict_before_ingest && '1' || '0' }}
          CHESS_DERIVED: ${{ inputs.chess_derived && '1' || '0' }}
          FORCE_INPUT: ${{ inputs.force && '1' || '0' }}
          SYNTHESIZE_MODEL: ${{ inputs.synthesize_model && '1' || '0' }}
        run: |
          set -euo pipefail
          umask 0002
          workspace_lock_root="${LAPLACE_WORK_ROOT:-/build/laplace/work}"
          mkdir -p "$workspace_lock_root"
          exec 9>"$workspace_lock_root/host-resource.lock"
          flock 9
          cd "$GITHUB_WORKSPACE"

          if [[ ! -e .git ]]; then
            [[ -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]] || {
              echo "::error::nonempty workspace has no repository; preserving its files" >&2
              exit 1
            }
            git init --initial-branch=main
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          git diff --quiet
          git diff --cached --quiet
          checkout_auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $checkout_auth" \
            git fetch --no-tags --depth=2 origin "$TARGET_SHA"
          unset checkout_auth CHECKOUT_TOKEN
          git checkout --no-overwrite-ignore --detach "$TARGET_SHA"
          current_sha="$(git rev-parse HEAD)"
          [[ "$current_sha" == "$TARGET_SHA" ]] || {
            echo "::error::seed checkout mismatch (expected $TARGET_SHA, found $current_sha)" >&2
            exit 1
          }
          git diff --quiet
          git diff --cached --quiet

          export LAPLACE_SETUP_USE_CMAKE=false
          export LAPLACE_SETUP_REQUIRE_BUILT_REVISION=true
          source scripts/ci-environment.sh
          built_sha="$(cat build/.laplace-source-revision 2>/dev/null || true)"
          [[ "$built_sha" == "$TARGET_SHA" ]] || {
            echo "::error::seed runtime does not belong to reserved checkout (expected $TARGET_SHA, found ${built_sha:-missing})" >&2
            exit 1
          }

          mkdir -p "$INGEST_LOGDIR"
          if [[ -n "$LANGS_INPUT" ]]; then
            export LAPLACE_INGEST_LANGS="$LANGS_INPUT"
          else
            unset LAPLACE_INGEST_LANGS || true
          fi

          if [[ "$MODE" == source && "$EVICT_BEFORE_INGEST" == 1 ]]; then
            [[ -z "$PATH_INPUT" && -z "$LANGS_INPUT" ]] || {
              echo "::error::source eviction requires a complete source ingest" >&2
              exit 1
            }
            src_name=$(python3 -c 'import json,os; x=json.load(open("scripts/decomposer-gates.json"))["sources"].get(os.environ["SOURCE_KEY"]); print(x["decomposer"] if x else "")')
            [[ -n "$src_name" ]] || { echo "::error::no source mapping for $SOURCE_KEY" >&2; exit 1; }
            [[ "$EVICT_CONFIRM" == "$src_name" ]] || { echo "::error::type '$src_name' in evict_confirm" >&2; exit 1; }
            scripts/measure-lane.sh -- "$GITHUB_WORKSPACE/scripts/laplace" evict "$src_name"
            export LAPLACE_INGEST_FORCE=1
          fi

          case "$MODE" in
            source)
              [[ -n "$SOURCE_KEY" ]] || { echo "::error::mode=source requires source"; exit 2; }
              if [[ -n "$PATH_INPUT" ]]; then
                scripts/ingest-source.sh "$SOURCE_KEY" "$PATH_INPUT"
              else
                scripts/ingest-source.sh "$SOURCE_KEY"
              fi
              if [[ "$SOURCE_KEY" == chess && "$CHESS_DERIVED" == 1 ]]; then
                scripts/ingest-source.sh chess-move-outcomes
                scripts/ingest-source.sh chess-transitions
              fi
              ;;
            foundation-ladder)
              args=()
              [[ "$FORCE_INPUT" != 1 ]] || args+=(--force)
              exec bash scripts/ensure-foundation.sh "${args[@]}"
              ;;
            model)
              model_dir="$PATH_INPUT"
              [[ -n "$model_dir" ]] || model_dir="${LAPLACE_TINYLLAMA_DIR:-}"
              [[ -n "$model_dir" && -d "$model_dir" ]] || { echo "::error::model snapshot directory is missing"; exit 1; }
              if [[ "$SYNTHESIZE_MODEL" == 1 ]]; then
                mkdir -p "$(dirname "$GGUF_OUT")"
                LAPLACE_GGUF_OUT="$GGUF_OUT" scripts/model-synthesize-ci.sh "$model_dir"
              else
                scripts/ingest-source.sh model "$model_dir"
              fi
              ;;
            *)
              echo "::error::unknown seed mode: $MODE"
              exit 2
              ;;
          esac
