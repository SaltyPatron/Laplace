name: Product — maintenance
run-name: "Product maintenance — ${{ format('{0} / {1}', inputs.operation, inputs.target) }} @ ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Explicit installed-product operation; normal main delivery is automatic"
        type: choice
        required: true
        default: verify
        options: [status, storage, clean, access-audit, access-enroll, owner-enroll, verify, forward-chat-proof, reconcile, chess-lab, deploy, qualify-cloud]
      target:
        description: "staging deploys to hart-server; production promotes its verified package; qualify-cloud explicitly uses the database host"
        type: choice
        required: true
        default: staging
        options: [staging, production, cloud]
      access_request:
        description: "Optional access or persistent installation owner request file (default owners are seeded by SQL migration)"
        type: string
        required: false
      stockfish_source:
        description: "For chess-lab: existing absolute official Stockfish checkout to build and retain as the runtime source"
        type: string
        required: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  access-contract:
    name: Validate platform access maintenance
    if: github.event_name == 'push' || inputs.operation == 'access-audit' || inputs.operation == 'access-enroll' || inputs.operation == 'owner-enroll'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      request: ${{ steps.request.outputs.request }}
      owners: ${{ steps.owners.outputs.requests }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/test-platform-access-audit.py
      - run: python3 scripts/test-platform-access-enroll.py
      - run: python3 scripts/test-platform-owner-enroll.py
      - name: Select explicitly reviewed persistent owner declarations
        id: owners
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          OPERATION: ${{ inputs.operation }}
          TARGET: ${{ inputs.target }}
          REQUEST_PATH: ${{ inputs.access_request }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, re, subprocess
          spec = importlib.util.spec_from_file_location('owner_enrollment', 'scripts/platform-owner-enroll.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          if os.environ['EVENT_NAME'] == 'push':
              assert all(re.fullmatch('[0-9a-f]{40}', os.environ[k]) for k in ('BEFORE_SHA','AFTER_SHA')), 'Invalid revision'
              changed = subprocess.check_output(['git','diff','--name-only','--diff-filter=AM',os.environ['BEFORE_SHA'],os.environ['AFTER_SHA'],'--','.github/owner-requests/'], text=True).splitlines()
          elif os.environ['OPERATION'] == 'owner-enroll':
              changed = [os.environ['REQUEST_PATH']]
          else:
              changed = []
          assert len(changed) <= 2, 'Review at most one owner declaration per application host'
          selected, targets = [], set()
          for name in changed:
              assert re.fullmatch(r'\.github/owner-requests/(staging|production)-[a-z0-9-]+\.json', name), 'Invalid owner request path'
              path = pathlib.Path(name)
              assert path.is_file() and not path.is_symlink() and path.stat().st_size <= 65536, 'Invalid owner request file'
              request = module.validate_request(json.loads(path.read_text()))
              assert path.name.startswith(request['target'] + '-') and request['target'] not in targets, 'Duplicate or mismatched owner target'
              assert os.environ['EVENT_NAME'] == 'push' or request['target'] == os.environ['TARGET'], 'Selected target differs from owner request'
              targets.add(request['target'])
              selected.append(dict(target=request['target'],host=request['host'],request=name))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('requests=' + json.dumps(selected, separators=(',',':')) + '\n')
          PY
      - name: Select only an explicitly reviewed enrollment request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          OPERATION: ${{ inputs.operation }}
          TARGET: ${{ inputs.target }}
          REQUEST_PATH: ${{ inputs.access_request }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, re, subprocess
          if os.environ['EVENT_NAME'] == 'push':
              for key in ('BEFORE_SHA', 'AFTER_SHA'):
                  assert re.fullmatch('[0-9a-f]{40}', os.environ[key]), 'Invalid revision'
              changed = subprocess.check_output(['git','diff','--name-only','--diff-filter=AM',os.environ['BEFORE_SHA'],os.environ['AFTER_SHA'],'--','.github/access-requests/'], text=True).splitlines()
          elif os.environ['OPERATION'] == 'access-enroll':
              assert os.environ['TARGET'] == 'staging', 'Initial enrollment supports staging only'
              changed = [os.environ['REQUEST_PATH']]
          else:
              changed = []
          assert len(changed) <= 1, 'Review one enrollment request per operation'
          if changed:
              name = changed[0]
              assert re.fullmatch(r'\.github/access-requests/staging-[a-z0-9-]+\.json', name), 'Invalid enrollment request path'
              path = pathlib.Path(name)
              assert path.is_file() and not path.is_symlink() and path.stat().st_size <= 65536, 'Invalid enrollment request file'
              spec = importlib.util.spec_from_file_location('enrollment', 'scripts/platform-access-enroll.py')
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              module.validate_request(json.loads(path.read_text()))
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('request=' + name + '\n')
          PY

  access-enroll:
    name: Apply the reviewed initial staging access request
    needs: access-contract
    if: needs.access-contract.outputs.request != ''
    runs-on: [self-hosted, laplace, staging]
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: laplace-site-hart-server
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          clean: false
      - name: Prepare exact candidate while retaining verified build inputs
        run: bash scripts/ci/prepare-checkout.sh
      - name: Enroll selected existing bindings under the host reservation
        env:
          REQUEST_PATH: ${{ needs.access-contract.outputs.request }}
        run: |
          set -euo pipefail
          machine_values=$(python3 scripts/machine-env.py --paths --database)
          eval "$machine_values"
          unset machine_values
          export LAPLACE_INSTALL_PREFIX="${LAPLACE_INSTALL_PREFIX:-/opt/laplace}"
          export LAPLACE_APP_DBNAME="${LAPLACE_APP_DBNAME:?Declare the application database}"
          export PGDATABASE="$LAPLACE_APP_DBNAME"
          export PGHOST="${LAPLACE_APP_PGHOST:-$PGHOST}"
          export PGPORT="${LAPLACE_APP_PGPORT:-$PGPORT}"
          export PGUSER="${LAPLACE_APP_ROLE:-${LAPLACE_ROLE:-laplace}}"
          export LAPLACE_API_URL="${LAPLACE_API_URL:-http://127.0.0.1:5187}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path(os.environ['REQUEST_PATH']).read_text())
          assert request['origin'].rstrip('/') == os.environ['LAPLACE_API_URL'].rstrip('/'), 'Request must select the declared API listener'
          PY
          lock="${LAPLACE_HOST_LOCK:-${LAPLACE_LOCKS:-/run/lock/laplace}/host-resource.lock}"
          source deploy/linux/host-lock.sh
          host_lock_hold exclusive 8 "$lock" 120
          umask 077
          journal="${LAPLACE_WORK_ROOT:?Declare persistent host work}/platform-access-enrollment"
          mkdir -p -m 700 "$journal"
          python3 scripts/platform-access-enroll.py --request "$REQUEST_PATH" \
            --journal-directory "$journal" \
            --state-file "$RUNNER_TEMP/platform-enrollment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
      - name: Retain only the reduced enrollment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-enrollment-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-enrollment-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14

  access-audit:
    name: Read installed platform access on ${{ matrix.target }}
    needs: [access-contract, access-enroll, owner-enroll]
    if: always() && needs.access-contract.result == 'success' && (github.event_name == 'push' || (inputs.operation == 'access-audit' && inputs.target != 'cloud') || inputs.operation == 'access-enroll' || inputs.operation == 'owner-enroll')
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'push' && '["staging","production"]' || format('["{0}"]', inputs.target)) }}
    runs-on: [self-hosted, laplace, '${{ matrix.target }}']
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: laplace-maintenance-${{ matrix.target }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          clean: false
      - name: Prepare exact candidate while retaining verified build inputs
        run: bash scripts/ci/prepare-checkout.sh
      - name: Read role state under the installed host reservation
        shell: bash
        env:
          AUDIT_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          machine_values=$(python3 scripts/machine-env.py)
          eval "$machine_values"
          unset machine_values
          export LAPLACE_INSTALL_PREFIX="${LAPLACE_INSTALL_PREFIX:-/opt/laplace}"
          lock="${LAPLACE_HOST_LOCK:-${LAPLACE_LOCKS:-/run/lock/laplace}/host-resource.lock}"
          source deploy/linux/host-lock.sh
          host_lock_hold shared 8 "$lock" 120
          result=0
          python3 scripts/platform-access-audit.py \
            --base "${LAPLACE_API_URL:-http://127.0.0.1:5187}" \
            --state-file "$RUNNER_TEMP/platform-access-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" >/dev/null || result=$?
          export LAPLACE_APP_DIR="${LAPLACE_APP_DIR:-$LAPLACE_INSTALL_PREFIX/app}"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / ('platform-access-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.json')
          report = json.loads(path.read_text())
          revision = Path(os.environ['LAPLACE_APP_DIR']) / '.laplace-source-revision'
          try:
              installed = revision.read_text().strip()
          except OSError:
              installed = ''
          report.update(target=os.environ['AUDIT_TARGET'], collector_revision=os.environ['GITHUB_SHA'],
                        installed_revision=installed if re.fullmatch('[0-9a-f]{40}', installed) else None)
          raw = json.dumps(report, indent=2, sort_keys=True) + '\n'
          path.write_text(raw)
          print(raw, end='')
          PY
          exit "$result"
      - name: Retain only the reduced access report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-access-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-access-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14

  unsupported-deployment:
    name: Reject a database host as an application deployment target
    if: inputs.operation == 'deploy' && inputs.target == 'cloud'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Application deployment supports staging or production. Select qualify-cloud for isolated cloud-host qualification.' >&2
          exit 2

  unsupported-access-target:
    name: Reject a database host as a browser access audit target
    if: inputs.operation == 'access-audit' && inputs.target == 'cloud'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Browser access audit supports staging or production; hart-cloud is a database host.' >&2
          exit 2

  deploy:
    name: Deploy to ${{ inputs.target }}
    if: inputs.operation == 'deploy' && inputs.target != 'cloud'
    uses: ./.github/workflows/laplace.yml
    with:
      promote: ${{ inputs.target == 'production' }}
    secrets: inherit

  qualify-cloud:
    name: Explicit isolated cloud qualification
    if: inputs.operation == 'qualify-cloud'
    uses: ./.github/workflows/laplace.yml
    with:
      promote: false
      qualify_cloud: true
    secrets: inherit

  verify:
    name: Verify the installed application on ${{ inputs.target }}
    if: inputs.operation == 'verify' || inputs.operation == 'status'
    runs-on: [self-hosted, laplace, '${{ inputs.target }}']
    timeout-minutes: 10
    concurrency:
      group: laplace-maintenance-${{ inputs.target }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out the verification implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          clean: false
      - name: Prepare exact candidate while retaining verified build inputs
        run: bash scripts/ci/prepare-checkout.sh
      - name: Execute the same installed-runtime checks used by promotion
        if: inputs.operation == 'verify'
        env:
          LAPLACE_VERIFICATION_STATE: ${{ github.workspace }}/artifacts/application-verification.json
        run: env -u GITHUB_SHA bash deploy/linux/site.sh smoke
      - name: Read installed configuration and target connectivity
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bash deploy/linux/site.sh status | tee artifacts/site-status.json
          python3 -c 'import json; report=json.load(open("artifacts/site-status.json")); assert report.get("host") and report.get("app_dir"), "Missing installed status identity"'
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: application-verification-${{ inputs.target }}-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: warn

  operator:
    name: ${{ inputs.operation }} on ${{ inputs.target }}
    if: inputs.operation == 'reconcile' || inputs.operation == 'chess-lab'
    runs-on: [self-hosted, laplace, '${{ inputs.target }}']
    timeout-minutes: 120
    permissions:
      contents: read
    concurrency:
      group: laplace-maintenance-${{ inputs.target }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out the maintenance implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          clean: false
      - name: Prepare exact candidate while retaining verified build inputs
        run: bash scripts/ci/prepare-checkout.sh
      - name: Operate on the selected installed runtime
        env:
          OPERATION: ${{ inputs.operation }}
          LAPLACE_STOCKFISH_SOURCE: ${{ inputs.stockfish_source }}
          LAPLACE_HOST_LOCK_WAIT_SECONDS: ${{ vars.LAPLACE_HOST_LOCK_WAIT_SECONDS || 'wait' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bash deploy/linux/site.sh status | tee artifacts/site-before.json
          env -u GITHUB_SHA bash deploy/linux/site.sh "$OPERATION" 2>&1 | tee artifacts/maintenance.log
          bash deploy/linux/site.sh status | tee artifacts/site-after.json
      - name: Retain the selected target and operation result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-maintenance-${{ inputs.target }}-${{ inputs.operation }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

  forward-chat-proof:
    if: inputs.operation == 'forward-chat-proof'
    name: Capture forward chat lifecycle receipt
    runs-on: [self-hosted, laplace, '${{ inputs.target }}']
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      LAPLACE_PROOF_TENANT: deployment-verification
      LAPLACE_API_KEY: ${{ secrets.LAPLACE_API_KEY }}
      LAPLACE_QUOTE_ID: ${{ secrets.LAPLACE_QUOTE_ID }}
      LAPLACE_BILLING_BYPASS: ${{ vars.LAPLACE_BILLING_BYPASS }}
      LAPLACE_AUTH_DEV_PRINCIPAL: ${{ vars.LAPLACE_AUTH_DEV_PRINCIPAL }}
    steps:
      - name: Checkout exact proof revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: false
      - name: Prepare exact candidate while retaining verified build inputs
        run: bash scripts/ci/prepare-checkout.sh
      - name: Execute ordinary two-turn chat and capture substrate/native lifecycle
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/database.sh
          export LAPLACE_API_BASE="${LAPLACE_PUBLIC_BASE_URL:-${LAPLACE_API_URL:-http://127.0.0.1:5187}}"
          source deploy/linux/host-lock.sh
          host_lock_hold exclusive 9 "${LAPLACE_HOST_LOCK:-$LAPLACE_LOCK_ROOT/host-resource.lock}"
          mkdir -p artifacts/forward-chat-lifecycle
          export LAPLACE_VERIFICATION_TENANT="$LAPLACE_PROOF_TENANT"
          python3 scripts/run-authenticated-verification.py --base "$LAPLACE_API_BASE" -- \
            python3 scripts/verify-forward-chat-lifecycle.py \
              --receipt artifacts/forward-chat-lifecycle/receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/forward-chat-lifecycle/receipt.json").read_text())
          assert r["disposition"] == "verified", r.get("error")
          print("session:", r["session"])
          print("session_id:", r["session_id"])
          print("proof_fingerprint_sha256:", r["proof_fingerprint_sha256"])
          print("turns_after_first:", len(r["after_first"]["turns"]))
          print("turns_after_second:", len(r["after_second"]["turns"]))
          print("turn_two_native_events:", len(r["turn_two_native_receipt"]["execution"]))
          PY
      - name: Publish lifecycle proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-chat-lifecycle-${{ github.run_id }}
          path: artifacts/forward-chat-lifecycle/
          if-no-files-found: error
          retention-days: 90

  owner-enroll:
    name: Persist installation owners on ${{ matrix.target }}
    needs: [access-contract, access-enroll]
    if: always() && needs.access-contract.result == 'success' && (needs.access-enroll.result == 'success' || needs.access-enroll.result == 'skipped') && needs.access-contract.outputs.owners != '' && needs.access-contract.outputs.owners != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.access-contract.outputs.owners) }}
    runs-on: [self-hosted, laplace, '${{ matrix.target }}']
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: laplace-site-${{ matrix.host }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          clean: false
      - name: Prepare exact candidate while retaining verified build inputs
        run: bash scripts/ci/prepare-checkout.sh
      - name: Persist verified bindings, activate owner policy and verify serving authority
        env:
          REQUEST_PATH: ${{ matrix.request }}
        run: |
          set -euo pipefail
          machine_values=$(python3 scripts/machine-env.py --paths --database)
          eval "$machine_values"
          unset machine_values
          export LAPLACE_INSTALL_PREFIX="${LAPLACE_INSTALL_PREFIX:-/opt/laplace}"
          export LAPLACE_APP_DBNAME="${LAPLACE_APP_DBNAME:?Declare the application database}"
          export PGDATABASE="$LAPLACE_APP_DBNAME"
          export PGHOST="${LAPLACE_APP_PGHOST:-$PGHOST}"
          export PGPORT="${LAPLACE_APP_PGPORT:-$PGPORT}"
          export PGUSER="${LAPLACE_APP_ROLE:-${LAPLACE_ROLE:-laplace}}"
          export LAPLACE_API_URL="${LAPLACE_API_URL:-http://127.0.0.1:5187}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path(os.environ['REQUEST_PATH']).read_text())
          assert request['origin'].rstrip('/') == os.environ['LAPLACE_API_URL'].rstrip('/'), 'Owner request must select the declared API listener'
          PY
          lock="${LAPLACE_HOST_LOCK:-${LAPLACE_LOCKS:-/run/lock/laplace}/host-resource.lock}"
          source deploy/linux/host-lock.sh
          host_lock_hold exclusive 8 "$lock" 120
          umask 077
          directory="${LAPLACE_WORK_ROOT:?Declare persistent host work}/platform-owners"
          mkdir -p -m 700 "$directory"
          export LAPLACE_PLATFORM_OWNER_POLICY_FILE="$directory/policy.json"
          receipt="$RUNNER_TEMP/platform-owners-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          python3 scripts/platform-owner-enroll.py --request "$REQUEST_PATH" \
            --policy "$LAPLACE_PLATFORM_OWNER_POLICY_FILE" --state-file "$receipt"
          env -u GITHUB_SHA bash deploy/linux/site.sh configure restart
          python3 scripts/platform-owner-enroll.py --request "$REQUEST_PATH" \
            --policy "$LAPLACE_PLATFORM_OWNER_POLICY_FILE" --state-file "$receipt" --verify
      - name: Retain only the reduced owner authority receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-owners-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-owners-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14

  storage-select:
    if: inputs.operation == 'clean' || inputs.operation == 'storage'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      run: ${{ steps.select.outputs.run }}
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - name: Authenticate only to inspect the cloud worker
        if: inputs.target == 'cloud'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: projects/398413378767/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: laplace-pipeline@project-f5812b96-f924-41a4-94c.iam.gserviceaccount.com
      - name: Cloud inspection client
        if: inputs.target == 'cloud'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Select an existing worker without starting one
        id: select
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            staging) label=staging ;;
            production) label=production ;;
            cloud)
              label=cloud
              state=$(gcloud compute instances describe hart-cloud --zone us-east1-b --format='value(status)')
              if [[ "$state" != RUNNING ]]; then
                echo 'run=false' >> "$GITHUB_OUTPUT"
                echo "Cloud cleanup deferred: hart-cloud is $state. Its next leased job runs cleanup before lease release." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              lease=$(gcloud compute instances describe hart-cloud --zone us-east1-b --format='value(metadata.items.laplace-lease)')
              if [[ "$lease" =~ ^[0-9]+\ ([0-9]+)$ && ${BASH_REMATCH[1]} -gt $(date +%s) ]]; then
                echo 'run=false' >> "$GITHUB_OUTPUT"
                echo 'Cloud cleanup belongs to its active qualification lease and runs before that lease is released.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi ;;
            *) exit 2 ;;
          esac
          echo 'run=true' >> "$GITHUB_OUTPUT"
          printf 'runner=["self-hosted","laplace","Laplace","%s"]\n' "$label" >> "$GITHUB_OUTPUT"
  storage-maintain:
    needs: storage-select
    if: needs.storage-select.outputs.run == 'true'
    runs-on: ${{ fromJSON(needs.storage-select.outputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          clean: false
      - name: Prepare exact candidate while retaining verified build inputs
        run: bash scripts/ci/prepare-checkout.sh
      - name: Audit or clean with the qualified owner
        uses: ./.github/actions/storage
        with:
          checkout-token: ${{ secrets.LAPLACE_CHECKOUT }}
          operation: ${{ inputs.operation == 'storage' && 'status' || 'clean' }}
          receipt: ${{ runner.temp }}/storage.json
      - name: Retain cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-${{ inputs.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/storage.json
          if-no-files-found: warn
          retention-days: 14
