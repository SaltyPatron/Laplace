name: Laplace — build, deploy, test

# One sequenced, idempotent pipeline. Every stage is a no-op on a healthy,
# up-to-date system; every stage gates the next. CI is an orchestrator only —
# the operations live in scripts/pipeline.sh (one phase per job) so the
# Actions graph maps 1:1 onto pipeline phases.
#
#   policy ─┐
#           ├─> build -> unit-test -> deploy -> db-ops -> integration-test
#   deps ───┘                              (seed: dispatch-only)   │
#                              restore-api <── smoke <── publish <─┘
#
# Seeds NEVER run on push (operator decision 2026-07-24): a push deploys code
# (install/db-ops legitimately bounce PG — that IS the deployment unit), but
# seed ladders are long, data-touching, and belong to the operator. They run
# only on workflow_dispatch (seed=true, or forced by fresh_db) or via the
# dedicated seed-*.yml workflows. Rebuilds therefore preempt seeds by design —
# seed steps are required to be idempotent/resumable (content-addressing +
# completion markers), so a preempted seed loses nothing and re-runs cleanly.
# publish still gates on /health/ready: on push the standing substrate is
# already seeded, so the gate holds; on a fresh_db dispatch, seed is forced
# and precedes publish exactly as before.

on:
  # Main only — PRs must not burn the self-hosted runner. Manual re-runs via
  # workflow_dispatch. Merge-to-main is the gate.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        # HOW FAR TO GO. A dispatch used to mean the whole ladder -- policy,
        # build, unit tests, deploy, migrate, pg_regress, publish, smoke --
        # even when the operator only wanted to know whether a branch compiles.
        # Stop where you meant to stop.
        #
        # Cumulative: each stage runs everything before it. Push to main is
        # ALWAYS `all` and is unaffected by this input, so the deploy path
        # cannot be weakened by a default.
        #
        #   check      policy + deps           -- manifest, vocabulary, codegen
        #                                         determinism, presence tripwire
        #   build      + build                 -- engine, extensions, app, perfcache
        #   test       + unit tests            -- native ctest
        #   deploy     + deploy + db-ops       -- install to /opt/laplace, migrate,
        #                                         extension sync, tuning
        #   integrate  + integration tests     -- pg_regress + dotnet (+ seed, when
        #                                         the seed/fresh_db inputs ask for it)
        #   all        + publish + smoke       -- ship the API and SPA, prove it live
        description: "how far to run (cumulative; push to main is always 'all')"
        type: choice
        required: true
        default: all
        options: [check, build, test, deploy, integrate, all]
      full_clean:
        description: "wipe build/ before building (same as --force-rebuild)"
        type: boolean
        default: false
      force_codegen:
        description: "ignore attestation-law stamp; always regenerate"
        type: boolean
        default: false
      fresh_db:
        description: "nuke + re-migrate + force-reseed foundation (destructive schema changes only)"
        type: boolean
        default: false
      serial_tests:
        description: "force serial ctest/regress (LAPLACE_TEST_SERIAL=1)"
        type: boolean
        default: false
      force_all:
        description: "ignore content-fingerprint stamps — run every phase/test even when its inputs are unchanged"
        type: boolean
        default: false

# NO WORKFLOW-LEVEL CONCURRENCY -- it cannot say what this pipeline needs.
#
# Two different things happen in this workflow and they want opposite policies:
#
#   CHEAP AND PURE   policy, build, unit-test. Superseding these is free, and on
#                    main it is better than free: a later merge means the running
#                    build is already testing deprecated code. Cancel it.
#   MUTATING         deploy, db-ops, publish, smoke, restore-api. These stop the
#                    API, replace binaries in /opt/laplace and bounce PostgreSQL.
#                    A cancel lands anywhere in that window -- half-installed
#                    tree, service down, or the MSB3027 poisoned-output state.
#                    Never cancel these.
#
# A workflow-level group cancels the WHOLE RUN, including a job mid-install, so it
# cannot hold both policies at once. That is why the old config had to queue main
# entirely: it was protecting the deploy by refusing to cancel the build. The groups
# are per-job below instead.
#
# Cancelling the build is what protects against a stale deploy: every mutating job
# is `needs:` the build, so a cancelled build takes its own deploy with it and no
# superseded code can reach the box.

permissions:
  contents: read

# Whole-RUN serialization on the shared self-hosted workspace. The per-job
# groups this replaces (-policy/-build/-unit-test suffixes) let a NEW run's
# build job cancel-and-rewipe _work/ while the OLD run's test jobs were still
# executing in it — measured 2026-08-05: two consecutive runs failed with
# ctest "Failed to change working directory to .../build: No such file or
# directory" while a solo run of the same tree passed.
#
# Runs QUEUE, never cancel: cancel-in-progress would kill deploy/db-ops/
# publish mid-install (the "never cancelled" jobs below — half-installed
# tree), so a superseded run finishes wastefully-but-safely instead. And the
# group is REF-INDEPENDENT: the wipe race is on the one shared _work/, which
# a workflow_dispatch from another ref hits just the same.
concurrency:
  group: laplace-shared-workspace
  cancel-in-progress: false

env:
  LAPLACE_EXTERNAL:       ${{ vars.LAPLACE_EXTERNAL       || '/opt/laplace/external' }}
  LAPLACE_INSTALL_PREFIX: ${{ vars.LAPLACE_INSTALL_PREFIX || '/opt/laplace' }}
  # Build against the SAME from-source postgres the postmaster runs — never
  # the apt-packaged headers (packaged PG is being removed from the host).
  LAPLACE_PG_PREFIX:      ${{ vars.LAPLACE_PG_PREFIX      || '/opt/laplace/pgsql-18' }}
  PGDATABASE: laplace
  LAPLACE_DATA_ROOT: /vault/Data
  # Change-aware skipping (scripts/lib/fp.sh): phases/tests whose input content
  # is unchanged since their last SUCCESS no-op. force_all bypasses every gate.
  LAPLACE_FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all && '1' || '' }}

jobs:

  policy:
    name: Policy — manifest, attestation, vocabulary
    # Self-hosted (was ubuntu-latest): it was the ONLY GitHub-hosted job, and `build` needs it.
    # When the account's hosted-minutes/spending-limit blocks hosted jobs, GitHub refuses to
    # schedule the whole run (0 jobs, indefinitely pending) even though every other job is
    # self-hosted. These checks are pure python/bash/git (validate-pipeline, regenerate+verify
    # deterministic, banned-terms) — safe on the self-hosted runner, which already runs `deps`.
    runs-on: [self-hosted, laplace]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: CI presence tripwire
        # Guards against a repo-hygiene commit sweeping the CI definition away
        # again (commit 0b5d1df deleted every workflow + composite action and
        # CI silently stopped triggering).
        run: |
          fail=0
          for f in \
            .github/workflows/laplace.yml \
            .github/workflows/_ingest.yml \
            .github/workflows/seed-foundation.yml \
            .github/workflows/seed-knowledge.yml \
            .github/workflows/seed-documents.yml \
            .github/workflows/seed-chess.yml \
            .github/workflows/seed-code.yml \
            .github/workflows/seed-models.yml \
            .github/actions/setup-laplace-env/action.yml \
            scripts/pipeline.sh \
            scripts/test-parallel.sh \
            scripts/lib/fp.sh \
            scripts/affected-app.py \
            scripts/setup-host.sh \
            scripts/bootstrap-laplace-runner.sh \
            scripts/ingest-source.sh \
            scripts/isa-gate-check.py \
            scripts/isa-gate-baseline.json \
            scripts/ensure-foundation.sh \
            scripts/eval-generation.py \
            scripts/eval-probes.json \
            scripts/eval-baselines.json; do
            [ -f "$f" ] || { echo "::error file=$f::CI-critical file missing"; fail=1; }
          done
          exit "$fail"

      - name: Validate witness-manifest vs orchestration scripts
        run: python3 scripts/validate-pipeline.py

      - name: Enforce ISA literalism ratchets
        run: python3 scripts/isa-gate-check.py

      - name: Regenerate attestation law + verify deterministic
        run: |
          set -euo pipefail
          # Codegen outputs are gitignored (CMake regenerates them every build), so a
          # `git diff` here guards nothing — every listed file is untracked. The real
          # invariant is that codegen is a DETERMINISTIC function of the manifest TOML;
          # non-determinism breaks the content-addressed rock. Regenerate, snapshot,
          # wipe, regenerate from clean, and require byte-identical output.
          outs=(
            engine/core/src/generated/relation_law.c
            engine/core/src/generated/pos_law.c
            engine/core/include/laplace/core/relation_law.h
            engine/core/include/laplace/core/pos_law.h
            engine/core/include/laplace/core/highway_manifest.h
            extension/laplace_substrate/sql/generated/seed_relation_types.sql.in
            extension/laplace_substrate/sql/generated/seed_pos.sql.in
          )
          python3 scripts/codegen-attestation-law.py
          for f in "${outs[@]}"; do
            [ -f "$f" ] || { echo "::error file=$f::codegen did not produce a declared output"; exit 1; }
          done
          a=$(cat "${outs[@]}" | sha256sum | cut -d' ' -f1)
          # Wipe only the OUTPUTS, never the codegen stamp: the python codegen
          # doesn't read the stamp, the stamp keys on manifest/script mtimes
          # (untouched here), and the regen below restores byte-identical
          # outputs — deleting the stamp on this shared self-hosted workspace
          # forced the build job's phase_codegen to re-run on every push.
          rm -f "${outs[@]}"
          python3 scripts/codegen-attestation-law.py
          b=$(cat "${outs[@]}" | sha256sum | cut -d' ' -f1)
          [ "$a" = "$b" ] || { echo "::error::codegen NON-DETERMINISTIC ($a != $b) — same TOML, different output; breaks content-addressing"; exit 1; }
          echo "codegen deterministic across a clean regen: $a"

      - name: Docs inventory drift gate
        # docs/INVENTORY.md is generated (scripts/docs-inventory.py): the counted
        # facts prose docs cite (projects, decomposers, SQL families, relations).
        # The 2026-07-18 audit found every count embedded in prose had drifted, so
        # prose carries NO counts and points here instead — README, ARCHITECTURE,
        # INDEX, COMPLETION_PLAN, INVENTIONS and the doc-reconciler agent all
        # depend on that. The file therefore has to be true at every commit, which
        # is why it is committed and why this stays BLOCKING.
        #
        # What changed is that keeping it true is no longer a human step.
        # scripts/githooks/pre-commit regenerates and stages this file on every
        # commit; scripts/install-githooks.sh points core.hooksPath at it and is
        # invoked by scripts/check-prereqs.sh and scripts/agent-worktree.sh, so any
        # checkout that has been set up at all has it. This gate is now a backstop
        # for a checkout that skipped setup, not the mechanism.
        #
        # It blocked main twice on 2026-08-04 because the mechanism WAS a human
        # remembering. Making the gate advisory would have been the wrong fix: it
        # would keep the drift and hide it. The fix is upstream — nobody has to
        # remember anything.
        run: python3 scripts/docs-inventory.py --check

      - name: Forbid C# attestation policy in decomposers
        run: |
          set -e
          violations=0
          files=$(find app \( -path 'app/Laplace.Decomposers/*.cs' -o -path 'app/Laplace.Decomposers/*/*.cs' -o -path 'app/Laplace.Substrate/Abstractions/*.cs' \) \
            ! -path 'app/Laplace.Decomposers.Tests/*')
          for pattern in AttestationFactory 'RelationTypeRegistry\.Attest' 'ScoreFp1e9\s*=' 'AttestationOutcome\.(Confirm|Refute|Draw)'; do
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "::error file=$f::Forbidden attestation policy: $pattern"
              violations=$((violations+1))
            done < <(rg -l "$pattern" $files 2>/dev/null || true)
          done
          exit "$violations"

      - name: Scan for unflagged banned terms
        run: |
          set +e
          banned_terms=(
            "HNSWLib" "hnswlib" "FAISS" "ScaNN" "Milvus" "Pinecone"
            "oneDNN" "cuDNN"
          )
          files_to_scan=$(find . -type f \( -name '*.md' -o -name '*.h' -o -name '*.hpp' -o -name '*.cpp' -o -name '*.c' -o -name '*.cs' -o -name '*.sql' \) \
            ! -path './.git/*' ! -path './node_modules/*' ! -path './.github/archive/*')
          violations=0
          for term in "${banned_terms[@]}"; do
            while IFS= read -r match; do
              file=$(echo "$match" | cut -d: -f1)
              case "$file" in
                ./CLAUDE.md|./.claude/agents/conventional-ai-skeptic.md)
                  ;;
                *)
                  echo "::warning file=$file::Banned term '$term' appears outside allowed files"
                  violations=$((violations+1))
                  ;;
              esac
            done < <(grep -nH "$term" $files_to_scan 2>/dev/null)
          done
          echo "Total unflagged banned-term occurrences: $violations"
          exit "$violations"

  deps:
    name: Runner capabilities + system deps (no-op when current)
    runs-on: [self-hosted, laplace]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, clean: false }

      - name: Guard — workspace must stay submodule-free
        run: |
          fail=0
          if [ -d .git/modules ] && [ -n "$(ls -A .git/modules 2>/dev/null)" ]; then
            echo "::error::.git/modules is populated — deps must source from \$LAPLACE_EXTERNAL"
            fail=1
          fi
          init=$(git submodule status 2>/dev/null | grep -cE '^[ +U]' || true)
          if [ "${init:-0}" -gt 0 ]; then
            echo "::error::$init submodule(s) initialized in workspace"
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "workspace submodule-free"
          exit "$fail"

      - name: Toolchain probes
        run: |
          [ -d /opt/intel/oneapi ] || { echo "::error::oneAPI missing"; exit 1; }
          command -v python3 >/dev/null || { echo "::error::python3 missing"; exit 1; }
          "$LAPLACE_PG_PREFIX/bin/pg_config" --version >/dev/null || { echo "::error::pg_config not found at $LAPLACE_PG_PREFIX"; exit 1; }
          command -v dotnet >/dev/null || { echo "::error::dotnet not found"; exit 1; }
          command -v bash >/dev/null || { echo "::error::bash not found"; exit 1; }
          RESULT=$(psql -d postgres -U laplace_admin -tAc "SELECT current_user || ' on ' || current_database();")
          [ "$RESULT" = "laplace_admin on postgres" ] || { echo "::error::peer auth failed: $RESULT"; exit 1; }
          UCD_ZIP="${LAPLACE_DATA_ROOT:-/vault/Data}/UCD/Public/UCD/latest/ucdxml/ucd.nounihan.flat.zip"
          [ -f "$UCD_ZIP" ] || { echo "::error::UCD zip missing: $UCD_ZIP"; exit 1; }

      - name: Sync /opt/laplace/external to .gitmodules pins
        run: |
          for d in tree-sitter geos proj gdal pgsql-18 include lib share bin; do
            mkdir -p "/opt/laplace/$d"
          done
          scripts/sync-external.sh

      - name: Build system deps (fingerprinted — skip unless pins change)
        run: |
          # Stamp + installs live under /opt/laplace; LAPLACE_FORCE_DEPS=1 to rebuild.
          umask 0002
          bash scripts/build-system-deps.sh

      - name: Verify installed dep artifacts
        run: |
          miss=0
          for f in \
            /opt/laplace/proj/lib/libproj.so \
            /opt/laplace/geos/lib/libgeos_c.so \
            /opt/laplace/gdal/lib/libgdal.so \
            /opt/laplace/pgsql-18/bin/postgres \
            /opt/laplace/pgsql-18/lib/postgis-3.so \
            /opt/laplace/tree-sitter/lib/libtree-sitter.a; do
            if [ -e "$f" ]; then echo "  ok $f"; else echo "::error::missing artifact: $f"; miss=1; fi
          done
          exit "$miss"

  build:
    name: Build — engine, extensions, app, perfcache
    needs: [policy, deps]
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(fromJSON('["build", "test", "deploy", "integrate", "all"]'), inputs.stage)
    runs-on: [self-hosted, laplace]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, clean: false }
      - uses: ./.github/actions/setup-laplace-env

      - name: Clean build tree (dispatch full_clean only)
        if: github.event_name == 'workflow_dispatch' && inputs.full_clean
        run: |
          # checkout is clean:false, so the persistent runner accumulates untracked cruft.
          # Purge stale codegen output from prior builds (old generated/NN_*.sql.in linger and
          # trip the manifest-completeness gate on a fresh configure); pipeline.sh clean then
          # wipes build/ so the native engine (content_witness_batch.c etc.) truly recompiles.
          find extension/laplace_substrate/sql/generated -name '[0-9]*_*.sql.in' -delete 2>/dev/null || true
          bash scripts/pipeline.sh clean

      - name: Build
        run: |
          args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_clean }}" = "true" ]; then
            args+=(--force-rebuild)
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_codegen }}" = "true" ]; then
            args+=(--force-codegen)
          fi
          bash scripts/pipeline.sh "${args[@]}" build

  unit-test:
    name: Unit tests — native engine (ctest, excludes pg_regress)
    needs: build
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(fromJSON('["test", "deploy", "integrate", "all"]'), inputs.stage)
    runs-on: [self-hosted, laplace]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, clean: false }
      - uses: ./.github/actions/setup-laplace-env
      - name: ctest
        env:
          LAPLACE_TEST_SERIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.serial_tests == true && '1' || '' }}
        run: |
          # Tripwire (#880): the build job ended with build/ populated and stamped;
          # if it is gone HERE, something removed it between jobs — name that
          # directly instead of failing as a bare `cd` three theories deep.
          if [ ! -d build ]; then
            echo "::error::build/ absent at ctest start — it existed (stamped) when the build job completed. Something removed it between jobs; see #880 for the measured timeline. Re-run the workflow."
            exit 1
          fi
          chmod +x scripts/test-parallel.sh
          if [ "${LAPLACE_TEST_SERIAL:-}" = "1" ]; then
            bash scripts/test-parallel.sh --serial --engine
          else
            bash scripts/test-parallel.sh --engine
          fi

  deploy:
    name: Deploy — stage install to /opt/laplace
    needs: unit-test
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(fromJSON('["deploy", "integrate", "all"]'), inputs.stage)
    runs-on: [self-hosted, laplace]
    concurrency:
      # ONE LIFECYCLE OPERATION AT A TIME, and never cancelled. Deploy, db-ops and
      # publish stop the API, replace binaries and bounce PostgreSQL; two of those
      # overlapping is a half-installed tree.
      #
      # This group does NOT include seeds. Ingest-vs-ingest is a capacity question --
      # many corpora can land at once and the apply path is built for it -- so
      # serialising them here would freeze one dev box's limits into the pipeline.
      # Exclusion against live ingest is enforced where it belongs, by the
      # ingest_run_journal preflight on the deploy job, which is a real lock that
      # works across every workflow and at any number of runners.
      group: laplace-substrate-lifecycle
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      # WAIT FOR LIVE INGESTS BEFORE TOUCHING THE BOX.
      #
      # Deploy stops the API, replaces binaries and bounces PostgreSQL. Doing that under
      # a running ingest kills it -- CLAUDE.md documents the symptom ("a push to main
      # restarts laplace-postgresql and kills any running ingest") and mitigates it with
      # operator discipline, which is not a mitigation.
      #
      # THE LOCK LIVES IN THE SUBSTRATE, NOT IN GITHUB. Concurrency groups cannot express
      # reader-writer: many seeds may run at once (they are content-addressed writers and
      # the apply path is built for it), but a PG bounce excludes all of them. Putting
      # every seed in one group would serialise ingest against ingest, which is this
      # box's capacity limit masquerading as architecture. ingest_run_journal already
      # records exactly what is needed, across every workflow and every dispatcher.
      #
      # Bounded: a stuck 'running' row must not wedge deploys forever. On timeout this
      # reports what it is waiting on and FAILS rather than deploying anyway -- killing an
      # ingest silently is the thing being fixed.
      - name: Wait for in-flight ingests (substrate lock)
        timeout-minutes: 305
        run: bash scripts/wait-for-quiet-substrate.sh "${PGDATABASE:-laplace}"
      - uses: actions/checkout@v4
        with: { submodules: false, clean: false }
      - uses: ./.github/actions/setup-laplace-env

      - name: Install
        # pipeline.sh install owns the API stop/start around the install window
        # — a fingerprint-skipped install never bounces the service at all.
        run: bash scripts/pipeline.sh install

  db-ops:
    name: DB — migrate, extension sync, perfcache GUC
    needs: deploy
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(fromJSON('["deploy", "integrate", "all"]'), inputs.stage)
    runs-on: [self-hosted, laplace]
    concurrency:
      # ONE LIFECYCLE OPERATION AT A TIME, and never cancelled. Deploy, db-ops and
      # publish stop the API, replace binaries and bounce PostgreSQL; two of those
      # overlapping is a half-installed tree.
      #
      # This group does NOT include seeds. Ingest-vs-ingest is a capacity question --
      # many corpora can land at once and the apply path is built for it -- so
      # serialising them here would freeze one dev box's limits into the pipeline.
      # Exclusion against live ingest is enforced where it belongs, by the
      # ingest_run_journal preflight on the deploy job, which is a real lock that
      # works across every workflow and at any number of runners.
      group: laplace-substrate-lifecycle
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, clean: false }
      - uses: ./.github/actions/setup-laplace-env

      - name: Migrate + sync extension + tune + perfcache GUC + API env
        run: |
          args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.fresh_db }}" = "true" ]; then
            args+=(--fresh-db)
          fi
          bash scripts/pipeline.sh "${args[@]}" migrate sync-extension tune-pg tune-laplace perfcache-guc api-env

  integration-test:
    name: Integration tests — pg_regress || dotnet (parallel)
    # Seed is dispatch-only; on push it skips instantly and tests run against
    # the standing (already seeded) substrate with the freshly installed
    # extension — the layer the tests are supposed to validate.
    needs: db-ops
    if: >-
      !cancelled() && needs.db-ops.result == 'success' &&
      (github.event_name != 'workflow_dispatch' ||
       contains(fromJSON('["integrate", "all"]'), inputs.stage))
    runs-on: [self-hosted, laplace]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, clean: false }
      - uses: ./.github/actions/setup-laplace-env

      - name: Clear stale regress output (diffs below must be from THIS run)
        run: rm -rf build/extension/*/tests/regress_output

      - name: pg_regress || dotnet test (parallel, change-aware)
        env:
          LAPLACE_TEST_SERIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.serial_tests == true && '1' || '' }}
        run: |
          chmod +x scripts/test-parallel.sh
          bin=$(find "${LAPLACE_INSTALL_PREFIX:-/opt/laplace}/share/laplace" "$GITHUB_WORKSPACE/build" \
            -name 'laplace_t0_perfcache*.bin' 2>/dev/null | sort -V | tail -1)
          test -n "$bin" || { echo "::error::perfcache blob not found for dotnet tests"; exit 1; }
          # regress ∥ dotnet-affected (engine gtests already ran in unit-test)
          if [ "${LAPLACE_TEST_SERIAL:-}" = "1" ]; then
            bash scripts/test-parallel.sh --serial --integration
          else
            bash scripts/test-parallel.sh --integration
          fi

      - name: Show regress diffs on failure
        if: failure()
        run: |
          for f in build/extension/*/tests/regress_output/regression.diffs; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

  publish:
    name: Publish — API + SPA, restart service
    needs: integration-test
    # A job with no `if` defaults to success(), and success() is evaluated over the
    # WHOLE transitive needs graph — not just the direct parent. `seed` is
    # dispatch-only, so on every push it is skipped, and that skip propagates down
    # through integration-test (which survives it only because it declares its own
    # `if`) into publish and smoke, which did not. Push-to-main therefore installed
    # the extension and ran the tests but never shipped the API or SPA, while
    # restore-api (`if: always()`) faithfully restarted the OLD binaries — so the
    # box looked healthy and served stale code. State what this job actually
    # requires instead of inheriting a condition about a job it does not use.
    if: >-
      !cancelled() && needs.integration-test.result == 'success' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.stage == 'all')
    runs-on: [self-hosted, laplace]
    concurrency:
      # ONE LIFECYCLE OPERATION AT A TIME, and never cancelled. Deploy, db-ops and
      # publish stop the API, replace binaries and bounce PostgreSQL; two of those
      # overlapping is a half-installed tree.
      #
      # This group does NOT include seeds. Ingest-vs-ingest is a capacity question --
      # many corpora can land at once and the apply path is built for it -- so
      # serialising them here would freeze one dev box's limits into the pipeline.
      # Exclusion against live ingest is enforced where it belongs, by the
      # ingest_run_journal preflight on the deploy job, which is a real lock that
      # works across every workflow and at any number of runners.
      group: laplace-substrate-lifecycle
      cancel-in-progress: false
    timeout-minutes: 20
    outputs:
      # Whether the deployed API came up READY (substrate has data), as opposed to
      # deployed-but-unseeded. Smoke exercises live reads and can only mean anything
      # against a seeded substrate.
      seeded: ${{ steps.readiness.outputs.seeded }}
    # Runtime credentials: repository Secrets (encrypted), not machine secrets.env.
    # Non-secret knobs stay in vars / workflow env above.
    env:
      LICHESS_API: ${{ secrets.LICHESS_API }}
      STRIPE_API_SECRET: ${{ secrets.STRIPE_API_SECRET }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_API_Publishable: ${{ vars.STRIPE_API_PUBLISHABLE }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, clean: false }
      - uses: ./.github/actions/setup-laplace-env

      - name: Publish (API + SPA + uci + chess-lab + secrets)
        run: bash scripts/pipeline.sh publish

      - name: Restart API + readiness gate
        id: readiness
        # Gate on /health/ready, not /health: /health is liveness only (a
        # hard-coded "ok" that proves the process started). Readiness proves
        # the service can reach the substrate AND the T0 perfcache is loaded
        # in PG — exactly the states whose absence previously sailed through
        # this gate and surfaced four jobs later as a smoke 503.
        #
        # Change-aware: when pipeline.sh publish skipped the deploy (publish
        # domain unchanged) and the service is already active, don't bounce a
        # live service that runs the same bits — still prove readiness. The
        # publish stamp is recorded ONLY here, after readiness passes, so
        # "published" means deployed AND restarted AND ready.
        run: |
          action=$(cat build/.publish-action 2>/dev/null || echo deployed)
          if [[ "$action" == "skipped" ]] && systemctl is-active --quiet laplace-api; then
            echo "publish skipped (domain unchanged) — service active; verifying readiness without restart"
          else
            sudo systemctl restart laplace-api
          fi
          for i in $(seq 1 30); do
            sleep 2
            if curl -fsS http://127.0.0.1:5187/health/ready >/dev/null 2>&1; then
              echo "laplace-api ready"
              # #792: ready ≠ foundation floor. Entities>0 can be thin residue
              # after a failed seed; fail loud before stamp / smoke.
              bash scripts/check-substrate-floor.sh "${PGDATABASE:-laplace}"
              echo "seeded=true" >> "$GITHUB_OUTPUT"
              bash scripts/pipeline.sh publish-stamp
              exit 0
            fi
          done

          # Not ready. Named fail (#792) — never soft-exit and skip smoke.
          # Seeds stay dispatch-only (no auto-reseed from this gate). Heal:
          #   gh workflow run seed-foundation.yml --ref main
          detail=$(curl -sS http://127.0.0.1:5187/health/ready || true)
          echo "$detail"
          if python3 -c 'import json,sys; d=json.loads(sys.argv[1]); sys.exit(0 if (d.get("substrate_reachable") and d.get("perfcache_ready") and not d.get("consensus_relations")) else 1)' "$detail"
          then
            # An EMPTY substrate is not a broken deploy. The service is up, the perfcache
            # loaded, the extension installed — publish did its job. What is missing is
            # DATA, which publish does not own and cannot heal (seeds stay dispatch-only).
            #
            # This used to write seeded=false and then exit 1, which contradicted itself:
            # smoke and eval already gate on `needs.publish.outputs.seeded == 'true'`, so
            # the output published here is exactly what makes them skip cleanly — and
            # failing the job meant that guard could never be reached. /health/ready
            # reports ready:false while unseeded, so the poll above can never succeed on a
            # fresh database, which made main structurally red for the entire window
            # between a recreate and a seed. That window is now normal: HASH(id)
            # repartitioning made drop-then-recreate the upgrade path.
            #
            # #792 is preserved. That defect was a STALE deploy silently skipping smoke;
            # every not-ready-for-any-other-reason path below still fails loudly. The one
            # case softened here is the one the substrate itself reports as merely empty.
            echo "::warning::UNSEEDED_SUBSTRATE: API reachable + perfcache loaded, but substrate has no consensus/entities. Downstream smoke/eval will skip. Heal via: gh workflow run \"Seed — foundation\" -f source=ladder"
            echo "seeded=false" >> "$GITHUB_OUTPUT"
            # Deliberately NOT stamped: the stamp lets a later run skip publish on an
            # unchanged domain, and this box has not served a ready check. Re-publishing
            # is idempotent; skipping one that was never verified is not.
            exit 0
          fi

          echo "::error::laplace-api not ready 60s after restart — readiness detail above"
          # journalctl needs no root when the runner is in systemd-journal;
          # sudo -n (never prompts) systemctl status is the granted fallback.
          journalctl -u laplace-api -n 40 --no-pager 2>/dev/null \
            || sudo -n systemctl status laplace-api || true
          exit 1

  smoke:
    name: Smoke — live endpoint + substrate counts
    needs: publish
    # Same transitive-skip trap as publish: smoke is the gate that would have
    # CAUGHT a stale deploy, and it was skipped by the very condition that caused
    # one. It must state its own requirement.
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      needs.publish.outputs.seeded == 'true'
    runs-on: [self-hosted, laplace]
    concurrency:
      # ONE LIFECYCLE OPERATION AT A TIME, and never cancelled. Deploy, db-ops and
      # publish stop the API, replace binaries and bounce PostgreSQL; two of those
      # overlapping is a half-installed tree.
      #
      # This group does NOT include seeds. Ingest-vs-ingest is a capacity question --
      # many corpora can land at once and the apply path is built for it -- so
      # serialising them here would freeze one dev box's limits into the pipeline.
      # Exclusion against live ingest is enforced where it belongs, by the
      # ingest_run_journal preflight on the deploy job, which is a real lock that
      # works across every workflow and at any number of runners.
      group: laplace-substrate-lifecycle
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, clean: false }
      - uses: ./.github/actions/setup-laplace-env

      - name: Substrate floor (fail loud — #792)
        run: bash scripts/check-substrate-floor.sh "${PGDATABASE:-laplace}"

      - name: Live endpoint smoke
        run: |
          curl -fsS http://127.0.0.1:5187/v1/capabilities | grep -q '"chat_completions"'
          curl -fsS http://127.0.0.1:5187/health/ready
          echo
          psql -d laplace -U laplace_admin -v ON_ERROR_STOP=1 \
            -c "SELECT metric, value FROM laplace.substrate_counts();"
          curl -fsS -X POST http://127.0.0.1:5187/v1/chat/completions \
            -H 'Content-Type: application/json' -H 'X-Laplace-Tenant: ci' \
            --data '{"model":"laplace-converse-001","messages":[{"role":"user","content":"dog"}]}'
          echo

      - name: Endpoint contract tests against the live service
        run: |
          cd app
          dotnet test Laplace.slnx -c Release --no-build --nologo --verbosity minimal \
            --filter 'Tier!=perf & Tier!=db & FullyQualifiedName~Endpoints.OpenAICompat'

  eval:
    name: Eval — generation / election quality (advisory)
    needs: [publish, smoke]
    # Same seeded guard as smoke. continue-on-error: advisory week (W5 D7);
    # blocking_flip_date in scripts/eval-baselines.json records when this flips.
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      needs.publish.outputs.seeded == 'true' &&
      needs.smoke.result == 'success'
    runs-on: [self-hosted, laplace]
    continue-on-error: true
    concurrency:
      group: laplace-substrate-lifecycle
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, clean: false }
      - uses: ./.github/actions/setup-laplace-env
      - name: Election + generation quality harness
        run: |
          mkdir -p .eval-proof
          python3 scripts/eval-generation.py \
            --db "host=/var/run/postgresql user=laplace_admin dbname=laplace" \
            --probes scripts/eval-probes.json \
            --baseline scripts/eval-baselines.json \
            --report .eval-proof/generation.json

  restore-api:
    name: Restore API (always — even after failed stages)
    if: always() && needs.deploy.result != 'skipped'
    needs: [deploy, publish, smoke, eval]
    runs-on: [self-hosted, laplace]
    concurrency:
      # ONE LIFECYCLE OPERATION AT A TIME, and never cancelled. Deploy, db-ops and
      # publish stop the API, replace binaries and bounce PostgreSQL; two of those
      # overlapping is a half-installed tree.
      #
      # This group does NOT include seeds. Ingest-vs-ingest is a capacity question --
      # many corpora can land at once and the apply path is built for it -- so
      # serialising them here would freeze one dev box's limits into the pipeline.
      # Exclusion against live ingest is enforced where it belongs, by the
      # ingest_run_journal preflight on the deploy job, which is a real lock that
      # works across every workflow and at any number of runners.
      group: laplace-substrate-lifecycle
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: Ensure API is running
        run: |
          sudo systemctl start laplace-api || true
          sleep 3
          curl -fsS http://127.0.0.1:5187/health | grep -q '"status":"ok"' || {
            echo "::warning::laplace-api unhealthy after restore"
            journalctl -u laplace-api -n 40 --no-pager 2>/dev/null \
              || sudo -n systemctl status laplace-api || true
            exit 1
          }
