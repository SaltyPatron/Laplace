name: Qualify required lexical lifecycle
on:
  push:
    branches: [qualify/lexical-foundation-20260916]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cd4e3dcf19e3b304ae30ce1b8c77c2fb7e3835d4
          persist-credentials: false
      - name: Execute exact production orchestration controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cd4e3dcf19e3b304ae30ce1b8c77c2fb7e3835d4
          test "$(git write-tree)" = 31455d376555eb1f5447dcc24e5581122a770fd4
          export TMPDIR="$RUNNER_TEMP/lexical-control-scratch"
          export TMP="$TMPDIR" TEMP="$TMPDIR"
          mkdir -p "$TMPDIR"
          python3 -m venv "$RUNNER_TEMP/lexical-control-python"
          "$RUNNER_TEMP/lexical-control-python/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.2
          export PATH="$RUNNER_TEMP/lexical-control-python/bin:$PATH"
          bash -n scripts/ensure-foundation.sh scripts/product-ci.sh
          python scripts/actions-audit.py
          python scripts/test-actions-topology.py
