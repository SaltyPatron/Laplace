ord</text><polygon points="574.516,93.609,620.385,93.609,632.385,105.609,620.385,117.609,574.516,117.609,562.516,105.609,574.516,93.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="601.451" y="129.028" fill="#000" font-size="11" textLength="17.118">yes</text><text x="574.516" y="110.11" fill="#000" font-size="11" textLength="45.869">Validate?</text><rect x="451.712" y="150.528" width="291.477" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="461.712" y="172.985" fill="#000" font-size="12" textLength="271.477">Require prefix; hash full presented key; query store</text><polygon points="548.235,209.54,646.666,209.54,658.666,221.54,646.666,233.54,548.235,233.54,536.235,221.54,548.235,209.54" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="548.235" y="226.041" fill="#000" font-size="11" textLength="98.431">Missing or revoked?</text><text x="519.118" y="219.123" fill="#000" font-size="11" textLength="17.118">yes</text><text x="658.666" y="219.123" fill="#000" font-size="11" textLength="28.735">active</text><rect x="433.551" y="243.54" width="114.055" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="443.551" y="265.997" fill="#000" font-size="12" textLength="94.055">Return no identity</text><rect x="567.605" y="243.54" width="273.436" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="577.605" y="265.997" fill="#000" font-size="12" textLength="253.436">Write LastUsedAt; return previously read record</text><polygon points="597.451,284.634,609.451,296.634,597.451,308.634,585.451,296.634,597.451,284.634" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="965.754,93.609,1053.797,93.609,1065.797,105.609,1053.797,117.609,965.754,117.609