name: Seed — chess books

on:
  workflow_dispatch:
    inputs:
      path:
        description: "override the default Project Gutenberg text corpus"
        type: string
        default: ""
      database:
        description: "target database"
        type: choice
        options: [laplace]
        default: laplace
      run_idempotency:
        description: "re-ingest and prove no double-count"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  seed:
    uses: ./.github/workflows/seed-chess.yml
    with:
      source: chess-books
      corpus: books
      path: ${{ inputs.path }}
      database: ${{ inputs.database }}
      derive_after_games: false
      run_idempotency: ${{ inputs.run_idempotency }}
