name: Policy — dev tests

# The dev test profile (scripts/test-parallel.sh dev): native ctest without the regress label, every managed test
# project's canonical dev-category tests on the candidate native build and its perf caches, the UCI handshake, and the
# browser suites. It runs on hart-server's runner because the build pins MKL's CNR branch to its ISA
# (engine/CMakeLists.txt: LAPLACE_TARGET_ISA AVX2 -> LAPLACE_MKL_CBWR_AVX2; engine/dynamics/src/init.cpp:
# mkl_cbwr_set(MKL_CBWR_AVX2)), a branch MKL offers only on Intel CPUs, and the GitHub-hosted ubuntu-24.04 runners are
# AMD EPYC. hart-server is an Intel Core i7-6850K (Broadwell-E, AVX2), the machine the build is pinned for.
# Pull requests from forks never run on it.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # The closed event enters the same concurrency group and cancels any
    # obsolete queued/running profile after the PR is merged or closed.
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - 'deploy/windows/**'
      - 'scripts/win/**'
      - 'scripts/tests/windows-runtime-copy.ps1'
      - '.github/workflows/windows-operations.yml'
      - 'scripts/web-artifact.py'
      - 'scripts/test-web-artifact.py'
      - 'scripts/windows-components.py'
      - 'scripts/test-windows-components.py'
      - 'scripts/tests/windows-artifact-links.ps1'

permissions:
  contents: read

# This runner's configured build estate survives Actions' per-job temp cleanup.
# One build tree is shared by successive revisions; Ninja/MSBuild track changes.
env:
  LAPLACE_CI_WORK: /repos/build/agents/Laplace/dev-tests

concurrency:
  group: laplace-dev-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-ingest-cancellation:
    name: Native ingest process cancellation and terminal receipts
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, laplace, staging]
    timeout-minutes: 15
    env:
      LAPLACE_REUSE_INSTALLED_NATIVE: '1'
      LAPLACE_EXTERNAL: ${{ github.workspace }}/.ci-dependencies
      LAPLACE_INSTALL_PREFIX: /opt/laplace/app/cli/native/recipe-engine
      LAPLACE_RECIPES: /opt/laplace/app/cli/native/recipe-engine/share/laplace/recipes
      LAPLACE_TIER0: /opt/laplace/app/cli/share/laplace/tier0.bin
      LAPLACE_FLAGS: /opt/laplace/app/cli/share/laplace/tier0.flags
      LAPLACE_HIGHWAY: /opt/laplace/app/cli/share/laplace/highway.bin
      LAPLACE_DB: Host=/tmp;Username=laplace;Database=postgres;Command Timeout=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tree-sitter/tree-sitter-c
          ref: b780e47fc780ddc8da13afa35a3f4ed5c157823d
          path: .ci-dependencies/tree-sitter-grammars/tree-sitter-c
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: '10.0.402'
      - name: Signal the candidate CLI against the qualified Native install and private databases
        run: |
          set -euo pipefail
          export LAPLACE_BUILD_ROOT="$LAPLACE_CI_WORK/ingest-cancellation"
          # Match tests/ingest-completion.sh: this cluster keeps the monorepo's
          # extension controls and modules in its installation prefix.
          export PGOPTIONS='-c dynamic_library_path=/opt/laplace/lib/postgresql/18:$libdir -c extension_control_path=/opt/laplace/share/postgresql/18:$system -c session_preload_libraries=laplace_substrate'
          # Private fixture databases must use the selected installed caches,
          # rather than the extension compiler's disposable build defaults.
          export PGOPTIONS="$PGOPTIONS -c laplace.tier0=$LAPLACE_TIER0 -c laplace.flags=$LAPLACE_FLAGS -c laplace.highway=$LAPLACE_HIGHWAY"
          export LAPLACE_DB="$LAPLACE_DB;Options=$PGOPTIONS"
          source deploy/linux/host-lock.sh
          host_lock_hold shared 8 "${LAPLACE_HOST_LOCK:-/run/lock/laplace/host-resource.lock}" 600
          # The managed candidate changes signal ownership. Its Native dependency
          # and PostgreSQL extensions are the existing qualified host installation.
          # Native libraries retain their normal /opt/laplace/lib lookup.
          dotnet test app/Laplace.Cli.Tests/Laplace.Cli.Tests.csproj -c Release --nologo \
            -p:LAPLACE_INSTALL_PREFIX=/opt/laplace \
            --filter FullyQualifiedName~NativeIngestCancellationTests \
            --logger 'console;verbosity=detailed' \
            --logger 'trx;LogFileName=native-ingest-cancellation.trx' \
            --results-directory "$RUNNER_TEMP/native-ingest-cancellation-results" 8>&-
          # These regressions own database fixtures; they cannot run in the
          # hermetic managed dev lane without a PostgreSQL declaration.
          existing=$(psql -X -Atq -h /tmp -U laplace -d postgres \
            -c "SELECT count(*) FROM pg_database WHERE datname='laplace_substratecrud_test'")
          [[ "$existing" == 0 ]] || { echo 'Explore fixture database is already in use; refusing to replace it.' >&2; exit 1; }
          dotnet test app/Laplace.Substrate.Tests/Laplace.Substrate.Tests.csproj -c Release --nologo \
            -p:LAPLACE_INSTALL_PREFIX=/opt/laplace \
            --filter 'FullyQualifiedName~ExploreAnchorNeighborsDbTests|FullyQualifiedName~IngestSignalHandlingTests' \
            --logger 'console;verbosity=detailed' \
            --logger 'trx;LogFileName=ingest-scope-and-explore.trx' \
            --results-directory "$RUNNER_TEMP/native-ingest-cancellation-results" 8>&-
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-ingest-cancellation-results
          path: ${{ runner.temp }}/native-ingest-cancellation-results
          if-no-files-found: error
          retention-days: 7

  dev-tests:
    needs: native-ingest-cancellation
    name: Dev test profile (native, managed, UCI, browser) on the pinned Intel host
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, laplace, staging]
    timeout-minutes: 120
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      LAPLACE_CI_NATIVE_SOURCE: ${{ github.workspace }}/.ci-dependencies/Laplace-Native
      LAPLACE_CI_ENGINE_SOURCE: ${{ github.workspace }}/.ci-dependencies/Laplace-Engine
      LAPLACE_CI_OPERATIONS_SOURCE: ${{ github.workspace }}/.ci-dependencies/Laplace-Operations
      LAPLACE_CI_ICU_DIR: /repos/deps/icu78
      LAPLACE_CI_ISO639_ARCHIVE: /vault/Data/ISO639/iso-639-3_Code_Tables_20260415.zip
      LAPLACE_CI_UCD_FLAT_ARCHIVE: /vault/Data/UCD/Public/UCD/latest/ucdxml/ucd.all.flat.zip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check out the canonical Native implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Native
          ref: 044bd4a361ce32d8a840a480a83bbfd3321ec34e
          path: .ci-dependencies/Laplace-Native
          persist-credentials: false
      - name: Check out the canonical recipe Engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Engine
          ref: b4169cf99024cc5ca27306116c721a7e753c6be4
          path: .ci-dependencies/Laplace-Engine
          persist-credentials: false
      - name: Materialize the verified Operations build contract
        run: |
          set -euo pipefail
          source=/repos/src/Laplace-Operations
          # File identities are pinned to Operations 04faaf9741c3c612b58b5c5b3c8246a11b0bdaf4.
          # Read pinned Git blobs so local edits cannot alter the build inputs.
          bash scripts/ci/materialize-operations-contract.sh "$source" "$LAPLACE_CI_OPERATIONS_SOURCE"
          echo "Operations build contract: 04faaf9741c3c612b58b5c5b3c8246a11b0bdaf4"
      - name: Provide the pinned Rust compiler for the Tree-sitter generator
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.90.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        env:
          # The runner account cannot write the default /usr/share/dotnet; the SDK goes in the runner's tool cache.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: '10.0.402'
      - name: The runner's CPU takes the pinned MKL CNR branch (Intel with AVX2)
        run: |
          lscpu | grep -E '^(Vendor ID|Model name):'
          grep -q '^vendor_id[[:space:]]*: GenuineIntel' /proc/cpuinfo && grep -qw avx2 /proc/cpuinfo
      - name: oneAPI compiler 2026.1, MKL 2026.1 and TBB 2023.1, as hart-server builds with
        run: bash scripts/ci/install-oneapi.sh
      - name: Dependency sources, grammars and public corpora at the build host's revisions
        run: bash scripts/ci/hosted-dev-tests.sh deps
      - name: Native build and ctest (dev profile)
        run: bash scripts/ci/hosted-dev-tests.sh native
      - name: Managed dev tier on the candidate native build
        run: bash scripts/ci/hosted-dev-tests.sh managed
      - name: UCI handshake
        run: bash scripts/ci/hosted-dev-tests.sh uci
      - name: Browser suites
        run: bash scripts/ci/hosted-dev-tests.sh browser
      - name: Keep managed test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dev-tests-managed-results
          path: ${{ env.LAPLACE_CI_WORK }}/managed-results
          if-no-files-found: ignore
          retention-days: 7
