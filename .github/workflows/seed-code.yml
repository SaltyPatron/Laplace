name: Seed — code

on:
  workflow_dispatch:
    inputs:
      source:
        description: "code source"
        type: choice
        required: true
        options: [code, repo, stack, tiny-codes, tabular, recipe]
      corpus:
        description: "corpus for path-based sources"
        type: choice
        required: false
        default: "-"
        options: ["-", cpython, postgres, runtime, docs, treesitter, self, path-only]
      path:
        description: "explicit path; overrides corpus"
        type: string
        default: ""
      database:
        description: "target database"
        type: choice
        options: [laplace]
        default: laplace

permissions:
  contents: read

jobs:
  resolve:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 2
    outputs:
      path: ${{ steps.pick.outputs.path }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          root="${LAPLACE_DATA_ROOT:-/vault/Data}"
          p='${{ inputs.path }}'
          if [[ -n "$p" ]]; then
            [[ -e "$p" ]] || { echo "::error::$p does not exist"; exit 1; }
            echo "path=$p" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case '${{ inputs.source }}' in
            stack|tiny-codes) echo "path=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          case '${{ inputs.corpus }}' in
            cpython) p="$root/code-authority/cpython" ;;
            postgres) p="$root/code-authority/postgres" ;;
            runtime) p="$root/code-authority/runtime" ;;
            docs) p="$root/code-authority/docs" ;;
            treesitter) p="$root/TreeSitter" ;;
            self) p="$GITHUB_WORKSPACE" ;;
            *) echo "::error::choose a corpus or provide path"; exit 1 ;;
          esac
          [[ -e "$p" ]] || { echo "::error::$p does not exist"; exit 1; }
          echo "path=$p" >> "$GITHUB_OUTPUT"

  seed:
    needs: resolve
    uses: ./.github/workflows/_ingest.yml
    with:
      source: ${{ inputs.source }}
      path: ${{ needs.resolve.outputs.path }}
      database: ${{ inputs.database }}
      timeout_minutes: 720
