name: Coordinate superseded Original lifecycle runs
on:
  push:
    branches: [qualify/cmake-publication-modes-20260916]
permissions:
  contents: read
  actions: write
jobs:
  cancel-exact-queued-lifecycles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact obsolete source and normally cancel only queued lifecycle runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          REPO = "SaltyPatron/Laplace"
          BASE = "4fa186e38de10ee5cc768d38f33ec9663cf2e314"
          TARGETS = [
              (35126971407, "79de57897d10d7f5c6da5c829bc624b2cf326091"),
              (35127572564, "e2b6e24860797a200d36faa140e851a750fe2bfd"),
          ]
          LIMIT = 8 * 1024 * 1024
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError("unexpected API redirect")
          opener = urllib.request.build_opener(NoRedirect)
          def api(path, method="GET"):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + "/" + path,
                  data=b"" if method == "POST" else None, method=method,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "User-Agent": "bounded-original-lifecycle-owner"})
              try:
                  with opener.open(request, timeout=20) as response:
                      raw = response.read(LIMIT + 1)
                      if len(raw) > LIMIT:
                          raise RuntimeError("bounded API response exceeded")
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  return error.code, None
          def read(path):
              status, value = api(path)
              if status != 200:
                  raise RuntimeError("API GET refused with status " + str(status))
              return value
          def identity(run, ident, sha):
              return (run["id"] == ident and run["head_sha"] == sha
                      and run["run_attempt"] == 1 and run["event"] == "push"
                      and run["path"] == ".github/workflows/laplace.yml"
                      and run["head_branch"] == "main")
          report = []
          for ident, sha in TARGETS:
              item = {"run": ident, "head": sha, "action": "none"}
              report.append(item)
              current = read("actions/runs/" + str(ident))
              if not identity(current, ident, sha):
                  item["result"] = "identity_changed_no_action"
                  continue
              if current["status"] == "completed":
                  item["result"] = "already_terminal"
                  item["conclusion"] = current["conclusion"]
                  continue
              comparison = read("compare/" + BASE + "..." + sha)
              files = comparison.get("files", [])
              if (comparison.get("base_commit", {}).get("sha") != BASE
                      or not files or len(files) != 1
                      or files[0]["filename"] != ".github/workflows/repo-hygiene.yml"
                      or files[0]["status"] != "modified"):
                  item["result"] = "product_source_changed_no_action"
                  continue
              jobs = read("actions/runs/" + str(ident) + "/jobs?per_page=100")
              if jobs["total_count"] != len(jobs["jobs"]) or any(
                      job["status"] != "queued" or job.get("steps") for job in jobs["jobs"]):
                  item["result"] = "job_started_no_action"
                  continue
              current = read("actions/runs/" + str(ident))
              if not identity(current, ident, sha) or current["status"] not in ("queued", "pending"):
                  item["result"] = "run_advanced_no_action"
                  continue
              item["verified_source_delta"] = [files[0]["filename"]]
              item["queued_job_ids"] = [job["id"] for job in jobs["jobs"]]
              status, ignored = api("actions/runs/" + str(ident) + "/cancel", "POST")
              item["cancel_http_status"] = status
              item["action"] = "normal_cancel_requested" if status == 202 else "cancel_not_accepted"
              # Exactly one POST; ambiguous results never cause an automatic retry.
              for attempt in range(15):
                  latest = read("actions/runs/" + str(ident))
                  if not identity(latest, ident, sha):
                      raise RuntimeError("target identity changed during readback")
                  item["status"] = latest["status"]
                  item["conclusion"] = latest["conclusion"]
                  if latest["status"] == "completed":
                      break
                  time.sleep(2)
              item["result"] = "cancelled" if item.get("conclusion") == "cancelled" else "readback_pending_or_changed"
          print("LIFECYCLE_COORDINATION " + json.dumps(report, sort_keys=True), flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("Exact obsolete lifecycle coordination; external hygiene/source transfer and PR1607 untouched.\n\n")
              output.write("```json\n" + json.dumps(report, indent=2) + "\n```\n")
          PY
