name: Qualify current lifecycle runtime and native operator
on:
  push:
    branches: [qualify/native-admission-footprint-20260916]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EVIDENCE: /build/laplace/work/final-operator-syntax/evidence
      TMPDIR: /build/laplace/work/final-operator-syntax/tmp
      TMP: /build/laplace/work/final-operator-syntax/tmp
      TEMP: /build/laplace/work/final-operator-syntax/tmp
    steps:
      - name: Prepare permanent syntax workspace
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$EVIDENCE" "$TMPDIR"
      - name: Authenticate and parse the coordinated native operator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE/operator-syntax.log"
          import ast, base64, hashlib, json, os, re, subprocess, textwrap, urllib.request, yaml
          from pathlib import Path
          sha = "0b6b59b30b6938a76d8277a5f48d1cafbbccb279"
          request = urllib.request.Request(
              "https://api.github.com/repos/SaltyPatron/Laplace/git/blobs/" + sha,
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                       "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              encoded = response.read(2 * 1024 * 1024 + 1)
          if len(encoded) > 2 * 1024 * 1024:
              raise ValueError("operator metadata exceeded bound")
          item = json.loads(encoded)
          assert item["sha"] == sha and item["encoding"] == "base64"
          raw = base64.b64decode(item["content"])
          assert len(raw) == item["size"] and len(raw) < 1024 * 1024
          assert hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest() == sha
          (Path(os.environ["EVIDENCE"]) / "native-operator.yml").write_bytes(raw)
          document = yaml.safe_load(raw)
          environment = document["jobs"]["native"]["env"]
          assert environment["TARGET_SHA"] == environment["TARGET_TREE"] == ""
          assert environment["REQUIRED_ANCESTOR"] == "c490651eee906f44f944ae2c2b0d0783516f9e0c"
          native_program = document["jobs"]["native"]["steps"][1]["run"]
          pins = re.search(r"done <<'SOURCE_OWNERS'\n(.*?)\nSOURCE_OWNERS", native_program, re.S).group(1).splitlines()
          assert len(pins) == 12, pins
          assert all(re.fullmatch(r"100(?:644|755) [0-9a-f]{40} .+", pin) for pin in pins)
          assert not any("physicality_descriptor.c" in pin or "physicality_descriptor_admission.cpp" in pin for pin in pins)
          assert "--exclusive --no-fork" in native_program
          assert native_program.index("flock --exclusive") < native_program.index("git fetch")
          outer = inner = python = 0
          for job in document["jobs"].values():
              for step in job["steps"]:
                  program = step.get("run")
                  if program is None:
                      continue
                  subprocess.run(["bash", "-n"], input=program, text=True, check=True)
                  outer += 1
                  lines = program.splitlines()
                  for index, line in enumerate(lines):
                      match = re.search(r"<<'([A-Z_]+)'", line)
                      if not match:
                          continue
                      delimiter = match.group(1)
                      end = next(i for i in range(index + 1, len(lines)) if lines[i].strip() == delimiter)
                      body = textwrap.dedent("\n".join(lines[index + 1:end])) + "\n"
                      if delimiter == "PY":
                          ast.parse(body)
                          python += 1
                      elif delimiter in ("NATIVE", "MANAGED_READINESS"):
                          subprocess.run(["bash", "-n"], input=body, text=True, check=True)
                          inner += 1
          assert (outer, inner, python) == (4, 2, 9), (outer, inner, python)
          print(json.dumps({"operatorBlob": sha, "bytes": len(raw),
                            "outerBash": outer, "innerBash": inner, "python": python,
                            "scope": "authenticated source syntax only; no native or host execution"}))
          PY
      - name: Retain authenticated operator syntax
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-native-operator-syntax
          path: /build/laplace/work/final-operator-syntax/evidence/
          if-no-files-found: error
          retention-days: 30

  runtime_export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Prepare selected source and permanent evidence
        shell: bash
        run: |
          set -euo pipefail
          work="/build/laplace/work/export-controls-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence="/build/laplace/recovery/export-controls-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo install -d -m 0775 -o "$(id -u)" -g "$(id -g)" "$work" "$evidence"
          mkdir -p "$work/tmp" "$work/source"
          echo "QUALIFY_WORK=$work" >> "$GITHUB_ENV"
          echo "QUALIFY_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "TMPDIR=$work/tmp" >> "$GITHUB_ENV"
          echo "TMP=$work/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$work/tmp" >> "$GITHUB_ENV"
          cd "$work/source"
          git init -q
          git remote add origin https://github.com/SaltyPatron/Laplace.git
          timeout 120s git fetch --no-tags --depth=1 origin 241b4550ed16d0e729e16823dcafdf28dd4dcd76
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 241b4550ed16d0e729e16823dcafdf28dd4dcd76
          test "$(git rev-parse HEAD^{tree})" = fd31112e0dc4ea285b5fe4c1fe211ae081a9ae4b
          git rev-parse HEAD HEAD^{tree} > "$evidence/source.txt"
      - name: Execute affected export controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$QUALIFY_WORK/source"
          python3 -B - <<'PY'
          import ast, json, os, pathlib, subprocess
          evidence=pathlib.Path(os.environ["QUALIFY_EVIDENCE"])
          for name in ("scripts/export-qualified-chess-floors.py","scripts/test-qualified-chess-floor-export.py"):
              ast.parse(pathlib.Path(name).read_text(), filename=name)
          (evidence/"ast.txt").write_text("PASS: current exporter and changed test Python sources\n")
          command=["python3","-B","scripts/test-qualified-chess-floor-export.py","-v"]
          with (evidence/"export-controls.log").open("w") as stream:
              result=subprocess.run(["timeout","--kill-after=10s","180s",*command],stdout=stream,stderr=subprocess.STDOUT)
          (evidence/"results.json").write_text(json.dumps({"command":command,"exit_code":result.returncode},indent=2)+"\n")
          print((evidence/"export-controls.log").read_text(),flush=True)
          if result.returncode:
              raise SystemExit(result.returncode)
          dirty=subprocess.check_output(["git","status","--porcelain","--untracked-files=all"],text=True)
          (evidence/"source-clean.txt").write_text(dirty or "PASS: clean source checkout\n")
          if dirty:
              raise SystemExit("qualification modified source checkout")
          PY
      - name: Execute application runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "$QUALIFY_WORK/source"
          python3 -B scripts/test-application-runtime.py -v 2>&1 | tee "$QUALIFY_EVIDENCE/runtime-controls.log"
      - name: Retain affected control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-floor-export-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUALIFY_EVIDENCE }}
          if-no-files-found: error
