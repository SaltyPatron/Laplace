<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:595px;height:867px;background:#FAFCFF;" width="595px" height="867px" viewBox="0 0 595 867" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="595" height="867" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="5"><text x="128.025" y="34.533" fill="#000" font-size="14" textLength="337.244" font-weight="700">Modular liblpm — CSV/TSV structural composition</text></g><ellipse cx="294.647" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="160.252" y="93.609" width="268.789" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="170.252" y="116.066" fill="#000" font-size="12" textLength="248.789">Split bytes into physical newline-delimited lines</text><rect x="156.262" y="148.703" width="276.77" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="166.262" y="171.16" fill="#000" font-size="12" textLength="256.77">Remove trailing carriage return; skip empty lines</text><rect x="94.203" y="260.716" width="400.889" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="104.203" y="283.173" fill="#000" font-size="12" textLength="380.889">Scan comma fields with quote state, or tab fields without quote handling</text><rect x="135.227" y="315.81" width="318.84" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="145.227" y="338.267" fill="#000" font-size="12" textLength="298.84">In comma mode skip over doubled quote while scanning</text><rect x="129.889" y="370.903" width="329.516" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="139.889" y="393.36" fill="#000" font-size="12" textLength="309.516">Strip one surrounding quote pair from a field when present</text><rect x="106.229" y="425.997" width="376.836" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="116.229" y="448.454" fill="#000" font-size="12" textLength="356.836">Text-compose retained field bytes; empty field gives zero reference</text><rect x="152.914" y="481.091" width="283.467" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="162.914" y="503.548" fill="#000" font-size="12" textLength="263.467">Compose ordered fields at max child tier plus one</text><polygon points="266.218,203.797,323.076,203.797,335.076,215.797,323.076,227.797,266.218,227.797,254.218,215.797,266.218,203.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="298.647" y="239.216" fill="#000" font-size="11" textLength="17.118">yes</text><text x="266.218" y="220.298" fill="#000" font-size="11" textLength="56.858">More lines?</text><text x="241.982" y="213.38" fill="#000" font-size="11" textLength="12.235">no</text><rect x="156.924" y="558.185" width="275.445" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="166.924" y="580.642" fill="#000" font-size="12" textLength="255.445">Compose ordered rows at max row tier plus one</text><rect x="171.262" y="613.278" width="246.77" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="181.262" y="635.735" fill="#000" font-size="12" textLength="226.77">Return trunk; no rows gives zero reference</text><ellipse cx="294.647" cy="679.372" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="294.647" cy="679.372" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="294.647" y1="73.609" x2="294.647" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="290.647,83.609,294.647,93.609,298.647,83.609,294.647,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="294.647" y1="128.703" x2="294.647" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="290.647,138.703,294.647,148.703,298.647,138.703,294.647,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="294.647" y1="295.81" x2="294.647" y2="315.81" style="stroke:#181818;stroke-width:1;"/><polygon points="290.647,305.81,294.647,315.81,298.647,305.81,294.647,309.81" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="294.647" y1="350.903" x2="294.647" y2="370.903" style="stroke:#181818;stroke-width:1;"/><polygon points="290.647,360.903,294.647,370.903,298.647,360.903,294.647,364.903" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="294.647" y1="405.997" x2="294.647" y2="425.997" style="stroke:#181818;stroke-width:1;"/><polygon points="290.647,415.997,294.647,425.997,298.647,415.997,294.647,419.997" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="294.647" y1="461.091" x2="294.647" y2="481.091" style="stroke:#181818;stroke-width:1;"/><polygon points="290.647,471.091,294.647,481.091,298.647,471.091,294.647,475.091" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="294.647" y1="227.797" x2="294.647" y2="260.716" style="stroke:#181818;stroke-width:1;"/><polygon points="290.647,250.716,294.647,260.716,298.647,250.716,294.647,254.716" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="294.647" y1="516.185" x2="294.647" y2="526.185" style="stroke:#181818;stroke-width:1;"/><line x1="294.647" y1="526.185" x2="507.091" y2="526.185" style="stroke:#181818;stroke-width:1;"/><polygon points="503.091,379.532,507.091,369.532,511.091,379.532,507.091,375.532" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="507.091" y1="215.797" x2="507.091" y2="526.185" style="stroke:#181818;stroke-width:1;"/><line x1="507.091" y1="215.797" x2="335.076" y2="215.797" style="stroke:#181818;stroke-width:1;"/><polygon points="345.076,211.797,335.076,215.797,345.076,219.797,341.076,215.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="254.218" y1="215.797" x2="82.203" y2="215.797" style="stroke:#181818;stroke-width:1;"/><polygon points="78.203,365.532,82.203,375.532,86.203,365.532,82.203,369.532" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="82.203" y1="215.797" x2="82.203" y2="538.185" style="stroke:#181818;stroke-width:1;"/><line x1="82.203" y1="538.185" x2="294.647" y2="538.185" style="stroke:#181818;stroke-width:1;"/><line x1="294.647" y1="538.185" x2="294.647" y2="558.185" style="stroke:#181818;stroke-width:1;"/><polygon points="290.647,548.185,294.647,558.185,298.647,548.185,294.647,552.185" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="294.647" y1="183.797" x2="294.647" y2="203.797" style="stroke:#181818;stroke-width:1;"/><polygon points="290.647,193.797,294.647,203.797,298.647,193.797,294.647,197.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="294.647" y1="593.278" x2="294.647" y2="613.278" style="stroke:#181818;stroke-width:1;"/><polygon points="290.647,603.278,294.647,613.278,298.647,603.278,294.647,607.278" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="294.647" y1="648.372" x2="294.647" y2="668.372" style="stroke:#181818;stroke-width:1;"/><polygon points="290.647,658.372,294.647,668.372,298.647,658.372,294.647,662.372" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="19"><rect x="22" y="711.372" width="549.294" height="80.438" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="27" y="730.905" fill="#000" font-size="14" textLength="539.294">This body splits lines before quote parsing: quoted multiline CSV is not preserved here.</text><text x="27" y="748.515" fill="#000" font-size="14" textLength="442.06">Doubled quotes affect scanning but are not unescaped from field bytes.</text><text x="27" y="766.124" fill="#000" font-size="14" textLength="473.197">Separators, line endings and surrounding quote syntax are not child content.</text><text x="27" y="783.733" fill="#000" font-size="14" textLength="495.701">The resulting structure is not established as an exact original-file byte round trip.</text></g><g class="footer" data-source-line="25"><text x="103.771" y="815.19" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="112.946" y="827.769" fill="#888" font-size="10" textLength="367.402">claimed. admit_delimited reviewed. This local parser is not promoted to the general</text><text x="114.069" y="840.347" fill="#888" font-size="10" textLength="365.156">source-recipe contract. Empty fields, blank lines and syntax removal remain visible</text><text x="246.063" y="852.925" fill="#888" font-size="10" textLength="101.167">behavioral distinctions.</text></g><?plantuml-src RLJRZjj637tNLn3eGxD0rhjniXVR3qNWn6Y1Rb1KYxmMr0nb3NOqL6OeUzsdVaI-C5zIZYuRe-cRnE7by1oIFyF7WxCK3AtXT-my6hfysFvn5L3SWQvyrouCbB--NzxS0g5zjro-NTR6hh2giAAbNTcwhbRBrVNrzUsTUNDpVuDloIxhrUsxojpXRNrtJykxwpStT6-BzEH2Xn5RgD0yxIFtmMxPSuIVTkztsztkp2CrQFdemXvgz8dENYpLs7lPSP1Fs1AK6599qTM5EF443snxZn6ygnG-VFldAspBprUFvMT84diZVKGFXjkEanF7eK