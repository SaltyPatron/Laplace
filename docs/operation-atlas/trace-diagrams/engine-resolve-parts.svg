ntics remain open; no runtime acceptance</text><text x="234.564" y="1114.605" fill="#888" font-size="10" textLength="401.265">claimed. Part zero is prepared last and committed first by load/merge. Recovery commits a</text><text x="248.162" y="1127.184" fill="#888" font-size="10" textLength="374.067">prepared part zero, then follows its transaction status for other parts. The two-minute</text><text x="255.677" y="1139.762" fill="#888" font-size="10" textLength="359.038">eligibility threshold is literal source policy. Runtime crash-recovery behavior is not</text><text x="392.396" y="1152.34" fill="#888" font-size="10" textLength="85.601">tested by this atlas.</text></g><?plantuml-src RLJRSjem47ttL-nC7qfc6X9285mUEeI6QQRaKiWFhEKrraIMF98CeK_zY7vXlwGho-JIvCb6NfqzUyvPFiFLLcQa1KrWYPL2GSTNUYCrdJWhJhAqAs3zVNOs64AQOgy_4eC1zNjZ6lO7uv78Hc8uF3_DJZCQd9-DnXS3CKZx5-DnZqRd_V7eh4yvuI3hNOYBn3rANQ754b8KZnjhQftDZJ8MFYrcY_bYyQh25PYPdTGRo54vUlKbennhvHT6-rii2TQetPgip1CllIAuCLcjq4AS0lx-_WEMXDcIXSeIOr06tl8b55uQ3NpYNU8yFv9aSaby2_pE72xjeU7fficka0pVcMdZ2mPx-_th4KW7dJsvemGcF-lmGRLwSjjSFd7RZ_exu7wYjfQqXmmzfkXeoXXtMkr1S07ROoDBC2gy-m8ZnLBgsfERWh7XFDs3hakMGZJb329pw4GkEKhbc2HJrmUQC5cHhwsE4dCvE6-g14Xdh2QqyzuOIpniA0mZ11vlXcsQBAHrFYe1g6DPg66ju1TPytzdcAmVPGMrzbA1fgVsRk10p0KwfEH6fegQuj3XFY06A1wMPU69fKRFx-oShnqVbQNqdh9thM0olxkvkNw0-zNL_MnrzIrqQTe4tFbxA4oD_HXeTRTSNixcFzv3GIUc8aAqvKl2BKKjQct96RLb2NFkfCqkNerInn6ldQlvUu2WCiJXGzC-iErWt0jU--H7ww8sHydRNmSKRsi6IHg4t1XFDbcRsd9kBMqbxPYHiQ8Wnw4DWUt2BRy7dbGY-oSSfwD4Jh6fI4zvDB31LrvD588gZ_pdaWY5V99ruSL7ZiVpGYZa-8JWFDi8UHCfphGoc9rmh3VKXTLXwM8TUvKyOrG7v2zHiDmePNQyNrpsUk5RbuCDqRCcqrruA2XirN7SgYGcK2hfzup7xXMyVO4qdv151QvH2IgZfDWpjNPeOT4Lny__3YaLk9NSAsv3ugDuQG3b8_GyUZTO0wtu_m00?></g></svg>