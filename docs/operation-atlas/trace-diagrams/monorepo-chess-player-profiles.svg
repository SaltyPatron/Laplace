<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:536px;height:1017px;background:#FAFCFF;" width="536px" height="1017px" viewBox="0 0 536 1017" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="536" height="1017" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="5"><text x="27.232" y="34.533" fill="#000" font-size="14" textLength="480.43" font-weight="700">Monorepo chess — provider facts and cross-provider identity testimony</text></g><ellipse cx="265.447" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="77.023" y="93.609" width="376.848" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="87.023" y="116.066" fill="#000" font-size="12" textLength="356.848">Empty input returns; otherwise acquire process-wide ingestion gate</text><rect x="79.692" y="148.703" width="371.51" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="89.692" y="171.16" fill="#000" font-size="12" textLength="351.51">Bootstrap distinct provider sources; register canonical-name union</text><rect x="149.387" y="260.716" width="232.121" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="159.387" y="283.173" fill="#000" font-size="12" textLength="212.121">Validate FIDE identifier when applicable</text><rect x="46.361" y="315.81" width="438.172" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="56.361" y="338.267" fill="#000" font-size="12" textLength="418.172">Select source/trust; derive player from FIDE display name or online provider ID</text><rect x="41" y="370.903" width="448.895" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="51" y="393.36" fill="#000" font-size="12" textLength="428.895">Compose aliases, provider identifier, biography, title, federation, links and ratings</text><polygon points="225.709,203.797,305.185,203.797,317.185,215.797,305.185,227.797,225.709,227.797,213.709,215.797,225.709,203.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="269.447" y="239.216" fill="#000" font-size="11" textLength="17.118">yes</text><text x="225.709" y="220.298" fill="#000" font-size="11" textLength="79.476">Profile remains?</text><text x="189.239" y="213.38" fill="#000" font-size="11" textLength="24.471">done</text><rect x="90.025" y="496.915" width="350.844" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="100.025" y="519.372" fill="#000" font-size="12" textLength="330.844">For every supplied online profile, compose association context</text><rect x="49.692" y="567.009" width="431.51" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="59.692" y="589.466" fill="#000" font-size="12" textLength="411.51">Attest CORRESPONDS_TO online player to FIDE player under online source</text><polygon points="181.376,447.997,349.518,447.997,361.518,459.997,349.518,471.997,181.376,471.997,169.376,459.997,181.376,447.997" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="269.447" y="483.416" fill="#000" font-size="11" textLength="17.118">yes</text><text x="181.376" y="464.498" fill="#000" font-size="11" textLength="168.142">Exactly one FIDE profile supplied?</text><polygon points="265.447,622.103,277.447,634.103,265.447,646.103,253.447,634.103,265.447,622.103" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="93.011" y="666.103" width="344.873" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="103.011" y="688.56" fill="#000" font-size="12" textLength="324.873">Build changes; probe attestation IDs grouped by relation type</text><rect x="65.691" y="721.196" width="399.512" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="75.691" y="743.653" fill="#000" font-size="12" textLength="379.512">Suppress already-present testimony; mark changes CountsAsUnit false</text><rect x="82.364" y="776.29" width="366.166" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="92.364" y="798.747" fill="#000" font-size="12" textLength="346.166">ApplyMany through shared writer; return profile/player/link counts</text><rect x="196.745" y="831.384" width="137.404" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="206.745" y="853.841" fill="#000" font-size="12" textLength="117.404">Release gate in finally</text><ellipse cx="265.447" cy="897.478" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="265.447" cy="897.478" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="265.447" y1="73.609" x2="265.447" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="261.447,83.609,265.447,93.609,269.447,83.609,265.447,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="265.447" y1="128.703" x2="265.447" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="261.447,138.703,265.447,148.703,269.447,138.703,265.447,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="265.447" y1="295.81" x2="265.447" y2="315.81" style="stroke:#181818;stroke-width:1;"/><polygon points="261.447,305.81,265.447,315.81,269.447,305.81,265.447,309.81" fill="#181818" style="stroke:#181818;stroke-wi