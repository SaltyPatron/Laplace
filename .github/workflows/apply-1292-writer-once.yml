name: apply-1292-writer-once

on:
  push:
    branches:
      - fix/journal-visible-fold-completion-1292

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/journal-visible-fold-completion-1292
          fetch-depth: 1

      - name: Wire journal acknowledgement and crash recovery into writer lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one replacement site, found {n}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # One additional long-lived connection is not allowed to materialize out
          # of thin air. Budget the fold-recovery session guard without shrinking
          # either the COPY or fold fan: it is an owner, not fan capacity.
