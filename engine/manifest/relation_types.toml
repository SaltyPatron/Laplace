

[ranks]
# Recalibrated for SEMANTIC SALIENCE (recall), not structural authority: content relations on top,
# grammatical glue and Unicode/standards METADATA at the floor. This single read-time weight also
# drives model-export plane weighting (consensus_*_plane / foundry_vocab / adjacency).
mandate = 1.0
definitional = 0.97
taxonomic = 0.90
equivalence = 0.82
partitive = 0.73
causal = 0.64
oppositional = 0.45
associative = 0.36
tensor_calculation = 0.27
lexical_glue = 0.18
scalar_valued = 0.12
standards_structural = 0.08
probationary = 0.05

[[relation]]
canonical = "ADJACENT_TO_PIXEL"
bit = 0
rank = "associative"
symmetry = "symmetric"
parent = null
family_root = "ADJACENT_TO_PIXEL"

[[relation]]
canonical = "ALSO_SEE"
bit = 1
rank = "associative"
symmetry = "asymmetric"
parent = "RELATED_TO"
family_root = "RELATED_TO"

# APPEARS_IN: witnessed occurrence of a token inside a model circuit COORDINATE
# (plane/layer/head — content shared across every ingested model, like a board square).
# Subject = token content entity, object = coordinate entity, source = the model,
# score = the token's salience (projection norm) in that circuit's subspace. The
# consensus cell (token, APPEARS_IN, coord) therefore rates cross-model structural
# convergence; per-model provenance stays on the evidence rows via source.
# Also the conversational membership relation (spec 34): (turn content root,
# APPEARS_IN, conversation session) under the tenant's source with the session as
# context — same occurrence semantics, different modality.
[[relation]]
canonical = "APPEARS_IN"
bit = 2
hot = true
rank = "tensor_calculation"
symmetry = "asymmetric"
parent = null
family_root = "APPEARS_IN"

