1.126,929.736,295.126,919.736,291.126,923.736" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="291.126" y1="964.83" x2="291.126" y2="984.83" style="stroke:#181818;stroke-width:1;"/><polygon points="287.126,974.83,291.126,984.83,295.126,974.83,291.126,978.83" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="26"><rect x="22" y="1027.83" width="542.253" height="80.438" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="27" y="1047.363" fill="#000" font-size="14" textLength="496.474">First validation failure returns typed status and relevant instruction/value indices.</text><text x="27" y="1064.973" fill="#000" font-size="14" textLength="440.48">Zero-length spans do not overlap. Input/input overlap is permitted here.</text><text x="27" y="1082.582" fill="#000" font-size="14" textLength="532.253">Normal build validates every instruction; a named test mutation validates only the first.</text><text x="27" y="1100.191" fill="#000" font-size="14" textLength="473.129">Operation-specific validation and resource arithmetic remain separate paths.</text></g><g class="footer" data-source-line="32"><text x="100.25" y="1131.648" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="104.416" y="1144.227" fill="#888" font-size="10" textLength="377.422">claimed. Top-level validator, value spans, instruction registry lookup and global-range</text><text x="110.814" y="1156.805" fill="#888" font-size="10" textLength="364.624">checks reviewed. Pairwise checks mean these public instruction buffers are not an</text><text x="111.64" y="1169.383" fill="#888" font-size="10" textLength="362.974">unrestricted in-place dataflow chain. Successful preflight does not itself execute or</text><text x="246.437" y="1181.961" fill="#888" font-size=