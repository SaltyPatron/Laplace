name: Seed — chess books

on:
  workflow_dispatch:
    inputs:
      path:
        description: "override $LAPLACE_DATA_ROOT/ProjectGutenberg/text"
        type: string
        default: ""
      database:
        description: "target database"
        type: choice
        options: [laplace]
        default: laplace

permissions:
  contents: read

jobs:
  resolve:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 2
    outputs:
      path: ${{ steps.pick.outputs.path }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          p='${{ inputs.path }}'
          [[ -n "$p" ]] || p="${LAPLACE_DATA_ROOT:-/vault/Data}/ProjectGutenberg/text"
          [[ -e "$p" ]] || { echo "::error::$p does not exist"; exit 1; }
          echo "path=$p" >> "$GITHUB_OUTPUT"

  seed:
    needs: resolve
    uses: ./.github/workflows/_ingest.yml
    with:
      source: chess-books
      path: ${{ needs.resolve.outputs.path }}
      database: ${{ inputs.database }}
      timeout_minutes: 720
