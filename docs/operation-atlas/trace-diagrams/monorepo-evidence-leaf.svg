 x="446.889" y="491.313" fill="#000" font-size="12" textLength="288.223">Scan an independent ordered range for each endpoint</text><polygon points="403.722,620.137,415.722,632.137,403.722,644.137,391.722,632.137,403.722,620.137" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="237.962" y="664.137" width="331.52" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="247.962" y="686.594" fill="#000" font-size="12" textLength="311.52">Read under active snapshot; filter exact endpoint/type sets</text><rect x="202.625" y="719.23" width="402.195" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="212.625" y="741.688" fill="#000" font-size="12" textLength="382.195">Validate stored identities and complete rating/RD/volatility/witness count</text><polygon points="306.803,774.324,500.641,774.324,512.641,786.324,500.641,798.324,306.803,798.324,294.803,786.324,306.803,774.324" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="306.803" y="790.825" fill="#000" font-size="11" textLength="193.837">Ordered range and callback cutoff true?</text><text x="277.686" y="783.907" fill="#000" font-size="11" textLength="17.118">yes</text><text x="512.641" y="783.907" fill="#000" font-size="11" textLength="12.235">no</text><rect x="79.889" y="808.324" width="350.861" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="89.889" y="830.781" fill="#000" font-size="12" textLength="330.861">End this endpoint range before invoking consumer for that row</text><rect x="450.75" y="808.324" width="202.748" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="460.75" y="830.781" fill="#000" font-size="12" textLength="182.748">Stream row to consumer; continue</text><polygon points="403.722,849.