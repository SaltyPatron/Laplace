<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:703px;height:1050px;background:#FAFCFF;" width="703px" height="1050px" viewBox="0 0 703 1050" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="703" height="1050" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="6"><text x="180.941" y="34.533" fill="#000" font-size="14" textLength="339.589" font-weight="700">Monorepo — fixed-origin Refactor streaming proxy</text></g><ellipse cx="221.422" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="139.067" y="93.609" width="164.709" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="149.067" y="116.066" fill="#000" font-size="12" textLength="144.709">Reject CONNECT with 405</text><rect x="16" y="148.703" width="410.844" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="171.16" fill="#000" font-size="12" textLength="390.844">Require literal /refactor/ raw target; reject control, backslash and fragment</text><rect x="72.329" y="203.797" width="298.186" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="82.329" y="226.254" fill="#000" font-size="12" textLength="278.186">Strip prefix; concatenate fixed http://127.0.0.1:55434</text><rect x="74.348" y="258.891" width="294.148" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="84.348" y="281.348" fill="#000" font-size="12" textLength="274.148">Preserve escaped path/query; assert fixed authority</text><rect x="78.347" y="313.984" width="286.15" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="88.347" y="336.441" fill="#000" font-size="12" textLength="266.15">Stream request body; forward end-to-end headers</text><rect x="45.988" y="369.078" width="350.867" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="55.988" y="391.535" fill="#000" font-size="12" textLength="330.867">Remove Host and hop-by-hop/Connection-nominated headers</text><rect x="61.018" y="424.172" width="320.809" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="71.018" y="446.629" fill="#000" font-size="12" textLength="300.809">Send without redirects, cookies, proxy or decompression</text><rect x="61.34" y="479.266" width="320.164" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="71.34" y="501.723" fill="#000" font-size="12" textLength="300.164">Ten-second connection timeout; no overall client timeout</text><rect x="186.736" y="583.277" width="69.371" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="196.736" y="605.734" fill="#000" font-size="12" textLength="49.371">502; stop</text><ellipse cx="221.422" cy="657.324" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="221.422" cy="657.324" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="150.811,534.359,292.033,534.359,304.033,546.359,292.033,558.359,150.811,558.359,138.811,546.359,150.811,534.359" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="225.422" y="569.778" fill="#000" font-size="11" textLength="17.118">yes</text><text x="150.811" y="550.86" fill="#000" font-size="11" textLength="141.222">Upstream switches protocol?</text><rect x="79.677" y="710.324" width="283.49" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="89.677" y="732.781" fill="#000" font-size="12" textLength="263.49">Forward status and end-to-end response headers</text><rect x="79.855" y="765.418" width="283.133" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="89.855" y="787.875" fill="#000" font-size="12" textLength="263.133">Disable buffering; SSE sets X-Accel-Buffering=no</text><rect x="76.346" y="820.512" width="290.152" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="86.346" y="842.969" fill="#000" font-size="12" textLength="270.152">Start response; HEAD/204/304 return without body</text><path d="M377.489,865.605 L377.489,891.133 L357.489,895.133 L377.489,899.133 L377.489,924.66 A0,0 0 0 0 377.489,924.66 L682.471,924.66 A0,0 0 0 0 682.471,924.66 L682.471,875.605 L672.471,865.605 L377.489,865.605 A0,0 0 0 0 377.489,865.605" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M672.471,865.605 L672.471,875.605 L682.471,875.605 L672.471,865.605" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="383.489" y="884.101" fill="#000" font-size="13" textLength="240.627">Caller cancellation aborts client response.</text><text x="383.489" y="900.452" fill="#000" font-size="13" textLength="283.981">Transport failure before response start gives 502;</text><text x="383.489" y="916.804" fill="#000" font-size="13" textLength="221.844">after response start aborts connection.</text><rect x="85.354" y="877.586" width="272.135" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="95.354" y="900.043" fill="#000" font-size="12" textLength="252.135">Otherwise read/write/flush each chunk until end</text><ellipse cx="221.422" cy="955.66" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="221.422" cy="955.66" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="221.422" y1="73.609" x2="221.422" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,83.609,221.422,93.609,225.422,83.609,221.422,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="221.422" y1="128.703" x2="221.422" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,138.703,221.422,148.703,225.422,138.703,221.422,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="221.422" y1="183.797" x2="221.422" y2="203.797" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,193.797,221.422,203.797,225.422,193.797,221.422,197.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="221.422" y1="238.891" x2="221.422" y2="258.891" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,248.891,221.422,258.891,225.422,248.891,221.422,252.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="221.422" y1="293.984" x2="221.422" y2="313.984" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,303.984,221.422,313.984,225.422,303.984,221.422,307.984" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="221.422" y1="349.078" x2="221.422" y2="369.078" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,359.078,221.422,369.078,225.422,359.078,221.422,363.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="221.422" y1="404.172" x2="221.422" y2="424.172" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,414.172,221.422,424.172,225.422,414.172,221.422,418.172" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="221.422" y1="459.266" x2="221.422" y2="479.266" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,469.266,221.422,479.266,225.422,469.266,221.422,473.266" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="221.422" y1="618.371" x2="221.422" y2="646.324" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,636.324,221.422,646.324,225.422,636.324,221.422,640.324" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="221.422" y1="558.359" x2="221.422" y2="583.277" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,573.277,221.422,583.277,225.422,573.277,221.422,577.277" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="304.033" y1="546.359" x2="316.033" y2="546.359" style="stroke:#181818;stroke-width:1;"/><polygon points="312.033,616.324,316.033,626.324,320.033,616.324,316.033,620.324" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="316.033" y1="546.359" x2="316.033" y2="690.324" style="stroke:#181818;stroke-width:1;"/><line x1="316.033" y1="690.324" x2="221.422" y2="690.324" style="stroke:#181818;stroke-width:1;"/><line x1="221.422" y1="690.324" x2="221.422" y2="710.324" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,700.324,221.422,710.324,225.422,700.324,221.422,704.324" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="221.422" y1="514.359" x2="221.422" y2="534.359" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,524.359,221.422,534.359,225.422,524.359,221.422,528.359" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="221.422" y1="745.418" x2="221.422" y2="765.418" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,755.418,221.422,765.418,225.422,755.418,221.422,759.418" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="221.422" y1="800.512" x2="221.422" y2="820.512" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,810.512,221.422,820.512,225.422,810.512,221.422,814.512" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="221.422" y1="855.605" x2="221.422" y2="877.586" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,867.586,221.422,877.586,225.422,867.586,221.422,871.586" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="221.422" y1="912.68" x2="221.422" y2="944.66" style="stroke:#181818;stroke-width:1;"/><polygon points="217.422,934.66,221.422,944.66,225.422,934.66,221.422,938.66" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="30"><text x="157.859" y="986.041" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="157.581" y="998.619" fill="#888" font-size="10" textLength="386.309">claimed. Entire proxy reviewed. It adds no credential, but forwards incoming end-to-end</text><text x="148.394" y="1011.197" fill="#888" font-size="10" textLength="404.683">Authorization/Cookie headers unless excluded by Connection. Upstream authentication is a</text><text x="162.022" y="1023.775" fill="#888" font-size="10" textLength="377.427">separate boundary. It does not support CONNECT or protocol upgrade. Client-owned</text><text x="202.325" y="1036.354" fill="#888" font-size="10" textLength="296.821">cancellation controls streams; pooled buffers are returned in finally.</text></g><?plantuml-src dLJRZjis47tNLmpGXoH0RCcsPAzj5CNMsKK2DBj1d09zfSYHnIvDAYIrNlUf7z4lx9VqKBPtjtqi34C4BpDdpZapR-ZcKIksabVqY-YCa9oBhilFw_6DLPtJDeRnVSVs-jF6xJiHyw_S21cT_-BTq_6pLihmGNWUoq3RZzVJQawJIXNJHL7NCrxCYsLHA75LpgwQibgMawMgYx9YLQgwh1RB-KmkcwlPibQDBAh9efhFo-pD_qC6H3ilzg-GB1TbLKhLYDcidigYLch1t9IbubBDcHTBUJLTpARJOg6cpRogwcenKzD