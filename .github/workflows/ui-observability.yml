name: Observe — UI

# Explicit evidence lane. Browser preparation and capture run under the same host
# reservation as other self-hosted operations. Evidence is uploaded even when the
# collector fails, then the workflow reports that failure truthfully.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "running Laplace UI/API base URL"
        type: string
        required: true
        default: "http://127.0.0.1:8080"
      routes:
        description: "optional comma-separated route names/paths; blank captures every primary surface"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  LAPLACE_UI_URL: ${{ inputs.base_url }}
  LAPLACE_UI_ROUTES: ${{ inputs.routes }}

jobs:
  capture:
    name: Capture rendered UI evidence
    runs-on: [self-hosted, laplace]
    timeout-minutes: 20
    steps:
      - name: Create evidence directory
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/laplace-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$receipt"
          mkdir -p "$receipt"
          printf 'LAPLACE_UI_DIAGNOSTICS_DIR=%s\n' "$receipt" >> "$GITHUB_ENV"

      - name: Prepare and capture UI evidence under the host reservation
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 0002
          lock_root="${LAPLACE_WORK_ROOT:-/build/laplace/work}"
          mkdir -p "$lock_root"
          exec 9>"$lock_root/host-resource.lock"
          flock 9

          cd "$GITHUB_WORKSPACE"
          if [[ ! -e .git ]]; then
            [[ -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]] || {
              echo "::error::nonempty diagnostics workspace has no repository; preserving its files" >&2
              exit 1
            }
            git init --initial-branch=main
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          git diff --quiet
          git diff --cached --quiet
          checkout_auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $checkout_auth" \
            git fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset checkout_auth CHECKOUT_TOKEN
          git checkout --no-overwrite-ignore --detach "$TARGET_SHA"
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git diff --quiet
          git diff --cached --quiet

          # Bind evidence to both the collector source and the application actually running.
          # Checking out source is not proof that the deployed runtime came from that source.
          export LAPLACE_DIAGNOSTIC_SOURCE_REVISION="$TARGET_SHA"
          export LAPLACE_DEPLOYED_RUNTIME_REVISION="$(cat "${LAPLACE_APP_DIR:-/opt/laplace/app}/.laplace-source-revision" 2>/dev/null || true)"

          tooling_state="$lock_root/ui-observability"
          mkdir -p "$tooling_state"
          current="$(sha256sum web/package-lock.json | awk '{print $1}')"
          stamp="$tooling_state/npm-lock.sha256"
          previous="$(cat "$stamp" 2>/dev/null || true)"
          if [[ ! -d web/node_modules || "$current" != "$previous" ]]; then
            (cd web && npm ci --no-audit --no-fund --prefer-offline)
            printf '%s\n' "$current" > "$stamp"
          fi
          (cd web && npx playwright install chromium)

          set +e
          (cd web && node scripts/capture-ui-diagnostics.mjs)
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$LAPLACE_UI_DIAGNOSTICS_DIR/collector-exit-code.txt"
          if (( rc != 0 )); then
            echo "::error::UI evidence collector exited $rc; receipt will be uploaded before the job fails"
          fi

      - name: Publish evidence summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$LAPLACE_UI_DIAGNOSTICS_DIR/summary.md" ]]; then
            cat "$LAPLACE_UI_DIAGNOSTICS_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Laplace UI diagnostics' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'Collector did not produce a summary; inspect the artifact/tooling logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LAPLACE_UI_DIAGNOSTICS_DIR }}/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce collector result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$LAPLACE_UI_DIAGNOSTICS_DIR/collector-exit-code.txt"
          [[ -f "$receipt" ]] || { echo "::error::collector exit receipt missing"; exit 1; }
          rc="$(cat "$receipt")"
          [[ "$rc" =~ ^[0-9]+$ ]] || { echo "::error::invalid collector exit receipt: $rc"; exit 1; }
          exit "$rc"
