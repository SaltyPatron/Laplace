   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14293c" x="36.216" y="139.09824" transform="rotate(-0 36.216 139.09824)">ORDERED IDENTITY</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #14293c" transform="translate(36.216 166.520436)">[t, a, r] ≠ [r, a, t]</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #14293c" transform="translate(36.216 184.767545)">Hash ordered child IDs</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #14293c" transform="translate(36.216 201.30192)">Retain order and repeats</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14293c" x="282.852" y="139.09824" transform="rotate(-0 282.852 139.09824)">CENTROID GEOMETRY</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #14293c" transform="translate(282.852 166.10192)">Same immediate multiset</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #14293c" transform="translate(282.852 182.636295)">→ same integer sum / count</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #14293c" transform="translate(282.852 201.30192)">→ same centroid</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14293c" x="529.488" y="139.09824" transform="rotate(-0 529.488 139.09824)">RECONSTRUCTION</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #14293c" transform="translate(529.488 166.10192)">Read the stored child path</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #14293c" transform="translate(529.488 183.70192)">Expand runs / descendants</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #14293c" transform="translate(529.488 201.30192)">Recover the original sequence</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14293c" x="28.962" y="301.2048" transform="rotate(-0 28.962 301.2048)">Same position can hold different ordered content.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #14293c" transform="translate(28.962 348.04533)">Geometry supplies a location. The ordered content address and stored path carry identity and order.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #14293c" transform="translate(28.962 367.24533)">Prototype code checks a hash hit against the children, but a mismatch increments a counter</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #14293c" transform="translate(28.962 386.44533)">and returns the existing record; that path is not collision repair.</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14293c" x="21.24" y="24.676406" transform="rotate(-0 21.24 24.676406)">A location is not the content address</text>
  </g>
