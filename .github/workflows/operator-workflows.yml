name: Operator workflow validation
on:
  push:
    branches: [main]
    paths: ['.github/**', 'scripts/test-seed-workflow-ownership.py', 'scripts/test-decomposer-gate-check.py', 'scripts/decomposer-gate-check.py', 'scripts/native-ingest-idempotency.sql', 'scripts/ingest-source.sh', 'scripts/ingest_catalog.py', 'scripts/ensure-foundation.sh', 'deploy/linux/host-lock.sh', 'deploy/client/**']
  pull_request:
    paths: ['.github/**', 'scripts/test-seed-workflow-ownership.py', 'scripts/test-decomposer-gate-check.py', 'scripts/decomposer-gate-check.py', 'scripts/native-ingest-idempotency.sql', 'scripts/ingest-source.sh', 'scripts/ingest_catalog.py', 'scripts/ensure-foundation.sh', 'deploy/linux/host-lock.sh', 'deploy/client/**']
permissions:
  contents: read
jobs:
  workflows:
    # This repository's own runner; never for a fork's pull request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, laplace, Laplace, staging]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          clean: false
      - name: Prepare exact candidate while retaining verified build inputs
        run: bash scripts/ci/prepare-checkout.sh
      - name: Read the qualified recipe catalog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Engine
          ref: main
          path: .ci-dependencies/Laplace-Engine
          persist-credentials: false
      - name: Validate workflow syntax and operator ownership
        run: |
          ruby -rpsych -e 'ARGV.each { |path| Psych.parse_file(path) }' .github/workflows/*.yml
          bash -n scripts/ingest-source.sh scripts/ensure-foundation.sh deploy/linux/host-lock.sh
          python3 scripts/test-seed-workflow-ownership.py WorkflowOwnership SeedHostOwnership
          python3 scripts/test-decomposer-gate-check.py
          LAPLACE_RECIPES="$GITHUB_WORKSPACE/.ci-dependencies/Laplace-Engine/recipes" python3 scripts/ingest_catalog.py --check-workflow-choices
          python3 deploy/client/test_install_client.py
          python3 deploy/client/test_launcher.py
