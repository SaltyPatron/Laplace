name: Stop superseded lifecycle 35014045754
on:
  push:
    branches: [ops/stop-superseded-lifecycle-35014045754]
permissions:
  contents: read
  actions: write
jobs:
  stop-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Stop only the obsolete lifecycle replaced by merged PR 1590
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = "https://api.github.com/repos/SaltyPatron/Laplace"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def api(path, method="GET"):
              request = urllib.request.Request(base + path, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else {}
          run = 35014045754
          old = api(f"/actions/runs/{run}")
          replacement = api("/actions/runs/35014465684")
          assert old["head_sha"] == "90d5944c1dd392bcaba86251bd25c9e6e8e74955"
          assert old["head_branch"] == "main" and old["event"] == "push"
          assert old["path"] == ".github/workflows/laplace.yml"
          assert replacement["head_sha"] == "a1522c960732c22e8e2d74393581981ee06ebf31"
          assert replacement["head_branch"] == "main" and replacement["path"] == old["path"]
          assert replacement["status"] in ("pending", "queued", "in_progress") or replacement["conclusion"] == "success"
          if old["status"] == "completed":
              print("SUPERSEDED_RUN_ALREADY_COMPLETED", run, old["conclusion"])
              raise SystemExit(0)
          jobs = api(f"/actions/runs/{run}/jobs")["jobs"]
          assert len(jobs) == 1 and jobs[0]["id"] == 104532864435
          assert jobs[0]["name"] == "Product — prove, activate and verify"
          api(f"/actions/runs/{run}/cancel", "POST")
          print("SUPERSEDED_RUN_CANCEL_ACCEPTED", run, old["head_sha"], flush=True)
          for _ in range(20):
              time.sleep(3)
              current = api(f"/actions/runs/{run}")
              if current["status"] == "completed":
                  print("SUPERSEDED_RUN_STOPPED", run, current["conclusion"])
                  raise SystemExit(0)
          current = api(f"/actions/runs/{run}")
          assert current["head_sha"] == old["head_sha"]
          if current["status"] != "completed":
              api(f"/actions/runs/{run}/force-cancel", "POST")
              print("SUPERSEDED_RUN_FORCE_CANCEL_ACCEPTED", run, flush=True)
          PY
