607.266" style="stroke:#181818;stroke-width:1;"/><polygon points="385.85,597.266,389.85,607.266,393.85,597.266,389.85,601.266" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="389.85" y1="642.359" x2="389.85" y2="662.359" style="stroke:#181818;stroke-width:1;"/><polygon points="385.85,652.359,389.85,662.359,393.85,652.359,389.85,656.359" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="24"><rect x="120.844" y="705.359" width="529.846" height="80.438" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="125.844" y="724.893" fill="#000" font-size="14" textLength="471.598">Zero status can mean skipped input rather than a newly admitted document.</text><text x="125.844" y="742.502" fill="#000" font-size="14" textLength="465.329">lpm_last returns the last existing document. A caller that checks only status</text><text x="125.844" y="760.111" fill="#000" font-size="14" textLength="519.846">can report a previous document after a skipped file, or no record on an empty index.</text><text x="125.844" y="777.721" fill="#000" font-size="14" textLength="347.033">Directory order is readdir order, not sorted source order.</text></g><g class="footer" data-source-line="30"><text x="192.89" y="809.178" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="194.573" y="821.756" fill="#888" font-size="10" textLength="382.388">claimed. Path traversal and file-read bodies reviewed. Direct path stat follows symlinks</text><text x="193.464" y="834.334" fill="#888" font-size="10" textLength="384.604">whereas recursive traversal rejects symlink entries. This is the local index path used by</text><text x="228.735" y="846.912" fill="#888" font-size="10" textLength="314.063">Python admit and native lpm CLI, distinct from Engine database ingest.</text></g><?plantuml-src NLHDR-Cs4BthLmpGGxD08ZlUs8xjGn6aCRh0xZPOjvTUYX4vijbGf4fISRod_H7zXVqbVPHi9zkB9LFpyTwRD_oH7fwD5gTaIH-vjQpawjFzuyXnCiyoicrJAjhySZUPpaXOtqmcxoUrqWkkAgvaeXUwhgl5P34UZsTpTJszdV9xqPDwCRkfr9ndzVnM9lFnzLHkTH6VZ6ivS4CLgwTjy9tJzzxwG3-ixzRtw_MRYBXZxVV6RQbc6-ND5oqrTpQjlKkVkH7Qi8iR2QOkaabMw9FNdUL0rbI0J_z--uTgW_CK-5b2P4liDB5kJ8p6EufYHIMy5J5nICKIZqInQrjhH5FBQRUYFXXWyZyAahhW8WvT5yaxMHMcfekVJK0X7mu_lQEq4qSN1udl2bf-4TM523tjWSHrZGHEWhSKZCGL0ZPFfgLuQAnnJ_6I76XfgZfZzKYnsWdfOsd4z-WxjsUN42GlILocyLf7xP3N0mKsCAxjeEFDU36xgWxeN7LrBM5L28IbYonEHlbxFFKPzEgfxatQ-IwzzY6sg6TDJCXt6gelrnYW0EPHIQ3gyuFytQ4Sdjj-7lrX1X_DLw7hihmUtznEvpFAc01_-MiBpN90WDFGaO5ac0KI1eaVcZOTHgYsbL7dSXnNLaPnvqFgq_ul_GUdWZIGcc2WjXMzEawFlahmL0Dwsl70-2H8hfDpuPu_iqqIANWDDLOzUSNPBADN0zLiR0UYRV0jRp7Qxvnn5EdBqFNLX9bP1zen-RQmiaKSLJubtnH_P6Z3TrBig17y7F4JrW3pW8DsqcE7PEHa3slrMBFysgikSowBJC5oJ6VB8elw0td12BCjpi5qXsRMob4Hs4uzPGweF60fCfOWRTQQmLQUZGV2Km7YEY6PpqYpffS4XPr7cl91K_QF8ybJ114jBsLntXf4QkIRs0yIJXmEi0uUqqDJb8o-2qg63sMMTX2kgBr7xsBJVxxAo6IFS1_08aBpFB6IFkCz5v46osDKRjImSUHXl5MFiiCvhXHMIjh4k1KBPHadkgJ7l0xVto6Pu5Llrihhl9gdnYKDh8OTwZrS-xmtyRpbnHxp4yuvnylXJV4WVo7x77owAahwRGTvp76CSA8TL1pwT37V6eVYyO2TTOCTUfp3PKxvDhp_-E4IMvv7d_Sy-8OUtDOuh3udhXZ-XocWKwyk7NNz3m00?></g></svg>