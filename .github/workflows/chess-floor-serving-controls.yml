name: Build install and record exact source in the authoritative checkout
on:
  push:
    branches: ['verify/chess-floor-serving-controls-20260916']
permissions:
  contents: read
jobs:
  native:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 200
    env:
      TARGET_SHA: ''
      TARGET_TREE: ''
      REQUIRED_ANCESTOR: c490651eee906f44f944ae2c2b0d0783516f9e0c
      LAPLACE_EXTERNAL: /build/external
      LAPLACE_INSTALL_PREFIX: /opt/laplace
      LAPLACE_PG_PREFIX: /opt/laplace/pgsql-18
      PGHOST: /var/run/postgresql
      PGPORT: '5432'
      PGUSER: laplace_admin
      PGDATABASE: laplace
      LAPLACE_DATA_ROOT: /vault/Data
      MSBUILDDISABLENODEREUSE: '1'
      UseSharedCompilation: 'false'
    steps:
      - name: Prepare retained native execution paths
        shell: bash
        run: |
          set -euo pipefail
          evidence="/build/laplace/recovery/native-install/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$evidence"
          chmod 0700 "$evidence"
          echo "NATIVE_EVIDENCE=$evidence" >> "$GITHUB_ENV"
      - name: Execute existing native dependency build proof and install owners
        id: native
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=300s 10500s \
            flock --exclusive --no-fork --timeout 1800 /build/laplace/work/host-resource.lock \
            timeout --signal=TERM --kill-after=300s 8700s bash -s <<'NATIVE' 2>&1 | tee "$NATIVE_EVIDENCE/execution.log"
          set -euo pipefail
          umask 0002
          export TMPDIR="$NATIVE_EVIDENCE/tmp" TMP="$NATIVE_EVIDENCE/tmp" TEMP="$NATIVE_EVIDENCE/tmp"
          mkdir -p "$TMPDIR"
          cd "$GITHUB_WORKSPACE"
          fetch_args=(--no-tags)
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then fetch_args+=(--deepen=128); fi
          timeout 120s git fetch "${fetch_args[@]}" origin main
          export TARGET_SHA="$(git rev-parse --verify FETCH_HEAD^{commit})"
          export TARGET_TREE="$(git rev-parse "$TARGET_SHA^{tree}")"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ && "$TARGET_TREE" =~ ^[0-9a-f]{40}$ ]]
          printf 'TARGET_SHA=%s\nTARGET_TREE=%s\n' "$TARGET_SHA" "$TARGET_TREE" >> "$GITHUB_ENV"
          echo "NATIVE_SOURCE_FREEZE origin/main $TARGET_SHA $TARGET_TREE under-host-lock"
          git merge-base --is-ancestor "$REQUIRED_ANCESTOR" "$TARGET_SHA" || { echo "selected main does not retain the integrated native owners"; exit 1; }
          while read -r expected_mode expected_blob source_path; do
            read -r actual_mode actual_type actual_blob actual_path <<<"$(git ls-tree "$TARGET_SHA" -- "$source_path")"
            [[ "$actual_mode" == "$expected_mode" && "$actual_type" == blob && "$actual_blob" == "$expected_blob" && "$actual_path" == "$source_path" ]] || {
              echo "selected main changed a reviewed execution owner: $source_path"; exit 1;
            }
          done <<'SOURCE_OWNERS'
          100644 24262d1a0bab0f10bf9d1d23540e7167718a8c1b deploy/linux/deploy.sh
          100644 08b77f507ba79051976407676b2677a636d685b0 deploy/linux/payload-sync.sh
          100644 74735da619fdf755e992374b5f64a2d46d380a23 scripts/check-application-runtime.py
          100644 10d187f6a49da2d97979e34633c9ab7ea5ec8717 scripts/export-qualified-chess-floors.py
          100755 5ad0e037f56aef0827780b0609f9e5edfcc60124 scripts/measure-installed-chess-corpus.py
          100755 51e9a74ff7e309cf3bb040138c3de3b5174ef131 scripts/postgresql-release.py
          100755 de02b13620f96442f2ad0246dffe411da4418ffd scripts/publish-applications.sh
          100755 fa50997cce0157c8cc42217c5630b6770223707a scripts/verify-api-payload.py
          100755 663a756c609f26b006ca19c9f6494ed195b8a5cb deploy/linux/managed-publish.sh
          100755 3963399842a2ce24a668a30d1660ceb7a25c6c9f scripts/pipeline.sh
          100755 46fa6bd8fa99279da4da523a65af7f84768eca8c scripts/wait-for-quiet-substrate.sh
          100755 d4b12520bf2783984c19d9b9d9fda63e8ba3f51b scripts/test-parallel.sh
          100755 dce577c252299f378aed714e0a5c4f144a0104e3 scripts/bootstrap-ingest-liveness.py
          100755 58621ba3680a1d10a47542002882d3365dbed640 scripts/product-ci.sh
          SOURCE_OWNERS
          [[ ! -L "$GITHUB_WORKSPACE" && "$(pwd -P)" == "$GITHUB_WORKSPACE" ]]
          python3 - <<'PY'
          import hashlib,json,os,pathlib,stat,subprocess
          root=pathlib.Path.cwd()
          source=root/".eval-proof/generation.json"
          if source.exists() or source.is_symlink():
              if (root/".eval-proof").is_symlink():
                  raise SystemExit("generated evaluation parent is a symlink; preserved untouched")
              tracked=subprocess.run(["git","ls-files","--error-unmatch","--",".eval-proof/generation.json"],
                  stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              if tracked:
                  raise SystemExit("evaluation output became tracked source; preserved untouched")
              info=source.lstat()
              if not stat.S_ISREG(info.st_mode) or info.st_uid!=os.getuid() or info.st_size>16*1024*1024:
                  raise SystemExit("evaluation output shape/owner differs; preserved untouched")
              descriptor=os.open(source,os.O_RDONLY|os.O_NOFOLLOW)
              with os.fdopen(descriptor,"rb") as stream:
                  opened=os.fstat(stream.fileno())
                  if (opened.st_dev,opened.st_ino)!=(info.st_dev,info.st_ino):
                      raise SystemExit("generated evaluation identity changed before reading")
                  raw=stream.read(16*1024*1024+1)
              if len(raw)!=info.st_size:
                  raise SystemExit("generated evaluation size changed while reading")
              json.loads(raw)
              digest=hashlib.sha256(raw).hexdigest()
              destination=pathlib.Path(os.environ["NATIVE_EVIDENCE"])/"preserved-generated-output/generation.json"
              destination.parent.mkdir(mode=0o700)
              with destination.open("xb") as stream:
                  stream.write(raw)
                  stream.flush()
                  os.fsync(stream.fileno())
              os.chown(destination,info.st_uid,info.st_gid)
              os.chmod(destination,stat.S_IMODE(info.st_mode))
              os.utime(destination,ns=(info.st_atime_ns,info.st_mtime_ns))
              saved=destination.stat()
              if (hashlib.sha256(destination.read_bytes()).hexdigest()!=digest
                      or (saved.st_uid,saved.st_gid,stat.S_IMODE(saved.st_mode)) !=
                         (info.st_uid,info.st_gid,stat.S_IMODE(info.st_mode))):
                  raise SystemExit("generated evaluation preservation identity differs")
              current=source.lstat()
              if ((current.st_dev,current.st_ino,current.st_size,current.st_mtime_ns,current.st_mode,current.st_uid,current.st_gid) !=
                  (info.st_dev,info.st_ino,info.st_size,info.st_mtime_ns,info.st_mode,info.st_uid,info.st_gid)
                      or hashlib.sha256(source.read_bytes()).hexdigest()!=digest):
                  raise SystemExit("generated evaluation changed during preservation; original retained")
              source.unlink()
              receipt={"source":str(source),"preserved":str(destination),"bytes":len(raw),"sha256":digest,
                       "uid":saved.st_uid,"gid":saved.st_gid,"mode":oct(stat.S_IMODE(saved.st_mode)),
                       "owner":"scripts/test-parallel.sh run_generation_eval"}
              (destination.parent/"receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
              print("PRESERVED_GENERATED_EVALUATION "+json.dumps(receipt),flush=True)
          PY
          [[ -z "$(git status --porcelain --untracked-files=normal)" ]] || { echo "existing authoritative checkout changes preserved; native execution refused"; exit 1; }
          export NATIVE_PREVIOUS_CHECKOUT_SHA="$(git rev-parse HEAD)"
          git checkout --detach "$TARGET_SHA"
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" && "$(git rev-parse HEAD^{tree})" == "$TARGET_TREE" ]]
          [[ -z "$(git status --porcelain --untracked-files=normal)" ]] || { echo "selected authoritative checkout is not clean; native execution refused"; exit 1; }
          export NATIVE_SOURCE_ROOT="$PWD"
          unset LAPLACE_BUILD_ROOT
          export LAPLACE_ENGINE_BUILD="$PWD/build/engine"
          export LAPLACE_CORPUS_EVIDENCE="$NATIVE_EVIDENCE"
          python3 scripts/place-build-directory.py "$PWD"
          export LAPLACE_BUILD_ROOT="$(realpath "$PWD/build")"
          mkdir -p "$TMPDIR" "$NATIVE_EVIDENCE/private"
          chmod 0700 "$TMPDIR" "$NATIVE_EVIDENCE/private"
          export LAPLACE_CI_SESSION_DIRECTORY="$NATIVE_EVIDENCE/private"
          export LAPLACE_REGRESS_DB="laplace_pr_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          set +u
          source /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1
          set -u
          cmake_bin="$(python3 scripts/provision-cmake.py --root /opt/laplace/tools/cmake --work /build/laplace/work/cmake --ensure)"
          export PATH="$cmake_bin:/opt/laplace/pgsql-18/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/build/engine/core:$PWD/build/engine/dynamics:$PWD/build/engine/synthesis:${LD_LIBRARY_PATH:-}"
          export LAPLACE_DB='Host=/var/run/postgresql;Username=laplace_admin;Database=laplace'
          export LAPLACE_QUERY_DB=laplace
          export CMAKE_BUILD_PARALLEL_LEVEL="${CMAKE_BUILD_PARALLEL_LEVEL:-$(nproc)}"
          export CTEST_PARALLEL_LEVEL="${CTEST_PARALLEL_LEVEL:-$(nproc)}"
          phase() {
            local name="$1"; shift
            echo "NATIVE_PHASE $name running $(date -u +%FT%TZ)"
            "$@"
            printf '%s\n' "$name" >> "$NATIVE_EVIDENCE/completed-phases.txt"
            echo "NATIVE_PHASE $name passed $(date -u +%FT%TZ)"
          }
          python3 - <<'PY'
          import json, os, pathlib, stat, subprocess
          paths=["/build/external/PINS.tsv","/build/external/postgresql","/build/external/postgresql/.git","/opt/laplace/pgsql-18"]
          for name in paths:
              p=pathlib.Path(name); s=p.lstat()
              if p.is_symlink() or s.st_uid != os.getuid() or not os.access(p,os.W_OK):
                  raise SystemExit("native owner access changed: "+name)
          repo="/build/external/postgresql"
          tracked=subprocess.check_output(["git","-c","safe.directory="+repo,"-C",repo,"status","--porcelain","--untracked-files=no"],text=True)
          if tracked: raise SystemExit("PostgreSQL tracked user changes preserved; source update refused")
          selected=json.loads(pathlib.Path("deploy/postgresql-release.json").read_text())
          if selected["commit"]!="724edf9bde9d356724ad384a2e196edc3c9f80f7" or selected["version"]!="18.6":
              raise SystemExit("selected release differs from reviewed official PostgreSQL18.6")
          output={"schema":"laplace.native-only-install/v1","status":"running","source":os.environ["TARGET_SHA"],
                  "tree":os.environ["TARGET_TREE"],"operatorSource":os.environ["GITHUB_SHA"],
                  "runId":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],
                  "uid":os.getuid(),"checkout":str(pathlib.Path.cwd().resolve()),
                  "managedPublication":"not_attempted","fullLifecyclePassed":False,
                  "databaseRecreation":False,"foundationIngestion":False,"postgresqlSelection":selected}
          pathlib.Path(os.environ["NATIVE_EVIDENCE"],"selection.json").write_text(json.dumps(output,indent=2)+"\n")
          PY
          API_WAS_ACTIVE=0
          NATIVE_INSTALL_STARTED=0
          REGRESSION_STARTED=0
          REGRESSION_CLEANED=0
          native_cleanup() {
            original_status=$?
            trap - EXIT
            trap '' TERM INT
            set +e
            regression_cleanup_status=0
            api_recovery_status=0
            if [[ "$REGRESSION_STARTED" == 1 && "$REGRESSION_CLEANED" != 1 ]]; then
              timeout --signal=TERM --kill-after=10s 60s ctest --test-dir build --output-on-failure -j 1 -R '^regress_teardown_laplace_(geom|substrate)$' > "$NATIVE_EVIDENCE/regression-cleanup.log" 2>&1
              regression_cleanup_status=$?
            fi
            if [[ "$NATIVE_INSTALL_STARTED" == 1 && "$API_WAS_ACTIVE" == 1 ]] && ! /usr/bin/systemctl is-active --quiet laplace-api.service; then
              timeout --signal=TERM --kill-after=10s 120s sudo -n /usr/bin/systemctl start laplace-api.service > "$NATIVE_EVIDENCE/api-state-recovery.log" 2>&1
              api_recovery_status=$?
              if [[ "$api_recovery_status" == 0 ]]; then
                timeout --signal=TERM --kill-after=10s 70s python3 scripts/verify-application-release.py --base http://127.0.0.1:5187 --readiness-only --state-file "$NATIVE_EVIDENCE/api-recovered-readiness.json" --timeout-seconds 60 >> "$NATIVE_EVIDENCE/api-state-recovery.log" 2>&1
                api_recovery_status=$?
              fi
            fi
            printf '{"originalExit":%s,"apiInitiallyActive":%s,"regressionCleanupExit":%s,"apiRecoveryExit":%s}\n' "$original_status" "$API_WAS_ACTIVE" "$regression_cleanup_status" "$api_recovery_status" > "$NATIVE_EVIDENCE/cleanup.json"
            if [[ "$original_status" == 0 && "$regression_cleanup_status" != 0 ]]; then original_status="$regression_cleanup_status"; fi
            if [[ "$original_status" == 0 && "$api_recovery_status" != 0 ]]; then original_status="$api_recovery_status"; fi
            exit "$original_status"
          }
          trap native_cleanup EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT
          phase pg-pin python3 scripts/postgresql-release.py select-pin --external /build/external
          if ! git -c safe.directory=/build/external/postgresql -C /build/external/postgresql cat-file -e 724edf9bde9d356724ad384a2e196edc3c9f80f7^{commit}; then
            phase pg-fetch timeout 180s git -c safe.directory=/build/external/postgresql -C /build/external/postgresql fetch --no-tags https://git.postgresql.org/git/postgresql.git 724edf9bde9d356724ad384a2e196edc3c9f80f7
          fi
          phase pg-checkout git -c safe.directory=/build/external/postgresql -C /build/external/postgresql checkout --detach 724edf9bde9d356724ad384a2e196edc3c9f80f7
          phase pg-source python3 scripts/postgresql-release.py source --external /build/external
          phase dependency-build bash scripts/build-system-deps.sh
          phase dependency-identity python3 scripts/postgresql-release.py installed --prefix /opt/laplace/pgsql-18
          build_and_register() {
            bash scripts/product-ci.sh build
            cmake -S "$PWD" -B "$PWD/build"
            ctest --test-dir build --show-only=json-v1 -L regress > "$NATIVE_EVIDENCE/regression-registration.json"
            python3 - <<'PY'
          import json, os, pathlib, re
          stem=os.environ["LAPLACE_REGRESS_DB"]
          assert re.fullmatch(r"laplace_pr_[0-9]+_[0-9]+",stem)
          document=json.loads(pathlib.Path(os.environ["NATIVE_EVIDENCE"],"regression-registration.json").read_text())
          tests=document["tests"]
          expected={prefix+"laplace_"+kind for prefix in ("regress_","regress_setup_","regress_teardown_") for kind in ("geom","substrate")}
          assert len(tests)==6 and {test["name"] for test in tests}==expected
          for test in tests:
              kind="substrate" if test["name"].endswith("_substrate") else "geom"
              database=stem+"_"+kind
              command=test["command"]
              found=re.findall(r"laplace_(?:pr_[0-9]+_[0-9]+|regress)_(?:geom|substrate)"," ".join(command))
              assert found and set(found)=={database},test["name"]
              assert "/opt/laplace/pgsql-18/" in " ".join(command),test["name"]
              if test["name"]=="regress_laplace_"+kind:
                  assert "--dbname="+database in command and "--use-existing" in command
          print("CURRENT_NATIVE_REGRESSION_REGISTRATION "+json.dumps({"databaseStem":stem,"tests":sorted(expected)}),flush=True)
          PY
          }
          phase native-managed-build build_and_register
          phase native-tests bash scripts/test-parallel.sh --profile dev-native --suite native-dev
          phase managed-tests bash scripts/test-parallel.sh --profile dev-managed --suite managed-dev
          phase uci-tests bash scripts/test-parallel.sh --profile dev-managed --suite uci-dev
          prepare_and_wait_for_quiet() {
            python3 scripts/bootstrap-ingest-liveness.py apply --database "$PGDATABASE" --user laplace_admin --psql /opt/laplace/pgsql-18/bin/psql
            bash scripts/wait-for-quiet-substrate.sh "$PGDATABASE" 180
          }
          phase quiet-native-owner prepare_and_wait_for_quiet
          if /usr/bin/systemctl is-active --quiet laplace-api.service; then API_WAS_ACTIVE=1; fi
          NATIVE_INSTALL_STARTED=1
          phase native-install bash scripts/pipeline.sh install
          phase extension-sql bash scripts/pipeline.sh sync-extension
          REGRESSION_STARTED=1
          installed_database_controls() {
            bash scripts/test-parallel.sh --profile db --suite native-db --serial
            local installed_floor
            installed_floor=$(/opt/laplace/pgsql-18/bin/psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -U laplace_admin -Atqc "SELECT current_setting('laplace_substrate.perfcache_path')")
            [[ -n "$installed_floor" && -f "$installed_floor" ]] || { echo "installed perfcache missing for database retry regression"; return 1; }
            LAPLACE_PERFCACHE_BIN="$installed_floor" dotnet test app/Laplace.Substrate.Tests/Laplace.Substrate.Tests.csproj -c Release --no-build --nologo --verbosity minimal --filter 'FullyQualifiedName=Laplace.SubstrateCRUD.Tests.WorkingSetApplyTests.WorkingSetApply_RetryReprobesAbsenceAfterForeignLanding'
          }
          phase installed-native-database installed_database_controls
          REGRESSION_CLEANED=1
          phase database-health bash scripts/check-database-health.sh laplace
          running="$(psql -X -d postgres -U laplace_admin -Atqc 'SHOW server_version_num')"
          [[ "$running" == 180006 ]]
          phase postgres-activation python3 scripts/postgresql-release.py restart-needed --prefix /opt/laplace/pgsql-18 --server-version-num "$running"
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,subprocess,sys
          selected_root=pathlib.Path.cwd().resolve()
          guard_spec=importlib.util.spec_from_file_location("selected_native_install_guard",selected_root/"scripts/check-application-runtime.py")
          guard=importlib.util.module_from_spec(guard_spec)
          sys.modules[guard_spec.name]=guard
          guard_spec.loader.exec_module(guard)
          selected_build_identity=guard.build_identity(selected_root,pathlib.Path(os.environ["LAPLACE_INSTALL_PREFIX"]))
          root=pathlib.Path(os.environ["NATIVE_EVIDENCE"])
          files=["/opt/laplace/lib/liblaplace_core.so","/opt/laplace/pgsql-18/bin/postgres",
                 "/opt/laplace/pgsql-18/bin/pg_config"]
          identities={}
          for name in files:
              p=pathlib.Path(name); h=hashlib.sha256()
              with p.open("rb") as stream:
                  for chunk in iter(lambda:stream.read(1048576),b""):h.update(chunk)
              identities[name]={"path":str(p.resolve()),"bytes":p.stat().st_size,"sha256":h.hexdigest()}
          outcome={"schema":"laplace.native-only-install/v1","status":"completed","source":os.environ["TARGET_SHA"],
                   "tree":os.environ["TARGET_TREE"],"runId":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],
                   "completedPhases":(root/"completed-phases.txt").read_text().splitlines(),"identities":identities,
                   "executionRoute":"direct-installed-regression","regressionDatabaseStem":os.environ["LAPLACE_REGRESS_DB"],
                   "checkout":str(pathlib.Path.cwd().resolve()),"buildDirectory":str(pathlib.Path("build").resolve(strict=True)),
                   "buildIdentity":selected_build_identity,
                   "serverVersionNum":180006,"managedPublication":"not_attempted","fullLifecyclePassed":False,
                   "databaseRecreation":False,"foundationIngestion":False}
          (root/"receipt.json").write_text(json.dumps(outcome,indent=2)+"\n")
          print("NATIVE_INSTALL_RESULT "+json.dumps(outcome),flush=True)
          PY
          python3 - <<'PY'
          import json, os, subprocess
          # Read-only context is diagnostic; the writer owns admission serialization.
          import base64, pathlib
          journal_sql = base64.b64decode("").decode("ascii")
          observation_root = pathlib.Path(os.environ["LAPLACE_CORPUS_EVIDENCE"])
          (observation_root / "ingest-observation.sql").write_text(journal_sql)
          journal_environment = {k: v for k, v in os.environ.items() if not k.startswith("PG")}
          journal_environment["PGOPTIONS"] = "-c default_transaction_read_only=on -c statement_timeout=5000 -c lock_timeout=1000"
          try:
              observed = subprocess.run([os.environ["LAPLACE_PG_PREFIX"] + "/bin/psql",
                  "-X", "-w", "-qAt", "-h", "/var/run/postgresql", "-p", "5432",
                  "-U", "laplace_admin", "-d", "laplace", "-v", "ON_ERROR_STOP=1",
                  "-c", journal_sql], env=journal_environment, stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=20, check=True)
              if len(observed.stdout) > 131072:
                  raise ValueError("ingest observation output bound exceeded")
              observation = {"status": "observed", "scope": "Global operational journal and same-database clients; no process ownership or recorded-game attribution.",
                             "value": json.loads(observed.stdout)}
          except (OSError, ValueError, subprocess.SubprocessError) as error:
              observation = {"status": "unavailable", "errorType": type(error).__name__}
          (observation_root / "ingest-observation.json").write_text(json.dumps(observation, sort_keys=True) + "\n")
          print("CORPUS_INGEST_OBSERVATION " + json.dumps(observation, sort_keys=True), flush=True)
          PY
          phase authentic-corpus-recording python3 scripts/chess-runtime-env.py --prefix "$LAPLACE_INSTALL_PREFIX" -- \
            python3 scripts/measure-installed-chess-corpus.py --mode measure --expected-source "$TARGET_SHA" \
            --output-dir "$NATIVE_EVIDENCE/corpus" --family otb-2025 --games 2000 --deadline-seconds 3600 \
            --pgn /vault/Data/Games/Chess/Lumbras/otb/LumbrasGigaBase_OTB_2025.pgn
          NATIVE
      - name: Observe fixed public managed service state
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,os
          rows=[]
          for service in ("mcp","lichess"):
              try:
                  p=subprocess.run(["sudo","-n","/usr/local/libexec/laplace-service-control",service,"status"],
                      stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=15)
                  row={"service":service,"exitCode":p.returncode,"stderrBytes":len(p.stderr.encode())}
                  if p.returncode==0:
                      value=json.loads(p.stdout)
                      row["status"]={key:value[key] for key in ("unit","load","active","sub","main_pid","enabled","operator_stopped") if key in value}
                  rows.append(row)
              except (OSError,ValueError,subprocess.TimeoutExpired) as exc:rows.append({"service":service,"errorType":type(exc).__name__})
          for unit in ("laplace-api.service","laplace-mcp.service","laplace-lichess.service"):
              try:
                  p=subprocess.run(["systemctl","show",unit,"--property=Id,LoadState,ActiveState,SubState,UnitFileState,MainPID,User,Group,FragmentPath"],
                      stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=10)
                  rows.append({"unit":unit,"exitCode":p.returncode,"properties":dict(line.split("=",1) for line in p.stdout.splitlines() if "=" in line)})
              except (OSError,ValueError,subprocess.TimeoutExpired) as exc:rows.append({"unit":unit,"errorType":type(exc).__name__})
          root=pathlib.Path(os.environ["NATIVE_EVIDENCE"]); (root/"service-status.json").write_text(json.dumps(rows,indent=2)+"\n")
          print(json.dumps(rows),flush=True)
          PY
          set +e
          export ROOT="$GITHUB_WORKSPACE"
          export EVIDENCE="$NATIVE_EVIDENCE"
          export TMPDIR="$NATIVE_EVIDENCE/tmp" TMP="$NATIVE_EVIDENCE/tmp" TEMP="$NATIVE_EVIDENCE/tmp"
          mkdir -p "$TMPDIR"
          timeout --signal=TERM --kill-after=10s 600s bash -s <<'MANAGED_READINESS'
          # Observe the existing services after the owned native/recording operation.
          # ROOT/EVIDENCE are exact retained paths; no service start/restart/setup occurs.
          python3 - "$ROOT" "$EVIDENCE" <<'PY'
          import importlib.util, json, pathlib, sys, time, urllib.error
          root, output = map(pathlib.Path, sys.argv[1:])
          spec = importlib.util.spec_from_file_location("service_acceptance", root / "scripts/accept-chess-environment.py")
          owner = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = owner
          spec.loader.exec_module(owner)
          output = output / "managed-readiness"
          output.mkdir(parents=True, exist_ok=False)
          proof = {"scope": "Existing managed services; current readiness/protocol observation",
                   "coldBootMeasured": False, "startedUtc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                   "status": "failed", "observations": {}}
          owner.save(output / "managed-readiness.json", proof)
          try:
              proof["bootId"] = owner.boot_id()
              proof["unitsBefore"] = owner.unit_states()
              controls = {}
              for service in ("mcp", "lichess"):
                  log = output / (service + "-control-before.json")
                  owner.command(["sudo", "-n", "--", "/usr/local/libexec/laplace-service-control",
                                 service, "status"], log, 20)
                  controls[service] = json.loads(log.read_text())
              proof["controlsBefore"] = controls
              for name, port, route in (
                      ("mcpLive", 5188, "/health/live"), ("mcpReady", 5188, "/health/ready"),
                      ("lichessLive", 5189, "/health/live"), ("lichessReady", 5189, "/health/ready"),
                      ("lichessStatus", 5189, "/status")):
                  try:
                      raw, transport = owner.response("http://127.0.0.1:" + str(port), route, 65536)
                      value = json.loads(raw)
                      projection = (owner.lichess_status(value) if name == "lichessStatus" else
                                    {key: value[key] for key in ("service", "live", "ready", "connected")
                                     if key in value and isinstance(value[key], (str, bool))})
                      proof["observations"][name] = {"http": transport, "value": projection}
                  except Exception as error:
                      proof["observations"][name] = {"errorType": type(error).__name__,
                          "httpStatus": error.code if isinstance(error, urllib.error.HTTPError) else None}
                  owner.save(output / "managed-readiness.json", proof)
              # The installed constrained owner reads its own bearer privately and closes
              # the temporary MCP protocol session. It does not refresh host policy.
              try:
                  owner.command(["sudo", "-n", "--", "/usr/local/libexec/laplace-managed-deploy", "verify"],
                                output / "installed-managed-verify.log", 240)
                  proof["installedManagedVerifier"] = {"exitCode": 0}
              except Exception as error:
                  proof["installedManagedVerifier"] = {"errorType": type(error).__name__}
              controls = {}
              for service in ("mcp", "lichess"):
                  log = output / (service + "-control-after.json")
                  owner.command(["sudo", "-n", "--", "/usr/local/libexec/laplace-service-control",
                                 service, "status"], log, 20)
                  controls[service] = json.loads(log.read_text())
              proof["controlsAfter"] = controls
              try:
                  raw, transport = owner.response("http://127.0.0.1:5189", "/status", 65536)
                  proof["observations"]["lichessStatusAfter"] = {
                      "http": transport, "value": owner.lichess_status(json.loads(raw))}
              except Exception as error:
                  proof["observations"]["lichessStatusAfter"] = {"errorType": type(error).__name__,
                      "httpStatus": error.code if isinstance(error, urllib.error.HTTPError) else None}
              proof["unitsAfter"] = owner.unit_states()
              proof["sameBoot"] = proof["bootId"] == owner.boot_id()
              proof["sameServiceInstances"] = proof["unitsBefore"] == proof["unitsAfter"]
              proof["servicesRunning"] = all(
                  row.get("pid", 0) > 0 and row.get("activeState") == "active"
                  and row.get("subState") == "running" for row in proof["unitsAfter"].values())
              proof["operatorStopsAbsent"] = all(
                  row.get("operator_stopped") is False
                  for group in (proof["controlsBefore"], proof["controlsAfter"]) for row in group.values())
              observed = proof["observations"]
              proof["mcpReady"] = observed.get("mcpReady", {}).get("value", {}).get("ready") is True
              proof["lichessAccountStreamReady"] = observed.get("lichessStatusAfter", {}).get("value", {}).get("ready") is True
              if (proof["sameBoot"] and proof["sameServiceInstances"] and proof["servicesRunning"] and proof["operatorStopsAbsent"]
                      and proof["mcpReady"] and proof["lichessAccountStreamReady"]
                      and proof["installedManagedVerifier"].get("exitCode") == 0):
                  proof["status"] = "passed"
          except Exception as error:
              proof["errorType"] = type(error).__name__
          finally:
              proof["finishedUtc"] = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              owner.save(output / "managed-readiness.json", proof)
              print(json.dumps(proof, sort_keys=True))
          raise SystemExit(0 if proof["status"] == "passed" else 1)
          PY
          MANAGED_READINESS
          readiness_rc="$?"
          READINESS_RC="$readiness_rc" python3 - <<'PY'
          import json, os, pathlib
          result={"scope":"Read-only installed managed-service readiness observation",
                  "exitCode":int(os.environ["READINESS_RC"]),
                  "status":"passed" if os.environ["READINESS_RC"]=="0" else "failed_or_unavailable",
                  "applicationPublication":"not_attempted"}
          pathlib.Path(os.environ["NATIVE_EVIDENCE"],"managed-readiness-outcome.json").write_text(json.dumps(result,sort_keys=True)+"\n")
          print("MANAGED_READINESS_OUTCOME "+json.dumps(result,sort_keys=True))
          PY
          # Keep this observation independent of native installation and recording.
          exit 0
      - name: Retain native operator outcome
        if: always()
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["NATIVE_EVIDENCE"])
          result={"workflowOutcome":os.environ["NATIVE_OUTCOME"],"source":os.environ["TARGET_SHA"],
                  "applicationPublication":"not_attempted","fullLifecyclePassed":False}
          (root/"workflow-outcome.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result))
          PY
      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-native-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.NATIVE_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 30
