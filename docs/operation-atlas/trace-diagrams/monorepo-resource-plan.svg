<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:497px;height:970px;background:#FAFCFF;" width="497px" height="970px" viewBox="0 0 497 970" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="497" height="970" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="5"><text x="62.809" y="34.533" fill="#000" font-size="14" textLength="369.927" font-weight="700">Monorepo — PostgreSQL resource ownership equation</text></g><ellipse cx="246.772" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="16" y="93.609" width="461.545" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="116.066" fill="#000" font-size="12" textLength="441.545">Read physical RAM, performance cores, logical processors and maintenance width</text><rect x="89.195" y="148.703" width="315.154" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="99.195" y="171.16" fill="#000" font-size="12" textLength="295.154">Require RAM > 0; floor core/maintenance widths at one</text><rect x="79.372" y="203.797" width="334.801" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="89.372" y="226.254" fill="#000" font-size="12" textLength="314.801">p = performance cores; logical = max(p, logical processors)</text><rect x="48.505" y="258.891" width="396.535" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="58.505" y="281.348" fill="#000" font-size="12" textLength="376.535">Ingest owners = control 1 + COPY p + fold p + slack 2 + observability 3</text><rect x="56.005" y="313.984" width="381.535" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="66.005" y="336.441" fill="#000" font-size="12" textLength="361.535">Serving owners = logical; maintenance owners = maintenance width</text><rect x="53.84" y="369.078" width="385.865" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="63.84" y="391.535" fill="#000" font-size="12" textLength="365.865">Reserve one operator connection; max connections = sum of owners</text><rect x="126.065" y="424.172" width="241.414" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="136.065" y="446.629" fill="#000" font-size="12" textLength="221.414">Parallel workers = p; I/O workers = logical</text><rect x="47.521" y="479.266" width="398.504" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="57.521" y="501.723" fill="#000" font-size="12" textLength="378.504">Worker processes = parallel + I/O; autovacuum workers = maintenance</text><rect x="59.351" y="534.359" width="374.844" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="69.351" y="556.816" fill="#000" font-size="12" textLength="354.844">Divide RAM into shared/backend/client quarters and OS remainder</text><rect x="43.826" y="589.453" width="405.893" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="53.826" y="611.91" fill="#000" font-size="12" textLength="385.893">Backend population = max connections + parallel + autovacuum workers</text><rect x="85.853" y="644.547" width="321.84" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="95.853" y="667.004" fill="#000" font-size="12" textLength="301.84">Per-backend share = max(1, backend bytes / population)</text><rect x="58.375" y="699.641" width="376.795" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="68.375" y="722.098" fill="#000" font-size="12" textLength="356.795">Work memory = max(1, per-backend / 2); temp buffers = remainder</text><rect x="73.524" y="754.734" width="346.496" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="83.524" y="777.191" fill="#000" font-size="12" textLength="326.496">Maintenance/autovacuum work memory = per-backend share</text><rect x="151.398" y="809.828" width="190.748" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="161.398" y="832.285" fill="#000" font-size="12" textLength="170.748">Return immutable resource plan</text><ellipse cx="246.772" cy="875.922" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="246.772" cy="875.922" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="246.772" y1="73.609" x2="246.772" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="242.772,83.609,246.772,93.609,250.772,83.609,246.772,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="246.772" y1="128.703" x2="246.772" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="242.772,138.703,246.772,148.703,250.772,138.703,246.772,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="246.772" y1="183.797" x2="246.772" y2="203.797" style="stroke:#181818;stroke-width:1;"/><polygon points="242.772,193.797,246.772,203.797,250.772,193.797,246.772,197.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="246.772" y1="238.891" x2="246.772" y2="258.891" style="stroke:#181818;stroke-width:1;"/><polygon points="242.772,248.891,246.772,258.891,250.772,248.891,246.772,252.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="246.772" y1="293.984" x2="246.772" y2="313.984" style="stroke:#181818;stroke-width:1;"/><polygon points="242.772,303.984,246.772,313.984,250.772,303.984,246.772,307.984" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="246.772" y1="349.078" x2="246.772" y2="369.078" style="stroke:#181818;stroke-width:1;"/><polygon points="242.772,359.078,246.772,369.078,250.772,359.078,246.772,363.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="246.772" y1="404.172" x2="246.772" y2="424.172" style="stroke:#181818;stroke-width:1;"/><polygon points="242.772,414.172,246.772,424.172,250.772,414.172,246.772,418.172" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="246.772" y1="459.266" x2="246.772" y2="479.266" style="stroke:#181818;stroke-width:1;"/><polygon points="242.772,469.266,246.772,479.266,250.772,469.266,246.772,473.266" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="246.772" y1="514.359" x2="246.772" y2="534.359" style="stroke:#181818;stroke-width:1;"/><polygon points="242.772,524.359,246.772,534.359,250.772,524.359,246.772,528.359" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="246.772" y1="569.453" x2="246.772" y2="589.453" style="stroke:#181818;stroke-width:1;"/><polygon points="242.772,579.453,246.772,589.453,250.772,579.453,246.772,583.453" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="246.772" y1="624.547" x2="246.772" y2="644.547" style="stroke:#181818;stroke-width:1;"/><polygon points="242.772,634.547,246.772,644.547,250.772,634.547,246.772,638.547" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="246.772" y1="679.641" x2="246.772" y2="699.641" style="stroke:#181818;stroke-width:1;"/><polygon points="242.772,689.641,246.772,699.641,250.772,689.641,246.772,693.641" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="246.772" y1="734.734" x2="246.772" y2="754.734" style="stroke:#181818;stroke-width:1;"/><polygon points="242.772,744.734,246.772,754.734,250.772,744.734,246.772,748.734" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="246.772" y1="789.828" x2="246.772" y2="809.828" style="stroke:#181818;stroke-width:1;"/><polygon points="242.772,799.828,246.772,809.828,250.772,799.828,246.772,803.828" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="246.772" y1="844.922" x2="246.772" y2="864.922" style="stroke:#181818;stroke-width:1;"/><polygon points="242.772,854.922,246.772,864.922,250.772,854.922,246.772,858.922" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="22"><text x="54.896" y="906.303" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="53.231" y="918.881" fill="#888" font-size="10" textLength="389.082">claimed. Complete resource-equation source reviewed. It returns configuration values; it</text><text x="55.724" y="931.459" fill="#888" font-size="10" textLength="384.097">does not reserve memory or enforce every executor allocation. Topology detection and</text><text x="52.943" y="944.037" fill="#888" font-size="10" textLength="389.658">settings application remain nested. Effective cache size is shared plus OS cache, not an</text><text x="82.118" y="956.615" fill="#888" font-size="10" textLength="331.309">extra allocation. The equation alone does not prove a hard memory ceiling.</text></g><?plantuml-src RLJRRjiu47tNLmpGXssGn8glkHXT8ElMs01DauqNMFIH9aSs4Oh3afGTxzD