# The monorepo site (laplace-api.service over the database laplace-mono) on :8080, installed by site-host.sh as
# /etc/nginx/sites-available/laplace. Port 80 is the machine's own sites; 5187 is the API on loopback only.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 256m;

    location / {
        proxy_pass http://127.0.0.1:5187;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # streamed completions and the UI's live feed: no buffering, long reads
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    access_log /var/log/nginx/laplace-access.log;
    error_log  /var/log/nginx/laplace-error.log;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
