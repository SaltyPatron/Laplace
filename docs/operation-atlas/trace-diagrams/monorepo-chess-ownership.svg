 operation; require exact requester equality</text><rect x="153.828" y="292.891" width="265.467" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="163.828" y="315.348" fill="#000" font-size="12" textLength="245.467">Completed finish returns its retained operation</text><rect x="144.157" y="347.984" width="284.809" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="154.157" y="370.441" fill="#000" font-size="12" textLength="264.809">Require ongoing, or finish with retryable recording</text><rect x="113.478" y="403.078" width="346.168" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="123.478" y="425.535" fill="#000" font-size="12" textLength="326.168">Get live runtime and session; require exact requester equality</text><rect x="220.862" y="458.172" width="131.398" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="230.862" y="480.629" fill="#000" font-size="12" textLength="111.398">Acquire session gate</text><rect x="92.123" y="513.266" width="388.877" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="102.123" y="535.723" fill="#000" font-size="12" textLength="368.877">Reread retained operation; recheck completed/ongoing/retry eligibility</text><rect x="141.503" y="568.359" width="290.117" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="151.503" y="590.816" fill="#000" font-size="12" textLength="270.117">Recheck same live session instance still registered</text><polygon points="140.736,623.453,432.387,623.453,444.387,635.453,432.387,647.453,140.736,647.453,128.736,635.453,140.736,623.453" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="140.736" y="639.954" fill="#000" font-size="11" textLength="291.65