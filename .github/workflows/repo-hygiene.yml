name: Repository branch consolidation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  branches:
    name: Preserve heads and prune merged branches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: repository-branch-consolidation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Preserve every head and remove only branches already merged to main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/consolidate-branches.sh
