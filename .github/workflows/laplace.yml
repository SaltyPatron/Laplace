name: Laplace — product lifecycle

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "product lifecycle stage"
        type: choice
        required: true
        default: all
        options: [check, build, test, deploy, integrate, all, application-check, applications]
      full_clean:
        description: "wipe build/ before building"
        type: boolean
        default: false
      force_codegen:
        description: "ignore attestation-law stamp"
        type: boolean
        default: false
      fresh_db:
        description: "recreate DB structure/runtime; does not seed by itself"
        type: boolean
        default: false
      restore_foundation:
        description: "after database work, restore missing canonical foundation (can take hours)"
        type: boolean
        default: false
      serial_tests:
        description: "force serial ctest/regress"
        type: boolean
        default: false
      force_all:
        description: "ignore content-fingerprint stamps"
        type: boolean
        default: false
      generation_benchmark:
        description: "run the expensive generation benchmark"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: laplace-substrate-lifecycle
  cancel-in-progress: false

env:
  LAPLACE_EXTERNAL: ${{ vars.LAPLACE_EXTERNAL || '/build/external' }}
  LAPLACE_INSTALL_PREFIX: ${{ vars.LAPLACE_INSTALL_PREFIX || '/opt/laplace' }}
  LAPLACE_PG_PREFIX: ${{ vars.LAPLACE_PG_PREFIX || '/opt/laplace/pgsql-18' }}
  PGHOST: /var/run/postgresql
  PGPORT: 5432
  PGUSER: laplace_admin
  PGDATABASE: laplace
  LAPLACE_DATA_ROOT: /vault/Data
  LAPLACE_FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all && '1' || '' }}
  LAPLACE_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'all' }}
  LAPLACE_FULL_CLEAN: ${{ github.event_name == 'workflow_dispatch' && inputs.full_clean && '1' || '' }}
  LAPLACE_FORCE_CODEGEN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_codegen && '1' || '' }}
  LAPLACE_FRESH_DB: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh_db && '1' || '' }}
  LAPLACE_RESTORE_FOUNDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_foundation && '1' || '' }}
  LAPLACE_TEST_SERIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.serial_tests && '1' || '' }}
  LAPLACE_GENERATION_BENCHMARK: ${{ github.event_name == 'workflow_dispatch' && inputs.generation_benchmark && '1' || '' }}
  LICHESS_API: ${{ secrets.LICHESS_API }}
  LAPLACE_MCP_TOKEN: ${{ secrets.LAPLACE_MCP_TOKEN }}
  LAPLACE_OPERATOR_TOKEN: ${{ secrets.LAPLACE_OPERATOR_TOKEN }}
  STRIPE_API_SECRET: ${{ secrets.STRIPE_API_SECRET }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
  STRIPE_API_Publishable: ${{ vars.STRIPE_API_PUBLISHABLE }}

jobs:
  product:
    name: Product — prove, activate and verify
    runs-on: [self-hosted, laplace]
    timeout-minutes: 420
    # This job releases the workspace before the dependent reusable benchmark
    # acquires it. The workflow-level lifecycle lock remains a different group.
    concurrency:
      group: laplace-shared-workspace
      cancel-in-progress: false
    outputs:
      chess_benchmark_ready: ${{ steps.chess_benchmark_gate.outputs.ready }}
      activated_ref: ${{ steps.chess_benchmark_gate.outputs.source_sha }}
    steps:
      - name: Checkout exact revision without discarding persistent build cache
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --prune --depth=2 origin "$TARGET_SHA"
          git checkout --force "$TARGET_SHA"

      - uses: ./.github/actions/setup-laplace-env

      - name: Classify source-only change
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fast=1
          verify_recursive=0
          # These documents and data files are executable-generation inputs.
          # Resolve the exact project inventory before the broad docs allowance;
          # failure must not masquerade as an empty selection and a fast release.
          operational_paths="$(python3 scripts/verify-operational-seed.py --list-source-paths)"
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            fast=0
          else
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA" || true
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              if [[ $'\n'"$operational_paths"$'\n' == *$'\n'"$path"$'\n'* ]]; then
                fast=0
                continue
              fi
              case "$path" in
                scripts/product-ci.sh|scripts/pr-proof.sh|scripts/pr-db-proof.sh|scripts/ci-session.py|scripts/test-profile-registry.py)
                  fast=0
                  ;;
                scripts/prove-*|scripts/test-live-recursive-proof-gate.py)
                  verify_recursive=1
                  ;;
                docs/*|.github/*|scripts/test-*|scripts/check-*|scripts/ci-*|scripts/actions-audit.py|scripts/test-profiles.json|scripts/benchmark-profiles.json|scripts/product-ci.sh)
                  ;;
                *)
                  fast=0
                  ;;
              esac
            done < <(git diff --name-only "$BEFORE_SHA" "$TARGET_SHA")
          fi
          echo "LAPLACE_FAST_ONLY=$fast" >> "$GITHUB_ENV"
          echo "LAPLACE_VERIFY_RECURSIVE_PROOF=$verify_recursive" >> "$GITHUB_ENV"
          echo "change classification: fast_only=$fast verify_recursive=$verify_recursive"

      - name: Fast source/tooling proof and installed-product reconciliation
        if: env.LAPLACE_FAST_ONLY == '1'
        run: |
          set -euo pipefail
          umask 0002
          mkdir -p /build/laplace/work
          # Both repositories deploy on this host; GitHub concurrency is scoped
          # to one repository. Do not pass the lock descriptor to service children.
          flock --exclusive --close /build/laplace/work/host-resource.lock \
            bash scripts/product-ci.sh reconcile

      - name: Verify changed recursive proof against the live product
        if: env.LAPLACE_FAST_ONLY == '1' && env.LAPLACE_VERIFY_RECURSIVE_PROOF == '1'
        run: |
          set -euo pipefail
          umask 0002
          mkdir -p /build/laplace/work
          flock --exclusive --close /build/laplace/work/host-resource.lock \
            python3 scripts/prove-live-recursive-substrate.py "${PGDATABASE:-laplace}"

      - name: Reserve host for product phases
        id: product_session
        if: env.LAPLACE_FAST_ONLY != '1'
        env:
          LAPLACE_OPERATIONAL_PROOF_DIRECTORY: /build/laplace/work/operational-proof/${{ github.run_id }}-${{ github.run_attempt }}
          LAPLACE_NATIVE_REGRESSION_EVIDENCE_DIRECTORY: /build/laplace/work/native-regression-evidence/${{ github.run_id }}-${{ github.run_attempt }}-product
        run: |
          set -euo pipefail
          umask 0002
          export TMPDIR=/build/laplace/work TMP=/build/laplace/work TEMP=/build/laplace/work
          mkdir -p /build/laplace/work
          directory="/build/laplace/work/ci-sessions/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-product"
          mkdir -p "$(dirname "$directory")"
          echo "LAPLACE_PHASE_CHECKOUT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "LAPLACE_CI_SESSION_DIRECTORY=$directory" >> "$GITHUB_ENV"
          python3 scripts/ci-session.py start --directory "$directory" \
            --lock /build/laplace/work/host-resource.lock --checkout "$GITHUB_WORKSPACE" \
            --kind product --stage "$LAPLACE_STAGE"

      - name: Retain native regression baseline before build
        continue-on-error: true
        id: product_native_baseline
        if: env.LAPLACE_FAST_ONLY != '1'
        run: |
          python3 scripts/capture-native-regression.py --repo-root "$GITHUB_WORKSPACE" \
            --build-root "$(readlink -f build)" \
            --output-dir "/build/laplace/work/native-regression-evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-product/baseline" \
            --label retained-baseline --print-diffs

      - name: Upload retained native baseline before build
        continue-on-error: true
        if: always() && steps.product_native_baseline.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-native-baseline-${{ github.run_id }}-${{ github.run_attempt }}-product
          path: /build/laplace/work/native-regression-evidence/${{ github.run_id }}-${{ github.run_attempt }}-product/baseline/
          if-no-files-found: warn
          retention-days: 30

      - name: Check source and policy
        id: product_policy
        if: contains(env.LAPLACE_CI_PHASES, '|policy|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase policy

      - name: Resolve build dependencies
        id: product_dependencies
        if: contains(env.LAPLACE_CI_PHASES, '|dependencies|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase dependencies

      - name: Build native and managed artifacts
        id: product_build
        if: contains(env.LAPLACE_CI_PHASES, '|build|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase build

      - name: Test native engine
        id: product_native_dev
        if: contains(env.LAPLACE_CI_PHASES, '|native-dev|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase native-dev

      - name: Test managed code
        id: product_managed_dev
        if: contains(env.LAPLACE_CI_PHASES, '|managed-dev|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase managed-dev

      - name: Test UCI runtime
        id: product_uci_dev
        if: contains(env.LAPLACE_CI_PHASES, '|uci-dev|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase uci-dev

      - name: Test browser product
        id: product_browser_dev
        if: contains(env.LAPLACE_CI_PHASES, '|browser-dev|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase browser-dev

      - name: Check application release
        id: product_application_check
        if: contains(env.LAPLACE_CI_PHASES, '|application-check|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase application-check

      - name: Install native artifacts
        id: product_native_install
        if: contains(env.LAPLACE_CI_PHASES, '|native-install|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase native-install

      - name: Migrate and reconcile installed database
        id: product_database_maintenance
        if: contains(env.LAPLACE_CI_PHASES, '|database-maintenance|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase database-maintenance

      - name: Restore requested foundation
        id: product_foundation
        if: contains(env.LAPLACE_CI_PHASES, '|foundation|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase foundation

      - name: Admit operational memory
        id: product_operational_seed
        if: contains(env.LAPLACE_CI_PHASES, '|operational-seed|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase operational-seed

      - name: Publish applications
        id: product_publish
        if: contains(env.LAPLACE_CI_PHASES, '|publish|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase publish

      - name: Verify ordinary operational execution
        id: product_operational_execution
        if: contains(env.LAPLACE_CI_PHASES, '|operational-execution|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase operational-execution

      - name: Verify database health
        id: product_db_health
        if: contains(env.LAPLACE_CI_PHASES, '|db-health|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase db-health

      - name: Test native PostgreSQL extensions
        id: product_native_db
        if: contains(env.LAPLACE_CI_PHASES, '|native-db|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase native-db

      - name: Test managed database integration
        id: product_managed_db
        if: contains(env.LAPLACE_CI_PHASES, '|managed-db|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase managed-db

      - name: Prove live recursive substrate
        id: product_live_floor
        if: contains(env.LAPLACE_CI_PHASES, '|live-floor|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase live-floor

      - name: Verify live API endpoints
        id: product_live_api
        if: contains(env.LAPLACE_CI_PHASES, '|live-api|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase live-api

      - name: Test live product behavior
        id: product_managed_live
        if: contains(env.LAPLACE_CI_PHASES, '|managed-live|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase managed-live

      - name: Evaluate witnessed generation
        id: product_generation_eval
        if: contains(env.LAPLACE_CI_PHASES, '|generation-eval|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase generation-eval

      - name: Measure requested generation performance
        id: product_performance
        if: contains(env.LAPLACE_CI_PHASES, '|performance|')
        run: python3 "${LAPLACE_PHASE_CHECKOUT}/scripts/ci-session.py" run --directory "$LAPLACE_CI_SESSION_DIRECTORY" --phase performance

      - name: Release product host reservation
        if: always() && steps.product_session.outcome == 'success'
        run: python3 scripts/ci-session.py stop --directory "$LAPLACE_CI_SESSION_DIRECTORY"

      - name: Upload lifecycle phase results
        if: always() && steps.product_session.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-phases-${{ github.run_id }}-${{ github.run_attempt }}-product
          path: |
            ${{ env.LAPLACE_CI_SESSION_DIRECTORY }}/session.json
            ${{ env.LAPLACE_CI_SESSION_DIRECTORY }}/supervisor.log
          if-no-files-found: warn
          retention-days: 30

      - name: Retain native regression results
        if: always()
        run: |
          python3 scripts/capture-native-regression.py --repo-root "$GITHUB_WORKSPACE" \
            --build-root "$(readlink -f build)" \
            --output-dir "/build/laplace/work/native-regression-evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-product/current" \
            --label current --print-diffs

      - name: Upload native regression diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-native-regression-${{ github.run_id }}-${{ github.run_attempt }}-product
          path: /build/laplace/work/native-regression-evidence/${{ github.run_id }}-${{ github.run_attempt }}-product/
          if-no-files-found: error
          retention-days: 30

      - name: Admit official Stockfish source and verify native corpus readback
        if: env.LAPLACE_FAST_ONLY != '1' && (env.LAPLACE_STAGE == 'all' || env.LAPLACE_STAGE == 'applications')
        shell: bash
        run: |
          set -euo pipefail
          umask 0002
          mkdir -p /build/laplace/work
          # The common CLI acquires the canonical ingest lane; the shared host
          # lock also prevents source rebuilds during the two exact observations.
          flock --exclusive --close /build/laplace/work/host-resource.lock bash -euo pipefail -c '
            export TMPDIR=/build/laplace/work TMP=/build/laplace/work TEMP=/build/laplace/work
            dotnet build app/Laplace.Cli/Laplace.Cli.csproj -c Release --nologo -v minimal
            python3 scripts/ingest-stockfish-corpus.py \
              --prefix "$LAPLACE_INSTALL_PREFIX" \
              --output "/build/laplace/work/stockfish-corpus-evidence/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          '

      - name: Retain official Stockfish corpus admission evidence
        if: always() && env.LAPLACE_FAST_ONLY != '1' && (env.LAPLACE_STAGE == 'all' || env.LAPLACE_STAGE == 'applications')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-stockfish-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /build/laplace/work/stockfish-corpus-evidence/${{ github.run_id }}-${{ github.run_attempt }}/
            !/build/laplace/work/stockfish-corpus-evidence/${{ github.run_id }}-${{ github.run_attempt }}/selection.private.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify ordinary operational execution after Stockfish admission
        if: success() && env.LAPLACE_FAST_ONLY != '1' && env.LAPLACE_STAGE == 'all'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          umask 0002
          if [[ "${LAPLACE_FRESH_DB:-}" == 1 && "${LAPLACE_RESTORE_FOUNDATION:-}" != 1 ]]; then
            echo "fresh DB intentionally left unseeded — post-Stockfish operational proof skipped"
            exit 0
          fi
          mkdir -p /build/laplace/work
          # Reuse this publication's exact seed. Source admission must not
          # displace either ordinary request; no new seed or execution hints.
          flock --exclusive --close /build/laplace/work/host-resource.lock bash -euo pipefail <<'BASH'
          proof_root="/build/laplace/work/operational-proof/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          seed_record="$(python3 - "$proof_root" <<'PY'
          import itertools
          import json
          import sys
          import uuid
          from pathlib import Path
          receipts = list(itertools.islice(Path(sys.argv[1]).glob("invocation-*/seed.json"), 2))
          if len(receipts) != 1:
              raise SystemExit("post-Stockfish proof requires exactly one seed receipt for this run and attempt")
          receipt = receipts[0]
          if receipt.stat().st_size > 1048576:
              raise SystemExit("seed receipt exceeds the 1 MiB metadata envelope")
          report = json.loads(receipt.read_text(encoding="utf-8"))
          if report.get("disposition") != "verified":
              raise SystemExit("post-Stockfish seed receipt is not a verified invocation")
          run_id = report["run"]["run_id"]
          if not isinstance(run_id, str) or str(uuid.UUID(run_id)) != run_id:
              raise SystemExit("post-Stockfish seed receipt has an invalid run identity")
          print(receipt.parent)
          print(run_id)
          PY
          )"
          mapfile -t seed_fields <<< "$seed_record"
          proof_directory="${seed_fields[0]}"
          seed_run_id="${seed_fields[1]}"
          python3 scripts/verify-operational-task.py \
            --shape-file seeds/operational/tasks/en_define.json --seed-run-id "$seed_run_id" \
            --receipt "$proof_directory/post-stockfish-task.json"
          python3 scripts/verify-operational-task.py \
            --proof-mode direct-relation --prompt 'The opposite of hot is' --operand hot \
            --shape-file seeds/operational/tasks/en_antonym.json \
            --exemplar-file seeds/operational/exemplars/en_antonym.conllu --seed-run-id "$seed_run_id" \
            --receipt "$proof_directory/post-stockfish-antonym-task.json"
          BASH

      - name: Upload operational seed and execution receipts
        if: always() && steps.product_session.outcome != 'skipped' && env.LAPLACE_STAGE == 'all'
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-operational-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: /build/laplace/work/operational-proof/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Record successful activation for installed chess measurement
        id: chess_benchmark_gate
        if: env.LAPLACE_FAST_ONLY != '1' && (env.LAPLACE_STAGE == 'all' || env.LAPLACE_STAGE == 'applications')
        shell: bash
        run: |
          set -euo pipefail
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Retain bounded live recursive proof counterexamples
        if: always()
        env:
          TARGET_SHA: ${{ github.sha }}
          PROOF_OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          evidence="/build/laplace/work/recursive-proof-evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-product"
          args=(
            --checkout "$GITHUB_WORKSPACE"
            --output "$evidence"
            --expected-source "$TARGET_SHA"
            --proof-outcome "$PROOF_OUTCOME"
          )
          if [[ -n "${LAPLACE_BUILD_DIRECTORY:-}" ]]; then
            args+=(--build-directory "$LAPLACE_BUILD_DIRECTORY")
          fi
          python3 scripts/collect-recursive-proof-evidence.py "${args[@]}"
          flock --exclusive --close /build/laplace/work/host-resource.lock \
            python3 scripts/inspect-recursive-proof-counterexamples.py \
              --collection "$evidence" --expected-source "$TARGET_SHA"

      - name: Upload retained live recursive proof diagnostics
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-recursive-proof-${{ github.run_id }}-${{ github.run_attempt }}-product
          path: /build/laplace/work/recursive-proof-evidence/${{ github.run_id }}-${{ github.run_attempt }}-product/
          if-no-files-found: error
          retention-days: 30

  chess_environment:
    name: Activated host — chess capabilities and performance
    needs: product
    if: needs.product.result == 'success' && needs.product.outputs.chess_benchmark_ready == 'true'
    uses: ./.github/workflows/benchmark-evidence.yml
    with:
      target_ref: ${{ needs.product.outputs.activated_ref }}
      suite: chess
      repeats: "3"
      reserve_logical_cpus: "2"
      allow_saturation: false
