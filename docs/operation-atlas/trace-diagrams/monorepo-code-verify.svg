ite configured compiler/syntax-check invocation</text><rect x="460.983" y="286.715" width="168.764" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="470.983" y="309.172" fill="#000" font-size="12" textLength="148.764">Return unavailable, exit 127</text><ellipse cx="545.365" cy="360.762" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="545.365" cy="360.762" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="490.032,237.797,600.698,237.797,612.698,249.797,600.698,261.797,490.032,261.797,478.032,249.797,490.032,237.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="549.365" y="273.216" fill="#000" font-size="11" textLength="17.118">yes</text><text x="490.032" y="254.298" fill="#000" font-size="11" textLength="110.666">No configured verifier?</text><rect x="380.956" y="413.762" width="328.818" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="390.956" y="436.219" fill="#000" font-size="12" textLength="308.818">Create unique temporary directory; write candidate source</text><rect x="383.27" y="468.855" width="324.189" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="393.27" y="491.313" fill="#000" font-size="12" textLength="304.189">When needed write bootstrap project and run preparation</text><polygon points="425.82,523.949,664.909,523.949,676.909,535.949,664.909,547.949,425.82,547.949,413.82,535.949,425.82,523.949" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="425.82" y="540.45" fill="#000" font-size="11" textLength="239.089">Bootstrap unavailable, timed out or nonzero exit?</text><text x="396.703" y="533.532" fill="#000" font-size="11" textLength="17.118">yes</text><text x="676.909" y="533.532" fill="#000" font-size="11" textLength="27.516">ready</text><rect x="313.441" y="557.949" width="180.758" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="323.441" y="580.406" fill="#000" font-size="12" textLength="160.758">Return failed bootstrap receipt</text><rect x="617.548" y="557.949" width="138.723" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="627.548" y="580.406" fill="#000" font-size="12" textLength="118.723">Run verifier invocation</text><polygon points="545.365,599.043,557.365,611.043,545.365,623.043,533.365,611.043,545.365,599.043" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="332.619" y="643.043" width="425.492" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="342.619" y="665.5" fill="#000" font-size="12" textLength="405.492">Finally attempt recursive temporary-directory cleanup; swallow cleanup error</text><polygon points="347.543,684.137,359.543,696.137,347.543,708.137,335.543,696.137,347.543,684.137" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="186.977" y="728.137" width="321.131" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="196.977" y="750.594" fill="#000" font-size="12" textLength="301.131">Verified = tool available AND Tree-sitter syntax complete</text><text x="196.977" y="765.688" fill="#000" font-size="12" textLength="191.414">AND no timeout AND exit code zero</text><rect x="160.783" y="798.324" width="373.52" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="170.783" y="820.781" fill="#000" font-size="12" textLength="353.52">Include AST diagnostics; normalize and truncate diagnostic strings</text><rect x="225.479" y="853.418" width="244.127" height="35.094" fill="#F1F1F1" style="stroke:#1818