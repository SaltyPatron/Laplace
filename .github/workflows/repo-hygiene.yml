name: Repository hygiene
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tracked-tree:
    name: Tracked tree contains no local/runtime artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - run: python3 scripts/repo-hygiene-gate.py
  integrated-branches:
    name: Materialize reviewed source consolidation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: repository-branch-consolidation
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Materialize the byte-exact reviewed source tree without moving main
        shell: bash
        run: |
          python3 - <<'PYTREE'
          import hashlib, json, os, pathlib, subprocess, tempfile
          def git(*args, data=None, env=None):
              result = subprocess.run(['git', *args], input=data, text=True, capture_output=True, timeout=180, env=env)
              if result.returncode:
                  raise RuntimeError(f'{args[0]} failed: {result.stderr[-3000:]}')
              return result.stdout.strip()
          git('fetch', 'origin', '+refs/heads/*:refs/remotes/origin/*', '+refs/pull/*/head:refs/recovery/pulls/*')
          previous = git('show', '79de57897d10d7f5c6da5c829bc624b2cf326091:.github/workflows/repo-hygiene.yml')
          # Parse immutable data only; never execute previous workflow code.
          raw = previous.split("PLAN_JSON = r'''",1)[1].split("'''",1)[0]
          plan = json.loads(raw)
          corrected = {
              'scripts/place-build-directory.py':'2fdc5c47fdec5fdc86e8527f3c5c39e3da204b04',
              'scripts/postgresql-release.py':'a384a4d476b7cc3a21ff842ed0647b3c16e41684',
              'scripts/provision-cmake.py':'c54cc2971fc07181e2e2c946ea812c1e3379c140',
              'scripts/provision-cutechess.py':'7eb283f2200a97bd28fde0b7d5e902406a289b36',
          }
          for entry in plan['entries']:
              if entry['path'] in corrected:
                  entry['sha'] = corrected[entry['path']]
          if plan['base'] != '088ca5c01de2eea68e9ec171edb21a870cf5d9b4' or plan['expected_tree'] != 'e0d8adb6c796e694150a3a09dbdf9f22e57ff389' or len(plan['entries']) != 34:
              raise RuntimeError('Unexpected source plan identity')
          canonical = (json.dumps(plan,separators=(',',':'))+'\n').encode()
          print('PLAN_DATA_SHA256 '+hashlib.sha256(canonical).hexdigest(),flush=True)
          current = git('rev-parse','refs/remotes/origin/main')
          changed = git('diff','--name-only',plan['base'],current).splitlines()
          if set(changed)-{'.github/workflows/repo-hygiene.yml'}:
              raise RuntimeError('Concurrent main source changes require reconciliation: '+repr(changed))
          fd,index=tempfile.mkstemp(prefix='reviewed-tree-',dir=os.environ['RUNNER_TEMP'])
          os.close(fd);os.unlink(index)
          env=dict(os.environ,GIT_INDEX_FILE=index)
          try:
              git('read-tree',plan['base'],env=env)
              for entry in plan['entries']:
                  path,sha,mode=entry['path'],entry['sha'],entry['mode']
                  if 'patch' in entry:
                      git('update-index','--add','--cacheinfo',mode,entry['basis'],path,env=env)
                      git('apply','--cached','--unidiff-zero','--whitespace=nowarn','-',data=entry['patch'],env=env)
                      if git('rev-parse',':'+path,env=env)!=sha:
                          raise RuntimeError('Patched blob differs: '+path)
                  else:
                      git('cat-file','-e',sha)
                  git('update-index','--add','--cacheinfo',mode,sha,path,env=env)
              tree=git('write-tree',env=env)
              if tree!='e0d8adb6c796e694150a3a09dbdf9f22e57ff389':
                  raise RuntimeError('Complete source tree differs from reviewed tree')
              git('config','user.name','GitHub Actions source consolidation')
              git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              args=['commit-tree',tree,'-p',current]
              for parent in plan['source_parents']:
                  git('cat-file','-e',parent+'^{commit}');args.extend(['-p',parent])
              commit=git(*args,data=plan['message']);tag='branch-integration/'+tree
              if git('ls-remote','origin','refs/tags/'+tag+'^{}'):
                  raise RuntimeError('Exact-tree candidate already exists; do not replace it')
              git('tag','-a',tag,commit,'-m','Reviewed cumulative source tree; main advanced separately after readback.')
              git('push','origin','refs/tags/'+tag)
              if git('ls-remote','origin','refs/tags/'+tag+'^{}').split()[0]!=commit:
                  raise RuntimeError('Candidate readback failed')
              print('REVIEWED_INTEGRATION '+json.dumps({'base':current,'commit':commit,'tree':tree,'tag':tag,'files':len(plan['entries'])}),flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
                  summary.write(f'\nReviewed source candidate `{commit}`, tree `{tree}`, tag `{tag}`. Main not moved.\n')
          finally:
              pathlib.Path(index).unlink(missing_ok=True)
          PYTREE
