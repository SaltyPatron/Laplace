roke-width:1;"/><line x1="161.146" y1="648.372" x2="325.558" y2="648.372" style="stroke:#181818;stroke-width:1;"/><line x1="325.558" y1="648.372" x2="325.558" y2="668.372" style="stroke:#181818;stroke-width:1;"/><polygon points="321.558,658.372,325.558,668.372,329.558,658.372,325.558,662.372" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="325.558" y1="293.984" x2="325.558" y2="313.984" style="stroke:#181818;stroke-width:1;"/><polygon points="321.558,303.984,325.558,313.984,329.558,303.984,325.558,307.984" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="325.558" y1="703.466" x2="325.558" y2="723.466" style="stroke:#181818;stroke-width:1;"/><polygon points="321.558,713.466,325.558,723.466,329.558,713.466,325.558,717.466" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="325.558" y1="758.56" x2="325.558" y2="778.56" style="stroke:#181818;stroke-width:1;"/><polygon points="321.558,768.56,325.558,778.56,329.558,768.56,325.558,772.56" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="23"><rect x="22" y="821.56" width="609.115" height="62.828" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="27" y="841.093" fill="#000" font-size="14" textLength="599.115">JSON/JSONL are canonicalized; CSV/TSV rows become JSON; XML emits depth-two elements;</text><text x="27" y="858.702" fill="#000" font-size="14" textLength="427.219">CoNLL-U groups blank-line-separated records; other text is chunked.</text><text x="27" y="876.312" fill="#000" font-size="14" textLength="367.336">Line endings normalize and blank-only chunks are skipped.</text></g><g class="footer" data-source-line="28"><text x="133.682" y="907.769" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="154.524" y="920.347" fill="#888" font-size="10" textLength="344.067">claimed. Preparation and record transformation bodies reviewed. This dataset</text><text x="133.684" y="932.925" fill="#888" font-size="10" textLength="385.747">representation is not an exact source-byte archival representation. Shards write directly</text><text x="135.61" y="945.503" fill="#888" font-size="10" textLength="381.895">and no rollback/finally closes the whole pipeline on an intermediate exception. Existing</text><text x="183.704" y="958.081" fill="#888" font-size="10" textLength="285.708">extra shards in an output directory are not removed by this body.</text></g><?plantuml-src fLHDZjis5Dxh50_e8XcajaUI9LdZHP6wCoW2nnF0ITfTGP6FOzOKgPAKFSwgX-W9Uv8-IZBWRjkDHnY-d--FV0EF9oNGS7o0BUiqupZRM7D24vGrJ2-yumiz7lp6Rm-uLlFk0lkVtsT52NafxbcQbxBc3IvbLVAwg9jocJQvg9jCyB8goxJcZ9LvpjDcLMLBoLR8qrIcUL4dR_upaCvXnnpUW4cBhERviiohbE6om3ANMDT2PYkvB4fHbcLLLylxcgqufbYjH2DM1BVAgrMLooR_7s2uTLtlRx3KMIOoMUHPK-GDMx4ghUwNkInuneeYaqikwWfN4hE2YMLTbFcgNgxoJDO5ooKlPUAFoX0_raB3-F75sTw8ZTNMmNTFxvysJqyt5Vx0X3qhymAIQOyt9m8bwtLuiYRiM8kmPyRlqIcP11KqmYqx-FlFlo3O8veuq0aFp0WGB32F0KXjwqBY0wFVXwrb0bfcb4GVXhgXKNr3jquUDWThFKAlJ4XB8CZnAyz0Ejl2oNBMz9gv2tYgf_AV2D09nmaUEdJZ_h6ykGG4hLeLleTM6TNsBLWJspOE6Pq5nvGP89oOLWINo4m3pau5T7wTd0-AoBxzQ1q2unozLusUMbdyCjQ8ljEAnuaEoKxXVxW3vU7j1VrT0WyxwrgQ_mqN_D2RuxKeZgE_KVjWGSOrCbQ6DVLCEf1cj6DsnCkuSN4Bb9OEjO-6Mu7mu_CUta70rt3LunqyFkzZnI-H3JI4cAIRV2B4634uwpqqCICehkeH5X_xldGYiXes0QUQuDV0X9YK6uc0HlCI3d1GFjWNYiuwGICctOoz8xbrv7ALTFoufcCsfcF-koTAPqLpHWnQJUduesUKiW7GmoT7QPZojAP0sIxH-4BRY408jaq-x9ztY_Yp1RhWm1cvGyv4ySKQDlklYy_xh-3icIWJU8frB5x3hn-tW1GKJx7lmc4MpXPGOukHSRAnk-rszWNYLUgeKpDpd6bbSERZGq8IYQkfQx3XG34SRA0C38wZc2TRAWT2IdPxoioKY87XECyQVHdB_O2TRcBNnKvg6aacqbfICDdRtj7pul2ay4ohhUC7kajkYCKSTlGThSGs2iSzGMkZMxP3iwRLuCX7rOvnxWAZDolXcj5_n1m-kP5H35Z4DbbCmuqVqnbF6YiKni4ZWZby9lElZYOqmg4dwSPY5Vb6Bm5V6G_WH_Z3xMG4NL6cuTyzSzYFpyWK5KKmWhua4L4aOBMEJzj2Kg9rb2q6p0Cf3-U3fTnrgiDe40mqW