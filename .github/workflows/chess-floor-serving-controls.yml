name: Dispatch the unchanged corpus pilot after exact native installation

on:
  push:
    branches: ['verify/chess-floor-serving-controls-20260916']

permissions:
  contents: read
  actions: write

jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch the unchanged corpus pilot after exact native installation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, tempfile, urllib.error, urllib.request, zipfile
          REPOSITORY = "SaltyPatron/Laplace"
          EXPECTED_SOURCE = "baba1ccea538c5f7380692cd7432b94d6f4bf46b"
          EXPECTED_TREE = "a2394ec45d026812fe5805bbca331c353260e237"
          EXPECTED_OPERATOR = "68dd3c7c986759afc658ebcb2b639a2a5052178d"
          NATIVE_RUN, NATIVE_ATTEMPT, NATIVE_JOB = 35142154113, 1, 104949056631
          ARTIFACT_ID = 10465762490
          EXPECTED_ZIP_BYTES = 38820
          EXPECTED_ZIP_SHA256 = "fda32128785565e49a8eee33c07966827c5c94c945ee9e1244cfd8abf493e3ca"
          TARGET_REF = "verify/chess-corpus-pilot-20260916-4fa186e"
          OBSERVED_PGN = "/vault/Data/Games/Chess/Lumbras/otb/LumbrasGigaBase_OTB_2025.pgn"
          def require(value, message):
              if not value: raise ValueError(message)
          require(all(re.fullmatch(r"[0-9a-f]{40}", v) for v in (EXPECTED_SOURCE, EXPECTED_TREE, EXPECTED_OPERATOR)),
                  "exact immutable source identities required")
          require(re.fullmatch(r"[0-9a-f]{64}", EXPECTED_ZIP_SHA256)
                  and min(NATIVE_RUN, NATIVE_ATTEMPT, NATIVE_JOB, ARTIFACT_ID, EXPECTED_ZIP_BYTES) > 0
                  and EXPECTED_ZIP_BYTES <= 2 * 1024**3, "exact bounded terminal artifact required")
          require(re.fullmatch(r"verify/chess-corpus-pilot-[a-z0-9-]+", TARGET_REF),
                  "reuse an exact non-triggering historical pilot reference")
          base = "https://api.github.com/repos/" + REPOSITORY
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2026-03-10"}
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers), timeout=30) as response:
                  raw = response.read(2 * 1024**2 + 1)
              require(len(raw) <= 2 * 1024**2, "API metadata exceeded its bound")
              return json.loads(raw)
          run = api("/actions/runs/" + str(NATIVE_RUN))
          require(run["head_sha"] == EXPECTED_OPERATOR and run["status"] == "completed"
                  and run["conclusion"] == "success" and run["event"] == "push"
                  and run["head_branch"] == "verify/chess-floor-serving-controls-20260916"
                  and run["path"] == ".github/workflows/chess-floor-serving-controls.yml"
                  and run["run_attempt"] == NATIVE_ATTEMPT, "native operator attempt differs from observed success")
          jobs = api("/actions/runs/" + str(NATIVE_RUN) + "/attempts/" + str(NATIVE_ATTEMPT) + "/jobs?per_page=100")
          selected = [job for job in jobs["jobs"] if job["id"] == NATIVE_JOB]
          require(jobs["total_count"] == 1 and len(selected) == 1, "native job absent or ambiguous")
          job = selected[0]
          require(job["status"] == "completed" and job["conclusion"] == "success", "native job did not succeed")
          required_steps = ("Prepare retained native execution paths",
              "Execute existing native dependency build proof and install owners", "Observe fixed public managed service state",
              "Retain native operator outcome", "Retain native execution evidence")
          positions = []
          for name in required_steps:
              matches = [s for s in job["steps"] if s["name"] == name]
              require(len(matches) == 1 and matches[0]["status"] == "completed" and matches[0]["conclusion"] == "success",
                      "required native step did not succeed: " + name)
              positions.append(job["steps"].index(matches[0]))
          require(positions == sorted(positions), "native operator step order changed")
          require(not any(s["conclusion"] in ("failure", "cancelled") for s in job["steps"]), "native step failed or cancelled")
          artifact = api("/actions/artifacts/" + str(ARTIFACT_ID))
          require(not artifact.get("expired") and artifact["workflow_run"]["id"] == NATIVE_RUN
                  and artifact["workflow_run"]["head_sha"] == EXPECTED_OPERATOR
                  and artifact["name"] == "original-native-install-" + str(NATIVE_RUN) + "-" + str(NATIVE_ATTEMPT)
                  and artifact["size_in_bytes"] == EXPECTED_ZIP_BYTES
                  and artifact.get("digest") == "sha256:" + EXPECTED_ZIP_SHA256, "native artifact identity changed")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, response_headers, new_url): return None
          try:
              urllib.request.build_opener(NoRedirect).open(
                  urllib.request.Request(base + "/actions/artifacts/" + str(ARTIFACT_ID) + "/zip", headers=headers), timeout=30)
              raise ValueError("expected authenticated artifact redirect")
          except urllib.error.HTTPError as redirect:
              if redirect.code != 302: raise
              location = redirect.headers["Location"]
          require(location.startswith("https://"), "artifact download must use HTTPS")
          work = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "native-dispatch-artifact"
          work.mkdir(mode=0o700, exist_ok=False)
          require(shutil.disk_usage(work).free >= EXPECTED_ZIP_BYTES + 512 * 1024**2, "insufficient artifact disk")
          documents, document_identities = {}, {}
          with tempfile.TemporaryFile(prefix="native-install-", dir=work) as handle:
              digest, total = hashlib.sha256(), 0
              # The signed URL receives no GitHub bearer header.
              with urllib.request.urlopen(location, timeout=60) as response:
                  while True:
                      block = response.read(min(1 << 20, EXPECTED_ZIP_BYTES + 1 - total))
                      if not block: break
                      total += len(block)
                      require(total <= EXPECTED_ZIP_BYTES, "download exceeds observed artifact bytes")
                      digest.update(block)
                      handle.write(block)
              require(total == EXPECTED_ZIP_BYTES and digest.hexdigest() == EXPECTED_ZIP_SHA256, "artifact bytes differ")
              handle.seek(0)
              with zipfile.ZipFile(handle) as archive:
                  entries = archive.infolist()
                  require(len(entries) <= 10000, "native archive entry count exceeded")
                  for name in ("receipt.json", "selection.json", "workflow-outcome.json", "service-status.json"):
                      matches = [e for e in entries if e.filename == name]
                      require(len(matches) == 1 and not matches[0].is_dir() and matches[0].file_size <= 131072,
                              "missing, duplicate or oversized native document: " + name)
                      with archive.open(matches[0]) as stream: raw = stream.read(131073)
                      require(len(raw) == matches[0].file_size, "native document bytes differ")
                      documents[name] = json.loads(raw)
                      document_identities[name] = {"bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
          receipt, selection, outcome = (documents[name] for name in ("receipt.json", "selection.json", "workflow-outcome.json"))
          for value in (receipt, selection):
              require(value["schema"] == "laplace.native-only-install/v1" and value["source"] == EXPECTED_SOURCE
                      and value["tree"] == EXPECTED_TREE and str(value["runId"]) == str(NATIVE_RUN)
                      and str(value["attempt"]) == str(NATIVE_ATTEMPT) and value["managedPublication"] == "not_attempted"
                      and value["fullLifecyclePassed"] is False and value["databaseRecreation"] is False
                      and value["foundationIngestion"] is False, "native receipt scope or identity differs")
          require(selection["operatorSource"] == EXPECTED_OPERATOR and selection["status"] == "running"
                  and receipt["status"] == "completed", "native selection/completion differs")
          require(selection["postgresqlSelection"]["commit"] == "724edf9bde9d356724ad384a2e196edc3c9f80f7"
                  and selection["postgresqlSelection"]["version"] == "18.6" and receipt["serverVersionNum"] == 180006,
                  "PostgreSQL release or activation differs")
          expected = ["pg-pin", "pg-checkout", "pg-source", "dependency-build", "dependency-identity", "native-managed-build",
              "isolated-native-database", "native-tests", "managed-tests", "uci-tests", "quiet-native-owner", "native-install",
              "extension-sql", "database-health", "postgres-activation"]
          require(receipt["completedPhases"] in (expected, expected[:1] + ["pg-fetch"] + expected[1:]),
                  "completed native phases differ from the required order")
          require(outcome == {"workflowOutcome": "success", "source": EXPECTED_SOURCE,
                              "applicationPublication": "not_attempted", "fullLifecyclePassed": False}, "native outcome differs")
          required_files = ("/opt/laplace/lib/liblaplace_core.so", "/opt/laplace/pgsql-18/bin/postgres",
                            "/opt/laplace/pgsql-18/bin/pg_config")
          require(set(receipt["identities"]) == set(required_files), "native installed file inventory differs")
          for name, identity in receipt["identities"].items():
              require(isinstance(identity["bytes"], int) and identity["bytes"] > 0
                      and re.fullmatch(r"[0-9a-f]{64}", identity["sha256"])
                      and pathlib.PurePosixPath(identity["path"]).is_absolute(), "invalid native identity: " + name)
          require(api("/git/commits/" + EXPECTED_SOURCE)["tree"]["sha"] == EXPECTED_TREE, "selected product tree differs")
          require(api("/git/ref/heads/" + TARGET_REF)["object"]["sha"] == EXPECTED_SOURCE, "pilot ref is not installed product")
          # Main/operator refs may advance independently. The exact pilot target and
          # subsequent actual run head/native-before/native-after bind this product.
          print("VERIFIED_NATIVE_INSTALLATION_EVIDENCE " + json.dumps({
              "operatorSource": EXPECTED_OPERATOR, "productSource": EXPECTED_SOURCE, "productTree": EXPECTED_TREE,
              "runId": NATIVE_RUN, "attempt": NATIVE_ATTEMPT, "jobId": NATIVE_JOB, "artifactId": ARTIFACT_ID,
              "artifactBytes": EXPECTED_ZIP_BYTES, "artifactSha256": EXPECTED_ZIP_SHA256, "receipt": receipt,
              "workflowOutcome": outcome, "documentIdentities": document_identities,
              "observedServiceState": documents["service-status.json"],
              "pilotScope": "Native-only. Corpus wrapper independently binds native/extension/DB, source-built CLI and PGN before/after. No application/full lifecycle or recording success claim."
          }), flush=True)
          body = {"ref": TARGET_REF, "inputs": {"mode": "measure", "pgn": OBSERVED_PGN, "family": "otb-2025", "games": "2000"}}
          request = urllib.request.Request(base + "/actions/workflows/chess-corpus-evidence.yml/dispatches",
              data=json.dumps(body).encode(), headers={**headers, "Content-Type": "application/json"}, method="POST")
          # Exactly one POST; ambiguous transport errors are never retried.
          with urllib.request.urlopen(request, timeout=30) as response: code, raw = response.status, response.read(65537)
          require(code in (200, 204) and len(raw) <= 65536, "unexpected bounded dispatch response")
          result = json.loads(raw) if raw else {}
          require(api("/git/ref/heads/" + TARGET_REF)["object"]["sha"] == EXPECTED_SOURCE,
                  "pilot ref moved during dispatch; inspect created run before claiming identity")
          print("CHESS_CORPUS_PILOT_DISPATCH " + json.dumps({
              "status": "requested", "expectedHead": EXPECTED_SOURCE, "ref": TARGET_REF, "nativeInstallationRun": NATIVE_RUN,
              "nativeInstallationAttempt": NATIVE_ATTEMPT, "fullLifecyclePassed": False, "applicationPublication": "not_attempted",
              "inputs": body["inputs"], "workflowRunId": result.get("workflow_run_id"), "runUrl": result.get("html_url")
          }), flush=True)
          PY
