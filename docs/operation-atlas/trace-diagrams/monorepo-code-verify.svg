ke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="347.543" y1="128.703" x2="347.543" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="343.543,138.703,347.543,148.703,351.543,138.703,347.543,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="347.543" y1="708.137" x2="347.543" y2="728.137" style="stroke:#181818;stroke-width:1;"/><polygon points="343.543,718.137,347.543,728.137,351.543,718.137,347.543,722.137" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="347.543" y1="778.324" x2="347.543" y2="798.324" style="stroke:#181818;stroke-width:1;"/><polygon points="343.543,788.324,347.543,798.324,351.543,788.324,347.543,792.324" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="347.543" y1="833.418" x2="347.543" y2="853.418" style="stroke:#181818;stroke-width:1;"/><polygon points="343.543,843.418,347.543,853.418,351.543,843.418,347.543,847.418" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="347.543" y1="888.512" x2="347.543" y2="908.512" style="stroke:#181818;stroke-width:1;"/><polygon points="343.543,898.512,347.543,908.512,351.543,898.512,347.543,902.512" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="30"><text x="195.179" y="949.893" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="229.647" y="962.471" fill="#888" font-size="10" textLength="316.816">claimed. Complete verifier and finite tool map reviewed: Python, C/C++,</text><text x="192.159" y="975.049" fill="#888" font-size="10" textLength="391.792">JavaScript/TypeScript, Rust, Go, Bash, Ruby, PHP, Java, C#, CUDA, Fortran, Swift, Zig,</text><text x="190.192" y="987.627" fill="#888" font-size="10" textLength="395.728">LLVM, ISPC, NASM and assembly, plus in-process JSON. Julia/Kotlin aliases can have a</text><text x="204.078" y="1000.205" fill="#888" font-size="10" textLength="367.954">grammar but no verifier here. C# restore and build are separate process calls; Java</text><text x="184.052" y="1012.783" fill="#888" font-size="10" textLength="408.008">disables annotation processing. Verified means these syntax/compile checks, not behavioral</text><text x="359.156" y="1025.361" fill="#888" font-size="10" textLength="57.798">test success.</text></g><?plantuml-src TLJTRjis5BxNKnmW5qjHsKuSE4vi38Fhrckon0tYj0DsHr57DXUAL4dAZdgrXzWJxadsKN8Ijq0l4aWMppdV7yylz66hSZQI9tGZAYqa3qHL3VRF_GychwmomVS_LMncLtDRLY8CvZRd1skrt0Xb-jBJwkDiE3gdamjnEYmoEUQCpuQZKN5smMEPduoalBZ8nkSd5vV5kRoKF2xawTdbQ3W-aIVv-FIqA0fvEPQ9VrIc4awKb0dvk7QsDldSQkleQ35Rp1UBWnD-8tAxKsPDXT2U3xxaN8XQXuKrOIbAffKmViLE5KbGGJFTMcCTLvR---TVsiOFIegWh8cLogZsKPYSf3M5MjUESmgWwnCVX0l9v9w_rien6MioBSmZULixoMrDQNEXLMYcYIhe-7hrQVdR6meRDdJSi7-JqEIp1wJ61oxx3_mK-jSUuu3SWyiKFSdNMUMiPE-d2OCQ7LiqSB7sdhtLMwOM9Xy2bB16QNO3tvWWddfom_AHbDdQZjiqeGXeQG-BElBiVe0OvuJQ6QgDs0gbHQOv9NvIWKw7OtGY7soL49iSej9axbW0JMtKrve9n2hhX6ieXqWoMDTCQUTQl518vV5ifnXQJVwCWmrp3ZpTgSpQu8CJ5K66lz6X5TRLK0csmU83FkzUpdw7DQWIxMmT2Dc1JT_OsPR0pvWMA4N5wsWWPrK5ZEai0CMywIe0v5cuxmL-rcEXZD2w8H6Y5Y7sgc7lza2Rteis93KBKrTJyZjKsTtp3yJEMOS8j5qdNxgHEVtQXf5UsD9i-PuU77FFAmnqr2MWJOJcm4dyZbX5JQ8YyRNrKk8QKrHccaokZDGrNcUh1zWcriRweAIFUNGb0lsjItU02pBwzte6MN18Bh8wYPUiEwlt2oIEw8NdLJ7O3bzrRIDKG6zsoQfDGy_nLl4k6kSGt-X35BPFIppZLy-bC14LcfHeHnPBgRqnG1NPaP2Igo2mpnAfHSn0d-Px6LuzYqJs5wXLicpjxaPFwAu96sjIcW_cRz-coJLqNaa7o8E7fkBkCQNxskF_xpQbTy9ludlMf7JtyIwbM87o8_nzVZzBQM4TcA3ZQgSA5FsbrcboS_FbDgMhrTqyfULiTTk24XuKCur6bQuzijNRxm6AUwHFrxLMOl273Hha8RJmxEETeer0jaIonlOhXQCCBaEL5y9O7WmXZi0IghlEognM6YFnvhjBnVGyJIA7i3uIINBbOyWyQemDtPhSduFhVNg9POdG-dYvS5kw10xsEudQNUHJO0gKCS0gt06T1A31ifEnLp_6dFPn-1y0?></g></svg>