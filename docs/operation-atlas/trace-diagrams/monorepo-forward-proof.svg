<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:533px;height:921px;background:#FAFCFF;" width="533px" height="921px" viewBox="0 0 533 921" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="533" height="921" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="5"><text x="136.044" y="34.533" fill="#000" font-size="14" textLength="259.485" font-weight="700">Monorepo — response proof assembly</text></g><ellipse cx="264.787" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="98.365" y="93.609" width="332.844" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="108.365" y="116.066" fill="#000" font-size="12" textLength="312.844">Receive events from the invocation that produced the reply</text><rect x="71.667" y="148.703" width="386.24" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="81.667" y="171.16" fill="#000" font-size="12" textLength="366.24">Select last complete/unresolved/ambiguous/budget_exhausted event</text><rect x="210.429" y="252.715" width="108.717" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="220.429" y="275.172" fill="#000" font-size="12" textLength="88.717">Return null proof</text><ellipse cx="264.787" cy="326.762" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="264.787" cy="326.762" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="218.625,203.797,310.949,203.797,322.949,215.797,310.949,227.797,218.625,227.797,206.625,215.797,218.625,203.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="268.787" y="239.216" fill="#000" font-size="11" textLength="17.118">yes</text><text x="218.625" y="220.298" fill="#000" font-size="11" textLength="92.324">No terminal event?</text><rect x="16" y="379.762" width="497.574" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="402.219" fill="#000" font-size="12" textLength="477.574">Project resolve/couple/orient/route/propose/scan/compose/steer/select/emit/realize events</text><rect x="111.033" y="434.855" width="307.508" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="121.033" y="457.313" fill="#000" font-size="12" textLength="287.508">Retain event dimensions, supports and routing rounds</text><rect x="95.702" y="538.867" width="338.17" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="105.702" y="561.324" fill="#000" font-size="12" textLength="318.17">Append synthetic witness trace event using terminal context</text><polygon points="178.578,489.949,350.996,489.949,362.996,501.949,350.996,513.949,178.578,513.949,166.578,501.949,178.578,489.949" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="268.787" y="525.368" fill="#000" font-size="11" textLength="17.118">yes</text><text x="178.578" y="506.45" fill="#000" font-size="11" textLength="172.417">Caller reports response witnessed?</text><polygon points="264.787,593.961,276.787,605.961,264.787,617.961,252.787,605.961,264.787,593.961" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="39.03" y="637.961" width="451.514" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="49.03" y="660.418" fill="#000" font-size="12" textLength="431.514">Build proof with session, prompt occurrence key, program ID and semantic-act ID</text><rect x="23.649" y="693.055" width="482.275" he