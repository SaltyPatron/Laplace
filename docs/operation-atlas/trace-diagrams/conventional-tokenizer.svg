<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:530px;height:774px;background:#FAFCFF;" width="530px" height="774px" viewBox="0 0 530 774" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="530" height="774" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="7"><text x="69.029" y="34.533" fill="#000" font-size="14" textLength="390.168" font-weight="700">Conventional — candidate tokenizer training and selection</text></g><ellipse cx="262.113" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="106.027" y="93.609" width="312.172" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="116.027" y="116.066" fill="#000" font-size="12" textLength="292.172">Require nonempty configured vocabulary candidate list</text><rect x="63.354" y="205.622" width="397.52" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="73.354" y="228.079" fill="#000" font-size="12" textLength="377.52">Create SentencePiece unigram model from train-split nonblank records</text><rect x="57.679" y="260.716" width="408.869" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="67.679" y="283.173" fill="#000" font-size="12" textLength="388.869">Use identity normalization, byte fallback and configured special-token IDs</text><rect x="131.381" y="315.81" width="261.465" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="141.381" y="338.267" fill="#000" font-size="12" textLength="241.465">Allow actual vocabulary below requested size</text><rect x="101.363" y="370.903" width="321.5" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="111.363" y="393.36" fill="#000" font-size="12" textLength="301.5">Encode validation records; count tokens and UTF8 bytes</text><rect x="41" y="425.997" width="442.227" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="51" y="448.454" fill="#000" font-size="12" textLength="422.227">Score model_bytes times eight plus validation_tokens times log2(actual_vocab)</text><polygon points="190.267,148.703,333.96,148.703,345.96,160.703,333.96,172.703,190.267,172.703,178.267,160.703,190.267,148.703" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="266.113" y="184.122" fill="#000" font-size="11" textLength="17.118">yes</text><text x="190.267" y="165.204" fill="#000" font-size="11" textLength="143.693">More vocabulary candidates?</text><text x="166.031" y="158.286" fill="#000" font-size="11" textLength="12.235">no</text><rect x="134.387" y="503.091" width="255.453" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="144.387" y="525.548" fill="#000" font-size="12" textLength="235.453">Choose minimum description_bits candidate</text><rect x="148.391" y="558.185" width="227.445" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="158.391" y="580.642" fill="#000" font-size="12" textLength="207.445">Copy chosen model to tokenizer.model</text><rect x="149.41" y="613.278" width="225.406" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="159.41" y="635.735" fill="#000" font-size="12" textLength="205.406">Write tokenizer-report.json; print report</text><ellipse cx="262.113" cy="679.372" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="262.113" cy="679.372" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="262.113" y1="73.609" x2="262.113" y2=