name: Hosted CuteChess engine configuration controls
on:
  push:
    branches: [verify/cutechess-engine-configuration-20260916]
permissions:
  contents: read
jobs:
  configuration-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CANDIDATE_SHA: dff94712ecaa72c40b4855002a02ba1592f928a1
      CANDIDATE_TREE: fbb008a1a530ead182b31399ae15a61e1ca5de92
      LAPLACE_WORK_ROOT: /build/laplace/work/cutechess-engine-configuration
      TMPDIR: /build/laplace/work/cutechess-engine-configuration/tmp
      TMP: /build/laplace/work/cutechess-engine-configuration/tmp
      TEMP: /build/laplace/work/cutechess-engine-configuration/tmp
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Prepare permanent source and evidence directories
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$TMPDIR" /build/laplace/worktrees /build/laplace/recovery/cutechess-engine-configuration
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dff94712ecaa72c40b4855002a02ba1592f928a1
          persist-credentials: false
          fetch-depth: 1
      - name: Bind exact product candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          git worktree add --detach /build/laplace/worktrees/cutechess-engine-configuration "$CANDIDATE_SHA"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path("/build/laplace/recovery/cutechess-engine-configuration/source.json").write_text(json.dumps({
              "source_commit":os.environ["CANDIDATE_SHA"],"source_tree":os.environ["CANDIDATE_TREE"],
              "workflow_commit":os.environ["GITHUB_SHA"],
              "scope":"configuration-files-and-real-subprocess-controls",
              "actual_engine_manager_executed":False,"operator_database_access_verified":False,
              "actual_gui_game_played":False
          },indent=2)+"\n")
          PY
      - name: Run actual configuration, lifecycle and publication controls
        working-directory: /build/laplace/worktrees/cutechess-engine-configuration
        run: |
          set -euo pipefail
          evidence=/build/laplace/recovery/cutechess-engine-configuration
          command -v gio
          command -v cc
          python3 --version
          bash -n scripts/bootstrap-chess-lab.sh
          bash -n scripts/pipeline.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for name in ("cutechess-user-engines.py","provision-cutechess.py","test-cutechess-release.py","test-pipeline-install.py"):
              ast.parse((Path("scripts")/name).read_text(),filename=name)
          PY
          failed=0
          for script in test-cutechess-release.py test-pipeline-install.py; do
            set +e
            timeout --signal=TERM --kill-after=10s 480s python3 "scripts/$script" 2>&1 | tee "$evidence/$script.log"
            status=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\n' "$script" "$status" >> "$evidence/results.tsv"
            if [[ "$status" != 0 ]]; then failed=1; fi
          done
          set +e
          python3 scripts/docs-inventory.py --check 2>&1 | tee "$evidence/inventory.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" != 0 ]]; then
            python3 scripts/docs-inventory.py
            git diff -- docs/INVENTORY.md > "$evidence/inventory.patch"
            failed=1
          fi
          git status --porcelain --untracked-files=all | tee "$evidence/source-status.txt"
          test ! -s "$evidence/source-status.txt" || failed=1
          exit "$failed"
      - name: Retain complete hosted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cutechess-engine-configuration-${{ github.run_id }}-${{ github.run_attempt }}
          path: /build/laplace/recovery/cutechess-engine-configuration/
          retention-days: 30
          if-no-files-found: error
