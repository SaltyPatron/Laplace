<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1255px;height:998px;background:#FAFCFF;" width="1255px" height="998px" viewBox="0 0 1255 998" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1255" height="998" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="5"><text x="406.618" y="24.533" fill="#000" font-size="14" textLength="435.265" font-weight="700">Monorepo — program, output, semantic-act and receipt identities</text></g><!--cluster P--><g class="cluster" data-qualified-name="P" id="ent0001" data-source-line="6"><rect x="623.5" y="45.609" width="618" height="194" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="871.045" y="62.143" fill="#000" font-size="14" textLength="122.91" font-weight="700">Program input / v9</text></g><!--entity Required--><g class="entity" data-qualified-name="P.Required" id="ent0002" data-source-line="7"><rect x="977.5" y="116.109" width="239.83" height="72.828" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="987.5" y="140.643" fill="#000" font-size="14" textLength="103.496">Observation root</text><text x="987.5" y="158.252" fill="#000" font-size="14" textLength="212.83">Explicit invocation + active context</text><text x="987.5" y="175.861" fill="#000" font-size="14" textLength="219.83">Required occurrence ordinals + IDs</text></g><!--entity Planes--><g class="entity" data-qualified-name="P.Planes" id="ent0003" data-source-line="8"><rect x="666.5" y="89.609" width="276.033" height="125.656" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="676.5" y="114.143" fill="#000" font-size="14" textLength="113.613">COUPLE bindings</text><text x="676.5" y="131.752" fill="#000" font-size="14" textLength="131.517">Structural candidates</text><text x="676.5" y="149.361" fill="#000" font-size="14" textLength="133.068">Geometry candidates</text><text x="676.5" y="166.971" fill="#000" font-size="14" textLength="115.165">Ordered discourse</text><text x="676.5" y="184.58" fill="#000" font-size="14" textLength="130.751">Initial typed channels</text><text x="676.5" y="202.189" fill="#000" font-size="14" textLength="256.033">Declared operations + inputs + witnesses</text></g><!--entity PID--><g class="entity" data-qualified-name="PID" id="ent0004" data-source-line="10"><rect x="721.5" y="302.609" width="147.627" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="731.5" y="327.143" fill="#000" font-size="14" textLength="127.627">BLAKE3 program_id</text></g><!--entity O--><g class="entity" data-qualified-name="O" id="ent0005" data-source-line="11"><rect x="7" y="107.609" width="226.616" height="90.438" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="132.143" fill="#000" font-size="14" textLength="102.73">Output input / v2</text><text x="17" y="149.752" fill="#000" font-size="14" textLength="103.496">Observation root</text><text x="17" y="167.361" fill="#000" font-size="14" textLength="119.062">Ordered output IDs</text><text x="17" y="184.971" fill="#000" font-size="14" textLength="206.616">Per-output support flags + origins</text></g><!--entity OID--><g class="entity" data-qualified-name="OID" id="ent0006" data-source-line="12"><rect x="27.5" y="302.609" width="185.778" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="37.5" y="327.143" fill="#000" font-size="14" textLength="165.778">BLAKE3 output_fingerprint</text></g><!--entity A--><g class="entity" data-qualified-name="A" id="ent0007" data-source-line="13"><rect x="437.5" y="427.609" width="215.733" height="72.828" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="447.5" y="452.143" fill="#000" font-size="14" textLength="105.813">semantic-act / v1</text><text x="447.5" y="469.752" fill="#000" font-size="14" textLength="195.733">program_id + output_fingerprint</text><text x="447.5" y="487.361" fill="#000" font-size="14" textLength="178.958">at first successful completion</text></g><!--entity AID--><g class="entity" data-qualified-name="AID" id="ent0008" data-source-line="14"><rect x="456.5" y="560.609" width="177.979" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="466.5" y="585.143" fill="#000" font-size="14" textLength="157.979">BLAKE3 semantic_act_id</text></g><!--entity R--><g class="entity" data-qualified-name="R" id="ent0009" data-source-line="15"><rect x="415.5" y="658.609" width="259.702" height="125.656" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="425.5" y="683.143" fill="#000" font-size="14" textLength="47.469">Receipt</text><text x="425.5" y="700.752" fill="#000" font-size="14" textLength="76.248">All three IDs</text><text x="425.5" y="718.361" fill="#000" font-size="14" textLength="157.199">Required/satisfied counts</text><text x="425.5" y="735.971" fill="#000" font-size="14" textLength="229.934">Remaining=max(required-satisfied,0)</text><text x="425.5" y="753.58" fill="#000" font-size="14" textLength="239.702">Routing/output/semantic-output counts</text><text x="425.5" y="771.189" fill="#000" font-size="14" textLength="231.123">Presence flags, complete, disposition</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="25"><path d="M248.5,275.609 L248.5,367.367 L686.452,367.367 L686.452,285.609 L676.452,275.609 L248.5,275.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M676.452,275.609 L676.452,285.609 L686.452,285.609 L676.452,275.609" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="254.5" y="294.104" fill="#000" font-size="13" textLength="328.834">Separate response planes stay separate in the encoding.</text><text x="254.5" y="310.456" fill="#000" font-size="13" textLength="372.119">Geometry and structure are fingerprinted, not semantic ancestry.</text><text x="254.5" y="326.808" fill="#000" font-size="13" textLength="266.671">Integer fields use explicit big-endian encoding.</text><text x="254.5" y="343.159" fill="#000" font-size="13" textLength="416.952">Bindings, structure, geometry, initial channels and operations are sorted;</text><text x="254.5" y="359.511" fill="#000" font-size="13" textLength="321.909">discourse and each operation's input order are retained.</text></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="32"><path d="M310,844.609 L310,920.016 A0,0 0 0 0 310,920.016 L780.509,920.016 A0,0 0 0 0 780.509,920.016 L780.509,854.609 L770.509,844.609 L549.5,844.609 L545.5,784.799 L541.5,844.609 L310,844.609 A0,0 0 0 0 310,844.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M770.509,844.609 L770.509,854.609 L780.509,854.609 L770.509,844.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="316" y="863.104" fill="#000" font-size="13" textLength="350.467">Occurrence and input-identity obligation counts are summed.</text><text x="316" y="879.456" fill="#000" font-size="13" textLength="398.125">Receipt copies in-memory state; this helper writes no durable receipt.</text><text x="316" y="895.808" fill="#000" font-size="13" textLength="355.507">Program fingerprint is created once from initial response data.</text><text x="316" y="912.159" fill="#000" font-size="13" textLength="449.509">Later channels are not rehashed into program_id by note_semantic_channels.</text></g><!--link P to PID--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk10" data-source-line="16" data-link-type="dependency"><path d="M640.575,239.902 C640.651,240.063 640.728,240.224 640.805,240.385 C640.959,240.707 641.115,241.027 641.273,241.346 C643.8,246.455 646.844,251.271 650.5,255.609 C666.99,275.179 681,265.479 704.5,275.609 C723.44,283.769 739.614,291.601 756.444,300.171" style="stroke:#181818;stroke-width:1;" fill="none" id="P-to-PID"/><polygon points="760.9,302.439,754.695,294.791,756.444,300.171,751.065,301.92,760.9,302.439" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link O to OID--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk11" data-source-line="17" data-link-type="dependency"><path d="M120.5,197.919 C120.5,232.129 120.5,272.689 120.5,297.539" style="stroke:#181818;stroke-width:1;" fill="none" id="O-to-OID"/><polygon points="120.5,302.539,124.5,293.539,120.5,297.539,116.5,293.539,120.5,302.539" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link PID to A--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk12" data-source-line="18" data-link-type="dependency"><path d="M763.33,340.689 C724.42,362.549 662.399,397.41 613.109,425.11" style="stroke:#181818;stroke-width:1;" fill="none" id="PID-to-A"/><polygon points="608.75,427.559,618.556,426.637,613.109,425.11,614.636,419.663,608.75,427.559" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link OID to A--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk13" data-source-line="19" data-link-type="dependency"><path d="M161.93,340.639 C182.39,349.259 207.56,359.459 230.5,367.609 C298.48,391.759 371.217,413.931 432.357,431.601" style="stroke:#181818;stroke-width:1;" fill="none" id="OID-to-A"/><polygon points="437.16,432.989,429.624,426.648,432.357,431.601,427.403,434.333,437.16,432.989" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link A to AID--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" id="lnk14" data-source-line="20" data-link-type="dependency"><path d="M545.5,500.709 C545.5,520.599 545.5,539.539 545.5,555.589" style="stroke:#181818;stroke-width:1;" fill="none" id="A-to-AID"/><polygon points="545.5,560.589,549.5,551.589,545.5,555.589,541.5,551.589,545.5,560.589" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link PID to R--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" id="lnk15" data-source-line="21" data-link-type="dependency"><path d="M787.88,340.889 C768.52,386.409 714.57,507.689 652.5,598.609 C638.52,619.089 624.817,636.149 608.507,654.649" style="stroke:#181818;stroke-width:1;" fill="none" id="PID-to-R"/><polygon points="605.2,658.399,614.152,654.294,608.507,654.649,608.151,649.003,605.2,658.399" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link OID to R--><g class="link" data-entity-1="ent0006" data-entity-2="ent0009" id="lnk16" data-source-line="22" data-link-type="dependency"><path d="M139.87,340.749 C199.14,396.249 376.4,562.252 475.4,654.962" style="stroke:#181818;stroke-width:1;" fill="none" id="OID-to-R"/><polygon points="479.05,658.379,475.215,649.308,475.4,654.962,469.747,655.147,479.05,658.379" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link AID to R--><g class="link" data-entity-1="ent0008" data-entity-2="ent0009" id="lnk17" data-source-line="23" data-link-type="dependency"><path d="M545.5,598.629 C545.5,613.909 545.5,631.779 545.5,653.589" style="stroke:#181818;stroke-width:1;" fill="none" id="AID-to-R"/><polygon points="545.5,658.589,549.5,649.589,545.5,653.589,541.5,649.589,545.5,658.589" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link P to GMN18--><g class="link" data-entity-1="ent0001" data-entity-2="ent0019" id="lnk20" data-source-line="25" data-link-type="association"><path d="M623.221,162.038 C621.674,163.614 619.934,165.385 618.024,167.331 C610.382,175.112 600.003,185.682 588.244,197.657 C564.725,221.607 535.685,251.179 511.98,275.319" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="P-GMN18"/></g><g class="footer" data-source-line="37"><text x="431.374" y="939.396" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="433.876" y="951.975" fill="#888" font-size="10" textLength="380.747">claimed. Fingerprint helper bodies and receipt assembly reviewed. Hash identity is not</text><text x="441.364" y="964.553" fill="#888" font-size="10" textLength="365.771">proof of persisted replay inputs, database snapshot identity, runtime acceptance or</text><text x="414.956" y="977.131" fill="#888" font-size="10" textLength="418.589">independent provenance. Comparator tie/canonicalization guarantees and cross-platform hash</text><text x="520.024" y="989.709" fill="#888" font-size="10" textLength="208.452">representation are not established by this view.</text></g><?plantuml-src RLNRRkCs47tNLmos3zkYlcmIPzqqQ05l4ky6JTT6ZBuP22XgP1ChaIf9EN6B0ls8Vc6_f8VK9KgpG838dE7CcNDcXc_fvg0orf9_f3jH5KBob9yyQwUCdXRDoOEhK-Ujy3nrLawbsMdbON-ehDbPKKuaRJujJi_VqrcQpqx4QSfdfs8-FpbDBzBvB3kVfMSN9oTPDil5N5oSpZBEq_DvUfQzpsG--o5xDx-0VIvcYVkYT2KGar8Xl-oigNLsPGfZwPlbOdcrN0uyt5vavb7f7UMYS3om8Bwe2xyqsdyM9TD6QBTXg_B4Arym_MgqiLmP-lVlVwWjOaIczbNjH-Iu5DehEHRIaz0PMPQiAa-1A0HGx18SUQ5tYFLctTmd9AyzJUbmyOQ4epNzcT30RPKwjWSHU2DhZD_gcwUgK58XhZuOsLY-9oHL1oO9x11Yg-_vzrfPpiX8MLiRf29ZCwLHCznlhrrCrxczo7cr-crzTqEfql3VkQtUU5jBNrjHa4HbAeEcEFx8fcHlZoyELpRZa3TJJfhQEjxgsw0xxlfZ1OFS2wsvWEiroq94Z1NRM4Y05Wa97u_AQtQE6wJhGk1NyjUGmmztYrzkpZef7bJMUDvU3vrMKPzdda-1yHMf7Uf6p43FLg_PZjlVhgugOptbXTW5QCQgdT8DiDLN43NN7dBGnxQoIll6zIMo5nq3P2TR_LnAoF8gobOBW53M1KXIWfsyXYQch0eErSGiYwy0wb8z85N7q-8bclkcNRTwKK2glMLkQEXQPEf0cCjLa13pvQEf54e3ta-bUFhMjexZtd7qxZiueGouJ9jgfdtHBRLThBLb5xiqSZpgYk9HwAJAEDNNTv-iQJp-EUgyYb-1L_oAtujarNyjcly3wtrllKyM_PSs