name: Compose authored instruction identities
on:
  push:
    branches: [ops/instruction-coverage-20260915]
permissions:
  contents: read
jobs:
  authoring:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 6
    steps:
      - name: Compose original annotations with the installed native source reader
        shell: bash
        run: |
          set -euo pipefail
          umask 0077
          evidence="/build/laplace/work/instruction-authoring/${GITHUB_RUN_ID}"
          mkdir -p "$evidence"
          cd "$evidence"
          cat > 'Authoring.csproj' <<'LAPLACE_AUTHORING_INPUT_EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <FrameworkReference Include="Microsoft.AspNetCore.App" />
              <Reference Include="$(LaplacePayload)/*.dll" />
            </ItemGroup>
          </Project>
          LAPLACE_AUTHORING_INPUT_EOF
          cat > 'Program.cs' <<'LAPLACE_AUTHORING_INPUT_EOF'
          using System.Reflection;
          using System.Security.Cryptography;
          using System.Text.Json;
          using Laplace.Decomposers.Abstractions;
          using Laplace.Decomposers.Operational;
          using Laplace.Decomposers.UD;
          using Laplace.Engine.Core;
          using Laplace.SubstrateCRUD;
          
          // Authoring only: executes the existing source composer into an in-memory
          // change. No database connection, writer, source registration, or consensus fold.
          CodepointPerfcache.LoadDefault();
          LanguageReference.EnsureLoaded();
          var output = new List<object>();
          var reader = typeof(OperationalDecomposer).GetMethod("ReadContractAsync", BindingFlags.Static | BindingFlags.NonPublic)
              ?? throw new InvalidOperationException("Installed operational source reader is absent.");
          foreach (string path in args)
          {
              string name = Path.GetFileName(path);
              var task = (Task<GrammarComposeRecord>)reader.Invoke(null,
                  new object?[] { path, "seeds/operational/exemplars/" + name, CancellationToken.None, null, null })!;
              var record = await task;
              var handler = new GrammarComposeHandler(OperationalSource.SourceId, SourceTrust.SubstrateMandate, null);
              using var unit = handler.CreateDeferredUnit(record);
              var builder = new SubstrateChangeBuilder(OperationalSource.SourceId, "source-authoring");
              Hash128 file = unit.DrainInto(builder, SourceTrust.SubstrateMandate, null);
              handler.WalkWitness(record, file, builder, unit);
              var change = builder.Build();
              try
              {
                  var parseClaim = change.Attestations.Single(x => x.TypeId == RelationTypeRegistry.Resolve("HAS_PARSE").Id);
                  var structure = change.Physicalities.Single(x => x.EntityId == parseClaim.ObjectId && x.Type == PhysicalityType.ParseStructure);
                  var flat = Trajectory.Constituents(structure.TrajectoryXyzm!);
                  if (!UdParseStructure.TryDecode(flat, out var parse) || parse is null)
                      throw new InvalidOperationException("Native source composition did not produce a complete UD structure.");
                  if (Hash128.Merkle(EntityTier.Document, flat) != structure.EntityId)
                      throw new InvalidOperationException("Source structure identity does not match its constituents.");
                  output.Add(new {
                      path = name, sha256 = Convert.ToHexString(SHA256.HashData(File.ReadAllBytes(path))).ToLowerInvariant(),
                      file_id = Hex(file), parse_id = Hex(structure.EntityId), language_id = Hex(parse.LanguageId),
                      root_id = Hex(parse.SentenceId),
                      tokens = parse.Tokens.Select((token, index) => new {
                          ordinal = index + 1, token_ref_id = Hex(token.RefId), form_id = Hex(token.FormId),
                          lemma_id = Hex(token.LemmaId), type_id = Hex(token.UposId) }).ToArray()
                  });
              }
              finally { foreach (var stage in change.IntentStages) stage.Dispose(); }
          }
          Console.WriteLine(JsonSerializer.Serialize(new {
              schema = "laplace.operational-source-authoring/v1", scope = "composition-only-no-admission",
              managed = new[] { typeof(OperationalDecomposer).Assembly, typeof(Hash128).Assembly, typeof(SubstrateChangeBuilder).Assembly }
                  .Select(assembly => new { path = assembly.Location, sha256 = Convert.ToHexString(SHA256.HashData(File.ReadAllBytes(assembly.Location))).ToLowerInvariant() }),
              loaded_native = System.Diagnostics.Process.GetCurrentProcess().Modules.Cast<System.Diagnostics.ProcessModule>()
                  .Where(module => Path.GetFileName(module.FileName).StartsWith("liblaplace", StringComparison.Ordinal))
                  .Select(module => module.FileName).Distinct().Select(path => new {
                      path, sha256 = Convert.ToHexString(SHA256.HashData(File.ReadAllBytes(path))).ToLowerInvariant() }),
              t0 = new { path = LaplaceInstall.ResolveT0Perfcache(),
                  sha256 = Convert.ToHexString(SHA256.HashData(File.ReadAllBytes(LaplaceInstall.ResolveT0Perfcache()))).ToLowerInvariant() },
              files = output
          }));
          static string Hex(Hash128 id) => Convert.ToHexString(id.ToBytes()).ToLowerInvariant();
          LAPLACE_AUTHORING_INPUT_EOF
          cat > 'en_definition_question.conllu' <<'LAPLACE_AUTHORING_INPUT_EOF'
          # This is an authored Laplace operational annotation, not an upstream UD corpus observation.
          # Token 4 is the prospective variable occurrence. This annotation declares no task or answer.
          # sent_id = laplace-operational-definition-question-telescope-v1
          # text = What is a telescope?
          1	What	what	PRON	_	PronType=Int	0	root	_	_
          2	is	be	AUX	_	Mood=Ind|Number=Sing|Person=3|Tense=Pres|VerbForm=Fin	1	cop	_	_
          3	a	a	DET	_	Definite=Ind|PronType=Art	4	det	_	_
          4	telescope	telescope	NOUN	_	Number=Sing	1	nsubj	_	SpaceAfter=No
          5	?	?	PUNCT	_	_	1	punct	_	_
          
          LAPLACE_AUTHORING_INPUT_EOF
          cat > 'en_context_definition.conllu' <<'LAPLACE_AUTHORING_INPUT_EOF'
          # This is an authored Laplace operational annotation, not an upstream UD corpus observation.
          # Tokens 4 and 6 are prospective subject and context variables. No task, fact or answer is declared here.
          # sent_id = laplace-operational-context-definition-rook-shogi-v1
          # text = What is a rook in shogi?
          1	What	what	PRON	_	PronType=Int	0	root	_	_
          2	is	be	AUX	_	Mood=Ind|Number=Sing|Person=3|Tense=Pres|VerbForm=Fin	1	cop	_	_
          3	a	a	DET	_	Definite=Ind|PronType=Art	4	det	_	_
          4	rook	rook	NOUN	_	Number=Sing	1	nsubj	_	_
          5	in	in	ADP	_	_	6	case	_	_
          6	shogi	shogi	NOUN	_	Number=Sing	4	nmod	_	SpaceAfter=No
          7	?	?	PUNCT	_	_	1	punct	_	_
          
          LAPLACE_AUTHORING_INPUT_EOF
          sha256sum Authoring.csproj Program.cs en_definition_question.conllu en_context_definition.conllu > inputs.sha256
          dotnet --version > dotnet-version.txt
          timeout 180s dotnet build Authoring.csproj -m:1 -c Release -p:LaplacePayload=/opt/laplace/app --nologo > build.log 2>&1
          LD_LIBRARY_PATH="/opt/laplace/app:/opt/laplace/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" timeout 120s dotnet bin/Release/net10.0/Authoring.dll en_definition_question.conllu en_context_definition.conllu > authoring.json 2> authoring.stderr
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("authoring.json")
          d=json.loads(p.read_bytes())
          print(json.dumps({"scope":d["scope"],"files":len(d["files"]),"loaded_native":len(d["loaded_native"]),"bytes":p.stat().st_size}))
          PY
      - name: Retain native authoring inputs, identities and output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instruction-authoring-${{ github.run_id }}
          path: |
            /build/laplace/work/instruction-authoring/${{ github.run_id }}/*.csproj
            /build/laplace/work/instruction-authoring/${{ github.run_id }}/*.cs
            /build/laplace/work/instruction-authoring/${{ github.run_id }}/*.conllu
            /build/laplace/work/instruction-authoring/${{ github.run_id }}/*.json
            /build/laplace/work/instruction-authoring/${{ github.run_id }}/*.sha256
            /build/laplace/work/instruction-authoring/${{ github.run_id }}/*.log
            /build/laplace/work/instruction-authoring/${{ github.run_id }}/*.txt
            /build/laplace/work/instruction-authoring/${{ github.run_id }}/*.stderr
          if-no-files-found: warn
          retention-days: 30
