          test "$(git hash-object extension/laplace_substrate/src/physicality_descriptor_admission.c)" = 8ff541d2fefd2c3813d423879a4587b42c81860e
          git diff --exit-code
          
      - name: Execute existing SQL transport probe with actual PostgreSQL 18 headers
        shell: bash
        run: |
          set -euo pipefail
          qualification_dir="$QUALIFICATION_DIR"
          pg_source="$qualification_dir/external/postgresql"
          test "$(git -C "$pg_source" rev-parse HEAD)" = 724edf9bde9d356724ad384a2e196edc3c9f80f7
          (
            cd "$pg_source"
            timeout --signal=TERM --kill-after=10s 180s ./configure \
              --prefix="$qualification_dir/pg-header-prefix" \
              --without-readline --without-zlib --without-icu --without-lz4 --without-zstd
            timeout --signal=TERM --kill-after=10s 180s make -C src/backend generated-headers --jobs=2
          ) 2>&1 | tee "$qualification_dir/evidence/pg-headers.log"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ["QUALIFICATION_DIR"]);repo=Path.cwd()
          source=root/"probe-cmake";source.mkdir()
          (source/"CMakeLists.txt").write_text("\n".join([
              "cmake_minimum_required(VERSION 3.20)",
              "project(laplace_existing_pg_native_probe LANGUAGES C)",
              "set(CMAKE_C_STANDARD 17)",
              "enable_testing()",
              'add_library(laplace_core SHARED IMPORTED GLOBAL)',
              f'set_target_properties(laplace_core PROPERTIES IMPORTED_LOCATION "{root}/build/core/liblaplace_core.so" INTERFACE_INCLUDE_DIRECTORIES "{repo}/engine/core/include")',
              f'set(LAPLACE_PG_INCLUDEDIR_SERVER "{root}/external/postgresql/src/include")',
              f'set(LAPLACE_PG_PKGLIBDIR "{root}/not-a-postgres-install")',
              'set(LAPLACE_PG_MAJOR 18)',
              f'add_subdirectory("{repo}/extension/laplace_substrate/tests" probe)',
              ""
          ]))
          PY
          timeout --signal=TERM --kill-after=10s 60s cmake -S "$qualification_dir/probe-cmake" -B "$qualification_dir/probe-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee "$qualification_dir/evidence/pg-probe-configure.log"
          timeout --signal=TERM --kill-after=10s 120s cmake --build "$qualification_dir/probe-build" --target physicality_descriptor_pg_native_probe --parallel 2 \
            2>&1 | tee "$qualification_dir/evidence/pg-probe-build.log"
          timeout --signal=TERM --kill-after=10s 120s "$qualification_dir/probe-build/probe/physicality_descriptor_pg_native_probe" \
            2>&1 | tee "$qualification_dir/evidence/pg-probe.log"
          python3 - <<'PY' 2>&1 | tee "$qualification_dir/evidence/pg-probe-result.log"
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ["QUALIFICATION_DIR"]);evidence=root/"evidence"
          output=(evidence/"pg-probe.log").read_text()
          matches=re.findall(r"^physicality PG native helpers: ([0-9]+) checks; fake SPI calls=([0-9]+); backend/PostGIS executions=0$",output,re.M)
          if len(matches)!=1 or int(matches[0][0])<1:raise RuntimeError("missing complete existing probe receipt")
          files=[root/"probe-build/probe/physicality_descriptor_pg_native_probe",
                 root/"external/postgresql/src/include/pg_config.h",
                 root/"external/postgresql/src/include/pg_config_ext.h",
                 root/"external/postgresql/src/include/postgres.h"]
          identities=[{"path":str(p),"bytes":p.stat().st_size,"sha256":hashlib.file_digest(p.open("rb"),"sha256").hexdigest()} for p in files]
          result={"schema":"laplace.existing-pg-native-helper-qualification/v1","status":"passed",
                  "product_candidate":"6cef77a55870103657f9494dd83e84d87e7f3ab6",
                  "source_commit":os.environ["GITHUB_SHA"],"checks":int(matches[0][0]),"fake_spi_calls":int(matches[0][1]),
                  "postgres_source":"724edf9bde9d356724ad384a2e196edc3c9f80f7","backend_executions":0,
                  "scope":"Existing production transport helper probe with real generated PostgreSQL18 headers and same ordinary native library; existing controlled PG/SPI services; no backend, PostGIS, installed admission or throughput claim",
                  "artifacts":identities}
          (evidence/"pg-probe-result.json").write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          print(json.dumps(result,sort_keys=True))
          PY
          test "$(git hash-object extension/laplace_substrate/src/physicality_descriptor_admission.c)" = 8ff541d2fefd2c3813d423879a4587b42c81860e
          test "$(git hash-object extension/laplace_substrate/tests/physicality_descriptor_native_probe.c)" = 9ef9074027e910cb6b25f5786bbaa3c13cbaa27e
          git diff --exit-code

      - name: Retain native controls, actual Unicode floor and source bindings
        id: artifact
        if: always() && env.QUALIFICATION_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physicality-capture-sql-helpers-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.QUALIFICATION_DIR }}/evidence/
            ${{ env.QUALIFICATION_DIR }}/build/core/liblaplace_core.so*
            ${{ env.QUALIFICATION_DIR }}/build/core/perfcache/laplace_t0_perfcache.bin
            ${{ env.QUALIFICATION_DIR }}/build/CMakeCache.txt
            ${{ env.QUALIFICATION_DIR }}/probe-build/probe/physicality_descriptor_pg_native_probe
            ${{ env.QUALIFICATION_DIR }}/probe-build/CMakeCache.txt
            ${{ env.QUALIFICATION_DIR }}/probe-cmake/CMakeLists.txt
          if-no-files-found: error
          retention-days: 90
      - name: Print retained artifact identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          printf 'artifact_id=%s\nartifact_sha256=%s\n' "$ARTIFACT_ID" "$ARTIFACT_SHA256"
