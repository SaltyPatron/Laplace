<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:705px;height:1329px;background:#FAFCFF;" width="705px" height="1329px" viewBox="0 0 705 1329" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="705" height="1329" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="7"><text x="160.269" y="34.533" fill="#000" font-size="14" textLength="383.154" font-weight="700">Monorepo — native Unicode snapshot, ranks and staging</text></g><ellipse cx="356.854" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="198.117" y="93.609" width="317.475" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="208.117" y="116.066" fill="#000" font-size="12" textLength="297.475">Allocate fixed-window records; retain inflated XML bytes</text><rect x="179.098" y="148.703" width="355.514" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="189.098" y="171.16" fill="#000" font-size="12" textLength="335.514">Initialize segmentation/combining/whitespace arrays to defaults</text><rect x="154.087" y="203.797" width="405.535" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="164.087" y="226.254" fill="#000" font-size="12" textLength="385.535">Parse repertoire events; inherit group attributes unless locally overridden</text><rect x="201.439" y="258.891" width="310.83" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="211.439" y="281.348" fill="#000" font-size="12" textLength="290.83">Recognize char, reserved, surrogate and noncharacter</text><rect x="219.138" y="313.984" width="275.434" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="229.138" y="336.441" fill="#000" font-size="12" textLength="255.434">Expand cp or first-cp/last-cp into property arrays</text><rect x="156.097" y="369.078" width="401.516" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="166.097" y="391.535" fill="#000" font-size="12" textLength="381.516">Read single-codepoint DUCET entries; retain only first collation element</text><rect x="228.791" y="424.172" width="256.127" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="238.791" y="446.629" fill="#000" font-size="12" textLength="236.127">For nonexplicit Hangul use leading-jamo key</text><rect x="127.087" y="479.266" width="459.535" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="137.087" y="501.723" fill="#000" font-size="12" textLength="439.535">Fill remaining keys from declared implicit ranges or hard-coded Han/fallback bands</text><rect x="220.113" y="534.359" width="273.482" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="230.113" y="556.816" fill="#000" font-size="12" textLength="253.482">Sort by packed key, then codepoint; derive rank</text><rect x="236.13" y="646.372" width="241.449" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="246.13" y="668.829" fill="#000" font-size="12" textLength="221.449">Compute open-placement point from rank</text><rect x="222.782" y="701.466" width="268.145" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="232.782" y="723.923" fill="#000" font-size="12" textLength="248.145">Compute Hilbert128 and hash UTF8 codepoint</text><rect x="175.427" y="756.56" width="362.855" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="185.427" y="779.017" fill="#000" font-size="12" textLength="342.855">Pack segmentation/combining/whitespace flags and store record</text><polygon points="307.631,589.453,406.078,589.453,418.078,601.453,406.078,613.453,307.631,613.453,295.631,601.453,307.631,589.453" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="360.854" y="624.872" fill="#000" font-size="11" textLength="17.118">yes</text><text x="307.631" y="605.954" fill="#000" font-size="11" textLength="98.447">Codepoint remains?</text><text x="271.16" y="599.036" fill="#000" font-size="11" textLength="24.471">done</text><rect x="178.427" y="833.653" width="356.855" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="188.427" y="856.11" fill="#000" font-size="12" textLength="336.855">Return snapshot; managed wrapper requires fixed record count</text><polygon points="297.225,888.747,416.484,888.747,428.484,900.747,416.484,912.747,297.225,912.747,285.225,900.747,297.225,888.747" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="297.225" y="905.248" fill="#000" font-size="11" textLength="119.26">StageRange requested?</text><text x="268.107" y="898.33" fill="#000" font-size="11" textLength="17.118">yes</text><text x="428.484" y="898.33" fill="#000" font-size="11" textLength="95.981">semantic XML pass</text><rect x="16" y="922.747" width="336.863" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="945.204" fill="#000" font-size="12" textLength="316.863">Validate bounds; hold snapshot reference across native call</text><rect x="22.68" y="977.841" width="323.504" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="32.68" y="1000.298" fill="#000" font-size="12" textLength="303.504">One crossing stages contiguous entities and physicalities</text><rect x="17.682" y="1032.935" width="333.5" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="27.682" y="1055.392" fill="#000" font-size="12" textLength="313.5">Managed wrapper requires exactly count rows of each kind</text><rect x="58.372" y="1088.028" width="252.119" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="68.372" y="1110.485" fill="#000" font-size="12" textLength="232.119">Record source span for staged physicalities</text><rect x="372.863" y="922.747" width="312.828" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="382.863" y="945.204" fill="#000" font-size="12" textLength="292.828">Expose bounded-copy stream over retained XML bytes</text><polygon points="356.854,1129.122,368.854,1141.122,356.854,1153.122,344.854,1141.122,356.854,1129.122" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="356.854" cy="1184.122" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="356.854" cy="1184.122" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="356.854" y1="73.609" x2="356.854" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="352.854,83.609,356.854,93.609,360.854,83.609,356.854,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="356.854" y1="128.703" x2="356.854" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="352.854,138.703,356.854,148.703,360.854,138.703,356.854,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="356.854" y1="183.797" x2="356.854" y2="203.797" style="stroke:#181818;stroke-width:1;"/><polygon points="352.854,193.797,356.854,203.797,360.854,193.797,356.854,197.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-lin