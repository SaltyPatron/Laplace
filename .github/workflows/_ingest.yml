name: _ingest (reusable phase core)

# One implementation of the ingest → (idempotency) → (gate) contract, called by
# every seed-*.yml phase workflow. Staged-and-gated (seed-models.yml extends the
# same shape with synthesize/verify) but source-agnostic: the phase workflow
# supplies the source, path, and which verifications apply. No per-source tuning lives here — worker/commit sizing is
# machine-sized inside the CLI (IngestSizing/CpuTopology); language scope is the
# one operator knob (LAPLACE_INGEST_LANGS, blank = ALL, the witness-manifest law).
#
# Assumes the runner already carries a deployed build (run laplace.yml first if the
# schema or engine changed). Ingest writes PG directly through the CLI — no API dep.

on:
  workflow_call:
    inputs:
      source:
        description: "ingest-source.sh source key (single source per call)"
        type: string
        required: true
      path:
        description: "optional <path> — single file, bare dir, or corpus root (IngestInput.ResolveFiles)"
        type: string
        default: ""
      langs:
        description: "LAPLACE_INGEST_LANGS scope (blank = ALL languages — the default and the law)"
        type: string
        default: ""
      database:
        description: "target DB (one database: laplace)"
        type: string
        default: laplace
      timeout_minutes:
        description: "ingest job timeout — sized to the phase, never the silent 360 default"
        type: number
        default: 720
      run_gate:
        description: "run scripts/decomposer-gate-check.py (only for sources present in decomposer-gates.json)"
        type: boolean
        default: true
      run_idempotency:
        description: "re-ingest and prove the attestation count is stable (no double-count)"
        type: boolean
        default: false
      index_cycle_defer:
        description: >-
          Campaign participation ONLY — default false. When a fresh-full-build campaign has
          dropped the plain secondary indexes up front (`drop-indexes`) and will rebuild them
          once at the end (`recover-indexes`), set this so THIS phase COPYs into the index-free
          heaps without rebuilding the campaign's drops at its run start
          (LAPLACE_INDEX_CYCLE_DEFER). Leave false for every individual re-dispatch: a lone
          source is an increment, and this phase does NOT drop or rebuild anything on its own —
          the drop/rebuild bracket is owned by the campaign, never by a single-source call.
        type: boolean
        default: false

# No GitHub concurrency group: a group retains only one pending run and is not
# a FIFO queue. Database serialization is enforced by the ingest mutex.
# Two of four died and needed manual re-runs hours later. A group that silently
# discards queued work is worse than no group: the ingest never started, so
# nothing warned anybody.
#
# Serialization now comes from the runner (one job at a time) plus the explicit
# wait below, which BLOCKS instead of cancelling.

permissions:
  contents: read

env:
  LAPLACE_DATA_ROOT: /vault/Data
  # Journal + ops CSV are the ingest record; keep the job log short.
  LAPLACE_INGEST_CONSOLE: ci
  # Empty (the default) = no cycling: NpgsqlIndexCycle.Deferred reads only "1"/"true".
  # Only a campaign sets index_cycle_defer=true, and even then this phase merely refrains
  # from rebuilding the campaign's up-front drops — it never drops or rebuilds on its own.
  LAPLACE_INDEX_CYCLE_DEFER: ${{ inputs.index_cycle_defer && '1' || '' }}
  # Master switch ON for every seed dispatch (2026-08-13). With it unset, single-source
  # runs paid live secondary-index maintenance for every row — measured 2026-08-12:
  # attestation COPY at 4.2k rows/s and 21.3KB WAL per consensus insert with all nine
  # indexes live, vs 7.5KB with them cycled. The volume gates still protect small runs:
  # cycling fires only once a run's CUMULATIVE staged rows cross MinRowsToCycle and the
  # live-fraction gate below; the run-end rebuild is one sort-based build per index.
  LAPLACE_INDEX_CYCLE: '1'
  # GiST/GIN/expression-heavy tables win from cycling well below staged==live (the
  # knob's own documentation); 0.2 lets a UD/document-scale increment cycle after the
  # first ~2-3M rows instead of paying per-row maintenance for the whole run.
  LAPLACE_INDEX_CYCLE_MIN_FRACTION: '0.2'

jobs:
  ingest:
    name: "ingest ${{ inputs.source }} → ${{ inputs.database }}"
    runs-on: [self-hosted, laplace]
    concurrency:
      # PER SOURCE, NOT GLOBAL. Ten different corpora ingesting at once is a capacity
      # question, not a correctness one: the write path is built for concurrent COPY
      # (apply partitions, id-range connections), rows are content-addressed, and
      # consensus accumulates. Serialising every seed behind every other seed would be
      # baking one dev box's limits into the architecture.
      #
      # Same source + same database DOES serialise: two concurrent runs of one source
      # race on its completion marker and on the marker-gated novelty probes.
      #
      # Never cancelled. A seed is dispatched by hand -- explicitly wanted, often hours
      # long -- and #784 already made this call for the same reason.
      group: laplace-ingest-${{ inputs.source }}-${{ inputs.database }}
      cancel-in-progress: false
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    # Wall-clock, published so a throughput baseline has something to read. Before this
    # no seed run in CI history recorded its own duration -- timeout-minutes is a ceiling,
    # not a measurement, and nothing downstream could tell a 20-minute seed from a
    # 10-hour one that happened to finish.
    outputs:
      elapsed_s: ${{ steps.run_ingest.outputs.elapsed_s }}
      # A PREEMPTED run reports green (#S5) so the seed lane's red keeps meaning
      # "something is broken". Green is not certified: every gate below refuses to
      # run on it, so nothing reads a bounce-killed seed as a completed one.
      preempted: ${{ steps.run_ingest.outputs.preempted }}
    env:
      LAPLACE_DB: "Host=/var/run/postgresql;Username=laplace_admin;Database=${{ inputs.database }}"
      PGDATABASE: ${{ inputs.database }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, clean: false }
      - uses: ./.github/actions/setup-laplace-env

      - name: Wait for the substrate to be free
        # THE QUEUE, done properly. This BLOCKS; it never discards work.
        # One ingest at a time is substrate law (CLAUDE.md, Operations), and
        # the GitHub concurrency group that used to enforce it silently
        # cancelled queued seeds instead of queueing them -- see the comment at
        # the top of this file.
        #
        # An active COPY on the target database means an ingest is running.
        # Wait it out rather than fighting it: a second concurrent ingest
        # contends on the same apply lock and index cycle, so it is slower for
        # both AND violates the law. Timeout is generous because a real corpus
        # ingest legitimately runs for hours.
        timeout-minutes: 600
        run: |
          for i in $(seq 1 3600); do
            busy=$(psql -h /var/run/postgresql -U laplace_admin -d "${{ inputs.database }}" -tAc \
              "SELECT count(*) FROM pg_stat_activity
                WHERE datname = current_database() AND state = 'active'
                  AND query ILIKE 'COPY laplace.%'" 2>/dev/null || echo 0)
            if [ "${busy:-0}" -eq 0 ]; then
              [ "$i" -gt 1 ] && echo "substrate free after $((i*10))s"
              exit 0
            fi
            [ $((i % 30)) -eq 1 ] && echo "waiting: $busy active COPY — another ingest holds the substrate (${i}0s elapsed)"
            sleep 10
          done
          echo "::error::still busy after 10h — refusing to start a second concurrent ingest"
          exit 1

      - name: Ingest
        id: run_ingest
        run: |
          # Unset LAPLACE_INGEST_LANGS = ALL languages (witness-manifest law).
          # Narrowing a run is an explicit operator decision via the langs input.
          langs="${{ inputs.langs }}"
          [ -n "$langs" ] && export LAPLACE_INGEST_LANGS="$langs"
          echo "source=${{ inputs.source }} db=${{ inputs.database }} path='${{ inputs.path }}' langs='${LAPLACE_INGEST_LANGS:-}' (empty=all)"
          echo "validate via ingest_run_journal (LAPLACE_INGEST_CONSOLE=ci); detail log under RUNNER_TEMP"
          if [ -n "${{ inputs.path }}" ]; then
            scripts/ingest-source.sh "${{ inputs.source }}" "${{ inputs.path }}"
          else
            scripts/ingest-source.sh "${{ inputs.source }}"
          fi

      - name: Journal proof
        if: always() && steps.run_ingest.outcome == 'success' && steps.run_ingest.outputs.preempted != 'true'
        run: scripts/verify-ingest-journal.sh --cli-key "${{ inputs.source }}"

      - name: Throughput gate — ingest-baseline check
        # RESTORED 2026-08-13. ingest-baseline.py's check mode existed with ZERO
        # callers — its own header: "no gate compared against one, so 'the seed
        # is slow' was an opinion for fourteen months." A slow seed is now a
        # named failure. Tolerance (1.5x, in the script) catches 2x regressions
        # and ignores shared-box noise; sources without a recorded baseline
        # pass with a notice ("recording is a separate step"). Re-baseline ONLY
        # after a deliberate perf change, never to make a red run green:
        #   python3 scripts/ingest-baseline.py record <detail log>
        if: always() && steps.run_ingest.outcome == 'success' && steps.run_ingest.outputs.preempted != 'true'
        run: |
          python3 scripts/ingest-baseline.py check \
            "$RUNNER_TEMP/laplace-ingest/laplace-ingest-${{ inputs.source }}.log"

  idempotency:
    name: "verify — re-ingest ${{ inputs.source }} does not double-count"
    needs: ingest
    if: ${{ inputs.run_idempotency && needs.ingest.result == 'success' && needs.ingest.outputs.preempted != 'true' }}
    runs-on: [self-hosted, laplace]
    concurrency:
      # PER SOURCE, NOT GLOBAL. Ten different corpora ingesting at once is a capacity
      # question, not a correctness one: the write path is built for concurrent COPY
      # (apply partitions, id-range connections), rows are content-addressed, and
      # consensus accumulates. Serialising every seed behind every other seed would be
      # baking one dev box's limits into the architecture.
      #
      # Same source + same database DOES serialise: two concurrent runs of one source
      # race on its completion marker and on the marker-gated novelty probes.
      #
      # Never cancelled. A seed is dispatched by hand -- explicitly wanted, often hours
      # long -- and #784 already made this call for the same reason.
      group: laplace-ingest-${{ inputs.source }}-${{ inputs.database }}
      cancel-in-progress: false
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    env:
      LAPLACE_DB: "Host=/var/run/postgresql;Username=laplace_admin;Database=${{ inputs.database }}"
      PGDATABASE: ${{ inputs.database }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, clean: false }
      - uses: ./.github/actions/setup-laplace-env

      - name: Re-ingest must be a no-op on the evidence count
        run: |
          P(){ psql -d "${{ inputs.database }}" -U laplace_admin -v ON_ERROR_STOP=1 -tAc "$1"; }
          # Scope the proof to THIS source's evidence — the indexed
          # evidence_count(p_source => source_id(..)) ensure-foundation.sh
          # gates on — instead of two full count(*) sweeps over attestations.
          # Sources without a decomposer-gates.json entry (code lane) keep the
          # unscoped count; the source key -> decomposer source name mapping
          # lives only in that manifest.
          src_name=$(python3 -c "import json; e=json.load(open('scripts/decomposer-gates.json'))['sources'].get('${{ inputs.source }}'); print(e['decomposer'] if e else '')")
          if [ -n "$src_name" ]; then
            count_sql="SELECT ops.evidence_count(p_source => laplace.source_id('$src_name'));"
            scope="evidence for source $src_name"
          else
            count_sql="SELECT count(*) FROM laplace.attestations;"
            scope="attestations (unscoped — '${{ inputs.source }}' not in decomposer-gates.json)"
          fi
          before=$(P "$count_sql")
          echo "$scope before re-ingest: ${before}"
          langs="${{ inputs.langs }}"; [ -n "$langs" ] && export LAPLACE_INGEST_LANGS="$langs"
          if [ -n "${{ inputs.path }}" ]; then
            scripts/ingest-source.sh "${{ inputs.source }}" "${{ inputs.path }}"
          else
            scripts/ingest-source.sh "${{ inputs.source }}"
          fi
          after=$(P "$count_sql")
          echo "$scope after  re-ingest: ${after}"
          [ "${before}" = "${after}" ] || {
            echo "::error::idempotency broken — ${scope} grew ${before} → ${after} on re-ingest (double-count)"; exit 1; }
          echo "::notice::idempotent — ${scope} unchanged at ${after} on re-ingest"

  gate:
    name: "gate — ${{ inputs.source }} consensus checks"
    needs: [ingest, idempotency]
    # always(): idempotency is skipped when run_idempotency=false; still gate once ingest is green.
    if: ${{ always() && inputs.run_gate && needs.ingest.result == 'success' && needs.ingest.outputs.preempted != 'true' && needs.idempotency.result != 'failure' }}
    runs-on: [self-hosted, laplace]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, clean: false }
      - uses: ./.github/actions/setup-laplace-env

      - name: Decomposer consensus + layer gates
        run: |
          python3 scripts/decomposer-gate-check.py \
            --source "${{ inputs.source }}" \
            --dbname "${{ inputs.database }}" \
            --host /var/run/postgresql \
            --user laplace_admin
