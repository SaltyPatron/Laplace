name: DB — lifecycle ops

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "database operation"
        type: choice
        required: true
        default: status
        options: [status, migrate, repair, reindex, remigrate, recreate]
      confirm:
        description: "type the database name to authorize recreate"
        type: string
        required: false
        default: ""
      database:
        description: "target database"
        type: choice
        options: [laplace]
        default: laplace

permissions:
  contents: read

concurrency:
  group: laplace-substrate-lifecycle
  cancel-in-progress: false

jobs:
  db:
    name: "DB — ${{ inputs.operation }}"
    runs-on: [self-hosted, laplace]
    timeout-minutes: ${{ inputs.operation == 'reindex' && 720 || 60 }}
    env:
      PGHOST: /var/run/postgresql
      PGPORT: 5432
      PGUSER: laplace_admin
      PGDATABASE: ${{ inputs.database }}
    steps:
      - name: Checkout exact revision
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --prune --depth=2 origin "$TARGET_SHA"
          git checkout --force "$TARGET_SHA"

      - uses: ./.github/actions/setup-laplace-env

      - name: Run requested database operation
        run: |
          set -euo pipefail
          op='${{ inputs.operation }}'
          db='${{ inputs.database }}'

          if [[ "$op" == recreate && '${{ inputs.confirm }}' != "$db" ]]; then
            echo "::error::recreate is destructive; type '$db' in confirm"
            exit 1
          fi

          case "$op" in
            recreate|remigrate|reindex)
              busy=$(psql -X -Atqc "SELECT count(*) FROM pg_stat_activity WHERE datname=current_database() AND pid<>pg_backend_pid() AND state='active' AND query ILIKE 'COPY laplace.%'" || echo 0)
              if [[ "${busy:-0}" != 0 ]]; then
                echo "::error::$busy active ingest COPY session(s); refusing structural mutation instead of waiting for hours"
                exit 1
              fi
              ;;
          esac

          migration=""
          for candidate in \
            "${LAPLACE_BUILD_ROOT:-}/app/bin/Laplace.Migrations/Release/net10.0/Laplace.Migrations.dll" \
            "$PWD/app/Laplace.Migrations/bin/Release/net10.0/Laplace.Migrations.dll"; do
            [[ "$candidate" == /* && -f "$candidate" ]] || continue
            migration="$candidate"
            break
          done

          require_migration() {
            [[ -n "$migration" ]] || {
              echo "::error::prebuilt migration runtime not found; build/deploy owns compilation"
              exit 1
            }
          }

          case "$op" in
            status)
              require_migration
              dotnet "$migration" status
              bash scripts/check-database-health.sh "$db"
              ;;
            migrate)
              require_migration
              dotnet "$migration" up
              bash scripts/check-database-health.sh "$db"
              ;;
            repair)
              bash scripts/pipeline.sh sync-extension tune-pg tune-laplace perfcache-guc
              bash scripts/check-database-health.sh "$db"
              ;;
            remigrate)
              require_migration
              dotnet "$migration" reset --yes
              dotnet "$migration" up
              bash scripts/check-database-health.sh "$db"
              ;;
            recreate)
              require_migration
              dotnet "$migration" nuke --yes
              dotnet "$migration" up
              bash scripts/pipeline.sh sync-extension tune-pg tune-laplace perfcache-guc
              bash scripts/check-database-health.sh "$db"
              ;;
            reindex)
              P(){ psql -X -v ON_ERROR_STOP=1 -Atqc "$1"; }
              while IFS=$'\t' read -r idx def; do
                [[ -n "$idx" ]] || continue
                def=${def/ ON ONLY / ON }
                echo "rebuilding $idx"
                P "DROP INDEX IF EXISTS $idx"
                P "$def"
              done < <(P "SELECT n.nspname || '.' || c.relname || E'\\t' || pg_get_indexdef(i.indexrelid) FROM pg_index i JOIN pg_class c ON c.oid=i.indexrelid JOIN pg_class t ON t.oid=i.indrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='laplace' AND NOT i.indisvalid ORDER BY c.relname")
              remaining=$(P "SELECT count(*) FROM pg_index i JOIN pg_class t ON t.oid=i.indrelid JOIN pg_namespace n ON n.oid=t.relnamespace WHERE n.nspname='laplace' AND NOT i.indisvalid")
              [[ "$remaining" == 0 ]] || { echo "::error::$remaining invalid indexes remain"; exit 1; }
              bash scripts/check-database-health.sh "$db"
              ;;
          esac
