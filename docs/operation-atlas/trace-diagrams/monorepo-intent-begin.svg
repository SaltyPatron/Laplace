"#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="156.79" y="932.518" fill="#888" font-size="10" textLength="405.747">claimed. Complete prompt_intent.h reviewed. Prompt structure parsing and native trajectory</text><text x="157.334" y="945.096" fill="#888" font-size="10" textLength="404.658">readers remain nested. The structural envelope is checked after complete native responses</text><text x="157.878" y="957.674" fill="#888" font-size="10" textLength="403.569">are read. Staging prevents the same structural pass from propagating through newly added</text><text x="165.112" y="970.252" fill="#888" font-size="10" textLength="389.102">targets. Discourse binding separately validates one-dimensional 16-byte IDs and retains</text><text x="249.329" y="982.83" fill="#888" font-size="10" textLength="220.669">order without granting current-observation origins.</text></g><?plantuml-src RLLTRnit47o_Nx507setbHJBbYnOA8hKZf40JL1KUHVsoBqxrYVoIlBqyTOVqL_ONv8XJrBae81XI7VSsTcPuUf7UhyrMgoI1_gTkvQLJ6GVnGRZxAGTdgn3NuReESeaU3NflDjqSMqiZiLnGwiFxwQpELLJlPYLRzNTGhYSpgUtwksTPZMzh-PtStM_k9dF5rhD5dEPJXVpXT9og_Jzh2nlrKpAIehmOcp7dZTKidgflUkjVdIjy_J3yxldn-VdYnEXOUrsnjPKSHikQxLKtBVnsTducJT2AxPX9TvKHJIn5VhahFFIEVhldtzfrpWyScKGl-M8aOcj9ipQgzXxRWcpRiKoz2b2P1-BXqSl48A6wSdjh6Wg3-Jbxrv2f8rid3-GGdlekCJpoCQIx5b557Lz9EzSp7qQzXe7sg5pKAwJ9Hfmc_icZKzCPArStxMof2stHYS2JgdU--JSn3ejgU8lKHa9PsqCWFhDe8kmQiWwQtlWVgkYZqyK7PaOo7bJWwFpsbXkJtM3DfaipYLIkJSD0F4IQW10HrFHrHVFYKXI8Oz4eU-wreZ-zPfY8vQk3XAk2thuKrXdeI2G-0a-1LZK0niH4orAGd1-4dfr_AJSwAAfyYu4920K5SGQY7Pj7_wFuCSdaAE7J-Bhn5OBy7DhO_kiVY367sa32bOD7es2wxsILtaukPNGtjkjj6d0Nn12w-3iJtGrrAop1VW-epTqS_qp1KxrCGKM1Y5JlchT3YX9iKTutGeyVTKeTA0bI8uIqO7asEqx5J4K-nSgUrrBNCk-uJv4qKlI3gP7AfELV8mXPe6obTcZiU3QqDNEn2R5ymYU0LUHeHBI3iIJjPGrbdtMfwPXoWoU75Xc7bdSa8hrEH5aPKTfmS1P8u1nVdCv9c3nIdmY1Aog6FuFsSYMrk8s4ltXh0XyggBuInGqJLSodCTS9WIyiwTxckRyvkv5QRg7vnROTbOmJOYkAofq5r-iygWZBriZkpoPQYHlGyHWJ9yboKr1Den1L