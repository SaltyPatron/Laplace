name: Complete native source changes
on:
  push:
    branches: [fix/native-highway-pending-completion-20260915]
    paths: [.github/workflows/source-transfer.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply exact native lifetime correction and removed SQL accounting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ea640065637f9c6f96a1e50b34d9d4b0b7197f3b418425f05bbc64f5a1936895'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm .github/workflows/source-transfer.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve native recall result lifetime and remove completed SQL vocabulary accounting'
          git push origin HEAD:refs/heads/fix/native-highway-pending-completion-20260915
          git show --stat --oneline HEAD
