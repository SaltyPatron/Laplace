name: Data — foundation ingest
run-name: "Foundation ingest — ${{ inputs.source }} → ${{ inputs.database }}"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "What to ingest; ladder runs the ordered foundation campaign"
        type: choice
        required: true
        default: ladder
        options: [ladder, unicode, iso639, operational, cili, wordnet, verbnet, propbank, framenet, mapnet, wordframenet, semlink]
      advanced_path_override:
        description: "ADVANCED: local file/directory override for a single source; normally leave blank"
        type: string
        required: false
        default: ""
      database:
        description: "target database"
        type: choice
        options: [laplace]
        default: laplace
      force:
        description: "Ladder only: re-ingest every rung instead of completing only missing work"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  seed:
    if: inputs.source != 'ladder'
    uses: ./.github/workflows/seed.yml
    with:
      mode: source
      source: ${{ inputs.source }}
      path: ${{ inputs.advanced_path_override }}
      database: ${{ inputs.database }}

  ladder:
    if: inputs.source == 'ladder'
    uses: ./.github/workflows/seed.yml
    with:
      mode: foundation-ladder
      database: ${{ inputs.database }}
      force: ${{ inputs.force }}
