name: Hosted recorded floor placement controls
on:
  push:
    branches: [qualify/native-admission-footprint-o1-20260916]
permissions:
  contents: read
jobs:
  python-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CANDIDATE_SHA: a0f7506c6f4ecb9340095e501b014b036bf7718c
      CANDIDATE_TREE: 9bb0a65248b060a5da62dfcb398b4f8444750cd2
    steps:
      - name: Prepare permanent owned source and evidence paths
        shell: bash
        run: |
          set -euo pipefail
          for parent in /build/laplace/work /build/laplace/worktrees; do
            if [[ ! -d "$parent" ]]; then
              sudo install -d -m 2775 -o "$(id -u)" -g "$(id -g)" "$parent"
            fi
            test -w "$parent"
          done
          work="/build/laplace/work/export-placement-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          source="/build/laplace/worktrees/export-placement-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$work"
          test ! -e "$source"
          mkdir -m 0700 "$work"
          mkdir -m 0700 "$work/tmp" "$work/evidence"
          printf 'QUALIFICATION_DIR=%s\nQUALIFICATION_SOURCE=%s\nTMPDIR=%s/tmp\nTMP=%s/tmp\nTEMP=%s/tmp\n' "$work" "$source" "$work" "$work" "$work" >> "$GITHUB_ENV"
      - name: Read exact source candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a0f7506c6f4ecb9340095e501b014b036bf7718c
          fetch-depth: 1
          persist-credentials: false
      - name: Bind permanent candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          git worktree add --detach "$QUALIFICATION_SOURCE" "$CANDIDATE_SHA"
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["QUALIFICATION_DIR"])/"evidence"
          value={"candidate":os.environ["CANDIDATE_SHA"],"tree":os.environ["CANDIDATE_TREE"],
                 "workflow_commit":os.environ["GITHUB_SHA"],
                 "scope":"Python source syntax and real filesystem/process controls; no native, database, or installed GUI execution",
                 "python":subprocess.check_output(["python3","--version"],text=True).strip()}
          (root/"source.json").write_text(json.dumps(value,indent=2)+"\n")
          PY
      - name: Execute all thirteen existing and new export controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$QUALIFICATION_SOURCE"
          timeout --signal=TERM --kill-after=10s 120s python3 - <<'PY' 2>&1 | tee "$QUALIFICATION_DIR/evidence/controls.log"
          import ast,importlib.util,json,os,sys,unittest
          from pathlib import Path
          for filename in ("export-qualified-chess-floors.py","test-qualified-chess-floor-export.py"):
              path=Path("scripts")/filename
              ast.parse(path.read_text(encoding="utf-8"),filename=str(path))
              print(str(path)+": AST passed",flush=True)
          path=Path("scripts/test-qualified-chess-floor-export.py")
          spec=importlib.util.spec_from_file_location("qualified_export_controls",path)
          module=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=module
          spec.loader.exec_module(module)
          suite=unittest.defaultTestLoader.loadTestsFromModule(module)
          count=suite.countTestCases()
          if count!=13: raise RuntimeError("unexpected control count: "+str(count))
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          receipt={"selected":count,"run":result.testsRun,"failed":len(result.failures),
                   "errors":len(result.errors),"skipped":len(result.skipped),
                   "successful":result.wasSuccessful()}
          (Path(os.environ["QUALIFICATION_DIR"])/"evidence/result.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt),flush=True)
          if not result.wasSuccessful() or result.testsRun!=13 or result.skipped: raise SystemExit(1)
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s\n' 'Exact candidate source remained clean.' | tee "$QUALIFICATION_DIR/evidence/clean-source.txt"
      - name: Retain source and control results
        if: always() && env.QUALIFICATION_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recorded-floor-placement-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUALIFICATION_DIR }}/evidence/
          if-no-files-found: error
          retention-days: 90
