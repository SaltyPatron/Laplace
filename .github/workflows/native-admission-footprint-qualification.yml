name: Current nonblocking source contract qualification
on:
  push:
    branches: [qualify/native-admission-footprint-20260916]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      MSBUILDDISABLENODEREUSE: "1"
      TMPDIR: /build/laplace/work/nonblocking-contracts/tmp
      TMP: /build/laplace/work/nonblocking-contracts/tmp
      TEMP: /build/laplace/work/nonblocking-contracts/tmp
      QUALIFICATION_DIR: /build/laplace/work/nonblocking-contracts
      EVIDENCE: /build/laplace/work/nonblocking-contracts/evidence
      DOTNET_CLI_HOME: /build/laplace/work/nonblocking-contracts/dotnet-home
      DOTNET_INSTALL_DIR: /build/laplace/work/nonblocking-contracts/dotnet
      NUGET_PACKAGES: /build/laplace/work/nonblocking-contracts/nuget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d0525974b6616a91ce6a3696b82e808026a83ef1
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare exact source and permanent test workspace
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$EVIDENCE" "$TMPDIR" "$DOTNET_CLI_HOME" "$DOTNET_INSTALL_DIR" "$NUGET_PACKAGES"
          test "$(git rev-parse HEAD)" = d0525974b6616a91ce6a3696b82e808026a83ef1
          test "$(git rev-parse HEAD^{tree})" = 465bd71d64a90b85a54ea3eee1ecc888304e1d4f
          git rev-parse HEAD HEAD^{tree} > "$EVIDENCE/source.txt"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Link actual source-reading classes in a standalone test project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path.cwd()
          work=Path(os.environ["QUALIFICATION_DIR"])/"project"
          work.mkdir()
          files=["app/Laplace.Substrate.Tests/Abstractions/MeasurementLaneGateTests.cs",
                 "app/Laplace.Substrate.Tests/Abstractions/IngestMutexGateTests.cs"]
          project=ET.Element("Project",Sdk="Microsoft.NET.Sdk")
          props=ET.SubElement(project,"PropertyGroup")
          for key,value in {"TargetFramework":"net10.0","ImplicitUsings":"enable","Nullable":"enable",
                            "IsTestProject":"true","IsPackable":"false","UseSharedCompilation":"false"}.items():
              ET.SubElement(props,key).text=value
          packages={x.attrib["Include"]:x.attrib["Version"] for x in ET.parse(root/"app/Directory.Packages.props").getroot().iter("PackageVersion")}
          group=ET.SubElement(project,"ItemGroup")
          for name in ("Microsoft.NET.Test.Sdk","xunit","xunit.runner.visualstudio"):
              ET.SubElement(group,"PackageReference",Include=name,Version=packages[name])
          for path in files:
              ET.SubElement(group,"Compile",Include=str(root/path),Link=Path(path).name)
          item=ET.SubElement(group,"AssemblyMetadata",Include="LaplaceRepoRoot")
          ET.SubElement(item,"Value").text=str(root)
          ET.ElementTree(project).write(work/"Contracts.csproj",encoding="unicode")
          original=(root/"app/Laplace.Substrate.Tests/Abstractions/TypeIdLawTests.cs").read_text()
          # The only dependency is the existing root locator. Extract its exact final
          # two methods; this project never references native/product assemblies.
          methods=original[original.index("    internal static string FindRepoRootPublic()"):]
          assert methods.endswith("}\n") and methods.count("FindRepoRootPublic()")==1
          helper="namespace Laplace.Decomposers.Abstractions.Tests;\npublic class TypeIdLawTests\n{\n"+methods
          (work/"RootLocator.cs").write_text(helper)
          report={"source":"d0525974b6616a91ce6a3696b82e808026a83ef1","scope":"Actual linked source-contract classes only; not native-backed product assembly execution",
                  "files":{path:hashlib.sha256((root/path).read_bytes()).hexdigest() for path in files},
                  "rootLocatorSha256":hashlib.sha256(helper.encode()).hexdigest(),"packages":{n:packages[n] for n in ("Microsoft.NET.Test.Sdk","xunit","xunit.runner.visualstudio")}}
          (Path(os.environ["EVIDENCE"])/"manifest.json").write_text(json.dumps(report,indent=2)+"\n")
          PY
      - name: Execute both complete affected source-contract classes
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s dotnet test "$QUALIFICATION_DIR/project/Contracts.csproj" --configuration Release --disable-build-servers --nologo --verbosity minimal -p:UseSharedCompilation=false --logger "trx;LogFileName=contracts.trx" --results-directory "$EVIDENCE" "-bl:$EVIDENCE/contracts.binlog" 2>&1 | tee "$EVIDENCE/tests.log"
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE/result.json"
          import json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          expected=set(["ProductionScan_SeparatesTestFixturesFromRuntimeOwners","LaneIdentity_IsDefinedExactlyOnce","MeasurementLane_DoesNotShareAClassWithRunLiveness","RunLivenessClass_AgreesBetweenCsharpAndCanonicalSql","QuietGate_PreSchemaBootstrapIsProvenWithoutFailingOpen","Ingest_TakesTheLaneShared","Measurement_ObservesBeforeAndAfterChildWithoutBlockingIngest","Lane_IsSessionScoped","Wrapper_DoesNotTakeTheLockItself","IngestMutex_NoNewProcessLevelCopy","IngestMutex_NoNewDatabaseLevelImplementation","NamedAdvisoryLockOwner_RemainsAvailable","HighwayMaskDeposit_CallerMatchesInstalledSurface","EvidenceVerify_NoNewHandRolledImplementation","EvidenceVerify_SanctionedSurfaceExists","G10_AllowlistsOnlyShrink","ContentAddressedApply_DoesNotAcquireGlobalAdvisoryLock"])
          results=ET.parse(Path(os.environ["EVIDENCE"])/"contracts.trx").getroot().findall(".//{*}UnitTestResult")
          names=[x.attrib["testName"].rsplit(".",1)[-1] for x in results]
          assert len(names)==len(expected) and set(names)==expected
          assert all(x.attrib["outcome"]=="Passed" for x in results)
          print(json.dumps({"source":"d0525974b6616a91ce6a3696b82e808026a83ef1","passed":len(names),"failed":0,"skipped":0,"tests":names,
              "scope":"Actual source-reading assertions; no native initialization, native code or PostgreSQL execution"}))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain focused execution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nonblocking-source-contracts
          path: /build/laplace/work/nonblocking-contracts/evidence/
          if-no-files-found: error
          retention-days: 30
