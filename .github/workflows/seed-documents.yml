name: Seed — documents

# Ordinary document ingestion is path-selected content. Dataset-estate MANIFEST.tsv files
# belong to curated source acquisition and must not redefine a document run merely because
# the selected folder happens to contain one.
#
# The Gutenberg estate moved out of test-data during the 2026-09-03 estate modernization.
# `all-books` therefore runs the three actual document roots in sequence instead of pointing
# DocumentDecomposer at /vault/Data/test-data and inheriting whichever MANIFEST.tsv another
# workflow most recently installed there.

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: "which document estate to ingest"
        type: choice
        required: true
        default: all-books
        options:
          - all-books
          - gutenberg
          - fixtures
          - electronics
          - smoke-alice
          - path-override
      path:
        description: "explicit path; when non-empty it wins over corpus (single file or directory)"
        type: string
        default: ""
      database:
        description: "target DB (one database: laplace)"
        type: choice
        options: [laplace]
        default: laplace
      run_idempotency:
        description: "re-ingest and prove no double-count"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      path: ${{ steps.pick.outputs.path }}
    steps:
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          root="${LAPLACE_DATA_ROOT:-/vault/Data}"
          user_path="${{ inputs.path }}"

          if [ -n "$user_path" ]; then
            [ -e "$user_path" ] || { echo "::error::path '$user_path' does not exist on this runner"; exit 1; }
            echo "::notice::explicit path wins; corpus '${{ inputs.corpus }}' ignored"
            echo "mode=single" >> "$GITHUB_OUTPUT"
            echo "path=$user_path" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "${{ inputs.corpus }}" in
            all-books)
              echo "mode=all" >> "$GITHUB_OUTPUT"
              echo "path=" >> "$GITHUB_OUTPUT"
              ;;
            gutenberg)
              p="$root/ProjectGutenberg/text"
              [ -d "$p" ] || { echo "::error::$p does not exist"; exit 1; }
              echo "mode=single" >> "$GITHUB_OUTPUT"
              echo "path=$p" >> "$GITHUB_OUTPUT"
              ;;
            fixtures)
              p="$root/test-data/text"
              [ -d "$p" ] || { echo "::error::$p does not exist"; exit 1; }
              echo "mode=single" >> "$GITHUB_OUTPUT"
              echo "path=$p" >> "$GITHUB_OUTPUT"
              ;;
            electronics)
              p="$root/test-data/electronics"
              [ -d "$p" ] || { echo "::error::$p does not exist"; exit 1; }
              echo "mode=single" >> "$GITHUB_OUTPUT"
              echo "path=$p" >> "$GITHUB_OUTPUT"
              ;;
            smoke-alice)
              p=$(find "$root/ProjectGutenberg/text" -type f -iname '*alice*.txt' -print | LC_ALL=C sort | head -1)
              [ -n "$p" ] || { echo "::error::no Alice text found under $root/ProjectGutenberg/text"; exit 1; }
              echo "mode=single" >> "$GITHUB_OUTPUT"
              echo "path=$p" >> "$GITHUB_OUTPUT"
              ;;
            path-override)
              echo "::error::corpus=path-override requires the path input"; exit 1
              ;;
            *)
              echo "::error::unknown corpus '${{ inputs.corpus }}'"; exit 1
              ;;
          esac

  seed-selected:
    needs: resolve
    if: needs.resolve.outputs.mode == 'single'
    uses: ./.github/workflows/_ingest.yml
    with:
      source: document
      path: ${{ needs.resolve.outputs.path }}
      database: ${{ inputs.database }}
      timeout_minutes: 480
      run_gate: true
      run_idempotency: ${{ inputs.run_idempotency }}

  seed-gutenberg:
    needs: resolve
    if: needs.resolve.outputs.mode == 'all'
    uses: ./.github/workflows/_ingest.yml
    with:
      source: document
      path: /vault/Data/ProjectGutenberg/text
      database: ${{ inputs.database }}
      timeout_minutes: 480
      run_gate: true
      run_idempotency: ${{ inputs.run_idempotency }}

  seed-fixtures:
    needs: [resolve, seed-gutenberg]
    if: always() && needs.resolve.outputs.mode == 'all' && needs.seed-gutenberg.result == 'success'
    uses: ./.github/workflows/_ingest.yml
    with:
      source: document
      path: /vault/Data/test-data/text
      database: ${{ inputs.database }}
      timeout_minutes: 120
      run_gate: true
      run_idempotency: ${{ inputs.run_idempotency }}

  seed-electronics:
    needs: [resolve, seed-fixtures]
    if: always() && needs.resolve.outputs.mode == 'all' && needs.seed-fixtures.result == 'success'
    uses: ./.github/workflows/_ingest.yml
    with:
      source: document
      path: /vault/Data/test-data/electronics
      database: ${{ inputs.database }}
      timeout_minutes: 120
      run_gate: true
      run_idempotency: ${{ inputs.run_idempotency }}
