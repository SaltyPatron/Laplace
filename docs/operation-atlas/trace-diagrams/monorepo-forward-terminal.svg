ont-size="12" textLength="174.709">Finalize BUDGET_EXHAUSTED</text><rect x="339.668" y="335.633" width="138.031" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="349.668" y="358.09" fill="#000" font-size="12" textLength="118.031">Finalize EXHAUSTED</text><polygon points="261.019,376.727,273.019,388.727,261.019,400.727,249.019,388.727,261.019,376.727" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="166.249,252.715,355.79,252.715,367.79,264.715,355.79,276.715,166.249,276.715,154.249,264.715,166.249,252.715" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="265.019" y="288.134" fill="#000" font-size="11" textLength="17.118">yes</text><text x="166.249" y="269.216" fill="#000" font-size="11" textLength="189.541">Incomplete and disposition still OPEN?</text><polygon points="261.019,420.727,273.019,432.727,261.019,444.727,249.019,432.727,261.019,420.727" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="151.469" y="513.645" width="219.102" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="161.469" y="536.102" fill="#000" font-size="12" textLength="199.102">Emit terminal row at output_count + 1</text><rect x="93.276" y="568.738" width="335.486" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="103.276" y="591.195" fill="#000" font-size="12" textLength="315.486">Event is complete if receipt.complete, otherwise unresolved</text><rect x="99.604" y="638.832" width="322.83" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="109.604" y="661.289" fill="#000" font-size="12" textLength="302.83">Keep more specific disposition as a separate receipt field</text><rect x="38.224" y="693.926" width="445.59" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="48.224" y="716.383" fill="#000" font-size="12" textLength="425.59">Include program, obligations, output count and optional fingerprints/semantic act</text><polygon points="217.911,464.727,304.128,464.727,316.128,476.727,304.128,488.727,217.911,488.727,205.911,476.727,217.911,464.727" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="265.019" y="500.146" fill="#000" font-size="11" textLength="17.118">yes</text><text x="217.911" y="481.228" fill="#000" font-size="11" textLength="86.217">Trace requested?</text><polygon points="261.019,749.02,273.019,761.02,261.019,773.02,249.019,761.02,261.019,749.02" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="197.127,148.703,324.911,148.703,336.911,160.703,324.911,172.703,197.127,172.703,185.127,160.703,197.127,148.703" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="265.019" y="184.122" fill="#000" font-size="11" textLength="17.118">yes</text><text x="197.127" y="165.204" fill="#000" font-size="11" textLength="127.784">Cognition program exists?</text><polygon points="261.019,793.02,273.019,805.02,261.019,817.02,249.019,805.02,261.019,793.02" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="94.263" y="837.02" width="333.512" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="104.263" y="859.477" fill="#000" font-size="12" textLength="313.512">Delete round scratch; destroy output/query/cognition states</text><rect x="83.588" y="892.113" width="354.863" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="93.588" y="914.57" fill="#000" font-size="12" textLength="334.863">Free routin