078" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="214.393" cy="340.078" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="214.393" y1="73.609" x2="214.393" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="210.393,83.609,214.393,93.609,218.393,83.609,214.393,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="214.393" y1="128.703" x2="214.393" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="210.393,138.703,214.393,148.703,218.393,138.703,214.393,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="214.393" y1="183.797" x2="214.393" y2="203.797" style="stroke:#181818;stroke-width:1;"/><polygon points="210.393,193.797,214.393,203.797,218.393,193.797,214.393,197.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="214.393" y1="253.984" x2="214.393" y2="273.984" style="stroke:#181818;stroke-width:1;"/><polygon points="210.393,263.984,214.393,273.984,218.393,263.984,214.393,267.984" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="214.393" y1="309.078" x2="214.393" y2="329.078" style="stroke:#181818;stroke-width:1;"/><polygon points="210.393,319.078,214.393,329.078,218.393,319.078,214.393,323.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="13"><text x="22.517" y="370.459" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="10" y="383.037" fill="#888" font-size="10" textLength="410.786">claimed. on_embeddings and name_entity reviewed. This surface emits a content/coordinate</text><text x="26.128" y="395.615" fill="#888" font-size="10" textLength="378.53