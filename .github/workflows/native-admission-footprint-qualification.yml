name: Current-main publication and native identity controls
on:
  push:
    branches: [qualify/native-admission-footprint-20260916]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_SHA: 75ea01ebc6210cdb2df689b1b054af8a96c4aa2f
      SOURCE_TREE: e003b5e3cef02492699151c49f6dff41c057de2d
      TMPDIR: /build/laplace/work/cumulative-publication/tmp
      TMP: /build/laplace/work/cumulative-publication/tmp
      TEMP: /build/laplace/work/cumulative-publication/tmp
      EVIDENCE: /build/laplace/recovery/cumulative-publication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 75ea01ebc6210cdb2df689b1b054af8a96c4aa2f
          fetch-depth: 1
      - name: Prepare permanent scratch for the selected source
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$TMPDIR" "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          printf '%s\n' "$SOURCE_SHA $SOURCE_TREE" > "$EVIDENCE/source.txt"
          command -v rsync
          rsync --version > "$EVIDENCE/rsync.txt"
      - name: Execute API publication and existing owner controls
        run: |
          set -euo pipefail
          status=0
          qualify() {
            local label="$1"
            shift
            set +e
            timeout --signal=TERM --kill-after=10s 300s "$@" 2>&1 | tee "$EVIDENCE/$label.log"
            local result=$?
            set -e
            printf '%s\t%s\n' "$label" "$result" >> "$EVIDENCE/exit-codes.tsv"
            if [ "$result" -ne 0 ]; then status=1; fi
          }
          for suite in postgresql-release pipeline-install app-fingerprints application-publish application-runtime installed-chess-corpus qualified-chess-floor-export; do
            qualify "$suite" python3 "scripts/test-$suite.py" -v
          done
          qualify payload-sync bash scripts/test-deploy-payload-sync.sh
          qualify publish-snapshot bash scripts/test-managed-publish-snapshot.sh
          qualify shellcheck shellcheck -S warning -x deploy/linux/deploy.sh deploy/linux/managed-publish.sh
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE/python-ast.log"
          import ast, subprocess, yaml
          from pathlib import Path
          for name in ("verify-api-payload.py", "test-application-publish.py", "postgresql-release.py",
                       "test-postgresql-release.py", "test-pipeline-install.py", "test-app-fingerprints.py",
                       "check-application-runtime.py", "test-application-runtime.py", "measure-installed-chess-corpus.py",
                       "test-installed-chess-corpus.py", "export-qualified-chess-floors.py",
                       "test-qualified-chess-floor-export.py"):
              ast.parse((Path("scripts") / name).read_text())
              print(f"PASS Python AST {name}")
          workflow = yaml.safe_load(Path(".github/workflows/chess-floor-export.yml").read_text())
          for job in workflow["jobs"].values():
              for step in job["steps"]:
                  if "run" in step:
                      subprocess.run(["bash", "-n"], input=step["run"], text=True, check=True)
          print("PASS export workflow YAML and embedded Bash syntax")
          PY
          bash -n deploy/linux/deploy.sh
          bash -n deploy/linux/payload-sync.sh
          bash -n scripts/publish-applications.sh
          bash -n scripts/lib/fp.sh
          bash -n scripts/pipeline.sh
          qualify fingerprint-shellcheck shellcheck --severity=warning scripts/lib/fp.sh
          printf '%s\n' "PASS Bash syntax" | tee "$EVIDENCE/bash.log"
          test -z "$(git status --porcelain --untracked-files=all)"
          exit "$status"
      - name: Retain bounded source qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-main-port-source-controls
          path: /build/laplace/recovery/cumulative-publication/
          if-no-files-found: error
          retention-days: 30
