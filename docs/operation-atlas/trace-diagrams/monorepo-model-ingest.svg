ModelDecomposer is</text><text x="206.734" y="1221.084" fill="#888" font-size="10" textLength="367.983">unreachable under the current ResolvePlanesMode contract. DescribeInput reports</text><text x="202.576" y="1233.662" fill="#888" font-size="10" textLength="376.299">safetensors only and estimated matchups; it is not a complete source artifact census.</text><text x="191.175" y="1246.24" fill="#888" font-size="10" textLength="399.102">Token parser, manifest recognition, snapshot identity and common phase internals remain</text><text x="369.878" y="1258.818" fill="#888" font-size="10" textLength="41.694">separate.</text></g><?plantuml-src dLLDRzms4BthLmpGGnB0k_PwlVvOeoW2nqOD944GkoWAv3AYHX9hYXH8ofljgJ-Ylx2_f8-KDhkDqKil2riYPzvxy-Rf5Tq-wqgiaZMzvzwmacFk--Ffx_axKQxhNH0VZZ-uIipuktyyLu4UVdvxkZgd4xvOLAeghquMozEoNAtggbwUy08_5rVrQb7BYXL-QobBkPAA5-TyUheiUNcwlAnLNRpwVs0UtPFOswgHsyVt1t0gFgdgy-N5ibwLb-XQCTUNKfwSbN9MonNNoxEBiyNbvMcfpigwaikBUdM-ulFbURrGbJehmfEsFNlkg6Jrr7WtsEh66UVfXxktTpTtTmSdGikLssZRKCqcoC6RIceUJBnpDdxaJkY1RNWGh-iYwcY4FZZhlFIE_lxpB-eI7mfky4g8RONR8sKTjRFal6ebHC_flo94zh5OF-JJTyvdCMW84YZ_UOEMOkFu_hxwWZwas3gh5PiPoYIuBOSsOJQ98zNU9SHUFmjwQoygEhyb2-3NnVhU0WOR_OUGbqQ7Y46ChJuFDkfEFh3LDG3Yx6VXYfIpjMwEAAO9uPgd-tSKUfx81Qu528D3cHRdKUwwi2wYl6xQM3mUN9kDryJxTDguXfWsx2qup8kVysMIhqhw94sWCkcMkf1qVTnEvSa0zBpuZ9UD7IKzJY0ZQukt65X8cdZfy80ic4WrBmHG4wf4Aby4_sx7bDBiV2JkIjqCEcwFQB1-TwwY7R_4DybXj8eXwnESUPPFXj4cQKYi4lf0pfejOJg3YeENBvRjbbniWM-K4m-hR1IAhNSR5DCrlHubG9zdrePB8p-zmNknz7ehuKr1wuV8ZH3yevvwfstSINBWhzGBKz5Va-qCfpuuACr1w-my-2MJeFLlMWnujMnHExgq1kEj1jgaa_9Lr00FNISLuVa4zHSRXZw9bdXCEiBQq7XlbFdlmTdlARp7r2iTlgr3Gfk6es54pasWc-kdLkjF6AViIs9KWwLdfxWSG6wRhtVY0JKhEJHj4gD3uIbcgCTso2HmDYEC622E3VyXh_EG5BI-wx8za0bA823ejNNfsg-myBZrCuCx9bNG5X5243Av3lxAxgns2gwnQ_Gozsux7T-6hLMqqN4aekDjxrHBFz82XXj79Om7Idi5gyBxCkNjXEsBHJueCMOSSpOBs9GIDo9fbNHCGniFGvUiTksm6xuOOsRcKL8sEFIlh9hJnxnC5B1QY0gazBHahXTxdKRlnmYPrY31AE11FAdcT8Dv64G5VVVnoUA-q0Ab6PSUMns-MIDZ3tlaO5yv33uft7ltB2bEMcTaTh0X06y3h9u9ZFmewONWtkupCoKeAd617HdN5ZnJOX