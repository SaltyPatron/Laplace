name: Qualify GUI cache and foundation operator
on:
  push:
    branches: [qualify/native-admission-footprint-20260916]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EVIDENCE: /build/laplace/work/gui-cache-source/evidence
      TMPDIR: /build/laplace/work/gui-cache-source/tmp
      TMP: /build/laplace/work/gui-cache-source/tmp
      TEMP: /build/laplace/work/gui-cache-source/tmp
    steps:
      - name: Prepare permanent qualification workspace
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$EVIDENCE" "$TMPDIR"
      - name: Authenticate parse and exercise owned cancellation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE/qualification.log"
          import ast,base64,fcntl,hashlib,json,os,re,signal,subprocess,sys,textwrap,time,urllib.request,yaml
          from pathlib import Path
          evidence=Path(os.environ["EVIDENCE"])
          selections={
              "workflow":"6b3cbeaf899e4caf9b25076345cfecd16d7ac10c",
              "gui":"fb28c4110db6a718d77a09980f831b5c10f9fb3a",
              "bootstrap":"0f6086674477ecdc8f7591cf367af23791dfcadd",
              "cache":"d24926a046a336b37e78a037d19a67c1938c06ce",
              "follow":"791a070a1647a0e62d7481141fad6abe8ad28bd4",
          }
          sources={}
          for name,sha in selections.items():
              request=urllib.request.Request("https://api.github.com/repos/SaltyPatron/Laplace/git/blobs/"+sha,
                  headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(request,timeout=30) as response:encoded=response.read((2<<20)+1)
              assert len(encoded)<=2<<20
              item=json.loads(encoded)
              assert item["sha"]==sha and item["encoding"]=="base64"
              raw=base64.b64decode(item["content"])
              assert len(raw)==item["size"] and len(raw)<1<<20
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==sha
              sources[name]=raw.decode()
              (evidence/(name+(".yml" if name=="workflow" else ".py"))).write_bytes(raw)
              if name!="workflow":ast.parse(raw,filename=name+".py")
          document=yaml.safe_load(sources["workflow"])
          counts={"outerBash":0,"innerBash":0,"pythonHeredocs":0,"pythonBlocks":4}
          for job in document["jobs"].values():
              for step in job["steps"]:
                  program=step.get("run")
                  if program is None:continue
                  subprocess.run(["bash","-n"],input=program,text=True,check=True)
                  counts["outerBash"]+=1
                  lines=program.splitlines()
                  for i,line in enumerate(lines):
                      match=re.search(r"<<'([A-Z_]+)'",line)
                      if not match:continue
                      delimiter=match.group(1)
                      end=next(j for j in range(i+1,len(lines)) if lines[j].strip()==delimiter)
                      body=textwrap.dedent("\n".join(lines[i+1:end]))+"\n"
                      if delimiter=="PY":
                          ast.parse(body)
                          counts["pythonHeredocs"]+=1
                      elif delimiter=="FOLLOW":
                          subprocess.run(["bash","-n"],input=body,text=True,check=True)
                          counts["innerBash"]+=1
          assert counts=={"outerBash":6,"innerBash":1,"pythonHeredocs":6,"pythonBlocks":4},counts
          assert document["env"]["EXPECTED_EXPORT_BLOB"]=="008ce36f55246452e738436dbe3b33682a64db8a"
          assert document["jobs"]["foundation"]["if"]=="always()"
          # Execute the actual extracted wait/cleanup function with real owned
          # processes and a real flock descriptor; fixtures perform no host action.
          parsed=ast.parse(sources["follow"])
          selected=[node for node in parsed.body if isinstance(node,ast.FunctionDef)
                    and node.name in ("run_child","interrupted")]
          assert len(selected)==2
          functions=ast.unparse(ast.Module(body=selected,type_ignores=[]))
          child=evidence/"cleanup-child.py"
          child.write_text("import os,signal,sys,time\nfrom pathlib import Path\n"
              "root=Path(sys.argv[1])\n"
              "def stop(signum,frame):\n"
              " signal.signal(signal.SIGTERM,signal.SIG_IGN)\n"
              " signal.signal(signal.SIGINT,signal.SIG_IGN)\n"
              " (root/'cleanup-started').write_text('yes')\n"
              " time.sleep(0.6)\n"
              " (root/'cleanup-completed').write_text('yes')\n"
              " raise SystemExit(0)\n"
              "signal.signal(signal.SIGTERM,stop)\n"
              "(root/'child-ready').write_text('yes')\n"
              "while True:time.sleep(0.05)\n")
          driver=evidence/"cleanup-driver.py"
          driver.write_text("import fcntl,os,signal,subprocess,sys\nfrom pathlib import Path\n"+functions+"\n"
              "root=Path(sys.argv[1])\n"
              "fd=os.open(root/'host.lock',os.O_CREAT|os.O_RDWR,0o600)\n"
              "fcntl.flock(fd,fcntl.LOCK_EX)\n"
              "os.environ['FOLLOW_LOCK_FD']=str(fd)\n"
              "signal.signal(signal.SIGTERM,interrupted)\n"
              "signal.signal(signal.SIGINT,interrupted)\n"
              "try:run_child([sys.executable,sys.argv[2],str(root)])\n"
              "except KeyboardInterrupt:raise SystemExit(143)\n"
              "finally:os.close(fd)\n")
          results=[]
          def wait_file(path,process):
              end=time.monotonic()+10
              while not path.exists():
                  assert process.poll() is None,"owned driver exited early"
                  if time.monotonic()>end:raise TimeoutError(str(path))
                  time.sleep(0.02)
          for first,second in ((signal.SIGTERM,signal.SIGTERM),(signal.SIGINT,signal.SIGTERM)):
              case=evidence/("signals-"+str(first)+"-"+str(second));case.mkdir()
              process=subprocess.Popen([sys.executable,driver,case,child],start_new_session=True)
              try:
                  wait_file(case/"child-ready",process)
                  os.kill(process.pid,first)
                  wait_file(case/"cleanup-started",process)
                  os.kill(process.pid,second)
                  with (case/"host.lock").open("r+") as contender:
                      try:fcntl.flock(contender,fcntl.LOCK_EX|fcntl.LOCK_NB)
                      except BlockingIOError:pass
                      else:raise AssertionError("host reservation released during child cleanup")
                  assert process.wait(timeout=10)==143
                  assert (case/"cleanup-completed").read_text()=="yes"
                  with (case/"host.lock").open("r+") as contender:
                      fcntl.flock(contender,fcntl.LOCK_EX|fcntl.LOCK_NB)
                  results.append({"first":first,"second":second,"cleanupCompleted":True,
                                  "lockHeldUntilCleanup":True,"lockReleasedAfterward":True})
              finally:
                  try:os.killpg(process.pid,signal.SIGKILL)
                  except ProcessLookupError:pass
                  process.wait(timeout=5)
          receipt={"selections":selections,"syntax":counts,"actualCancellationControls":results,
                   "scope":"Authenticated operational syntax and local process-lock controls; no GUI/cache/database execution"}
          (evidence/"receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt))
          PY
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gui-cache-foundation-source-controls
          path: /build/laplace/work/gui-cache-source/evidence/
          if-no-files-found: error
          retention-days: 30
