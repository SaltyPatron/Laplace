name: Dynamic native source freeze syntax controls
on:
  push:
    branches: [qualify/native-admission-footprint-20260916]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: /build/laplace/work/dynamic-native-syntax/tmp
      TMP: /build/laplace/work/dynamic-native-syntax/tmp
      TEMP: /build/laplace/work/dynamic-native-syntax/tmp
      EVIDENCE: /build/laplace/recovery/dynamic-native-syntax
    steps:
      - name: Prepare permanent protocol evidence
        run: |
          set -euo pipefail
          sudo mkdir -p /build/laplace
          sudo chown "$(id -u):$(id -g)" /build/laplace
          mkdir -p "$TMPDIR" "$EVIDENCE"
      - name: Authenticate and parse the coordinated native operator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$EVIDENCE/operator-syntax.log"
          import ast, base64, hashlib, json, os, re, subprocess, textwrap, urllib.request, yaml
          from pathlib import Path
          sha = "9d4e180c5380d23085ad69dedd1dfdf08d1207dd"
          request = urllib.request.Request(
              "https://api.github.com/repos/SaltyPatron/Laplace/git/blobs/" + sha,
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                       "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              encoded = response.read(2 * 1024 * 1024 + 1)
          if len(encoded) > 2 * 1024 * 1024:
              raise ValueError("operator metadata exceeded bound")
          item = json.loads(encoded)
          assert item["sha"] == sha and item["encoding"] == "base64"
          raw = base64.b64decode(item["content"])
          assert len(raw) == item["size"] and len(raw) < 1024 * 1024
          assert hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest() == sha
          (Path(os.environ["EVIDENCE"]) / "native-operator.yml").write_bytes(raw)
          document = yaml.safe_load(raw)
          environment = document["jobs"]["native"]["env"]
          assert environment["TARGET_SHA"] == environment["TARGET_TREE"] == ""
          assert environment["REQUIRED_ANCESTOR"] == "c490651eee906f44f944ae2c2b0d0783516f9e0c"
          native_program = document["jobs"]["native"]["steps"][1]["run"]
          pins = re.search(r"done <<'SOURCE_OWNERS'\n(.*?)\nSOURCE_OWNERS", native_program, re.S).group(1).splitlines()
          assert len(pins) == 13, pins
          assert all(re.fullmatch(r"100(?:644|755) [0-9a-f]{40} .+", pin) for pin in pins)
          assert not any("physicality_descriptor.c" in pin or "physicality_descriptor_admission.cpp" in pin for pin in pins)
          assert "--exclusive --no-fork" in native_program
          assert native_program.index("flock --exclusive") < native_program.index("git fetch")
          outer = inner = python = 0
          for job in document["jobs"].values():
              for step in job["steps"]:
                  program = step.get("run")
                  if program is None:
                      continue
                  subprocess.run(["bash", "-n"], input=program, text=True, check=True)
                  outer += 1
                  lines = program.splitlines()
                  for index, line in enumerate(lines):
                      match = re.search(r"<<'([A-Z_]+)'", line)
                      if not match:
                          continue
                      delimiter = match.group(1)
                      end = next(i for i in range(index + 1, len(lines)) if lines[i].strip() == delimiter)
                      body = textwrap.dedent("\n".join(lines[index + 1:end])) + "\n"
                      if delimiter == "PY":
                          ast.parse(body)
                          python += 1
                      elif delimiter in ("NATIVE", "MANAGED_READINESS"):
                          subprocess.run(["bash", "-n"], input=body, text=True, check=True)
                          inner += 1
          assert (outer, inner, python) == (4, 2, 9), (outer, inner, python)
          import tempfile
          with tempfile.TemporaryDirectory(prefix="source-freeze-", dir=os.environ["TMPDIR"]) as temporary:
              base = Path(temporary)
              origin, checkout = base / "origin", base / "checkout"
              origin.mkdir()
              def git(cwd, *args):
                  return subprocess.check_output(["git", "-C", str(cwd), *args], text=True, stderr=subprocess.PIPE).strip()
              git(origin, "init", "-b", "main")
              git(origin, "config", "user.name", "Protocol fixture")
              git(origin, "config", "user.email", "fixture@example.invalid")
              (origin / "source").write_text("ancestor\n")
              git(origin, "add", "source"); git(origin, "commit", "-m", "ancestor")
              ancestor = git(origin, "rev-parse", "HEAD")
              subprocess.run(["git", "clone", str(origin), str(checkout)], check=True, capture_output=True)
              (origin / "source").write_text("selected successor\n")
              git(origin, "commit", "-am", "successor")
              selected = git(origin, "rev-parse", "HEAD")
              selected_tree = git(origin, "rev-parse", "HEAD^{tree}")
              start = native_program.index("fetch_args=(--no-tags)")
              stop = native_program.index("while read -r expected_mode", start)
              freeze = "set -euo pipefail\n" + native_program[start:stop]
              env = dict(os.environ, REQUIRED_ANCESTOR=ancestor, GITHUB_ENV=str(base / "environment"))
              result = subprocess.run(["bash", "-c", freeze], cwd=checkout, env=env, text=True, capture_output=True)
              assert result.returncode == 0, result.stderr
              retained = (base / "environment").read_text()
              assert retained == "TARGET_SHA=" + selected + "\nTARGET_TREE=" + selected_tree + "\n", retained
              assert git(checkout, "rev-parse", "HEAD") == ancestor
              assert (checkout / "source").read_text() == "ancestor\n"
              (origin / "source").write_text("later main\n")
              git(origin, "commit", "-am", "later")
              assert (base / "environment").read_text() == retained
              git(origin, "reset", "--hard", ancestor)
              env.update(REQUIRED_ANCESTOR=selected, GITHUB_ENV=str(base / "rejected-environment"))
              rejected = subprocess.run(["bash", "-c", freeze], cwd=checkout, env=env, text=True, capture_output=True)
              assert rejected.returncode != 0
              assert git(checkout, "rev-parse", "HEAD") == ancestor
          print("PASS actual freeze block: successor identity, unchanged checkout, frozen later advance, unrelated ancestry refusal")
          print(json.dumps({"operatorBlob": sha, "bytes": len(raw),
                            "outerBash": outer, "innerBash": inner, "python": python,
                            "scope": "authenticated source syntax only; no native or host execution"}))
          PY
      - name: Retain authenticated operator and protocol result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dynamic-native-syntax
          path: /build/laplace/recovery/dynamic-native-syntax/
          if-no-files-found: error
          retention-days: 30
