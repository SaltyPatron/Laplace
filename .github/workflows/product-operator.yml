name: Product — manual operation
run-name: "Product operation — ${{ inputs.operation }} @ ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Explicit maintenance operation; normal main delivery is automatic"
        type: choice
        required: true
        default: reconcile
        options: [reconcile, build, test-dev, test-db, test-live, deploy, install, applications, provision, check]
      full_clean:
        description: "Build/deploy only: wipe build outputs before rebuilding"
        type: boolean
        default: false
      force_codegen:
        description: "Build/deploy only: regenerate attestation-law source"
        type: boolean
        default: false
      serial_tests:
        description: "Test operations only: force serial native tests"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  operator:
    name: Run explicit product maintenance operation
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: ${{ inputs.operation }}
      target_sha: ${{ github.sha }}
      full_clean: ${{ inputs.full_clean }}
      force_codegen: ${{ inputs.force_codegen }}
      serial_tests: ${{ inputs.serial_tests }}
    secrets: inherit
