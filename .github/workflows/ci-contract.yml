name: Policy — CI contract

on:
  pull_request:
    paths:
      - ".github/**"
      - "scripts/**"
      - "deploy/**"
      - "db/**"
      - "cmake/**"
      - "CMakeLists.txt"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "scripts/**"
      - "deploy/**"
      - "db/**"
      - "cmake/**"
      - "CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[actions-history-cleanup]') && format('laplace-actions-history-cleanup-{0}', github.run_id) || format('laplace-ci-contract-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[actions-history-cleanup]') }}

jobs:
  contract:
    name: Static CI/CD contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate workflow, lifecycle, and operator contracts
        shell: bash
        run: bash scripts/product-ci.sh check

      - name: Validate evidence-safe Actions history cleanup policy
        shell: bash
        run: python3 .github/scripts/test-actions-history-cleanup.py

  cleanup-history:
    name: Remove artifact-free stale workflow identities
    needs: contract
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[actions-history-cleanup]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out cleanup policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Delete complete stale workflow identities only when no artifact is retained
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/cleanup-actions-history.py \
            --delete \
            --max-deletes 3000 \
            --report "$RUNNER_TEMP/actions-history-cleanup.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload cleanup audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actions-history-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/actions-history-cleanup.json
          if-no-files-found: error
          retention-days: 90
