:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="211.455" y1="567.727" x2="201.455" y2="567.727" style="stroke:#181818;stroke-width:1;"/><line x1="201.455" y1="567.727" x2="201.455" y2="589.727" style="stroke:#181818;stroke-width:1;"/><polygon points="197.455,579.727,201.455,589.727,205.455,579.727,201.455,583.727" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="463.511" y1="567.727" x2="473.511" y2="567.727" style="stroke:#181818;stroke-width:1;"/><line x1="473.511" y1="567.727" x2="473.511" y2="589.727" style="stroke:#181818;stroke-width:1;"/><polygon points="469.511,579.727,473.511,589.727,477.511,579.727,473.511,583.727" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="201.455" y1="624.82" x2="201.455" y2="770.738" style="stroke:#181818;stroke-width:1;"/><line x1="201.455" y1="770.738" x2="325.483" y2="770.738" style="stroke:#181818;stroke-width:1;"/><polygon points="315.483,766.738,325.483,770.738,315.483,774.738,319.483,770.738" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="337.483" y1="782.738" x2="337.483" y2="802.738" style="stroke:#181818;stroke-width:1;"/><polygon points="333.483,792.738,337.483,802.738,341.483,792.738,337.483,796.738" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="337.483" y1="837.832" x2="337.483" y2="857.832" style="stroke:#181818;stroke-width:1;"/><polygon points="333.483,847.832,337.483,857.832,341.483,847.832,337.483,851.832" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="27"><rect x="22" y="900.832" width="601.021" height="62.828" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="27" y="920.365" fill="#000" font-size="14" textLength="427.978">CatalogConversationAsync writes only for authenticated user GUIDs.</text><text x="27" y="937.975" fill="#000" font-size="14" textLength="590.639">Its title collapses whitespace and truncates to 160 characters before UpsertConversationAsync.</text><text x="27" y="955.584" fill="#000" font-size="14" textLength="591.021">These checks are identifiers and scope plumbing, not the tenant resolver's authentication proof.</text></g><g class="footer" data-source-line="32"><text x="129.635" y="987.041" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="154.371" y="999.619" fill="#888" font-size="10" textLength="336.279">claimed. ConversationContent identity derivation, tenant resolver trust, store</text><text x="118.504" y="1012.197" fill="#888" font-size="10" textLength="408.013">authorization and session ownership enforcement remain nested. The source wrapper alone</text><text x="214.398" y="1024.775" fill="#888" font-size="10" textLength="216.226">cannot establish the whole access-control policy.</text></g><?plantuml-src bLHDZzis4BthLmpGGpR0hjOVQs-yFXGB9suDD0bGRu3U0eeQMSHI7893sNLE_H7zXVqb6KfogdGB5Bq80ZdpvhqtCtm5xuwcHAVn0NvHtYgDjyhxs-4_V-TAJyP5pZzwT8-x3JLUnTlByNk9DUx0-SvL619ChXdsFp_E5aierN9HtiscrK8jP-MirDEx-sAX9xguVpClLdVJnJrEPxFxQhAQhoPlK2tdnTryDQzMUbcLyqd6pyPv5LG3XTBFXq2jApTaAS0FsyVjPhiTHN2jIZe95wYKPHpTb5YfriOjkVX1DGXxvNYFmLHPDD4Yl2T70Jt1Nt_y2H6TSX6KAq6JEs9W5GqvO4rUGACACNlu5Pdi4I_14XZnzmYn5eQ76dPFtVaG5TQPgU2gFuFaTJILmG367PKrvO-l9H4TN9sHNsSWuB4DxdBxUQY18P0W0KVo6RfIs3ziQY96O6HE59_n_005bUVh7l2tcw69D_i-OZYl0d8DVFFJfztRdjjm___9NKh_2xkHPcsLQRYpIHa7qXLMXHZVCeRFfeH4v6MXZZfmwxqrM7R1IIASJAn1jIaw6gqYzW3h3ANjSEL8qZjHtsN-fxGNshgqYx1U6VJI1llVoWp940pcxKenbfhn08qQiuRGep_9PvzcQPrra1OF0fTjL5IM3flHo3tosMau1HEHWPmzGoM3_xtmZcDIptcsYmpzG6koLdcf3gSwPVjaP28KG-jIeWGIJ9SJqBLiY8vI4WeKU8HFaXVY2nvvzbIZsAjhrCyCIYB_TfHxjKaLUDisXMpXDJXA6_5jISAm3Qzuh27PumDHbITN1pCg8g6KxQaDChm1ZmPF8fQ2LESOkgmSFiW_9fCRbR1OAZHfl8I5Mqjr4B7HoB