name: Qualify existing SQL physicality capture helpers
on:
  push:
    branches: [qualify/physicality-capture-sql-helpers-20260916]
permissions:
  contents: read
jobs:
  ordinary-native-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Read exact native product candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Build unchanged ordinary native dependencies for the SQL helper probe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object engine/core/include/laplace/core/intent_stage.h)" = 15596ab1dfb77e3e0a8fb1b21945870941dd957a
          test "$(git hash-object engine/core/include/laplace/core/physicality_descriptor.h)" = 336a0ee1934642b36701d3339baf2a92f0c82846
          test "$(git hash-object engine/core/include/laplace/core/physicality_descriptor_admission.h)" = 0534aba1c5ff70faeec80baeecfa59c87c63662c
          test "$(git hash-object engine/core/src/intent_stage.c)" = 7a06976ca24dc60748956777006fb00142076c42
          test "$(git hash-object engine/core/src/physicality_descriptor.c)" = cbc8734df84c81847fa0b862c4732551a5c4f1d6
          test "$(git hash-object engine/core/src/physicality_descriptor_admission.cpp)" = c26c5348cc58909435d87e38f5da0da91b2f2881
          test "$(git hash-object engine/core/src/physicality_descriptor_stage.c)" = 511c125704fc80a1437ad8b4963d6c3813a9a5ac
          test "$(git hash-object engine/core/tests/test_physicality_descriptor.cpp)" = ccf80107f5ec3adf8ac848a84041c6fa2fdf4d36
          test "$(git hash-object engine/core/tests/test_physicality_descriptor_admission.cpp)" = e8213f5eddb5779ec9969c9edfda7a5388e35ee7
          test "$(git hash-object engine/core/tests/test_physicality_descriptor_provider.cpp)" = ec4726a5babd9bd8d6769da9f0264d8907888ab1
          test "$(git hash-object extension/laplace_substrate/src/physicality_descriptor_admission.c)" = 8ff541d2fefd2c3813d423879a4587b42c81860e
          test "$(git rev-parse HEAD^)" = 6cef77a55870103657f9494dd83e84d87e7f3ab6
          test "$(git hash-object extension/laplace_substrate/tests/physicality_descriptor_native_probe.c)" = 9ef9074027e910cb6b25f5786bbaa3c13cbaa27e
          qualification_dir="/build/laplace/work/physicality-capture-sql-helpers/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$qualification_dir"
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$qualification_dir"
          export QUALIFICATION_DIR="$qualification_dir"
          printf 'QUALIFICATION_DIR=%s\n' "$qualification_dir" >> "$GITHUB_ENV"
          mkdir -m 0700 "$qualification_dir/evidence"
          timeout --signal=TERM --kill-after=15s 300s sudo apt-get update 2>&1 | tee "$qualification_dir/evidence/apt-update.log"
          timeout --signal=TERM --kill-after=15s 300s sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libicu-dev libxml2-dev zlib1g-dev bison flex 2>&1 | tee "$qualification_dir/evidence/apt-install.log"
          cc --version | tee "$qualification_dir/evidence/compiler.txt"
          cmake --version | tee "$qualification_dir/evidence/cmake.txt"
          python3 - <<'PY' 2>&1 | tee "$qualification_dir/evidence/acquire.log"
