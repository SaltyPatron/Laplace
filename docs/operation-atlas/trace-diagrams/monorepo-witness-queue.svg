, caller cancellation)</text><line x1="283.851" y1="343.164" x2="325.851" y2="343.164" style="stroke:#181818;stroke-width:1;"/><line x1="325.851" y1="343.164" x2="325.851" y2="356.164" style="stroke:#181818;stroke-width:1;"/><line x1="284.851" y1="356.164" x2="325.851" y2="356.164" style="stroke:#181818;stroke-width:1;"/><polygon points="294.851,352.164,284.851,356.164,294.851,360.164,290.851,356.164" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="290.851" y="338.308" fill="#000" font-size="13" textLength="258.673">await item completion with caller cancellation</text><path d="M1.692,369.164 L1.692,411.164 L666.692,411.164 L666.692,379.164 L656.692,369.164 L1.692,369.164" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M656.692,369.164 L656.692,379.164 L666.692,379.164 L656.692,369.164" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="187.099" y="387.659" fill="#000" font-size="13" textLength="285.759">Cancellation after enqueue stops the caller's wait.</text><text x="187.099" y="404.011" fill="#000" font-size="13" textLength="208.127">It does not remove the queued item.</text><polygon points="629.674,435.219,619.674,439.219,629.674,443.219,625.674,439.219" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="623.674" y1="439.219" x2="844.704" y2="439.219" style="stroke:#181818;stroke-width:1;"/><text x="635.674" y="434.362" fill="#000" font-size="13" textLength="203.03">ReadAllAsync(service cancellation)</text><polygon points="833.704,465.57,843.704,469.57,833.704,473.57,837.704,469.57" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="618.674" y1="469.57" x2="839.704" y2="469.57" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="625.674" y="464.714" fill="#000" font-size="13" textLength="52.743">next item</text><polygon points="1080.227,495.