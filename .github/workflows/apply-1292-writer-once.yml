          new_apply = '''    private async Task<ApplyResult> ApplyCoreAsync(
        IReadOnlyList<SubstrateChange> changes, bool workingSet, bool append,
        Hash128 sourceId, CancellationToken ct)
    {
        ArgumentNullException.ThrowIfNull(changes);
        if (_disposing) throw new ObjectDisposedException(nameof(ConsensusAccumulatingWriter));
        Interlocked.Increment(ref _inflightApplies);
        NpgsqlFoldRecoveryGuard? standaloneGuard = null;
        try
        {
            if (_disposing) throw new ObjectDisposedException(nameof(ConsensusAccumulatingWriter));

            Hash128? journalToken = null;
            Hash128? journalSource = null;
            if (workingSet && changes.Count > 0)
            {
                journalToken = NpgsqlFoldJournal.WorkingSetToken(changes);
                journalSource = changes[0].Metadata.SourceId;
                lock (_foldSourceLock) _foldSources.Add(journalSource.Value);

                // Online/standalone working-set applies have no BeginBulkRun owner,
                // so hold the same recovery guard locally through evidence + fold + ack.
                if (!_bulkRun)
                    standaloneGuard = await NpgsqlFoldRecoveryGuard.AcquireSharedAsync(
                        _ds, _log, ct).ConfigureAwait(false);
            }

            var delta = BuildDelta(changes);

            // A fold that already failed in the background poisons the run NOW,
            // before any more evidence lands. CompleteBulkRun can later repair and
            // clear that poison only from durable evidence.
            await ObserveFoldFailureAsync();

            // Evidence lands FIRST. The flush journal therefore proves evidence
            // durability only; its separate folded bit remains false until every
            // consensus AND mask task for this delta commits.
            var forwarded = ForwardChanges(changes);
            var result = append
                ? await _inner.AppendAsync(forwarded, sourceId, ct)
                : workingSet
                    ? await _inner.ApplyWorkingSetAsync(forwarded, ct)
                    : await _inner.ApplyManyAsync(forwarded, ct);

            Hash128[] foldTypes = delta is null
                ? Array.Empty<Hash128>()
                : NpgsqlFoldJournal.RelationScope(delta.Keys.Select(static key => key.T));

            if (journalToken is { } token && journalSource is { } source
                && !result.JournalReplayHit)
            {
                // Scope is published AFTER evidence durability. A crash before this
                // UPDATE leaves NULL scope, which recovery treats conservatively as
                // "all relations witnessed by this source". Consensus-only/no-evidence
                // folds are intentionally not marked recoverable: there is no durable
                // testimony from which an exact partial-fold repair can be derived.
                bool recoverable = _persistEvidence || delta is null;
                await NpgsqlFoldJournal.RecordScopeAsync(
                    _ds, token, source, foldTypes, recoverable,
                    CancellationToken.None).ConfigureAwait(false);
            }

            if (delta is { Count: > 0 } && !result.JournalReplayHit)
            {
                // From evidence commit onward the fold is an owed continuation, not
                // cancellable speculative work. Bulk mode queues it; online mode awaits
                // it. The acknowledgement is part of that same tracked continuation.
                if (_bulkRun)
                    await EnqueueFoldAsync(
                        delta, journalToken, journalSource, CancellationToken.None)
                        .ConfigureAwait(false);
                else
                {
                    await UpsertDeltaAsync(delta, CancellationToken.None).ConfigureAwait(false);
                    if (journalToken is { } inlineToken && journalSource is { } inlineSource)
                        await NpgsqlFoldJournal.MarkCompletedAsync(
                            _ds, inlineToken, inlineSource, CancellationToken.None)
                            .ConfigureAwait(false);
                }
            }
            else if (!result.JournalReplayHit
                     && journalToken is { } emptyToken
                     && journalSource is { } emptySource)
            {
                // No testimony means no derived continuation is owed, but the state
                // transition is still explicit rather than inferred from an empty delta.
                await NpgsqlFoldJournal.MarkCompletedAsync(
                    _ds, emptyToken, emptySource, CancellationToken.None)
                    .ConfigureAwait(false);
            }

            if (result.JournalReplayHit && !_bulkRun && journalSource is { } replaySource)
            {
                // A replay token no longer means the fold landed. Release our shared
                // guard before taking recovery exclusive, then reconstruct idempotently.
                if (standaloneGuard is not null)
                {
                    await standaloneGuard.DisposeAsync().ConfigureAwait(false);
                    standaloneGuard = null;
                }
                if (_persistEvidence)
                    await NpgsqlFoldJournal.RecoverSourceAsync(
                        _ds, replaySource, _log, CancellationToken.None)
                        .ConfigureAwait(false);
                long remaining = await NpgsqlFoldJournal.CountUnfoldedSourceAsync(
                    _ds, replaySource, CancellationToken.None).ConfigureAwait(false);
                if (remaining != 0)
                    throw new InvalidOperationException(
                        $"working-set replay for {replaySource} still has {remaining} unfinished fold token(s); "
                        + "the outstanding token is not evidence-recoverable");
            }

            return result;
        }
        finally
        {
            if (standaloneGuard is not null)
                await standaloneGuard.DisposeAsync().ConfigureAwait(false);
            Interlocked.Decrement(ref _inflightApplies);
        }
    }
'''
