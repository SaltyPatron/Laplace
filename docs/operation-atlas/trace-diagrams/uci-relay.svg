cket</text><rect x="28" y="622.184" width="399.5" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="38" y="644.641" fill="#000" font-size="12" textLength="379.5">Try writing quit and close stdin; suppress IOException from that attempt</text><rect x="151.381" y="677.277" width="152.738" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="161.381" y="699.734" fill="#000" font-size="12" textLength="132.738">Wait up to three seconds</text><rect x="130.047" y="784.918" width="195.406" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="140.047" y="807.375" fill="#000" font-size="12" textLength="175.406">Kill entire process tree; await exit</text><polygon points="204.823,736,250.677,736,262.677,748,250.677,760,204.823,760,192.823,748,204.823,736" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="231.75" y="771.419" fill="#000" font-size="11" textLength="17.118">yes</text><text x="204.823" y="752.501" fill="#000" font-size="11" textLength="45.853">Timeout?</text><polygon points="227.75,840.012,239.75,852.012,227.75,864.012,215.75,852.012,227.75,840.012" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="175.476,573.266,280.024,573.266,292.024,585.266,280.024,597.266,175.476,597.266,163.476,585.266,175.476,573.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="231.75" y="608.685" fill="#000" font-size="11" textLength="17.118">yes</text><text x="175.476" y="589.767" fill="#000" font-size="11" textLength="104.548">Process still running?</text><polygon points="227.75,884.012,239.75,896.012,227.75,908.012,215.75,896.012,227.75,884.012" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="1