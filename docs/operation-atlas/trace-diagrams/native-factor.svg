<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:656px;height:1010px;background:#FAFCFF;" width="656px" height="1010px" viewBox="0 0 656 1010" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="656" height="1010" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="5"><text x="201.999" y="34.533" fill="#000" font-size="14" textLength="250.94" font-weight="700">Native — repeated-block factorization</text></g><ellipse cx="296.289" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="185.227" y="93.609" width="222.125" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="195.227" y="116.066" fill="#000" font-size="12" textLength="202.125">Initialize input cursor and output count</text><rect x="116.525" y="205.622" width="359.527" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="126.525" y="228.079" fill="#000" font-size="12" textLength="339.527">Search block lengths from two through half the remaining length</text><rect x="107.865" y="260.716" width="376.848" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="117.865" y="283.173" fill="#000" font-size="12" textLength="356.848">Choose shortest block repeated twice, comparing ordered child IDs</text><rect x="142.869" y="315.81" width="306.84" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="152.869" y="338.267" fill="#000" font-size="12" textLength="286.84">Exclude blocks containing only repetitions of one child</text><polygon points="248.591,370.903,343.987,370.903,355.987,382.903,343.987,394.903,248.591,394.903,236.591,382.903,248.591,370.903" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="248.591" y="387.404" fill="#000" font-size="11" textLength="95.396">No repeated block?</text><text x="219.473" y="380.486" fill="#000" font-size="11" textLength="17.118">yes</text><text x="355.987" y="380.486" fill="#000" font-size="11" textLength="56.262">block found</text><rect x="43" y="404.903" width="214.109" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="53" y="427.36" fill="#000" font-size="12" textLength="194.109">Copy one reference; advance cursor</text><rect x="340.807" y="404.903" width="203.434" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="350.807" y="427.36" fill="#000" font-size="12" textLength="183.434">Count consecutive identical blocks</text><rect x="296.132" y="459.997" width="292.783" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="306.132" y="482.454" fill="#000" font-size="12" textLength="272.783">Allocate block scratch, stack for at most 64 children</text><rect x="357.491" y="521.673" width="170.064" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="367.491" y="544.13" fill="#000" font-size="12" textLength="150.064">Recursively factor one block</text><rect x="277.109" y="576.767" width="330.828" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="287.109" y="599.224" fill="#000" font-size="12" textLength="310.828">Compose factored block using callback or lp_ref_compose</text><rect x="326.806" y="631.86" width="231.436" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="336.806" y="654.317" fill="#000" font-size="12" textLength="211.436">Free heap scratch; clear block said field</text><rect x="320.782" y="686.954" width="243.482" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="330.782" y="709.411" fill="#000" font-size="12" textLength="223.482">Append one block reference per repetition</text><rect x="315.122" y="742.048" width="254.803" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="325.122" y="764.505" fill="#000" font-size="12" textLength="234.803">Advance input by block length times repeats</text><polygon points="296.289,783.142,308.289,795.142,296.289,807.142,284.289,795.142,296.289,783.142" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="254.408,148.703,338.17,148.703,350.17,160.703,338.17,172.703,254.408,172.703,242.408,160.703,254.408,148.703" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="300.289" y="184.122" fill="#000" font-size="11" textLength="17.118">yes</text><text x="254.408" y="165.204" fill="#000" font-size="11" textLength="83.762">Children remain?</text><text x="230.173" y="158.286" fill="#000" font-size="11" textLength="12.235">no</text><rect x="206.572" y="849.142" width="179.434" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="216.572" y="871.599" fill="#000" font-size="12" textLength="159.434">Return output reference count</text><ellipse cx="296.289" cy="915.235" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="296.289" cy="915.235" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="296.289" y1="73.609" x2="296.289" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="292.289,83.609,296.289,93.609,300.289,83.609,296.289,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="296.289" y1="240.716" x2="296.289" y2="260.716" style="stroke:#181818;stroke-width:1;