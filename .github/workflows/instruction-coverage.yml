name: Read instruction relation coverage
on:
  push:
    branches: [ops/instruction-coverage-20260915]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 3
    steps:
      - name: Read bounded current relation and provenance coverage
        shell: bash
        run: |
          set -euo pipefail
          umask 0077
          evidence="/build/laplace/work/instruction-coverage/${GITHUB_RUN_ID}"
          mkdir -p "$evidence"
          echo "INSTRUCTION_COVERAGE_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          cat > "$evidence/relation-coverage.sql" <<'SQL'
          BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY;
          SET LOCAL statement_timeout='45s';
          SET LOCAL lock_timeout='5s';
          SET LOCAL bytea_output='hex';
          WITH
          surface(label,id) AS MATERIALIZED (
           SELECT x,laplace.content_id(convert_to(x,'UTF8'))
           FROM unnest(ARRAY['glacier','pawn','chess','water','Water']) x
          ),
          roster AS MATERIALIZED (
           SELECT laplace.source_id('WordNetDecomposer') AS wordnet,
           laplace.relation_type_id('HAS_SENSE') AS has_sense,
           laplace.relation_type_id('IS_SENSE_OF') AS sense_of,
           ARRAY[laplace.relation_type_id('HAS_DEFINITION'),laplace.relation_type_id('HAS_DOMAIN_TOPIC'),
           laplace.relation_type_id('HAS_CONTEXT'),laplace.relation_type_id('HAS_SUBSTANCE'),
           laplace.relation_type_id('MADE_UP_OF')] AS fact_types
          ),
          variants AS MATERIALIZED (
           SELECT * FROM lexical.word_case_variants_batch(ARRAY(SELECT id FROM surface)) LIMIT 65
          ),
          roots AS MATERIALIZED (
           SELECT id FROM surface UNION SELECT variant_id FROM variants
          ),
          senses AS MATERIALIZED (
           SELECT a.* FROM laplace.attestations a
           WHERE a.subject_id=ANY(ARRAY(SELECT id FROM roots))
           AND a.source_id=(SELECT wordnet FROM roster) AND a.type_id=(SELECT has_sense FROM roster)
           ORDER BY id LIMIT 129
          ),
          synsets AS MATERIALIZED (
           SELECT a.* FROM laplace.attestations a
           WHERE a.subject_id=ANY(ARRAY(SELECT object_id FROM senses WHERE object_id IS NOT NULL))
           AND a.source_id=(SELECT wordnet FROM roster) AND a.type_id=(SELECT sense_of FROM roster)
           ORDER BY id LIMIT 129
          ),
          inputs AS MATERIALIZED (
           SELECT id FROM roots UNION SELECT object_id FROM senses WHERE object_id IS NOT NULL
           UNION SELECT object_id FROM synsets WHERE object_id IS NOT NULL
          ),
          facts AS MATERIALIZED (
           SELECT a.* FROM laplace.attestations a
           WHERE a.subject_id=ANY(ARRAY(SELECT id FROM inputs)) AND a.type_id=ANY((SELECT fact_types FROM roster)::bytea[])
           ORDER BY id LIMIT 257
          ),
          evidence AS MATERIALIZED (
           SELECT 'sense'::text AS lane,a.* FROM senses a UNION ALL SELECT 'synset',a.* FROM synsets a
           UNION ALL SELECT 'fact',a.* FROM facts a
          ),
          records AS MATERIALIZED (
           SELECT e.*,to_jsonb(c) AS standing,consensus.walk_edge_weight(c.rating,c.rd)>0 AS positive_standing
           FROM evidence e LEFT JOIN laplace.consensus c
           ON c.subject_id=e.subject_id AND c.type_id=e.type_id AND c.object_id=e.object_id
          ),
          ids AS MATERIALIZED (
           SELECT array_agg(id ORDER BY id) AS ids FROM (
           SELECT id FROM inputs UNION SELECT object_id FROM facts WHERE object_id IS NOT NULL) x
          ),
          rendered AS MATERIALIZED (SELECT ids,realize.batch(ids) AS surfaces FROM ids),
          counts AS (
           SELECT (SELECT count(*) FROM variants) AS variants,(SELECT count(*) FROM senses) AS senses,
           (SELECT count(*) FROM synsets) AS synsets,(SELECT count(*) FROM facts) AS facts
          )
          SELECT jsonb_build_object(
           'schema','laplace.lexical-instruction-coverage/v1','database',current_database(),
           'linked_core_version',laplace.laplace_substrate_version(),
           'server_version',current_setting('server_version'),
           'snapshot',pg_current_snapshot()::text,'observed_at',transaction_timestamp(),
           'read_only',current_setting('transaction_read_only'),
           'extensions',(SELECT jsonb_object_agg(extname,extversion) FROM pg_extension WHERE extname IN ('laplace_geom','laplace_substrate')),
           'roster',(SELECT to_jsonb(x) FROM roster x),
           'surfaces',(SELECT jsonb_agg(to_jsonb(x)) FROM surface x),
           'case_variants',(SELECT jsonb_agg(to_jsonb(x)) FROM variants x),
           'counts',(SELECT to_jsonb(x) FROM counts x),
           'complete',(SELECT variants<=64 AND senses<=128 AND synsets<=128 AND facts<=256 FROM counts),
           'evidence',(SELECT jsonb_agg(to_jsonb(x) ORDER BY lane,id) FROM records x),
           'entities',(SELECT jsonb_agg(to_jsonb(e) ORDER BY e.id) FROM laplace.entities e WHERE e.id=ANY((SELECT ids FROM ids)::bytea[])),
           'realization',(SELECT to_jsonb(x) FROM rendered x));
          ROLLBACK;
          SQL
          sha256sum "$evidence/relation-coverage.sql" > "$evidence/query.sha256"
          /opt/laplace/pgsql-18/bin/psql --version > "$evidence/postgresql-version.txt"
          /opt/laplace/pgsql-18/bin/psql -X -q -A -t -v ON_ERROR_STOP=1 \
            -h /var/run/postgresql -p 5432 -U laplace_admin -d laplace \
            -f "$evidence/relation-coverage.sql" > "$evidence/relation-coverage.json"
          python3 - "$evidence/relation-coverage.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_bytes())
          print(json.dumps({"bytes":p.stat().st_size,"counts":d["counts"],"complete":d["complete"]}))
          PY
      - name: Retain actual read-only results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instruction-coverage-${{ github.run_id }}
          path: /build/laplace/work/instruction-coverage/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
