,697.371,249.106,687.371,245.106,691.371" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="245.106" y1="1317.911" x2="245.106" y2="1337.911" style="stroke:#181818;stroke-width:1;"/><polygon points="241.106,1327.911,245.106,1337.911,249.106,1327.911,245.106,1331.911" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="245.106" y1="1373.005" x2="245.106" y2="1393.005" style="stroke:#181818;stroke-width:1;"/><polygon points="241.106,1383.005,245.106,1393.005,249.106,1383.005,245.106,1387.005" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="34"><text x="54.23" y="1434.386" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="41.459" y="1446.964" fill="#888" font-size="10" textLength="411.294">claimed. Entire train module reviewed. Dataset assigns whole shards among workers, makes</text><text x="54.917" y="1459.542" fill="#888" font-size="10" textLength="384.38">context+1 windows and pads the final remainder with ignored labels. Runtime provider,</text><text x="70.356" y="1472.12" fill="#888" font-size="10" textLength="353.501">model architecture, optimizer/library internals, distributed counting accuracy and</text><text x="57.839" y="1484.698" fill="#888" font-size="10" textLength="378.535">resumability acceptance remain separate. Nothing was trained or exported during this</text><text x="226.264" y="1497.276" fill="#888" font-size="10" textLength="41.685">research.</text></g><?plantuml-src dLLDRzj64BtpLmpGGsnKaKNhspeKhc8Z0PAqi084wCKOxWwbhQXTTdTfHJtrH_GNzfVqBId9AjfJBmB5tPbvyzwRuHjwU35Qh98x-iXrnKhUBfrz4HkDirpT1AzkgkxWMLqUgChqwmEjtj_VZYSqdEW1vyD9ELU5ZChfHCt7ys8ooekXdXUtMascaqa-LyoJuL3bnMnwEofv9YhFotmudcTl_ZUGwDdO2oW3det7eq6fY-54yca-oaTJ6Gv7eo6NCfqFPiAirV1sEizduzl1O33EPIJ36PS9efvdOMji