name: Seed — chess openings

# ONE COMPONENT, ONE WORKFLOW. ECO opening book (ChessOpenings, TSV)
#
# There is exactly one corpus for this source, so there is no corpus dropdown
# and no way to hand it the wrong format. That is the point of splitting these
# out of seed-chess.yml: run 30751844265 fed a PGN to the openings TSV reader
# because one shared input set drove four different decomposers.
#
# seed-chess.yml remains for batch/ladder runs. This is the explicit one.

on:
  workflow_dispatch:
    inputs:
      path:
        description: "override the default corpus ($LAPLACE_DATA_ROOT/Games/Chess/openings)"
        type: string
        required: false
        default: ""
      database:
        description: "target DB (one database: laplace)"
        type: choice
        options: [laplace]
        default: laplace

permissions:
  contents: read

jobs:
  resolve:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 2
    outputs:
      path: ${{ steps.pick.outputs.path }}
    steps:
      - id: pick
        run: |
          root="${LAPLACE_DATA_ROOT:-/vault/Data}"
          p="${{ inputs.path }}"
          [ -n "$p" ] || p="$root/Games/Chess/openings"
          [ -e "$p" ] || { echo "::error::$p does not exist on this runner"; exit 1; }
          echo "resolved -> $p"
          echo "path=$p" >> "$GITHUB_OUTPUT"

  seed:
    needs: resolve
    uses: ./.github/workflows/_ingest.yml
    with:
      source: openings
      path: ${{ needs.resolve.outputs.path }}
      database: ${{ inputs.database }}
      timeout_minutes: 720
      # Gates ON. These were `false` with the comment "chess is not in
      # decomposer-gates.json" -- true at the time, and the reason every chess seed
      # run was green on the ingest exit code alone. The entries exist now
      # (chess / openings / chess-books / chess-syzygy), so the run proves the
      # consensus cells landed, and re-ingest proves it does not double-count
      # testimony (which re-ingest DOES, by design, if a lane is not idempotent).
      run_gate: true
      run_idempotency: true
