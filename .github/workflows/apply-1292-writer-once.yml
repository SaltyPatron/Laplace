          new_begin = '''    public async Task BeginBulkRunAsync(CancellationToken ct = default)
    {
        if (_foldRecoveryGuard is not null)
            throw new InvalidOperationException("bulk fold recovery guard is already held");

        // A process crash releases its session guard automatically. Repair only when
        // the substrate is quiescent enough to take recovery exclusive immediately;
        // another live ingest returns -1 and remains concurrent rather than being
        // serialized behind this startup check.
        await NpgsqlFoldJournal.RecoverAllQuiescentAsync(_ds, _log, ct).ConfigureAwait(false);
        var guard = await NpgsqlFoldRecoveryGuard.AcquireSharedAsync(
            _ds, _log, ct).ConfigureAwait(false);
        _foldRecoveryGuard = guard;

        try
        {
            Interlocked.Exchange(ref _consensusBackendTicks, 0);
            Interlocked.Exchange(ref _highwayMaskBackendTicks, 0);
            Interlocked.Exchange(ref _consensusUpsertCalls, 0);
            Interlocked.Exchange(ref _highwayMaskCalls, 0);
            Interlocked.Exchange(ref _highwayMaskPairs, 0);
            LastFoldDrainWallClock = TimeSpan.Zero;
            LastWriterMaintenanceWallClock = TimeSpan.Zero;
            LastFoldSpanWallClock = TimeSpan.Zero;
            Interlocked.Exchange(ref _foldSpanStarted, 0);
            lock (_foldSourceLock) _foldSources.Clear();
            foreach (var deposited in _depositedMaskPairs) deposited.Clear();
            _bulkRun = true;
            FoldSizing.Log();
            await _inner.BeginBulkRunAsync(ct).ConfigureAwait(false);
        }
        catch
        {
            _bulkRun = false;
            _foldRecoveryGuard = null;
            await guard.DisposeAsync().ConfigureAwait(false);
            throw;
        }
    }
'''
