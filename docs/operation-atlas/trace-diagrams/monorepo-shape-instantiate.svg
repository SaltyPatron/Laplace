/text><text x="384.744" y="220.298" fill="#000" font-size="11" textLength="75.818">Next input slot?</text><text x="348.273" y="213.38" fill="#000" font-size="11" textLength="24.471">done</text><rect x="241.55" y="633.813" width="362.205" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="251.55" y="656.271" fill="#000" font-size="12" textLength="342.205">Require existing operation count plus combinations within fanout</text><rect x="212.543" y="750.743" width="420.219" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="222.543" y="773.2" fill="#000" font-size="12" textLength="400.219">Append predicate, shape, source/context, call/example/exemplar witnesses</text><rect x="235.884" y="805.837" width="373.537" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="245.884" y="828.294" fill="#000" font-size="12" textLength="353.537">Record each selected input, slot witness and exact singleton origin</text><polygon points="352.641,860.931,492.665,860.931,504.665,872.931,492.665,884.931,352.641,884.931,340.641,872.931,352.641,860.931" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="352.641" y="877.432" fill="#000" font-size="11" textLength="140.024">No supported current parse?</text><text x="323.523" y="870.514" fill="#000" font-size="11" textLength="17.118">yes</text><text x="504.665" y="870.514" fill="#000" font-size="11" textLength="58.69">parse exists</text><rect x="82.837" y="894.931" width="353.492" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="92.837" y="917.388" fill="#000" font-size="12" textLength="333.492">Calculate request-projection ID from domain, shape, exemplar,</text><text x="92.837" y="932.481" fill="#000" font-size="12" textLength="247.465">root, ordered forms/origins and selected inputs</tex