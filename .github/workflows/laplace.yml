name: Laplace — product lifecycle

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/**"
      - "scripts/api-diagnostics.py"
      - "web/scripts/capture-ui-diagnostics.mjs"
  workflow_dispatch:
    inputs:
      stage:
        description: "explicit product lifecycle stage"
        type: choice
        required: true
        default: build
        options: [provision, build, install, applications, deploy, proof, test-dev, test-db, test-live, reconcile, check]
      full_clean:
        description: "build/deploy/proof: wipe build/ before building"
        type: boolean
        default: false
      force_codegen:
        description: "build/deploy/proof: regenerate attestation-law source before building"
        type: boolean
        default: false
      serial_tests:
        description: "test stages: force serial ctest"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mainline:
    if: github.event_name == 'push'
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: mainline
      target_sha: ${{ github.sha }}
    secrets: inherit

  operator:
    if: github.event_name == 'workflow_dispatch' && inputs.stage != 'deploy' && inputs.stage != 'proof'
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: ${{ inputs.stage }}
      target_sha: ${{ github.sha }}
      full_clean: ${{ inputs.full_clean }}
      force_codegen: ${{ inputs.force_codegen }}
      serial_tests: ${{ inputs.serial_tests }}
    secrets: inherit

  deploy-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'deploy'
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: release-candidate
      target_sha: ${{ github.sha }}
      full_clean: ${{ inputs.full_clean }}
      force_codegen: ${{ inputs.force_codegen }}
      serial_tests: ${{ inputs.serial_tests }}
    secrets: inherit

  deploy-activation:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'deploy'
    needs: deploy-candidate
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: release-activation
      target_sha: ${{ github.sha }}
      serial_tests: ${{ inputs.serial_tests }}
    secrets: inherit

  proof-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'proof'
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: release-candidate
      target_sha: ${{ github.sha }}
      full_clean: ${{ inputs.full_clean }}
      force_codegen: ${{ inputs.force_codegen }}
      serial_tests: ${{ inputs.serial_tests }}
    secrets: inherit

  proof-model:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'proof'
    needs: proof-candidate
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: proof-model
      target_sha: ${{ github.sha }}
    secrets: inherit

  proof-activation:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'proof'
    needs: proof-model
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: release-activation
      target_sha: ${{ github.sha }}
      serial_tests: ${{ inputs.serial_tests }}
    secrets: inherit
