name: Data — foundation ingest
run-name: "Foundation ingest — ${{ inputs.source }} → ${{ inputs.database }}"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source name or alias from the recipe catalog; ladder runs the foundation campaign"
        type: string
        required: true
        default: ladder
      advanced_path_override:
        description: "ADVANCED: local file/directory override for a single source; normally leave blank"
        type: string
        required: false
        default: ""
      database:
        description: "target database"
        type: choice
        options: [laplace-mono]
        default: laplace-mono
      force:
        description: "Ladder only: re-ingest every rung instead of completing only missing work"
        type: boolean
        default: false
      replace_existing:
        description: "Single source only: lawfully evict that source's existing testimony before re-ingest"
        type: boolean
        default: false
      confirm_replace:
        description: "Single source only: second explicit confirmation for destructive source replacement"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  seed:
    if: inputs.source != 'ladder'
    uses: ./.github/workflows/seed.yml
    with:
      mode: source
      source: ${{ inputs.source }}
      path: ${{ inputs.advanced_path_override }}
      database: ${{ inputs.database }}
      evict_before_ingest: ${{ inputs.replace_existing }}
      confirm_evict: ${{ inputs.confirm_replace }}

  ladder:
    if: inputs.source == 'ladder'
    uses: ./.github/workflows/seed.yml
    with:
      mode: foundation-ladder
      database: ${{ inputs.database }}
      force: ${{ inputs.force }}
