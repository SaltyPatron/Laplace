<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:674px;height:717px;background:#FAFCFF;" width="674px" height="717px" viewBox="0 0 674 717" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="674" height="717" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="9"><text x="101.644" y="34.533" fill="#000" font-size="14" textLength="468.727" font-weight="700">Monorepo — quote consumption before inference and separate ledger</text></g><ellipse cx="200.439" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="47.342" y="93.609" width="306.195" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="57.342" y="116.066" fill="#000" font-size="12" textLength="286.195">Chat/completion/embedding endpoint calls quote gate</text><rect x="97.39" y="197.621" width="206.1" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="107.39" y="220.078" fill="#000" font-size="12" textLength="186.1">Return payment-required response</text><ellipse cx="200.439" cy="271.668" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="200.439" cy="271.668" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="167.413,148.703,233.466,148.703,245.466,160.703,233.466,172.703,167.413,172.703,155.413,160.703,167.413,148.703" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="204.439" y="184.122" fill="#000" font-size="11" textLength="17.118">yes</text><text x="167.413" y="165.204" fill="#000" font-size="11" textLength="66.054">Gate denied?</text><rect x="16" y="373.586" width="368.879" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="396.043" fill="#000" font-size="12" textLength="348.879">Upsert supplied quote with consumed=true and status=consumed</text><rect x="64.706" y="443.68" width="271.467" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="74.706" y="466.137" fill="#000" font-size="12" textLength="251.467">Insert billing usage record in separate store call</text><polygon points="148.458,324.668,252.421,324.668,264.421,336.668,252.421,348.668,148.458,348.668,136.458,336.668,148.458,324.668" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="204.439" y="360.087" fill="#000" font-size="11" textLength="17.118">yes</text><text x="148.458" y="341.169" fill="#000" font-size="11" textLength="103.963">Gate supplies quote?</text><polygon points="200.439,498.773,212.439,510.773,200.439,522.773,188.439,510.773,200.439,498.773" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M319.83,532.773 L319.83,558.301 L299.83,562.301 L319.83,566.301 L319.83,591.828 A0,0 0 0 0 319.83,591.828 L653.014,591.828 A0,0 0 0 0 653.014,591.828 L653.014,542.773 L643.014,532.773 L319.83,532.773 A0,0 0 0 0 319.83,532.773" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M643.014,532.773 L643.014,542.773 L653.014,542.773 L643.014,532.773" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="325.83" y="551.269" fill="#000" font-size="13" textLength="283.283">Consumption and usage write precede inference.</text><text x="325.83" y="567.62" fill="#000" font-size="13" textLength="312.184">A later inference failure does not trigger a refund here.</text><text x="325.83" y="583.972" fill="#000" font-size="13" textLength="309.315">Failure after quote update can leave no usage record.</text><rect x="101.049" y="544.754" width="198.781" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="111.049" y="567.211" fill="#000" font-size="12" textLength="178.781">Continue inference endpoint work</text><ellipse cx="200.439" cy="622.828" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="200.439" cy="622.828" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="200.439" y1="73.609" x2="200.439" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="196.439,83.609,200.439,93.609,204.439,83.609,200.439,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="200.439" y1="232.715" x2="200.439" y2="260.668" style="stroke:#181818;stroke-width:1;"/><polygon points="196.439,250.668,200.439,260.668,204.439,250.668,200.439,254.668" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="200.439" y1="172.703" x2="200.439" y2="197.621" style="stroke:#181818;stroke-width:1;"/><polygon points="196.439,187.621,200.439,197.621,204.439,187.621,200.439,191.621" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="245.466" y1="160.703" x2="313.489" y2="160.703" style="stroke:#181818;stroke-width:1;"/><polygon points="309.489,230.668,313.489,240.668,317.489,230.668,313.489,234.668" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="313.489" y1="160.703" x2="313.489" y2="304.668" style="stroke:#181818;stroke-width:1;"/><line x1="313.489" y1="304.668" x2="200.439" y2="304.668" style="stroke:#181818;stroke-width:1;"/><line x1="200.439" y1="304.668" x2="200.439" y2="324.668" style="stroke:#181818;stroke-width:1;"/><polygon points="196.439,314.668,200.439,324.668,204.439,314.668,200.439,318.668" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="200.439" y1="128.703" x2="200.439" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="196.439,138.703,200.439,148.703,204.439,138.703,200.439,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="200.439" y1="408.68" x2="200.439" y2="443.68" style="stroke:#181818;stroke-width:1;"/><polygon points="196.439,433.68,200.439,443.68,204.439,433.68,200.439,437.68" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="200.439" y1="348.668" x2="200.439" y2="373.586" style="stroke:#181818;stroke-width:1;"/><polygon points="196.439,363.586,200.439,373.586,204.439,363.586,200.439,367.586" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="264.421" y1="336.668" x2="394.879" y2="336.668" style="stroke:#181818;stroke-width:1;"/><polygon points="390.879,416.18,394.879,426.18,398.879,416.18,394.879,420.18" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="394.879" y1="336.668" x2="394.879" y2="510.773" style="stroke:#181818;stroke-width:1;"/><line x1="394.879" y1="510.773" x2="212.439" y2="510.773" style="stroke:#181818;stroke-width:1;"/><polygon points="222.439,506.773,212.439,510.773,222.439,514.773,218.439,510.773" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="200.439" y1="478.773" x2="200.439" y2="498.773" style="stroke:#181818;stroke-width:1;"/><polygon points="196.439,488.773,200.439,498.773,204.439,488.773,200.439,492.773" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="200.439" y1="522.773" x2="200.439" y2="544.754" style="stroke:#181818;stroke-width:1;"/><polygon points="196.439,534.754,200.439,544.754,204.439,534.754,200.439,538.754" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="200.439" y1="579.848" x2="200.439" y2="611.828" style="stroke:#181818;stroke-width:1;"/><polygon points="196.439,601.828,200.439,611.828,204.439,601.828,200.439,605.828" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="27"><text x="143.131" y="653.209" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="167.299" y="665.787" fill="#888" font-size="10" textLength="337.417">claimed. Reviewed concrete endpoint ordering and both PostgreSQL stores.</text><text x="116.022" y="678.365" fill="#888" font-size="10" textLength="439.971">MarkConsumedAndRecordAsync does not compare-and-set consumed=false and does not share a</text><text x="139.784" y="690.943" fill="#888" font-size="10" textLength="392.446">transaction across quote and ledger updates. It records an ExecutedAt timestamp before</text><text x="187.865" y="703.521" fill="#888" font-size="10" textLength="296.284">later inference; the row alone is not proof that inference completed.</text></g><?plantuml-src jLFRRkCs47tNLn3em-u-n9Qe6vLWKRX6t0P8jjqO_O0XERI5oAIMfEBcRJ-YNzWlwSYM4tKV0_ID88TdpfnpvWExVMurMeNNx1xw3XGkeU-NqtbnQtNlMXl3ulSUxUfkxGuznEKlRTUrThTGWMr_M_6oOZpNUOC5OCgvoRIgZPGgBKieU8uvBqGjcweg90h8q3Iw4aAbFESSAfw1R98FxsFoTN0HVuM8Cow5WBJXMLqMMcALwn9ID7b5lOMe6e2c46c3ZG1TwPf8ALaqgkIwACgKZkAzN2xN3rHBweJ5dJNeHvWPEGrLgGkUcP8crrohhAXbgL8bQv7BfiZA6ZFEQvCsUPCAX2gNHTxafb6LqNdwNdAJPN-u47SUm_9ocEvFEcwZytEkQTr8fHLeZQAe1VcbZTAPA6MMrgX4tPWSyjAOMcAcmJHbKHL5sWYPcqmKsV_4zHxr3lsCfyo55fdcv6fL2ugQQJYl1CMEvtdDjKohIfBtN9SwfrX8aGEYCGrK588Qa_3KsXuy79W4zRJpRh1wxJhdsK-RrMQzsSmgmXwqEn8DPg0ByxyQ3GnTt3WRly01sHPisA9lJHBRs25xS9RqxHtxv_lVxDieE5FEXk7GnzPP9j7GCsileM5WDGiuObDbTnew2H5yJAxNUv99aLeTZd-NU92ezKWA9qcPWguBKviT8TmahM4VnrKXehP5_VCd5lTesSSN39yITls8SV2MzV1oG1klF7uRMe-QaV0zqIG05gBh4-f08xs2XQ7lknQdLZ-2_ja7zF5If2S-npRkfzbHVuv-c8QD48Vm-V903Q_lxEc_F3lFXW0x94RAUKrAlSaJnkYUPhwP25wloOVM3dD5NyKvElzqa