ext><text x="490.998" y="893.523" fill="#888" font-size="10" textLength="379.663">only. File replacement and database deposition still have no shared transaction. Retry</text><text x="478.493" y="906.102" fill="#888" font-size="10" textLength="404.673">idempotence after an acknowledged or uncertain commit depends on the shared writer; this</text><text x="476.552" y="918.68" fill="#888" font-size="10" textLength="408.555">diagram does not assert runtime acceptance. An empty game can complete without nonzero</text><text x="646.364" y="931.258" fill="#888" font-size="10" textLength="68.931">playing identity.</text></g><?plantuml-src bLRDSjis4BxpAJ3JGv8PMJ-MB5dHeUDnewQPnEdOcUcn0m9B2JK8C01eHJdr8Vg4VP9-2vAoalRIcqK2kz_VBlr2l7aocfoYr-AzRAnKD95DC-d_7j_kASR90uKdWpVvrtlpH3_BcjxwcCOgYeUtDvTNIw4kPxIOpLPJgYfPaQ9bITNwUggNyyNbibfDLxfQovMc-K9Er-lBKb_9rTLYiPekAgKL5I_-FvHVhJn-R2Z8PBmxmt8zNypaUhvO45LNKxbObfTQgLMv9ZMTNHELrpCrkrHJfSjvTJsTbNGz0yhLNAwdbPvEY_XeN2E3h4KfrUCk-DRfMszz43ziRxQts-tPYRYNsX-CsubAsaXdRpHLihLfwrswWs3YGRe8_AOgaacMn0VlVA362yLanDz__YL0zIWgOsaay8P_IAU5ydLZYKdYgV9F58wYP4mo78kOP4Y5gSJB1_b40XXlVLsRz07dVdmbqfwSU7ca-AeGhxcxjEOheSxdbcAYC49rb-XB6k6gfa1QrBWPH-WixJ6Qc26WIoAHl6YTmKsHg6vyGF-CTeFQlmMJwDCUMkts6x6rRTppUMtYuoQN50mSZPCq3btUFNoy4urCUxxyYL4sRMaDRhMDHZCj_61jHc3SHKsrHyTSB0FQ50J9cVizo41CKPiOsGjh-0nanVNlLRWdgPznF7U1e1bWhx3rwd6JZtzk3Kfxj_CepJe9-j9Oeqp2wTZMT8yxGNFVWqbxSIlTFQLmF3tkocG_ATVE52pjfBLGC7Z4YE7hIPyPaLs5oJBeSmoLWIb3DBPlxeJS1QBOjJrHmelkaWh4jkNJlHYivKWSM8ymm1jbkIvs7DAohIeAdUb30ZgPnSkjSV2dax2JUoWA2noHfWnswxFDe1a6wOBPzSXxYAmRQEOk-ezM6zKxpNnGfFDqK9MSB2tfxuna65pkcmeR4UKGZsU6OeBy_Du4Z_8HVFBTiZLMYpFMdHCdZ7aElX52OASnRUmbUynLRhlHp1ln9XwTmjGtFfeKHMpBc0B3K7lfThGvGumURU0UR0tZ--Kdl2QdiHmmfioW7teQPg-tc0aX9nY_T9nWkB8mF6MvAmk00XyT4ggeoP9cFIffxAaKKm82pEgXFnrRfNW71UgIoTDpdXea86E3wqrHUO_5KJpuDYYw2FHawC2357YFfNuRYpjUB-X8jNJ9g5oRgMFUO9Bp8hHu3ksbOgGIYxzGLkA97elxeUXf6ZiDnLALUgtKSZx-zvGDSOjdllV96HMdHvDpAKRFRdyRGzUrtZaioo6jO_7cUUpxQiKGT6nHS6yLZ4T6Xq1ndGQtyTK2BDyck4hCFjIOXgpmYM6dJnpsp4NXdJsEnHPeku