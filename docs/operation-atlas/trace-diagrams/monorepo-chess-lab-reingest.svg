urce-line="27"><text x="84.07" y="1052.045" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="87.39" y="1064.623" fill="#888" font-size="10" textLength="379.111">claimed. Complete retained ingestion method and pruning reviewed. Post-ingest input</text><text x="90.452" y="1077.201" fill="#888" font-size="10" textLength="372.988">verification and receipt serialization happen after database effects; neither rolls them</text><text x="106.021" y="1089.779" fill="#888" font-size="10" textLength="341.851">back. Receipt writing in finally has no caller cancellation token and can throw,</text><text x="99.077" y="1102.357" fill="#888" font-size="10" textLength="355.737">overriding a pending return or exception. No explicit Flush(true) is used for these</text><text x="97.695" y="1114.936" fill="#888" font-size="10" textLength="358.501">receipts. PGN/experiment measurement is conditional, not universal to every job.</text><text x="80.432" y="1127.514" fill="#888" font-size="10" textLength="393.027">Replay/no-write acceptance depends on nested measurement code; names alone do not</text><text x="251.934" y="1140.092" fill="#888" font-size="10" textLength="50.024">establish it.</text></g><?plantuml-src fLJBakiq4DtxAxgAnPrRDPDt73jPK64WSAaxmzGCi9UbTYn6bema9nDMV0HVo9VGRJkJG1KRMDcMrTsdppdT7-2RWrPe9QxXisYCa3WMJJCUtaVt5OOmVa5_qFId-_eiYk5xzCdkCKJjx4W6UFbkErkce6I1gxISfJAR5PFfD9ykbgMOoqbQBiHykaWd1IuBDLLYjiBbDCMPoifvlfIhPQhIMPfy-5-GBa2epYHTO9xd2p6PgbMwc9V5l4ppYKhd6Q6QKscSvcakPJ7F5jaY5LcnK695i5Uo_2z0dlQsvyJvAoJvQhNCywLIMLPa6IgvpAVbOfKlr3mjL3xBqb9CypAROKRtPelL94jNAb_ozqfAaOHNRHlXHGs5aAzxxrghxfrn7hxORNVtkztLZL09vOxQxg4K9k3L7uMbQ4tSEHiVHOtm8cmWzBfCeeu6uS5Pvx5n8BaL-FFtFy1Z5DgYWgTl7q6eMeT0QeEm2W9oreXqHw9k8ZHjORGKR8SaHE5ZijvfkXZHrzeA0x-u0WWuUZ1Elcv0M-cnHXjXAwC-OCzSs2JhhVorrHwXGN_7KVhiCzXJnGt7zvK7T7jg9uoQlTqakeIRUrSt1YFzk6yZzjrmcgEE5U2RfbH43xvHUitrl_m8iK8BDoSC7nDORyrGmE9ngFtUfMNc2Yo9AJW8erNNy8QYdb6egwGRg