name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-tree:
    name: Tracked tree contains no local/runtime artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Enforce source-tree hygiene and strong secret signatures
        run: python3 scripts/repo-hygiene-gate.py

  release-completed-diagnostic:
    # Release this completed reconciliation's remaining read-only diagnostic once.
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.number == 1590 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/shared-ci-phases-operational-delivery-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    steps:
      - name: Release only the stalled post-reconciliation diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = 'https://api.github.com/repos/SaltyPatron/Laplace'
          run_id = 35008676783
          def request(path, method='GET'):
              req = urllib.request.Request(base + path, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=20) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          run = request(f'/actions/runs/{run_id}')
          if run['status'] == 'completed':
              print('The selected diagnostic already finished; no cancellation.')
              raise SystemExit(0)
          if run['head_sha'] != '927fdc19149861c1181598cff8ccf348485cf25a':
              raise SystemExit('Selected run source changed; no cancellation.')
          jobs = request(f'/actions/runs/{run_id}/jobs?per_page=100')['jobs']
          job = next((j for j in jobs if j['id'] == 104514980884), None)
          if job is None:
              raise SystemExit('Selected job missing; no cancellation.')
          steps = {s['name']: s for s in job['steps']}
          fast = steps.get('Fast source/tooling proof and installed-product reconciliation', {})
          skipped = ('Run full product lifecycle',
                     'Admit official Stockfish source and verify native corpus readback',
                     'Verify ordinary operational execution after Stockfish admission',
                     'Record successful activation for installed chess measurement')
          diagnostic = steps.get('Retain bounded live recursive proof counterexamples', {})
          if fast.get('conclusion') != 'success' or any(steps.get(name, {}).get('conclusion') != 'skipped' for name in skipped):
              raise SystemExit('Reconciliation or skipped delivery steps differ; no cancellation.')
          if diagnostic.get('status') != 'in_progress':
              print('Selected diagnostic no longer running; no cancellation.')
              raise SystemExit(0)
          request(f'/actions/runs/{run_id}/cancel', 'POST')
          print(f'Cancelled remaining diagnostic in run {run_id}; reconciliation finished and delivery was skipped.')
          PY
