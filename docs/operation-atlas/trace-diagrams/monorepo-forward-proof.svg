oke-linejoin:miter;stroke-miterlimit:10;"/><line x1="264.787" y1="573.961" x2="264.787" y2="593.961" style="stroke:#181818;stroke-width:1;"/><polygon points="260.787,583.961,264.787,593.961,268.787,583.961,264.787,587.961" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="264.787" y1="469.949" x2="264.787" y2="489.949" style="stroke:#181818;stroke-width:1;"/><polygon points="260.787,479.949,264.787,489.949,268.787,479.949,264.787,483.949" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="264.787" y1="617.961" x2="264.787" y2="637.961" style="stroke:#181818;stroke-width:1;"/><polygon points="260.787,627.961,264.787,637.961,268.787,627.961,264.787,631.961" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="264.787" y1="673.055" x2="264.787" y2="693.055" style="stroke:#181818;stroke-width:1;"/><polygon points="260.787,683.055,264.787,693.055,268.787,683.055,264.787,687.055" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="264.787" y1="728.148" x2="264.787" y2="748.148" style="stroke:#181818;stroke-width:1;"/><polygon points="260.787,738.148,264.787,748.148,268.787,738.148,264.787,742.148" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="264.787" y1="783.242" x2="264.787" y2="803.242" style="stroke:#181818;stroke-width:1;"/><polygon points="260.787,793.242,264.787,803.242,268.787,793.242,264.787,797.242" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="22"><text x="72.911" y="844.623" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="70.677" y="857.201" fill="#888" font-size="10" textLength="390.22">claimed. The witness event is appended by managed response-proof assembly after the</text><text x="74.586" y="869.779" fill="#888" font-size="10" textLength="382.402">caller’s RecordResponseAsync returns. It is not another native forward execution. This</text><text x="81.529" y="882.357" fill="#888" font-size="10" textLength="368.516">wrapper neither verifies the fingerprint nor proves durable replay from all consumed</text><text x="68.192" y="894.936" fill="#888" font-size="10" textLength="395.19">evidence; RecordResponseAsync skips the write for empty replies, so the synthetic event</text><text x="72.066" y="907.514" fill="#888" font-size="10" textLength="387.441">alone does not establish a response deposit. Native receipt semantics remain separate.</text></g><?plantuml-src RLJBSXit4BplLqnL3h6h9Av4YfGf7bACR5LO5Iifq_VKB31B8i9Yjl0WnPpy4Rdaz_mb6M2NilAuxGBpwEdkmVVmuM0qEKLty3Fs5XNLsFVr-3tvu7JFniKm-QKdjzxSSzTZhC_77oNMk5sOR5nBFfUPg03RdzRJ-G8qBkRwPdhTpd4nrLEjhczkcxcwKitjkrcplBcUtzBrT7hRNYrdowjtX8jPSpDRpjgbMhHwTbM59-DwzDX1W-ffvpavVS-MFNpti7wuVtXu5H7sgFaeMA156-ZLZQOMauqFxE8ZTWHRT65BthHLDD4IV6J7ddg6hr_-14-XPnS8Ui_S0eP0NMDFLOZeOtNtYHIP0m4TI3Y1rdC7SKzWt84LHiDEVZ7cR9qKwN8fnUrfLTrjoPAAO354KCAZfKXrSjAIxO5qZLrZTebJg9kaTnH_e-SzfX2bJEctgamBRnuP8ldEEBJ3yGzlSnS7RquKtbOW66Fo3booTfXYLK68t5Vaj0nzzwldtpEEiM-jE0cKchsHOhMGBAWah-T0TL3eweor_4GYNuSoHKsTaM12Q_uuqx7A_4GqRlW7RJfoGJW95n1ItxCNoj1fo3soKaNGC8nrZzQIproLi1STZYOw4XNqlyTSzs983U7av3WQTOw4wCMu8uGKSfyNlfHuW9w5o96A7vEnUfHQqlSGf800liXdNH-1bKg--1gUw5IETzbJc_Tb4347EkbzYSBdvhqGi77A9atGIb_olPSTkJYBBOLhRMIkO69fmeqrk-8QOKWuwLCsHXBSkRWaYzCbGOvye87ThEmeQj6qPPRfggs4ABhqT31q5B-mLtiAmaGkFe57AYuwmytqTbad5WfNu1YyD1Mr09MYFgBCMocBSg8dy7d_eiB8gX4P2_jIipc15CMTV9urk_pdxW2s0Z6BLwaYyjSlVmMGJMAlFuqfQv5HIO4yNvZ0flHmd8bWIVJWP1BPkvRz4RtimpEfDCpsUMz2TVGPa8IHAU67lD-6Gjc_Lrf8JP_vEyYLJXuREwmddePT5dpP9279v1MDB-FgVy7A0zCFzO_Un08DI3npAWMbjvYUo_qtYnRwAhJi23JJCA9e8pXCs0D-ixscOXEHRXZSvuT73FaV2GFbLoxI97iQHZly3G00?></g></svg>