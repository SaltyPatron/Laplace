name: Laplace — development and operator lifecycle

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "explicit operator lifecycle stage"
        type: choice
        required: true
        default: all
        options: [check, build, test, deploy, integrate, all, application-check, applications]
      full_clean:
        description: "wipe build/ before building"
        type: boolean
        default: false
      force_codegen:
        description: "ignore attestation-law stamp"
        type: boolean
        default: false
      serial_tests:
        description: "force serial ctest"
        type: boolean
        default: false
      force_all:
        description: "ignore content-fingerprint stamps"
        type: boolean
        default: false
      generation_benchmark:
        description: "run the expensive generation benchmark"
        type: boolean
        default: false

permissions:
  contents: read

env:
  LAPLACE_EXTERNAL: ${{ vars.LAPLACE_EXTERNAL || '/build/external' }}
  LAPLACE_INSTALL_PREFIX: ${{ vars.LAPLACE_INSTALL_PREFIX || '/opt/laplace' }}
  LAPLACE_PG_PREFIX: ${{ vars.LAPLACE_PG_PREFIX || '/opt/laplace/pgsql-18' }}
  PGHOST: /var/run/postgresql
  PGPORT: 5432
  PGUSER: laplace_admin
  PGDATABASE: laplace
  LAPLACE_DATA_ROOT: /vault/Data

jobs:
  development:
    name: Development — build and test changed source
    if: github.event_name == 'push'
    runs-on: [self-hosted, laplace]
    timeout-minutes: 120
    concurrency:
      group: laplace-development-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout exact revision without discarding persistent build cache
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --prune --depth=2 origin "$TARGET_SHA"
          git checkout --force "$TARGET_SHA"

      - name: Classify source change
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fast=1
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            fast=0
          else
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA" || true
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                docs/*|.github/*|scripts/test-*|scripts/check-*|scripts/actions-audit.py|scripts/repo-hygiene-gate.py|scripts/test-profiles.json|scripts/benchmark-profiles.json)
                  ;;
                *)
                  fast=0
                  break
                  ;;
              esac
            done < <(git diff --name-only "$BEFORE_SHA" "$TARGET_SHA")
          fi
          echo "LAPLACE_FAST_ONLY=$fast" >> "$GITHUB_ENV"
          echo "development classification: source_only=$fast"

      - name: Validate source-only change
        if: env.LAPLACE_FAST_ONLY == '1'
        run: bash scripts/product-ci.sh check

      - uses: ./.github/actions/setup-laplace-env
        if: env.LAPLACE_FAST_ONLY != '1'

      - name: Verify installed dependencies
        if: env.LAPLACE_FAST_ONLY != '1'
        run: bash scripts/ci-deps.sh --check-only

      - name: Build changed product source
        if: env.LAPLACE_FAST_ONLY != '1'
        run: bash scripts/pipeline.sh build

      - name: Test native engine
        if: env.LAPLACE_FAST_ONLY != '1'
        run: bash scripts/test-parallel.sh --profile dev-native --suite native-dev

      - name: Test managed code
        if: env.LAPLACE_FAST_ONLY != '1'
        run: bash scripts/test-parallel.sh --profile dev-managed --suite managed-dev

      - name: Test UCI runtime
        if: env.LAPLACE_FAST_ONLY != '1'
        run: bash scripts/test-parallel.sh --profile dev-managed --suite uci-dev

      - name: Test browser product
        if: env.LAPLACE_FAST_ONLY != '1'
        run: bash scripts/test-parallel.sh --profile dev-managed --suite browser-dev

  operator:
    name: Operator — ${{ inputs.stage }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, laplace]
    timeout-minutes: 420
    concurrency:
      group: laplace-substrate-lifecycle
      cancel-in-progress: false
    env:
      LAPLACE_STAGE: ${{ inputs.stage }}
      LAPLACE_FORCE_ALL: ${{ inputs.force_all && '1' || '' }}
      LAPLACE_FULL_CLEAN: ${{ inputs.full_clean && '1' || '' }}
      LAPLACE_FORCE_CODEGEN: ${{ inputs.force_codegen && '1' || '' }}
      LAPLACE_TEST_SERIAL: ${{ inputs.serial_tests && '1' || '' }}
      LAPLACE_GENERATION_BENCHMARK: ${{ inputs.generation_benchmark && '1' || '' }}
      LICHESS_API: ${{ secrets.LICHESS_API }}
      LAPLACE_MCP_TOKEN: ${{ secrets.LAPLACE_MCP_TOKEN }}
      LAPLACE_OPERATOR_TOKEN: ${{ secrets.LAPLACE_OPERATOR_TOKEN }}
      STRIPE_API_SECRET: ${{ secrets.STRIPE_API_SECRET }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_API_Publishable: ${{ vars.STRIPE_API_PUBLISHABLE }}
      LAPLACE_AUTH_MICROSOFT_CLIENT_ID: ${{ secrets.LAPLACE_AUTH_MICROSOFT_CLIENT_ID }}
      LAPLACE_AUTH_MICROSOFT_CLIENT_SECRET: ${{ secrets.LAPLACE_AUTH_MICROSOFT_CLIENT_SECRET }}
      LAPLACE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.LAPLACE_AUTH_GOOGLE_CLIENT_ID }}
      LAPLACE_AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.LAPLACE_AUTH_GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Checkout exact requested revision
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --prune --depth=2 origin "$TARGET_SHA"
          git checkout --force "$TARGET_SHA"

      - uses: ./.github/actions/setup-laplace-env

      - name: Run requested lifecycle under one host reservation
        run: |
          set -euo pipefail
          umask 0002
          export TMPDIR=/build/laplace/work TMP=/build/laplace/work TEMP=/build/laplace/work
          mkdir -p /build/laplace/work/ci-sessions
          directory="/build/laplace/work/ci-sessions/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-operator"
          cleanup() {
            python3 scripts/ci-session.py stop --directory "$directory" || true
          }
          trap cleanup EXIT INT TERM HUP
          python3 scripts/ci-session.py start --directory "$directory" \
            --lock /build/laplace/work/host-resource.lock \
            --checkout "$GITHUB_WORKSPACE" --kind product --stage "$LAPLACE_STAGE"
          while IFS= read -r phase; do
            echo "::group::${phase}"
            python3 scripts/ci-session.py run --directory "$directory" --phase "$phase"
            echo "::endgroup::"
          done < <(bash scripts/product-ci.sh "$LAPLACE_STAGE" --list-phases)
          python3 scripts/ci-session.py stop --directory "$directory"
          trap - EXIT INT TERM HUP
