name: Laplace — reusable product stage

on:
  workflow_call:
    inputs:
      stage:
        description: "canonical product lifecycle stage"
        type: string
        required: true
      target_sha:
        description: "exact repository revision to execute"
        type: string
        required: true
      full_clean:
        type: boolean
        required: false
        default: false
      force_codegen:
        type: boolean
        required: false
        default: false
      serial_tests:
        type: boolean
        required: false
        default: false
      dev_suites:
        description: "comma-separated development suites selected by the impact planner; all runs the complete matrix"
        type: string
        required: false
        default: all
      skip_if_superseded:
        description: "skip this selected revision if main advanced before host ownership"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  LAPLACE_EXTERNAL: ${{ vars.LAPLACE_EXTERNAL || '/build/external' }}
  LAPLACE_INSTALL_PREFIX: ${{ vars.LAPLACE_INSTALL_PREFIX || '/opt/laplace' }}
  LAPLACE_PG_PREFIX: ${{ vars.LAPLACE_PG_PREFIX || '/opt/laplace/pgsql-18' }}
  PGHOST: /var/run/postgresql
  PGPORT: 5432
  PGUSER: laplace_admin
  PGDATABASE: laplace
  LAPLACE_DATA_ROOT: /vault/Data

jobs:
  preflight:
    name: Product — freshness preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      execute: ${{ steps.freshness.outputs.execute }}
    steps:
      - name: Reject superseded revision before self-hosted scheduling
        id: freshness
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          SKIP_IF_SUPERSEDED: ${{ inputs.skip_if_superseded && '1' || '0' }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "execute=true" >> "$GITHUB_OUTPUT"
          [[ "$SKIP_IF_SUPERSEDED" == 1 ]] || exit 0

          checkout_auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          latest_main="$(GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $checkout_auth" \
            git ls-remote --heads "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')"
          unset checkout_auth CHECKOUT_TOKEN
          [[ -n "$latest_main" ]] || { echo "::error::could not resolve current main" >&2; exit 1; }

          if [[ "$latest_main" != "$TARGET_SHA" ]]; then
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "::notice::selected revision $TARGET_SHA is superseded by $latest_main; self-hosted product work was not scheduled"
            {
              echo "## Superseded product stage"
              echo
              echo "- Selected: $TARGET_SHA"
              echo "- Current main: $latest_main"
              echo "- Result: no self-hosted product work scheduled"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  stage:
    needs: preflight
    if: needs.preflight.outputs.execute == 'true'
    name: Product — ${{ inputs.stage }}
    concurrency:
      group: ${{ inputs.skip_if_superseded && inputs.stage == 'release-qualification' && 'laplace-main-qualification' || inputs.skip_if_superseded && inputs.stage == 'release-delivery' && 'laplace-main-delivery' || format('laplace-product-stage-{0}-{1}', inputs.stage, github.run_id) }}
      cancel-in-progress: ${{ inputs.skip_if_superseded && inputs.stage == 'release-qualification' }}
    runs-on: [self-hosted, laplace]
    timeout-minutes: 420
    env:
      LAPLACE_STAGE: ${{ inputs.stage }}
      LAPLACE_PROVISION_TOOLS: ${{ inputs.stage == 'provision' && '1' || '0' }}
      LAPLACE_FULL_CLEAN: ${{ inputs.full_clean && '1' || '' }}
      LAPLACE_FORCE_CODEGEN: ${{ inputs.force_codegen && '1' || '' }}
      LAPLACE_TEST_SERIAL: ${{ inputs.serial_tests && '1' || '' }}
      LAPLACE_DEV_SUITES: ${{ inputs.dev_suites }}
      LAPLACE_USE_QUALIFICATION_CACHE: ${{ inputs.skip_if_superseded && inputs.stage == 'release-qualification' && '1' || '0' }}
      LAPLACE_SKIP_IF_SUPERSEDED: ${{ inputs.skip_if_superseded && '1' || '0' }}
      LICHESS_API: ${{ secrets.LICHESS_API }}
      LAPLACE_MCP_TOKEN: ${{ secrets.LAPLACE_MCP_TOKEN }}
      LAPLACE_OPERATOR_TOKEN: ${{ secrets.LAPLACE_OPERATOR_TOKEN }}
      STRIPE_API_SECRET: ${{ secrets.STRIPE_API_SECRET }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_API_Publishable: ${{ vars.STRIPE_API_PUBLISHABLE }}
      LAPLACE_AUTH_MICROSOFT_CLIENT_ID: ${{ secrets.LAPLACE_AUTH_MICROSOFT_CLIENT_ID }}
      LAPLACE_AUTH_MICROSOFT_CLIENT_SECRET: ${{ secrets.LAPLACE_AUTH_MICROSOFT_CLIENT_SECRET }}
      LAPLACE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.LAPLACE_AUTH_GOOGLE_CLIENT_ID }}
      LAPLACE_AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.LAPLACE_AUTH_GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Select exact source, reserve only required resources, execute stage
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 0002

          control_workspace="$GITHUB_WORKSPACE"
          work_root="${LAPLACE_WORK_ROOT:-/build/laplace/work}"
          worktree_root="$work_root/product-worktrees"
          candidate_workspace="$worktree_root/$TARGET_SHA"
          mkdir -p "$worktree_root"

          # The runner checkout is only the Git metadata/control repository.
          # Product work happens in an exact-revision worktree so another revision
          # can never overwrite this candidate's source or build outputs.
          exec 7>"$work_root/git-metadata.lock"
          flock 7
          cd "$control_workspace"
          if [[ ! -e .git ]]; then
            [[ -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]] || {
              echo "::error::nonempty control workspace has no repository; preserving its files" >&2
              exit 1
            }
            git init --initial-branch=main
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          git diff --quiet
          git diff --cached --quiet

          checkout_auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          if [[ "${LAPLACE_SKIP_IF_SUPERSEDED:-0}" == 1 ]]; then
            latest_main="$(GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $checkout_auth" \
              git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
            [[ -n "$latest_main" ]] || { echo "::error::could not resolve current main" >&2; exit 1; }
            if [[ "$latest_main" != "$TARGET_SHA" ]]; then
              unset checkout_auth CHECKOUT_TOKEN
              echo "::notice::selected revision $TARGET_SHA is superseded by $latest_main; no product stage executed"
              exit 0
            fi
          fi

          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $checkout_auth" \
            git fetch --no-tags --depth=2 origin "$TARGET_SHA"
          unset checkout_auth CHECKOUT_TOKEN

          git worktree prune
          if [[ -e "$candidate_workspace/.git" ]]; then
            [[ "$(git -C "$candidate_workspace" rev-parse HEAD)" == "$TARGET_SHA" ]] || {
              echo "::error::candidate worktree path belongs to a different revision: $candidate_workspace" >&2
              exit 1
            }
          else
            [[ ! -e "$candidate_workspace" || -z "$(find "$candidate_workspace" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]] || {
              echo "::error::candidate worktree path is nonempty but is not a Git worktree: $candidate_workspace" >&2
              exit 1
            }
            rm -rf "$candidate_workspace"
            git worktree add --detach "$candidate_workspace" "$TARGET_SHA"
          fi
          flock -u 7

          export GITHUB_WORKSPACE="$candidate_workspace"
          cd "$candidate_workspace"
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git diff --quiet
          git diff --cached --quiet

          # Serialize only jobs touching the SAME candidate build tree. Different
          # revisions have independent source/build trees. Stateful operations also
          # reserve the installed host/database, while read-only qualification does not.
          exec 8>"$work_root/product-$TARGET_SHA.lock"
          flock 8
          case "$LAPLACE_STAGE" in
            release-qualification|mainline|build|test-dev|check)
              ;;
            *)
              exec 9>"$work_root/host-resource.lock"
              flock 9
              ;;
          esac

          {
            echo "## Product stage execution"
            echo
            echo "- Stage: $LAPLACE_STAGE"
            echo "- Revision: $TARGET_SHA"
            echo "- Candidate workspace: $candidate_workspace"
            if [[ "$LAPLACE_STAGE" == release-qualification || "$LAPLACE_STAGE" == mainline || "$LAPLACE_STAGE" == build || "$LAPLACE_STAGE" == test-dev || "$LAPLACE_STAGE" == check ]]; then
              echo "- Shared installed-host reservation: no"
            else
              echo "- Shared installed-host reservation: yes"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          source scripts/ci-environment.sh
          exec bash scripts/product-ci.sh "$LAPLACE_STAGE"
