ect x="46.354" y="330.81" width="286.139" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="56.354" y="353.267" fill="#000" font-size="12" textLength="266.139">Share one InitializeAsync task using lifetime token</text><rect x="46.363" y="400.903" width="286.121" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="56.363" y="423.36" fill="#000" font-size="12" textLength="266.121">Caller awaits shared task with its own cancellation</text><rect x="46.697" y="470.997" width="285.453" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="56.697" y="493.454" fill="#000" font-size="12" textLength="265.453">Publish created host only if lifetime remains active</text><rect x="16" y="526.091" width="346.848" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="548.548" fill="#000" font-size="12" textLength="326.848">If canceled before publication, initializer disposes its own host</text><polygon points="494.217,148.703,552.918,148.703,564.918,160.703,552.918,172.703,494.217,172.703,482.217,160.703,494.217,148.703" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="527.567" y="184.122" fill="#000" font-size="11" textLength="17.118">yes</text><text x="494.217" y="165.204" fill="#000" font-size="11" textLength="58.701">StopAsync?</text><text x="564.918" y="158.286" fill="#000" font-size="11" textLength="69.695">DisposeAsync</text><rect x="407.516" y="205.622" width="232.104" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="417.516" y="228.079" fill="#000" font-size="12" textLength="212.104">Cancel lifetime; detach initialization task</text><rect x="382.848" y="260.716" width="281.439" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="392.848" y="283.173" fill="#000" font-size="12" textLength="261.439">Await initialization with stop token; swallow errors</text><rect x="392.158" y="330.81" width="262.818" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="402.158" y="353.267" fill="#000" font-size="12" textLength="242.818">Atomically detach and dispose published host</text><rect x="727.298" y="291.845" width="270.787" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="737.298" y="314.302" fill="#000" font-size="12" textLength="250.787">Detach lifetime and initialization; cancel lifetime</text><rect x="684.287" y="361.938" width="356.809" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="694.287" y="384.396" fill="#000" font-size="12" textLength="336.809">Await initialization without separate wait timeout; swallow errors</text><rect x="725.944" y="432.032" width="273.494" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="735.944" y="454.489" fill="#000" font-size="12" textLength="253.494">Dispose published host and cancellation source</text><ellipse cx="528.548" cy="612.185" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="528.548" cy="612.185" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="528.548" y1="73.609" x2="528.548" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="524.548,83.609,528.548,93.609,532.548,83.609,528.548,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="189.424" y1="240.716" x2="189.424" y2="260.716" style="stroke:#181818;stroke-width:1;"/><polygon points="185.424,250.716,189.424,260.716,193.424,250.716,189.424,254.716" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line