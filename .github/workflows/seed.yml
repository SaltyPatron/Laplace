name: Internal — substrate ingest
run-name: "Ingest — ${{ inputs.mode }} ${{ inputs.source }} → ${{ inputs.database }}"

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: false
        default: source
      source:
        type: string
        required: false
        default: ""
      path:
        type: string
        required: false
        default: ""
      langs:
        type: string
        required: false
        default: ""
      database:
        type: string
        required: false
        default: laplace
      force:
        type: boolean
        required: false
        default: false
      evict_before_ingest:
        type: boolean
        required: false
        default: false
      confirm_evict:
        description: "second explicit confirmation for destructive source replacement"
        type: boolean
        required: false
        default: false
      chess_derived:
        type: boolean
        required: false
        default: false
      model_preset:
        description: "named model selection resolved on the runner"
        type: string
        required: false
        default: auto
      synthesize_model:
        type: boolean
        required: false
        default: true
      run_gate:
        type: boolean
        required: false
        default: true
      run_idempotency:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  seed:
    name: "${{ inputs.mode }} ${{ inputs.source }} → ${{ inputs.database }}"
    runs-on: [self-hosted, laplace]
    timeout-minutes: 720
    env:
      TARGET_SHA: ${{ github.sha }}
      LAPLACE_DATA_ROOT: /vault/Data
      LAPLACE_DB: "Host=/var/run/postgresql;Username=laplace_admin;Database=${{ inputs.database }}"
      LAPLACE_DBNAME: ${{ inputs.database }}
      PGDATABASE: ${{ inputs.database }}
      LAPLACE_INGEST_CONSOLE: ci
      INGEST_LOGDIR: /build/laplace/work/ingest-logs
      MODE: ${{ inputs.mode }}
      SOURCE_KEY: ${{ inputs.source }}
      PATH_INPUT: ${{ inputs.path }}
      LANGS_INPUT: ${{ inputs.langs }}
      MODEL_PRESET: ${{ inputs.model_preset }}
      GGUF_OUT: /build/laplace/work/model-outputs/laplace-model-substrate.gguf
    steps:
      - name: Run substrate operation
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          EVICT_BEFORE_INGEST: ${{ inputs.evict_before_ingest && '1' || '0' }}
          CONFIRM_EVICT: ${{ inputs.confirm_evict && '1' || '0' }}
          CHESS_DERIVED: ${{ inputs.chess_derived && '1' || '0' }}
          FORCE_INPUT: ${{ inputs.force && '1' || '0' }}
          SYNTHESIZE_MODEL: ${{ inputs.synthesize_model && '1' || '0' }}
          RUN_GATE: ${{ inputs.run_gate && '1' || '0' }}
          RUN_IDEMPOTENCY: ${{ inputs.run_idempotency && '1' || '0' }}
        run: |
          set -euo pipefail
          umask 0002
          workspace_lock_root="${LAPLACE_WORK_ROOT:-/build/laplace/work}"
          mkdir -p "$workspace_lock_root"
          exec 9>"$workspace_lock_root/host-resource.lock"
          flock 9
          cd "$GITHUB_WORKSPACE"

          if [[ ! -e .git ]]; then
            [[ -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]] || {
              echo "::error::nonempty workspace has no repository; preserving its files" >&2
              exit 1
            }
            git init --initial-branch=main
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          git diff --quiet
          git diff --cached --quiet
          checkout_auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $checkout_auth" \
            git fetch --no-tags --depth=2 origin "$TARGET_SHA"
          unset checkout_auth CHECKOUT_TOKEN
          git checkout --no-overwrite-ignore --detach "$TARGET_SHA"
          current_sha="$(git rev-parse HEAD)"
          [[ "$current_sha" == "$TARGET_SHA" ]] || {
            echo "::error::seed checkout mismatch (expected $TARGET_SHA, found $current_sha)" >&2
            exit 1
          }
          git diff --quiet
          git diff --cached --quiet

          # Seed is an operator data command, not a release qualification lane.
          # Consume the already-built CLI directly; workflow/docs-only commits must
          # never invalidate a usable runtime or force another full product build.
          export LAPLACE_SETUP_USE_CMAKE=false
          export LAPLACE_SETUP_REQUIRE_BUILT_REVISION=false
          export LAPLACE_CLI_BIN=/opt/laplace/bin/laplace
          source scripts/ci-environment.sh

          # Local CLI runs are outside Actions scheduling. Share the same whole-run
          # heartbeat/beacon interpretation as deployment and Operator recovery.
          bash scripts/wait-for-quiet-substrate.sh "$PGDATABASE"

          # Operator execution must not depend on presentation/help rendering.
          # The actual ingest path performs its runtime-closure checks before writing.

          mkdir -p "$INGEST_LOGDIR"
          if [[ -n "$LANGS_INPUT" ]]; then
            export LAPLACE_INGEST_LANGS="$LANGS_INPUT"
          else
            unset LAPLACE_INGEST_LANGS || true
          fi

          newest_weighted_snapshot() {
            local family="$1" candidate
            for candidate in "/vault/models/$family"/snapshots/*; do
              [[ -d "$candidate" ]] || continue
              if find "$candidate" -maxdepth 1 -type f \
                   \( -name '*.safetensors' -o -name 'pytorch_model*.bin' \) \
                   -print -quit | grep -q .; then
                printf '%s\n' "$candidate"
              fi
            done | sort | tail -1
          }

          resolve_model_dir() {
            if [[ -n "$PATH_INPUT" ]]; then
              printf '%s\n' "$PATH_INPUT"
              return 0
            fi
            case "$MODEL_PRESET" in
              auto|proof-default)
                local qwen tiny
                qwen="${LAPLACE_MODEL_PROOF_DIR:-${LAPLACE_QWEN25_CODER_DIR:-}}"
                [[ -n "$qwen" ]] || qwen="$(newest_weighted_snapshot 'models--Qwen--Qwen2.5-Coder-3B-Instruct' || true)"
                if [[ -n "$qwen" ]]; then printf '%s\n' "$qwen"; return 0; fi
                tiny="${LAPLACE_TINYLLAMA_DIR:-}"
                [[ -n "$tiny" ]] || tiny="$(newest_weighted_snapshot 'models--TinyLlama--TinyLlama-1.1B-Chat-v1.0' || true)"
                printf '%s\n' "$tiny"
                ;;
              qwen25-coder)
                local qwen="${LAPLACE_QWEN25_CODER_DIR:-}"
                [[ -n "$qwen" ]] || qwen="$(newest_weighted_snapshot 'models--Qwen--Qwen2.5-Coder-3B-Instruct' || true)"
                printf '%s\n' "$qwen"
                ;;
              tinyllama)
                local tiny="${LAPLACE_TINYLLAMA_DIR:-}"
                [[ -n "$tiny" ]] || tiny="$(newest_weighted_snapshot 'models--TinyLlama--TinyLlama-1.1B-Chat-v1.0' || true)"
                printf '%s\n' "$tiny"
                ;;
              phi2)
                local phi="${LAPLACE_PHI2_DIR:-}"
                [[ -n "$phi" ]] || phi="$(newest_weighted_snapshot 'models--microsoft--phi-2' || true)"
                printf '%s\n' "$phi"
                ;;
              custom-path)
                echo "::error::model preset custom-path requires an advanced path override" >&2
                return 2
                ;;
              *)
                echo "::error::unknown model preset: $MODEL_PRESET" >&2
                return 2
                ;;
            esac
          }

          model_dir=""
          if [[ "$MODE" == model ]]; then
            model_dir="$(resolve_model_dir)"
            [[ -n "$model_dir" && -d "$model_dir" ]] || {
              echo "::error::model preset $MODEL_PRESET did not resolve to an installed snapshot" >&2
              exit 1
            }
          fi

          {
            echo "## Ingest plan"
            echo
            echo "- Revision: $current_sha"
            echo "- Mode: $MODE"
            echo "- Database: $PGDATABASE"
            if [[ "$MODE" == source ]]; then
              echo "- Source: $SOURCE_KEY"
              if [[ -n "$PATH_INPUT" ]]; then
                echo "- Input: $PATH_INPUT"
              else
                echo "- Input: source default"
              fi
              echo "- Languages: ${LANGS_INPUT:-all}"
              echo "- Replace existing source first: $EVICT_BEFORE_INGEST"
              echo "- Verify source gate: $RUN_GATE"
              echo "- Verify idempotency: $RUN_IDEMPOTENCY"
              [[ "$SOURCE_KEY" != chess ]] || echo "- Derive move outcomes/transitions: $CHESS_DERIVED"
            elif [[ "$MODE" == foundation-ladder ]]; then
              echo "- Campaign: ordered foundation ladder"
              echo "- Force every rung: $FORCE_INPUT"
            elif [[ "$MODE" == model ]]; then
              echo "- Model preset: $MODEL_PRESET"
              echo "- Resolved snapshot: $model_dir"
              echo "- Synthesize GGUF: $SYNTHESIZE_MODEL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$MODE" == source && "$EVICT_BEFORE_INGEST" == 1 ]]; then
            [[ "$CONFIRM_EVICT" == 1 ]] || {
              echo "::error::source replacement requires both replacement confirmations" >&2
              exit 2
            }
            [[ -z "$PATH_INPUT" && -z "$LANGS_INPUT" ]] || {
              echo "::error::source eviction requires a complete source ingest" >&2
              exit 1
            }
            src_name=$(python3 -c 'import json,os; x=json.load(open("scripts/decomposer-gates.json"))["sources"].get(os.environ["SOURCE_KEY"]); print(x["decomposer"] if x else "")')
            [[ -n "$src_name" ]] || { echo "::error::no source mapping for $SOURCE_KEY" >&2; exit 1; }
            scripts/measure-lane.sh -- "$GITHUB_WORKSPACE/scripts/laplace" evict "$src_name"
            export LAPLACE_INGEST_FORCE=1
          fi

          ingest_one() {
            local key="$1"
            local path="${2:-}"
            if [[ -n "$path" ]]; then
              scripts/ingest-source.sh "$key" "$path"
            else
              scripts/ingest-source.sh "$key"
            fi
          }

          verify_source() {
            local key="$1"
            scripts/verify-ingest-journal.sh --cli-key "$key"
            if [[ "$RUN_GATE" == 1 ]]; then
              if python3 -c 'import json,sys; sources=json.load(open("scripts/decomposer-gates.json"))["sources"]; sys.exit(0 if sys.argv[1] in sources else 1)' "$key"; then
                python3 scripts/decomposer-gate-check.py \
                  --source "$key" --dbname "$PGDATABASE" \
                  --host /var/run/postgresql --user laplace_admin
              else
                echo "::notice::$key has no decomposer consensus gate; journal proof is authoritative"
              fi
            fi
          }

          verify_idempotency() {
            local key="$1"
            local path="${2:-}"
            local src_name
            src_name=$(python3 -c 'import json,sys; entry=json.load(open("scripts/decomposer-gates.json"))["sources"].get(sys.argv[1]); print(entry["decomposer"] if entry else "")' "$key")
            local before after
            if [[ -n "$src_name" ]]; then
              before=$(psql -h /var/run/postgresql -U laplace_admin -d "$PGDATABASE" -v ON_ERROR_STOP=1 -tAc \
                "SELECT ops.evidence_count(p_source => laplace.source_id('$src_name'));" | xargs)
            else
              before=$(psql -h /var/run/postgresql -U laplace_admin -d "$PGDATABASE" -v ON_ERROR_STOP=1 -tAc \
                "SELECT count(*) FROM laplace.attestations;" | xargs)
            fi
            ingest_one "$key" "$path"
            if [[ -n "$src_name" ]]; then
              after=$(psql -h /var/run/postgresql -U laplace_admin -d "$PGDATABASE" -v ON_ERROR_STOP=1 -tAc \
                "SELECT ops.evidence_count(p_source => laplace.source_id('$src_name'));" | xargs)
            else
              after=$(psql -h /var/run/postgresql -U laplace_admin -d "$PGDATABASE" -v ON_ERROR_STOP=1 -tAc \
                "SELECT count(*) FROM laplace.attestations;" | xargs)
            fi
            [[ "$before" == "$after" ]] || {
              echo "::error::idempotency broken for $key: evidence $before -> $after" >&2
              exit 1
            }
            echo "IDEMPOTENCY_OK source=$key evidence=$after"
          }

          case "$MODE" in
            source)
              [[ -n "$SOURCE_KEY" ]] || { echo "::error::mode=source requires source"; exit 2; }
              ingest_one "$SOURCE_KEY" "$PATH_INPUT"
              proof_sources=("$SOURCE_KEY")
              if [[ "$SOURCE_KEY" == chess && "$CHESS_DERIVED" == 1 ]]; then
                ingest_one chess-move-outcomes
                ingest_one chess-transitions
                proof_sources+=(chess-move-outcomes chess-transitions)
              fi
              for proof_source in "${proof_sources[@]}"; do
                verify_source "$proof_source"
              done
              if [[ "$RUN_IDEMPOTENCY" == 1 ]]; then
                verify_idempotency "$SOURCE_KEY" "$PATH_INPUT"
              fi
              ;;
            foundation-ladder)
              args=()
              [[ "$FORCE_INPUT" != 1 ]] || args+=(--force)
              exec bash scripts/ensure-foundation.sh "${args[@]}"
              ;;
            model)
              if [[ "$SYNTHESIZE_MODEL" == 1 ]]; then
                mkdir -p "$(dirname "$GGUF_OUT")"
                LAPLACE_GGUF_OUT="$GGUF_OUT" scripts/model-synthesize-ci.sh "$model_dir"
              else
                ingest_one model "$model_dir"
                verify_source model
              fi
              ;;
            *)
              echo "::error::unknown seed mode: $MODE"
              exit 2
              ;;
          esac
