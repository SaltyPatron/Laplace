name: Exact source transfer
on:
  push:
    branches: [fix/native-highway-pending-completion-20260915]
    paths: [.github/workflows/source-transfer.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Package tracked source only
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/laplace-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-source
          path: ${{ runner.temp }}/laplace-source.tar.gz
          retention-days: 1
