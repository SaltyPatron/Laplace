<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:516px;height:750px;background:#FAFCFF;" width="516px" height="750px" viewBox="0 0 516 750" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="516" height="750" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="6"><text x="20" y="34.533" fill="#000" font-size="14" textLength="474.209" font-weight="700">Monorepo chess — legal continuation and player evidence comparison</text></g><ellipse cx="256.104" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="83.346" y="93.609" width="345.518" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="93.346" y="116.066" fill="#000" font-size="12" textLength="325.518">Initialize read engine; parse FEN and enumerate legal moves</text><rect x="66.673" y="148.703" width="378.863" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="76.673" y="171.16" fill="#000" font-size="12" textLength="358.863">Under compose lock compute canonical position and legal child IDs</text><rect x="64.678" y="203.797" width="382.854" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="74.678" y="226.254" fill="#000" font-size="12" textLength="362.854">Read MOVE standings with candidate limit at least legal move count</text><rect x="97.033" y="258.891" width="318.143" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="107.033" y="281.348" fill="#000" font-size="12" textLength="298.143">If player supplied, separately read player move statistics</text><rect x="112.036" y="313.984" width="288.137" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="122.036" y="336.441" fill="#000" font-size="12" textLength="268.137">Keep only rows whose child matches a legal move</text><rect x="100.698" y="369.078" width="310.813" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="110.698" y="391.535" fill="#000" font-size="12" textLength="290.813">Attach standing/RD/witnesses and player games/score</text><rect x="87.345" y="424.172" width="337.52" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="97.345" y="446.629" fill="#000" font-size="12" textLength="317.52">Add player-only legal continuations with zero standing fields</text><rect x="95.363" y="479.266" width="321.482" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="105.363" y="501.723" fill="#000" font-size="12" textLength="301.482">Rank by witness count without player, else player games</text><rect x="107.363" y="534.359" width="297.482" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="117.363" y="556.816" fill="#000" font-size="12" textLength="277.482">Then rank by effective standing; take requested limit</text><rect x="117.046" y="589.453" width="278.117" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="127.046" y="611.91" fill="#000" font-size="12" textLength="258.117">Return original FEN, player label and move rows</text><ellipse cx="256.104" cy="655.547" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="256.104" cy="655.547" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="256.104" y1="73.609" x2="256.104" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="252.104,83.609,256.104,93.609,260.104,83.609,256.104,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="256.104" y1="128.703" x2="256.104" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="252.104,138.703,256.104,148.703,260.104,138.703,256.104,142.703" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="256.104" y1="183.797" x2="256.104" y2="203.797" style="stroke:#181818;stroke-width:1;"/><polygon points="252.104,193.797,256.104,203.797,260.104,193.797,256.104,197.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="256.104" y1="238.891" x2="256.104" y2="258.891" style="stroke:#181818;stroke-width:1;"/><polygon points="252.104,248.891,256.104,258.891,260.104,248.891,256.104,252.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="256.104" y1="293.984" x2="256.104" y2="313.984" style="stroke:#181818;stroke-width:1;"/><polygon points="252.104,303.984,256.104,313.984,260.104,303.984,256.104,307.984" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="256.104" y1="349.078" x2="256.104" y2="369.078" style="stroke:#181818;stroke-width:1;"/><polygon points="252.104,359.078,256.104,369.078,260.104,359.078,256.104,363.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="256.104" y1="404.172" x2="256.104" y2="424.172" style="stroke:#181818;stroke-width:1;"/><polygon points="252.104,414.172,256.104,424.172,260.104,414.172,256.104,418.172" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="256.104" y1="459.266" x2="256.104" y2="479.266" style="stroke:#181818;stroke-width:1;"/><polygon points="252.104,469.266,256.104,479.266,260.104,469.266,256.104,473.266" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="256.104" y1="514.359" x2="256.104" y2="534.359" style="stroke:#181818;stroke-width:1;"/><polygon points="252.104,524.359,256.104,534.359,260.104,524.359,256.104,528.359" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="256.104" y1="569.453" x2="256.104" y2="589.453" style="stroke:#181818;stroke-width:1;"/><polygon points="252.104,579.453,256.104,589.453,260.104,579.453,256.104,583.453" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="256.104" y1="624.547" x2="256.104" y2="644.547" style="stroke:#181818;stroke-width:1;"/><polygon points="252.104,634.547,256.104,644.547,260.104,634.547,256.104,638.547" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="19"><text x="64.229" y="685.928" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="56.726" y="698.506" fill="#888" font-size="10" textLength="400.757">claimed. Complete ExploreAsync reviewed. Consensus and player-stat reads are separate</text><text x="58.94" y="711.084" fill="#888" font-size="10" textLength="396.328">tasks without a shared transaction here. Legal move generation constrains returned rows.</text><text x="55.61" y="723.662" fill="#888" font-size="10" textLength="402.988">Player-only rows carry zero aggregate-standing fields, not fabricated consensus. Canonical</text><text x="114.802" y="736.24" fill="#888" font-size="10" textLength="284.604">player alias resolution and concrete SQL helpers remain nested.</text></g><?plantuml-src XLJDak8s4BxxARegXxtCcC4O6uOJDGkLgSpC_f3atfRQe498ZYJFX3tjG-mJxfDiInYM98VSGEhkxw_bTx1wLPACe7jumawZe15stMZudQ-CxAmomUSVEZBBnmTxw32CpiVFNAlCrkSFE_8-5nuslowBQGLoLX6Xd5IYdK-R-LqnBTgAYcA6yzbatCxB2PNJyGohoLrDPLNMLOjoFgkQjfXILPVPk_yXbW176tAlYc_IlvNPAaF3qHMNTboD2o7gkctgYIpBeg5fFH4pMSucugwkPTbMs8nnBETJ6cCrRkRLj1R5dIXdr