          old_complete = '''    public async Task CompleteBulkRunAsync(
        Action<BulkRunCompletionPhase>? onPhase,
        CancellationToken ct = default)
    {
        // Folds drain before the inner writer releases its run-scoped state.
        Exception? foldFailure = null;
        var phaseSw = System.Diagnostics.Stopwatch.StartNew();
        onPhase?.Invoke(BulkRunCompletionPhase.ConsensusDrain);
        try
        {
            await DrainFoldsAsync();
        }
        catch (Exception ex)
        {
            foldFailure = ex;
        }
        LastFoldDrainWallClock = phaseSw.Elapsed;
        LastFoldSpanWallClock = _foldSpanStarted == 0
            ? TimeSpan.Zero
            : System.Diagnostics.Stopwatch.GetElapsedTime(_foldSpanStarted);
        bool wasBulk = _bulkRun;
        _bulkRun = false;
        Exception? completionFailure = null;
        phaseSw.Restart();
        onPhase?.Invoke(BulkRunCompletionPhase.WriterMaintenance);
        try
        {
            await _inner.CompleteBulkRunAsync(ct);
        }
        catch (Exception ex)
        {
            completionFailure = ex;
        }
        LastWriterMaintenanceWallClock = phaseSw.Elapsed;

        // NO terminal mask pass (2026-07-21). Masks are deposited inline by every
        // fold, in every lane — see UpsertDeltaAsync. There is nothing left to
        // defer: by the time the last fold drains above, every pair this run
        // touched has already had its bits OR'd in, spread across the run instead
        // of landing as one serial recompute after the loader finishes.
        //
        // highway_mask_dirty / highway_mask_drain() survive as the REPAIR verbs
        // (per-source evict has to CLEAR bits, which an OR-accumulate deposit
        // cannot do), alongside highway_mask_rebuild for highway bit renumbering.
        // Nothing on the ingest hot path populates or drains the queue.
        _ = wasBulk;

        if (foldFailure is not null && completionFailure is not null)
            throw new AggregateException(foldFailure, completionFailure);
        if (completionFailure is not null)
            ExceptionDispatchInfo.Capture(completionFailure).Throw();
        if (foldFailure is not null)
            ExceptionDispatchInfo.Capture(foldFailure).Throw();
    }
'''
          new_complete = '''    public async Task CompleteBulkRunAsync(
        Action<BulkRunCompletionPhase>? onPhase,
        CancellationToken ct = default)
    {
        // Folds drain before recovery: a false token may represent a partially
        // committed type/mask lane, and reconstruction must not race the tail of
        // that same continuation.
        Exception? foldFailure = null;
        Exception? recoveryFailure = null;
        var phaseSw = System.Diagnostics.Stopwatch.StartNew();
        onPhase?.Invoke(BulkRunCompletionPhase.ConsensusDrain);
        try
        {
            await DrainFoldsAsync().ConfigureAwait(false);
        }
        catch (Exception ex)
        {
            foldFailure = ex;
        }
        LastFoldDrainWallClock = phaseSw.Elapsed;
        LastFoldSpanWallClock = _foldSpanStarted == 0
            ? TimeSpan.Zero
            : System.Diagnostics.Stopwatch.GetElapsedTime(_foldSpanStarted);
        _bulkRun = false;

        // Release this run's shared guard only AFTER every live fold task is
        // terminal. Recovery then takes the same guard exclusively and rebuilds
        // any token whose acknowledgement did not make it to durable state.
        var guard = _foldRecoveryGuard;
        _foldRecoveryGuard = null;
        if (guard is not null)
            await guard.DisposeAsync().ConfigureAwait(false);

        Hash128[] sources;
        lock (_foldSourceLock) sources = _foldSources.ToArray();
        try
        {
            foreach (var source in sources)
            {
                await NpgsqlFoldJournal.RecoverSourceAsync(
                    _ds, source, _log, CancellationToken.None).ConfigureAwait(false);
                long remaining = await NpgsqlFoldJournal.CountUnfoldedSourceAsync(
                    _ds, source, CancellationToken.None).ConfigureAwait(false);
                if (remaining != 0)
                    throw new InvalidOperationException(
                        $"source {source} still has {remaining} unfinished fold token(s); "
                        + "at least one token is not evidence-recoverable");
            }

            if (foldFailure is not null)
            {
                _log.LogWarning(
                    foldFailure,
                    "queued fold failed after evidence commit; durable evidence was refolded and journal acknowledgement repaired");
                ResetRecoveredFoldFailures();
                foldFailure = null;
            }
        }
        catch (Exception ex)
        {
            recoveryFailure = ex;
        }

        Exception? completionFailure = null;
        phaseSw.Restart();
        onPhase?.Invoke(BulkRunCompletionPhase.WriterMaintenance);
        try
        {
            await _inner.CompleteBulkRunAsync(ct).ConfigureAwait(false);
        }
        catch (Exception ex)
        {
            completionFailure = ex;
        }
        LastWriterMaintenanceWallClock = phaseSw.Elapsed;

        var failures = new List<Exception>(3);
        if (foldFailure is not null) failures.Add(foldFailure);
        if (recoveryFailure is not null) failures.Add(recoveryFailure);
        if (completionFailure is not null) failures.Add(completionFailure);
        if (failures.Count == 1)
            ExceptionDispatchInfo.Capture(failures[0]).Throw();
        if (failures.Count > 1)
            throw new AggregateException(failures);
    }

    private void ResetRecoveredFoldFailures()
    {
        // DrainFolds has already driven every task terminal. Once evidence-derived
        // recovery reconstructs both consensus and masks, retaining those completed
        // fault objects would falsely poison the next run on this writer instance.
        lock (_foldChainLock)
            _outstanding.RemoveAll(static task => task.IsCompleted);
        lock (_laneLock)
        {
            foreach (var key in _typeLanes.Where(static kv => kv.Value.IsCompleted)
                                          .Select(static kv => kv.Key).ToArray())
                _typeLanes.Remove(key);
            for (int i = 0; i < _maskLanes.Length; i++)
                if (_maskLanes[i].IsCompleted)
                    _maskLanes[i] = Task.CompletedTask;
        }
    }
