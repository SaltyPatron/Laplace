<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:764px;height:1125px;background:#FAFCFF;" width="764px" height="1125px" viewBox="0 0 764 1125" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="764" height="1125" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="7"><text x="181.344" y="34.533" fill="#000" font-size="14" textLength="400.306" font-weight="700">Monorepo — attributable witness read and occurrence roles</text></g><ellipse cx="370.658" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="196.232" y="93.609" width="348.852" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="206.232" y="116.066" fill="#000" font-size="12" textLength="328.852">Validate one-dimensional bytea identity filters and 16-byte IDs</text><rect x="249.924" y="148.703" width="241.467" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="259.924" y="171.16" fill="#000" font-size="12" textLength="221.467">Require operands and callback; roles 0..3</text><rect x="319.973" y="252.715" width="101.369" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="329.973" y="275.172" fill="#000" font-size="12" textLength="81.369">Return no rows</text><ellipse cx="370.658" cy="326.762" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="370.658" cy="326.762" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="282.918,203.797,458.397,203.797,470.397,215.797,458.397,227.797,282.918,227.797,270.918,215.797,282.918,203.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="374.658" y="239.216" fill="#000" font-size="11" textLength="17.118">yes</text><text x="282.918" y="220.298" fill="#000" font-size="11" textLength="175.479">No roles or any supplied set empty?</text><rect x="214.258" y="379.762" width="312.799" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="224.258" y="402.219" fill="#000" font-size="12" textLength="292.799">Connect nested SPI; create temporary memory context</text><rect x="152.205" y="434.855" width="436.906" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="162.205" y="457.313" fill="#000" font-size="12" textLength="416.906">Deduplicate operand probes while retaining linked lists of every original ordinal</text><polygon points="319.297,489.949,422.019,489.949,434.019,501.949,422.019,513.949,319.297,513.949,307.297,501.949,319.297,489.949" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="319.297" y="506.45" fill="#000" font-size="11" textLength="102.722">Exact cells supplied?</text><text x="290.179" y="499.532" fill="#000" font-size="11" textLength="17.118">yes</text><text x="434.019" y="499.532" fill="#000" font-size="11" textLength="72.778">endpoint query</text><rect x="72.687" y="523.949" width="221.445" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="82.687" y="546.406" fill="#000" font-size="12" textLength="201.445">Deduplicate subject/type/object triples</text><rect x="16" y="579.043" width="334.818" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="601.5" fill="#000" font-size="12" textLength="314.818">Query only exact attestation cells, with optional source filter</text><rect x="370.818" y="523.949" width="374.176" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="380.818" y="546.406" fill="#000" font-size="12" textLength="354.176">Query selected subject/object roles with optional source/type filters</text><polygon points="370.658,620.137,382.658,632.137,370.658,644.137,358.658,632.137,370.658,620.137" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="155.553" y="664.137" width="430.209" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="165.553" y="686.594" fill="#000" font-size="12" textLength="410.209">Stream each row through typed DestReceiver; require identity/outcome/count</text><rect x="183.895" y="719.23" width="373.525" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="193.895" y="741.688" fill="#000" font-size="12" textLength="353.525">Preserve nullable object/source/context and 32-byte qualifier mask</text><rect x="167.908" y="774.324" width="405.5" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="177.908" y="796.781" fill="#000" font-size="12" textLength="385.5">For matching subject call visitor for every operand occurrence with role 1</text><rect x="170.908" y="829.418" width="399.5" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="180.908" y="851.875" fill="#000" font-size="12" textLength="379.5">For matching object call visitor for every operand occurrence with role 2</text><rect x="222.573" y="884.512" width="296.17" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="232.573" y="906.969" fill="#000" font-size="12" textLength="276.17">Reject a fetched row outside supplied operand roles</text><rect x="243.936" y="939.605" width="253.443" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="253.936" y="962.063" fill="#000" font-size="12" textLength="233.443">Release temporary 