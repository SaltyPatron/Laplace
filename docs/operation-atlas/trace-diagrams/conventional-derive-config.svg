<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:480px;height:682px;background:#FAFCFF;" width="480px" height="682px" viewBox="0 0 480 682" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="480" height="682" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="6"><text x="20" y="34.533" fill="#000" font-size="14" textLength="438.43" font-weight="700">Conventional — derive model shape from measured token corpus</text></g><ellipse cx="238.215" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="70.12" y="93.609" width="336.189" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="80.12" y="116.066" fill="#000" font-size="12" textLength="316.189">Load dataset report; require positive tokens_per_parameter</text><rect x="41.963" y="148.703" width="392.504" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="51.963" y="171.16" fill="#000" font-size="12" textLength="372.504">Set target parameters=max(vocabulary times 256, train_tokens / ratio)</text><rect x="45.771" y="203.797" width="384.887" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="55.771" y="226.254" fill="#000" font-size="12" textLength="364.887">Enumerate hidden sizes in increments of 128 and even layers 4..128</text><rect x="53.134" y="258.891" width="370.162" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="63.134" y="281.348" fill="#000" font-size="12" textLength="350.162">Estimate parameters; choose minimum absolute log ratio to target</text><rect x="36.774" y="313.984" width="402.881" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="46.774" y="336.441" fill="#000" font-size="12" textLength="382.881">Round selected record-length quantile up to power of two, minimum 256</text><rect x="101.471" y="369.078" width="273.488" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="111.471" y="391.535" fill="#000" font-size="12" textLength="253.488">Apply training defaults and configured overrides</text><rect x="67.788" y="424.172" width="340.854" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="77.788" y="446.629" fill="#000" font-size="12" textLength="320.854">Reassert derived context; global token batch at least context</text><rect x="70.483" y="479.266" width="335.463" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="80.483" y="501.723" fill="#000" font-size="12" textLength="315.463">Derive checkpoint token interval from fraction and minimum</text><rect x="65.137" y="534.359" width="346.156" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="75.137" y="556.816" fill="#000" font-size="12" textLength="326.156">Write config with derivation, model and training sections; print</text><ellipse cx="238.215" cy="600.453" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="238.215" cy="600.453" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="238.215" y1="73.609" x2="238.215" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="234.215,83.609,238.215,93.609,242.215,83.609,238.215,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="238.215" y1="128.703" x2="238.215" y2="148.703" style="stroke:#181818;stroke-width:1;"/><polygon points="234.215,138.703,238.215,148.703,242.215,138.703,238.215,142.703" fill="#181818" style="stroke:#18181