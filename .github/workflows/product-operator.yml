name: Product — maintenance
run-name: "Product maintenance — ${{ inputs.operation }} @ ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Explicit installed-product operation; normal main delivery is automatic"
        type: choice
        required: true
        default: verify
        options: [verify, reconcile, chess-lab, deploy]
      full_clean:
        description: "Deploy only: discard candidate build outputs before rebuilding"
        type: boolean
        default: false
      force_codegen:
        description: "Deploy only: regenerate attestation-law source before building"
        type: boolean
        default: false
      serial_tests:
        description: "Deploy only: force serial native tests"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  operator:
    name: Run explicit product maintenance operation
    uses: ./.github/workflows/product-stage.yml
    with:
      stage: ${{ inputs.operation }}
      target_sha: ${{ github.sha }}
      full_clean: ${{ inputs.full_clean }}
      force_codegen: ${{ inputs.force_codegen }}
      serial_tests: ${{ inputs.serial_tests }}
    secrets: inherit
