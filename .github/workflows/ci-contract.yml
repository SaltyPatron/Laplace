name: Policy — CI contract

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[actions-history-cleanup]') || contains(github.event.head_commit.message, '[actions-evidence-archive]')) && format('laplace-actions-history-{0}', github.run_id) || format('laplace-ci-contract-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[actions-history-cleanup]') && !contains(github.event.head_commit.message, '[actions-evidence-archive]')) }}

jobs:

  owner-transport-python310:
    name: Owner policy transport on Python 3.10
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify PostgreSQL timestamps on the older installed Python runtime
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 10), sys.version'
          python3 tests/identity-owner-policy.py
          python3 scripts/test-platform-owner-enroll.py
          python3 scripts/test-platform-access-enroll.py

  platform-initial-assignment:
    name: PostgreSQL owner recovery and platform assignment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: fixture-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: fixture-only-password
      LAPLACE_TEST_APP_DB: Host=127.0.0.1;Port=5432;Username=postgres;Password=fixture-only-password;Database=platform_owner_fixture
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.402'
      - name: Provide pinned grammar queries for managed build
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tree-sitter/tree-sitter-c
          ref: b780e47fc780ddc8da13afa35a3f4ed5c157823d
          path: .ci-dependencies/tree-sitter-grammars/tree-sitter-c
          persist-credentials: false
      - name: Recreate application database with persistent owner authority
        run: |
          set -euo pipefail
          export LAPLACE_EXTERNAL="$GITHUB_WORKSPACE/.ci-dependencies"
          dotnet build app/Laplace.Migrations/Laplace.Migrations.csproj -c Release \
            -p:LAPLACE_BUILD_ROOT="$RUNNER_TEMP/platform-access-build" -p:OpenApiGenerateDocuments=false
          bash tests/platform-owner-recreation.sh "$RUNNER_TEMP/platform-access-build/app/bin/Laplace.Migrations/Release/net10.0/Laplace.Migrations.dll"
      - name: Verify owner reconciliation, atomic initial assignment and revocation protection
        run: |
          set -euo pipefail
          export LAPLACE_EXTERNAL="$GITHUB_WORKSPACE/.ci-dependencies"
          dotnet test app/Laplace.Endpoints.OpenAICompat.Tests/Laplace.Endpoints.OpenAICompat.Tests.csproj \
            -c Release -p:LAPLACE_BUILD_ROOT="$RUNNER_TEMP/platform-access-build" -p:OpenApiGenerateDocuments=false \
            --filter 'FullyQualifiedName~PlatformInitialRoleDatabaseTests|FullyQualifiedName~PlatformOwner' \
            --logger 'trx;LogFileName=platform-initial-assignment.trx' --results-directory "$RUNNER_TEMP/platform-access-results"
          python3 - "$RUNNER_TEMP/platform-access-results/platform-initial-assignment.trx" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          counters = root.find('.//{*}Counters')
          assert counters is not None and counters.get('total') == '28' and counters.get('passed') == '28', 'All 28 authority tests must run and pass without skips'
          PY
      - name: Verify document generation and persistent browser key lifecycles
        run: dotnet test app/Laplace.Endpoints.OpenAICompat.Tests/Laplace.Endpoints.OpenAICompat.Tests.csproj -c Release --no-build --no-restore -p:LAPLACE_BUILD_ROOT="${{ runner.temp }}/platform-access-build" -p:OpenApiGenerateDocuments=false --filter FullyQualifiedName~BrowserDataProtectionTests

  substrate-runtime-grants:
    name: PostgreSQL runtime grant recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: fixture-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify database health and real PostgreSQL band dependencies
        run: |
          python3 scripts/test-pg-access.py
          bash tests/relation-band-health.sh
      - run: bash tests/substrate-runtime-grants.sh
      - run: bash tests/substrate-analyze-substrate.sh

  identity-law:
    name: Identity law vectors (monorepo composition through Laplace-Native)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Laplace-Native, the one implementation of the identity law
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Native
          ref: 044bd4a361ce32d8a840a480a83bbfd3321ec34e
          path: .ci-dependencies/laplace-native
          persist-credentials: false
      - name: BLAKE3 1.8.3, as on the build host
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: BLAKE3-team/BLAKE3
          ref: 8b829b697fa4cfe35de35e9aa8c20b56266cb091
          path: .ci-dependencies/blake3
          persist-credentials: false
      - name: IdentityLawVectorTests' vectors on hash128.c compiled with lp_id_compose
        run: bash tests/identity-law.sh .ci-dependencies/laplace-native .ci-dependencies/blake3/c

  windows-native-package:
    name: Windows native package integrity
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reject stale native SQL before packaging
        shell: pwsh
        run: ./tests/windows-native-package.ps1
      - name: Build packages without installed IIS authority
        shell: pwsh
        run: |
          ./tests/iis-package-build-access.ps1
          ./tests/windows-tree-lock.ps1
      - name: Exercise publication permissions on NTFS
        shell: pwsh
        run: ./scripts/test-iis-access.ps1 -Work $env:RUNNER_TEMP
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.402'
      - name: Provide pinned grammar queries for the managed maintenance build
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tree-sitter/tree-sitter-c
          ref: b780e47fc780ddc8da13afa35a3f4ed5c157823d
          path: .ci-dependencies/tree-sitter-grammars/tree-sitter-c
          persist-credentials: false
      - name: Verify database maintenance and IIS recovery boundaries
        shell: pwsh
        run: |
          $env:LAPLACE_EXTERNAL = Join-Path $env:GITHUB_WORKSPACE '.ci-dependencies'
          $build = Join-Path $env:RUNNER_TEMP 'database-maintenance-build'
          dotnet build app/Laplace.Migrations/Laplace.Migrations.csproj -c Release "-p:LAPLACE_BUILD_ROOT=$build"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtime = Join-Path $build 'app/bin/Laplace.Migrations/Release/net10.0'
          ./tests/migration-command-routing.ps1 -Runtime "$runtime/Laplace.Migrations.dll"
          ./tests/iis-database-maintenance.ps1 -NpgsqlAssembly "$runtime/Npgsql.dll"
          ./tests/iis-owner-lifecycle.ps1
          ./tests/iis-application-restart.ps1
          ./tests/iis-chess-cache-package.ps1

  api-client:
    name: Authenticated CLI transport (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      LAPLACE_EXTERNAL: ${{ github.workspace }}/.ci-dependencies
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.402'
      - name: Provide pinned grammar queries for managed build
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tree-sitter/tree-sitter-c
          ref: b780e47fc780ddc8da13afa35a3f4ed5c157823d
          path: .ci-dependencies/tree-sitter-grammars/tree-sitter-c
          persist-credentials: false
      - name: Build and test the CLI service transport
        run: dotnet test app/Laplace.Cli.Tests/Laplace.Cli.Tests.csproj --filter FullyQualifiedName~ApiClientCommandsTests --nologo -p:LAPLACE_BUILD_ROOT="${{ runner.temp }}/laplace-api-client"
      - name: Verify installed-client acceptance and credential cleanup
        run: python scripts/test-installed-api-client.py
      - name: Verify client archive integrity and setup handoff
        run: python scripts/test-api-client-package.py
      - name: Verify Linux client installation and launch
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s deploy/client -p 'test_*.py'
      - name: Verify Windows client launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-windows-client-connection.ps1 -Work $env:RUNNER_TEMP -NpgsqlAssembly "$env:RUNNER_TEMP/laplace-api-client/app/bin/Laplace.Cli.Tests/Debug/net10.0/Npgsql.dll"
          ./scripts/test-api-client-package.ps1 -Work $env:RUNNER_TEMP
      - name: Publish a self-contained authenticated client
        run: dotnet publish deploy/client/Laplace.ApiClient.csproj -c Release --self-contained true -r ${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }} -p:LAPLACE_BUILD_ROOT="${{ runner.temp }}/laplace-api-client" -o "${{ runner.temp }}/api-client-published" --nologo
      - name: Package and execute the downloadable client
        run: python scripts/package-api-client.py --published "${{ runner.temp }}/api-client-published" --output "${{ runner.temp }}/api-client-packages" --platform ${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }} --revision ${{ github.sha }}
      - name: Retain the verified client package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laplace-api-client-${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }}-${{ github.sha }}
          path: ${{ runner.temp }}/api-client-packages/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  contract:
    name: Static CI/CD contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LAPLACE_RECIPES: ${{ github.workspace }}/.ci-dependencies/laplace-engine/recipes
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Provide the canonical recipe estate for operator validation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: SaltyPatron/Laplace-Engine
          ref: 2bcfd0f0214230c7df9cd545e5a7e19f6ef9a611
          path: .ci-dependencies/laplace-engine
          persist-credentials: false

      - name: Validate workflow, lifecycle, and operator contracts
        shell: bash
        run: bash scripts/product-ci.sh check

      - name: Verify credential helper publication and rollback
        shell: bash
        run: bash scripts/test-credential-repair.sh

      - name: Validate evidence-safe Actions history cleanup policy
        shell: bash
        run: python3 .github/scripts/test-actions-history-cleanup.py

      - name: Reject Python warnings in Actions maintenance scripts
        shell: bash
        run: |
          python3 -W error::SyntaxWarning -m py_compile \
            .github/scripts/cleanup-actions-history.py \
            .github/scripts/archive-actions-evidence.py

      - name: Validate historical Actions evidence archive policy
        shell: bash
        run: python3 .github/scripts/test-actions-evidence-archive.py

  cleanup-history:
    name: Remove artifact-free stale workflow identities
    needs: contract
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[actions-history-cleanup]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out cleanup policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Delete complete stale workflow identities only when no artifact is retained
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/cleanup-actions-history.py \
            --delete \
            --max-deletes 3000 \
            --report "$RUNNER_TEMP/actions-history-cleanup.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload cleanup audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actions-history-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/actions-history-cleanup.json
          if-no-files-found: error
          retention-days: 90

  archive-history:
    name: Archive evidence-bearing stale workflow identities
    needs: contract
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[actions-evidence-archive]')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out archive policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Archive retained evidence before deleting stale workflow runs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          command -v curl >/dev/null
          python3 .github/scripts/archive-actions-evidence.py \
            --release-tag actions-evidence-archive-2026-09-18 \
            --report "$RUNNER_TEMP/actions-evidence-archive-report.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload archive transaction audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actions-evidence-archive-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/actions-evidence-archive-report.json
            ${{ runner.temp }}/actions-evidence-archive-index.json
          if-no-files-found: warn
          retention-days: 90
