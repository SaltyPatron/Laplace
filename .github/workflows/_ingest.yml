name: _ingest

on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      path:
        type: string
        default: ""
      langs:
        type: string
        default: ""
      database:
        type: string
        default: laplace
      timeout_minutes:
        type: number
        default: 720
      evict_before_ingest:
        type: boolean
        default: false
      evict_confirm:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ingest:
    name: "ingest ${{ inputs.source }} → ${{ inputs.database }}"
    runs-on: [self-hosted, laplace]
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    concurrency:
      group: laplace-ingest-${{ inputs.source }}-${{ inputs.database }}
      cancel-in-progress: false
    env:
      LAPLACE_DATA_ROOT: /vault/Data
      LAPLACE_DB: "Host=/var/run/postgresql;Username=laplace_admin;Database=${{ inputs.database }}"
      PGDATABASE: ${{ inputs.database }}
      LAPLACE_INGEST_CONSOLE: ci
      INGEST_LOGDIR: /build/laplace/work/ingest-logs
    steps:
      - name: Checkout exact revision
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --prune --depth=2 origin "$TARGET_SHA"
          git checkout --force "$TARGET_SHA"

      - uses: ./.github/actions/setup-laplace-env

      - name: Build exact ingest runtime
        run: |
          set -euo pipefail
          mkdir -p "$INGEST_LOGDIR"
          bash scripts/pipeline.sh build
          echo "LAPLACE_INGEST_RUNTIME_PREPARED=1" >> "$GITHUB_ENV"

      - name: Evict selected source
        if: inputs.evict_before_ingest
        env:
          SOURCE_KEY: ${{ inputs.source }}
          CONFIRM: ${{ inputs.evict_confirm }}
          PATH_INPUT: ${{ inputs.path }}
          LANGS_INPUT: ${{ inputs.langs }}
        run: |
          set -euo pipefail
          [[ -z "$PATH_INPUT" && -z "$LANGS_INPUT" ]] || {
            echo "::error::source eviction requires a complete source ingest"
            exit 1
          }
          src_name=$(python3 -c 'import json,os; x=json.load(open("scripts/decomposer-gates.json"))["sources"].get(os.environ["SOURCE_KEY"]); print(x["decomposer"] if x else "")')
          [[ -n "$src_name" ]] || { echo "::error::no source mapping for $SOURCE_KEY"; exit 1; }
          [[ "$CONFIRM" == "$src_name" ]] || {
            echo "::error::type '$src_name' in evict_confirm"
            exit 1
          }
          scripts/measure-lane.sh -- "$GITHUB_WORKSPACE/scripts/laplace" evict "$src_name"
          echo "LAPLACE_INGEST_FORCE=1" >> "$GITHUB_ENV"

      - name: Ingest
        env:
          SOURCE_KEY: ${{ inputs.source }}
          PATH_INPUT: ${{ inputs.path }}
          LANGS_INPUT: ${{ inputs.langs }}
        run: |
          set -euo pipefail
          if [[ -n "$LANGS_INPUT" ]]; then
            export LAPLACE_INGEST_LANGS="$LANGS_INPUT"
          else
            unset LAPLACE_INGEST_LANGS || true
          fi
          if [[ -n "$PATH_INPUT" ]]; then
            scripts/ingest-source.sh "$SOURCE_KEY" "$PATH_INPUT"
          else
            scripts/ingest-source.sh "$SOURCE_KEY"
          fi
