181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="221.09" y="336.441" fill="#000" font-size="12" textLength="448.236">Read type-8 trajectories containing observation forms and parse-schema constituent</text><rect x="252.437" y="369.078" width="385.543" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="262.437" y="391.535" fill="#000" font-size="12" textLength="365.543">Read vertex-flagged parse candidates in a second membership pass</text><rect x="300.469" y="424.172" width="289.479" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="310.469" y="446.629" fill="#000" font-size="12" textLength="269.479">For each candidate require expected physicality ID</text><rect x="320.813" y="479.266" width="248.791" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="330.813" y="501.723" fill="#000" font-size="12" textLength="228.791">Decode all trajectory constituents and flags</text><polygon points="363.884,534.359,526.532,534.359,538.532,546.359,526.532,558.359,363.884,558.359,351.884,546.359,363.884,534.359" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="363.884" y="550.86" fill="#000" font-size="11" textLength="162.647">Every constituent has parse flag?</text><text x="334.767" y="543.942" fill="#000" font-size="11" textLength="17.118">yes</text><text x="538.532" y="543.942" fill="#000" font-size="11" textLength="14.674">flat</text><rect x="16" y="568.359" width="429.535" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="590.816" fill="#000" font-size="12" textLength="409.535">Decode vertex parse; recompute canonical ID; require entity identity matches</text><rect x="465.535" y="568.359" width="388.227" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text 