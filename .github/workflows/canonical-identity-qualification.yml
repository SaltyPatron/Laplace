name: Reconcile current main into qualified identity candidate
on:
  push:
    branches: [review/canonical-identity-20260917]
    paths: [.github/workflows/canonical-identity-qualification.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: d8d3d60256e8ae244368e2ccbe6c90e7c424a4fa
      EXTERNAL: f36bdd63ab414cbf152eea774427fa7055ee9970
      COMMON: 96a02adb064ad221e17ae275e076b11816b6a517
      CANDIDATE_REF: review/canonical-identity-20260917
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile exact source histories in the ordinary hosted checkout
        shell: bash
        run: |
          set -euo pipefail
          umask 0002
          evidence_root="/build/laplace/work/identity-merge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo install -d -m 2775 -o "$(id -u)" -g "$(id -g)" /build/laplace/work
          test ! -e "$evidence_root"
          mkdir -m 0700 "$evidence_root"
          export EVIDENCE_ROOT="$evidence_root"
          printf 'EVIDENCE_ROOT=%s\n' "$evidence_root" >> "$GITHUB_ENV"
          cp .github/workflows/canonical-identity-qualification.yml "$evidence_root/workflow.yml"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          python3 - <<'PY'
          import subprocess
          actual=subprocess.check_output(["git","diff","--name-only",__import__("os").environ["BASE"],"HEAD"],text=True).splitlines()
          assert actual==[".github/workflows/canonical-identity-qualification.yml","docs/guides/chess-dependencies.md"],actual
          assert subprocess.check_output(["git","rev-parse","HEAD:docs/guides/chess-dependencies.md"],text=True).strip()=="09ae93934552e5730dd8582727a3d9afaba01e5e"
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
          git config user.name "Laplace qualification"
          git config user.email "qualification@users.noreply.github.com"
          git_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_auth"
          unset git_auth
          git fetch --no-tags origin "$EXTERNAL"
          git merge-base --is-ancestor "$COMMON" "$EXTERNAL"
          git merge-base --is-ancestor 1c5eb49378c5d6c698e735a0fe8e1e7260429f28 "$BASE"
          git merge-base --is-ancestor 1c5eb49378c5d6c698e735a0fe8e1e7260429f28 "$EXTERNAL"
          set +e
          git merge --no-commit --no-ff "$EXTERNAL" > "$evidence_root/merge.log" 2>&1
          merge_status=$?
          set -e
          cat "$evidence_root/merge.log"
          git ls-files -u > "$evidence_root/conflict-index.txt"
          git diff --binary > "$evidence_root/worktree.patch"
          git diff --cached --binary > "$evidence_root/index.patch"
          if [[ "$merge_status" -ne 0 ]]; then
            python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["EVIDENCE_ROOT"])
          records=[]
          for line in subprocess.check_output(["git","ls-files","-u"],text=True).splitlines():
              metadata,path=line.split("\t",1)
              mode,sha,stage=metadata.split()
              raw=subprocess.check_output(["git","cat-file","blob",sha])
              name="conflict-"+str(len(records))+"-stage"+stage+".txt"
              (root/name).write_bytes(raw)
              records.append({"path":path,"mode":mode,"blob":sha,"stage":int(stage),"file":name})
          (root/"conflicts.json").write_text(json.dumps(records,indent=2)+"\n")
          PY
            exit "$merge_status"
          fi
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(["git",*args],text=True).strip()
          expected=[".github/workflows/_ingest.yml",".github/workflows/db-ops.yml",".github/workflows/laplace.yml",".github/workflows/seed-chess-games.yml",".github/workflows/seed-chess.yml",".github/workflows/seed-models.yml",".github/workflows/seed.yml","app/Laplace.Decomposers.Tests/FrameNet/FrameNetAnnotationStructureTests.cs","app/Laplace.Decomposers/FrameNet/FrameNetDecomposer.cs","app/Laplace.Substrate.Tests/Abstractions/ExtensionManifestSeparationTests.cs","app/Laplace.Substrate/Crud/Npgsql/CopyTupleParser.cs","app/Laplace.Substrate/Crud/Npgsql/NpgsqlIngestOps.cs","app/Laplace.Substrate/Crud/Npgsql/NpgsqlWorkingSetApply.cs","extension/laplace_substrate/sql/bootstrap/bootstrap.sql.in","scripts/product-ci.sh","scripts/publish-applications.sh","scripts/test-ci-workspace.py","scripts/validate-pipeline.py","web/src/explore/entity/tabs/OverviewTab.tsx"]
          merged=git("diff","--cached","--name-only",os.environ["GITHUB_SHA"]).splitlines()
          assert merged==expected,(merged,expected)
          retained=[]
          for path in [".github/workflows/_ingest.yml",".github/workflows/db-ops.yml",".github/workflows/laplace.yml",".github/workflows/seed-chess-games.yml",".github/workflows/seed-chess.yml",".github/workflows/seed-models.yml",".github/workflows/seed.yml","app/Laplace.Decomposers.Tests/FrameNet/FrameNetAnnotationStructureTests.cs","app/Laplace.Decomposers/FrameNet/FrameNetDecomposer.cs","app/Laplace.Substrate.Tests/Abstractions/ExtensionManifestSeparationTests.cs","app/Laplace.Substrate/Crud/Npgsql/CopyTupleParser.cs","app/Laplace.Substrate/Crud/Npgsql/NpgsqlIngestOps.cs","extension/laplace_substrate/sql/bootstrap/bootstrap.sql.in","scripts/product-ci.sh","scripts/publish-applications.sh","scripts/test-ci-workspace.py","scripts/validate-pipeline.py","web/src/explore/entity/tabs/OverviewTab.tsx"]:
              external=subprocess.run(["git","rev-parse",os.environ["EXTERNAL"]+":"+path],capture_output=True,text=True)
              index=subprocess.run(["git","rev-parse",":"+path],capture_output=True,text=True)
              assert (external.returncode==0)==(index.returncode==0),path
              if external.returncode==0:
                  assert external.stdout.strip()==index.stdout.strip(),path
                  retained.append({"path":path,"blob":index.stdout.strip()})
              else:retained.append({"path":path,"removed":True})
          path="app/Laplace.Substrate/Crud/Npgsql/NpgsqlWorkingSetApply.cs"
          body=Path(path).read_text()
          stale="Interpretations were published\n            // separately above."
          assert body.count(stale)==1
          body=body.replace(stale,"Interpretations publish\n            // after COPY within the accepting transaction.")
          Path(path).write_text(body)
          subprocess.run(["git","add","--",path],check=True)
          # Only comments/log descriptions arrive in this overlapping writer file.
          original=subprocess.check_output(["git","show",os.environ["GITHUB_SHA"]+":"+path],text=True)
          import re
          def semantic(text):
              text=re.sub(r"(?m)^\s*//[^\n]*\n","",text)
              return text.replace("retired-tier-invert","smaller-side invert")
          assert semantic(body)==semantic(original),"writer runtime source changed during merge"
          retained.append({"path":path,"blob":git("rev-parse",":"+path),"scope":"external comments and diagnostic label retained; comment adjusted to corrected post-COPY publication; executable source otherwise exact candidate"})
          for path in (".github/workflows/identity-storage-proof.yml",".github/workflows/identity-working-set-patch.yml","scripts/patch-identity-working-set.py"):
              assert subprocess.run(["git","cat-file","-e",":"+path],capture_output=True).returncode!=0,path
          (Path(os.environ["EVIDENCE_ROOT"])/"preserved-main.json").write_text(json.dumps(retained,indent=2)+"\n")
          PY
          git diff --check --cached
          git diff --cached --binary > "$evidence_root/reconciled.patch"
          git commit -m "Preserve current main lifecycle, ingestion and FrameNet work in identity candidate"
          test "$(git rev-parse HEAD^1)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^2)" = "$EXTERNAL"
          test -z "$(git status --porcelain --untracked-files=all)"
          git ls-tree -r HEAD > "$evidence_root/source-tree.txt"
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(["git",*args],text=True).strip()
          receipt={"base":os.environ["BASE"],"external":os.environ["EXTERNAL"],
              "operator":os.environ["GITHUB_SHA"],"merged_commit":git("rev-parse","HEAD"),
              "tree":git("rev-parse","HEAD^{tree}"),"parents":git("show","-s","--format=%P","HEAD").split(),
              "status":"qualified identity native/managed source preserved; isolated e8 PostgreSQL run remains separate and pending",
              "preserved_main_paths":19,"qualified_bridge_run":35191804573,"frozen_isolated_source":"e8e99359fc27c4a78a7d56779bc4f495d3bb17ff",
              "excluded":[".github/workflows/identity-storage-proof.yml",".github/workflows/identity-working-set-patch.yml","scripts/patch-identity-working-set.py"]}
          (Path(os.environ["EVIDENCE_ROOT"])/"source.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,indent=2))
          PY
          test "$(git ls-remote origin "refs/heads/$CANDIDATE_REF" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$CANDIDATE_REF"
      - name: Exercise merged lifecycle controls
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-ci-workspace.py 2>&1 | tee "$EVIDENCE_ROOT/workspace-controls.log"
          python3 scripts/validate-pipeline.py 2>&1 | tee "$EVIDENCE_ROOT/pipeline-validation.log"
      - name: Retain reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-identity-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
