name: Interrupt exact opaque Original pilot and retain evidence
on:
  push:
    branches: ['diag/pause-original-corpus-pilot-*']
permissions:
  contents: read
  actions: write
jobs:
  pause:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Normally cancel only the exact running pilot and preserve its retention steps
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, signal, time, urllib.request
          API = "https://api.github.com/repos/SaltyPatron/Laplace"
          RUN, JOB, SHA = 35093743188, 104785934166, "20efd66b071b99a052c04830c1fc9b4eae8f7772"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "laplace-exact-pilot-interruption"}
          def deadline(signum, frame):
              raise TimeoutError("bounded interruption observer deadline")
          signal.signal(signal.SIGALRM, deadline)
          signal.alarm(420)
          def api(path, method="GET"):
              request = urllib.request.Request(API + path, headers=headers, method=method,
                  data=b"{}" if method == "POST" else None)
              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read(2097153)
                  if len(raw) > 2097152:
                      raise ValueError("GitHub metadata exceeds bound")
                  return response.status, json.loads(raw) if raw else None
          _, ref = api("/git/ref/heads/main")
          _, run = api(f"/actions/runs/{RUN}")
          _, listing = api(f"/actions/runs/{RUN}/jobs?filter=latest&per_page=100")
          expected = {"id": RUN, "run_attempt": 1, "head_sha": SHA,
              "head_branch": "verify/chess-corpus-pilot-20260916-20efd66",
              "path": ".github/workflows/chess-corpus-evidence.yml",
              "event": "workflow_dispatch", "status": "in_progress"}
          reason = None
          if ref["object"]["sha"] != SHA or any(run.get(k) != v for k, v in expected.items()):
              reason = "exact source or run state changed"
          jobs = listing.get("jobs", [])
          if listing.get("total_count") != 1 or len(jobs) != 1 or jobs[0].get("id") != JOB:
              reason = "exact job set changed"
          job = jobs[0] if len(jobs) == 1 else {}
          if any(job.get(k) != v for k, v in {"run_id": RUN, "head_sha": SHA, "run_attempt": 1,
                  "status": "in_progress", "name": "Observed corpus — complete fresh admission and replay"}.items()):
              reason = "target job identity changed"
          steps = job.get("steps", [])
          active = [s for s in steps if s.get("status") == "in_progress"]
          if len(active) != 1 or active[0].get("number") != 3 or active[0].get("name") != "Observe or measure the exact source under shared host ownership":
              reason = "pilot left guarded owner step"
          if not all(any(s.get("number") == n and s.get("conclusion") == "success" for s in steps) for n in (1, 2)):
              reason = "pilot setup state changed"
          if any(s.get("status") != "pending" or s.get("started_at") is not None for s in steps if s["number"] > 3):
              reason = "retention already started"
          if reason:
              print("PILOT_INTERRUPT_GUARD " + json.dumps({"cancel_requested": False, "reason": reason}), flush=True)
          else:
              print("PILOT_INTERRUPT_GUARD " + json.dumps({"run": RUN, "job": JOB, "source": SHA,
                  "attempt": 1, "active_step": active[0], "requested_games": 2000,
                  "source_pgn": "/vault/Data/Games/Chess/Lumbras/otb/LumbrasGigaBase_OTB_2025.pgn",
                  "source_sha256": "9eafc83ed9a97f9dcfc82135448d45653d325a742e497e8d08c3085a6a48b0ea",
                  "reason": "Interrupt opaque prolonged attempt to recover partial evidence and host progress.",
                  "scope": "Normal Actions cancellation only; preserve always-run summary and upload. No rate is qualified."}), flush=True)
              code, _ = api(f"/actions/runs/{RUN}/cancel", "POST")
              if code != 202:
                  raise RuntimeError("normal cancellation was not accepted")
              print("PILOT_INTERRUPT_ACCEPTED " + json.dumps({"http_status": code, "requests": 1}), flush=True)
              until = time.monotonic() + 360
              previous = None
              while time.monotonic() < until:
                  _, current = api(f"/actions/runs/{RUN}/jobs?filter=latest&per_page=100")
                  selected = [j for j in current.get("jobs", []) if j.get("id") == JOB]
                  if len(selected) != 1 or selected[0].get("head_sha") != SHA:
                      raise RuntimeError("interrupted job identity changed")
                  state = selected[0]
                  observed = {"status": state.get("status"), "conclusion": state.get("conclusion"),
                      "steps": [{k: s.get(k) for k in ("number", "name", "status", "conclusion")} for s in state.get("steps", [])]}
                  if observed != previous:
                      print("PILOT_INTERRUPT_RETENTION " + json.dumps(observed), flush=True)
                      previous = observed
                  if state.get("status") == "completed" and not any(s.get("status") == "in_progress" for s in state.get("steps", [])):
                      _, artifacts = api(f"/actions/runs/{RUN}/artifacts?per_page=100")
                      print("PILOT_INTERRUPT_ARTIFACTS " + json.dumps([{
                          k: a.get(k) for k in ("id", "name", "size_in_bytes", "digest", "expired")}
                          for a in artifacts.get("artifacts", [])]), flush=True)
                      break
                  time.sleep(5)
              else:
                  print("PILOT_INTERRUPT_RETENTION " + json.dumps({"status": "still_pending_after_observation_bound",
                      "force_cancel_requested": False}), flush=True)
          signal.alarm(0)
          PY
