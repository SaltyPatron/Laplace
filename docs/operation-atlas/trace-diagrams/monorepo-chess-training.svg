71,364.836,995.571,360.836,999.571" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="29"><text x="194.294" y="1046.952" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="186.521" y="1059.53" fill="#888" font-size="10" textLength="401.299">claimed. Complete service training methods reviewed. Strong self-play checks cancellation</text><text x="214.301" y="1072.108" fill="#888" font-size="10" textLength="345.737">between games but does not pass it into its per-move Think calls. Background</text><text x="190.378" y="1084.687" fill="#888" font-size="10" textLength="393.584">noncancellation failures have no backoff in this loop. maxGames &lt;= 0 means unbounded</text><text x="185.112" y="1097.265" fill="#888" font-size="10" textLength="404.116">background training. Existing cached write host is reused even when StartTraining changes</text><text x="174.567" y="1109.843" fill="#888" font-size="10" textLength="425.205">_trainWeight. LearnGameAsync semantics remain nested; game count is incremented only after</text><text x="351.599" y="1122.421" fill="#888" font-size="10" textLength="71.143">that call returns.</text></g><?plantuml-src XLJDRjms4BxhAGRe8JOGQxr_shyMXUlQIO3O2RefUYncoP74B4Mg96LbU-f3z0dx91rINdkTjkXbeIM7m--Fymfk7fGa8sWDxx7LA6Y4RJjw_CvlZ6ojCi7d7reoL--kRTDY61sNxxXMcShdrpLvdmiFsxTNata1SbaGePmMebpDTwlBoNnI5ZIPB76rd8xBrMnAi_buYSNqSa6pOhOeIfIhPR4h9tCg5hFirVy0InUEjkGU5E-aVpUcKeOUbqwmbEDYF15YiIXtYwcSpIOxcY-cOYbdowcuN2pah2nmDyQnNCrfZCLujohc2p6v5BDbiHAK-RqoBJfiO8TYNpdR6NbjjNNmpUtLxVNjxKc5hr7QdZM14hK_FIkfn4w7Msl2FJO4MpIUmQeo2ofeWZjhhAFMWeXauAy__WHFkhnWlWVGrhOUq4ZGXCx4_-LNrqDebUAXCXT47OoCi2eQY7Ra2o8YucpX2SyTrSwWu9_qSczOQ5kF878mQXtK2f8XDzikxrgMS3n2V3k6Vo0jPNFQe0xsEUdlgTnNlzwrFSvp477um-09Q1N8yiHDVAg43qOyHX7qLgfz6ALxRELYucMQ3MCH-npm_FEOcHvf_AWx5ci5bp0sluvIZDm8SsZe9Bk1dsOowaDNIUhRV1jiUmSzbl7VdWuKMdg0xh2n