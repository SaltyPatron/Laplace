,336.985,867.828" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="336.985" y1="908.922" x2="336.985" y2="928.922" style="stroke:#181818;stroke-width:1;"/><polygon points="332.985,918.922,336.985,928.922,340.985,918.922,336.985,922.922" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="336.985" y1="964.016" x2="336.985" y2="984.016" style="stroke:#181818;stroke-width:1;"/><polygon points="332.985,974.016,336.985,984.016,340.985,974.016,336.985,978.016" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="336.985" y1="1019.109" x2="336.985" y2="1039.109" style="stroke:#181818;stroke-width:1;"/><polygon points="332.985,1029.109,336.985,1039.109,340.985,1029.109,336.985,1033.109" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="336.985" y1="1074.203" x2="336.985" y2="1094.203" style="stroke:#181818;stroke-width:1;"/><polygon points="332.985,1084.203,336.985,1094.203,340.985,1084.203,336.985,1088.203" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="33"><rect x="41.902" y="1137.203" width="539.122" height="62.828" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="46.902" y="1156.736" fill="#000" font-size="14" textLength="517.521">SQL source binds generation.forward_program to native pg_laplace_forward_trace.</text><text x="46.902" y="1174.346" fill="#000" font-size="14" textLength="529.122">Prior-frontier is a legacy ABI name for ordered discourse, not prompt semantic seeds.</text><text x="46.902" y="1191.955" fill="#000" font-size="14" textLength="482.474">Native execution, prompt admission and realization internals remain separate.</text></g><g class="footer" data-source-line="38"><text x="118.587" y="1223.412" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="120.53" y="1235.99" fill="#888" font-size="10" textLength="381.865">claimed. Materialized SQL execution precedes the returned event projection; an HTTP</text><text x="128.025" y="1248.568" fill="#888" font-size="10" textLength="366.875">streaming interface does not prove incremental native execution. The outer catalog</text><text x="119.126" y="1261.146" fill="#888" font-size="10" textLength="384.673">ordering distinguishes route/emit/other and does not preserve the full inner event-stage</text><text x="113.86" y="1273.725" fill="#888" font-size="10" textLength="395.205">ordering among ties. Nullable numerical columns are often mapped to zero by the C# row</text><text x="136.077" y="1286.303" fill="#888" font-size="10" textLength="350.771">reader. Source declarations have not been compared to a live installed catalog.</text></g><?plantuml-src hLRBSkCs4BppAr2rXsogTYK-HT4-f1ndNTdAndbuxoeG64ZO9G4606Kxftn4lZ1VaWP9oOvhAxdaOibupFJqT0_q5Njtr9ACe0lsWGyT5xJcmx1Ulg_U6JbORO9V_JIGkNf_RVk1X_NTsFhWUA3hJfC9gnlhxhcJFxMUt97aIdXsz_rLNcsOpEkcBaMnJTjqMzSb5QIAfX8o5LcQPMLHoRBQKbhbLTMagQfKiQcehTiDptcgqkIh_q1uXhA-TgDStmvx_rktV9ptVYKk_R-W5Dk2RwgYhKjLjg9eL5LjPPMJujGMULvdW9JplArAkGM-L1MgAEks5PkiKBKiluYIp5uRMWlhQEsTM0FGJl30ExjVILAdtEccuc23KfLnlctgfX0aLK4o8ygKofhjfihQGkQopP2QfuBdSfirSfDlwgpUV3dtGo3ZjJNhRbxP-JDFaHyr6X6mxTTxCeJbUFIUTvzt0LTNEBBIveGGvTTfePgoY5shXMZAff5vlgsoOfDoBigqsV2gpCggATAotcv5WreQaNFLj4NwFoCKrWHjncd5lu2QfvdSe765ucrUosOhya8MMTCAsPRbjb7RN9KS7IwtKjKfrPM2zDAiQ2WJhSmI_rcRWJlUivQBptjdHoElRMSTUtLpTNDzS_FiX3zmQU-rsJF5Eq_FTj1UFdRX1aXlUK_iZXj_Hqwh9EZG4VlH6gXYiEolF_vaTj4ZKxC-sTql7nWtaZdYdVvzgZFnWRkGN5o_OXP6z6mME0CNXYQUfXkBl4O4-sqazyZkTJXW5SnttHJeChduLkFauE3ay8Pvyh49-19eyF73eLFu791TJa637Nx0DQGwalEqMc3kmkZCxWo-H-ESZe39dw8oAyJeN6oyZubv40TKvMrt9DRZ3DzJB05A2EpzT_uI__J366Y1jmkEY3bh0sxVHDY6xic7ByIF-SKXzc9U2Kk8K_YOVjITPDP9Si1xq3vOC6GLJchqDvOJGSmr7qWx9d56GuR_m9XSl7iGtIW9XtW