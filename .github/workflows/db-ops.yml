name: Database — maintenance

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Cloud host: staging is hart-server; cloud is hart-cloud (must already be running)"
        type: choice
        required: true
        default: staging
        options: [staging, cloud]
      operation:
        description: "database lifecycle operation"
        type: choice
        required: true
        default: status
        options: [status, migrate, repair, reindex, remigrate, recreate]
      database:
        description: "substrate uses the existing database controls; application selects accounts, sessions, keys and billing only"
        type: choice
        required: true
        default: substrate
        options: [substrate, application]

permissions:
  contents: read

jobs:
  db:
    name: DB — ${{ inputs.database }} / ${{ inputs.operation }}
    runs-on: [self-hosted, laplace, '${{ inputs.target }}']
    timeout-minutes: 420
    env:
      LAPLACE_DB_OPERATION: ${{ inputs.operation }}
      LAPLACE_DB_SCOPE: ${{ inputs.database }}
    steps:
      - name: Run ${{ inputs.operation }} against the installed database runtime
        env:
          TARGET_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 0002
          workspace_lock_root="${LAPLACE_WORK_ROOT:-${LAPLACE_WORK:?Runner must declare LAPLACE_WORK}}"
          mkdir -p "$workspace_lock_root"
          exec 9>"$workspace_lock_root/host-resource.lock"
          flock 9
          cd "$GITHUB_WORKSPACE"
          if [[ ! -e .git ]]; then
            [[ -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]] || {
              echo "::error::nonempty workspace has no repository; preserving its files" >&2
              exit 1
            }
            git init --initial-branch=main
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          git diff --quiet
          git diff --cached --quiet
          checkout_auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $checkout_auth" \
            git fetch --no-tags --depth=2 origin "$TARGET_SHA"
          unset checkout_auth CHECKOUT_TOKEN
          git checkout --no-overwrite-ignore --detach "$TARGET_SHA"
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git diff --quiet
          git diff --cached --quiet

          # This is a developer/operator database surface. It operates on the
          # already-installed runtime and does not turn a recreate into a build,
          # deploy, corpus restore, or release-qualification ceremony.
          export LAPLACE_SETUP_USE_CMAKE=false
          export LAPLACE_SETUP_REQUIRE_BUILT_REVISION=false
          export LAPLACE_DB_HEALTH_SCOPE=installed
          source scripts/ci-environment.sh
          host_lock="${LAPLACE_HOST_LOCK:-${LAPLACE_LOCK_ROOT:-$workspace_lock_root}/host-resource.lock}"
          if [[ /proc/self/fd/9 -ef "$host_lock" ]]; then
            exec 8>&9
          else
            source deploy/linux/host-lock.sh
            host_lock_hold exclusive 8 "$host_lock"
          fi

          health() {
            bash scripts/check-database-health.sh "$PGDATABASE"
          }

          reindex_invalid() {
            P(){ psql -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -tAc "$1"; }
            local invalid rc remaining idx def def_recursive
            invalid="$(P "SELECT n.nspname || '.' || c.relname || E'\t' || pg_get_indexdef(i.indexrelid)
                         FROM pg_index i
                         JOIN pg_class c ON c.oid=i.indexrelid
                         JOIN pg_class t ON t.oid=i.indrelid
                         JOIN pg_namespace n ON n.oid=c.relnamespace
                         WHERE n.nspname='laplace' AND NOT i.indisvalid
                         ORDER BY CASE t.relname WHEN 'consensus' THEN 0 WHEN 'entities' THEN 1
                                  WHEN 'physicalities' THEN 2 ELSE 3 END, c.relname")"
            [[ -n "$invalid" ]] || { echo "::notice::no invalid indexes — nothing to do"; return 0; }
            rc=0
            while IFS=$'\t' read -r idx def; do
              [[ -n "$idx" ]] || continue
              def_recursive="${def/ ON ONLY / ON }"
              echo "--- $idx"
              P "DROP INDEX IF EXISTS $idx" || { rc=1; continue; }
              P "$def_recursive" || rc=1
            done <<< "$invalid"
            remaining="$(P "SELECT count(*) FROM pg_index i
                             JOIN pg_class t ON t.oid=i.indrelid
                             JOIN pg_namespace n ON n.oid=t.relnamespace
                             WHERE n.nspname='laplace' AND NOT i.indisvalid")"
            echo "invalid indexes remaining: $remaining"
            [[ "$rc" -eq 0 && "$remaining" == "0" ]]
          }

          case "${LAPLACE_DB_SCOPE:-substrate}" in
            substrate) ;;
            application)
              [[ -n "${LAPLACE_APP_DB:-}" ]] || { echo 'Application maintenance requires the installed LAPLACE_APP_DB declaration.' >&2; exit 2; }
              bash scripts/db-migrations.sh supports app-up app-status app-check app-reset app-nuke
              case "$LAPLACE_DB_OPERATION" in
                status) bash scripts/db-migrations.sh app-status ;;
                migrate|repair) bash scripts/db-migrations.sh app-up ;;
                remigrate)
                  bash scripts/db-migrations.sh app-reset --yes
                  bash scripts/db-migrations.sh app-up
                  ;;
                recreate) bash scripts/db-migrations.sh app-nuke --yes ;;
                *) echo "Unsupported application database operation: $LAPLACE_DB_OPERATION" >&2; exit 2 ;;
              esac
              bash scripts/db-migrations.sh app-check
              exit 0
              ;;
            *) echo 'Choose substrate or application.' >&2; exit 2 ;;
          esac

          case "$LAPLACE_DB_OPERATION" in
            status)
              bash scripts/db-migrations.sh status
              health
              ;;
            migrate)
              bash deploy/linux/site.sh database extensions
              bash scripts/db-migrations.sh up
              health
              ;;
            repair)
              bash deploy/linux/site.sh database extensions
              bash scripts/db-migrations.sh up
              health
              ;;
            reindex)
              reindex_invalid
              health
              ;;
            remigrate)
              bash scripts/db-migrations.sh reset --yes
              bash scripts/db-migrations.sh up
              health
              ;;
            recreate)
              bash scripts/db-migrations.sh nuke --yes
              health
              ;;
            *)
              echo "::error::unknown database lifecycle operation: $LAPLACE_DB_OPERATION" >&2
              exit 2
              ;;
          esac
