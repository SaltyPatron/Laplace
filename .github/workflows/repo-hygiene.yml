          {"path":"scripts/provision-cutechess.py","mode":"100755","sha":"7eb283f2200a5fd418acbfbac2b29b9a523a2736"},
          {"path":"scripts/setup-host.sh","mode":"100755","sha":"aa2832753f0311d3a03578d64999c4bf402be0b5","basis":"a355de4f23385770eb706f5edfacd45f3cba747e","patch":"--- a/scripts/setup-host.sh\n+++ b/scripts/setup-host.sh\n@@ -175 +175 @@\n-        TMPDIR=/build/laplace/work/legacy-scratch TMP=/build/laplace/work/legacy-scratch TEMP=/build/laplace/work/legacy-scratch \\\n+        TMPDIR=/build/laplace/work/scratch TMP=/build/laplace/work/scratch TEMP=/build/laplace/work/scratch \\\n@@ -221 +221 @@\n-        TMPDIR=/build/laplace/work/legacy-scratch TMP=/build/laplace/work/legacy-scratch TEMP=/build/laplace/work/legacy-scratch \\\n+        TMPDIR=/build/laplace/work/scratch TMP=/build/laplace/work/scratch TEMP=/build/laplace/work/scratch \\\n"},
          {"path":"scripts/setup-storage.sh","mode":"100644","sha":"ca4caddaeff2950204a9e6aa82bac87afae72937"},
          {"path":"scripts/test-cmake-release.py","mode":"100644","sha":"14d3d71c2b1b9208aeead248cfc053d7af2e3e08"},
          {"path":"scripts/test-cutechess-release.py","mode":"100755","sha":"361b42cab65e069117c59875f44c7576bb8e68b9"},
