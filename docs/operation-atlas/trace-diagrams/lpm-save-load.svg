17.818,460.172,321.818,456.172" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="504.896" y1="438.172" x2="504.896" y2="456.172" style="stroke:#181818;stroke-width:1;"/><line x1="504.896" y1="456.172" x2="351.818" y2="456.172" style="stroke:#181818;stroke-width:1;"/><polygon points="361.818,452.172,351.818,456.172,361.818,460.172,357.818,456.172" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="339.818" y1="73.609" x2="339.818" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="335.818,83.609,339.818,93.609,343.818,83.609,339.818,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="339.818" y1="468.172" x2="339.818" y2="488.172" style="stroke:#181818;stroke-width:1;"/><polygon points="335.818,478.172,339.818,488.172,343.818,478.172,339.818,482.172" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="legend" data-source-line="22"><rect x="85.458" y="531.172" width="503.397" height="80.438" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="90.458" y="550.705" fill="#000" font-size="14" textLength="417.854">Child-ID arrays and exact-byte text-cache entries are not serialized.</text><text x="90.458" y="568.314" fill="#000" font-size="14" textLength="441.991">Short fwrite/fread aborts the process. Save directly truncates the target;</text><text x="90.458" y="585.924" fill="#000" font-size="14" textLength="446.646">there is no temp-file rename, checksum or explicit fsync in these bodies.</text><text x="90.458" y="603.533" fill="#000" font-size="14" textLength="493.397">Scalar fields use host representation rather than a declared byte-order encoder.</text></g><g class="footer" data-source-line="28"><text x="144.28" y="634.99" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="139.263" y="647.568" fill="#888" font-size="10" textLength="395.786">claimed. Complete save/load bodies reviewed. Reloading search postings does not prove</text><text x="149.554" y="660.146" fill="#888" font-size="10" textLength="375.205">preservation of constituent reconstruction, all counters or portable file representation.</text><text x="217.1" y="672.725" fill="#888" font-size="10" textLength="240.112">No save/load execution was performed for this review.</text></g><?plantuml-src XLJBZXit4BpFLpIGGzR0ZdPNzZva7G93Zc03knl3ElZSG_P8n7B82SdHmwTyHBumNv8YHreBWO6Svi7khgxgQlvAls-D5gVaFJroRrb9_RJuSkKucQrSsRwRA5fz-Z2zlIDX_MuwVJjjbPvnqt0ZKptJRTlCfhFhw-kxUtLp-t3BRqLFszdTkqRTyrrx_o3J--kRMtdGLNmnhkV07JMiNjR13qullFM1Vbb-M2wMoxE8k67jTyQjgMKRvUn4Iyk3JKllqZDtGYjsSIN1j5KooGezUJrO3cHDW_Rfdx_-fiSlJpVK6Xps4gA9AHCcTfg2AEzY2eDAnhig9WwfCYrTh7WhlxsXj1575mU9Rofw_qUF3qIi9T7Ef0tjcZdjWaao8dIyDggKtMOOxyWxcIFnMuaHXmOFzFbZl2JbVT06AWi-FXdRI4YN50K0EJyP2JyIjLT3X-pIRT2nXFIC1fe32lmNeKw-VatfVKnPHGlM9N9XVPGvIgKXEFekmSyhWS9qyUXPlzBCQkMeFmSJ_e_U8WY8bARhNF0goJwHSLhs-VYh61V13_I2OMk-YnuxDUWT435vGBnoFwenPggnz8aEnCgyyIZJL71GAabP24e-mIjZubZqo1umdOanwn2abP37hq_puCQ7dqbpx5-SXhLGhg-ih2LZ-PHyLoqsnkhwyqVY4FWm3aNsh58zDWCDQiLgKyOIm1M1GiwVwp2fLXkWKrjSTDM2hJusbAr7VV1AOfnGjYDfZ48bUo3urQdidH8qEd9UuHq09W83w5rV5ur05bi2nsr4lSIX8woRx7jhb05kF3W5fhaEBD1uZJxHbEAyGQqH2xSDEDb0I9JgCIsmuRmi53WZ8fKnEAobGewCewXXKnn1Pu_d98iuYbUrtYS9rSeF0LTDaAsH7P9yG7_Omr9vGizunzye7MD8AWAwOxJfOSrvvWS1ai7oirBI9yOyAy3ZZvxGmdUz5OmWShx2uEeZCJh1JUYhvF_P454OsAzEWTKabYb1-wrKXN7OZenzI-MwC6auhUEFo-EIsDhHabYFB7EFENA36Hm7SQxUf7hsPmtANjHGC7OSyotL-W0oX0S4DgVMYv9qrF1V?></g></svg>