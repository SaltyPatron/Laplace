name: Observe native dependency ownership after the actual policy refusal
on:
  push:
    branches: ['verify/chess-floor-serving-controls-20260916']
permissions:
  contents: read
jobs:
  observe:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 3
    steps:
      - name: Read fixed dependency metadata without checkout or mutation
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s python3 - <<'PY'
          import datetime, json, os, pathlib, stat, subprocess
          def emit(kind, value):
              print(json.dumps({"kind":kind, **value}, sort_keys=True), flush=True)
          emit("identity", {"uid":os.getuid(),"gid":os.getgid(),"groups":os.getgroups(),
               "utc":datetime.datetime.now(datetime.timezone.utc).isoformat()})
          paths=["/build/external","/build/external/PINS.tsv","/build/external/postgresql",
                 "/build/external/postgresql/.git","/opt/laplace","/opt/laplace/pgsql-18",
                 "/opt/laplace/pgsql-18/bin","/opt/laplace/include","/opt/laplace/lib",
                 "/opt/laplace/share","/opt/laplace/bin","/usr/local/libexec/laplace-managed-deploy"]
          for name in paths:
              try:
                  p=pathlib.Path(name); info=p.lstat()
                  emit("path",{"path":name,"uid":info.st_uid,"gid":info.st_gid,
                      "mode":oct(stat.S_IMODE(info.st_mode)),"symlink":p.is_symlink(),
                      "readable":os.access(p,os.R_OK),"writable":os.access(p,os.W_OK),
                      "traversable":os.access(p,os.X_OK),"device":info.st_dev,"inode":info.st_ino})
              except OSError as exc: emit("path",{"path":name,"errorType":type(exc).__name__,"errno":exc.errno})
          p=pathlib.Path("/build/external/PINS.tsv")
          try:
              if p.stat().st_size > 1048576: raise ValueError("pin metadata read budget exceeded")
              rows=[line.split("\t") for line in p.read_text().splitlines()
                    if line.split("\t",1)[0].removeprefix("external/")=="postgresql"]
              emit("postgresqlPin",{"rows":rows})
          except (OSError,ValueError) as exc: emit("postgresqlPin",{"errorType":type(exc).__name__})
          commands=[
              ("sourceHead",["git","-c","safe.directory=/build/external/postgresql","-C","/build/external/postgresql","rev-parse","HEAD"]),
              ("postgresVersion",["/opt/laplace/pgsql-18/bin/postgres","--version"]),
              ("pgConfigVersion",["/opt/laplace/pgsql-18/bin/pg_config","--version"]),
              ("apiActive",["systemctl","is-active","laplace-api"]),
              ("runningPostgres",["/opt/laplace/pgsql-18/bin/psql","-X","-h","/var/run/postgresql","-U","laplace_admin","-d","postgres","-Atqc","SHOW server_version_num"])
          ]
          for label, argv in commands:
              try:
                  result=subprocess.run(argv,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,text=True,timeout=10)
                  emit(label,{"exitCode":result.returncode,"stdout":result.stdout.strip()[:512],
                      "stderrBytes":len(result.stderr.encode())})
              except (OSError,subprocess.TimeoutExpired) as exc:
                  emit(label,{"errorType":type(exc).__name__})
          PY
