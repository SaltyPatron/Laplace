name: Qualify recovery native operator and restart failure propagation
on:
  push:
    branches: [qualify/native-admission-footprint-20260916]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticate and execute focused existing controls
        run: |
          set -euo pipefail
          export TMPDIR="$GITHUB_WORKSPACE/tmp"
          mkdir -p "$TMPDIR" qualification/scripts
          python3 - <<'PY'
          import ast,base64,hashlib,json,os,pathlib,re,subprocess,urllib.request
          root=pathlib.Path("qualification")
          files={"scripts/check-application-runtime.py":"3a21d103a3d9c09fe38754c8449d2769823d941a",
                 "scripts/test-application-runtime.py":"1f8c75d574cd3ca38dec36c90478a43db7498e24",
                 "scripts/pipeline.sh":"39d81ee6c9015e0a96fd90057ce35b831e557f39",
                 "native-operator.yml":"7abb236299b0baa9b14e4cb8949485bd1bad8709"}
          for path,sha in files.items():
              req=urllib.request.Request("https://api.github.com/repos/SaltyPatron/Laplace/git/blobs/"+sha,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(req,timeout=30) as response:item=json.load(response)
              raw=base64.b64decode(item["content"])
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==sha
              p=root/path;p.write_bytes(raw)
              if p.suffix==".py":ast.parse(raw)
              elif p.suffix==".sh":subprocess.run(["bash","-n",p],check=True)
              print("AUTHENTICATED "+path+" "+sha,flush=True)
          source=(root/"scripts/pipeline.sh").read_text()
          bodies=re.findall(r"<<'PY'\n(.*?)\nPY",source,re.S)
          for body in bodies:ast.parse(body)
          assert len(bodies)==1
          import textwrap,yaml
          document=yaml.safe_load((root/"native-operator.yml").read_text())
          outer=inner=python=0
          for job in document["jobs"].values():
              for step in job.get("steps",[]):
                  run=step.get("run")
                  if run is None:continue
                  outer+=1
                  subprocess.run(["bash","-n"],input=run,text=True,check=True)
                  for name,body in re.findall(r"<<'([A-Z_]+)'[^\n]*\n(.*?)^\1$",run,re.M|re.S):
                      if name=="PY":
                          ast.parse(body);python+=1
                      else:
                          subprocess.run(["bash","-n"],input=body,text=True,check=True);inner+=1
                          for child in re.findall(r"<<'PY'[^\n]*\n(.*?)^PY$",body,re.M|re.S):
                              ast.parse(child);python+=1
          assert (outer,inner,python)==(5,2,11),(outer,inner,python)
          print("NATIVE_OPERATOR_SYNTAX_PASS "+json.dumps({"outerBash":outer,"innerBash":inner,"python":python}),flush=True)
          body=re.search(r"^phase_activate_postgres\(\) \{\n.*?^\}",source,re.M|re.S).group(0)
          for case,expected,restarts in (("current",0,0),("stale",0,1),("still-stale",1,1),("read-error",2,0),("restart-error",7,1)):
              script=body+r'''
          calls=0
          state=stale
          postgresql_restart_required() { return 1; }
          preloaded_native_restart_required() {
            [[ "$CASE" != read-error ]] || return 2
            [[ "$CASE" != current && "$state" != current ]] || return 1
            return 0
          }
          restart_postgres() {
            calls=$((calls+1))
            [[ "$CASE" != restart-error ]] || return 7
            [[ "$CASE" == still-stale ]] || state=current
            return 0
          }
          result=0
          phase_activate_postgres || result=$?
          [[ "$result" == "$EXPECTED" && "$calls" == "$RESTARTS" ]]
          '''
              subprocess.run(["bash","-euo","pipefail","-c",script],check=True,env=dict(os.environ,CASE=case,EXPECTED=str(expected),RESTARTS=str(restarts)))
              print("ACTIVATION_CONTROL_PASS "+case,flush=True)
          PY
      - name: Retain exact qualified source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mapped-native-controls-${{ github.run_id }}
          path: qualification/
          retention-days: 30
          if-no-files-found: error
