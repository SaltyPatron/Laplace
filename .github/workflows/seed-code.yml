name: Data — code ingest
run-name: "Code ingest — ${{ inputs.preset }} → ${{ inputs.database }}"

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "What code corpus to ingest"
        type: choice
        required: true
        default: laplace
        options: [laplace, cpython, postgresql, dotnet-runtime, dotnet-docs, treesitter, stack, tiny-codes, custom-repository, custom-code, custom-tabular, custom-recipe]
      advanced_path_override:
        description: "ADVANCED: override the selected preset path; required for custom-* presets"
        type: string
        required: false
        default: ""
      database:
        description: "Target database"
        type: choice
        options: [laplace]
        default: laplace
      run_idempotency:
        description: "Re-ingest the selected corpus and prove evidence does not double-count"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve code preset
    runs-on: [self-hosted, laplace]
    timeout-minutes: 2
    outputs:
      source: ${{ steps.pick.outputs.source }}
      path: ${{ steps.pick.outputs.path }}
    steps:
      - id: pick
        shell: bash
        env:
          PRESET: ${{ inputs.preset }}
          PATH_INPUT: ${{ inputs.advanced_path_override }}
        run: |
          set -euo pipefail
          root="${LAPLACE_DATA_ROOT:-/vault/Data}"
          source=""
          p=""

          case "$PRESET" in
            laplace)
              source=repo
              p="."
              ;;
            cpython)
              source=repo
              p="$root/code-authority/cpython"
              ;;
            postgresql)
              source=repo
              p="$root/code-authority/postgres"
              ;;
            dotnet-runtime)
              source=repo
              p="$root/code-authority/runtime"
              ;;
            dotnet-docs)
              source=repo
              p="$root/code-authority/docs"
              ;;
            treesitter)
              source=repo
              p="$root/TreeSitter"
              ;;
            stack)
              source=stack
              ;;
            tiny-codes)
              source=tiny-codes
              ;;
            custom-repository)
              source=repo
              ;;
            custom-code)
              source=code
              ;;
            custom-tabular)
              source=tabular
              ;;
            custom-recipe)
              source=recipe
              ;;
            *)
              echo "::error::unknown code preset: $PRESET"
              exit 2
              ;;
          esac

          if [[ -n "$PATH_INPUT" ]]; then
            p="$PATH_INPUT"
          fi

          case "$PRESET" in
            custom-*)
              [[ -n "$p" ]] || {
                echo "::error::$PRESET requires the advanced path override"
                exit 2
              }
              ;;
          esac

          if [[ -n "$p" && "$p" != "." ]]; then
            [[ -e "$p" ]] || {
              echo "::error::resolved code input does not exist: $p"
              exit 1
            }
          fi

          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "path=$p" >> "$GITHUB_OUTPUT"

          {
            echo "## Code ingest selection"
            echo
            echo "- Preset: $PRESET"
            echo "- Source mode: $source"
            echo "- Resolved input: ${p:-registered source default}"
          } >> "$GITHUB_STEP_SUMMARY"

  seed:
    needs: resolve
    uses: ./.github/workflows/seed.yml
    with:
      mode: source
      source: ${{ needs.resolve.outputs.source }}
      path: ${{ needs.resolve.outputs.path }}
      database: ${{ inputs.database }}
      run_gate: false
      run_idempotency: ${{ inputs.run_idempotency }}
