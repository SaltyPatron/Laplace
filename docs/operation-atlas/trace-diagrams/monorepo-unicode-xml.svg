rlimit:10;"/><line x1="169.76" y1="469.984" x2="169.76" y2="807.86" style="stroke:#181818;stroke-width:1;"/><line x1="169.76" y1="807.86" x2="469.189" y2="807.86" style="stroke:#181818;stroke-width:1;"/><line x1="469.189" y1="807.86" x2="469.189" y2="827.86" style="stroke:#181818;stroke-width:1;"/><polygon points="465.189,817.86,469.189,827.86,473.189,817.86,469.189,821.86" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="469.189" y1="437.984" x2="469.189" y2="457.984" style="stroke:#181818;stroke-width:1;"/><polygon points="465.189,447.984,469.189,457.984,473.189,447.984,469.189,451.984" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="469.189" y1="862.954" x2="469.189" y2="882.954" style="stroke:#181818;stroke-width:1;"/><polygon points="465.189,872.954,469.189,882.954,473.189,872.954,469.189,876.954" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="33"><text x="219.953" y="924.335" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="207.727" y="936.913" fill="#888" font-size="10" textLength="410.205">claimed. Complete XML event parser and both archive readers reviewed. The archive reader</text><text x="241.357" y="949.491" fill="#888" font-size="10" textLength="342.944">selects the first entry; despite its name it does not require exactly one entry or</text><text x="256.635" y="962.069" fill="#888" font-size="10" textLength="312.388">validate the entry filename. Parsing avoids a full AST but retains whole</text><text x="216.896" y="974.647" fill="#888" font-size="10" textLength="391.865">compressed/inflated buffers; it is not bounded streaming from disk. The event parser has</text><text x="230.788" y="987.226" fill="#888" font-size="10" textLength="364.082">no nesting stack, root/repertoire completeness check, entity-reference decoding or</text><text x="218.571" y="999.804" fill="#888" font-size="10" textLength="388.516">duplicate-attribute rejection. ValidateUcdXml uses no-op callbacks, so lexical success is</text><text x="226.066" y="1012.382" fill="#888" font-size="10" textLength="373.525">not full UAX42/XML/repertoire conformance. Native snapshot callbacks add property</text><text x="357.797" y="1024.96" fill="#888" font-size="10" textLength="110.063">interpretation separately.</text></g><?plantuml-src ZLNBRjiu5DthAoumYwP0_PBjsAaN0yETO0eqHH6dW-mAYhoAEA58bQISkAj-n7pXVCaSIdAQDflPsUPzdSUzVaL_7BHYA_ajVH2D4P8dRE-qvObqdYV1oqahrPV7senbqz3-pss-FASfhuf2hMUpvNb-Ffik5uj2hjVBOhgQSS5IYOkvd2_cwuNCUR4gvXTvdgyM5xFvAb_FHB7CNlsVlbPBf_XBO5RFco-NvqgKAfyjorcncazbdY_5ifmgNfylUR5cFbyfAHTvMLoezMgnMfUgv4MvAbUhUJuLMRZNjX5Ur5G8UN_dNMlLpXddwRVBxUNkyl9PHAY4SW_Qtb4fJE1dBufBqPfuwMpyA6gclR1XprwNMTJHC5qv2oIDet-__qEVT-z8-AXB8ICoWIkL55RHxTK7uWFRI2WRs6SX8Z3J9Prz4h4YjYeGFoBF74bR6d_JpU-lALPiwUp8uNL6RwzPA7ge7BeABojzu0sL6iMHF7BbIAAy5sQaj6SPdJzkkgIlBRwJTVORUqSfvaWIPCGD-LInr3v4Uf7SHwOIVmcZbOXCnabXg48I-mvL8ux6eKIHk0s8JNZso6P5u1dS6UGfgZbMJls2XzxkN7DCSTfsSGEsm0OJi1e6m90zWg2_STTrTxr3AuPETDRQq3QDyuZlIbvpRBqTW0bjMi-8fH1TaoMUe5kV23Dg-mkhIQHI6quz_yOCn7KJZrGS8mDSd_rG8O3Ehe2nVm0g7Puqsj_hXY8_HWB1sf1D7wEu6xZPkRe6h3VKU2SvX6GFRKFqhOpQsKJ6xjtsPlk2ghwkGsbVQoj0yTEGjUxhF7iwiGCcKxk16U3SxdVltuz2F0A3JNPEV7vjNQ9RnEXrqKA7Hi0IcpwfRo5CwNoD8CEFEfb0iT6rHii-xhqzk7j8b4oD3LU469FMBcoIdl2cSVsG8W5EmG6kYTNcIHMh1cgLi_mwEodPhmk5LYQ-DbcdPEamiS_shlMIHvuFcXywoycAGQP8N8xf8pxZry2rW1OoWB0QefDhs6wm4EIJHea4r6wYm9dA96m1d6E2KetXo2ysjwCiZNvQmivi889ESupffk9VNhFUrI79EcpSO6_5eG6HfF7OIQ9nEXpeiIu-UVzq6K3DiC7EPuVJNgQQ_Q_9lQd8c3vXsExu79p6QH5KjiP0_nk2nAWRmKJeVPz9OFLWbzLaM4KWRCiogPl6qVqmtPOdGYCmrTsnz0uNKeVx7l9FD5KYPE3OGeGK2cl8-pVaeTm4zv9zT0cO76X6M22ebs9GHCSZPCK0wR_ZnoK5QDKs1WwCFFhXrtuHEirFj-gpLBUreJPqH8vSyyEHRoYu9nyFlWB4B47iIFgylLta4-Z-yw0shK0o2Pm5Xq7QO4KJAgGzrIQXLDhjb7RCj8LBcyHrjzo1qrzAP7CS9xlJuEB_0000?></g></svg>