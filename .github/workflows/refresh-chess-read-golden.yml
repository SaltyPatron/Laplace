name: Refresh chess_read golden

on:
  push:
    branches: [fix/post-delivery-contracts]

permissions:
  contents: write

concurrency:
  group: laplace-shared-workspace
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate chess_read pg_regress transcript
    runs-on: [self-hosted, laplace]
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair revision
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --prune --depth=1 origin "$TARGET_SHA"
          git checkout --force "$TARGET_SHA"
      - uses: ./.github/actions/setup-laplace-env
      - name: Regenerate and commit the canonical transcript
        env:
          REPAIR_BRANCH: fix/post-delivery-contracts
        run: |
          set -euo pipefail
          rm -rf build/extension/laplace_substrate/tests/regress_output
          set +e
          ctest --test-dir build --output-on-failure -R '^regress_laplace_substrate$'
          test_rc=$?
          set -e

          actual=build/extension/laplace_substrate/tests/regress_output/results/chess_read.out
          expected=extension/laplace_substrate/tests/expected/chess_read.out
          test -s "$actual"
          cp "$actual" "$expected"

          # This workflow exists only to materialize pg_regress's exact transcript.
          # Remove it in the same generated commit so the repair leaves no CI machinery behind.
          git rm .github/workflows/refresh-chess-read-golden.yml
          git add "$expected"
          git diff --cached --check
          git diff --cached --quiet && {
            echo "No golden change was produced (ctest rc=$test_rc)."
            exit 1
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh chess_read regression golden'
          git push origin "HEAD:$REPAIR_BRANCH"
