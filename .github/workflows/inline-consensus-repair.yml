name: Apply inline consensus fold repair

on:
  push:
    branches: [main]
    paths: [.github/workflows/inline-consensus-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove deferred consensus debt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          writer_path = Path('app/Laplace.Substrate/Crud/Npgsql/ConsensusAccumulatingWriter.cs')
          text = writer_path.read_text()

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          text = text.replace('using System.Runtime.ExceptionServices;\n', '', 1)

          once(
          '''    // Fold pipeline (bulk runs only): the fold of batch N runs in the background
              // so the apply lane starts probing/COPYing batch N+1 immediately — the fold
              // leaves the critical path (it was the serial tail of every batch: 188s on an
              // 11.9M-cell document delta). Ordering is now owned by the per-type lanes
              // above, not by one global chain, so deltas whose types are disjoint overlap;
              // this semaphore is purely RAM backpressure on how many deltas may be alive.
              // Drained at FinalizeSource/CompleteBulkRun/Dispose so ingest completion is
              // still fold completion. A fold failure poisons its lane and surfaces at the
              // next apply call or at the drain — never silently. OUTSIDE a bulk run the
              // fold is awaited inline: online lanes (feedback → immediate fold → next
              // walk) require read-your-writes consensus.
              // One sizing authority for the whole fold. The retired implementation fixed
          ''',
          '''    // Consensus is part of each accepted working set. No source/run-level queue is
              // allowed to turn a slower fold into terminal debt: an apply does not return until
              // its accepted delta and highway-mask deposits are complete. Per-type lanes still
              // parallelize one delta safely; they are execution lanes, not deferred ownership.
              // One sizing authority for the whole fold. The retired implementation fixed
          ''', 'fold pipeline comment')

          once(
          '''    private readonly SemaphoreSlim _foldDepth =
              new(FoldSizing.PipelineDepth, FoldSizing.PipelineDepth);
              private readonly object _foldChainLock = new();
          ''', '', 'deferred fold fields')

          once(
          '''            // A fold that already failed in the background poisons the run
                  // NOW, before any more evidence lands.
                  await ObserveFoldFailureAsync();

          ''', '', 'background fold failure check')

          once(
          '''                // Evidence has committed and its replay journal will suppress this delta
                      // forever. From here the fold is an owed continuation, not cancellable
                      // speculative work; completion/drain owns surfacing any failure.
                      if (_bulkRun) await EnqueueFoldAsync(delta, CancellationToken.None);
                      else await UpsertDeltaAsync(delta, CancellationToken.None);
          ''',
          '''                // Evidence has committed and its replay journal will suppress this delta
                      // forever. The corresponding fold is part of this accepted apply: do not
                      // queue semantic debt for source completion.
                      await UpsertDeltaAsync(delta, CancellationToken.None);
          ''', 'non-atomic fold dispatch')

          once(
          '''    private Task UpsertDeltaAsync(
              Dictionary<(Hash128 S, Hash128 T, Hash128? O), Delta> delta, CancellationToken ct)
              => DispatchDeltaAsync(delta, ct);
          ''',
          '''    private Task UpsertDeltaAsync(
              Dictionary<(Hash128 S, Hash128 T, Hash128? O), Delta> delta, CancellationToken ct)
              {
                  if (_bulkRun)
                      Interlocked.CompareExchange(
                          ref _foldSpanStarted,
                          System.Diagnostics.Stopwatch.GetTimestamp(),
                          comparand: 0);
                  return DispatchDeltaAsync(delta, ct);
              }
          ''', 'inline fold entry')

          start_marker = '''    /// <summary>
              /// Bulk fold: dispatch onto the per-type lanes and return as soon as the
          '''
          end_marker = '''    public async Task<(int Entities, int Physicalities, int Attestations)> FinalizeSourceAsync(
          '''
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('deferred fold queue block markers not found')
          text = text[:start] + text[end:]

          once(
          '''    public async Task<(int Entities, int Physicalities, int Attestations)> FinalizeSourceAsync(
              Hash128 sourceId, CancellationToken ct = default)
              {
                  await DrainFoldsAsync();
                  return await _inner.FinalizeSourceAsync(sourceId, ct);
              }
          ''',
          '''    public Task<(int Entities, int Physicalities, int Attestations)> FinalizeSourceAsync(
              Hash128 sourceId, CancellationToken ct = default)
              => _inner.FinalizeSourceAsync(sourceId, ct);
          ''', 'source finalization')

          complete_start = text.find('''    public Task CompleteBulkRunAsync(CancellationToken ct = default)\n''')
          dispose_start = text.find('''    public async ValueTask DisposeAsync()\n''', complete_start)
          if complete_start < 0 or dispose_start < 0:
              raise SystemExit('bulk completion markers not found')
          complete = '''    public Task CompleteBulkRunAsync(CancellationToken ct = default)
              => CompleteBulkRunAsync(null, ct);

              public async Task CompleteBulkRunAsync(
                  Action<BulkRunCompletionPhase>? onPhase,
                  CancellationToken ct = default)
              {
                  // Every accepted apply already completed its consensus work. Source completion
                  // therefore has no consensus drain phase and cannot hide a fold backlog.
                  LastFoldDrainWallClock = TimeSpan.Zero;
                  LastFoldSpanWallClock = _foldSpanStarted == 0
                      ? TimeSpan.Zero
                      : System.Diagnostics.Stopwatch.GetElapsedTime(_foldSpanStarted);
                  _bulkRun = false;

                  var phaseSw = System.Diagnostics.Stopwatch.StartNew();
                  onPhase?.Invoke(BulkRunCompletionPhase.WriterMaintenance);
                  try
                  {
                      await _inner.CompleteBulkRunAsync(ct);
                  }
                  finally
                  {
                      LastWriterMaintenanceWallClock = phaseSw.Elapsed;
                  }
              }

          '''
          text = text[:complete_start] + complete + text[dispose_start:]

          once(
          '''        try
              {
                  await DrainFoldsAsync();
              }
              catch (Exception ex)
              {
                  _log.LogError(ex, "dispose: queued consensus fold failed");
              }
              _foldDepth.Dispose();
              _foldConnections.Dispose();
          ''',
          '''        _foldConnections.Dispose();
          ''', 'dispose deferred fold queue')

          for forbidden in ('EnqueueFoldAsync(', '_foldDepth', '_foldChainLock', '_outstanding',
                            'SnapshotFolds(', 'ObserveFoldFailureAsync(', 'DrainFoldsAsync('):
              if forbidden in text:
                  raise SystemExit(f'deferred fold authority remains: {forbidden}')

          writer_path.write_text(text)

          tests_path = Path('app/Laplace.Substrate.Tests/Crud/ConsensusAccumulatingWriterTests.cs')
          tests = tests_path.read_text()
          method_start = tests.find('''    [Fact]\n    public async Task BulkRun_PipelinesFolds_AndDrainsAtComplete()\n''')
          method_end = tests.find('''    [Fact]\n    public async Task Accumulation_PersistsProvenanceOnlyEvidence()\n''', method_start)
          if method_start < 0 or method_end < 0:
              raise SystemExit('bulk fold test markers not found')
          replacement = '''    [Fact]
              public async Task BulkRun_FoldsBeforeApplyReturns_AndCompletionHasNoConsensusDebt()
              {
                  var src = H(900); var relType = H(901); var subj = H(910);
                  var o1 = H(920); var o2 = H(921);
                  await EnsureScaffoldAsync(src, relType, subj, o1, o2);

                  await using var accumulator = new ConsensusAccumulatingWriter(
                      new NpgsqlSubstrateWriter(_pg.DataSource), _pg.DataSource);
                  await accumulator.BeginBulkRunAsync();
                  await accumulator.ApplyWorkingSetAsync(
                      Change(src, "bulk-fold-a", Obs(H(930), subj, relType, o1, src, 900_000_000)));
                  Assert.Equal(1L, accumulator.CellsFolded);
                  Assert.NotNull(await ConsensusRowAsync(subj, relType, o1));

                  await accumulator.ApplyWorkingSetAsync(
                      Change(src, "bulk-fold-b", Obs(H(931), subj, relType, o2, src, 900_000_000)));
                  Assert.Equal(2L, accumulator.CellsFolded);
                  Assert.NotNull(await ConsensusRowAsync(subj, relType, o2));

                  var completionPhases = new List<BulkRunCompletionPhase>();
                  await accumulator.CompleteBulkRunAsync(completionPhases.Add);

                  Assert.Equal([BulkRunCompletionPhase.WriterMaintenance], completionPhases);
                  Assert.Equal(TimeSpan.Zero, accumulator.LastFoldDrainWallClock);
                  Assert.True(accumulator.LastWriterMaintenanceWallClock >= TimeSpan.Zero);
                  Assert.True(accumulator.LastFoldSpanWallClock > TimeSpan.Zero);
                  Assert.True(accumulator.ConsensusUpsertBackendWallClock > TimeSpan.Zero);
                  Assert.True(accumulator.HighwayMaskBackendWallClock > TimeSpan.Zero);
                  Assert.True(accumulator.ConsensusUpsertCalls >= 1);
                  Assert.True(accumulator.HighwayMaskCalls >= 1);
                  Assert.True(accumulator.HighwayMaskPairs >= 1);
              }

              [Fact]
              public async Task ConsensusOnlyBulkRun_FoldsBeforeApplyReturns()
              {
                  var src = H(940); var relType = H(941); var subj = H(942); var obj = H(943);
                  await EnsureScaffoldAsync(src, relType, subj, obj);

                  await using var accumulator = new ConsensusAccumulatingWriter(
                      new NpgsqlSubstrateWriter(_pg.DataSource), _pg.DataSource,
                      persistEvidence: false);
                  await accumulator.BeginBulkRunAsync();
                  await accumulator.ApplyWorkingSetAsync(
                      Change(src, "consensus-only-inline",
                          Obs(H(944), subj, relType, obj, src, 900_000_000)));

                  Assert.Equal(1L, accumulator.CellsFolded);
                  Assert.NotNull(await ConsensusRowAsync(subj, relType, obj));
                  await accumulator.CompleteBulkRunAsync();
                  Assert.Equal(TimeSpan.Zero, accumulator.LastFoldDrainWallClock);
              }

          '''
          tests = tests[:method_start] + replacement + tests[method_end:]
          tests_path.write_text(tests)

          cli_path = Path('app/Laplace.Cli/IngestCommands.cs')
          cli = cli_path.read_text()
          old = '(queued folds drained before success)'
          if cli.count(old) != 1:
              raise SystemExit(f'CLI fold message: expected one match, found {cli.count(old)}')
          cli = cli.replace(old, '(consensus completed with accepted working sets)', 1)
          cli_path.write_text(cli)
          PY

          git diff --check
          git diff -- app/Laplace.Substrate/Crud/Npgsql/ConsensusAccumulatingWriter.cs \
                     app/Laplace.Substrate.Tests/Crud/ConsensusAccumulatingWriterTests.cs \
                     app/Laplace.Cli/IngestCommands.cs

      - name: Commit repaired source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Laplace CI repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/inline-consensus-repair.yml
          git add app/Laplace.Substrate/Crud/Npgsql/ConsensusAccumulatingWriter.cs \
                  app/Laplace.Substrate.Tests/Crud/ConsensusAccumulatingWriterTests.cs \
                  app/Laplace.Cli/IngestCommands.cs
          git commit -m "fix: complete consensus with each accepted working set"
          git push origin HEAD:main
