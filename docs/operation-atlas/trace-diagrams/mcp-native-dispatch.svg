="286.112" y="398.277" fill="#000" font-size="12" textLength="214.107">Parse method/path; remove query string</text><polygon points="304.822,430.914,481.51,430.914,493.51,442.914,481.51,454.914,304.822,454.914,292.822,442.914,304.822,430.914" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="304.822" y="447.415" fill="#000" font-size="11" textLength="176.688">/mcp body contains jsonrpc marker?</text><text x="275.705" y="440.497" fill="#000" font-size="11" textLength="17.118">yes</text><text x="493.51" y="440.497" fill="#000" font-size="11" textLength="83.145">REST or op alias</text><rect x="52.675" y="464.914" width="320.141" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="62.675" y="487.371" fill="#000" font-size="12" textLength="300.141">Dispatch notification, initialize, ping, tools/list or tools/call</text><rect x="68.34" y="526.59" width="288.811" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="78.34" y="549.047" fill="#000" font-size="12" textLength="268.811">For tool call, capture handler HTTP body and code</text><rect x="50" y="581.684" width="325.49" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="60" y="604.141" fill="#000" font-size="12" textLength="305.49">Wrap body as text; isError when captured code is not 200</text><rect x="105.031" y="636.777" width="215.428" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="115.031" y="659.234" fill="#000" font-size="12" textLength="195.428">Send outer HTTP 200 for tool results</text><rect x="468.879" y="464.914" width="209.416" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="478.879" y="487.371" fill="#000" font-size="12" textLength="189.416">Map /mcp op aliases to REST route</text><rect x="401.188" y="526.59" width="344.797" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="411.188" y="549.047" fill="#000" font-size="12" textLength="324.797">GET health returns ok; GET surface returns static description</text><rect x="395.49" y="581.684" width="356.193" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="405.49" y="604.141" fill="#000" font-size="12" textLength="336.193">POST routes dispatch ten handlers; unknown route returns 404</text><polygon points="393.166,677.871,405.166,689.871,393.166,701.871,381.166,689.871,393.166,677.871" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="337.138" y="721.871" width="112.057" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="347.138" y="744.328" fill="#000" font-size="12" textLength="92.057">Close connection</text><polygon points="361.366,203.797,424.966,203.797,436.966,215.797,424.966,227.797,361.366,227.797,349.366,215.797,361.366,203.797" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="397.166" y="239.216" fill="#000" font-size="11" textLength="17.118">yes</text><text x="361.366" y="220.298" fill="#000" font-size="11" textLength="63.599">Accept loop?</text><text x="318.177" y="213.38" fill="#000" font-size="11" textLength="31.19">repeat</text><ellipse cx="29" cy="262.797" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="29" cy="262.797" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="393.166" y1="73.609" x2="393.166" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="389.166,83.609,393.166,93.609,397.166,83.609,393.166,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="393.166" y1="128.703" x2="393.166" y2=