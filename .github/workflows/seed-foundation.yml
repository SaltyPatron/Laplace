name: Seed — foundation

on:
  workflow_dispatch:
    inputs:
      source:
        description: "foundation source, or ladder for the ordered foundation campaign"
        type: choice
        required: true
        options: [unicode, iso639, operational, cili, wordnet, verbnet, propbank, framenet, mapnet, wordframenet, semlink, ladder]
      path:
        description: "single-source optional path"
        type: string
        default: ""
      database:
        description: "target database"
        type: choice
        options: [laplace]
        default: laplace
      force:
        description: "ladder only: re-ingest every rung"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  seed:
    if: inputs.source != 'ladder'
    uses: ./.github/workflows/_ingest.yml
    with:
      source: ${{ inputs.source }}
      path: ${{ inputs.path }}
      database: ${{ inputs.database }}
      timeout_minutes: 720

  ladder:
    name: "foundation ladder → ${{ inputs.database }}"
    if: inputs.source == 'ladder'
    runs-on: [self-hosted, laplace]
    timeout-minutes: 480
    concurrency:
      group: laplace-ingest-foundation-${{ inputs.database }}
      cancel-in-progress: false
    env:
      LAPLACE_DATA_ROOT: /vault/Data
      PGDATABASE: ${{ inputs.database }}
      LAPLACE_DBNAME: ${{ inputs.database }}
      LAPLACE_INGEST_CONSOLE: ci
      INGEST_LOGDIR: /build/laplace/work/ingest-logs
    steps:
      - name: Checkout exact revision
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --prune --depth=2 origin "$TARGET_SHA"
          git checkout --force "$TARGET_SHA"

      - uses: ./.github/actions/setup-laplace-env

      - name: Ingest foundation
        run: |
          set -euo pipefail
          mkdir -p "$INGEST_LOGDIR"
          args=()
          [[ "${{ inputs.force }}" != true ]] || args+=(--force)
          bash scripts/ensure-foundation.sh "${args[@]}"
