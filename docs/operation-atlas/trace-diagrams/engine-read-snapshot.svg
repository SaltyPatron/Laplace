:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="853.878" y="883.089" fill="#000" font-size="13" textLength="197.266">No snapshot import in this branch.</text><path d="M72.435,956.945 L72.435,1015.945 L1167.435,1015.945 L1167.435,966.945 L1157.435,956.945 L72.435,956.945" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1157.435,956.945 L1157.435,966.945 L1167.435,966.945 L1157.435,956.945" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="383.381" y="975.44" fill="#000" font-size="13" textLength="464.661">Observed in source: pull, hop, translate, degrees, fills, turn and pgn call db_read.</text><text x="383.381" y="991.792" fill="#000" font-size="13" textLength="381.52">Scope is this primary transaction and pools importing its snapshot.</text><text x="383.381" y="1008.144" fill="#000" font-size="13" textLength="286.889">Persistent replay evidence is a separate question.</text><g class="footer" data-source-line="50"><text x="451.885" y="1109.99" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="457.173" y="1122.568" fill="#888" font-size="10" textLength="375.176">claimed. The pool imports only when first opened. This diagram does not claim every</text><text x="455.481" y="1135.146" fill="#888" font-size="10" textLength="378.56">connection or write path uses the snapshot, nor that a snapshot ID is a durable replay</text><text x="437.974" y="1147.725" fill="#888" font-size="10" textLength="413.574">receipt. Connection failures terminate the command. No database connection was opened for</text><text x="619.754" y="1160.303" fill="#888" font-size="10" textLength="50.015">this review.</text></g><?plantuml-src bLNRRkCs47tdLmos3vi0ZkEBRCSfi83NSRe1KYU83HHzCYXgP16HIIr9nSbRFw9Vs2_fa9Hj1Krl0M99vCpXcSF3uMTOlCWCbS1hkETLoGLUBDHMAhoqHbpkk5HT0Qjliy5e38F-S98cFC_6VHpd_LHm8R84HM-IvZqndKvweppffwFUHEJfO9fo76UzSP8FffECYtwFVVxdrGpoxBHQBnaF4Z4SZ9B-S3mT9ib8N2