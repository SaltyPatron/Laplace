emantic roster. Empty byte string is an</text><text x="47.362" y="934.324" fill="#888" font-size="10" textLength="390.791">index lower bound, not a minted entity. Reaching one type cutoff moves to the next type,</text><text x="42.079" y="946.902" fill="#888" font-size="10" textLength="401.357">preserving independent response planes. No ranked index means complete keyed fallback</text><text x="202.738" y="959.48" fill="#888" font-size="10" textLength="80.039">without this cutoff.</text></g><?plantuml-src fLHDR-Cs4BthLmpGmoP0x5Xsz67xKAHkZ1xQ55Zt7ep8eKL48hKaPSUt_eZzXVqb7KgsuUtkhHTBfiXvRzvxmq_mSj2IZA0L_8vTWu8UwIEGyTgQnsPSUVDzvOF3G8_UYKTXZUSDlN_p0irKmEwtvtcMmwmi5ikdgdoQgopBHQbcYtccb9WLoogJM1IPp4h2-KnMX3ARvUKYusU-N8XqMSpdoQV_HOQ_6XefrHTAedXwokbfDgTbYZE1LPaBLLLvdWgHbYXGfLbPA25JMQLLXbLMCfTi8P6aL4NnOqfchmqniXif-2_Dcy20ZTrF9Qch73btDnCqKobYkIouJP9gGJ8bIfLAbsMUfTL2pXawpsQHtboMwLBcyxn8YppnxzfqwB252iNxtjdUo8rjh8EVji_RpNPxiyFNAErHcpqeR3pTV656s3TXQqrunPPWXyRlo6cL11qQWZ-iuKOw2__y_HMqaTGH_vW0ZXeCBFna41P47wnIFl41NKXMd-bBhnqlsxRZRHLNudETrNpoURTvW73gQ7mZfKW4VQ19syElBxiD_389ZcYTh3QEs4YGsWjx87S2D18ScdUI49tqm3sJ0npEWpVO-Tg6TNAiDIFUlN8ym7RauhaB_i_te3tSdSZV9x3QHRuZ6q_q3XY0sYwSe3enCYSfYjRO8wDKKU5r0hV5VM1rv5MCiH1zQ1_yDpWC5Al7UY8q9-ZG1-YSPhVYaJKSiD4oDflcam7wMZBcYxquCJ9e1NT_HGZDePS4DJe90fk6wR567J5egCbSOM7r9nl6Z5YYgmAF0qlhM3eQzDpJUjYxrKtWIbUdF0K_Q4uVekaPhpV8BZXxz3UCsN8ZMQQnndFNSNzdJcCgm1fU2fQfiI83-0teZitc83eAo7CZX-fnSnpTlYKNTp4ZJcHydCMNrj1zyj__gqrZFR5HeJxdOmWCDOIy7DXOws83Wv-JmSzH2-wb9x_czDekKTQo2idEzaxGnD51qv5vMITg6guMTcKAh_mUOqWjiZt2CqpB3SIucJKO2wxdTPue588wbaXG8Xha5Jc53Oz5GwpTC3oJE5SVN43OlT63wUUWxvcrGuw-nmOkJAOG8y2zEKekey5CbBFj9O_lT692o57WVDN8zK3fZnkwh3BJTrDu-IxiEggMZ9HkWl_0FGMkqt8mA4vJpEGKFXEAEXvZ0qPhpvwtJCkFfXEOE2lnwqFIEVBa3WFIDzU9x-9TFIhYMLzxcVIHIalHJt4HZZkCFNFCuksN77MeRH_6X8qCfZ4US3RpNm00?></g></svg>