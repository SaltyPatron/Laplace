# Universal Dependencies v2 universal syntactic relations: the governed deprel
# vocabulary (https://universaldependencies.org/u/dep/). A treebank's relation
# "nsubj:pass" is the universal "nsubj" with a language-specific subtype; the code is
# the universal relation's stable index (1-based; 0 = not a universal relation).
# Append-only: a code, once assigned, never changes meaning.
[ud]
universal = ["acl", "advcl", "advmod", "amod", "appos", "aux", "case", "cc", "ccomp", "clf",
             "compound", "conj", "cop", "csubj", "dep", "det", "discourse", "dislocated",
             "expl", "fixed", "flat", "goeswith", "iobj", "list", "mark", "nmod", "nsubj",
             "nummod", "obj", "obl", "orphan", "parataxis", "punct", "reparandum", "root",
             "vocative", "xcomp"]
