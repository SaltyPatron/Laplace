name: Qualify final UCI help and transaction refusals
on:
  push:
    branches: ['verify/postgresql-activation-20260916']
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Prepare exact source and permanent evidence
        shell: bash
        run: |
          set -euo pipefail
          work="/build/laplace/work/uci-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence="/build/laplace/recovery/uci-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo install -d -m 0775 -o "$(id -u)" -g "$(id -g)" "$work" "$evidence"
          mkdir -p "$work/tmp" "$work/source"
          echo "QUALIFY_WORK=$work" >> "$GITHUB_ENV"
          echo "QUALIFY_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "TMPDIR=$work/tmp" >> "$GITHUB_ENV"
          echo "TMP=$work/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$work/tmp" >> "$GITHUB_ENV"
          missing=()
          command -v rsync >/dev/null || missing+=(rsync)
          command -v shellcheck >/dev/null || missing+=(shellcheck)
          if (( ${#missing[@]} )); then
            sudo -n timeout 120s apt-get update
            sudo -n timeout 180s apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          command -v flock
          cd "$work/source"
          git init -q
          git remote add origin https://github.com/SaltyPatron/Laplace.git
          timeout 120s git fetch --no-tags --depth=1 origin e1efe584bf7afdccc532d7b690fcbb69bb6b5ac2
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = e1efe584bf7afdccc532d7b690fcbb69bb6b5ac2
          test "$(git rev-parse HEAD^{tree})" = cc6d7177878dcf5e1c2278dfc74886998a42879a
          git rev-parse HEAD HEAD^{tree} > "$evidence/source.txt"
      - name: Execute bounded real file and child protocol controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$QUALIFY_WORK/source"
          python3 -B - <<'PY'
          import ast, json, os, pathlib, subprocess, sys
          evidence=pathlib.Path(os.environ["QUALIFY_EVIDENCE"])
          for name in ("scripts/test-application-publish.py",):
              ast.parse(pathlib.Path(name).read_text(), filename=name)
          (evidence/"ast.txt").write_text("PASS: changed Python test source\n")
          commands=[
              ("uci-only",["python3","-B","scripts/test-application-publish.py","UciOnlyDeploymentTests","-v"]),
              ("bash-syntax",["bash","-n","deploy/linux/deploy.sh"]),
              ("shellcheck",["shellcheck","-S","warning","-x","deploy/linux/deploy.sh"]),
          ]
          results=[]
          for name,argv in commands:
              path=evidence/(name+".log")
              with path.open("w") as log:
                  completed=subprocess.run(["timeout","--kill-after=10s","240s",*argv],stdout=log,stderr=subprocess.STDOUT)
              results.append({"name":name,"argv":argv,"exit_code":completed.returncode})
              print("CONTROL "+name+" exit="+str(completed.returncode),flush=True)
              print(path.read_text(),flush=True)
          (evidence/"results.json").write_text(json.dumps(results,indent=2)+"\n")
          sys.exit(0 if all(item["exit_code"]==0 for item in results) else 1)
          PY
      - name: Verify clean source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${QUALIFY_WORK:-}"
          cd "$QUALIFY_WORK/source"
          git status --porcelain > "$QUALIFY_EVIDENCE/source-status.txt"
          test ! -s "$QUALIFY_EVIDENCE/source-status.txt"
          echo CLEAN_SOURCE_PASS
      - name: Retain hosted qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scoped-uci-publication-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: /build/laplace/recovery/uci-publication-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
