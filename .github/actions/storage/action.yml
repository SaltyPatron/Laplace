name: Qualified environment cleanup
description: Use the private Operations controller through the existing dependency credential.
inputs:
  operation:
    default: clean
  receipt:
    default: ''
  checkout-token:
    required: true
runs:
  using: composite
  steps:
    - name: Check out the qualified Operations controller once per job
      if: env.LAPLACE_STORAGE_READY != '84c50ef7479adcd1b556dbb20a853b75e387eb15'
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: SaltyPatron/Laplace-Operations
        ref: 84c50ef7479adcd1b556dbb20a853b75e387eb15
        path: .ci-dependencies/Laplace-Operations
        token: ${{ inputs.checkout-token }}
        persist-credentials: false
    - shell: bash
      run: echo 'LAPLACE_STORAGE_READY=84c50ef7479adcd1b556dbb20a853b75e387eb15' >> "$GITHUB_ENV"
    - name: Run the common storage owner
      uses: ./.ci-dependencies/Laplace-Operations/storage
      with:
        operation: ${{ inputs.operation }}
        receipt: ${{ inputs.receipt }}
