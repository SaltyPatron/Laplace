name: Qualified environment cleanup
description: Use the private Operations controller through the existing dependency credential.
inputs:
  operation:
    default: clean
  receipt:
    default: ''
  checkout-token:
    required: true
runs:
  using: composite
  steps:
    - name: Check out the qualified Operations controller once per job
      if: env.LAPLACE_STORAGE_READY != 'e08c9e9878f9ebf93e08bc6910f066ee79da24db'
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: SaltyPatron/Laplace-Operations
        ref: e08c9e9878f9ebf93e08bc6910f066ee79da24db
        path: .ci-dependencies/Laplace-Operations
        token: ${{ inputs.checkout-token }}
        persist-credentials: false
    - shell: bash
      run: echo 'LAPLACE_STORAGE_READY=e08c9e9878f9ebf93e08bc6910f066ee79da24db' >> "$GITHUB_ENV"
    - name: Run the common storage owner
      shell: bash
      env:
        STORAGE_OPERATION: ${{ inputs.operation }}
        STORAGE_RECEIPT: ${{ inputs.receipt }}
        GH_TOKEN: ${{ github.token }}
        LAPLACE_HOST_LOCK_WAIT_SECONDS: ${{ env.LAPLACE_HOST_LOCK_WAIT_SECONDS || '120' }}
      run: |
        arguments=("$STORAGE_OPERATION" --finish-job)
        if [[ -n "$STORAGE_RECEIPT" ]]; then arguments+=(--receipt "$STORAGE_RECEIPT"); fi
        bash .ci-dependencies/Laplace-Operations/storage.sh "${arguments[@]}"
