emperature and max plies</text><polygon points="360.836,664.103,372.836,676.103,360.836,688.103,348.836,676.103,360.836,664.103" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="232.104" y="708.103" width="257.463" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="242.104" y="730.56" fill="#000" font-size="12" textLength="237.463">Await LearnGameAsync(edges, adjudicated)</text><rect x="165.082" y="763.196" width="391.508" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="175.082" y="785.653" fill="#000" font-size="12" textLength="371.508">Only afterward update game/win/draw statistics and progress callback</text><rect x="198.741" y="818.29" width="324.189" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="208.741" y="840.747" fill="#000" font-size="12" textLength="304.189">Background loop logs noncancellation failures and retries</text><polygon points="263.001,366.809,458.67,366.809,470.67,378.809,458.67,390.809,263.001,390.809,251.001,378.809,263.001,366.809" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="364.836" y="402.228" fill="#000" font-size="11" textLength="17.118">yes</text><text x="263.001" y="383.31" fill="#000" font-size="11" textLength="195.669">Not canceled and game target remains?</text><text x="226.531" y="376.392" fill="#000" font-size="11" textLength="24.471">done</text><rect x="183.741" y="895.384" width="354.189" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="193.741" y="917.841" fill="#000" font-size="12" textLength="334.189">StopTraining requests cancellation without awaiting completion</text><rect x="168.396" y="950.478" width="384.881" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5"