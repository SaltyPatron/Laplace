"114.583" y="911.675" fill="#000" font-size="14" textLength="524.542">fan caps response selections after reads; it does not bound the initial database work.</text><text x="114.583" y="929.284" fill="#000" font-size="14" textLength="410.136">Database unavailable -> 503; failed trunk physicality query -> 500.</text><text x="114.583" y="946.894" fill="#000" font-size="14" textLength="494.936">Failed nested constituent physicality read is skipped by the local success guard.</text></g><g class="footer" data-source-line="30"><text x="183.979" y="978.351" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="181.183" y="990.929" fill="#888" font-size="10" textLength="391.343">claimed. on_search orchestration reviewed. holds_above, attested, emitted nested detail</text><text x="168.395" y="1003.507" fill="#888" font-size="10" textLength="416.919">and Native path decoding remain deeper boundaries. The linked db_bridge returns NULL from</text><text x="178.686" y="1016.085" fill="#888" font-size="10" textLength="396.338">db_snapshot, so this service does not import the Engine command snapshot. Its separate</text><text x="192.855" y="1028.663" fill="#888" font-size="10" textLength="367.998">statements need not observe one world. Bridge connection/prepare failures exit the</text><text x="357.958" y="1041.241" fill="#888" font-size="10" textLength="37.793">process.</text></g><?plantuml-src RLNDRkCs4BxhAGReeLaWSPp4FqaCjDWcQspG90sQz1nGuiWcB95SahAJdleGVS8-IR-Hv4R6zc90u73c-nlwH_goDPfjmTTqhtob2Zvvk7awjIgPBPygRqO5FN_zV3wTqVIiBCTZVJdBp-SydvoFP-LuKbpDh-QJ_B8e9XSNV5NCzCNPvKHVNivcqydPcPvEzQmycpENHHOtndeLL4svAZQhu1ghRrpb0lsm_BoyMIu75N6jjDiPkw9ILP479vfBrLHfwMnwL3NJixBncOCfisHInVJWT5EfGA11__prDwNGsCqn5Sv653Hi4ochIQN4CO6cinHPXMATuJEaxFefSCc1hBDS-_HE6DmaIloM5kJIciFEHAR0tneJc2xEJzRyHdUtY-ownIE514wLSnjgFCNa0cjAXiE2G05tdPUngW8tYsk_izAqTfMEhoftM-uWqywaDMu3B6JObtL7VlqUJQ4g0tWLgt91AoN8-cFX9_rmxwIebAaFs2gu7LDuH