-width:1;"/><polygon points="292.289,894.235,296.289,904.235,300.289,894.235,296.289,898.235" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><g class="footer" data-source-line="26"><text x="134.593" y="945.616" fill="#888" font-size="10" textLength="385.752">Source-reviewed orchestration. Nested semantics remain open; no runtime acceptance</text><text x="132.386" y="958.194" fill="#888" font-size="10" textLength="390.166">claimed. Factorization compares IDs, not full reference bytes. Simple identical-child runs</text><text x="134.314" y="970.772" fill="#888" font-size="10" textLength="386.309">remain for a separate run-encoding layer. This routine emits repeated block references,</text><text x="132.637" y="983.351" fill="#888" font-size="10" textLength="389.663">not a compressed run field. Recursion, allocator behavior and callback side effects need</text><text x="270.22" y="995.929" fill="#888" font-size="10" textLength="114.497">caller-specific accounting.</text></g><?plantuml-src NLJ1RkCs5BphAnxGGnF0zgxbn4xYGn6aQ-m2HGvrxujdwZ4YGf42IJdrdlOZzWltIpgKwCRjnPP8lddpPeRwbJuTJIDEoGFzmRrb9VDdJkOe7s9G7vJlUXzbeMZ_-R6-NPEgbwlLSgC-tcsMyd5vkrhUgvhh-vNckrflwlMDtjmSz4RKShLkxfNKXvhlrXjUtMrkrxgkugjnFGVkwC3gzINumJLFtlf0l-mUTq-xtSM9s7BZtunx8SqsoiLE8ve7ctRUfMVkXFRiubw2qLKooGfD8z3FxpyeI2-Sf9aVh5UlG5B91_CD1xohOkAGgeSlpYJ3rdmJGeSXaHf212Ls3VaXZIiWchRLMsi0V_M4loQ80th7nlrsJIRIrKdYTKKFU-6WMfhwMN4lgOsaW-yelNbABMP-QQbbg_4Y1I9FEPtT0kAfzP0T0lYG9AQ2THu5E4R9ZB8x77Ab3uq4RAZCYxxy7ZF8fx-L7HgPYYDEkrGQUMTF8nhKWWoHlCQQJEKeDPgkdlrxln41GuAkEuy9ahu_ZML1DBeZGrlYviXuA082Ic0SNHNjizcb56fcHb7KC5gLGvYCObleRlEnHujdC2ZpHnKugNP6i6s4WqE9EW-1rZSJUT0OA_-Kp03067IoV6Gwucmd1cEoo-PvHXfYrWSqR8udT2NRVyLyNyjD66jtGOHQuVxCQ4lAmlGpJJODQIEZb1YYxoNdwDp-NIxg9LpOC9qk0auvF9p-4oDAffDOVCaI0HYPns_9fVFN5MPFGt3duBvtAn6EoVULzZv9gFP-2BZnGOv6tY22Ht2Hjp3UZWKzunch4GdDviIILVAOQ4iE2G4YA14h9NtAn2jb6IlDWdQNDwra5UGHpXbA4-d1sWjsXnEIlg2zwNfx4OVv56aqYbNfFleEKlbJW6nWQmu4tunNY4yI5lHNY_k8UvOCL9VEfFY_CBy