<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:784px;height:666px;background:#FAFCFF;" width="784px" height="666px" viewBox="0 0 784 666" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="784" height="666" fill="#FAFCFF" style="stroke:none;"/><g class="title" data-source-line="8"><text x="246.976" y="34.533" fill="#000" font-size="14" textLength="289.023" font-weight="700">Monorepo — plan-credit debit in each store</text></g><ellipse cx="384.667" cy="63.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="253.598" y="93.609" width="262.139" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="263.598" y="116.066" fill="#000" font-size="12" textLength="242.139">Reject nonpositive units at C# store boundary</text><polygon points="341.573,148.703,427.762,148.703,439.762,160.703,427.762,172.703,341.573,172.703,329.573,160.703,341.573,148.703" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="341.573" y="165.204" fill="#000" font-size="11" textLength="86.19">In-memory store?</text><text x="312.455" y="158.286" fill="#000" font-size="11" textLength="17.118">yes</text><text x="439.762" y="158.286" fill="#000" font-size="11" textLength="59.92">PostgreSQL</text><rect x="136.393" y="182.703" width="112.063" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="146.393" y="205.16" fill="#000" font-size="12" textLength="92.063">Lock shared gate</text><rect x="16" y="237.797" width="352.848" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="260.254" fill="#000" font-size="12" textLength="332.848">Select case-insensitive tenant, active status and current period</text><rect x="47.696" y="307.891" width="289.455" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="57.696" y="330.348" fill="#000" font-size="12" textLength="269.455">Order by configured service credit limit descending</text><rect x="65.377" y="377.984" width="254.094" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="75.377" y="400.441" fill="#000" font-size="12" textLength="234.094">Choose first with sufficient remaining credits</text><rect x="46.688" y="448.078" width="291.471" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="56.688" y="470.535" fill="#000" font-size="12" textLength="271.471">Replace used-credit map; return debit; release lock</text><rect x="474.529" y="182.703" width="204.764" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="484.529" y="205.16" fill="#000" font-size="12" textLength="184.764">Call catalog billing.consume_credit</text><rect x="412.32" y="237.797" width="329.182" height="50.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="422.32" y="260.254" fill="#000" font-size="12" textLength="309.182">SQL selects exact tenant, active status, period_end > now</text><text x="422.32" y="275.348" fill="#000" font-size="12" textLength="206.76">and sufficient remaining service credits</text><rect x="388.848" y="322.984" width="376.127" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="398.848" y="345.441" fill="#000" font-size="12" textLength="356.127">Order by configured credit limit descending; LIMIT 1 FOR UPDATE</text><rect x="412.153" y="393.078" width="329.516" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="422.153" y="415.535" fill="#000" font-size="12" textLength="309.516">UPDATE used_credits and updated_at using selected row</text><rect x="436.165" y="463.172" width="281.492" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="446.165" y="485.629" fill="#000" font-size="12" textLength="261.492">Return plan, remaining and period end, or no row</text><polygon points="384.667,504.266,396.667,516.266,384.667,528.266,372.667,516.266,384.667,504.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="384.667" cy="559.266" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="384.667" cy="559.266" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="384.667" y1="73.609" x2="384.667" y2="93.609" style="stroke:#181818;stroke-width:1;"/><polygon points="380.667,83.609,384.667,93.609,388.667,83.609,384.667,87.609" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="192.424" y1="217.797" x2="192.424" y2="237.797" style="stroke:#181818;stroke-width:1;"/><polygon points="188.424,227.797,192.424,237.797,196.424,227.797,192.424,231.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="192.424" y1="272.891" x2="192.424" y2="307.891" style="stroke:#181818;stroke-width:1;"/><polygon points="188.424,297.891,192.424,307.891,196.424,297.891,192.424,301.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="192.424" y1="342.984" x2="192.424" y2="377.984" style="stroke:#181818;stroke-width:1;"/><polygon points="188.424,367.984,192.424,377.984,196.424,367.984,192.424,371.984" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="192.424" y1="413.078" x2="192.424" y2="448.078" style="stroke:#181818;stroke-width:1;"/><polygon points="188.424,438.078,192.424,448.07