" fill="#000" font-size="12" textLength="350.203">Read tenant entitlements; choose latest nonblank Stripe customer</text><rect x="159.091" y="369.078" width="326.832" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="169.091" y="391.535" fill="#000" font-size="12" textLength="306.832">Request checkout session with quote, price and customer</text><polygon points="235.683,424.172,409.331,424.172,421.331,436.172,409.331,448.172,235.683,448.172,223.683,436.172,235.683,424.172" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="235.683" y="440.673" fill="#000" font-size="11" textLength="173.647">Gateway reports checkout created?</text><text x="206.565" y="433.755" fill="#000" font-size="11" textLength="17.118">yes</text><text x="421.331" y="433.755" fill="#000" font-size="11" textLength="12.235">no</text><rect x="16" y="458.172" width="311.51" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="480.629" fill="#000" font-size="12" textLength="291.51">Update quote with session ID, URL and pending status</text><rect x="347.51" y="458.172" width="251.498" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="357.51" y="480.629" fill="#000" font-size="12" textLength="231.498">Update quote to awaiting_manual_approval</text><polygon points="322.507,499.266,334.507,511.266,322.507,523.266,310.507,511.266,322.507,499.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="254.461" y="543.266" width="136.092" height="35.094" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="264.461" y="565.723" fill="#000" font-size="12" textLength="116.092">Return updated quote</text><ellipse cx="322.507" cy="609.359" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx