name: Observe and preserve the actual authoritative checkout state
on:
  push:
    branches: ['verify/chess-floor-serving-controls-20260916']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: [self-hosted, laplace]
    timeout-minutes: 4
    steps:
      - name: Inventory exact dirty paths and preserve tracked bytes
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_EVIDENCE="/build/laplace/recovery/source-inventory/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$SOURCE_EVIDENCE"
          chmod 0700 "$SOURCE_EVIDENCE"
          echo "SOURCE_EVIDENCE=$SOURCE_EVIDENCE" >> "$GITHUB_ENV"
          timeout --signal=TERM --kill-after=5s 150s python3 -B - <<'PY'
          import hashlib,json,os,pathlib,shutil,stat,subprocess,time
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          out=pathlib.Path(os.environ["SOURCE_EVIDENCE"])
          private=out/"private"
          private.mkdir(mode=0o700)
          def git(*args):
              result=subprocess.run(["git",*args],cwd=root,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30)
              if result.returncode:
                  raise RuntimeError("git command failed: "+args[0]+" rc="+str(result.returncode))
              if len(result.stdout)>8*1024*1024: raise RuntimeError("git metadata budget exceeded")
              return result.stdout
          def tree(revision):
              rows={}
              for entry in git("ls-tree","-r","-z",revision).split(b"\0"):
                  if not entry: continue
                  meta,path=entry.split(b"\t",1)
                  mode,kind,sha=meta.decode().split()
                  rows[os.fsdecode(path)]={"mode":mode,"type":kind,"blob":sha}
              return rows
          initial=git("rev-parse","HEAD").decode().strip()
          git("fetch","--no-tags","origin","main")
          target=git("rev-parse","--verify","FETCH_HEAD^{commit}").decode().strip()
          headtree=tree(initial)
          targettree=tree(target)
          tracked=set(os.fsdecode(x) for x in git("diff","--name-only","-z","HEAD").split(b"\0") if x)
          tracked.update(os.fsdecode(x) for x in git("diff","--cached","--name-only","-z","HEAD").split(b"\0") if x)
          untracked=set(os.fsdecode(x) for x in git("ls-files","--others","--exclude-standard","-z").split(b"\0") if x)
          selected=sorted(tracked|untracked)
          proof={"schema":"laplace.checkout-inventory/v1","observedUtc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),
                 "checkout":str(root),"head":initial,"latestMain":target,"latestTree":git("rev-parse",target+"^{tree}").decode().strip(),
                 "trackedCount":len(tracked),"untrackedCount":len(untracked),"rows":[],"reconciliation":"not_attempted"}
          if len(selected)>256:
              proof["truncated"]=True
              selected=selected[:256]
          total_backup=0
          for name in selected:
              path=root/name
              if pathlib.PurePosixPath(name).is_absolute() or ".." in pathlib.PurePosixPath(name).parts:
                  raise RuntimeError("non-relative Git path")
              row={"path":name,"trackedDirty":name in tracked,"untracked":name in untracked,
                   "headEntry":headtree.get(name),"latestMainEntry":targettree.get(name)}
              try:
                  info=path.lstat()
              except FileNotFoundError:
                  row.update(kind="missing",equalsLatestMain=targettree.get(name) is None)
                  proof["rows"].append(row)
                  continue
              row.update(uid=info.st_uid,gid=info.st_gid,mode=oct(stat.S_IMODE(info.st_mode)),bytes=info.st_size)
              if path.is_symlink():
                  payload=os.fsencode(os.readlink(path))
                  row.update(kind="symlink",gitMode="120000")
              elif stat.S_ISREG(info.st_mode):
                  row.update(kind="file",gitMode="100755" if info.st_mode&0o111 else "100644")
                  if info.st_size>16*1024*1024:
                      row.update(hashUnavailable="file exceeds 16MiB inventory budget",equalsLatestMain=False)
                      proof["rows"].append(row)
                      continue
                  payload=path.read_bytes()
                  if len(payload)!=info.st_size: raise RuntimeError("file changed while inventorying: "+name)
              else:
                  row.update(kind="other",equalsLatestMain=False)
                  proof["rows"].append(row)
                  continue
              row["sha256"]=hashlib.sha256(payload).hexdigest()
              row["gitBlob"]=hashlib.sha1(b"blob "+str(len(payload)).encode()+b"\0"+payload).hexdigest()
              expected=targettree.get(name)
              row["equalsLatestMain"]=bool(expected and expected["blob"]==row["gitBlob"] and expected["mode"]==row["gitMode"])
              if name in tracked:
                  total_backup+=len(payload)
                  if total_backup>64*1024*1024: raise RuntimeError("tracked backup budget exceeded")
                  backup=private/("tracked-"+str(len(proof["rows"]))+".bytes")
                  backup.write_bytes(payload)
                  backup.chmod(0o600)
                  row["preservedBytes"]=str(backup.relative_to(out))
              proof["rows"].append(row)
          proof["sourceStable"]=git("rev-parse","HEAD").decode().strip()==initial
          (out/"inventory.json").write_text(json.dumps(proof,indent=2)+"\n")
          print("CHECKOUT_INVENTORY "+json.dumps(proof),flush=True)
          # Only exact bytes already committed to selected main may be reconciled. A
          # normal checkout (never force/reset/clean/stash) retains Git's collision checks.
          if (proof["sourceStable"] and not proof.get("truncated") and not untracked
                  and all(row.get("equalsLatestMain") for row in proof["rows"])):
              for row in proof["rows"]:
                  path=root/row["path"]
                  if row.get("kind")=="missing":
                      if path.exists() or path.is_symlink(): raise RuntimeError("missing path changed")
                  elif row.get("kind")=="symlink":
                      if hashlib.sha256(os.fsencode(os.readlink(path))).hexdigest()!=row["sha256"]: raise RuntimeError("link changed")
                  elif hashlib.sha256(path.read_bytes()).hexdigest()!=row["sha256"]: raise RuntimeError("source changed")
              git("checkout","--detach",target)
              proof["reconciliation"]="normal_checkout_of_byte_identical_committed_main"
              proof["afterHead"]=git("rev-parse","HEAD").decode().strip()
              proof["afterStatus"]=git("status","--porcelain","--untracked-files=normal").decode(errors="replace")
              (out/"inventory.json").write_text(json.dumps(proof,indent=2)+"\n")
              print("CHECKOUT_RECONCILIATION "+json.dumps({"head":proof["afterHead"],"status":proof["afterStatus"],"method":proof["reconciliation"]}),flush=True)
          else:
              print("CHECKOUT_PRESERVED unique or untracked state requires exact owner diagnosis",flush=True)
          
          PY
      - name: Retain source inventory and preserved bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-source-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SOURCE_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 30
